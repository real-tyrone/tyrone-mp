 tooltip_buildpowerplantsx:0 "#header Строить электростанции #!\n$TOOLTIP_DELIMITER$\nНажмите эту кнопку, чтобы добавить в очередь строительства столько электростанций, сколько необходимо, чтобы покрыть спрос на электроэнергию в инкорпорированных штатах."
 tooltip_buildpowerplantsxx:0 "#header Строить электростанции #!\n$TOOLTIP_DELIMITER$\n#red #italic #bold #gold Производство электроэнергии#! еще не исследовано [GetPlayer.GetName]"
 tooltip_buildpowerplants:0 "[GetPlayer.GetCustom('researchedelectriccustom')]"

 tooltip_buildtransportationx:0 "#header Сократить дефицит транспорта #!\n$TOOLTIP_DELIMITER$\nНажмите эту кнопку, чтобы добавить в очередь строительства столько железных дорог, сколько необходимо, чтобы сократить дефицит транспортных товаров в инкорпорированных штатах."
 tooltip_buildtransportationxx:0 "#header Сократить дефицит транспорта #!\n$TOOLTIP_DELIMITER$\n#red #italic #bold #gold Железные дороги#! еще не исследовано [GetPlayer.GetName]"

l_russian:
 build_railways:0 "Строить железные дороги"
 build_railways_desc:0 "Добавляет достаточное количество железных дорог повсюду, чтобы обеспечить полный доступ к рынку."
 build_railways_tooltip:0 "Нажмите, чтобы построить больше железных дорог"
 build_administrations:0 "Создавайте правительственные администрации"
 build_administrations_desc:0 "Добавляет достаточно государственных администраций повсюду, чтобы обеспечить налоговую способность"
 build_administrations_tooltip:0 "Нажмите, чтобы построить больше государственных администраций"

 tooltip_buildrailwaysx:0 "#header Максимальный доступ к рынку #!\n$TOOLTIP_DELIMITER$\nНажмите эту кнопку, чтобы добавить в очередь строительства столько железных дорог, сколько необходимо, чтобы максимально увеличить доступ к рынку."
 tooltip_buildrailwaysxx:0 "#header Максимальный доступ к рынку #!\n$TOOLTIP_DELIMITER$\n#red #italic #bold #gold Железные дороги#! еще не исследовано [GetPlayer.GetName]"
 tooltip_buildrailways:0 "[GetPlayer.GetCustom('researchedrailwayscustom')]"
 tooltip_govadm:0 "#header Максимизируйте возможность налогообложения #!\n$TOOLTIP_DELIMITER$\nНажмите эту кнопку, чтобы добавить в очередь строительства столько государственных административных зданий, сколько необходимо, чтобы максимизировать возможность налогообложения в инкорпорированных штатах."
 tooltip_reduce_govadm:0 "#header Сократить избыточные правительственные администрации #!\n$TOOLTIP_DELIMITER$\nУбирает только безопасный избыток. Не опускает страну ниже #v +200#! бюрократии, не уменьшает штат, если у него нет как минимум #v запаса налоговой способности на 2 уровня#!, и снимает не более #v 1 уровня#! с каждого штата за одно нажатие."

 build_powerplants:0 "Строить электростанции"

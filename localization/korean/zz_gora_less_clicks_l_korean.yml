l_korean:
 build_railways:0 "철도 건설"
 build_railways_desc:0 "모든 곳에 충분한 철도를 건설하여 시장 접근성을 완벽하게 확보합니다."
 build_railways_tooltip:0 "더 많은 철도를 건설하려면 클릭하십시오."
 build_administrations:0 "정부 행정 청사 건설"
 build_administrations_desc:0 "모든 곳에 충분한 정부 행정 청사를 건설하여 조세 역량을 완벽하게 확보합니다"
 build_administrations_tooltip:0 "더 많은 정부 행정 청사를 건설하려면 클릭하십시오."

 tooltip_buildrailwaysx:0 "#header 시장 접근 최대화 #!\n$TOOLTIP_DELIMITER$\n시장 접근을 최대화하기 위해 건설 대기열에 필요한 만큼 철도를 추가하려면 이 버튼을 클릭하세요."
 tooltip_buildrailwaysxx:0 "#header 시장 접근성 극대화 #!\n$TOOLTIP_DELIMITER$\n#red #italic #bold #gold 철도#! [GetPlayer.GetName]이(가) 아직 조사하지 않았습니다."
 tooltip_buildrailways:0 "[GetPlayer.GetCustom('researchedrailwayscustom')]"
 tooltip_govadm:0 "#header 과세 능력 최대화 #!\n$TOOLTIP_DELIMITER$\n통합된 주에서 과세 능력을 최대화하기 위해 필요한 만큼 정부 관리 건물을 건설 대기열에 추가하려면 이 버튼을 클릭하세요."
 tooltip_reduce_govadm:0 "#header 과잉 정부 행정 청사 축소 #!\n$TOOLTIP_DELIMITER$\n안전한 잉여분만 줄입니다. 국가 관료제를 #v +200#! 아래로 내리지 않으며, 주에 #v 2레벨 이상의 조세 역량 여유#! 가 없으면 축소하지 않고, 클릭 한 번당 주마다 최대 #v 1레벨#! 만 줄입니다."

 build_powerplants:0 "발전소 건설"
 build_powerplants_desc:0 "모든 곳에 충분한 발전소를 건설하여 전력 수요를 완벽하게 충족합니다"
 build_powerplants_tooltip:0 "더 많은 발전소를 건설하려면 클릭하십시오"

 tooltip_buildpowerplantsx:0 "#header 발전소 건설 #!\n$TOOLTIP_DELIMITER$\n편입된 주에서 전력 수요를 충족하기 위해 건설 대기열에 필요한 만큼 발전소를 추가하려면 이 버튼을 클릭하세요."
 tooltip_buildpowerplantsxx:0 "#header 발전소 건설 #!\n$TOOLTIP_DELIMITER$\n#red #italic #bold #gold 전기 생산#! [GetPlayer.GetName]이(가) 아직 조사하지 않았습니다."
 tooltip_buildpowerplants:0 "[GetPlayer.GetCustom('researchedelectriccustom')]"

 tooltip_buildtransportationx:0 "#header 운송 부족 감소 #!\n$TOOLTIP_DELIMITER$\n편입된 주에서 운송 물자 부족을 줄이기 위해 건설 대기열에 필요한 만큼 철도를 추가하려면 이 버튼을 클릭하세요."
 tooltip_buildtransportationxx:0 "#header 운송 부족 감소 #!\n$TOOLTIP_DELIMITER$\n#red #italic #bold #gold 철도#! [GetPlayer.GetName]이(가) 아직 조사하지 않았습니다."
 tooltip_buildtransportation:0 "[GetPlayer.GetCustom('researchedtransportationcustom')]"


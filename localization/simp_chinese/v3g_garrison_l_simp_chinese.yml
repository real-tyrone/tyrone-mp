 dp_v3g_expel_garrison: "驱逐外国驻军"
 dp_v3g_expel_garrison_tooltip: "#header 发起“$dp_v3g_expel_garrison$”[concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_v3g_expel_garrison_desc$"
 dp_v3g_expel_garrison_desc: "要求一个国家放弃在我国境内的驻军权；若其拒绝，这一要求可能升级为战争。"
 v3g_expel_garrison: "撤销驻军权"
 v3g_expel_garrison_desc: "迫使目标国家放弃在我国境内的一切驻军权，其境内军队将因失去军事通行权而开始撤离。"
 war_goal_v3g_expel_garrison_type_name: "撤销驻军权"
 war_goal_v3g_expel_garrison_type_desc: "迫使目标国家放弃在我国境内的一切驻军权，并撤离驻扎军队。"
 war_goal_v3g_expel_garrison: "驱逐[WAR_GOAL_DRAFT.GetTarget.GetName]驻军"
 war_goal_v3g_expel_garrison_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName]要求[WAR_GOAL_DRAFT.GetTarget.GetName]放弃在其境内的一切驻军权并撤走驻军。"
 war_goal_v3g_expel_garrison_sway_desc: "要求[WAR_GOAL_DRAFT.GetTarget.GetName]放弃在[WAR_GOAL_DRAFT.GetHolder.GetName]境内的一切驻军权，以说服[WAR_GOAL_DRAFT.GetHolder.GetName]支持你。"
 v3g_expel_garrison_custom_tooltip: "[TARGET_COUNTRY.GetName]在[ROOT.GetCountry.GetName]的一切驻军权将被撤销"

 dp_v3g_force_garrison: "强制驻军"
 dp_v3g_force_garrison_tooltip: "#header 发起“$dp_v3g_force_garrison$”[concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_v3g_force_garrison_desc$"
 dp_v3g_force_garrison_desc: "要求目标国家允许我国军队进入其领土驻扎；若其拒绝，这一要求可能升级为战争。"
 v3g_force_garrison: "强制驻军权"
 v3g_force_garrison_desc: "迫使目标国家授予我国驻军权，并建立不能由驻在国单方面退出的强制驻军条约。"
 war_goal_v3g_force_garrison_type_name: "强制驻军权"
 war_goal_v3g_force_garrison_type_desc: "迫使目标国家允许我国军队进入其领土任意可达的陆军总部驻扎。"
 war_goal_v3g_force_garrison: "强制在[WAR_GOAL_DRAFT.GetTarget.GetName]驻军"
 war_goal_v3g_force_garrison_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName]要求[WAR_GOAL_DRAFT.GetTarget.GetName]授予其强制驻军权，允许其陆军进入并驻扎。"
 war_goal_v3g_force_garrison_sway_desc: "要求[WAR_GOAL_DRAFT.GetTarget.GetName]向[WAR_GOAL_DRAFT.GetHolder.GetName]授予强制驻军权，以说服[WAR_GOAL_DRAFT.GetHolder.GetName]支持你。"

 v3g_forced_garrison_rights: "强制驻军权"
 v3g_forced_garrison_rights_desc: "由外交要求或战争强制建立的定向驻军权。驻在国不能通过普通条约按钮单方面撤销，只能通过驱逐外国驻军外交博弈解除。"
 v3g_forced_garrison_rights_effects_desc: "•获得驻军权的一方可以在授予方境内调动并驻扎陆军\n•驻在国不能单方面退出此条款\n•驻在国可通过驱逐外国驻军外交博弈要求撤销"
 v3g_forced_garrison_rights_article_short_desc: "强制允许获得方在授予方境内驻军"

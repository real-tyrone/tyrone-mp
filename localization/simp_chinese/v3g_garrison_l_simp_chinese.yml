 v3g_subject_garrison_desc: "确立宗主国在附属国境内的驻军权。宗主国可以将陆军派往附属国任意可达的陆军总部。"
 v3g_subject_garrison_pact_desc: "宗主国可以在附属国境内调动和驻扎陆军。实际驻军会提高宗主国在当地的利益等级。"

 v3g_garrison_rights: "驻军权"
 v3g_garrison_rights_desc: "允许一个国家在另一个国家的领土内调动并驻扎陆军。实际抵达当地陆军总部的驻军会提高驻军国在该战略区域的参与度。"
 v3g_garrison_rights_effects_desc: "•获得驻军权的一方可以在授予方境内调动并驻扎陆军\n•驻军通过原版参与度系统提高驻军国在当地的利益等级"
 v3g_garrison_rights_article_short_desc: "获得驻军权的一方可在授予方境内驻军"
 TREATY_DRAFT_ARTICLE_FLAG_IS_V3G_GARRISON_RIGHTS_EFFECT: "•获得驻军权的一方可在授予方境内驻军"
 TREATY_ARTICLE_FLAG_IS_V3G_GARRISON_RIGHTS_EFFECT: "•获得驻军权的一方可在授予方境内驻军"
 V3G_DUPLICATE_GARRISON_RIGHTS: "双方之间不存在方向相同的驻军权条款"
 V3G_SUBJECT_GARRISON_REQUIRES_SUBJECT: "目标国家必须是我国的附属国"
 V3G_GARRISON_REQUIRES_CENTRALIZED_COUNTRIES: "发起国与目标国都不能是权力分散国家"
 V3G_GARRISON_REQUIRES_INTERNATIONAL_RELATIONS: "需要研究国际关系科技"
 V3G_GARRISON_EXPULSION_COOLDOWN: "该国在过去十年内未曾成功驱逐我国驻军"

 tooltip_reduce_govadm:0 "#header Réduire l'excès d'administrations gouvernementales #!\n$TOOLTIP_DELIMITER$\nNe réduit que l'excédent sûr. Ne fait pas descendre le pays sous #v +200#! de bureaucratie, ne réduit pas un État à moins qu'il n'ait au moins un #v excédent de capacité fiscale de 2 niveaux#! et ne retire au maximum que #v 1 niveau#! par État et par clic."


l_english:
 je_tyr_holy_alliance:0 "The Holy Alliance"
 je_tyr_holy_alliance_reason:0 "In the settlement that followed Napoleon's defeat, the sovereigns of [SCOPE.sCountry('tyr_holy_austria').GetName], [SCOPE.sCountry('tyr_holy_prussia').GetName], and [SCOPE.sCountry('tyr_holy_russia').GetName] pledged themselves to a Christian order of lawful crowns and mutual assistance. Their ministers have made that pledge a bulwark of the Vienna settlement, binding the three courts through [Concept('concept_defensive_pact', '$concept_defensive_pacts$')] against threats to the peace of Europe.\n\nThe courts still invoke the common struggle against France, but the German question divides their counsels. Vienna claims the right to preserve the settlement; Berlin looks to leadership among the German states; Saint Petersburg guards its influence in the affairs of both. The formation of a united Germany will end the founding [Concept('concept_treaty', '$concept_treaties$')] of the Holy Alliance. A court that renounces its obligations beforehand must answer for the breach of faith."
 tyr_holy_alliance_completion_header:0 "Will complete if: \n"
 je_tyr_holy_alliance_conclusion:0 "German unification has overturned the settlement upheld by the three eastern courts. The founding defensive treaties of the Holy Alliance have been dissolved."
 tyr_holy_alliance_withdraw:0 "Withdraw from the Holy Alliance"
 tyr_holy_alliance_withdraw_desc:0 "Renounce our founding [Concept('concept_defensive_pact', '$concept_defensive_pacts$')] with the other members of the Holy Alliance and leave the association, gaining #v 25#! [concept_infamy]. The treaty between the other two courts will remain in force."
 tyr_holy_alliance_has_founding_treaty_tt:0 "Is bound by at least one founding defensive treaty of the Holy Alliance"
 tyr_holy_alliance_member_map_tt:0 "[SCOPE.sCountry('tyr_holy_map_country').GetName] is a member of the Holy Alliance."
 tyr_holy_alliance_subject_map_tt:0 "[SCOPE.sCountry('tyr_holy_map_country').GetName] is a [concept_subject] of [SCOPE.sCountry('tyr_holy_map_overlord').GetName], a member of the Holy Alliance."
 tyr_holy_alliance_brothers_war:0 "Launch the Brothers' War"
 tyr_holy_alliance_brothers_war_desc:0 "Settle the question of German leadership by force. Dissolve our [concept_defensive_pact] with the rival German court and launch a German leadership [concept_diplomatic_play] against it. Our treaties with [SCOPE.sCountry('tyr_holy_russia').GetName] will remain in force. This action adds no [concept_infamy] beyond the normal effects of the diplomatic play."
 tyr_holy_alliance_disbanded_tt:0 "The Holy Alliance is disbanded"
 tyr_holy_alliance_germany_exists_tt:0 "#gold Germany#! exists."
 tyr_holy_brothers_wargoal:0 "Settle German Leadership"
 tyr_holy_brothers_wargoal_desc:0 "Enforce [concept_unification] leadership over the German states. The losing court will cease to be a German unification candidate."
 tyr_holy_brothers_wargoal_sway_desc:0 "Offer [WAR_GOAL_DRAFT.GetHolder.GetName] support for German leadership in exchange for [WAR_GOAL_DRAFT.GetTarget.GetName] joining your side."
 war_goal_tyr_holy_brothers_wargoal:0 "German leadership"
 war_goal_tyr_holy_brothers_wargoal_type_name:0 "Settle German Leadership"
 war_goal_tyr_holy_brothers_wargoal_type_desc:0 "Force [WAR_GOAL_DRAFT.GetTarget.GetName] to accept [WAR_GOAL_DRAFT.GetHolder.GetName] as the leader of Germany."
 war_goal_tyr_holy_brothers_wargoal_desc:0 "[WAR_GOAL_DRAFT.GetHolder.GetName] compels [WAR_GOAL_DRAFT.GetTarget.GetName] to accept the German leadership settlement."
 dp_tyr_holy_brothers_war:0 "Brothers' War"
 dp_tyr_holy_brothers_war_tooltip:0 "#header Start a $dp_tyr_holy_brothers_war$ [concept_diplomatic_play]#!"
 dp_tyr_holy_brothers_war_desc:0 "The rival German courts settle the question of German leadership by war."

 tyr_holy_alliance.1.t: "An Overture from Berlin"
 tyr_holy_alliance.1.d: "The longstanding rivalry between [SCOPE.sCountry('tyr_holy_italian_offer_prussia').GetName] and [SCOPE.sCountry('tyr_holy_brothers_war_target').GetName] for supremacy in Germany has come to arms. An envoy from the [SCOPE.sCountry('tyr_holy_italian_offer_prussia').GetAdjective] court has proposed an alliance against our common adversary, pledging Berlin's support for the surrender of [SCOPE.sCountry('tyr_holy_italian_offer_lmv').GetName] by the House of Habsburg and its passage under our sovereignty. Should our arms prevail, these terms shall be secured in the ensuing peace settlement."
 tyr_holy_alliance.1.a: "Our ambitions are best served by an alliance with [SCOPE.sCountry('tyr_holy_italian_offer_prussia').GetName]."
 tyr_holy_alliance.1.b: "This is a quarrel between the German powers."
 tyr_holy_alliance.1.accept_tt: "Join [SCOPE.sCountry('tyr_holy_italian_offer_prussia').GetName]'s side in the Brothers' War and demand the transfer of [SCOPE.sCountry('tyr_holy_italian_offer_lmv').GetName] as a [concept_subject]."

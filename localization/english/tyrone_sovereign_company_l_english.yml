 tyrone_sc_charters_heading:0 "Indian Commercial Charters"
 je_tyrone_sc_settlement:0 "Institutional Settlement"
 je_tyrone_sc_settlement_reason:0 "The Company’s charter has outgrown the arrangements under which merchants first assumed public power. Its #v shareholders#! claim the right to direct the enterprise they finance; its #v trained services#! argue that governing India demands authority grounded in expertise. The settlement will determine whose judgement carries the greater weight."
 je_tyrone_sc_settlement_status:0 ""
 je_tyrone_sc_civil:0 "Civil Service Reforms"
 je_tyrone_sc_civil_reason:0 "A government conducted through the Company must sustain more than its trading houses. The provinces require trained officers, colleges and public offices capable of carrying a common administration beyond the capital. #v $law_india_company_citizenship$#! gives that service its social foundation."
 je_tyrone_sc_civil_status:0 ""
 je_tyrone_sc_fleet:0 "The Asian Fleet"
 je_tyrone_sc_fleet_reason:0 "Indian trade crosses waters which the Company has long relied on others to secure. An ocean-going fleet would place the protection of those routes in Indian hands, with all the expense and responsibility that independence of action entails."
 je_tyrone_sc_fleet_status:0 ""
 je_tyrone_sc_capitalists:0 "The New Indian Capitalist Class"
 je_tyrone_sc_capitalists_reason:0 "Industrial and commercial houses rooted in India are accumulating interests of their own. Their prosperity can sustain a government beyond the old trading monopoly, but the directors must accept that the charter of rule may pass between enterprises."
 je_tyrone_sc_capitalists_status:0 ""
 je_tyrone_sc_culture:0 "The Civic Charter"
 je_tyrone_sc_culture_reason:0 "The Company’s charter admits every community while distinguishing sharply between those who govern and those who labour. A durable civic settlement must persuade its subjects that this order can maintain public life as well as private fortunes."
 je_tyrone_sc_culture_status:0 ""
 je_tyrone_sc_home_rule:0 "Company Home Rule"
 je_tyrone_sc_home_rule_reason:0 "The Company’s authority now rests upon agreements made within India. Districts brought wholly under its administration can be incorporated into a common public order, while their communities retain the standing attached to their homelands."
 je_tyrone_sc_home_rule_status:0 ""
 je_tyrone_sc_company_council:0 "The Council of Companies"
 je_tyrone_sc_company_council_reason:0 "The charter of government passes between India’s commercial houses. Each brings its own workshops, routes and investments into the direction of public affairs, while new enterprises seek admission to the council."
 je_tyrone_sc_company_council_status:0 ""

 law_india_company_technocracy:0 "Company Technocracy"
 law_india_company_technocracy_desc:0 "The Company entrusts government to its trained administrators and technical specialists, whose authority rests on their command of public affairs."
 law_india_shareholder_voting:0 "Shareholder Franchise"
 law_india_shareholder_voting_desc:0 "Property and wealth determine admission to the electorate, giving the Company’s investors a governing voice in the country they finance."
 tyrone_sc_main_unlocked_tt:0 "Has completed #v $je_tyrone_csr_sovereign_company$#!."
 law_india_company_directorate:0 "Indian Central Directorate"
 law_india_company_directorate_desc:0 "The Company’s charter defines the powers of its directors and provincial officers, binding the collection of revenue to the machinery of government."
 tyrone_sc_directorate_chosen_tt:0 "Has chosen #v $law_india_company_directorate$#! in Civil Service Reforms."
 law_india_company_governors:0 "Chartered Provincial Governors"
 law_india_company_governors_desc:0 "The Company’s charter defines the powers of its directors and provincial officers, binding the collection of revenue to the machinery of government."
 tyrone_sc_governors_chosen_tt:0 "Has chosen #v $law_india_company_governors$#! in Civil Service Reforms."
 law_india_company_citizenship:0 "Chartered Company Citizenship"
 law_india_company_citizenship_desc:0 "The Company recognises subjects of every culture and faith, but reserves its highest privileges for directors and trained specialists. Rank in its service determines access to influence and education."
 tyrone_sc_citizenship_unlocked_tt:0 "Has entered #v $je_tyrone_csr_sovereign_company$#!."
 tyrone_sc_citizenship_refusal_tt:0 "#v $law_india_company_citizenship$#! is required for #v $je_tyrone_sc_civil$#!. It remains available through the Journal Entry or normal enactment."
 law_india_company_free_trade:0 "The Open Company Charter"
 law_india_company_free_trade_desc:0 "The Company opens its markets to international commerce and directs the proceeds of private enterprise towards further investment, surrendering part of its fiscal income in return."
 amendment_tyrone_sc_asian_fleet:0 "The Asian Commercial Fleet"
 amendment_tyrone_sc_civic_charter:0 "The Civic Charter"
 tyrone_sc_back_experts_name:0 "Support the Experts"
 tyrone_sc_back_experts_desc:0 "Appointments and public patronage can give the Company’s trained specialists a stronger voice in the settlement."
 tyrone_sc_back_shareholders_name:0 "Support the Shareholders"
 tyrone_sc_back_shareholders_desc:0 "The investors who finance the Company expect a place in deciding how it will govern."
 tyrone_sc_intervention_ready_tt:0 "Has not sponsored either constitutional model in the last #v year#!."
 tyrone_sc_accept_citizenship_name:0 "Adopt the Company Charter"
 tyrone_sc_accept_citizenship_desc:0 "A common charter would admit every community to the Company’s service while preserving the privileges of its directors and specialists."
 tyrone_sc_found_tata_name:0 "Charter Tata"
 tyrone_sc_found_tata_desc:0 "Steel and textiles have brought a new generation of Indian investors into the factories of Bombay."
 tyrone_sc_found_coal_name:0 "Charter Bengal Coal Company"
 tyrone_sc_found_coal_desc:0 "The coalfields of Bengal offer the fuel on which the Company’s workshops and railways depend."
 tyrone_sc_found_dyeing_name:0 "Charter Bombay Dyeing"
 tyrone_sc_found_dyeing_desc:0 "Bombay’s merchants seek a charter for mills that can carry Indian cloth into distant markets."
 tyrone_sc_found_railway_name:0 "Charter Great Indian Peninsula Railway"
 tyrone_sc_found_railway_desc:0 "A railway charter promises investors a share in the traffic between the ports and the interior."
 tyrone_sc_found_assam_name:0 "Charter Assam Company"
 tyrone_sc_found_assam_desc:0 "Tea estates in Assam seek capital and a secure place in the Company’s trading network."
 tyrone_sc_found_burmah_name:0 "Charter Bombay Burmah Trading Corporation"
 tyrone_sc_found_burmah_desc:0 "Timber merchants propose a concern able to supply the expanding demands of shipping and industry."
 tyrone_sc_found_wadia_name:0 "Charter Wadia Shipbuilders"
 tyrone_sc_found_wadia_desc:0 "Bombay’s shipbuilders seek a charter worthy of their long service to Indian maritime commerce."
 tyrone_sovereign_company.1.a:0 "Adopt the charter."
 tyrone_sovereign_company.1.b:0 "Leave the proposal before the directors."
 tyrone_sovereign_company.1.t:0 "A Charter for the Service"
 tyrone_sovereign_company.1.d:0 "The Company’s officers have drafted a common charter of citizenship. It recognises every community in the country while reserving influence and educational privileges for those who direct and staff its administration."
 tyrone_sovereign_company.1.f:0 "The charter offered a place in the Company’s order. Its schedules were precise about how high each place stood."
 tyrone_sovereign_company.2.a:0 "Let the new charter take effect."
 tyrone_sovereign_company.2.t:0 "The Company’s Own Government"
 tyrone_sovereign_company.2.d:0 "The constitutional settlement has given the Company a new governing order. Its Indian registration now places the enterprise within the country whose revenues and labour sustain it."
 tyrone_sovereign_company.2.f:0 "The seal was familiar. The address beneath it had changed."
 tyrone_sovereign_company.3.a:0 "Place the service under a central directorate."
 tyrone_sovereign_company.3.b:0 "Entrust the provinces to their governors."
 tyrone_sovereign_company.3.t:0 "The Service Reconstituted"
 tyrone_sovereign_company.3.d:0 "The Company’s administration can now sustain a broader division of public responsibilities. The directors must decide whether authority should gather at the centre or rest with chartered provincial governors."
 tyrone_sovereign_company.3.f:0 "The reports agreed that the service had grown. Their recommendations disagreed over who should command it."
 tyrone_sovereign_company.4.a:0 "Keep the routes open."
 tyrone_sovereign_company.4.t:0 "An Asian Commercial Fleet"
 tyrone_sovereign_company.4.d:0 "The Company’s fleet can now protect the routes on which its trade depends. Merchants welcome the additional shipping, while the naval service presents the accounts required to keep it at sea."
 tyrone_sovereign_company.4.f:0 "A convoy cleared the harbour beneath the guns of its escort. Behind it, another set of invoices reached the treasury."
 tyrone_sovereign_company.5.a:0 "Enter the agreement in the charter."
 tyrone_sovereign_company.5.t:0 "The Civic Charter"
 tyrone_sovereign_company.5.d:0 "The Company has secured a broader agreement over public administration. Its hierarchy remains intact, but the directors have accepted obligations to the districts from which their authority and revenue are drawn."
 tyrone_sovereign_company.5.f:0 "The district representatives signed beneath the directors. For once, the copy sent back to the province carried the same terms."
 tyrone_sovereign_company.11.a:0 "Appointments should reward trained service."
 tyrone_sovereign_company.11.b:0 "Experience in commerce deserves its place."
 tyrone_sovereign_company.11.t:0 "The Appointment Rolls"
 tyrone_sovereign_company.11.d:0 "A new register of senior appointments has divided the Company’s directors. Examination advocates want service qualifications to determine advancement; investors insist that commercial experience deserves equal standing."
 tyrone_sovereign_company.11.f:0 "A candidate could balance a district budget and still lack the introductions needed to reach the interview."
 tyrone_sovereign_company.12.a:0 "Reserve places for the specialist services."
 tyrone_sovereign_company.12.b:0 "Let the subscribers choose their representatives."
 tyrone_sovereign_company.12.t:0 "A Seat at the Board"
 tyrone_sovereign_company.12.d:0 "The proposed governing board has fewer seats than claimants. The Company’s specialists seek representation of their own, while the shareholders demand that voting strength follow the capital invested."
 tyrone_sovereign_company.12.f:0 "The chairman read the list twice. Neither reading produced a seat for the men who had prepared it."
 tyrone_sovereign_company.13.a:0 "Give the colleges responsibility for examinations."
 tyrone_sovereign_company.13.b:0 "Place commercial assessors alongside the examiners."
 tyrone_sovereign_company.13.t:0 "The Colleges and the Charter"
 tyrone_sovereign_company.13.d:0 "College authorities want a formal role in examining candidates for public office. Merchants object that the proposed curriculum gives little weight to the skills required to manage an enterprise."
 tyrone_sovereign_company.13.f:0 "The examination paper asked about law, surveying and public accounts. A merchant in the gallery wanted to know where it asked how to meet a payroll."
 tyrone_sovereign_company.14.a:0 "Hear the district officers."
 tyrone_sovereign_company.14.b:0 "Receive the commercial delegation."
 tyrone_sovereign_company.14.t:0 "The Provincial Petition"
 tyrone_sovereign_company.14.d:0 "A provincial delegation has petitioned for a voice in the settlement. Its members disagree over whether trained district officers or the principal commercial houses should represent the province."
 tyrone_sovereign_company.14.f:0 "Both delegations arrived carrying signatures. Only one had paid to print its petition."
 tyrone_sovereign_company.15.a:0 "Give the auditors independent authority."
 tyrone_sovereign_company.15.b:0 "Leave the accounts under the board’s direction."
 tyrone_sovereign_company.15.t:0 "Responsibility for the Accounts"
 tyrone_sovereign_company.15.d:0 "An audit has exposed the difficulty of separating the Company’s public responsibilities from its obligations to investors. Officials propose independent supervision; shareholders argue that those bearing the losses should direct the accounts."
 tyrone_sovereign_company.15.f:0 "The same receipt appeared in the public ledger and the commercial report. Each office insisted the other had entered it first."
 tyrone_sovereign_company.30.a:0 "[SCOPE.sCompany('sc_candidate_1').GetName]"
 tyrone_sovereign_company.30.b:0 "[SCOPE.sCompany('sc_candidate_2').GetName]"
 tyrone_sovereign_company.30.c:0 "[SCOPE.sCompany('sc_candidate_3').GetName]"
 tyrone_sovereign_company.30.d:0 "The Indian companies have assembled to choose which enterprise will hold the charter of government for the coming term. The incumbent stands aside while the other concerns put forward their claims."
 tyrone_sovereign_company.30.e:0 "Adjourn until another company can stand."
 tyrone_sovereign_company.30.t:0 "The Company at the Helm"
 tyrone_sovereign_company.30.f:0 "The chair would pass to another company. The districts would learn whose name appeared on the orders soon enough."
 tyrone_sovereign_company.40.a:0 "The charter belongs here."
 tyrone_sovereign_company.40.t:0 "A Sovereign Company"
 tyrone_sovereign_company.40.d:0 "The Company has established the institutions, fleet and commercial houses needed to govern on its own account. Its new charter opens Indian commerce while preserving the corporate order on which its government rests."
 tyrone_sovereign_company.40.f:0 "The directors had once reported on a distant possession. Their successors now answered for the country from which they governed."

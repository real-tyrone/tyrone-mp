l_english:
 tyrone_company_hierarchy:0 "Company Hierarchy"
 sc_executive_upper:0 "Directors"
 sc_executive_upper_desc:0 "Owners and investors whose capital gives them a privileged voice in the Company’s government. Their fortunes are closely bound to the enterprises through which it rules."
 sc_executive_middle:0 "Specialists"
 sc_executive_middle_desc:0 "Administrators and trained specialists whose knowledge sustains the Company’s government and industry. Their service secures privileges beyond those of ordinary subjects."
 sc_staff_upper:0 "Landholders"
 sc_staff_upper_desc:0 "Landed families retain their estates and social standing under the Company, though property alone no longer admits them to its governing elite."
 sc_staff_middle:0 "Associates"
 sc_staff_middle_desc:0 "Local proprietors, clergy and officers maintain much of everyday public life. The Company recognises their standing while reserving its highest privileges for its own governing services."
 sc_staff_lower:0 "Personnel"
 sc_staff_lower_desc:0 "Clerks, machinists and soldiers carry out the daily work of the Company’s offices, workshops and garrisons. Their place in its service affords recognition without the privileges of its specialists."
 sc_labouring_lower:0 "Labourers"
 sc_labouring_lower_desc:0 "Labourers, peasants and enslaved people sustain the economy through their work. The Company’s social order leaves them little influence over the authorities who govern their lives."
 tyrone_sc_citizenship_binding_tt:0 "Company citizenship cannot be replaced once adopted."
 tyrone_sc_company_slot_tt:0 "Has fewer than #v 4#! companies headquartered in India, including the East India Company’s reserved place before the settlement."

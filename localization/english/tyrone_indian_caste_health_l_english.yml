l_english:
 law_caste_charitable_health_system:0 "Caste-Endowed Hospitals"
 law_caste_charitable_health_system_desc:0 "Hospitals and dispensaries depend upon religious endowments and charitable patrons organized around caste communities. Medical relief is entrusted to established local institutions rather than a unified imperial service."
 law_caste_private_health_insurance:0 "Caste Medical Funds"
 law_caste_private_health_insurance_desc:0 "Medical care is financed through private funds maintained by caste associations, merchants, and occupational communities. Contributions and mutual obligations sustain their hospitals, practitioners, and dispensaries."
 law_caste_public_health_insurance:0 "Caste Sanitary Boards"
 law_caste_public_health_insurance_desc:0 "Public hospitals, dispensaries, and sanitary works are administered through local boards organized around recognized caste communities. The state finances a wider health service while retaining established communal structures in its administration."

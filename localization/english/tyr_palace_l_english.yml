 tyr_palace_exam:0 "Palace Examination Graduates"
 tyr_palace_restored:0 "Restored Palace Offices"
 tyr_palace_neglect:0 "Neglected Palace Maintenance"
 tyr_palace_audit:0 "Imperial Household Review"
 tyr_palace_order:0 "Order in the Imperial Household"
 tyr_palace_rites:0 "Imperial Ancestral Observances"
 tyr_palace_restrained:0 "Reduced Ancestral Observances"
 tyr_palace.1.t:0 "The Imperial Household Accounts"
 tyr_palace.1.d:0 "The household ledgers record disputed appointments and unexplained expenditure. Imperial clerks propose an investigation to reduce waste, while court officials defend generous expenditure as an expression of dynastic dignity. A broader reorganization could improve the administration, but would occupy clerks for longer."
 tyr_palace_accounts_savings:0 "Audited Imperial Expenditure"
 tyr_palace_accounts_savings_desc:0 "An examination of household accounts has exposed wasteful expenditure and established stricter controls over official wages."
 tyr_palace_household_prestige:0 "Generous Imperial Patronage"
 tyr_palace_household_prestige_desc:0 "The court's expenditure sustains the dignity and public standing of the dynasty."
 tyr_palace_household_legitimacy:0 "The Household Honored"
 tyr_palace_household_legitimacy_desc:0 "Imperial generosity has strengthened confidence in the sovereign at court."
 tyr_palace_household_reorganized:0 "Reorganized Imperial Household"
 tyr_palace_household_reorganized_desc:0 "Revised appointments, accounting procedures and lines of responsibility improve the efficiency of imperial administration."
 tyr_palace.1.a:0 "Investigate the disputed accounts."
 tyr_palace.1.b:0 "Honor the household's expenditure."
 tyr_palace.1.c:0 "Reorganize the household offices."
 tyr_palace.2.t:0 "The Imperial Ancestral Rites"
 tyr_palace.2.d:0 "An ancestral observance approaches in Beijing. The court must decide how much of the treasury to devote to the dynasty's ceremonial obligations."
 tyr_palace.2.a:0 "Sponsor elaborate rites."
 tyr_palace.2.b:0 "Conduct modest observances."
 tyr_palace.2.c:0 "Reduce ceremonial spending."
 tyr_palace.3.t:0 "The Accession to the Dragon Throne"
 tyr_palace.3.d:0 "A new sovereign has taken the throne. The officials of the Forbidden City await instructions for the ceremonies that will announce the new reign."
 tyr_palace.3.a:0 "Prepare a magnificent enthronement."
 tyr_palace.3.b:0 "Conduct a restrained accession."
 tyr_palace_ceremony_desc:0 "The imperial court's ceremonies, appointments and household administration shape this temporary arrangement."

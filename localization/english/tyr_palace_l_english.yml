l_english:
 tyr_palace_required_tt:0 "Qing controls Beijing and its Forbidden City, and retains a monarchy."
 tyr_palace_ceremony_ready_tt:0 "No imperial ceremony has been commissioned in the last #v two years#!."
 tyr_palace_exams_ready_tt:0 "No palace examinations have been convened in the last #v three years#!."
 tyr_palace_restoration_ready_tt:0 "No palace restoration has been commissioned in the last #v five years#!."
 tyr_palace_ceremony_button:0 "Hold an Imperial Ceremony"
 tyr_palace_ceremony_button_desc:0 "Commission a ceremony in the Hall of Supreme Harmony. Costs £20,000; requires peace. For one year: +5% Prestige, +5 Legitimacy and −25 Authority. Cooldown: two years."
 tyr_palace_exams_button:0 "Convene the Palace Examinations"
 tyr_palace_exams_button_desc:0 "Requires 100 available Bureaucracy and £15,000. Commit 100 Bureaucracy for one year; Beijing gains +10% Qualifications for three years. Cooldown: three years."
 tyr_palace_restoration_button:0 "Commission Palace Restoration"
 tyr_palace_restoration_button_desc:0 "Requires neglected palace maintenance and £30,000. Remove the neglect penalty; Beijing gains +5% Tax Capacity for five years. Cooldown: five years. Maintenance is reviewed every ten years."
 tyr_palace_ceremony:0 "Imperial Ceremonies"

l_english:
 je_tyr_americas:0 "Reconquista and the Monroe Doctrine"
 je_tyr_americas_reason:0 "Spain seeks to restore its American influence, while the United States opposes European expansion. The governments of Latin America must decide whether to join a foreign sphere, maintain their independence, or support a continental federation under Brazil. Influence opens diplomatic opportunities; only actual ownership, subjects and Power Bloc membership determine control."
 je_tyr_americas_goal:0 "In Phase III, Spain or the USA must control at least #v 75%#! of each of the #v 12 areas outside Brazil#!. Independent Brazil instead requires the #v 9 other South American areas#!, excluding Mexico, Cuba and Central America. The Brazil area is never required for victory."
 tyr_am_status_potential:0 "Across the Atlantic, old ambitions slumber. Empires fade, nations rise, yet the echoes of conquest never truly die."
 tyr_am_status_1:0 "#bold #O Phase I — Diplomacy of the Americas#!\n\nBefore empires march, their shadows must first fall upon the continent. Through the regional map, gold, diplomacy, and paid assistance shall purchase what armies have yet to claim.\n\nSpain may invite nations whose influence has fallen to #O 25 or below#!; the United States may do so upon reaching #O 75 or above#!.\n\nOnce fewer than #O 6 areas#! remain contested, and transition safeguards are satisfied, the age of quiet ambition shall end.#!"

tyr_am_status_2:0 "#bold #O Phase II — Contestation#!\n\nThe masks of diplomacy begin to fall. Neither gifts nor promises shall settle the destiny of the Americas any longer.\n\nSpecial peaceful actions and influence bars close, leaving protectorates and territorial ambitions to be pursued through ordinary diplomatic plays. Brazil may yet raise a banner independent of both rival spheres.\n\nWhen #O 1 or fewer areas#! remain contested, the final act shall begin."

tyr_am_status_3:0 "#bold #O Phase III — Continental Confrontation#!\n\nThe New World has become the chessboard of empires, and its final moves shall be written in blood and treaties.\n\nRival claims must be decided through actual wars and their peace terms; foreign enclaves may be settled without elevating their owners to principal rivals.\n\nLet Spain or the United States control all #O 12 areas except Brazil#!, or let independent Brazil control all #O 9 South American areas outside Brazil#!."
tyr_am_completion_tt:0 "A Spanish or American victory grants its national reward and penalises the defeated rival. An independent Brazilian federation receives the permanent capstone and penalises both rivals. All temporary restrictions are removed."
 tyr_am_rules_tt:0 "The #bold Reconquista#! stirs from its centuries-long slumber, while the #bold Monroe Doctrine#! rises to challenge the ambitions of the Old World. Two destinies awaken, yet only history shall judge their fate."
 tyr_am_phase_change_tt:0 "The age of quiet diplomacy has come to an end. Across the Americas, promises and gold can no longer secure what ambition demands.\n\nThe struggle now enters #bold #O Phase II — Contestation#!. The great powers must pursue their ambitions through #O territorial expansion and protectorates#!, relying upon diplomatic pressure and the threat of war rather than peaceful persuasion.\n\nAs the old order fades, so too do its privileges. The benefits of the previous phase give way to those of the new.\n\nShould the remaining disputes be settled, the continent shall approach #bold #O Phase III — Continental Confrontation#!, where rival empires must resolve their final claims through war.\n\n$tyr_am_phase2_protectorates_tt$"
 tyr_am_brazil_route_tt:0 "The destiny of South America need not be dictated by the ambitions of foreign empires. From #bold #O Phase II#!#! onward, #O Brazil#! may forge a sphere of its own, inviting its neighbours to pursue the dream of a united continent.\n\nYet unity cannot be proclaimed by ambition alone. Each nation must #O willingly consent#! to the call of federation, for a union built without agreement is but another empire in disguise.\n\nTo proclaim the #bold #O South American Federation#!, Brazil must establish sovereignty over at least #V 75%#! of each of the #O 9 South American areas outside Brazil#!. The #O Brazil#! area itself, together with #O Mexico, Central America, and Cuba#!, is not required for this objective.\n\nBut those who seek shelter beneath another great power's banner must surrender a measure of their freedom. Should Brazil join either principal Power Bloc, it shall be #R unable to initiate new Diplomatic Plays#! until the continental contest has reached its conclusion."
 tyr_am_settlement_preserved_tt:0 "Existing borders, subjects and Power Bloc memberships remain in force. No federation invitations are sent."
 tyr_am_brazil_play_blocked_tt:0 "Brazil cannot start offensive South American Diplomatic Plays during Phase I. After joining a principal sphere, it cannot start any new Diplomatic Play until the competition ends. Defence remains available."
 tyr_am_policy_button:0 "Choose Our American Policy"
 tyr_am_policy_button_desc:0 "As an outside observer, select a patron for financial assistance. You do not become a claimant. Your actual payments may support that patron's regional influence."
 tyr_am_federation_button:0 "Convene a Federal Congress"
 tyr_am_federation_button_desc:0 "Invite one random eligible AI country in Brazil’s Power Bloc, with its capital in South America, to integration under Brazil. Independent Brazilian bloc leader required. Cooldown: #v 1 year#!. AI subjects with #v less than 50%#! Liberty Desire cannot refuse."
 tyr_am_proclaim_button:0 "Proclaim the Continental Federation"
 tyr_am_proclaim_button_desc:0 "Requires an independent Brazilian bloc leader and Brazilian sovereignty over at least 75% of each of the 9 South American areas outside Brazil. The independent Brazilian victory resolves in Phase III."
 tyr_am_open_map:0 "Open the Continental Map"
 tyr_am_summary:0 "Phase [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_phase')|0]\n\nContested: [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_contested')|0] / 13\nSpain: [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_spa')|0]\nUnited States: [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_usa')|0]\nBrazil: [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_bra')|0]"
 tyr_am_mini_help:0 "75% control decides each area.\nThe map updates monthly.\nOpen it to select countries and actions."
 tyr_am_topline:0 "Phase [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_phase')|0]   |   Contested [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_contested')|0]/13   |   Spain [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_spa')|0]   USA [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_usa')|0]   Brazil [GetPlayer.MakeScope.ScriptValue('tyr_am_ui_bra')|0]"
 tyr_am_area_header:0 "Select an area — influence: Spain 0 / USA 100"
 tyr_am_selected:0 "[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('tyr_am_ui_has_target'), '(CFixedPoint)0'), 'tyr_am_target_name', 'tyr_am_no_target')]"

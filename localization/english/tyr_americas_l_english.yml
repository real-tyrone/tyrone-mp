 tyr_am_phase2_protectorates_tt:0 "At the start of #v Phase II#!, AI members of the Spanish and American [concept_power_bloc] with their capital in one of the #v 13 areas#! become [concept_protectorate] subjects of their bloc leader. #v Player countries are exempt#!. Applies once, including existing subjects."
 tyr_americas.60.t:0 "Across the Pampas"
 tyr_americas.60.d:0 "With Spain and the United States competing for influence in the Americas, [ROOT.GetCountry.GetName] faces a question closer to home: whether to extend its administration over the decentralized territories of the Argentine frontier."
 tyr_americas.60.f:0 "Beyond the last customs post, the lines on the surveyor’s map describe ambitions rather than the reach of the government. Indigenous communities continue to govern lands that the republic claims as its own."
 tyr_americas.60.a:0 "Establish our administration across the frontier."
 tyr_americas.60.b:0 "Leave the frontier unchanged."
 tyr_americas.61.t:0 "The Southern Frontier"
 tyr_americas.61.d:0 "The struggle for the Americas has strengthened calls in [ROOT.GetCountry.GetName] to extend national administration into the decentralized territories of Araucanía and the Chilean frontier."
 tyr_americas.61.f:0 "Officials speak of a continuous republic. South of the established settlements, communities whose authority predates that republic see a different frontier."
 tyr_americas.61.a:0 "Extend the republic’s administration southward."
 tyr_americas.61.b:0 "Leave the frontier unchanged."
 tyr_americas.62.t:0 "Beyond the Paraguay River"
 tyr_americas.62.d:0 "As foreign powers compete for regional influence, [ROOT.GetCountry.GetName] can extend its administration over the decentralized territories of Alto Paraguay and the Paraguayan frontier."
 tyr_americas.62.f:0 "From the riverbank, the western country appears vast. The people who live there know its paths and boundaries better than any map in the capital."
 tyr_americas.62.a:0 "Establish our administration beyond the river."
 tyr_americas.62.b:0 "Leave the frontier unchanged."

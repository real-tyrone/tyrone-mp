 tyr_am_standing_running_tt:0 "#green Active#! · [GetPlayer.MakeScope.Var('tyr_am_monthly_aid_recipient').GetCountry.GetName]\n£[GetPlayer.MakeScope.ScriptValue('tyr_am_ui_standing_amount')|0] / month\nPaid: £[GetPlayer.MakeScope.ScriptValue('tyr_am_ui_standing_paid')|0]\nClick to stop. Stopping costs nothing and applies no new cooldown."
 tyr_am_standing_new_tt:0 "£[GetPlayer.MakeScope.ScriptValue('tyr_am_aid_display')|0] / month\nAuthorises a new programme; no immediate transfer. Starting requires no active shared cooldown. Scheduled payments apply no new action cooldown. Only paid money contributes to influence. Payments continue even without sufficient gold reserves or while in default. Stops automatically if the recipient becomes unavailable, war begins or Phase I ends."

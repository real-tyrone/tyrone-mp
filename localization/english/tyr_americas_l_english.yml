 tyr_americas.1.t:0 "The Contest for the #o Americas#! @inf!"
 tyr_americas.1.d:0 "Across the vast Atlantic, the ambitions of the Old World meet the dreams of the New. The fate of the Americas remains unwritten, and history awaits those bold enough to seize its pen."
 tyr_americas.1.f:0 "Across the Atlantic, #Y old empires#! cast their shadows upon rising nations. The ashes of conquest stir once more, and the fate of the #Y New World#! hangs in the balance."
 tyr_americas.1.a:0 "The #o New World#! shall know no peace."
 tyr_americas.2.t:0 "The Age of Contestation"

 tyr_americas.2.d:0 "The delicate balance of the Americas has begun to unravel. Where once gold and promises shaped the destiny of nations, the shadow of conquest now stretches across the continent.\n\nThe #O Age of Diplomacy#! has drawn to its close. The struggle for the New World enters #bold #O Phase II — Contestation#!, where protectorates and territorial ambitions shall be pursued through diplomatic plays rather than peaceful influence.\n\nThe fate of the remaining contested lands may be examined in the #bold Journal#!."

 tyr_americas.2.f:0 "The ink of treaties has scarcely dried, yet already the distant thunder of cannon echoes across the Atlantic. The age of persuasion fades, and the age of ambition begins."

 tyr_americas.2.a:0 "Let diplomacy yield to ambition."
 tyr_americas.3.t:0 "The Rise of a Third Power"
 tyr_americas.3.d:0 "For too long, the destiny of the Americas has been contested between the ambitions of distant crowns and the proclamations of northern republics. Yet from the heart of the continent, a third power now rises.\n\nWith the formation of its own #bold #O Power Bloc#!, #O Brazil#! has emerged as an independent force in the continental struggle, seeking to unite the nations of South America beneath a common cause.\n\nThrough diplomacy and the promise of a #bold #O Continental Federation#!, Brazil may now invite its southern neighbours to forge a union capable of challenging both the #O Spanish Reconquista#! and the #O Monroe Doctrine#!.\n\nWhether this new order shall herald an age of unity or merely awaken another imperial ambition remains for history to decide."
 tyr_americas.3.f:0 "From the Amazon to the distant shores of the Plata, a new ambition takes root. The continent, long divided between the shadows of foreign powers, may yet discover a destiny of its own."
 tyr_americas.3.a:0 "Let the South speak with its own voice."
 tyr_americas.10.t:0 "An Invitation Across the Atlantic"
 tyr_americas.10.d:0 "[SCOPE.sCountry('tyr_am_patron').GetName] offers our country a place in its Power Bloc. Membership would bring our territory into its sphere, but would not transfer our sovereignty."
 tyr_americas.10.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.10.a:0 "Accept the invitation."
 tyr_americas.10.b:0 "Maintain our independence."
 tyr_americas.11.t:0 "Terms of Cooperation"
 tyr_americas.11.d:0 "[SCOPE.sCountry('tyr_am_patron').GetName] proposes a formal agreement. We may grant investment rights or conclude a defensive pact, accepting the obligations of the resulting treaty."
 tyr_americas.11.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.11.a:0 "Grant investment rights."
 tyr_americas.11.b:0 "Conclude a defensive pact."
 tyr_americas.11.c:0 "Decline these terms."
 tyr_americas.12.t:0 "Our Interests in Latin America"
 tyr_americas.12.d:0 "Our government can support either principal sphere without becoming a claimant. Financial assistance paid through the regional panel or the immediate-transfer treaty will strengthen the selected patron's influence."
 tyr_americas.12.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.12.a:0 "Support the Spanish sphere."
 tyr_americas.12.b:0 "Support the American sphere."
 tyr_americas.12.c:0 "#gold #b The Colossus of the South shall awaken!#!#!."
 tyr_am_brazil_policy_war_lock_tt:0 "#r Brazil will be unable to initiate Diplomatic Plays against countries with territory in South America until this Journal Entry ends.#!"
 tyr_am_brazil_colossus_unlock_tt:0 "#g Unlocks The Colossus of the South Journal Entry for Brazil. Its activation grants powerful national modifiers.#!\nRequires Great Power rank and leadership of a Power Bloc. (#red WARNING: entry can be locked by gamerules, default settings have the entry#!)"
 tyr_americas.20.t:0 "A Continental Ascendancy"
 tyr_americas.20.d:0 "Our sphere has secured at least three quarters of every contested area. The rivalry has ended, and its temporary restrictions have been lifted. Brazil's contribution may now be recognised with support for a voluntary continental settlement."
 tyr_americas.20.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.20.a:0 "Reward Brazil and sponsor integration."
 tyr_americas.20.b:0 "Preserve the existing settlement."
 tyr_americas.21.t:0 "The Continental Reversal"
 tyr_americas.21.d:0 "A rival has prevailed in the struggle for Latin America. Our diplomatic standing has suffered, and the temporary machinery of the competition has been dissolved."
 tyr_americas.21.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.21.a:0 "Reassess our position."
 tyr_americas.22.t:0 "The South American Federation"
 tyr_americas.22.d:0 "Brazil has brought the ten South American areas under its own sovereignty and proclaimed a continental federation. Spain and the United States must now recognise a South American power beyond their control."
 tyr_americas.22.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.22.a:0 "Let the continent speak with one voice."
 tyr_americas.23.t:0 "Recognition of Brazil's Contribution"
 tyr_americas.23.d:0 "The victorious patron has granted Brazil a development programme and political support. Other South American partners are being offered voluntary integration under Brazilian leadership."
 tyr_americas.23.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.23.a:0 "Prepare the federal negotiations."
 tyr_americas.24.t:0 "The End of the Continental Contest"
 tyr_americas.24.d:0 "The competition has ended without a continental victor. Existing borders and memberships remain in force; its special restrictions and temporary programmes have been removed."
 tyr_americas.24.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.24.a:0 "Accept the settlement."
 tyr_americas.30.t:0 "War in the Americas"
 tyr_americas.30.d:0 "Demand Whitepeace"
 tyr_americas.30.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.30.a:0 "Send financial and military assistance."
 tyr_americas.30.b:0 "Apply diplomatic pressure."
 tyr_americas.30.c:0 "Enter the war on their side."
 tyr_americas.30.e:0 "Accept the expansion for now."
 tyr_americas.31.t:0 "The Cost of a Premature War"
 tyr_americas.31.d:0 "Our offensive against [SCOPE.sCountry('tyr_am_target').GetName] has undermined the diplomatic campaign. The additional infamy, diplomatic burden and regional loss of influence have already been applied."
 tyr_americas.31.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.31.a:0 "We shall bear the consequences."
 tyr_americas.32.t:0 "A Demand for White Peace"
 tyr_americas.32.d:0 "[SCOPE.sCountry('tyr_am_observer').GetName] demands that we end our war against [SCOPE.sCountry('tyr_am_target').GetName] without enforcing any war goals. Refusal may bring their forces into the conflict."
 tyr_americas.32.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.32.a:0 "Accept the white peace."
 tyr_americas.32.b:0 "Reject their interference."
 tyr_americas.40.t:0 "A Continental Federation"
 tyr_americas.40.d:0 "Brazil invites our country to join a South American federation. Acceptance transfers our country into Brazil; refusal preserves our sovereignty and prevents another invitation for two years."
 tyr_americas.40.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.40.a:0 "Join the federation."
 tyr_americas.40.b:0 "Retain our sovereignty."
 tyr_americas.41.t:0 "A Sponsored Continental Settlement"
 tyr_americas.41.d:0 "[SCOPE.sCountry('tyr_am_patron').GetName] supports voluntary integration under Brazil. Acceptance transfers our country into Brazil; our government remains free to refuse."
 tyr_americas.41.f:0 "Dispatches cross the Atlantic while the governments of the continent weigh their next move."
 tyr_americas.41.a:0 "Accept integration."
 tyr_americas.41.b:0 "Keep our independence."

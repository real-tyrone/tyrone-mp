  dyn_c_gbr_monarchy: "United Kingdom"

  imperial_events.4.t: "A New Colonial Secretary"

  imperial_events.4.desc: "With imperial policy in disarray following recent failures, a new Colonial Secretary must be appointed to direct the Empire’s overseas ambitions and restore confidence in its administration."

  imperial_events.4.flavor: "The question of who shall guide the Empire’s colonial future now falls to the forefront of political life. All sorts  of [Concept('concept_interest_group', '$concept_interest_groups$')] such as the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameNoIcon] and [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameNoIcon] all put forward their preferred candidates, each seeking to shape imperial policy in their own image. The appointment will not merely fill an office, but define the direction of expansion, colonial [concept_government], and control across distant lands."
      
  imperial_events.4.a: "Appoint [SCOPE.sCharacter('industrialists_leader').GetFullName] as Colonial Secretary"
  imperial_events.4.b: "Entrust [SCOPE.sCharacter('armed_forces_leader').GetFullName] with the Colonial Office"
  imperial_events.4.c: "Select [SCOPE.sCharacter('petty_bourgeoisie_leader').GetFullName] to guide colonial affairs"
  imperial_events.4.d: "Nominate [SCOPE.sCharacter('intelligentsia_leader').GetFullName] as Colonial Secretary"
  imperial_events.4.e: "Grant the position to [SCOPE.sCharacter('landowners_leader').GetFullName]"
  imperial_events.4.f: "Elevate [SCOPE.sCharacter('trade_unions_leader').GetFullName] to the Colonial Office"
  imperial_events.4.g: "Choose [SCOPE.sCharacter('rural_folk_leader').GetFullName] to oversee the Empire"

  this_character_new_secretary: "This character will be the new #bold Colonial Secretary#!."

  cape_to_cairo_unticked: "@simple_box!"

  cape_to_cairo_ticked: "@green_checkmark_box!"


  je_african_conquest: "From Cape to Cairo"
  je_african_conquest_reason: "@information! Depending on the [concept_interest_group] to which the #bold Colonial Secretary#! belongs to we will have different options relating to expansion in Africa. A #bold Colonial Secretary#! belonging to the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameNoIcon], [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameNoIcon], [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameNoIcon], [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameNoIcon], or [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameNoIcon] will focus on extraction while a #bold Colonial Secretary#! belonging to the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameNoIcon], [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetNameNoIcon], or [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameNoIcon] will focus on spreading #bold civilisation#!. \n\n#tooltippable From Cape to Cairo#!:\n\nCompleting all items on the agenda will allow for the completion of the #bold From Cape to Cairo#! [concept_journal_entry].\n\n#bold The Question of the Nile#!: \n\n• [SCOPE.GetRootScope.GetCountry.GetCustom('all_nile_states_checkbox')] The [GetStateRegion('STATE_SINAI').GetName], [GetStateRegion('STATE_LOWER_EGYPT').GetName], [GetStateRegion('STATE_MIDDLE_EGYPT').GetName], [GetStateRegion('STATE_UPPER_EGYPT').GetName], [GetStateRegion('STATE_DONGOLA').GetName], and [GetStateRegion('STATE_BLUE_NILE').GetName] [Concept('concept_state_region','$concept_state_regions$')] are owned by [ROOT.GetCountry.GetName] or its subjects.\n• [SCOPE.GetRootScope.GetCountry.GetCustom('other_egypt_states_checkbox')] The [GetStateRegion('STATE_MATRUH').GetName], [GetStateRegion('STATE_EGYPTIAN_DESERT').GetName], [GetStateRegion('STATE_KORDOFAN').GetName],  [GetStateRegion('STATE_DARFUR').GetName], and [GetStateRegion('STATE_EQUATORIA').GetName] [Concept('concept_state_region','$concept_state_regions$')] are owned by [ROOT.GetCountry.GetName] or its subjects. \n\n#bold The Consolidation of the Cape#!: \n\n• [SCOPE.GetRootScope.GetCountry.GetCustom('all_cape_states_checkbox')] The [GetStateRegion('STATE_CAPE_COLONY').GetName], [GetStateRegion('STATE_EASTERN_CAPE').GetName], [GetStateRegion('STATE_NORTHERN_CAPE').GetName], [GetStateRegion('STATE_VRYSTAAT').GetName], [GetStateRegion('STATE_ZULULAND').GetName], and [GetStateRegion('STATE_TRANSVAAL').GetName] [Concept('concept_state_region','$concept_state_regions$')] are owned by [ROOT.GetCountry.GetName] or its subjects. \n• [SCOPE.GetRootScope.GetCountry.GetCustom('all_other_cape_states_checkbox')] The [GetStateRegion('STATE_NAMAQUALAND').GetName], [GetStateRegion('STATE_BOTSWANA').GetName], [GetStateRegion('STATE_ZAMBEZI').GetName], and [GetStateRegion('STATE_ZAMBIA').GetName] [Concept('concept_state_region','$concept_state_regions$')] are owned by [ROOT.GetCountry.GetName] or its subjects. \n\n#bold The East African Question#!: \n\n• [SCOPE.GetRootScope.GetCountry.GetCustom('all_east_africa_states_checkbox')] The [GetStateRegion('STATE_KAZEMBE').GetName], [GetStateRegion('STATE_LINDI').GetName], [GetStateRegion('STATE_ZANZIBAR').GetName], [GetStateRegion('STATE_TANGANYIKA').GetName], [GetStateRegion('STATE_KENYA').GetName], [GetStateRegion('STATE_RIFT_VALLEY').GetName], and [GetStateRegion('STATE_UGANDA').GetName] [Concept('concept_state_region','$concept_state_regions$')] are owned by [ROOT.GetCountry.GetName] or its subjects.\n\n 'Africa is still lying ready for us it is our duty to take it.'#!- Cecil John Rhodes"

  africa_goals_complete_tt: "All items on the #tooltippable Cape to Cairo#! agenda are completed."

  notification_colonial_secretary_term_over_name: "The Colonial Secretary's Term is Over"
  notification_colonial_secretary_term_over_desc: "The term of the Colonial Secretary has officially concluded, marking the end of their administration over imperial affairs."

  africa_goals_complete_tt: "All items on the #tooltippable From Cape to Cairo#! agenda have been completed"

  occupy_egypt_button: "Occupy Egypt"
  occupy_egypt_button_desc: "As the so-called 'Sick Man of Europe' weakens, Egypt drifts beyond effective Ottoman control. Its strategic position along the Suez makes it too important to ignore. We must act decisively to bring it under [ROOT.GetCountry.GetAdjectiveNoFlag] protection—whatever the diplomatic cost."

  paying_for_colonial_administration: "Expensive Colonial Government"
  skipping_for_colonial_administration: "Cheap Colonial Government"

  imperial_events.5.t: "An Expensive Empire"

  imperial_events.5.d: "Colonial offices report growing inefficiencies, while the cost of governing distant territories rises steadily. Without further investment or reform, the effectiveness of [ROOT.GetCountry.GetAdjective] rule may begin to erode."

  imperial_events.5.f: "From the Gold Coast to the Cape, the [ROOT.GetCountry.GetAdjectiveNoFlag] Empire stretches ever further, its borders inked hastily upon maps in London drawing rooms. Yet beyond the reach of these pens lie the realities of governance — overworked officials, delayed dispatches, and a constant struggle to impose order upon lands vast and unfamiliar."

  imperial_events.5.a: "We must fund the machinery of Empire."
  imperial_events.5.b: "Cut some corners here and there."

  imperial_events.6.t: "Local Negotiations"

  imperial_events.6.d: "A local chief has sent envoys proposing formal negotiations regarding the status of the territory. His message suggests a willingness to recognize [ROOT.GetCountry.GetAdjectiveNoFlag] authority under agreed terms, potentially avoiding further conflict. Colonial officials now await instructions on whether to accept these overtures or continue expansion by force."

  imperial_events.6.f: "The chief speaks through interpreters, his words measured and deliberate. He acknowledges the growing presence of [ROOT.GetCountry.GetAdjective] forces and suggests that continued resistance may bring unnecessary suffering to his people. In exchange for guarantees of limited autonomy and respect for local customs, he offers cooperation and recognition of [ROOT.GetCountry.GetAdjectiveNoFlag] influence."

  imperial_events.6.a: "Open up diplomatic channels."
  imperial_events.6.b: "Negotiate? What a joke!"

  negotiating_with_chief_modifier: "Tribal Negotiations"
  not_negotiating_with_chief_modifier: "Negotiate? What a joke!"

  imperial_events.7.t: "The Niger Delta"

  imperial_events.7.d: "[ROOT.GetCountry.GetAdjectiveNoFlag] traders along the Niger River have secured treaties and established a firm commercial presence inland. Backed by royal charter, the Royal Niger Company now stands poised to transform its influence into formal territorial control, outpacing any foreign rivals."

  imperial_events.7.f: "From the Delta to the inland emirs, the Niger bends ever toward [ROOT.GetCountry.GetAdjective] hands. It seems only a matter of time before the whole region stands beneath our flag."

  imperial_events.7.a: "Grant the Company its charter, and secure our claims."

  kimberly_mining_boom: "The Big Hole"

  imperial_events.8.t: "Diamonds in the Dust"

  imperial_events.8.d: "Reports from the Northern Cape confirm the discovery of vast diamond deposits. What began as scattered finds has rapidly drawn prospectors, investors, and fortune-seekers, transforming the region into a center of intense economic activity."

  imperial_events.8.f: "Tents and shanties rise almost overnight as men from across the [ROOT.GetCountry.GetAdjective] Empire and beyond descend upon the fields, each chasing fortune in the dust. Claims are marked, contested, and consolidated with increasing urgency, while the land itself is carved into a vast and growing pit — a wound in the earth that seems to deepen with each passing day."

  imperial_events.8.a: "A fortune lies beneath our feet."

  imperial_events.9.t: "Flags at Fashoda"

  imperial_events.9.d: "[ROOT.GetCountry.GetAdjectiveNoFlag] and [SCOPE.sCountry('french_scope').GetAdjectiveNoFlag] expeditions have encountered one another at a remote outpost along the Nile. Both lay claim to the territory, and tensions are rising as neither side appears willing to yield."

  imperial_events.9.f: "In a distant and little-known corner of Africa, two empires meet not through grand armies, but through small detachments of determined men. [ROOT.GetCountry.GetAdjective] and [SCOPE.sCountry('french_scope').GetAdjective] officers exchange formalities, yet beneath the surface lies a contest of pride and prestige.For days, the flags of both nations stand side by side, neither lowered, neither challenged — a silent standoff watched closely from London and Paris alike."

  imperial_events.9.a: "We will not yield an inch."
  imperial_events.9.b: "Seek a diplomatic understanding."

  victory_at_fashoda: "Victory at Fashoda"
  humiliation_at_fashoda: "Humiliation at Fashoda"
  negotiating_at_fashoda: "Negotiatiations at Fashoda"

  imperial_events.10.t: "A Raid Across the Border"

  imperial_events.10.d: "Reports have reached us that a force led by Dr. Jameson plans to cross the border into [SCOPE.sCountry('transvaal_scope').GetNameNoFlag], aiming to incite an uprising among [ROOT.GetCountry.GetAdjectiveNoFlag] settlers. The situation remains uncertain, and our response may determine what becomes of this incident."

  imperial_events.10.f: "Intended as a swift and decisive intervention; Dr. Leander Starr Jameson, acting with the backing of influential colonial interests, plans to lead his men across the border into [SCOPE.sCountry('transvaal_scope').GetName], confident that [ROOT.GetCountry.GetAdjective] settlers will rise in support. Yet the expected uprising isn't guaranteed and there is a chance the raiders will find themselves isolated, their advance slowed and their position vulnerable."

  imperial_events.10.a: "Into [SCOPE.sCountry('transvaal_scope').GetNameNoFlag] we March!"
  imperial_events.10.b: "Whatever Happens we Weren't Involved."

  leads_to_jameson_raid: "This will lead to the #bold execution#! of the #bold Jameson Raid#!."

  supported_jameson_raid: "Supported the Jameson Raid"
  denied_involvement_jameson_raid: "Denied Involement in the Jameson Raid"

  disaster_at_jameson: "Disaster at Jameson"
  victory_at_jameson: "Victory at Jameson"


  imperial_events.11.t:0 "Disaster at Jameson"

  imperial_events.11.d:0 "The ill-fated raid has ended in humiliation. What was intended as a swift assertion of [ROOT.GetCountry.GetAdjectiveNoFlag] influence has instead collapsed into chaos, with diplomatic outrage, political scandal, and growing instability at home."

  imperial_events.11.f:0 "News of the failed raid spreads rapidly through Parliament and across the [ROOT.GetCountry.GetAdjective] Empire, each retelling more damning than the last. What was once promoted as a bold and decisive intervention is now condemned as reckless adventurism carried out with little foresight or coordination. Foreign governments seize upon the embarrassment as evidence of [ROOT.GetCountry.GetAdjective] overreach, while domestic critics sharpen their attacks on the administration’s judgment and competence."

  imperial_events.11.a:0 "An Embarassing Display."

  imperial_events.12.t:0 "Victory at Jameson"

  imperial_events.12.d:0 "The Jameson Raid has ended in a stunning triumph. What began as a risky intervention has transformed into a decisive assertion of [ROOT.GetCountry.GetAdjectiveNoFlag] power, humbling the Transvaal and sending waves of celebration across the empire."

  imperial_events.12.f:0 "News of the victory spreads like wildfire through Parliament and across the [ROOT.GetCountry.GetAdjective] Empire. Foreign capitals take note of this bold display of resolve, while at home, the administration basks in a surge of popular support. The road is now open to bring the Boer republics under imperial protection, and loyal subjects from Cape Town to London celebrate a glorious new chapter in imperial history."

  imperial_events.12.a:0 "A glorious day for the Empire."

  imperial_events.13.t:0 "The Mahdist Uprising"

  imperial_events.13.d:0 "A religious leader proclaiming himself the Mahdi — the prophesied redeemer of Islam — has united the disparate tribes of Sudan. His followers now call for a holy war to purify the faith and expel outsiders. What began as isolated unrest has now become a full-blown insurgency threatening [ROOT.GetCountry.GetAdjectiveNoFlag] control over the entire region."

  imperial_events.13.f:0 "From the deserts of Dongola to the hills of Kordofan, the cry of 'The Mahdi is coming!' echoes through the villages. Caravans are ambushed, tax collectors are slain, and garrisons are besieged. The banners of the Ansar now fly over several towns, and thousands flock to the Mahdi's banner. If left unchecked, the entire Nile Valley could be lost."

  imperial_events.13.a:0 "Surely just another colonial rebellion."

  mahdist_insurgency: "Mahdist Insurgency"

  imperial_events.14.t:0 "A British Africa"
  imperial_events.14.d:0 "From the Cape to Cairo, from the Niger to the Nile, the Union Jack now flies over Africa’s most vital lands. [ROOT.GetCountry.GetAdjectiveNoFlag] armies have crushed the last organized resistance, our administrators have mapped every river and mountain, and our merchants have opened every market. This is not merely a colonial acquisition – it is a triumph of [ROOT.GetCountry.GetAdjectiveNoFlag] will, industry, and martial prowess."

  imperial_events.14.f:0 "A painting of [ROOT.GetCountry.GetAdjective] redcoats standing atop a rocky outcrop, the African savanna stretching endlessly behind them under a blazing sun. In the foreground, a Union Jack is being planted into the earth by a smiling officer as local chiefs bow in submission."

  imperial_events.14.a:0 "Salute to the heroes of Africa."

  imperial_events.14.b:0 "Let our Industrialists take it from here."

  britain_under_the_sun: "Britain Under the Sun"
  07_conquerors_of_africa: "Conquerors of Africa!"
  07_financiers_of_africa: "Investors in Africa!"

  imperial_events.15.t:0 "The Sun Flickers"

  imperial_events.15.d:0 "Africa was meant to be ours. Instead, it has become our gravest humiliation. From the Cape to Cairo, [ROOT.GetCountry.GetAdjectiveNoFlag] forces have been routed, our administrators expelled, and our merchants driven from once-loyal markets. Local uprisings, foreign interference, and our own overconfidence have conspired to tear the Union Jack from African soil."

  imperial_events.15.f:0 "A faded photograph of a [ROOT.GetCountry.GetAdjective] colonial officer handing his revolver to a victorious African warrior. In the background, the Union Jack is being lowered from a crumbling fort as smoke rises from a burning supply depot. The officer's face is pale, his eyes hollow. The warrior stands tall, unyielding, flanked by his people."

  imperial_events.15.a:0 "The generals have failed us."

  imperial_events.15.b:0 "The merchants sold us a lie."

  britain_out_of_the_sun: "Britain out of the Sun"
  blamed_for_africa: "Blamed for African Fiasco"


  has_liberal_colonial_office: "The current #bold Colonial Secretary#! of a liberal [concept_interest_group]."

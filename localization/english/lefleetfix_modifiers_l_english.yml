 lefleetfix_blue_cruising_engines:0 "#lefleetfix_role_speed (SPEED)#! #lefleetfix_level_0 Economical Cruising Machinery#!"
 lefleetfix_blue_cruising_engines_desc:0 "Efficient cruising machinery combines high sustained speed with larger supply reserves and improved supply efficiency for distant deployments."
 lefleetfix_blue_landing_craft:0 "#lefleetfix_role_landing (LANDING)#! #lefleetfix_level_0 Cruiser Landing Boats#!"
 lefleetfix_blue_landing_craft_desc: "Landing boats support limited expeditions. An invasion fleet still needs dedicated transport capacity."
 lefleetfix_blue_damage_control:0 "#lefleetfix_role_protection (PROTECT)#! #lefleetfix_level_0 Cruiser Damage Control#!"
 lefleetfix_blue_damage_control_desc: "Repair parties limit hull damage and critical-hit exposure without adding firepower."


 lefleetfix_slot_radio: "Radio Compartment"
 lefleetfix_radio_none:0 "#lefleetfix_level_0 No Radio Installation#!"
 lefleetfix_radio_none_desc: "No radio equipment is installed. This choice adds no combat modifiers, construction goods or materiel consumption."
 lefleetfix_radio_basic:0 "#lefleetfix_level_1 (I) Radio Compartment#!"
 lefleetfix_radio_basic_desc: "A dedicated radio room improves accuracy and the pace of combat actions. It requires a continuing supply of radio equipment."
 lefleetfix_radio_advanced:0 "#lefleetfix_level_2 (II) Advanced Radio Compartment#!"
 lefleetfix_radio_advanced_desc: "An extensive radio installation greatly accelerates combat readiness and improves accuracy, at a substantial ongoing equipment cost."

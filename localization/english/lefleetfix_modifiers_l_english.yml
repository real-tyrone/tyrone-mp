 lefleetfix_mod_torpedo_mk2_b:0 "#lefleetfix_level_2 (II) Torpedo#!"
 lefleetfix_mod_torpedo_mk2_b_desc: "Improved torpedoes carry larger warheads and more reliable guidance for attacks against capital ships."
 lefleetfix_mod_torpedo_mk2_c:0 "#lefleetfix_level_2 (II) Torpedo#!"
 lefleetfix_mod_torpedo_mk2_c_desc: "Improved torpedoes carry larger warheads and more reliable guidance for attacks against capital ships."
 lefleetfix_mod_torpedo_mk3_a:0 "#lefleetfix_level_3 (III) Torpedo#!"
 lefleetfix_mod_torpedo_mk3_a_desc: "Modern high-performance torpedoes deliver devastating warheads against the most heavily protected capital ships."
 lefleetfix_mod_torpedo_mk3_b:0 "#lefleetfix_level_3 (III) Torpedo#!"
 lefleetfix_mod_torpedo_mk3_b_desc: "Modern high-performance torpedoes deliver devastating warheads against the most heavily protected capital ships."
 lefleetfix_mod_torpedo_mk3_c:0 "#lefleetfix_level_3 (III) Torpedo#!"
 lefleetfix_mod_torpedo_mk3_c_desc: "Modern high-performance torpedoes deliver devastating warheads against the most heavily protected capital ships."
 lefleetfix_mod_cruiser_torpedo_battery:0 "#lefleetfix_level_0 Torpedo Battery#!"
 lefleetfix_mod_cruiser_torpedo_battery_desc: "A single cruiser-mounted torpedo battery with performance comparable to an improved torpedo system."
 lefleetfix_mod_light_battery_mk1:0 "#lefleetfix_level_1 (I) Light Battery#!"
 lefleetfix_mod_light_battery_mk1_desc: "An early battery of light guns suited to tracking torpedo craft and engaging exposed crews."
 lefleetfix_mod_light_battery_mk2:0 "#lefleetfix_level_2 (II) Light Battery#!"
 lefleetfix_mod_light_battery_mk2_desc: "Improved light guns combine rapid fire with better tracking against small and agile warships."
 lefleetfix_mod_light_battery_mk3:0 "#lefleetfix_level_3 (III) Light Battery#!"
 lefleetfix_mod_light_battery_mk3_desc: "Modern light batteries provide dense, accurate fire against torpedo ships attempting to penetrate the screen."
 lefleetfix_mod_extra_ammunition:0 "#lefleetfix_role_damage (DAMAGE)#! #lefleetfix_level_0 Extra Ammunition Storage#!"
 lefleetfix_mod_extra_ammunition_desc: "Expanded magazines sustain heavier fire, but increase the danger posed by penetrating hits."
 lefleetfix_mod_belt_armor:0 "#lefleetfix_level_0 Belt Armor#!"
 lefleetfix_mod_belt_armor_desc: "An armored belt protects the waterline and machinery spaces at the cost of additional displacement."
 lefleetfix_mod_armor_piece_mk1_a:0 "#lefleetfix_level_1 (I) Armor Piece#!"
 lefleetfix_mod_armor_piece_mk1_a_desc: "An early section of capital-ship armor that improves protection at the cost of additional displacement."
 lefleetfix_mod_armor_piece_mk1_b:0 "#lefleetfix_level_1 (I) Armor Piece#!"
 lefleetfix_mod_armor_piece_mk1_b_desc: "An early section of capital-ship armor that improves protection at the cost of additional displacement."
 lefleetfix_mod_armor_piece_mk2_a:0 "#lefleetfix_level_2 (II) Armor Piece#!"
 lefleetfix_mod_armor_piece_mk2_a_desc: "Improved armor plating provides substantial protection while reducing speed and increasing the ship's target profile."
 lefleetfix_mod_armor_piece_mk2_b:0 "#lefleetfix_level_2 (II) Armor Piece#!"
 lefleetfix_mod_armor_piece_mk2_b_desc: "Improved armor plating provides substantial protection while reducing speed and increasing the ship's target profile."
 lefleetfix_mod_armor_piece_mk3_a:0 "#lefleetfix_level_3 (III) Armor Piece#!"
 lefleetfix_mod_armor_piece_mk3_a_desc: "Modern capital-ship armor provides exceptional protection but imposes severe displacement and mobility penalties."
 lefleetfix_mod_armor_piece_mk3_b:0 "#lefleetfix_level_3 (III) Armor Piece#!"
 lefleetfix_mod_armor_piece_mk3_b_desc: "Modern capital-ship armor provides exceptional protection but imposes severe displacement and mobility penalties."
 lefleetfix_mod_reinforced_bulkheads:0 "#lefleetfix_level_0 Reinforced Bulkheads#!"
 lefleetfix_mod_reinforced_bulkheads_desc: "Strengthened internal compartments contain flooding and limit the consequences of critical damage."
 lefleetfix_mod_torpedo_bulges:0 "#lefleetfix_level_0 Torpedo Bulges#!"
 lefleetfix_mod_torpedo_bulges_desc: "External compartments absorb underwater explosions before they can rupture the main hull."
 lefleetfix_mod_torpedo_nets:0 "#lefleetfix_level_0 Torpedo Nets#!"
 lefleetfix_mod_torpedo_nets_desc: "Protective nets reduce exposure to torpedo attacks, though their drag considerably restricts movement."
 lefleetfix_mod_lightweight_machinery:0 "#lefleetfix_level_0 Lightweight Machinery#!"
 lefleetfix_mod_lightweight_machinery_desc: "Compact machinery raises speed by sacrificing structural strength and armor protection."
 lefleetfix_mod_damage_control_compartments:0 "#lefleetfix_level_0 Damage-Control Compartments#!"
 lefleetfix_mod_damage_control_compartments_desc: "Purpose-built compartments and repair stations improve readiness and contain battle damage."
 lefleetfix_extra_optical_rangefinder:0 "#lefleetfix_role_aim (AIM)#! #lefleetfix_level_0 Optical Rangefinder#!"
 lefleetfix_extra_optical_rangefinder_desc: "Precision optical instruments improve gunnery calculations and coordination with screening ships."
 lefleetfix_extra_fire_control_system:0 "#lefleetfix_role_critical (CRIT)#! #lefleetfix_level_0 Fire-Control System#!"
 lefleetfix_extra_fire_control_system_desc: "Centralized fire control coordinates the ship's weapons for more accurate and decisive salvos."
 lefleetfix_extra_capital_fire_director:0 "#lefleetfix_role_capital (ANTI-CAP)#! #lefleetfix_level_0 Capital Fire Director#!"
 lefleetfix_extra_capital_fire_director_desc: "A director optimized for engaging large warships, sacrificing the ability to track small and agile targets."
 lefleetfix_extra_anti_torpedo_director:0 "#lefleetfix_role_escort (ANTI-TORP)#! #lefleetfix_level_0 Anti-Torpedo Director#!"
 lefleetfix_extra_anti_torpedo_director_desc: "Dedicated tracking equipment helps the crew detect, follow, and engage fast torpedo craft."
 lefleetfix_extra_torpedo_fire_director:0 "#lefleetfix_role_torpedo (TORPEDO)#! #lefleetfix_level_0 Torpedo Fire Director#!"
 lefleetfix_extra_torpedo_fire_director_desc: "Mechanical fire-control solutions improve torpedo attacks against slow and heavily protected capital ships."
 lefleetfix_extra_close_range_fire_control:0 "#lefleetfix_role_escort (ANTI-TORP)#! #lefleetfix_level_0 Close-Range Fire Control#!"
 lefleetfix_extra_close_range_fire_control_desc: "Local directors coordinate short-range fire against small ships attempting to penetrate the screen."
 lefleetfix_extra_advanced_damage_control:0 "#lefleetfix_role_protection (PROTECT)#! #lefleetfix_level_0 Advanced Damage Control#!"
 lefleetfix_extra_advanced_damage_control_desc: "Specialist crews, redundant pumps, and practiced procedures allow the ship to recover from severe damage."
 lefleetfix_extra_camouflage_system:0 "#lefleetfix_role_stealth (STEALTH)#! #lefleetfix_level_0 Camouflage System#!"
 lefleetfix_extra_camouflage_system_desc: "Disruptive paint and concealment measures make the ship harder to target, at some cost to its own observation."
 lefleetfix_extra_radio_coordination:0 "#lefleetfix_role_readiness (READY)#! #lefleetfix_level_0 Radio Coordination#!"
 lefleetfix_extra_radio_coordination_desc: "Shipboard radio networks coordinate formation movements, target reports, and damage-control responses."
 lefleetfix_extra_extended_operations:0 "#lefleetfix_role_supply (SUPPLY)#! #lefleetfix_level_0 Extended Operations#!"
 lefleetfix_extra_extended_operations_desc: "Additional stores and improved supply arrangements allow the ship to remain operational farther from port."
 lefleetfix_extra_reconnaissance_equipment:0 "#lefleetfix_role_screen (SCREEN)#! #lefleetfix_level_0 Reconnaissance Equipment#!"
 lefleetfix_extra_reconnaissance_equipment_desc: "Observation posts and communications equipment improve scouting and the maintenance of an effective screen."
 lefleetfix_extra_stabilized_fire_control:0 "#lefleetfix_role_aim (AIM)#! #lefleetfix_level_0 Stabilized Fire Control#!"
 lefleetfix_extra_stabilized_fire_control_desc: "Stabilized directors maintain accurate fire despite the movement and recoil of a heavily armed warship."
 lefleetfix_capital_extra_armor_mk1:0 "#lefleetfix_level_1 (I) Extra Armor#!"
 lefleetfix_capital_extra_armor_mk1_desc: "Additional armor plate and subdivision provide modest protection without overwhelming the ship's machinery."
 lefleetfix_capital_extra_armor_mk2:0 "#lefleetfix_level_2 (II) Extra Armor#!"
 lefleetfix_capital_extra_armor_mk2_desc: "A comprehensive armor scheme and reinforced internal structure substantially reduce damage at considerable expense and weight."
 lefleetfix_capital_extra_armor_mk3:0 "#lefleetfix_level_3 (III) Extra Armor#!"
 lefleetfix_capital_extra_armor_mk3_desc: "An exceptionally heavy protection scheme surrounds every vital system, making the vessel extremely resilient but slow and ruinously expensive."
 lefleetfix_light_armor_mk1:0 "#lefleetfix_level_1 (I) Light Armor#!"
 lefleetfix_light_armor_mk1_desc: "Thin protective plating offers basic survivability while preserving most of the ship's speed."
 lefleetfix_light_armor_mk2:0 "#lefleetfix_level_2 (II) Light Armor#!"
 lefleetfix_light_armor_mk2_desc: "Improved light plating and internal reinforcement provide balanced protection with a limited weight penalty."
 lefleetfix_light_armor_mk3:0 "#lefleetfix_level_3 (III) Light Armor#!"
 lefleetfix_light_armor_mk3_desc: "Advanced lightweight armor provides strong protection for its mass, though it remains less durable than a cruiser-grade scheme."
 lefleetfix_cruiser_armor_mk1:0 "#lefleetfix_level_1 (I) Cruiser Armor#!"
 lefleetfix_cruiser_armor_mk1_desc: "Cruiser-grade plate offers much greater protection than light armor, at a significant cost in speed and materials."
 lefleetfix_cruiser_armor_mk2:0 "#lefleetfix_level_2 (II) Cruiser Armor#!"
 lefleetfix_cruiser_armor_mk2_desc: "A reinforced cruiser armor belt and extensive subdivision sharply improve survivability while increasing displacement."
 lefleetfix_cruiser_armor_mk3:0 "#lefleetfix_level_3 (III) Cruiser Armor#!"
 lefleetfix_cruiser_armor_mk3_desc: "The heaviest practical cruiser protection makes the ship exceptionally durable, expensive, and slow."
 lefleetfix_fire_control_mk1:0 "#lefleetfix_level_1 (I) Fire Control#!"
 lefleetfix_fire_control_mk1_desc: "Basic plotting tables coordinate range estimates and gun orders across the ship."
 lefleetfix_fire_control_mk2:0 "#lefleetfix_level_2 (II) Fire Control#!"
 lefleetfix_fire_control_mk2_desc: "Centralized mechanical fire control improves accuracy, critical hits, and combat readiness."
 lefleetfix_fire_control_mk3:0 "#lefleetfix_level_3 (III) Fire Control#!"
 lefleetfix_fire_control_mk3_desc: "Radio-linked directors and advanced calculating equipment coordinate exceptionally accurate fire."
 lefleetfix_rangefinder_mk1:0 "#lefleetfix_level_1 (I) Rangefinder#!"
 lefleetfix_rangefinder_mk1_desc: "Simple optical instruments improve range estimation and target detection."
 lefleetfix_rangefinder_mk2:0 "#lefleetfix_level_2 (II) Rangefinder#!"
 lefleetfix_rangefinder_mk2_desc: "Improved optics and coincidence mechanisms provide reliable ranging at battle distances."
 lefleetfix_rangefinder_mk3:0 "#lefleetfix_level_3 (III) Rangefinder#!"
 lefleetfix_rangefinder_mk3_desc: "Advanced optical and radio-assisted ranging sharply improves accuracy and detection."
 lefleetfix_dazzle_camouflage:0 "#lefleetfix_level_0 Dazzle Camouflage#!"
 lefleetfix_dazzle_camouflage_desc: "Disruptive patterns make the ship's course and range harder to judge, slightly hindering its own gunnery."
 lefleetfix_advanced_camouflage:0 "#lefleetfix_level_0 Advanced Camouflage#!"
 lefleetfix_advanced_camouflage_desc: "Extensive concealment measures greatly reduce visibility and enemy accuracy at the expense of observation and fire control."
 lefleetfix_extended_supply_stores:0 "#lefleetfix_level_0 Extended Supply Stores#!"
 lefleetfix_extended_supply_stores_desc: "Additional provisions and fuel expand operational range and endurance, adding weight to the vessel."
 lefleetfix_fleet_logistics_center:0 "#lefleetfix_level_0 Fleet Logistics Center#!"
 lefleetfix_fleet_logistics_center_desc: "Dedicated stores, workshops, and communications equipment sustain long deployments and improve readiness."
 lefleetfix_secondary_battery_anti_torpedo:0 "#lefleetfix_level_0 Anti-Torpedo Secondary Battery#!"
 lefleetfix_secondary_battery_anti_torpedo_desc: "Rapid-firing secondary guns sacrifice individual shell weight to engage small torpedo craft effectively."
 lefleetfix_secondary_battery_anti_cruiser:0 "#lefleetfix_level_0 Anti-Cruiser Secondary Battery#!"
 lefleetfix_secondary_battery_anti_cruiser_desc: "Medium secondary turrets are optimized to damage protected, armored, and light cruisers."
 lefleetfix_secondary_battery_anti_capital:0 "#lefleetfix_level_0 Anti-Capital Secondary Battery#!"
 lefleetfix_secondary_battery_anti_capital_desc: "Heavy secondary turrets supplement the main battery against capital ships, though with substantially less firepower."
 lefleetfix_screening_battery_mk1:0 "#lefleetfix_level_1 (I) Screening Battery#!"
 lefleetfix_screening_battery_mk1_desc: "A cheap battery of rapid-firing guns designed exclusively to drive off torpedo craft; its shells are ineffective against capital armor."
 lefleetfix_screening_battery_mk2:0 "#lefleetfix_level_2 (II) Screening Battery#!"
 lefleetfix_screening_battery_mk2_desc: "A balanced defensive battery with the volume of fire and tracking equipment needed to destroy attacking torpedo craft."
 lefleetfix_screening_battery_mk3:0 "#lefleetfix_level_3 (III) Screening Battery#!"
 lefleetfix_screening_battery_mk3_desc: "An elite anti-torpedo armament capable of saturating the approaches to a battle line, at an exceptional cost."
 lefleetfix_cruiser_gun_mk1_a:0 "#lefleetfix_level_1 (I) Cruiser Gun#!"
 lefleetfix_cruiser_gun_mk1_a_desc: "An inexpensive medium-caliber battery with a modest advantage against cruiser and capital targets."
 lefleetfix_cruiser_gun_mk1_b:0 "#lefleetfix_level_1 (I) Cruiser Gun#!"
 lefleetfix_cruiser_gun_mk1_b_desc: "An inexpensive medium-caliber battery with a modest advantage against cruiser and capital targets."
 lefleetfix_cruiser_gun_mk2_a:0 "#lefleetfix_level_2 (II) Cruiser Gun#!"
 lefleetfix_cruiser_gun_mk2_a_desc: "A cost-effective battery offering balanced performance against cruiser and capital targets."
 lefleetfix_cruiser_gun_mk2_b:0 "#lefleetfix_level_2 (II) Cruiser Gun#!"
 lefleetfix_cruiser_gun_mk2_b_desc: "A cost-effective battery offering balanced performance against cruiser and capital targets."
 lefleetfix_cruiser_gun_mk3_a:0 "#lefleetfix_level_3 (III) Cruiser Gun#!"
 lefleetfix_cruiser_gun_mk3_a_desc: "An elite medium-heavy battery with improved performance against cruiser and capital targets at substantial cost."
 lefleetfix_cruiser_gun_mk3_b:0 "#lefleetfix_level_3 (III) Cruiser Gun#!"
 lefleetfix_cruiser_gun_mk3_b_desc: "An elite medium-heavy battery with improved performance against cruiser and capital targets at substantial cost."
 lefleetfix_torpedo_enlarged_warheads:0 "#lefleetfix_role_critical (CRIT)#! #lefleetfix_level_0 Enlarged Torpedo Warheads#!"
 lefleetfix_torpedo_enlarged_warheads_desc: "Oversized explosive charges maximize the damage of a successful torpedo strike while making the carrying vessel slower and more vulnerable."
 lefleetfix_torpedo_magnetic_detonators:0 "#lefleetfix_role_critical (CRIT)#! #lefleetfix_level_0 Magnetic Detonators#!"
 lefleetfix_torpedo_magnetic_detonators_desc: "Specialized detonators increase both the frequency and severity of critical torpedo hits."
 lefleetfix_torpedo_attack_director:0 "#lefleetfix_role_torpedo (TORPEDO)#! #lefleetfix_level_0 Torpedo Attack Director#!"
 lefleetfix_torpedo_attack_director_desc: "A dedicated attack director coordinates firing solutions against exposed capital ships, trading maximum burst damage for reliable target specialization."
 lefleetfix_super_heavy_armor:0 "#red #bold Super-Heavy Armor#!#!"
 lefleetfix_super_heavy_armor_desc: "An extreme scheme of armor, subdivision, and structural reinforcement turns the ship into a floating fortress, sacrificing offensive efficiency for extraordinary endurance."
 lefleetfix_mod_super_heavy_cannon:0 "#red #bold Super-Heavy Cannon#!#!"
 lefleetfix_mod_super_heavy_cannon_desc: "An immense main battery designed to break the heaviest battle line, imposing severe costs in weight, vulnerability, accuracy, construction, and maintenance."
 lefleetfix_troop_auxiliary_engines:0 "#lefleetfix_level_0 Auxiliary Transport Engines#!"
 lefleetfix_troop_auxiliary_engines_desc: "Additional engines allow troop transports to reach distant landing zones more quickly."
 lefleetfix_troop_turbine_drives:0 "#lefleetfix_level_0 Turbine Transport Drives#!"
 lefleetfix_troop_turbine_drives_desc: "Powerful turbine machinery gives troop transports the speed required for rapid strategic redeployment."
 lefleetfix_troop_expanded_berthing:0 "#lefleetfix_level_0 Expanded Troop Berthing#!"
 lefleetfix_troop_expanded_berthing_desc: "Purpose-built quarters and reorganized cargo spaces allow more soldiers and marines to travel aboard each transport."
 lefleetfix_troop_landing_craft_flotillas_mk1:0 "#lefleetfix_level_1 (I) Landing-Craft Flotillas#!"
 lefleetfix_troop_landing_craft_flotillas_mk1_desc: "Early landing boats provide an organized means of carrying troops and equipment from transport decks to contested shores."
 lefleetfix_troop_landing_craft_flotillas_mk2:0 "#lefleetfix_level_2 (II) Landing-Craft Flotillas#!"
 lefleetfix_troop_landing_craft_flotillas_mk2_desc: "Purpose-built landing craft deliver larger assault waves to shore with greater speed and order."
 lefleetfix_troop_landing_craft_flotillas_mk3:0 "#lefleetfix_level_3 (III) Landing-Craft Flotillas#!"
 lefleetfix_troop_landing_craft_flotillas_mk3_desc: "Modern powered landing flotillas sustain exceptionally large and efficient amphibious operations."
 lefleetfix_troop_expeditionary_stores_mk1:0 "#lefleetfix_level_1 (I) Expeditionary Supply Stores#!"
 lefleetfix_troop_expeditionary_stores_mk1_desc: "Additional provisions and reorganized holds extend the endurance of embarked expeditionary forces."
 lefleetfix_troop_expeditionary_stores_mk2:0 "#lefleetfix_level_2 (II) Expeditionary Supply Stores#!"
 lefleetfix_troop_expeditionary_stores_mk2_desc: "Expanded holds and standardized provisions sustain large expeditionary forces far from friendly ports."
 lefleetfix_troop_expeditionary_stores_mk3:0 "#lefleetfix_level_3 (III) Expeditionary Supply Stores#!"
 lefleetfix_troop_expeditionary_stores_mk3_desc: "Industrial-scale storage and distribution facilities support prolonged overseas campaigns with minimal interruption."
 lefleetfix_troop_amphibious_command_center_mk1:0 "#lefleetfix_level_1 (I) Amphibious Command Center#!"
 lefleetfix_troop_amphibious_command_center_mk1_desc: "A dedicated planning staff coordinates manifests, landing schedules, and the movement of embarked marines."
 lefleetfix_troop_amphibious_command_center_mk2:0 "#lefleetfix_level_2 (II) Amphibious Command Center#!"

l_english:
 subject_type_tyr_habsburg_autonomous:0 "Autonomous Crown"
 subject_type_tyr_habsburg_autonomous_desc:0 "An autonomous Habsburg crown within the imperial market. It pays half the standard subject-payment base, cannot begin diplomatic plays, and does not join its overlord’s wars."
 tyr_habsburg_autonomous:0 "Autonomous Crown"
 tyr_habsburg_autonomous_desc:0 "Establish an autonomous Habsburg crown."
 tyr_habsburg_autonomous_pact_desc:0 "An autonomous crown owing tribute to its Habsburg sovereign."
 subject_type_tyr_habsburg_autonomous_no_icon:0 "Autonomous Crown"
 tyr_ga_hungarian_settlement:0 "The Hungarian Settlement"
 tyr_ga_italian_discontent:0 "Italian Discontent"
 tyr_ga_war_mobilization:0 "The German Campaign"
 tyr_ga_habsburgs_in_exile:0 "Habsburgs in Exile"
 je_tyr_german_question:0 "The German Question"
 je_tyr_german_question_reason:0 "[SCOPE.sCountry('tyr_ga_austria').GetName] has turned its attention towards Germany, preserving the eastern crowns within its market while drawing the southern states into a single government. [SCOPE.sCountry('tyr_ga_north').GetName] gathers the northern states under its own leadership. Neither court will concede the right to speak for Germany.\n\nA first war will decide the leadership of the German states. If Vienna refuses a northern victory, a second war will decide the future of the Habsburg monarchy itself."
 tyr_ga_finished:0 "The German question has been settled."
 tyr_ga_launch_first:0 "Launch the Leadership War"
 tyr_ga_launch_first_desc:0 "Challenge the rival German court in a [concept_diplomatic_play]. The agreed settlement is imposed only if its principal war goal is enforced. A white peace leaves this phase unresolved. Both German courts receive the same military supply and recovery bonuses used in the Crimean War."
 tyr_ga_launch_final:0 "Launch the Final German War"
 tyr_ga_launch_final_desc:0 "Challenge the rival German court in a [concept_diplomatic_play]. The agreed settlement is imposed only if its principal war goal is enforced. A white peace leaves this phase unresolved. Both German courts receive the same military supply and recovery bonuses used in the Crimean War."
 tyr_ga_first_war:0 "The German Leadership War"
 tyr_ga_final_war:0 "The Final German War"
 tyr_ga_first_goal:0 "German Leadership"
 tyr_ga_first_goal_desc:0 "Settle the leadership of the German states. A northern victory also transfers the southern German states and forms Germany. Occupation alone cannot automatically enforce this settlement."
 tyr_ga_final_goal:0 "The German Settlement"
 tyr_ga_final_goal_desc:0 "$war_goal_tyr_ga_final_goal_type_desc$"
 tyr_ga.1.a:0 "Our future lies on the Danube."
 tyr_ga.1.b:0 "The German question is not settled."
 tyr_ga.2.a:0 "The crown endures in Budapest."
 tyr_ga.1.t:0 "The Southern Defeat"
 tyr_ga.1.d:0 "The northern court has taken the southern German states and proclaimed a united Germany. Vienna must decide whether to accept the settlement and turn to the Hungarian question, or prepare for a final contest in which the Austrian heartlands themselves will be at stake."
 tyr_ga.2.t:0 "The Habsburg Court in Exile"
 tyr_ga.2.d:0 "The German army has secured the Austrian heartlands. The court has withdrawn to Budapest, gathering its remaining crowns into a single kingdom. The work of reconciling their peoples now falls to the Hungarian government."
 tyr_ga_release_crowns:0 "Recognize the independence of the eastern and Italian crowns."
 tyr_ga_release_crowns_tt:0 "The consolidated Hungarian crown, Galicia-Lodomeria with Bukovina, and the Italian crowns are independent. Slovenia and Trieste belong to Hungary."
 je_tyr_ga_danubian_federation:0 "The Danubian Federation"
 je_tyr_ga_danubian_federation_reason:0 "The Habsburg court has established itself in Hungary, but its remaining lands are inhabited by peoples with their own claims to political recognition. A federal settlement must reconcile these crowns and give their cultures a place in the new state."
 tyr_ga_je_danubian_federation:0 "The Federal Solution"
 tyr_ga_federation.1.t:0 "The [SelectLocalization(SCOPE.sCharacter('relevant_character').IsValid, SCOPE.sCharacter('relevant_character').GetLastName, 'Federal')] Proposal"
 tyr_ga_federation.1.d:0 "[SCOPE.sCharacter('relevant_character').GetFullName], a [SCOPE.sCharacter('relevant_character').GetCulture.GetName] advocate for nationality rights, has presented a proposal for the re-organization of the Empire into a federal, multi-ethnic state. [SCOPE.sCharacter('relevant_character').GetHerHis|U] proposal has become popular amongst like-minded associates of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 tyr_ga_federation.1.d_mil:0 "[SCOPE.sCharacter('relevant_character').GetFullName], an influential figure within the [SCOPE.sCharacter('relevant_character').GetInterestGroup.GetName], has presented a proposal to restore the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s authority through federalizing the Empire. [SCOPE.sCharacter('relevant_character').GetHerHis|U] proposal has become popular amongst like-minded members of the court."
 tyr_ga_federation.1.f:0 "\"From this point of view, then, it is not a question of the \"downfall\", but of the reorganisation, of a rebirth of [ROOT.GetCountry.GetNameNoFormatting]. If only all those who sincerely care for this empire could, even in their dark longing, become fully aware of the right way forward. Firstly, it is not true that only independent national states have a right to exist. $SWI$, the much and rightly cited example, is the type of a mixed-national polity, and no one would reasonably want to deny it the right to exist. In fact, in our empire, the historical process is merely struggling for a modern form of national-state relations that corresponds to its newly awakened needs.\"\n\n— Aurel Popovici, #italic The United States of Greater Austria#!"
 tyr_ga_federation.1.a:0 "This is the reform [ROOT.GetCountry.GetNameNoFormatting] needs."
 tyr_ga_federation.1.b:0 "We cannot hope to manage this now."
 tyr_ga_federation.2.t:0 "The Other Course"
 tyr_ga_federation.2.d:0 "The declaration of the [ROOT.GetCountry.GetName] has established the a-national union as a solid alternative to the prevailing nation-state model. Where others may draw legitimacy from shared blood, we will draw our strength from the dynasty and the diversity of our peoples."
 tyr_ga_federation.2.f:0 "\"Joy, thou shining spark of God,\nDaughter of Elysium,\nWith fiery rapture, goddess,\nWe approach thy shrine!\nYour magic reunites those\nWhom stern custom has parted;\nAll men will become brothers\nUnder your protective wing.\"\n\n— Friedrich Schiller, \"Ode to Joy\""
 tyr_ga_federation.2.a:0 "The Empire unites all its peoples."
 tyr_ga_federation.2.b:0 "Three cheers to the people's Emperor!"
 tyr_ga_federation.3.t:0 "The Bohemian Question"
 tyr_ga_federation.3.desc:0 "For hundreds of years, the lands of the former Bohemian Crown have been inhabited by both [SCOPE.sCulture('czech_culture').GetName] and [GetCulture('south_german').GetName] populations. If a [GetCulture('czech').GetNameNoFormatting] state within the Federation is to be established, the question of the Bohemian and Moravian Germans must be resolved."
 tyr_ga_federation.3.f:0 "\"Why does the map look like that? It's an odd shape, isn't it?\"\n\n\"The Bohemians invited them in, some hundred years ago. Back then, it didn't matter if one was German or Czech, all were equal under God and King. If you ask me, they should both be blaming the Protestants.\""
 tyr_ga_federation.3.a:0 "The Bohemian and Moravian Germans must have their states."
 tyr_ga_federation.3.b:0 "Bohemia will be unified, with the Germans as equal citizens."
 tyr_ga_federation.3.c:0 "If the Germans may have autonomy, the Czechs may have Slovakia."
 tyr_ga_federation.3.d:0 "Czechoslovakia will be united, without any reservations."
 tyr_ga_federation.4.t:0 "The Fate of Slovakia"
 tyr_ga_federation.4.desc:0 "The lands inhabited by the [SCOPE.sCulture('slovak_culture').GetName] people have long been entangled with Hungary. To entertain the thought of splitting [SelectLocalization(SCOPE.sState('slovakia_state').IsValid, SCOPE.sState('slovakia_state').GetName, 'STATE_SLOVAKIA')] from Hungary is certain to anger [GetCulture('hungarian').GetName] nationalists, yet may secure the credibility of our project with the other West Slavic peoples."
 tyr_ga_federation.4.f:0 "\"It was the Hungarian capital. You should really tread carefully on this matter.\"\n\n\"And did the Slovaks ask for it to be the Hungarian capital? Why should they be deprived on Hungary's account? We should consider the opinions of those who live in the region, and them alone. I'm growing quite sick of realpolitik.\""
 tyr_ga_federation.4.a:0 "Organize a [SCOPE.sCulture('slovak_culture').GetName] state."
 tyr_ga_federation.4.b:0 "Condition a [SCOPE.sCulture('slovak_culture').GetName] state on autonomy for the Zipser Germans."
 tyr_ga_federation.4.c:0 "Slovakia will be retained as a part of Hungary."
 tyr_ga_federation.4.d:0 "Endorse a shared state for Czechs and Slovaks."
 tyr_ga_federation.5.t:0 "The Future of Galicia"
 tyr_ga_federation.5.desc:0 "The region of Galicia represents [ROOT.GetCountry.GetNameNoFlag]'s spoils from the Polish Partitions. Whilst the territory has traditionally been dominated by [SCOPE.sCulture('polish_culture').GetName] aristocrats, much of its East possessses a [GetCulture('ukrainian').GetName] majority. To secure [SCOPE.sCulture('polish_culture').GetNameNoFormatting] support, we must arrange a favorable partition."
 tyr_ga_federation.5.f:0 "\"What do you think? Where do we draw the line?\"\n\n\"The Ruthenes have lower expectations than the Poles. A neat separation of the East from West will please them, yet anger the Poles, who naturally expect more. Hand Lemberg to the Poles, and the Ruthenes may still be willing to indulge us in return for some other concession. I do not envy your task, but it may well prove feasible.\""
 tyr_ga_federation.5.a:0 "Limit the [GetCulture('polish').GetName] state to West Galicia."
 tyr_ga_federation.5.b:0 "Partition Galicia, with Lwów under [GetCulture('polish').GetName] authority."
 tyr_ga_federation.5.c:0 "Retain the whole of Galicia as a [GetCulture('polish').GetName] state."
 tyr_ga_federation.6.t:0 "The Partition of Hungary"
 tyr_ga_federation.6.desc:0 "The traditional borders of Hungary include many sizable non-[SCOPE.sCulture('hungarian_culture').GetName] regions. We must choose between either appeasing the [SCOPE.sCulture('hungarian_culture').GetName] people, or partitioning Hungary and provoking [SCOPE.sCulture('hungarian_culture').GetNameNoFormatting] opposition to the federal project."
 tyr_ga_federation.6.desc_dual:0 "The [SCOPE.sCulture('hungarian_culture').GetName] nation has long been a co-equal half of our Empire, reigning essentially unchecked over a greatly diverse territory. We must choose between either appeasing [SCOPE.sCountry('hungary_scope').GetNameNoFlag], or granting its nationalities their own states and provoking [SCOPE.sCulture('hungarian_culture').GetNameNoFormatting] reaction."
 tyr_ga_federation.6.f:0 "\"I often worry that this plan is unworkable. Won't the Hungarians revolt?\"\n\n\"A Chinese general is delayed by the rain, and asks his attaché what the penalty for being late is. \"Death\", he replies. And then he asked the penalty for revolt - the same, of course. And that is how the Dynasty fell. The situation we have with the Hungarians is quite the same. If they'll revolt at the smallest concession, why shouldn't we push the largest?\""
 tyr_ga_federation.6.a:0 "Preserve historical Hungary within the Federation."
 tyr_ga_federation.6.b:0 "The [GetCulture('hungarian').GetCustom('getPluralDemonym')] must only give up Slovakia."
 tyr_ga_federation.6.c:0 "Partition Croatia and Transylvania from Hungary."
 tyr_ga_federation.6.d:0 "Reduce Hungary to the Hungarian-majority lands."
 tyr_ga_federation.7.t:0 "The Slovene Lands"
 tyr_ga_federation.7.desc:0 "The [SCOPE.sCulture('slovene_culture').GetName] people, largely centred in the region of [SCOPE.sState('slovenia_scope').GetName], are one of the several South Slavic nationalities of our Empire. We must consider whether the [SCOPE.sCulture('slovene_culture').GetName] state shall be one of many South Slavic states, or if it will be placed in union with other, similar peoples."
 tyr_ga_federation.7.desc_istria:0 "The [SCOPE.sCulture('slovene_culture').GetName] claims to [SelectLocalization(SCOPE.sState('istria_scope').IsValid, SCOPE.sState('istria_scope').GetName, 'STATE_ISTRIA')] in the South of our Empire conflict with those of both the [GetCulture('croat').GetName] and [GetCulture('north_italian').GetName] peoples. Additionally, there exists the question of if the [SCOPE.sCulture('slovene_culture').GetName] state shall be one of many South Slavic states, or if it will be placed in union with other, similar peoples."
 tyr_ga_federation.7.f:0 "\"Now, if you look at the coast, you'll see that the South is largely Croatian, and the North is Italian. The Slovene part is somewhere in the middle. It's a bit of a knot, but I imagine we can untangle it before lunch. Sistiana is a good enough port, isn't it?\""
 tyr_ga_federation.7.a:0 "The Slovene state will extend to the sea."
 tyr_ga_federation.7.b1:0 "Favor Croatian and Italian claims to [SelectLocalization(SCOPE.sState('istria_scope').IsValid, SCOPE.sState('istria_scope').GetName, 'STATE_ISTRIA')]."
 tyr_ga_federation.7.b2:0 "Create a Slovene state in [SCOPE.sState('slovenia_scope').GetName]."
 tyr_ga_federation.7.c:0 "There are already enough Slavic states in our Empire."
 tyr_ga_federation.7.d:0 "Grant a Slovene-Croat union, without German and Italian lands."
 tyr_ga_federation.7.e:0 "Endorse a state for all South Slavs within the Federation."
 tyr_ga_federation.8.t:0 "The Triune Kingdom"
 tyr_ga_federation.8.desc:0 "The crownlands inhabited by the [SCOPE.sCulture('croat_culture').GetName] people have been split between [ROOT.GetCountry.GetNameNoFlag] and [GetCulture('hungarian').GetName] jurisdiction since our acquisition of Venice's former territories. If we wish to satisfy the [SCOPE.sCulture('croat_culture').GetCustom('getPluralDemonym')], we must unite all [SCOPE.sCulture('croat_culture').GetNameNoFormatting] people under a [SCOPE.sCulture('croat_culture').GetNameNoFormatting] state."
 tyr_ga_federation.8.desc_triune:0 "The establishment of [SelectLocalization(SCOPE.sCountry('croatia_scope').IsValid, SCOPE.sCountry('croatia_scope').GetName, 'CRO')] has satisfied a long-standing [SCOPE.sCulture('croat_culture').GetName] demand for the unification of their people under a single polity. We must now consider whether the [SCOPE.sCulture('croat_culture').GetName] state shall be one of many South Slavic states, or if it will be placed in union with other, similar peoples."
 tyr_ga_federation.8.f:0 "The question of the South Slavs was difficult enough to provoke an ulcer. Hungary had been a thorn in [ROOT.GetCountry.GetCapital.GetCityHubName]'s side for long enough for the surveyor to be hesitant about suggesting another powerful administration. But the prospect of an Illyria both powerful and unfalteringly loyal... perhaps. Perhaps, if everything went exactly right."
 tyr_ga_federation.8.a:0 "Limit the Croatian state to [ROOT.GetCountry.GetAdjective] Croatia."
 tyr_ga_federation.8.b:0 "Preserve the existing Triune Kingdom within the Federation."
 tyr_ga_federation.8.c:0 "Unify the Croat lands under a Triune Kingdom."
 tyr_ga_federation.8.d:0 "Organize a union between the Slovene and Croat lands."
 tyr_ga_federation.8.e:0 "Endorse a state for all South Slavs within the Federation."
 tyr_ga_federation.9.t:0 "Beyond the Forest"
 tyr_ga_federation.9.desc:0 "The crownlands inhabited by the [SCOPE.sCulture('romanian_culture').GetName] are some of the most diverse in our Empire. The establishment of any [SCOPE.sCulture('romanian_culture').GetNameNoFormatting] territory at all is certain to alarm [GetCulture('hungarian').GetName] nationalists, and pockets of [GetCulture('south_german').GetName] people throughout the region worry over autonomy."
 tyr_ga_federation.9.f:0 "\"We'll need at least three autonomies, here. Possibly more. Where did all of these Germans come from?\"\n\n\"We settled them here—quite recently, after the last war with the Turks. They're coming back to haunt us one last time, it seems.\""
 tyr_ga_federation.9.a:0 "Grant the Romanian state Banat and all Transylvania."
 tyr_ga_federation.9.b:0 "Grant the Romanian state everything except for Szekeler Land."
 tyr_ga_federation.9.c:0 "Transylvania is Romanian, but Banat is German."
 tyr_ga_federation.9.d:0 "Reduce the Romanian state to the South of Transylvania."
 tyr_ga_federation.9.e:0 "All of Transylvania is irrevocably Hungarian."
 tyr_ga_federation.10.t:0 "The Western Fringe"
 tyr_ga_federation.10.desc:0 "The nationalist currents sweeping the Italian peninsula have already stripped us of much of our Italian territories. If the support of the remaining [SCOPE.sCulture('north_italian_culture').GetName] population is to be secured, the outstanding conflicts between Italian, [GetCulture('slovene').GetName], and [GetCulture('south_german').GetName] territories must be resolved."
 tyr_ga_federation.10.desc_lomven:0 "The [SCOPE.sCulture('north_italian_culture').GetName] people are one of the most influential nationalities in the Empire, due to the population and economic might of the Italian crownlands. If their support is to be secured for federalization, the outstanding conflicts between Italian, [GetCulture('slovene').GetName], and [GetCulture('south_german').GetName] territories must be resolved."
 tyr_ga_federation.10.f:0 "\"I've received a letter from the Navy. It asks me to be generous to the Italians, in the name of recruitment numbers.\"\n\n\"I'm not surprised. They're quite an Italian institution.\"\n\n\"I've also received a letter from Palermo. That one asks me to... well, I won't repeat it here.\"\n\n\"I hate to say it, but that's even more Italian.\""
 tyr_ga_federation.10.a:0 "Trento and Trieste shall both be Italian."
 tyr_ga_federation.10.b:0 "Trento shall be Italian, but Trieste is Slavic."
 tyr_ga_federation.10.c:0 "Trieste is sufficient on its own."
 tyr_ga_federation.10.d:0 "Lombardy-Venetia is representation enough."
 tyr_ga_federation.10.e:0 "Such tiny populations do not warrant their own states."
 tyr_ga_federation.11.t:0 "The Borderland"
 tyr_ga_federation.11.desc:0 "The [SCOPE.sCulture('ukrainian_culture').GetName] population of [SelectLocalization(SCOPE.sState('east_galicia_state').IsValid, SCOPE.sState('east_galicia_state').GetName, 'STATE_EAST_GALICIA')] has, since the days of the Commonwealth, been ruled by [GetCulture('polish').GetName] elites. The largely-[GetCulture('polish').GetNameNoFormatting] population of the city of [SelectLocalization(SCOPE.sState('east_galicia_state').IsValid, SCOPE.sState('east_galicia_state').GetCityHubName, 'HUB_NAME_STATE_EAST_GALICIA_city_polish')] has requested autonomy under a [GetCulture('polish').GetNameNoFormatting] state. To accept would appease the [GetCulture('polish').GetCustom('getPluralDemonym')], yet deny the [SCOPE.sCulture('ukrainian_culture').GetNameNoFormatting] state a vital economic engine."
 tyr_ga_federation.11.f:0 "\"Galicia? There's a peculiar dynamic, there. The aristocrats loathe the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], but the peasants adore [ROOT.GetCountry.GetRuler.GetHerHim]. The last time the aristocrats—Poles, mostly—tried to revolt, the peasants stormed their manors and strung them up. We were obliged to send in the Army to protect the would-be rebels. If one were to ask me, I would say that earned the Ruthenes their state, right then and there.\""
 tyr_ga_federation.11.a:0 "Grant the Ukrainian state all of East Galicia."
 tyr_ga_federation.11.b:0 "Create a Ukrainian state in East Galicia, with Lwów under Polish authority."
 tyr_ga_federation.11.c:0 "Offer the Ukrainians Bukovina in return for a Polish Lwów."
 tyr_ga_federation.11.d:0 "All of Galicia is Polish territory."
 tyr_ga_federation.12.t:0 "The Serbs of [SelectLocalization(SCOPE.sState('vojvodina_state').IsValid, SCOPE.sState('vojvodina_state').GetName, 'STATE_DELVIDEK_serbian')]"
 tyr_ga_federation.12.desc:0 "The state of [SCOPE.sState('vojvodina_state').GetName] has long served as a centre of the [SCOPE.sCulture('serb_culture').GetName] culture. The [SCOPE.sCulture('serb_culture').GetNameNoFormatting] population of the region has requested the formation of a [SCOPE.sCulture('serb_culture').GetNameNoFormatting] state with its capital in [SCOPE.sState('vojvodina_state').GetCityHubName]. The proposal has been met with opposition by the local [GetCulture('hungarian').GetName] and [GetCulture('south_german').GetName] communities."
 tyr_ga_federation.12.f:0 "\"When you release the proposal, remember that only Hungarians call it Újvidék. Everyone else calls it Novi Sad. Neusatz, for us.\"\n\nThe surveyor crossed out the name. \"A rather messy region, isn't it?\"\n\n\"More than you could ever know. They once called that city the Serbian Athens—if we decide in their favor, it can be again.\""
 tyr_ga_federation.12.a:0 "Partition [SCOPE.sState('vojvodina_state').GetNameNoFormatting] off from Hungary as a Serbian state."
 tyr_ga_federation.12.b:0 "[SCOPE.sState('vojvodina_state').GetNameNoFormatting] must remain within Hungary."
 tyr_ga_federation.12.c:0 "Endorse a state for all South Slavs within the Federation."
 tyr_ga_je_danubian_federation_czech_button:0 "Address [GetCulture('czech').GetName] Concerns"
 tyr_ga_je_danubian_federation_slovak_button:0 "Address [GetCulture('slovak').GetName] Concerns"
 tyr_ga_je_danubian_federation_polish_button:0 "Address [GetCulture('polish').GetName] Concerns"
 tyr_ga_je_danubian_federation_hungarian_button:0 "Address [GetCulture('hungarian').GetName] Concerns"
 tyr_ga_je_danubian_federation_slovene_button:0 "Address [GetCulture('slovene').GetName] Concerns"
 tyr_ga_je_danubian_federation_croat_button:0 "Address [GetCulture('croat').GetName] Concerns"
 tyr_ga_je_danubian_federation_romanian_button:0 "Address [GetCulture('romanian').GetName] Concerns"
 tyr_ga_je_danubian_federation_north_italian_button:0 "Address [GetCulture('north_italian').GetName] Concerns"
 tyr_ga_je_danubian_federation_ukrainian_button:0 "Address [GetCulture('ukrainian').GetName] Concerns"
 tyr_ga_je_danubian_federation_serb_button:0 "Address [GetCulture('serb').GetName] Concerns"
 tyr_ga_je_danubian_federation_enact_the_federation:0 "Sign Federalization into Law"
 tyr_ga_je_danubian_federation_observer:0 "The Federal Project"
 tyr_ga_federation.13.t:0 "A Federal Empire"
 tyr_ga_federation.13.d:0 "The government of [SCOPE.sCountry('austria_scope').GetName] has officially endorsed a proposal to reorganize the Empire into a federal state. If successfully enacted, this would mean the end of [ROOT.GetCountry.GetNameNoFlag]'s current autonomy, and a possible loss of our historic territories."
 tyr_ga_federation.13.f:0 "\"From this point of view, then, it is not a question of the \"downfall\", but of the reorganisation, of a rebirth of [SCOPE.sCountry('austria_scope').GetNameNoFormatting]. If only all those who sincerely care for this empire could, even in their dark longing, become fully aware of the right way forward. Firstly, it is not true that only independent national states have a right to exist. $SWI$, the much and rightly cited example, is the type of a mixed-national polity, and no one would reasonably want to deny it the right to exist. In fact, in our empire, the historical process is merely struggling for a modern form of national-state relations that corresponds to its newly awakened needs.\"\n\n— Aurel Popovici, #italic The United States of Greater Austria#!"
 tyr_ga_federation.13.a:0 "There is a place for [ROOT.GetCountry.GetNameNoFlag] in the Federation."
 tyr_ga_federation.13.b:0 "If we must defend our sovereignty, so be it."
 tyr_ga_federation.14.t:0 "Off the Sinking Ship"
 tyr_ga_federation.14.d:0 "Our independence from [SCOPE.sCountry('austria_or_danubia_scope').GetName] has forever put an end to the risk of meddling from [SCOPE.sCountry('austria_or_danubia_scope').GetCapital.GetCityHubName]. Whether the [SCOPE.sCountry('austria_or_danubia_scope').GetAdjectiveNoFlag] government continues its project or not, we shall not be a part of it."
 tyr_ga_federation.14.f:0 "[ROOT.GetCountry.GetCapital.GetCityHubName] had begun to change. It was far deeper than the new flags and confetti in the gutters—[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] could see it in the café menus, the posted pamphlets, the conversations [SCOPE.sCharacter('name_a_scope').GetSheHe] heard on the streets. On his daily walk, he had come across a team of workers painting a Ministry building, burying the old schönbrunn yellow under a new coat of rust-red.\n\n\"This was a Habsburg city\", it had seemed to say, and so they had taken care of that. He wondered if they would come for the blue doors, too."
 tyr_ga_federation.14.a:0 "Long live the independent [ROOT.GetCountry.GetName]!"
 tyr_ga_federation.14.b:0 "We may offer forgiveness from afar."
 tyr_ga_federation.15.t:0 "[SCOPE.sCountry('relevant_subject').GetAdjective] Government Pledges Cooperation"
 tyr_ga_federation.15.d:0 "The government of [SCOPE.sCountry('relevant_subject').GetName] has pledged their full cooperation with our plan to federalize the Empire. Much of our [SCOPE.sCulture('primary_culture_scope').GetName] population stands behind their decision."
 tyr_ga_federation.15.f:0 "\"The Minister was smiling, earlier. Did you hear?\"\n\n[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]'s voice was barely louder than the clicks of his neighbor's spoon on porcelain. One of his colleagues looked over, raising an eyebrow at the comment.\n\n\"I almost don't believe it,\" he said. \"Where'd you hear that?\"\n\n\"I saw it myself. He was in the lobby, with some Colonel or another.\"\n\n\"The [SCOPE.sCulture('primary_culture_scope').GetCustom('getPluralDemonym')], I'd wager,\" said the man at the end of the table. \"A coach came from [SCOPE.sCountry('relevant_subject').GetCapital.GetCityHubName], last night, and they wouldn't say who was aboard. Something exciting's afoot.\""
 tyr_ga_federation.15.a:0 "The spirit of friendship blooms on the Danube."
 tyr_ga_federation.15.b:0 "Their input is not necessary."
 tyr_ga_federation.16.t:0 "[SCOPE.sCountry('relevant_subject').GetAdjective] Government Rejects Integration"
 tyr_ga_federation.16.d:0 "The government of [SCOPE.sCountry('relevant_subject').GetName] has pledged opposition to our plan to federalize the Empire. Much of our [SCOPE.sCulture('primary_culture_scope').GetName] population is likely to stand behind them."
 tyr_ga_federation.16.f:0 "The letter was full of the usual talk. National sovereignty, the overreach of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], the ancient rights and privileges of the [SCOPE.sCountry('relevant_subject').GetAdjectiveNoFormatting] lands. It was not the first such letter to be sent, and it would likely not be the last, yet it was the most inconvenient by far. A torpedo in the side of the Government's grand plan. The official placed it in the tray to be sent to the Minister.\n\nHis gaze settled on his colleague, sipping coffee on the other side of the room. \"Do we have another plan?\"\n\n\"I couldn't say.\"\n\n\"Because you don't know, or because it's a military secret?\"\n\n\"I couldn't say.\""
 tyr_ga_federation.16.a:0 "We will need to make do without them."
 tyr_ga_je_danubian_federation_observer_pledge_cooperation:0 "Pledge Cooperation"
 tyr_ga_je_danubian_federation_observer_reject_cooperation:0 "Reject Federalization"
 tyr_ga_phase_first:0 "[SCOPE.sCountry('tyr_ga_austria').GetName] and [SCOPE.sCountry('tyr_ga_north').GetName] each claim the right to lead Germany."
 tyr_ga_phase_choice:0 "[SCOPE.sCountry('tyr_ga_austria').GetName] weighs submission to [SCOPE.sCountry('tyr_ga_north').GetName] against another war."
 tyr_ga_phase_final:0 "[SCOPE.sCountry('tyr_ga_austria').GetName] and [SCOPE.sCountry('tyr_ga_north').GetName] will settle Germany's fate by the sword."
 tyr_ga_initial_crownland_lock_expired_tt:0 "The initial four-month restriction on crownland integration has expired."
 war_goal_tyr_ga_first_goal_type_name:0 "German Leadership"
 war_goal_tyr_ga_first_goal_type_desc:0 "Settle the leadership of the German states through a [concept_peace_deal] or capitulation. A northern victory also transfers the southern German states and forms Germany. Occupation alone does not automatically enforce this [concept_war_goal]."
 war_goal_tyr_ga_first_goal:0 "German Leadership"
 war_goal_tyr_ga_first_goal_desc:0 "Force [WAR_GOAL_DRAFT.GetTarget.GetName] to accept the leadership of [WAR_GOAL_DRAFT.GetHolder.GetName] over the German states. A northern victory also transfers the southern German states and forms Germany. This settlement requires a [concept_peace_deal] or capitulation; it cannot be enforced automatically through occupation."
 war_goal_tyr_ga_first_goal_sway_desc:0 "Offer to secure German leadership for [WAR_GOAL_DRAFT.GetHolder.GetName] against [WAR_GOAL_DRAFT.GetTarget.GetName]. A northern victory also transfers the southern German states and forms Germany."
 dp_tyr_ga_first_war:0 "The German Leadership War"
 dp_tyr_ga_first_war_desc:0 "Challenge the rival German court for leadership of the German states. A northern victory also transfers the southern German states and forms Germany."
 dp_tyr_ga_first_war_tooltip:0 "#header Start the German Leadership War [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_tyr_ga_first_war_desc$"
 war_goal_tyr_ga_final_goal_type_name:0 "The German Settlement"
 war_goal_tyr_ga_final_goal_type_desc:0 "Settle the German question. A Habsburg victory unites the German realms under Vienna and grants North German primary culture, while the Danubian and Italian crowns become independent. A northern victory transfers every North German or South German homeland state owned by the Habsburg realm to Germany; the Habsburg court retreats to Hungary and gathers its remaining possessions there."
 war_goal_tyr_ga_final_goal:0 "The German Settlement"
 war_goal_tyr_ga_final_goal_desc:0 "Impose the final German settlement on [WAR_GOAL_DRAFT.GetTarget.GetName] in favor of [WAR_GOAL_DRAFT.GetHolder.GetName].\n\n$war_goal_tyr_ga_final_goal_type_desc$"
 war_goal_tyr_ga_final_goal_sway_desc:0 "Offer to secure the final German settlement for [WAR_GOAL_DRAFT.GetHolder.GetName] against [WAR_GOAL_DRAFT.GetTarget.GetName].\n\n$war_goal_tyr_ga_final_goal_type_desc$"
 dp_tyr_ga_final_war:0 "The Final German War"
 dp_tyr_ga_final_war_desc:0 "Launch the final [concept_diplomatic_play] to decide the future of Germany and the Habsburg monarchy.\n\n$war_goal_tyr_ga_final_goal_type_desc$"
 dp_tyr_ga_final_war_tooltip:0 "#header Start the Final German War [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_tyr_ga_final_war_desc$"
 tyr_ga_opening_italy_tt:0 "Italian [concept_subject] status: #v $subject_type_tyr_habsburg_autonomous$#!. Remains in our [concept_market].\nPayments: #v 50%#! of the standard subject-payment base.\nCannot start [Concept('concept_diplomatic_play', 'diplomatic plays')] or join our wars.\n[concept_liberty_desire]: #r +0.5#! for #v 10 years#!."
 tyr_ga_opening_hungary_tt:0 "$HUN$:\n[concept_subject] status: #v $subject_type_tyr_habsburg_autonomous$#!. Remains in our [concept_market].\nPayments: #v 50%#! of the standard subject-payment base.\nCannot start [Concept('concept_diplomatic_play', 'diplomatic plays')] or join our wars.\nAnnexes and incorporates #v Croatia, Transylvania and Dalmatia#!.\nGains and incorporates #v Montenegro#! if held by Austria or its subjects.\n[concept_liberty_desire]: #g -0.5#! for #v 10 years#!."
 tyr_ga_opening_galicia_tt:0 "Releases $GAL$ with #v Galicia and Bukovina#!.\n[concept_subject] status: #v $subject_type_tyr_habsburg_autonomous$#!. Remains in our [concept_market].\nPayments: #v 50%#! of the standard subject-payment base.\nCannot start [Concept('concept_diplomatic_play', 'diplomatic plays')] or join our wars."
 tyr_ga_opening_return_tt:0 "May return to the normal Austrian path after losing the first German war.\n#g Retains reforms and bonuses already gained.#!"
 tyr_ga_map_rival_tt:0 "#bold [SCOPE.sCountry('tyr_ga_map_country').GetName]#!\nClaims the leadership of Germany."
 tyr_ga_map_candidate_tt:0 "#bold [SCOPE.sCountry('tyr_ga_map_country').GetName]#!\nTo unite with #v [SCOPE.sCountry('tyr_ga_map_destination').GetName]#!."
 tyr_ga_form_confederations:0 "Unite the German Confederations"
 tyr_ga_form_confederations_desc:0 "Forms the North German Confederation under Prussia and the South German Confederation under Austria, incorporating their respective German states.\nEstablishes a #v 3-year#! [concept_truce] between the two courts."
 tyr_ga_schleswig_solved_tt:0 "The Schleswig-Holstein Question has been resolved."
 tyr_ga_limited_war_maneuvers:0 "Limited German Demands"
 tyr_ga_limited_war_maneuvers_desc:0 "Both German courts restrict their demands to the settlement of the German question."
 tyr_ga.3.t:0 "The Austrian Settlement"
 tyr_ga.3.d:0 "[SCOPE.sCountry('tyr_ga_settlement_austria').GetName] has renounced the struggle for German leadership. We may seek a settlement with the Habsburg court, or claim Austria, Tyrol and Styria as lands of the German nation."
 tyr_ga.3.f:0 "The war has settled who shall lead Germany. It has left the question of her borders to the ministers."
 tyr_ga.3.a:0 "The Austrian lands belong to Germany."
 tyr_ga.3.b:0 "Let Vienna turn towards the Danube."
 tyr_ga.4.t:0 "The Lands of the Bohemian Crown"
 tyr_ga.4.d:0 "Our claims to the Austrian lands have raised demands for Bohemia and Moravia as well. Pressing these claims against [SCOPE.sCountry('tyr_ga_settlement_austria').GetName] will bring further condemnation from the courts of Europe."
 tyr_ga.4.f:0 "The petitioners point to the German towns. Their opponents point to the peoples who share those lands."
 tyr_ga.4.a:0 "Press our claims in Bohemia and Moravia."
 tyr_ga.4.b:0 "The Austrian claims are sufficient."
 tyr_ga_austrian_reapproach:0 "The Danubian Settlement"
 tyr_ga_austrian_reapproach_desc:0 "Vienna has accepted German leadership and turned its attention to the remaining Habsburg lands."
 notification_tyr_ga_reapproach_news_name:0 "[SCOPE.sCountry('tyr_ga_news_germany').GetName] Reconciles with [SCOPE.sCountry('tyr_ga_news_austria').GetName]"
 notification_tyr_ga_reapproach_news_desc:0 "#white #b [SCOPE.sCountry('tyr_ga_news_germany').GetName]#!#! has sought a rapprochement with #v [SCOPE.sCountry('tyr_ga_news_austria').GetName]#!."
 notification_tyr_ga_claims_austria_news_name:0 "[SCOPE.sCountry('tyr_ga_news_germany').GetName] Claims the Austrian Lands"
 notification_tyr_ga_claims_austria_news_desc:0 "#white #b [SCOPE.sCountry('tyr_ga_news_germany').GetName]#!#! has asserted [Concept('concept_claim', 'claims')] to #v Austria, Tyrol and Styria#!."
 notification_tyr_ga_claims_all_news_name:0 "[SCOPE.sCountry('tyr_ga_news_germany').GetName] Presses Claims to All German Lands"
 notification_tyr_ga_claims_all_news_desc:0 "#white #b [SCOPE.sCountry('tyr_ga_news_germany').GetName]#!#! has extended its [Concept('concept_claim', 'claims')] to #v Bohemia and Moravia#!."

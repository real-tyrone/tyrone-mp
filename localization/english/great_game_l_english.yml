 tyrone_great_game:0 "The Great Game"
 tyrone_great_game_reason:0 "Central Asia is becoming the board on which Britain and Russia test one another without declaring the real war aloud."
 tyrone_great_game_status:0 "Open the Great Game map to review the contested frontier and the regional pressure points."
 tyrone_great_game_journal_header:0 "Great Game Map"
 tyrone_great_game_journal_summary:0 "Track the frontier between Britain, Russia, Persia, Afghanistan, India, and the Ottoman borderlands."
 tyrone_great_game_open_map_button:0 "Open Great Game Map"
 tyrone_great_game_open_map_button_tt:0 "Open the regional Great Game interface."
 tyrone_great_game_window_title:0 "The Great Game"
 tyrone_great_game_area_select_prompt:0 "Select an area on the map to inspect its Great Game context."
 tyrone_great_game_area_kazakhstan:0 "Kazakhstan"
 tyrone_great_game_area_kazakhstan_desc:0 "The steppe frontier is the northern road of Russian expansion. Influence targets and protectorate pressure will be shown here."
 tyrone_great_game_area_mongolia:0 "Mongolia"
 tyrone_great_game_area_mongolia_desc:0 "Mongolia sits between the Russian frontier and Qing authority. Pressure here can open the eastern road of the Great Game."
 tyrone_great_game_area_ugyuristan:0 "Ugyuristan"
 tyrone_great_game_area_ugyuristan_desc:0 "The Tarim Basin marks the western gate into China. Russian influence and Qing weakness can be tracked here."
 tyrone_great_game_area_tibet:0 "Tibet"
 tyrone_great_game_area_tibet_desc:0 "Tibet is the highland buffer between China, India, and Central Asia. Control here can reshape the southern road of the Great Game."
 tyrone_great_game_area_china:0 "China"
 tyrone_great_game_area_china_desc:0 "China is the far eastern prize of the contest, where Russian ambitions may reach Manchuria, Mongolia, and the western marches."
 tyrone_great_game_area_ottoman:0 "Ottoman Frontier"
 tyrone_great_game_area_ottoman_desc:0 "The Eastern Question links the Crimean crisis to the wider Great Game. Britain will be expected to contain Russian gains here."
 tyrone_great_game_area_persia:0 "Persia"
 tyrone_great_game_area_persia_desc:0 "Persia is the hinge between the Caucasus, Herat, and the road to India. Forced proxy actions can be routed through this area."
 tyrone_great_game_area_afghanistan:0 "Afghanistan"
 tyrone_great_game_area_afghanistan_desc:0 "Afghanistan is the central buffer. Influence, proxy wars, and the Herat question will be tracked here."
 tyrone_great_game_area_pakistan:0 "Pakistan"
 tyrone_great_game_area_pakistan_desc:0 "The western approaches to India become critical if Russian pressure reaches the Indus frontier."
 tyrone_great_game_area_india:0 "India"
 tyrone_great_game_area_india_desc:0 "India is Britain's strategic core. Future revolts and Russian breakthrough objectives can be surfaced here."
 tyrone_great_game_area_burma:0 "Burma"
 tyrone_great_game_area_burma_desc:0 "Burma forms the eastern approach to British India and a possible pressure point between India and China."
 tyrone_great_game_area_arabia:0 "Arabia and Levant"
 tyrone_great_game_area_arabia_desc:0 "The Levant, Kurdistan, and Arabia form the southern flank of the contest with the Ottoman Empire."
 tyrone_great_game_area_countries_header:0 "Regional Governments"
 tyrone_great_game_area_countries_prompt:0 "Select a Great Game area to review its independent governments."
 tyrone_great_game_area_countries_untracked:0 "This theatre is not yet part of the Great Game country registry."
 tyrone_gg.1.t:0 "The Great Game: Chessboards of Empires"
 tyrone_gg.1.d:0 "The Board of Control has received another bundle of dispatches from the northwest. Persia watches [SCOPE.sState('tyrone_gg_herat').GetName], Kabul is ruled uneasily by Dost Mohammad, and [SCOPE.sCountry('tyrone_gg_rival').GetAdjective] officers and merchants are increasingly visible beyond the Oxus. No single report constitutes a crisis, but together they sketch a most uncomfortable possibility: a rival power learning the roads to India."
 tyrone_gg.1.f:0 "Beneath the lamps of Whitehall, the map of Asia lies unfurled like a campaign standard. A thin red line runs from the Indus to [SCOPE.sState('tyrone_gg_kabul').GetName]; another, fainter but unmistakable, descends from the Caucasus toward [SCOPE.sState('tyrone_gg_herat').GetName]. The senior clerk rests one gloved finger upon the empty country between them. ‘Empires are not defeated by the territories they possess, my lord,’ he murmurs. ‘They are defeated by the roads they permit another empire to learn.’\n\nEvery expedition, subsidy, and treaty in these mountain passes may become a [concept_diplomatic_play] in miniature—and a test of [concept_relations] with [SCOPE.sCountry('tyrone_gg_rival').GetName]."
 tyrone_gg.1.a:0 "Set the pieces upon the board."
 tyrone_gg.2.t:0 "The Great Game: Chessboards of Empires"
 tyrone_gg.2.d:0 "Reports from Orenburg, Tiflis, and Tehran describe a frontier in motion. The khanates quarrel, Persia seeks to recover [SCOPE.sState('tyrone_gg_herat').GetName], and Afghanistan remains divided around [SCOPE.sState('tyrone_gg_kabul').GetName]. [SCOPE.sCountry('tyrone_gg_rival').GetAdjective] agents speak loudly of trade and security, yet their concern is plain: they fear that Russia may one day find a road to India."
 tyrone_gg.2.f:0 "In the winter light of the ministry, a young officer of the Orenburg Line places a caravan map before the minister. Its margins are crowded with wells, passes, fortresses, and the temperaments of local khans. Beyond [SCOPE.sState('tyrone_gg_kabul').GetName] and [SCOPE.sState('tyrone_gg_herat').GetName], the roads are not merely roads: they are the squares upon which empires move their pieces.\n\n‘Your Excellency,’ he says, ‘the English have discovered that geography is a form of diplomacy. We should not permit them to keep the secret.’ A fort, a caravan contract, or a new client in this [concept_strategic_region] may become the opening move of a [concept_diplomatic_play] with [SCOPE.sCountry('tyrone_gg_rival').GetName]."
 tyrone_gg.2.a:0 "Marshal the eastern papers."

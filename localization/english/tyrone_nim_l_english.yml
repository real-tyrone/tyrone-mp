l_english:
 je_tyrone_csr_independent_path:0 "A Nation in the Making"
 je_tyrone_csr_independent_path_reason:0 "Independence has placed the government of India in Indian hands. #v Princes#! and #v provincial representatives#! now dispute how far the authority of the new state should reach, while demands for separation challenge its claim to speak for the whole country.\n\nA constitution must give that authority a settled form. Whether India adopts a [GetLawType('law_monarchy').GetName] or a [GetLawType('law_parliamentary_republic').GetName], its government will need a working administration, public schools and an army bound to the country. The western and eastern disputes must find their own settlements."
 je_tyrone_nim_assembly:0 "Constituent Assembly"
 je_tyrone_nim_assembly_reason:0 "The assembly must decide where sovereignty will rest. #v Monarchists#! seek a single crown with the authority to govern the provinces; #v federalists#! argue that a [GetLawType('law_parliamentary_republic').GetName] can accommodate their competing claims.\n\nOutside the chamber, independence has raised expectations that constitutional debate alone cannot satisfy. #v Socialists#! demand changes in property and political power, and may turn against an assembly that leaves those questions unanswered."
 je_tyrone_nim_pakistan:0 "The Western Question"
 je_tyrone_nim_pakistan_reason:0 "In the western provinces, #v advocates of Pakistan#! contest the authority of the Indian government. Provincial interests and the demand for a separate state have brought the limits of the union into dispute.\n\nNegotiation may secure a place for these provinces within India, while a protectorate would leave them a government of their own. Repression risks strengthening the cause it seeks to silence, and separation may place the settlement beyond the assembly’s hands."
 je_tyrone_nim_bengal:0 "The Eastern Question"
 je_tyrone_nim_bengal_reason:0 "In eastern Bengal, #v advocates of separation#! demand a government able to answer local claims. The Indian government must persuade them that membership of the union can offer more than obedience to a distant capital.\n\nConcessions and local development may give a settlement firmer support. Autonomy would preserve a looser connection with India, but neither an agreement nor force can guarantee that the demand for independence will subside."
 je_tyrone_nim_administration:0 "The Provincial Settlement"
 je_tyrone_nim_administration_reason:0 "The constitution leaves #v provincial officials#! with the work of making its authority effective. Public business requires offices capable of collecting revenue and carrying decisions beyond the capital.\n\nA government dependent on uneven local arrangements will struggle to fulfil its obligations. An adequately staffed administration can give the constitutional settlement a regular presence in the provinces."
 je_tyrone_nim_schools:0 "A Common School"
 je_tyrone_nim_schools_reason:0 "Independence has made education a question for the Indian state. #v Teachers#! and #v reformers#! seek public provision broad enough to reach families whose circumstances have kept schooling beyond their means.\n\nUnder [GetLawType('law_public_schools').GetName], the government can accept a common obligation to educate its people. That promise will require schools able to carry learning beyond the narrow circles already served."
 je_tyrone_nim_army:0 "An Army for India"
 je_tyrone_nim_army_reason:0 "The army must serve the independent government through a common command. #v Officers#! and #v soldiers#! require settled duties, reliable supplies and training suited to service across the country.\n\nReorganizing that force will place demands on the treasury and civil administration. Each reform must be put into practice before the next can rest upon it."
 je_tyrone_nim_citizens:0 "Citizens of India"
 je_tyrone_nim_citizens_reason:0 "A constitutional government must decide who belongs to the political nation. #v India’s peoples#! have claims that cannot be settled solely by drawing a boundary around the country.\n\nEducation and improving livelihoods may strengthen attachment to the union, but citizenship also requires recognition in law. [GetLawType('law_cultural_exclusion').GetName] or [GetLawType('law_multicultural').GetName] can give that recognition a broader foundation."
 je_tyrone_nim_industry:0 "The Industrial Awakening"
 je_tyrone_nim_industry_reason:0 "The growth of towns is changing the demands placed upon India’s provinces. #v Manufacturers#! seek room for production and trade in regions still organized around rural conditions.\n\nWhere urban industry has become established, those older restrictions can be reconsidered. Such changes will follow the development of particular regions, even while other parts of the country remain chiefly agricultural."
 je_tyrone_nim_socialist:0 "Five-Year Plans"
 je_tyrone_nim_socialist_reason:0 "The revolution has inherited a country whose workshops, fields, and transport lines were built to serve unequal interests. #v The cooperatives#! must now provide the machinery, food, and public works on which their independence depends."
 je_tyrone_nim_civil_war:0 "The War of the Princes"
 je_tyrone_nim_civil_war_reason:0 "The #v princes#! and the governments drawn into their cause have formed a common front against the revolution. Their territories and forces now sustain a rival claim to rule.\n\nThe #v revolutionary army#! must defeat this coalition and reunite its territories with India. Until the war is settled, the authority of the new government remains contested by force."
 law_india_national_secretariat:0 "The National Secretariat"
 law_india_national_secretariat_desc:0 "A central secretariat directs provincial administration under the crown. Salaried officials and aristocratic influence sustain its authority, while the demands of central government weigh on public institutions."
 law_india_federal_secretariats:0 "Federal Secretariats"
 law_india_federal_secretariats_desc:0 "Provincial secretariats administer a federal constitutional settlement. The accommodation of provincial claims strengthens acceptance of the government, at the expense of administrative and fiscal capacity."

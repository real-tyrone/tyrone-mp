 tyrone_nim.1.t:0 "A Nation in the Making"
 tyrone_nim.1.d:0 "India has won the right to govern itself. The assembly must now determine the form of the state and the authority of its provinces. In the west and in eastern Bengal, demands for separation already challenge the reach of the new government. Independence leaves these disputes in Indian hands."
 tyrone_nim.1.f:0 "The crowd waited beyond the doors while the delegates took their seats. Inside, the first speaker asked who had authority to call the meeting to order."
 tyrone_nim.1.a:0 "Convene the assembly."
 tyrone_nim.2.t:0 "The Crown and the Provinces"
 tyrone_nim.2.d:0 "The assembly has approved a monarchical constitution. A central secretariat will administer the settlement under the crown. Its supporters expect a single authority to hold the provinces together. Opponents must now conduct their political struggle within the order the assembly has established."
 tyrone_nim.2.f:0 "The seal was pressed into the document. A delegate near the door remained seated as the chamber rose."
 tyrone_nim.2.a:0 "Promulgate the constitution."
 tyrone_nim.3.t:0 "A Federal Constitution"
 tyrone_nim.3.d:0 "The assembly has approved a federal parliamentary republic. Provincial secretariats will administer the constitutional settlement. Federalists have secured recognition for the claims of the provinces within the union. The government must now make this division of authority work in public life."
 tyrone_nim.3.f:0 "The delegates signed in turn. Several paused over the clauses they had spent so long disputing."
 tyrone_nim.3.a:0 "Promulgate the constitution."
 tyrone_nim.4.t:0 "The Work of Independence"
 tyrone_nim.4.d:0 "India has established a constitution and the institutions required to administer it. The public school system and the national army have taken their place within the settlement. Both regional crises have reached a resolution, with their consequences for the country’s territory and authority. Questions of citizenship and industrial development remain open to further work."
 tyrone_nim.4.f:0 "The minister found the old programme folded among the papers on his desk. Beside each undertaking, someone had written the date of its settlement."
 tyrone_nim.4.a:0 "Let the government continue its work."
 tyrone_nim.5.t:0 "The Provincial Settlement"
 tyrone_nim.5.d:0 "The government has established the administrative capacity required by its provincial settlement. Its offices can carry a greater share of public business through regular channels. Officials have a firmer basis for putting the constitution into practice. The settlement gives the government an opportunity to earn wider acceptance through its daily work."
 tyrone_nim.5.f:0 "A provincial official returned a petition with the name of the office responsible written clearly beneath it. The petitioner no longer had to guess where to go."
 tyrone_nim.5.a:0 "Put the administration to work."
 tyrone_nim.6.t:0 "A Common School"
 tyrone_nim.6.d:0 "Public education has reached the footing sought by the government. Wider literacy gives more people access to the written affairs of public life. Teachers can carry new social ideas into communities previously less able to encounter them. The state’s educational commitment has begun to acquire substance beyond the wording of the law."
 tyrone_nim.6.f:0 "The pupil read the passage again, this time without waiting for the teacher to supply the words."
 tyrone_nim.6.a:0 "Support the public classroom."
 tyrone_nim.7.t:0 "An Army for India"
 tyrone_nim.7.d:0 "The final army reform has been completed. Command and service now rest upon the national arrangements established during the reorganization. The force has overcome the disorder that attended its formation. Its preparations give India an army better suited to defending its own territory."
 tyrone_nim.7.f:0 "The officer waited until the last formation had passed. Only then did he lower the hand held at his cap."
 tyrone_nim.7.a:0 "Entrust them with the defense of India."
 tyrone_nim.8.t:0 "Citizens of India"
 tyrone_nim.8.d:0 "The work of common citizenship has reached its conclusion. The country’s legal settlement and growing attachment to the union allow broader recognition of India’s peoples. Their place within the state is now acknowledged in the definition of the political nation. The government must answer to the obligations that recognition brings."
 tyrone_nim.8.f:0 "The man asked whether the heading applied to his family as well. The official turned the form so that he could read it."
 tyrone_nim.8.a:0 "Recognize the peoples of India."
 tyrone_nim.10.t:0 "The Assembly under Siege"
 tyrone_nim.10.d:0 "Socialist agitation has brought the constitutional proceedings to a crisis. Supporters of revolution demand that the government yield to a new political and economic order. Emergency repression could preserve the assembly for the present, at a heavy cost to its authority. If that expedient fails and the crisis returns, the revolutionary challenge will no longer be containable."
 tyrone_nim.10.f:0 "From the chamber, the delegates could hear the meeting outside. The speaker had stopped trying to make himself heard over it."
 tyrone_nim.10.a:0 "Stand with the revolution."
 tyrone_nim.10.b:0 "Declare emergency repression."
 tyrone_nim.11.t:0 "The Indian Social Revolution"
 tyrone_nim.11.d:0 "A revolutionary government has taken power and established a council republic. It has adopted cooperative ownership as the basis of its economic settlement. The princes and the governments allied to them have united against the revolution. Civil war will decide whether the new government can bring their territories under its authority."
 tyrone_nim.11.f:0 "At the factory gate, a notice named the new government. By evening another notice called for volunteers to defend it."
 tyrone_nim.11.a:0 "Defend the revolution."
 tyrone_nim.12.t:0 "The Princely Front Defeated"
 tyrone_nim.12.d:0 "The counterrevolutionary coalition has been defeated. Its territories have been reunited under the revolutionary government. The princes can no longer maintain their common front in arms. The government must now consider the reforms that will follow its victory."
 tyrone_nim.12.f:0 "The last dispatch was read aloud to those still waiting in the room. Nobody asked for it to be repeated."
 tyrone_nim.12.a:0 "Turn to the work of government."
 tyrone_nim.13.t:0 "The Government Survives"
 tyrone_nim.13.d:0 "The revolutionary capital has fallen under enemy occupation. Despite that reverse, the counterrevolutionary coalition has been forced to capitulate. The revolutionary government survives and the war is brought to its conclusion. Its dependence on this rescue has left its authority and public standing gravely weakened."
 tyrone_nim.13.f:0 "The messenger carried news of surrender into a room already preparing for evacuation. The packed cases remained beside the door."
 tyrone_nim.13.a:0 "Accept the surrender."
 tyrone_nim.70.t:0 "#yellow Pakistan: Independence Declared#!"
 tyrone_nim.70.d:0 "The western crisis has ended in Pakistani independence. The separatist movement’s challenge has carried the disputed territories beyond Indian authority. The government must decide whether to accept the separation or demand reunion through a diplomatic play. An attempt to reverse it will place a further burden on the army."
 tyrone_nim.70.f:0 "The official removed the old heading from the noticeboard. A crowd had gathered before its replacement was ready."
 tyrone_nim.70.a:0 "Accept Pakistani independence."
 tyrone_nim.70.b:0 "Demand reannexation."
 tyrone_nim.71.t:0 "#yellow Bangladesh: Independence Declared#!"
 tyrone_nim.71.d:0 "The eastern crisis has ended in the independence of Bangladesh. The demand for a separate government has prevailed in the disputed eastern territories. India must decide whether to recognize the settlement or seek reannexation through a diplomatic play. The attempt to restore its authority will strain military preparations."
 tyrone_nim.71.f:0 "At the river landing, the new notice passed from hand to hand. The boatman waited for the readers to clear the gangway."
 tyrone_nim.71.a:0 "Accept Bangladeshi independence."
 tyrone_nim.71.b:0 "Demand reannexation."
 tyrone_nim_revolution_advance:0 "The Revolutionary Offensive"
 tyrone_nim_revolution_advance_desc:0 "The revolutionary army presses its advance into the territories held by the princely coalition."

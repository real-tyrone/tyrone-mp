 je_tyrone_west_ukraine_status: "Reorganize Galicia-Lodomeria as West Ukraine."
 je_tyrone_west_ukraine:0 "A Western Ukrainian State"
 je_tyrone_west_ukraine_reason:0 "With the Polish lands of Western Galicia no longer under our control, the old Galician identity has become obsolete. Our government must reorganize itself as a Western Ukrainian state, founded upon the political and national aspirations of the Ukrainian people."
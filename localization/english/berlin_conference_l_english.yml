l_english:
    je_berlin_conference: "The Berlin Conference"
    je_berlin_conference_reason:0 "As European ambitions in Africa intensify, uncoordinated expansion risks conflict between the Great Powers. To impose order on the scramble and legitimize imperial claims, an international conference in Berlin has been convened. The rules set here will shape colonial borders, determine spheres of influence, and define the future balance of power far beyond Europe."
    je_berlin_conference_claim_button: "Stake a Claim"
    berlin_conference.2.a: "The lands of Ethiopia show promise."
    number_of_claims_left: "Number of Claims Left: #v [GetMetaPlayer.GetPlayedOrObservedCountry.MakeScope.Var('african_claims_var').GetValue]#!"
    berlin_conference.2.b:0 "Senegal commands trade routes and a stable Atlantic foothold."
    berlin_conference.2.z:0 "Let us refrain from making any claims for now."
    berlin_conference.2.c:0 "The Congo Basin offers vast resources and navigable rivers."
    berlin_conference.2.g:0 "The Zanj Coast provides access to Indian Ocean commerce."
    berlin_conference.2.h:0 "The Niger region promises control over inland trade and influence."
    berlin_conference.2.i:0 "South Africa offers strategic ports and control of the southern sea routes."
    je_berlin_conference_claim_button_desc:0 "Select one strategic region to formally claim during the conference, securing international recognition for our interests."
    berlin_conference.2.t:0 "Stake a Claim"
    berlin_conference.2.d:0 "The Berlin Conference offers a rare chance to secure recognition for our ambitions in Africa. We must choose our move carefully and put forward a single strategic claim while the assembled powers are still willing to honor the ink."
    berlin_conference.2.f:0 "Maps are spread across polished tables, borders traced in pencil and spoken into existence with calm certainty. In this room, a coastline becomes a concession, a river becomes a corridor, and a name on paper becomes authority—so long as the other powers agree to recognize it. If we are to expand, it is best done now, and with one clear claim that can be defended, supplied, and justified."
    congo_claims_tt: "[ROOT.GetCountry.GetName] gains [Concept('concept_claim', '$concept_claims$')] in the [SCOPE.sStrategicRegion('congo_region').GetName]"
    saf_claims_tt:0 "[ROOT.GetCountry.GetName] gains [Concept('concept_claim', '$concept_claims$')] in the [SCOPE.sStrategicRegion('saf_region').GetName]"
    niger_claims_tt:0 "[ROOT.GetCountry.GetName] gains [Concept('concept_claim', '$concept_claims$')] in the [SCOPE.sStrategicRegion('niger_region').GetName]"
    zanj_claims_tt:0 "[ROOT.GetCountry.GetName] gains [Concept('concept_claim', '$concept_claims$')] in the [SCOPE.sStrategicRegion('zanj_region').GetName]"
    senegal_claims_tt:0 "[ROOT.GetCountry.GetName] gains [Concept('concept_claim', '$concept_claims$')] in the [SCOPE.sStrategicRegion('senegal_region').GetName]"
    ethiopia_claims_tt:0 "[ROOT.GetCountry.GetName] gains [Concept('concept_claim', '$concept_claims$')] in the [SCOPE.sStrategicRegion('ethiopia_region').GetName]"
    berlin_conference.3.t:0 "The Conference Concludes"
    berlin_conference.3.d:0 "The Berlin Conference has come to an end, and the window for negotiation closes with it. The claims advanced at the table now stand—on paper, and in the eyes of the powers who witnessed them."
    berlin_conference.3.f:0 "Ink dries, maps are rolled up, and the delegates depart with polite smiles and sharpened intentions. What was debated in salons will now be tested on distant coasts and along unfamiliar rivers, where recognition means little without presence. Still, a signature and a stamped map are powerful things: they turn ambition into entitlement, and entitlement into expectation."
    berlin_conference.3.a:0 "Let the record stand."
    berlin_conference.1.t:0 "The Berlin Conference Is Convened"
    berlin_conference.1.d:0 "Rival ambitions in Africa have reached a point where informal understandings are no longer sufficient. To prevent conflict among the European powers and impose a shared framework for expansion, an international conference has been called in Berlin."
    berlin_conference.1.f:0 "Diplomats arrive with portfolios full of maps, memoranda, and carefully rehearsed arguments. Behind closed doors, the future of distant lands will be debated with calm voices and deliberate language, even as every delegation measures how much it can secure before the doors finally close."
    berlin_conference.1.a:0 "We shall take part."
    staking_claim_tt: "[ROOT.GetCountry.GetName] is not currently staking a claim.
    berlin_conference_ended_tt: "The #v Berlin Conference#! has concluded."

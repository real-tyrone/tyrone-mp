l_english:
 tyrone_independent_route.1.t:0 "India Beyond the Company"
 tyrone_independent_route.1.d:0 "Independence has ended foreign authority over India, but the Company still holds the machinery of government. Its directors propose to reform their administration. Others call for an assembly to decide who shall govern the country."
 tyrone_independent_route.1.f:0 "The charter bears the old signatures. The country must now decide whose authority they carry."
 tyrone_independent_route.1.a:0 "Let India frame its own constitution."
 tyrone_independent_route.1.b:0 "Entrust the reforms to the Company."
 tyrone_independent_route_way_closes_tt:0 "The Way of the Nation closes if still active."
 tyrone_independent_route_choice_tt:0 "After The Honorable Company, choose between #v Company Self-Rule#! and #v A Nation in the Making#!."

 V3G_GARRISON_REQUIRES_CENTRALIZED_COUNTRIES: "Neither the initiating nor target country may be decentralized"
 V3G_GARRISON_REQUIRES_INTERNATIONAL_RELATIONS: "Requires the International Relations technology"

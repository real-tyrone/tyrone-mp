 v3g_subject_garrison_action_notification_third_party_name: "Garrison established in [TARGET_COUNTRY.GetName]"
 v3g_subject_garrison_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] has established garrison rights in its subject [TARGET_COUNTRY.GetName]."

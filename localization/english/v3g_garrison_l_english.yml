 v3g_garrison_rights: "Garrison Rights"
 v3g_garrison_rights_desc: "Allows one country to move and station armies within another country. Armies that actually reach a local headquarters increase their owner's involvement in that strategic region."
 v3g_garrison_rights_effects_desc: "• The recipient may move and station armies in the granting country\n• Garrisons raise the recipient's local Interest Tier through the vanilla involvement system"
 v3g_garrison_rights_article_short_desc: "The recipient may garrison armies in the granting country"
 TREATY_DRAFT_ARTICLE_FLAG_IS_V3G_GARRISON_RIGHTS_EFFECT: "• The recipient may garrison armies in the granting country"
 TREATY_ARTICLE_FLAG_IS_V3G_GARRISON_RIGHTS_EFFECT: "• The recipient may garrison armies in the granting country"

 dp_v3g_expel_garrison: "Expel Foreign Garrison"
 dp_v3g_expel_garrison_tooltip: "#header Start an $dp_v3g_expel_garrison$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_v3g_expel_garrison_desc$"
 dp_v3g_expel_garrison_desc: "Demand that a country surrender its garrison rights in our territory, potentially escalating to war if it refuses."
 v3g_expel_garrison: "Revoke Garrison Rights"
 v3g_expel_garrison_desc: "Forces the target country to surrender all garrison rights in our territory. Its armies will lose military access and begin withdrawing."
 war_goal_v3g_expel_garrison_type_name: "Revoke Garrison Rights"
 war_goal_v3g_expel_garrison_type_desc: "Forces the target country to surrender all garrison rights in our territory and withdraw its stationed armies."
 war_goal_v3g_expel_garrison: "Expel the [WAR_GOAL_DRAFT.GetTarget.GetAdjectiveNoFormatting] Garrison"
 war_goal_v3g_expel_garrison_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] demands that [WAR_GOAL_DRAFT.GetTarget.GetName] surrender all garrison rights in its territory and withdraw its stationed armies."
 war_goal_v3g_expel_garrison_sway_desc: "Demand that [WAR_GOAL_DRAFT.GetTarget.GetName] surrender all garrison rights in [WAR_GOAL_DRAFT.GetHolder.GetName] to convince [WAR_GOAL_DRAFT.GetHolder.GetName] to support you."
 v3g_expel_garrison_custom_tooltip: "All [TARGET_COUNTRY.GetName] garrison rights in [ROOT.GetCountry.GetName] will be revoked"

 dp_v3g_force_garrison: "Force Garrison Rights"
 dp_v3g_force_garrison_tooltip: "#header Start a $dp_v3g_force_garrison$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_v3g_force_garrison_desc$"
 dp_v3g_force_garrison_desc: "Demand that the target country permit our armies to garrison its territory, potentially escalating to war if it refuses."
 v3g_force_garrison: "Force Garrison Rights"
 v3g_force_garrison_desc: "Forces the target country to grant us garrison rights through a treaty that the host cannot unilaterally leave."
 war_goal_v3g_force_garrison_type_name: "Force Garrison Rights"
 war_goal_v3g_force_garrison_type_desc: "Forces the target country to allow our armies to station at any reachable army headquarters in its territory."
 war_goal_v3g_force_garrison: "Force a Garrison in [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_v3g_force_garrison_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] demands that [WAR_GOAL_DRAFT.GetTarget.GetName] grant it forced garrison rights, allowing its armies to enter and remain stationed there."
 war_goal_v3g_force_garrison_sway_desc: "Demand that [WAR_GOAL_DRAFT.GetTarget.GetName] grant forced garrison rights to [WAR_GOAL_DRAFT.GetHolder.GetName] to convince [WAR_GOAL_DRAFT.GetHolder.GetName] to support you."

 v3g_forced_garrison_rights: "Forced Garrison Rights"
 v3g_forced_garrison_rights_desc: "Directed garrison rights imposed by a diplomatic demand or war. The host cannot withdraw through the normal treaty interface and must use the Expel Foreign Garrison diplomatic play."
 v3g_forced_garrison_rights_effects_desc: "• The recipient may move and station armies in the granting country\n• The host cannot unilaterally withdraw from this article\n• The host may demand its removal through the Expel Foreign Garrison diplomatic play"
 v3g_forced_garrison_rights_article_short_desc: "Forcibly permits the recipient to garrison the granting country"

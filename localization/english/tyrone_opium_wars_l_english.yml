l_english:
 tyr_opium_port_tt:0 "Great Britain owns a Treaty Port in a State Region shared with China or one of its subjects."
 tyr_opium_free_trade_tt:0 "China has enacted the Free Trade law."
 tyr_opium_reparations_tt:0 "China pays Great Britain under an active money-transfer article in a treaty imposed by Britain on China. Voluntary transfers do not count."
 tyr_opium_british_failure:0 "The Failure of the Opium Policy"
 tyr_opium_cabinet_disgrace:0 "A Discredited Cabinet"
 tyr_opium_indian_trade_collapse:0 "Collapse of the Chinese Opium Trade"
 tyr_opium_britain.t:0 "British Trade and the Chinese Ban"
 tyr_opium_britain.d:0 "The government has committed itself to securing British commercial demands in China. It must obtain either a treaty port or an imposed payment from the Chinese government within five years. Failure will damage public confidence and the interests behind the opium trade."
 tyr_opium_britain.f:0 "Merchants demand protection for their trade. The cabinet must answer for the policy it has adopted."
 tyr_opium_britain.a:0 "Our demands have been presented."
 tyr_opium_china.t:0 "The Question of Opium"
 tyr_opium_china.d:0 "British commercial demands have brought the opium question before the court. Suppressing the trade requires a sustained ban and peace at home. A British treaty port in Chinese territory, including the territories of our subjects, will mark the failure of that policy."
 tyr_opium_china.f:0 "The orders are issued in the capital; their enforcement falls upon the provinces and the coast."
 tyr_opium_china.a:0 "The court must confront the trade."
 tyr_opium_chinese_defeat.d:0 "Britain has secured a treaty port in territory belonging to China or one of its subjects, or China has enacted Free Trade. Foreign commerce has gained ground against the court's efforts to control the trade."
 tyr_opium_british_success.d:0 "Britain has secured a treaty port or payments imposed upon the Chinese government. The cabinet has obtained a settlement in support of British commercial interests."
 tyr_opium_failure.t:0 "The Cabinet Fails in China"
 tyr_opium_failure.d:0 "Five years have passed without securing a treaty port or imposed Chinese payments. The cabinet faces public anger, lenders demand more, and investors question the policy. If India remains a British subject, the loss of confidence in the Chinese market also strikes its opium producers."
 tyr_opium_failure.f:0 "The promised settlement has not arrived. The costs of the undertaking remain."
 tyr_opium_failure.a:0 "We must bear the consequences."
 tyr_opium_indian_subjects_collapse_tt:0 "All direct and indirect subjects of India will suffer #r −40%#! Opium Plantation throughput for #v five years#!."

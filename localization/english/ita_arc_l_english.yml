 ita_arc_rome_map_tt:0 "#white #b $FRA$#!#! maintains a garrison in Rome. Complete annexation and the Concordat are blocked; partial territorial settlements remain possible."
 ita_arc.1.t:0 "The Treaty of Turin"
 ita_arc.1.d:0 "French envoys propose the cession of Savoy and our possessions around Nice. In return, France will owe us an obligation and commit to supporting a war for the Lombard and Venetian lands still held by Austria."

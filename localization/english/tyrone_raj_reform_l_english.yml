l_english:
 tyrone_raj_reform.1.t:0 "Names on the School Roll"
 tyrone_raj_reform.1.d:0 "Families in [ROOT.GetCountry.GetName] are asking about school places for their children. Regular lessons have given some of them a reason to regard the administration with greater confidence."
 tyrone_raj_reform.1.f:0 "The father asked the teacher to read back the name he had entered. He could not check the spelling himself. His daughter, he hoped, would soon be able to."
 tyrone_raj_reform.1.a:0 "There is room for another name."
 tyrone_raj_reform.2.t:0 "Before the Stores Run Out"
 tyrone_raj_reform.2.d:0 "Relief officers in [ROOT.GetCountry.GetName] now have the staff to organize assistance when disease damages the crops. Villages can seek help before their remaining stores are exhausted."
 tyrone_raj_reform.2.f:0 "The cultivator brought a handful of blackened stalks to the district office. He had expected to be sent away until the harvest was counted. Instead, the officer asked how many fields had been affected."
 tyrone_raj_reform.2.a:0 "The villages should know where to turn."
 tyrone_raj_reform.3.t:0 "Back to the Dispensary"
 tyrone_raj_reform.3.d:0 "More households in [ROOT.GetCountry.GetName] can seek medical assistance through the new healthcare arrangements. Among those who have received care, gratitude has softened some of the distrust of government."
 tyrone_raj_reform.3.f:0 "The patient’s brother returned with the empty medicine bottle. The fever had broken, he said. Before leaving, he asked whether the dispensary could receive the other sick from his village."
 tyrone_raj_reform.3.a:0 "They will be received."
 tyrone_raj_welfare_resilience:0 "Organized Rural Relief"
 tyrone_raj_welfare_resilience_desc:0 "An established relief service helps rural households withstand the loss of crops to disease."

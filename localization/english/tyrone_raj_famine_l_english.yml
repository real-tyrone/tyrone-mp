l_english:
 je_tyrone_raj_famine_reason:0 "In #bold [SCOPE.sStateRegion('famine_region').GetName]#!, diseased crops have left cultivators with little to eat and less to sell. Grain merchants guard their stocks while families part with cattle, tools, and the seed intended for another harvest.\n\nPetitions reach the collectorate from villages whose obligations remain unchanged even as their means of meeting them disappear. Local charity cannot reach every household, and the roads fill with those seeking work or bread.\n\nThe administration faces a test of the authority it claims over the countryside. Grain relief, paid employment, and medical care may preserve lives where the harvest has failed."
 tyrone_raj_famine_food_button:0 "Distribute Relief Grain"
 tyrone_raj_famine_food_button_desc:0 "Relief depots draw hungry cultivators from villages where the seed grain has already been eaten. A share of provisions may spare a household from selling the tools it will need when the fields recover."
 tyrone_raj_famine_works_button:0 "Organize Public Works"
 tyrone_raj_famine_works_button_desc:0 "The roads and embankments still need repair, though the fields offer little work. For families who have lost their harvest, wages from public works may be the only means of buying food."
 tyrone_raj_famine_medical_button:0 "Dispatch Medical Relief"
 tyrone_raj_famine_medical_button_desc:0 "Hunger leaves the sick with little strength to recover. Medical attendants and supplies are scarce in the stricken districts, where even a small dispensary may serve villages far beyond its doors."
 tyrone_raj_famine_food_not_funded_tt:0 "Grain relief has not already been financed for this local crisis"
 tyrone_raj_famine_works_not_funded_tt:0 "Public works have not already been financed for this local crisis"
 tyrone_raj_famine_medical_not_funded_tt:0 "Medical relief has not already been financed for this local crisis"
 tyrone_raj_famine.1.t:0 "[SCOPE.sStateRegion('famine_region').GetName] Famine"
 tyrone_raj_famine.1.d:0 "Crop disease has reached #bold [SCOPE.sStateRegion('famine_region').GetName]#!. Cultivators report failing harvests and dwindling food stocks, while officials in [SCOPE.sCountry('raj_scope').GetName] receive appeals for relief."
 tyrone_raj_famine.1.f:0 "The collector’s clerk laid two papers upon the desk. One listed the arrears owed by the villages; the other counted the households that had left them. Many of the names were the same."
 tyrone_raj_famine.1.a:0 "Register the crisis and open relief proceedings."

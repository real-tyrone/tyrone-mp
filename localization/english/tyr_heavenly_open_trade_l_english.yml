l_english:
 tyr_heavenly_open_trade_button:0 "Open the Heavenly Ports"
 tyr_heavenly_open_trade_button_desc:0 "Authorize foreign commerce to supply the Heavenly Kingdom's workshops and armies. Immediately replace Isolationism, including the Canton System, with [GetLawType('law_mercantilism').GetName]. No treasury payment is required. This permits foreign trade but does not create goods or guarantee imports: world-market supply, shipping capacity and wartime access still determine what can reach our market."
 tyr_heavenly_trade_once_tt:0 "The Heavenly Kingdom has not already opened its ports through this action."
 tyr_heavenly_trade_port_tt:0 "The Heavenly Kingdom owns at least one level of [GetBuildingType('building_port').GetName]."

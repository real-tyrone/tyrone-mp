l_english:
 lawgroup_india_chartered_obligations:0 "Chartered Obligations"
 lawgroup_india_chartered_obligations_desc:0 "The guarantees imposed upon Indian revenues to sustain chartered enterprises and imperial economic interests."
 law_india_unaided_enterprise:0 "Unaided Enterprise"
 law_india_unaided_enterprise_desc:0 "Commercial ventures bear their own losses. The administration assumes no additional obligation to guarantee private enterprises."
 law_india_guaranteed_railway_companies:0 "Guaranteed Railway Companies"
 law_india_guaranteed_railway_companies_desc:0 "Railway companies receive binding guarantees against operating losses, placing their required subsidies upon the Indian treasury."
 law_india_plantation_guarantees:0 "Plantation Guarantees"
 law_india_plantation_guarantees_desc:0 "The administration guarantees plantation enterprises, including rubber plantations, committing Indian revenues to their required subsidies."
 law_india_chartered_manufactures:0 "Chartered Manufactures"
 law_india_chartered_manufactures_desc:0 "Manufacturing enterprises receive compulsory public support under the chartered settlement, binding the treasury to subsidize their operations."
 law_india_imperial_revenue_guarantees:0 "Imperial Revenue Guarantees"
 law_india_imperial_revenue_guarantees_desc:0 "Indian revenues guarantee industrial, agricultural, extractive, transport, power, urban service and arts enterprises. The administration must subsidize their operations wherever subsidies are permitted."

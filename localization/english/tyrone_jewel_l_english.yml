 tyrone_jewel_freight_dispute_a_india:0 "A Disputed Route: Public Settlement"
 tyrone_jewel_freight_dispute_a_india_desc:0 "Imperial funds are extending public works and relieving congestion on Indian railways."
 tyrone_jewel_freight_dispute_b_india:0 "A Disputed Route: Imperial Refusal"
 tyrone_jewel_freight_dispute_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel_freight_dispute_b_overlord:0 "A Disputed Route: Official Response"
 tyrone_jewel_freight_dispute_b_overlord_desc:0 "District representatives in India have challenged the priority given to imperial freight. The governor must decide whose consignments the public works should serve."
 tyrone_jewel.1.t:0 "A Disputed Route"
 tyrone_jewel.1.d:0 "The governor of [SCOPE.sCountry('csr_india').GetName] requests imperial funds to expand routes crowded by export traffic. Merchants defend their contracts, while district representatives demand room for local freight."
 tyrone_jewel.1.f:0 "The engineer has proposed a second line. The merchants approve of the drawing; their objection begins with the question of who will pay for it."
 tyrone_jewel.1.a:0 "Finance the additional routes."
 tyrone_jewel.1.b:0 "The Indian administration must find its own funds."
 tyrone_jewel_relief_accounts_a_india:0 "The Relief Accounts: Public Settlement"
 tyrone_jewel_relief_accounts_a_india_desc:0 "An imperial relief grant is supplying households that local allowances could not support."
 tyrone_jewel_relief_accounts_b_india:0 "The Relief Accounts: Imperial Refusal"
 tyrone_jewel_relief_accounts_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel_relief_accounts_b_overlord:0 "The Relief Accounts: Official Response"
 tyrone_jewel_relief_accounts_b_overlord_desc:0 "Relief officers in India report that their allowances no longer cover the households on their rolls. The governor’s council has been asked to meet the difference."
 tyrone_jewel.2.t:0 "The Relief Accounts"
 tyrone_jewel.2.d:0 "Relief officers in [SCOPE.sCountry('csr_india').GetName] report that their allowances cannot meet the demands before them. The governor has asked our treasury to cover the shortage."
 tyrone_jewel.2.f:0 "The governor’s request includes the district returns. Against each allowance stands a longer list of households awaiting assistance."
 tyrone_jewel.2.a:0 "Meet the cost of relief."
 tyrone_jewel.2.b:0 "Refuse the additional grant."
 tyrone_jewel_examining_boards_a_india:0 "Places in the Service: Public Settlement"
 tyrone_jewel_examining_boards_a_india_desc:0 "An imperial grant has widened access to education and preparation for public examinations."
 tyrone_jewel_examining_boards_b_india:0 "Places in the Service: Imperial Refusal"
 tyrone_jewel_examining_boards_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel.3.t:0 "Places in the Service"
 tyrone_jewel.3.d:0 "Candidates in [SCOPE.sCountry('csr_india').GetName] have petitioned for wider access to education and government examinations. The governor proposes an imperial grant to expand the facilities that prepare them."
 tyrone_jewel.3.f:0 "The candidates have supplied their examination marks. The governor has added the cost of giving more applicants the same opportunity."
 tyrone_jewel.3.a:0 "Endow the teaching and examination facilities."
 tyrone_jewel.3.b:0 "Existing provision must suffice."
 tyrone_jewel_suppliers_a_india:0 "The Supplier’s Conditions: Public Settlement"
 tyrone_jewel_suppliers_a_india_desc:0 "Imperial funding is helping Indian workshops acquire and maintain new production techniques."
 tyrone_jewel_suppliers_b_india:0 "The Supplier’s Conditions: Imperial Refusal"
 tyrone_jewel_suppliers_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel_suppliers_b_overlord:0 "The Supplier’s Conditions: Official Response"
 tyrone_jewel_suppliers_b_overlord_desc:0 "Manufacturers in India have received an offer of machinery tied to long-term supply contracts. The governor’s advisers differ over whether the terms justify the immediate advantage."
 tyrone_jewel.4.t:0 "The Supplier’s Conditions"
 tyrone_jewel.4.d:0 "Manufacturers in [SCOPE.sCountry('csr_india').GetName] seek help acquiring machinery and technical instruction. The governor asks our government to finance training beyond the terms offered by private suppliers."
 tyrone_jewel.4.f:0 "A working machine has impressed the factory owners. They still need people who can repair it when the supplier’s representative leaves."
 tyrone_jewel.4.a:0 "Finance technical instruction in India."
 tyrone_jewel.4.b:0 "Leave the manufacturers to their suppliers."
 tyrone_jewel_public_petitions_a_india:0 "Petitions before the Council: Public Settlement"
 tyrone_jewel_public_petitions_a_india_desc:0 "Funded hearings and district inquiries are giving political grievances an administrative hearing."
 tyrone_jewel_public_petitions_b_india:0 "Petitions before the Council: Imperial Refusal"
 tyrone_jewel_public_petitions_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel_public_petitions_b_overlord:0 "Petitions before the Council: Official Response"
 tyrone_jewel_public_petitions_b_overlord_desc:0 "Associations in India have submitted petitions against the governor’s administration. Officials disagree over whether a public hearing would settle the complaints or lend them further authority."
 tyrone_jewel.5.t:0 "Petitions before the Council"
 tyrone_jewel.5.d:0 "Associations in [SCOPE.sCountry('csr_india').GetName] have sent complaints about the governor’s administration. A funded programme of public hearings and district inquiries has been proposed to address their grievances."
 tyrone_jewel.5.f:0 "The delegates have asked to be heard. The governor’s reply sets out the offices and travelling allowances that a proper inquiry would require."
 tyrone_jewel.5.a:0 "Provide the funds for public hearings."
 tyrone_jewel.5.b:0 "Decline to finance the inquiries."
 tyrone_jewel_governor_accounts_a_india:0 "The Governor’s Dispatch: Public Settlement"
 tyrone_jewel_governor_accounts_a_india_desc:0 "Imperial support is providing staff and resources for the Indian administration."
 tyrone_jewel_governor_accounts_a_overlord:0 "The Governor’s Dispatch: Public Settlement"
 tyrone_jewel_governor_accounts_a_overlord_desc:0 "The governor’s latest dispatch describes a widening gap between the duties assigned to India and the resources available to carry them out. The imperial government expects a reply."
 tyrone_jewel_governor_accounts_b_india:0 "The Governor’s Dispatch: Imperial Refusal"
 tyrone_jewel_governor_accounts_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel_governor_accounts_b_overlord:0 "The Governor’s Dispatch: Official Response"
 tyrone_jewel_governor_accounts_b_overlord_desc:0 "The governor’s latest dispatch describes a widening gap between the duties assigned to India and the resources available to carry them out. The imperial government expects a reply."
 tyrone_jewel.6.t:0 "The Governor’s Dispatch"
 tyrone_jewel.6.d:0 "The governor of [SCOPE.sCountry('csr_india').GetName] reports that existing offices cannot carry out all the duties assigned to them. Our treasury has been asked to support an expansion of the Indian administration."
 tyrone_jewel.6.f:0 "The dispatch lists the work left unfinished. Beside it, the governor has entered the staff and funds needed to complete it."
 tyrone_jewel.6.a:0 "Underwrite the additional administration."
 tyrone_jewel.6.b:0 "The governor must work within existing means."
 tyrone_jewel_national_delegation_a_india:0 "A National Delegation: Public Settlement"
 tyrone_jewel_national_delegation_a_india_desc:0 "Newly funded local bodies are extending the reach of public institutions in India."
 tyrone_jewel_national_delegation_a_overlord:0 "A National Delegation: Public Settlement"
 tyrone_jewel_national_delegation_a_overlord_desc:0 "Delegates in India are organising a common statement of grievances against imperial rule. Their supporters seek a platform from which to press the demand for independence."
 tyrone_jewel_national_delegation_b_india:0 "A National Delegation: Imperial Refusal"
 tyrone_jewel_national_delegation_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel.7.t:0 "A National Delegation"
 tyrone_jewel.7.d:0 "Representatives in [SCOPE.sCountry('csr_india').GetName] have joined in demanding a greater voice in public affairs. The governor seeks funds for local administrative bodies as a concession to their demands."
 tyrone_jewel.7.f:0 "The delegates want their districts heard before decisions are made. The governor proposes offices through which those demands might reach the administration."
 tyrone_jewel.7.a:0 "Finance the proposed local bodies."
 tyrone_jewel.7.b:0 "Reject the request for imperial funds."
 tyrone_jewel_imperial_burden_a_india:0 "The Cost of Holding India: Public Settlement"
 tyrone_jewel_imperial_burden_a_india_desc:0 "An imperial contribution is relieving the cost of maintaining the Indian public service."
 tyrone_jewel_imperial_burden_a_overlord:0 "The Cost of Holding India: Public Settlement"
 tyrone_jewel_imperial_burden_a_overlord_desc:0 "Growing demands for independence in India have made imperial obligations harder to defend. The two administrations face pressure to explain what continued rule requires of them."
 tyrone_jewel_imperial_burden_b_india:0 "The Cost of Holding India: Imperial Refusal"
 tyrone_jewel_imperial_burden_b_india_desc:0 "The imperial government has refused the requested contribution, deepening opposition to its rule in India."
 tyrone_jewel_imperial_burden_b_overlord:0 "The Cost of Holding India: Official Response"
 tyrone_jewel_imperial_burden_b_overlord_desc:0 "Growing demands for independence in India have made imperial obligations harder to defend. The two administrations face pressure to explain what continued rule requires of them."
 tyrone_jewel.8.t:0 "The Cost of Holding India"
 tyrone_jewel.8.d:0 "The administration of [SCOPE.sCountry('csr_india').GetName] has asked the imperial treasury to assume part of its public-service expenses. Refusing the request would leave the governor defending obligations for which local funds are inadequate."
 tyrone_jewel.8.f:0 "The governor has sent the payroll with the request. The covering dispatch asks which duties should be abandoned if the money is refused."
 tyrone_jewel.8.a:0 "Assume a share of the public-service costs."
 tyrone_jewel.8.b:0 "India must meet its own administrative bill."
 tyrone_jewel_freight_dispute_funding_cost:0 "A Disputed Route: Imperial Funding"
 tyrone_jewel_freight_dispute_funding_cost_desc:0 "The imperial treasury is meeting a fixed weekly charge for this undertaking in India."

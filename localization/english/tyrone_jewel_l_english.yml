 tyrone_jewel_arsenals_proposal_desc:0 "The arsenals need new equipment and dependable orders. The governor can foster local military expertise or bind procurement more closely to imperial suppliers.\n\n[SCOPE.sCountry('jewel_proposer').GetName] has brought a proposal before the two administrations."

l_english:

 je_mandate_of_heaven: "The Mandate of Heaven"
 je_mandate_of_heaven_reason:0 "Imperial authority varies with Centralisation. Hover over each level to view its effects.\n\n#v 0–3#!: #tooltippable #tooltip:chi_mandate_centralisation_low_hover #bold $chi_mandate_centralisation_low$#!#!#!\n#v 4–6#!: #tooltippable #tooltip:chi_mandate_centralisation_mid_hover #bold $chi_mandate_centralisation_mid$#!#!#!\n#v 7–8#!: #tooltippable #tooltip:chi_mandate_centralisation_high_hover #bold $chi_mandate_centralisation_high$#!#!#!\n#v 9–10#!: #tooltippable #tooltip:chi_mandate_centralisation_max_hover #bold $chi_mandate_centralisation_max$#!#!#!\n\n$chi_centralisation_technology_effect$"
 chi_centralisation_progress_bar: "Centralisation"
 chi_centralisation_progress_bar_desc:0 "Centralization: ( #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/10#! )"
 
 chi_centralisation_advancement_1:0 "Centralisation Increases"
 chi_centralisation_mixed_economic_policy_effect:0 "Enacting [GetLawType('law_chi_mixed_economic_policy').GetName]: #g +2#! Centralisation"
 chi_centralisation_industry_banned_effect:0 "Enacting [GetLawType('law_chi_industry_banned').GetName]: #g +1#! Centralisation"
 chi_centralisation_confucian_scholars_effect:0 "Completing #bold $je_confront_confucian_scholars$#!: #g +1#! Centralisation"
 chi_centralisation_early_army_modernization_effect:0 "Completing #bold $je_early_army_modernization$#!: #g +1#! Centralisation"
 chi_centralisation_homeland_development_effect:0 "Completing #bold $je_homeland_development$#!: #g +2#! Centralisation"
 chi_centralisation_decrease_1:0 "Centralisation Decreases"
 chi_centralisation_monarchy_loss_effect:0 "Abolishing [GetLawType('law_monarchy').GetName]: #r −3#! Centralisation (once)"
 chi_centralisation_opium_wars_loss_effect:0 "Losing the #bold Opium Wars#!: #r −1#! Centralisation (once)"
 chi_centralisation_taiping_effect:0 "Failing to stop the appearance of the #bold Heavenly Kingdom#!: #r −1#! Centralisation (once)"
 chi_centralisation_loan_effect:0 "Taking [concept_loans]: #r −1#! Centralisation every six months while borrowing"
 chi_centralisation_civil_war_effect:0 "Having a [concept_civil_war]: #r −1#! Centralisation per civil war"
 chi_centralisation_heavenly_retake_effect:0 "Failing to retake the #bold Heavenly Kingdom#!: #r −1#! Centralisation (once)"
 chi_centralisation_boxer_rebellion_effect:0 "Failing the #bold Boxer Rebellion#!: #r −1#! Centralisation (once)"
 chi_centralisation_coup_effect:0 "Having a successful [concept_coup]: #r −1#! Centralisation (once)"
 chi_mandate_centralisation_low: "Fragmented Rule"
 chi_mandate_centralisation_low_desc:0 "Fragmented provincial rule weakens institutions, construction and aristocratic investment. Population administration and military goods are cheaper, but peasant consumption remains reduced."
 chi_mandate_centralisation_mid: "Consolidating Rule"
 chi_mandate_centralisation_mid_desc:0 "Consolidation eases the penalties to institutions, construction and aristocratic investment. Population administration and military goods remain cheaper, while peasant consumption is still reduced."
 chi_mandate_centralisation_high: "Strong Administration"
 chi_mandate_centralisation_high_desc:0 "A stronger administration limits the remaining penalties to institutions, construction and aristocratic investment. Peasant consumption and military goods costs are slightly reduced."
 chi_mandate_centralisation_max: "Centralised Empire"
 chi_mandate_centralisation_max_desc:0 "The penalties to institutions, construction and aristocratic investment have ended. Only a small reduction in peasant consumption remains."
 chi_mandate_low_centralisation_landowners: "Landowners Support the Throne"
 chi_mandate_low_centralisation_landowners_desc:0 "Landowners gain 3 approval and 15% political strength. Tax collection falls by 2%, while bureaucracy cost per population falls by 25%. These effects decay over ten years."
 chi_mandate_empiricism: "Empirical Scholarship"
 chi_mandate_empiricism_desc:0 "Universities gain 15% throughput and society technology research is 15% faster, while tax collection falls by 3%."
 chi_mandate_medical_degrees: "Medical Reform"
 chi_mandate_medical_degrees_desc:0 "Mortality falls by 10%, tax collection falls by 5%, and the Devout gain 15% political strength."
 chi_mandate_three_groups_discontent: "Court Reforms Anger the Estates"
 chi_mandate_three_groups_discontent_desc: "The Landowners, Devout, and Intelligentsia each lose #r 2#! approval for ten years."
 chi_mandate.2.t: "The Court Debates Reform"
 chi_mandate.2.d:0 "With imperial authority weak, the court is divided over concessions to the landed estates and proposals for scientific reform."
 chi_mandate.2.f: "\"When the centre is weak, every faction claims to know how the empire must be saved.\""
 chi_mandate.2.a: "Secure the Landowners' Support"
 chi_mandate.2.b: "Embrace Empiricism"
 chi_mandate.2.c: "Fund Medical Reform"
 chi_mandate.2.d_option:0 "Impose an Unpopular Settlement"
 chi_mandate.4.a.tt: "Obtain -30% cost for [concept_decree]s for 5 years."
 chi_mandate_mass_communication_decrees: "National Communications Network"
 chi_mandate_mass_communication_decrees_desc:0 "The cost of [concept_decree]s is reduced by #g 30%#! for five years."
 chi_mandate_mass_communication_research: "Scientific Dissemination"
 chi_mandate_mass_communication_research_desc: "[concept_society_technology] research speed is increased by #g 15%#!."
 chi_mandate.4.t: "A Connected Empire"
 chi_mandate.4.d: "With mass communication now available, the court can use the new networks to strengthen its administration or accelerate the circulation of scientific knowledge."
 chi_mandate.4.f: "\"A message carried swiftly can bind distant provinces to the throne—or carry new ideas to every corner of the empire.\""
 chi_mandate.4.a: "Strengthen the Administration"
 chi_mandate.4.b: "Spread Scientific Knowledge"
 chi_industrialization.1.t: "The First Industrial Machines"
 chi_industrialization.1.d: "The lathe has opened a new chapter in Chinese production. The court must decide whether to encourage this transformation and its promise of prosperity, or shield established workshops from disruption."
 chi_industrialization.1.f: "\"The turning of a spindle may set an empire in motion—or unsettle the lives built around the old ways.\""
 chi_industrialization.1.a: "Invest in the New Machines"
 chi_industrialization.1.b: "Protect Established Workshops"
 chi_industrialization_industrial_promise: "The Promise of Industrialisation"
 chi_industrialization_industrial_promise_desc: "Production technology research speed is #g +15%#!, peasant consumption is #g +10%#!, and radicals from Standard of Living changes are #r +10%#!. Furniture manufactories and textile mills gain #g +15%#! throughput."
 chi_industrialization_industrial_backlash: "Industrial Disruption"
 chi_industrialization_industrial_backlash_desc: "Lower strata expected Standard of Living is #r -1#!, Production technology research speed is #r -5%#!, and furniture manufactories and textile mills lose #r 15%#! throughput."
 je_early_army_modernization: "Early Army Modernization"
 je_early_army_modernization_reason: "China's army must adapt to the era of industrial warfare. The army begins with severe offense and defense penalties, additional penalties to Line Infantry and Mobile Artillery, and a temporary training-rate bonus. Each reform reduces the army-wide penalty by one stage. Modernize Rifle Production also removes the Line Infantry and Mobile Artillery penalty. Complete all four reforms to unlock Early Modernization at centralization 5–10, or National Militia at centralization 0–4."
 chi_early_army_stage_4: "Disorganized Army: Stage IV"
 chi_early_army_stage_4_desc: "Army offense and defense are #r -40%#!, while Barracks training rate is #g +200%#!."
 chi_early_army_stage_3: "Disorganized Army: Stage III"
 chi_early_army_stage_3_desc: "Army offense and defense are #r -30%#!, while Barracks training rate is #g +150%#!."
 chi_early_army_stage_2: "Disorganized Army: Stage II"
 chi_early_army_stage_2_desc: "Army offense and defense are #r -20%#!, while Barracks training rate is #g +100%#!."
 chi_early_army_stage_1: "Disorganized Army: Stage I"
 chi_early_army_stage_1_desc: "Army offense and defense are #r -10%#!, while Barracks training rate is #g +50%#!."
 chi_early_army_line_artillery_penalty: "Outdated Infantry and Artillery"
 chi_early_army_line_artillery_penalty_desc: "Line Infantry and Mobile Artillery lose #r 5#! offense and defense."
 chi_early_army_gbr_advisors: "British Military Advisers"
 chi_early_army_gbr_advisors_desc: "Army defense is #g +25%#! and Military technology spread is #g +25%#!."
 chi_early_army_france_advisors: "French Military Advisers"
 chi_early_army_france_advisors_desc: "Military technology spread is #g +10%#! and Cavalry offense is #g +15%#!."
 chi_early_army_france_home_defence: "French Home Defence Doctrine"
 chi_early_army_france_home_defence_desc: "Army defense is #g +10%#! for ten years."
 chi_early_army_prussia_advisors: "Prussian Military Advisers"
 chi_early_army_prussia_advisors_desc: "Artillery offense and army offense are #g +10%#!; conscription rate is #g +1%#! and Barracks capacity is #g +5#!."
 chi_early_army_self_taught: "Self-Taught Officer Corps"
 chi_early_army_self_taught_desc: "Military technology research speed and Barracks training rate are #g +5%#! and #g +50%#! respectively, but morale loss is #r +50%#!."
 chi_early_army_foreign_design: "Foreign Arms Designs"
 chi_early_army_foreign_design_desc: "Military technology research speed is #r -10%#!, while Military technology spread is #g +30%#!."
 chi_early_army_domestic_design: "Domestic Arms Production"
 chi_early_army_domestic_design_desc: "Military technology spread is #r -50%#!, while Arms Industries and Artillery Foundries gain #g +20%#! throughput."
 chi_early_army_light_infantry: "Light Infantry Doctrine"
 chi_early_army_light_infantry_desc: "Cavalry offense is #g +15%#!, occupation speed #g +30%#!, infantry and artillery morale loss #r +10%#!, training rate #g +20%#!, and formation movement speed #g +20%#!."
 chi_early_army_heavy_infantry: "Heavy Infantry Doctrine"
 chi_early_army_heavy_infantry_desc: "Artillery offense is #g +15%#!, army goods costs #r +50%#!, morale loss #g -15%#!, and training rate #r -25%#!."
 chi_early_army_naval_neglect: "Neglected Naval Development"
 chi_early_army_naval_neglect_desc: "Ship construction efficiency is #r -25%#!, ship refit time #g -50%#!, and shipyard throughput #r -40%#!, while army offense and defense are #g +10%#!."
 chi_early_army_end_naval_neglect_decision: "End Naval Neglect"
 chi_early_army_end_naval_neglect_decision_desc: "With modern ironclads researched, China can end its policy of neglecting naval development."
 law_chi_apothecary: "Apothecary Remedies"
 law_chi_apothecary_desc: "Traditional apothecaries provide no national health institution. Their limited remedies do little to offset poor rural conditions, and subsistence peasants suffer #r +5%#! mortality."
 law_chi_religious_practices: "Religious Healing Practices"
 law_chi_religious_practices_desc: "Religious charities offer limited care at a modest institutional discount. Their weak health outcomes and increased Devout influence fall short of a broader charitable health system."
 law_chi_urban_healthcare: "Urban-Focused Healthcare"
 law_chi_urban_healthcare_desc: "Private care is concentrated among the middle and upper strata. Health institution costs are reduced less, health benefits are weaker, and subsistence peasants suffer #r +10%#! mortality."
 law_chi_national_healthcare: "National Healthcare"
 law_chi_national_healthcare_desc: "The state provides health care nationwide, but an underfunded system costs more to maintain and delivers weaker mortality, pollution, and standard-of-living benefits than public health insurance."
 law_chi_coastal_flotilla: "Coastal Flotilla"
 law_chi_coastal_flotilla_desc: "Torpedo craft and cruisers receive modest construction support, but overall shipbuilding is less efficient and naval goods cost more."
 law_chi_junk_fleet: "Junk Fleet"
 law_chi_junk_fleet_desc: "Supply and troop ships receive modest construction support, at the cost of much slower shipbuilding, weaker power projection, and higher naval goods costs."
 law_chi_imperial_dockyards: "Imperial Dockyards"
 law_chi_imperial_dockyards_desc: "A small professional naval administration supports capital-ship construction, but does so with fewer benefits and higher shipbuilding and naval goods costs."
 law_chi_imperial_dockyards_unlock_tt: "This law unlocks after choosing a capital fleet or cruiser fleet in The Navy's Direction event."
 law_chi_coastal_defense_navy: "Coastal Defense Navy"
 law_chi_coastal_defense_navy_desc: "The navy focuses modestly on cruisers and diplomatic presence, but has weaker projection, slower shipbuilding, and higher naval goods costs."
 chi_early_army_modernization_tt: "Able to pass new Army Laws"
 amendment_chi_early_army_merchant_fleet: "Merchant Fleet Expansion"
 amendment_chi_early_army_merchant_fleet_desc: "Merchant ship construction efficiency is #g +50%#!, trade advantage #g +15%#!, and Industrialists political strength #g +25%#!."
 amendment_chi_early_army_capital_fleet: "Capital Fleet Expansion"
 amendment_chi_early_army_capital_fleet_desc: "Capital ship construction efficiency and naval hiring rate are #g +25%#!; Armed Forces political strength is #g +25%#!."
 amendment_chi_early_army_cruiser_fleet: "Cruiser Fleet Expansion"
 amendment_chi_early_army_cruiser_fleet_desc: "Cruiser construction efficiency is #g +25%#! and Landowners approval is #g +5#!."
 chi_early_army_napoleonic_button: "Train Officers with Foreign Advisers"
 chi_early_army_napoleonic_button_desc: "Choose British, French, Prussian, or self-taught officer training."
 chi_early_army_rifling_button: "Modernize Rifle Production"
 chi_early_army_rifling_button_desc: "Requires Rifling, affordable Small Arms, organized Barracks, and no formations using Irregular Infantry. Reduces the army penalty by one stage and removes the Line Infantry and Mobile Artillery penalty."
 chi_early_army_general_staff_button: "Adopt a General Staff"
 chi_early_army_general_staff_button_desc: "Choose a light or heavy infantry doctrine."
 chi_early_army_screw_frigates_button: "Decide the Navy's Future"
 chi_early_army_screw_frigates_button_desc: "Choose a naval-law amendment or abandon naval development in favor of the army."
 chi_early_army.1.t: "Training a New Officer Corps"
 chi_early_army.1.d: "As China begins to reorganize its army, the court must decide how its officers will be trained. Foreign advisers offer competing models, while a self-taught corps would preserve independence at a cost."
 chi_early_army.1.f: "\"A modern army begins not only with new weapons, but with officers who know how to command them.\""
 chi_early_army.1.a: "Invite British Advisers"
 chi_early_army.1.b: "Invite French Advisers"
 chi_early_army.1.c: "Invite Prussian Advisers"
 chi_early_army.1.e: "Train Officers Ourselves"
 chi_early_army.1.gbr_relations_tt: "Relations with #v $GBR$#! must be above 20."
 chi_early_army.1.fra_relations_tt: "Relations with #v $FRA$#! must be above 20."
 chi_early_army.1.pru_ger_relations_tt: "Relations with #v $PRU$#! or #v $GER$#! must be above 20."
 chi_early_army.2.t: "Rifles for the Army"
 chi_early_army.2.d: "Rifling opens the way to a modern infantry arm. China can adopt foreign designs and knowledge or build a domestic arms industry at the cost of slower military learning."
 chi_early_army.2.f: "\"The rifle that arms the soldier may be made abroad—or mastered at home.\""
 chi_early_army.2.a: "Adopt Foreign Designs"
 chi_early_army.2.b: "Build Domestic Arms Production"
 chi_early_army.3.t: "A New Infantry Doctrine"
 chi_early_army.3.d: "With a General Staff established, the army must choose between a mobile light-infantry doctrine and heavier formations supported by artillery. Either choice will formalize the Banner and Green Standard military system."
 chi_early_army.3.f: "\"Speed and firepower cannot both be the army's first priority.\""
 chi_early_army.3.a: "Emphasize Light Infantry"
 chi_early_army.3.b: "Emphasize Heavy Infantry"
 chi_early_army.4.t: "The Navy's Direction"
 chi_early_army.4.d: "Screw frigates make naval modernization possible. The court may invest in merchant shipping, a capital fleet, or cruisers—or divert resources to the army and neglect the navy."
 chi_early_army.4.f: "\"The empire must decide whether its future lies on the sea or on the land.\""
 chi_early_army.4.a: "Expand the Merchant Fleet"
 chi_early_army.4.b: "Build a Capital Fleet"
 chi_early_army.4.c: "Build a Cruiser Fleet"
 chi_early_army.4.e: "Neglect Naval Development"
 je_homeland_development: "Homeland Development"
 je_homeland_development_reason:0 "The court has begun investing in the empire's northern homelands. Development bonuses in Northern and Southern Manchuria, Outer Manchuria, and Shandong improve infrastructure, qualifications, construction, and industrial output, but the national industrial economy suffers from the redirection of resources. The court may also launch a temporary industrial labour programme or repose assets in a northern or southern state."
 homeland_development.1.t: "A Plan for Homeland Development"
 homeland_development.1.d: "The court has approved a programme to develop Northern and Southern Manchuria, Outer Manchuria, and Shandong. New infrastructure and industrial incentives will strengthen these regions, though the national economy will bear the cost."
 homeland_development.1.f: "\"The strength of the empire begins in the prosperity of its homelands.\""
 homeland_development.1.a: "Begin the Development Programme"
 homeland_development_labour_program_button: "Expand Industrial Employment"
 homeland_development_labour_program_button_desc: "Spend #r 400#! [concept_authority] to increase light- and heavy-industry employment by #g 50%#! and throughput by #g 30%#! in the development states, with #r +25%#! mortality in those states. Manchu lower strata gain radicals, while Manchu upper strata gain loyalists; the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] lose #r 5#! approval. Requires the Landowners (at least #v +5#! approval) and Industrialists in government. After 24 months, use this button again to end the programme and receive the #g 400#! [concept_authority] back."
 homeland_development_repose_assets_button: "Repose Assets"
 homeland_development_repose_assets_button_desc: "Select a random state in North or South China. Gain #g 1,000#! [concept_money] in the treasury per level of Manor Houses in that state, increase mortality from [concept_turmoil] there by #r 10%#!, increase tax waste there by #r 10%#!, and increase its radicals by #r 10%#!. These state penalties last for one year."
 homeland_development_state: "Homeland Development"
 homeland_development_state_desc: "This state receives #g +10#! infrastructure, #g +10%#! qualification growth, #g +10%#! light- and heavy-industry construction efficiency, and #g +15%#! light- and heavy-industry throughput."
 homeland_development_national_debuff: "Resources Diverted to Homeland Development"
 homeland_development_national_debuff_desc: "Light- and heavy-industry throughput is reduced by #r 10%#! nationwide."
 homeland_labour_program: "Homeland Industrial Labour Programme"
 homeland_labour_program_landowner_penalty: "Landowner Discontent with Labour Programme"
 homeland_repose_assets: "Reposed Assets"
 je_economic_direction: "Economic Direction"
 je_economic_direction_reason:0 "China must choose a direction for its economy. Complete either path below to enact its corresponding [concept_law].\n\n#title Mixed Economic Policy#!\nEnact [GetLawType('law_chi_mixed_economic_policy').GetName]:\n[ROOT.GetCountry.GetCustom('chi_economic_direction_bureaucracy_checkbox')] Maintain at least #v 25%#! [concept_bureaucracy] surplus\n[ROOT.GetCountry.GetCustom('chi_economic_direction_no_schools_checkbox')] Abandon [GetLawType('law_chi_no_schools').GetName]\n[ROOT.GetCountry.GetCustom('chi_economic_direction_serfdom_checkbox')] Abolish [GetLawType('law_serfdom').GetName]\n[ROOT.GetCountry.GetCustom('chi_economic_direction_romanticism_checkbox')] Research [GetTechnology('romanticism').GetName]\n\n#title Industry Banned#!\nEnact [GetLawType('law_chi_industry_banned').GetName]:\n[ROOT.GetCountry.GetCustom('chi_economic_direction_local_police_checkbox')] Enact [GetLawType('law_local_police').GetName]\n[ROOT.GetCountry.GetCustom('chi_economic_direction_romanticism_checkbox')] Research [GetTechnology('romanticism').GetName]\n[ROOT.GetCountry.GetCustom('chi_economic_direction_army_projection_checkbox')] Reach #v 15,000#! Army [concept_power_projection]\n\nCompleting either path enacts its law and grants a unique modifier."
 je_economic_direction_modifier: "Unstable Economic Platform"
 economic_direction_mixed_policy: "Economic Direction: Mixed Policy"
 economic_direction_industry_banned: "Economic Direction: Industry Banned"
 chi_economic_direction_unticked: "@simple_box!"
 chi_economic_direction_ticked: "@green_checkmark_box!"
 je_confront_confucian_scholars: "Confront the Confucian Scholars"
 je_confront_confucian_scholars_reason:0 "The Confucian Scholars hold great influence over the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and their resistance to foreign ideas reinforces China's isolation. Choose how to address their influence, then carry the policy forward over the next eight years.\n\nUse the decision below to begin. It requires at least #v 3,000#! [concept_bureaucracy]. Progress advances by #v 1#! each month until reaching #v 96#!. After choosing End Isolation, a further decision will be presented once the Devout enter government."
 chi_confucian_scholars_button: "Confront the Confucian Scholars"
 chi_confucian_scholars_button_desc:0 "Requires at least #v 3,000#! [concept_bureaucracy]. Opening negotiations commits #r 3,000#! bureaucracy until #bold $je_confront_confucian_scholars$#! is completed."
 chi_confucian_scholars_end_isolation_modifier: "End Isolation"
 chi_confucian_scholars_end_isolation_modifier_desc: "The Confucian Scholars (Devout) gain #g 25%#! political strength and conversion increases by #g 25%#!."
 chi_confucian_scholars_evict_scholars_modifier: "Evict Current Scholar Cast"
 chi_confucian_scholars_evict_scholars_modifier_desc: "Political movements generate #r 10%#! more radicals, while the Confucian Scholars (Devout) lose #r 50%#! political strength."
 chi_confucian_scholars.1.t: "The Confucian Scholars"
 chi_confucian_scholars.1.d: "The court must decide whether to end China's isolation or remove the current Confucian scholarly establishment from influence. Either course will require sustained effort."
 chi_confucian_scholars.1.f: "\"A nation that refuses every new idea may preserve its customs, but it cannot command its future.\""
 chi_confucian_scholars.1.a: "End Isolation"
 chi_confucian_scholars.1.b: "Evict Current Scholar Cast"
 chi_confucian_scholars.2.t: "The Scholars' Terms"
 chi_confucian_scholars.2.d: "With the Confucian Scholars now represented in government, the court must decide whether to institutionalize their influence or reject their demands. Adopting their school amendment will strengthen conversion and the authority of the state, while burdening peasants' education and qualifications. Refusal will leave the Devout resentful for a time."
 x.2.f: "\"The rites may guide the throne, but the throne must decide what place they hold in the empire.\""
 chi_confucian_scholars.2.a: "Enshrine Confussion Focus"
 chi_confucian_scholars.2.b: "Reject the Scholars' Demands"
 chi_confucian_scholars_approval_penalty: "Rejected Confucian Scholars"
 chi_confucian_scholars_approval_penalty_desc: "The Devout are displeased by the court's rejection of their demands. Their disapproval will gradually fade."
 amendment_confussion_focus: "Confussion Focus"
 amendment_confussion_focus_desc: "The state promotes Confucian learning: #g +100%#! conversion, #g +100#! [concept_authority], and #g +25%#! Devout political strength. Peasants suffer #r -5%#! education access, and qualifications fall by #r 10%#!. The Devout leader becomes a Theocrat."
 chi_confucian_scholars_monthly_approval: "Confucian Court Audience"
 chi_confucian_scholars_monthly_approval_desc: "The Devout gain #g +5#! approval from an audience with the court. This favor gradually fades."
 chi_mandate.1.t: "The Intelligentsia's Discontent"
 chi_mandate.1.d: "The Intelligentsia's approval has fallen below zero, and its discontent threatens the court's authority. The throne must decide whether to fund the administration, accept setbacks to innovation, or suppress dissent at a grave human cost."
 chi_mandate.1.f: "\"A court may command silence, but it cannot make discontent disappear.\""
 chi_mandate.1.a: "Increase Government Funding"
 chi_mandate.1.a.tt:0 "For #v ten years#!: #r −150#! [concept_authority] and #r +50%#! government wages."
 chi_mandate.1.b: "Restrict New Ideas"
 chi_mandate.1.b.tt: "Reduces maximum weekly [concept_innovation] by #r 10#! for 3 years and creates a small number of radicals."
 chi_mandate.1.c: "Crush the Dissent"
 chi_mandate.1.c.tt: "Creates a large number of radicals and increases mortality from [concept_turmoil], but improves [concept_technology_spread] by #g 15%#! for 5 years."
 chi_mandate_funding: "Mandate Administration Funding"
 chi_mandate_funding_desc: "Government wages are increased by #g 50%#!."
 chi_mandate_suppressed_innovation: "Suppressed Innovation"
 chi_mandate_suppressed_innovation_desc: "Maximum weekly innovation is reduced by #r 10#!."
 chi_mandate_crackdown: "Repression and Technical Exchange"
 chi_mandate_crackdown_desc: "Mortality from turmoil is increased, but technology spreads #g 15%#! faster."
 chi_confucian_scholars_traditionalist_scholars: "Traditionalist Scholarship"
 chi_confucian_scholars_traditionalist_scholars_desc: "Traditionalist scholarship increases [concept_technology] spread by #g 20%#! but decreases conversion by #r 10%#!."
 chi_confucian_scholars.3.t: "The Scholars' Counsel"
 chi_confucian_scholars.3.d: "The Confucian scholars have gathered to debate the direction of the empire. Their counsel may strengthen their standing at court or turn attention toward preserving traditional learning."
 chi_confucian_scholars.3.f: "\"The teachings of the sages are a well from which every generation must draw anew.\""
 chi_confucian_scholars.3.a: "Hear the Devout"
 chi_confucian_scholars.3.b: "Preserve Traditional Learning"
 chi_confucian_scholars_protest_talks: "Negotiations with the Devout"
 chi_confucian_scholars_protest_talks_desc: "The Devout gain #g 15%#! political strength for five years after negotiations."
 chi_confucian_scholars_protest_concessions: "Concessions to the Devout"
 chi_confucian_scholars_protest_concessions_desc: "The Devout gain #g 30%#! political strength for five years. Mortality from turmoil is reduced by #g 5%#! for five years, gradually decaying. The Confucian Concessions amendment increases Devout political strength, improves Society technology spread, but reduces Production technology spread and Industrialist approval."
 chi_confucian_scholars_concessions_mortality: "Relief After the Protests"
 chi_confucian_scholars_concessions_mortality_desc: "Mortality from turmoil is reduced by #g 5%#! for five years, gradually decaying."
 chi_confucian_scholars_spreading_protests_mortality: "Humanitarian Relief Amid Protests"
 chi_confucian_scholars_spreading_protests_mortality_desc: "Mortality from turmoil is reduced by #g 10%#! for five years, gradually decaying."
 amendment_confucian_concessions: "Confucian Concessions"
 amendment_confucian_concessions_desc: "The Devout gain #g 15%#! political strength. Society technology spread increases by #g 2%#!, while Production technology spread falls by #r 5%#! and Industrialist approval falls by #r 3#!."
 chi_confucian_scholars.4.t: "The Devout Protest"
 chi_confucian_scholars.4.d: "The Devout, emboldened by their standing, have taken to the streets to demand concessions from the court. We may negotiate, grant concessions while unrest spreads, or allow the demonstrations to grow into a wider crisis."
 chi_confucian_scholars.4.f: "\"The court must hear the faithful, lest their silence become a greater threat than their demands.\""
 chi_confucian_scholars.4.a: "Negotiate with the Devout"
 chi_confucian_scholars.4.a_tt: "Only available if the Devout have at least #v +10#! approval. Grants #g 15%#! Devout political strength and #g 20#! Journal Entry progress."
 chi_confucian_scholars.4.b: "Grant Concessions"
 chi_confucian_scholars.4.b_tt: "The Devout gain #g 30%#! political strength for five years and receive a school amendment that grants a further #g 15%#!. Mortality from turmoil falls by #g 5%#! for five years, gradually decaying. Clergy pops gain a small number of radicals, and Journal Entry progress falls by #r 5#!. The amendment reduces Industrialist approval by #r 3#! and Production technology spread by #r 5%#!, while increasing Society technology spread by #g 2%#!."
 chi_confucian_scholars.4.c: "Let the Protests Spread"
 chi_confucian_scholars.4.c_tt: "Mortality from turmoil falls by #g 10%#! for five years, gradually decaying. Clergy pops gain a very large number of radicals. Journal Entry progress increases by #g 10#!."
 chi_confucian_western_medicine: "Western Medical Learning"
 chi_confucian_western_medicine_desc: "Society technology spread increases by #g 25%#! while mortality falls by #g 5%#!. This ten-year benefit gradually decays."
 chi_confucian_western_agriculture: "Western Agricultural Practices"
 chi_confucian_western_agriculture_desc: "Production technology spread increases by #g 15%#! and Agriculture throughput increases by #g 10%#! for ten years."
 chi_confucian_scholars.5.t: "Western Practices"
 chi_confucian_scholars.5.d: "As the court debates the Confucian scholars, reports of Western methods arrive from abroad. The empire may study new medical and scientific methods, improve agricultural production, or spread these ideas through mass communication."
 chi_confucian_scholars.5.f: "\"A useful method should be judged by what it can accomplish, not by the distance from which it came.\""
 chi_confucian_scholars.5.a: "Study Western Medicine and Science"
 chi_confucian_scholars.5.a_tt: "Unlocks Medical Degrees and Empiricism. Grants +25% Society technology spread and -5% mortality for ten years, gradually decaying."
 chi_confucian_scholars.5.b: "Adopt Intensive Agriculture"
 chi_confucian_scholars.5.b_tt: "Unlocks Intensive Agriculture. Grants +15% Production technology spread and +10% Agriculture throughput for ten years."
 chi_confucian_scholars.5.c: "Spread the New Ideas"
 chi_confucian_scholars.5.c_tt:0 "Advances this Journal Entry by #g 40#!, up to its goal of #v 96#!."
 amendment_chi_manchu_customs: "Manchu Customs"
 amendment_chi_manchu_customs_desc: "Education follows Manchu customs, reinforcing the dynasty's authority and assimilation while discouraging popular discontent. Schools become more expensive and education fervor declines."
 chi_confucian_manchu_literacy: "Imperial Literacy Campaign"
 chi_confucian_manchu_literacy_desc: "Education Access increases by #g 10%#! for ten years."
 chi_confucian_manchu_customs_rejection: "Manchu Customs Rejected"
 chi_confucian_manchu_customs_rejection_desc: "The Devout lose #r 5#! approval for ten years, gradually decaying."
 chi_confucian_scholars.6.t: "Manchu Customs"
 chi_confucian_scholars.6.d: "At a decisive point in the struggle over the Confucian scholars, the court must choose how to reconcile Manchu traditions with the empire's future. It may enshrine Manchu customs in education, fund a literacy campaign, or reject the proposal and face discontent among the Manchu population."
 chi_confucian_scholars.6.f: "\"The customs of the ruling house are the roots from which the dynasty draws its strength.\""
 chi_confucian_scholars.6.a: "Enact Manchu Customs"
 chi_confucian_scholars.6.a_tt:0 "Adds #bold $amendment_chi_manchu_customs$#! to the current education law."
 chi_confucian_scholars.6.b: "Fund an Imperial Literacy Campaign"
 chi_confucian_scholars.6.b_tt:0 "For #v ten years#!: #r −350#! [concept_authority] and #g +10%#! Education Access."
 chi_confucian_scholars.6.c: "Reject the Customs"
 chi_confucian_scholars.6.c_tt: "Adds #r 10%#! radicals to Manchu-culture pops, reduces Devout approval by #r 5#! for ten years with decay, and removes #r 10#! progress from the Journal Entry."

 ideology_chi_landowners: "Perennial Traditionist"
  ideology_chi_landowners_desc: "The Landowners are a conservative faction that seeks to preserve the traditional social order and maintain their influence over the peasantry. They resist radical reforms and advocate for policies that protect their economic interests."
 ideology_chi_devout_traditionalist: "Devouted Confucian Isolatist"
 ideology_chi_devout_traditionalist_desc: "The Devouted Confucian Isolatist are a religious faction that emphasizes the importance of traditional Confucian values and the isolation of China from foreign influences. They support policies that reinforce Confucian teachings and resist Westernization."
 ideology_chi_devout_scholar: "Devouted Confucian Scholars"
 ideology_chi_devout_scholar_desc: "The Devouted Confucian Scholars are an intellectual faction that values education, scholarship, and the preservation of Confucian teachings. They advocate for policies that promote learning and maintain the cultural heritage of China."


chi_confucian_scholars_button_modifier: "Eduction Costs"
je_confront_confucian_scholars_goal: "On #bold Completion#! The respective paths will enact their corresponding [concept_law] and grant a unique modifier."

chi_confucian_scholars.2.a_pulse_by_25_tt: "The #bold Journal Entry progress bar will#! advance by #g 25#!."
chi_confucian_scholars.3.a_pulse_by_15_tt: "The #bold Journal Entry progress bar will#! advance by #g 15#!, while the Confucian Scholars (Devout) gain #g 5#! approval."
chi_confucian_scholars.3.a_pulse_to_complete_tt: "The #bold Journal Entry progress bar#! will be completed while the Confucian Scholars (Devout) gain #g 5#! approval."

chi_opium_ban_tt: "#r All $building_opium_plantation$ buildings will be destroyed#! \n The #bold Opium Ban#!, is a law that prohibits the production, sale, and consumption of opium within the empire."
 chi_early_army_stage_remaining_tt:0 "Early army modernization is not yet complete."
 chi_confucian_scholars.2.f:0 "The scholars have taken their seats at court. They now expect a place in its schools."


 chi_mandate_centralisation_low_hover:0 "#header [GetStaticModifier('chi_mandate_centralisation_low').GetName]#!\n[GetStaticModifier('chi_mandate_centralisation_low').GetDesc]"
 chi_mandate_centralisation_mid_hover:0 "#header [GetStaticModifier('chi_mandate_centralisation_mid').GetName]#!\n[GetStaticModifier('chi_mandate_centralisation_mid').GetDesc]"
 chi_mandate_centralisation_high_hover:0 "#header [GetStaticModifier('chi_mandate_centralisation_high').GetName]#!\n[GetStaticModifier('chi_mandate_centralisation_high').GetDesc]"

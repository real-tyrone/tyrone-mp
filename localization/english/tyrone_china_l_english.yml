 chi_mandate.5.t:0 "A Central Bank"
 chi_mandate.5.d:0 "A central bank gives the treasury a firmer hold over credit and currency. Provincial finances can now be brought under closer supervision."
 chi_mandate.5.f:0 "Accounts once scattered among provincial offices are brought before a common authority."
 chi_mandate.5.a:0 "Bring provincial finance under central supervision."
 chi_mandate.6.t:0 "A Recorded Population"
 chi_mandate.6.d:0 "Standard identification documents allow officials to follow people and obligations across provincial boundaries. Local records are becoming part of a common administrative system."
 chi_mandate.6.f:0 "A document issued in one province can now be read and recognized in another."
 chi_mandate.6.a:0 "Establish a common register."
 chi_mandate.7.t:0 "Practical Government"
 chi_mandate.7.d:0 "Officials are judging administrative methods by their results. Practices that once varied from province to province can be revised against a common standard."
 chi_mandate.7.f:0 "The court asks what a measure accomplishes before deciding whether to preserve it."
 chi_mandate.7.a:0 "Put practical administration into effect."
 chi_mandate.8.t:0 "An Empire under One Plan"
 chi_mandate.8.d:0 "Central planning gives the government a means to coordinate provincial resources and public works. Decisions made separately can now be brought into a common program."
 chi_mandate.8.f:0 "Provincial estimates arrive at the capital, where their demands are weighed together."
 chi_mandate.8.a:0 "Coordinate the provincial plans."
 chi_centralisation_technology_effect:0 "Researching [GetTechnology('central_banking').GetName], [GetTechnology('identification_documents').GetName], [GetTechnology('philosophical_pragmatism').GetName] and [GetTechnology('central_planning').GetName] grants #g +1#! Centralisation each (once per technology)."
 chi_mandate_centralisation_gain_tt:0 "#g +1#! Centralisation"

 law_chi_state_directorate:0 "State Directorate"
 law_chi_state_directorate_desc:0 "A central directorate coordinates provincial offices and trains officials for service under the national government."

 chi_mandate_consolidated_authority:0 "A Consolidated Mandate"
 chi_mandate_consolidated_authority_desc:0 "Central authority has secured a lasting settlement with the provincial administration and the groups serving in government."

 chi_mandate_centralisation_gain_2_tt:0 "#g +2#! Centralisation"

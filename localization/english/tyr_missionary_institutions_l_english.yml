l_english:
 tyr_missionary_pledge_required_tt:0 "The province has pledged support to the Heavenly Kingdom."
 tyr_missionary_permission_required_tt:0 "The province has chosen Permit Foreign Missions."
 tyr_missionary_schools_button:0 "Invite Christian Missionary Schools"
 tyr_missionary_schools_button_desc:0 "Invite missionaries to propose schools in one randomly selected eligible owned state. Opens the existing missionary event, where you may accept or refuse. Requires a Heavenly Kingdom pledge and Permit Foreign Missions. Cooldown: twelve months."
 tyr_missionary_schools_state_tt:0 "An owned state is open to Christian missions and does not already have Missionary Schools."
 tyr_missionary_schools_ready_tt:0 "No missionary schools invitation has been issued in the last #v twelve months#!."
 tyr_missionary_schools_effect_tt:0 "Open the existing missionary schools event for one randomly selected eligible owned state. Its choices show the exact modifier effects and duration. Acceptance converts #v 1%#! of the state's population to Protestantism; refusal applies the existing rebuked-missionaries modifier. No treasury cost is charged by this invitation. Begin a #v twelve-month#! cooldown and advance Qing's shared missionary-activity counter by #v 1#!."
 tyr_missionary_hospitals_button:0 "Invite Christian Missionary Hospitals"
 tyr_missionary_hospitals_button_desc:0 "Invite missionaries to propose hospitals in one randomly selected eligible owned state. Opens the existing missionary event, where you may accept or refuse. Requires a Heavenly Kingdom pledge and Permit Foreign Missions. Cooldown: twelve months."
 tyr_missionary_hospitals_state_tt:0 "An owned state is open to Christian missions and does not already have Missionary Hospitals."
 tyr_missionary_hospitals_ready_tt:0 "No missionary hospitals invitation has been issued in the last #v twelve months#!."
 tyr_missionary_hospitals_effect_tt:0 "Open the existing missionary hospitals event for one randomly selected eligible owned state. Its choices show the exact modifier effects and duration. Acceptance converts #v 1%#! of the state's population to Protestantism; refusal applies the existing rebuked-missionaries modifier. No treasury cost is charged by this invitation. Begin a #v twelve-month#! cooldown and advance Qing's shared missionary-activity counter by #v 1#!."

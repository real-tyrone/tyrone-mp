 tyr_gir_ch_orders_tt:0 "#r +10#! required building levels in the current programme. The deadline and sector reward are unchanged."

 tyr_gir_ch_spacing_wait:0 "Next exceptional initiative: #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_exceptional_cooldown'))]#!."
 tyr_gir_ch_spacing_available:0 "#g Available#! — three years between exceptional initiatives."

 tyr_gir_ch.1.f:0 "The secretary reaches for a larger map."

 tyr_gir_ch.2.f:0 "For once, the smallest figure in the margin commands the whole room’s attention."

 tyr_gir_ch.3.f:0 "A place at the table is worth more than a speech from the gallery."

 tyr_gir_ch.4.f:0 "The reply occupies three lines. The file it closes fills a shelf."

 tyr_gir_ch.5.f:0 "The demonstration ends when someone notices that the candles have burned down."

 tyr_gir_ch.6.f:0 "The banker reads the signature before the proposal."

 tyr_gir_ch.7.f:0 "For an afternoon, the factory gate serves as a public square."

 tyr_gir_ch.8.f:0 "The youngest apprentice is told to stand well back."

 tyr_gir_ch.9.f:0 "One applicant has written so often that the clerk recognises the handwriting at once."

 tyr_gir_ch.10.f:0 "The next morning’s newspapers find very little to report."

 tyr_gir_ch.11.f:0 "The thickest document in the bundle concerns the simplest delivery."

 tyr_gir_ch.12.f:0 "The prepared address goes home folded in the speaker’s pocket."

 tyr_gir_ch.13.f:0 "The railway is new. The names along its proposed route are very old."

 tyr_gir_ch.14.f:0 "A polished boot rests beside the leg of a manufacturer’s chair."

 tyr_gir_ch.15.f:0 "Several hands pause before joining the applause."

 tyr_gir_ch.16.f:0 "The lamps are lit before the afternoon shift has gone home."

 tyr_gir_ch.101.f:0 "The last signatory asks for a fresh pen. The first has already begun calculating."

 tyr_gir_ch.102.f:0 "An inspector assembles the mechanism without reaching for a file."

 tyr_gir_ch.103.f:0 "On the wall hangs a model plan, copied until its corners curl."

 tyr_gir_ch.104.f:0 "The inspector leaves a copy by the gate, where the workers can read it."

 tyr_gir_ch.105.f:0 "Nobody calls the settlement perfect. For once, that is not an objection."

 tyr_gir_ch.106.f:0 "The official checks the date twice, then calls for the waiting petitioner."

 tyr_gir_ch.107.f:0 "The commission’s seal is pressed into the wax while the objections are still being read."

 tyr_gir_ch.108.f:0 "The envelope contains a failed experiment, carefully described so that nobody need repeat it."

 tyr_gir_ch.109.f:0 "A hand accustomed to a spanner turns the pencil until it sits comfortably."

 tyr_gir_ch.110.f:0 "The clerk rules another column before the morning’s subscribers have finished arriving."

 tyr_gir_contract_resolution_header:0 "The Programme Is Reviewed"
 tyr_gir_contract_resolution_tt:0 "The industrial programme is assessed at its deadline. Meeting the building commitment raises the selected sector’s development; falling short lowers it by #v 1#!, to a minimum of #v 1#!."

 tyr_gir.1.f:0 "Across the table, a merchant unrolls another map. The boundaries are new; the rivalries are not."

 tyr_gir.2.f:0 "The factory whistle carries across the morning streets. In the ministries, the lamps are already burning."

 tyr_gir.9.f:0 "The clerk has left a space for the signature. Everything else has been argued over twice."

 tyr_gir.30.f:0 "A clerk sands the final page. Beyond the ministry windows, the day's work goes on."

 tyr_gir_gui_month_singular:0 "month"
 tyr_gir_gui_month_plural:0 "months"


 tyr_gir.30.a:0 "There is more to build."
 tyr_gir.30.t:0 "The Ledgers of Progress"
 tyr_gir.30.d:0 "Three years of orders, excavation and building work have been reduced to a stack of provincial returns. Ministers examine the totals while the newspapers prepare their verdict. Behind the figures lie fortunes made, projects abandoned and towns altered beyond recognition. The Chancellor must now account for the programme.\n\n$tyr_gir_result_display$\n$tyr_gir_plan_display$\nFinal levels: [ROOT.GetCountry.MakeScope.Var('tyr_gir_current').GetValue|0] / [ROOT.GetCountry.MakeScope.Var('tyr_gir_target').GetValue|0]."


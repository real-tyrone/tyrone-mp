l_english:
 tyr_lj_huizhou_domestic_button:0 "Convene the Huizhou Merchant Houses"
 tyr_lj_huizhou_domestic_button_desc:0 "Invest provincial funds in domestic finance, transport, tea, and timber networks. This initiative is available under Isolationism and costs @money!#v £20,000#!."
 tyr_lj_huizhou_expansion_button:0 "Expand the Huizhou Networks Abroad"
 tyr_lj_huizhou_expansion_button_desc:0 "Commit @money!#v £40,000#! to connect the merchant houses with Shanghai's foreign commerce. Liangjiang must have left Isolationism and maintain an accessible port in Suzhou."
 tyr_lj_examination_hall_button:0 "Review the Jiangnan Examination Hall"
 tyr_lj_examination_hall_button_desc:0 "Spend between @money!#v £15,000#! and @money!#v £25,000#! to preserve, audit, or modernize the examinations administered from Nanjing."
 tyr_lj_arsenal_stage_1_button:0 "Establish the Jiangnan Machine Workshops"
 tyr_lj_arsenal_stage_1_button_desc:0 "Commit @money!#v £30,000#! to establish machine workshops in Nanjing. The project grants #v 5%#! manufacturing throughput for #v 5 years#!."
 tyr_lj_arsenal_stage_2_button:0 "Modernize Jiangnan Armaments"
 tyr_lj_arsenal_stage_2_button_desc:0 "Commit @money!#v £50,000#! to establish the Jiangnan Arsenal as a company. The armaments programme grants #v 10%#! military-industry throughput and #v 5%#! army offense for #v 8 years#!."
 tyr_lj_arsenal_stage_3_button:0 "Found the Translation and Technical Bureau"
 tyr_lj_arsenal_stage_3_button_desc:0 "Commit @money!#v £40,000#! to scientific translation and technical instruction. The bureau grants #v 5%#! technology spread and #v 10%#! qualifications for #v 10 years#!."
 tyr_lj_arsenal_stage_1_requirements:0 "Liangjiang owns incorporated Nanjing, has researched $lathe$, operates at least #v 5#! $building_tooling_workshop$ levels there, and holds @money!#v £30,000#!."
 tyr_lj_arsenal_stage_2_requirements:0 "The machine workshops are established, $breech_loading_artillery$ is researched, Nanjing has at least #v 5#! $building_arms_industry$ levels, and Liangjiang holds @money!#v £50,000#!."
 tyr_lj_arsenal_stage_3_requirements:0 "The armaments programme is complete, $empiricism$ and $academia$ are researched, Nanjing has at least #v 3#! $building_university$ levels, and Liangjiang holds @money!#v £40,000#!."
 tyr_lj_huai_army_button:0 "Organize the Huai Army"
 tyr_lj_huai_army_button_desc:0 "Respond to war or severe provincial unrest by organizing a regional army. Liangjiang needs at least #v 10#! barracks levels and @money!#v £30,000#!."
 tyr_lj_shanghai_customs_button:0 "Reform the Customs of Shanghai"
 tyr_lj_shanghai_customs_button_desc:0 "Commit up to @money!#v £25,000#! to reorganize customs collection. Foreign commerce, an accessible Suzhou port, and $central_archives$ are required."
 tyr_lj_steam_navigation_button:0 "Steamships on the Yangtze"
 tyr_lj_steam_navigation_button_desc:0 "Commit @money!#v £50,000#! to establish the China Merchants Steam Navigation Company. This requires foreign commerce, $railways$, $gantry_cranes$, and #v 5#! shipyard levels in Suzhou."
 tyr_lj_yellow_river_button:0 "Repair the Yellow River Embankments"
 tyr_lj_yellow_river_button_desc:0 "Address unrest or inadequate infrastructure in Henan. The initiative disappears if Liangjiang no longer owns land in Henan."
 tyr_lj_nanjing_wartime_button:0 "Determine the Fate of Jiangning"
 tyr_lj_nanjing_wartime_button_desc:0 "Choose how Nanjing's administration, defenses, and relief network will serve Liangjiang's declared position during the Taiping conflict."
 tyr_lj_nanjing_wartime_decision:0 "Determine the Fate of Jiangning"
 tyr_lj_nanjing_wartime_decision_desc:0 "Organize Nanjing's administration, supply network, and relief institutions according to Liangjiang's position in the Taiping conflict."
 tyr_lj_foreign_commerce_required_tt:0 "Liangjiang has left $law_isolationism$ and maintains an accessible port in Suzhou."
 tyr_lj_salt_accounts_button:0 "Reconcile the Liang-Huai Salt Accounts"
 tyr_lj_salt_accounts_button_desc:0 "Spend at least @money!#v £15,000#! and commit administrative capacity to reform salt transport and collection. The settlement is one-time and produces no direct treasury grant."
 tyr_lj_reconstruct_jiangnan:0 "Reconstruct Jiangnan"
 tyr_lj_reconstruct_jiangnan_desc:0 "Commit @money!#v £30,000#! after the Taiping fighting to restore infrastructure, agriculture, workshops, and provincial institutions around Nanjing and Suzhou."
 tyr_lj_corruption_gain_3_tt:0 "@chi_adm_corruption![Nbsp][concept_chi_adm_corruption]: #r +3#! (bounded to #v 0–100#!)"
 tyr_lj_corruption_loss_3_tt:0 "@chi_adm_corruption![Nbsp][concept_chi_adm_corruption]: #g -3#! (bounded to #v 0–100#!)"
 tyr_lj_corruption_loss_4_tt:0 "@chi_adm_corruption![Nbsp][concept_chi_adm_corruption]: #g -4#! (bounded to #v 0–100#!)"

 tyr_lj_huizhou_investment:0 "Huizhou Domestic Investment"
 tyr_lj_huizhou_investment_desc:0 "Provincial investment improves revenue collection and the domestic tea trade throughout Liangjiang."
 tyr_lj_salt_supervision:0 "Supervised Liang-Huai Salt Accounts"
 tyr_lj_salt_supervision_desc:0 "Audited transport certificates improve collection while occupying provincial clerks."
 tyr_lj_salt_franchises:0 "Licensed Salt Franchises"
 tyr_lj_salt_franchises_desc:0 "Merchant franchises ease administration while expanding private influence over salt transport."
 tyr_lj_huizhou_privileges:0 "Huizhou Merchant Privileges"
 tyr_lj_huizhou_privileges_desc:0 "Merchant privileges expand domestic tea production and furniture workshops throughout Liangjiang, while weakening oversight of the merchant houses."
 tyr_lj_huizhou_supervision:0 "Supervised Merchant Accounts"
 tyr_lj_huizhou_supervision_desc:0 "Provincial clerks monitor commercial receipts and contracts at considerable administrative expense."
 tyr_lj_huizhou_foreign_expansion:0 "Huizhou Commercial Expansion"
 tyr_lj_huizhou_foreign_expansion_desc:0 "The merchant houses have connected their domestic networks with Shanghai's overseas commerce."
 tyr_lj_classical_examinations:0 "The Classical Examination Establishment"
 tyr_lj_classical_examinations_desc:0 "The Jiangnan Examination Hall remains the institutional center of scholarly recruitment."
 tyr_lj_exam_administration:0 "Reformed Examination Administration"
 tyr_lj_exam_administration_desc:0 "Audited rolls and stricter supervision have reduced patronage in the examination system."
 tyr_lj_practical_studies:0 "Practical Studies at Jiangnan"
 tyr_lj_practical_studies_desc:0 "Mathematics, technical subjects, and administrative science now supplement the classical curriculum."
 tyr_lj_machine_workshops:0 "Jiangnan Machine Workshops"
 tyr_lj_machine_workshops_desc:0 "Machine tools and trained mechanics support the first stage of the Jiangnan Arsenal."
 tyr_lj_modern_armaments:0 "Modernized Jiangnan Armaments"
 tyr_lj_modern_armaments_desc:0 "Standardized orders and modern workshops improve military production and equipment."
 tyr_lj_translation_bureau:0 "Jiangnan Translation and Technical Bureau"
 tyr_lj_translation_bureau_desc:0 "Translators and instructors circulate foreign technical works through the provincial administration."
 tyr_lj_huai_army_local:0 "Locally Financed Huai Army"
 tyr_lj_huai_army_local_desc:0 "A strong regional command answers quickly to the viceroy while drawing resources away from the civil administration."
 tyr_lj_huai_army_imperial:0 "Imperially Sponsored Huai Army"
 tyr_lj_huai_army_imperial_desc:0 "Court sponsorship has placed the regional army within a more closely supervised military arrangement."
 tyr_lj_shanghai_customs_provincial:0 "Provincial Shanghai Customs"
 tyr_lj_shanghai_customs_provincial_desc:0 "Liangjiang supervises the customs offices and retains control of their accounts."
 tyr_lj_shanghai_customs_central:0 "Centralized Shanghai Customs"
 tyr_lj_shanghai_customs_central_desc:0 "Customs administration is coordinated with the imperial bureaucracy."
 tyr_lj_steam_navigation:0 "Steamships on the Yangtze"
 tyr_lj_steam_navigation_desc:0 "Modern shipping links Shanghai, Nanjing, and the commercial ports of the Yangtze."
 tyr_lj_yellow_river_repaired:0 "Repaired Yellow River Embankments"
 tyr_lj_yellow_river_repaired_desc:0 "Reinforced embankments and relief depots reduce the human and economic cost of flooding."
 tyr_lj_nanjing_defenses:0 "Defense of Jiangning"
 tyr_lj_nanjing_defenses_desc:0 "Provincial troops, stores, and transport have been organized for the defense of Nanjing."
 tyr_lj_heavenly_capital_administration:0 "Administration of the Heavenly Capital"
 tyr_lj_heavenly_capital_administration_desc:0 "Liangjiang's clerks and supply networks sustain the institutions gathered around Nanjing."
 tyr_lj_neutral_relief:0 "Neutral Relief in Jiangnan"
 tyr_lj_neutral_relief_desc:0 "Commercial associations and local officials protect civilians and maintain essential transport."
 tyr_lj_jiangnan_reconstruction:0 "Reconstruction of Jiangnan"
 tyr_lj_jiangnan_reconstruction_desc:0 "Restored roads, workshops, fields, and public offices support the lower Yangtze's recovery."

 tyr_liangjiang.1.t:0 "The Merchant Houses of Huizhou"
 tyr_liangjiang.1.d:0 "Merchant families from southern Anhui have offered to coordinate credit, tea, timber, and transport across Liangjiang. Their domestic networks do not depend upon foreign trade, but the terms under which they operate will shape provincial revenue and official supervision."
 tyr_liangjiang.1.f:0 "\"A merchant's road is drawn in ledgers before it is worn into the earth. The governor need only decide whose seal appears upon the first page.\""
 tyr_liangjiang.1.a:0 "Invest in the domestic networks."
 tyr_liangjiang.1.b:0 "Grant the houses wider privileges."
 tyr_liangjiang.1.c:0 "Place their accounts under supervision."
 tyr_liangjiang.2.t:0 "Huizhou Commerce Abroad"
 tyr_liangjiang.2.d:0 "With Shanghai open to foreign commerce, the Huizhou houses can connect inland finance and transport with overseas shipping. The expansion requires substantial capital and dependable port administration."
 tyr_liangjiang.2.f:0 "\"The old routes end at the river wharf. Beyond it, the steamers carry our contracts farther than any mule train.\""
 tyr_liangjiang.2.a:0 "Finance the commercial expansion."
 tyr_liangjiang.defer:0 "The accounts are not yet ready."
 tyr_liangjiang.3.t:0 "The Examination Rolls of Jiangnan"
 tyr_liangjiang.3.d:0 "The Jiangnan Examination Hall in Nanjing receives candidates from across the lower Yangtze. Scholars defend its classical curriculum, auditors report patronage in its rolls, and reformers demand instruction suited to technical administration."
 tyr_liangjiang.3.f:0 "\"Ten thousand brushes move across ten thousand pages. In the counting rooms outside, the clerks wonder how many answers were written before the questions were asked.\""
 tyr_liangjiang.3.a:0 "Preserve the classical examinations."
 tyr_liangjiang.3.b:0 "Audit and reform the examination administration."
 tyr_liangjiang.3.c:0 "Introduce mathematics and practical studies."
 tyr_liangjiang.4.t:0 "The Formation of the Huai Army"
 tyr_liangjiang.4.d:0 "Military danger has exposed the limits of ordinary provincial forces. Officers from Anhui propose a locally financed army able to move along the Yangtze, while the court's representatives insist that any new command remain answerable to imperial authority."
 tyr_liangjiang.4.f:0 "\"A regiment raised nearby reaches the threatened district first. It also remembers who paid its first wages.\""
 tyr_liangjiang.4.a:0 "Finance a provincial command."
 tyr_liangjiang.4.b:0 "Request imperial sponsorship."
 tyr_liangjiang.5.t:0 "The Customs of Shanghai"
 tyr_liangjiang.5.d:0 "Foreign shipping has made Shanghai's customs accounts too important for informal collection. Liangjiang may retain provincial supervision or coordinate the offices more closely with the imperial administration."
 tyr_liangjiang.5.f:0 "\"Every crate bears a mark, every captain carries a manifest, and every office claims that the missing silver belongs in another ledger.\""
 tyr_liangjiang.5.a:0 "Keep collection under provincial supervision."
 tyr_liangjiang.5.b:0 "Centralize the customs accounts."
 tyr_liangjiang.6.t:0 "The Yellow River Embankments"
 tyr_liangjiang.6.d:0 "The officials responsible for Henan report weakened embankments, inadequate roads, and villages unable to bear another flood. Liangjiang can finance repairs, request imperial aid, or leave responsibility with local officials."
 tyr_liangjiang.6.f:0 "\"The river does not read memorials. It recognizes earth, timber, stone, and the labor of those ordered to place them.\""
 tyr_liangjiang.6.a:0 "Fund the embankments and relief depots."
 tyr_liangjiang.6.b:0 "Request assistance from the court."
 tyr_liangjiang.6.c:0 "Delegate the work to local officials."
 tyr_liangjiang.7.t:0 "The Fate of Jiangning"
 tyr_liangjiang.7.d_loyal:0 "The Taiping conflict has made Nanjing the hinge of the lower Yangtze. Loyal officials demand fortifications, protected archives, and a secure military supply network."
 tyr_liangjiang.7.d_taiping:0 "Liangjiang's defection has placed Nanjing at the center of the Heavenly cause. The new order requires revenue offices, stores, and dependable routes along the Yangtze."
 tyr_liangjiang.7.d_neutral:0 "Liangjiang has withheld its forces from both camps. Merchants and magistrates now demand relief stores, guarded roads, and guarantees that commerce will survive the conflict."
 tyr_liangjiang.7.f:0 "\"Whichever banner hangs above the walls, the granaries must open in the morning and the barges must still find the wharf.\""
 tyr_liangjiang.7.a:0 "Fortify Jiangning for the Qing."
 tyr_liangjiang.7.b:0 "Organize the administration of the Heavenly Capital."
 tyr_liangjiang.7.c:0 "Protect commerce and civilian relief."
 tyr_liangjiang.8.t:0 "The Reconstruction of Jiangnan"
 tyr_liangjiang.8.d:0 "The fighting has ended, but damaged roads, workshops, fields, and offices still obstruct recovery around Nanjing and Suzhou. Provincial funds can restore the institutions upon which Jiangnan's commerce depends."
 tyr_liangjiang.8.d_subject:0 "As a province under Heavenly protection, Liangjiang must rebuild Nanjing and Suzhou while meeting the obligations of its new compact."
 tyr_liangjiang.8.d_independent:0 "Recognition has left Liangjiang responsible for its own recovery. The roads, workshops, fields, and offices of Jiangnan require a coordinated reconstruction programme."
 tyr_liangjiang.8.f:0 "\"The walls bear fresh plaster. The ledgers begin with old debts. Recovery is the art of deciding which must be repaired first.\""
 tyr_liangjiang.8.a:0 "Rebuild the institutions of Jiangnan."
 tyr_liangjiang.9.t:0 "The Liang-Huai Salt Accounts"
 tyr_liangjiang.9.d:0 "Salt certificates, transport monopolies, and merchant advances bind the Liang-Huai trade to provincial revenue. Auditors demand supervised books, licensed merchants defend their franchises, and the court asks that the accounts be placed under imperial review."
 tyr_liangjiang.9.f:0 "\"The salt is weighed at the depot. The obligation changes weight each time the certificate crosses a desk.\""
 tyr_liangjiang.9.a:0 "Place transport certificates under supervision."
 tyr_liangjiang.9.b:0 "Confirm licensed merchant franchises."
 tyr_liangjiang.9.c:0 "Submit the accounts for imperial review."

 tyr_taiping_propose_independence:0 "Negotiate Recognized Independence"
 tyr_taiping_propose_independence_desc:0 "Ask the Heavenly Kingdom to recognize the province as a sovereign country. The opening offer includes @money!#v £30,000#! and five years of military cooperation."
 tyr_taiping_propose_subjecthood:0 "Negotiate Heavenly Subjecthood"
 tyr_taiping_propose_subjecthood_desc:0 "Seek protection under the Heavenly Kingdom while retaining the provincial administration as a playable subject. The compact imposes remittance, military, and diplomatic obligations."
 tyr_taiping_propose_incorporation:0 "Negotiate Full Incorporation"
 tyr_taiping_propose_incorporation_desc:0 "Offer to dissolve the separate provincial administration and transfer its entire territory to the Heavenly Kingdom. A human governor must ratify the final agreement."
 tyr_taiping_settlement_ready_tt:0 "The province has defected from Qing, remains sovereign, and neither side is handling another settlement proposal."
 tyr_taiping_independence_proposal_tt:0 "The Heavenly Kingdom will consider recognizing the province's sovereignty in return for payment and temporary military cooperation."
 tyr_taiping_subjecthood_proposal_tt:0 "The Heavenly Kingdom will consider an administrative compact. The province retains its Chinese viceroyalty, provincial administration or frontier administration relationship under the Heavenly Kingdom, remains playable, joins its overlord's wars, and accepts the compact's additional remittance obligations."
 tyr_taiping_incorporation_proposal_tt:0 "The Heavenly Kingdom will consider full incorporation. Ratification will transfer the province's territory and end its separate administration."
 tyr_taiping_independence_obligations:0 "Heavenly Recognition Obligations"
 tyr_taiping_independence_obligations_desc:0 "Recognition was secured through a temporary commitment to military and diplomatic cooperation."
 tyr_taiping_subject_compact:0 "Heavenly Provincial Compact"
 tyr_taiping_subject_compact_desc:0 "The province retains its administration under Heavenly protection while remitting additional income and joining the overlord's wars."
 tyr_taiping_subject_compact_strict:0 "Revised Heavenly Provincial Compact"
 tyr_taiping_subject_compact_strict_desc:0 "The province retains its administration under Heavenly protection while accepting a heavier remittance and stricter political obligations."
 tyr_taiping_regional_logistics:0 "Taiping War Logistics"
 tyr_taiping_regional_logistics_desc:0 "Provincial transport, stores, and military communications have been organized for the civil war."

 tyr_taiping_settlement.1.t:0 "A Governor's Settlement Proposal"
 tyr_taiping_settlement.1.d:0 "A provincial governor who broke with the Qing has requested a lasting political settlement. Recognition may secure cooperation, subjecthood may bind the administration more closely, and incorporation may strengthen the Heavenly Kingdom at the cost of assuming its local obligations."
 tyr_taiping_settlement.1.f:0 "\"Defection opened the gate. It did not decide who would hold the keys when the war was over.\""
 tyr_taiping_settlement.1.a:0 "Accept the proposed settlement."
 tyr_taiping_settlement.1.b:0 "Demand stricter obligations."
 tyr_taiping_settlement.1.c:0 "Reject the proposal."
 tyr_taiping_settlement.2.t:0 "Terms Accepted at Nanjing"
 tyr_taiping_settlement.2.d:0 "The Heavenly Kingdom has accepted the proposed political settlement. It will take effect only if this administration ratifies the terms."
 tyr_taiping_settlement.2.f:0 "\"Two seals wait beside the text. Until both touch the paper, it remains only an argument.\""
 tyr_taiping_settlement.2.a:0 "Ratify the settlement."
 tyr_taiping_settlement.withdraw:0 "Withdraw without agreement."
 tyr_taiping_settlement.3.t:0 "Stricter Terms from Nanjing"
 tyr_taiping_settlement.3.d:0 "The Heavenly Kingdom will agree only under heavier obligations. An independence settlement now requires @money!#v £50,000#!. A subject compact will carry stronger remittance duties. Incorporation remains complete and irrevocable."
 tyr_taiping_settlement.3.f:0 "\"Recognition has its price. Authority has another.\""
 tyr_taiping_settlement.3.a:0 "Accept the revised terms."
 tyr_taiping_settlement.3.b:0 "Return a counterproposal."
 tyr_taiping_settlement.4.t:0 "The Governor's Counterproposal"
 tyr_taiping_settlement.4.d:0 "The governor refuses the stricter obligations but remains willing to conclude the original settlement. The Heavenly court must accept those terms or end the negotiation."
 tyr_taiping_settlement.4.f:0 "\"A counterproposal is a refusal written so that talks may continue.\""
 tyr_taiping_settlement.4.a:0 "Accept the original terms."
 tyr_taiping_settlement.4.b:0 "End the negotiations."
 tyr_taiping_settlement.6.t:0 "A Province at War"
 tyr_taiping_settlement.6.d_huguang:0 "Huguang controls the middle Yangtze routes on which armies, grain, and messages depend. The provincial authorities must decide how far to mobilize their transport network."
 tyr_taiping_settlement.6.d_minzhe:0 "Coastal missions, naval supply, and exposed ports have drawn Min-Zhe into the conflict. Officials demand a policy for coastal defenses and religious unrest."
 tyr_taiping_settlement.6.d_liangguang:0 "Southern revolutionary networks compete with merchant demands for secure shipping. Liangguang must decide whether its resources serve mobilization, relief, or the court."
 tyr_taiping_settlement.6.d_zhili:0 "The approaches to Beijing depend upon Zhili's roads, garrisons, and communications. Court memorials demand immediate provincial cooperation."
 tyr_taiping_settlement.6.d_north:0 "Grain transport and provincial security have become inseparable as imperial authority weakens. Officials request funds for guarded depots and mobilization."
 tyr_taiping_settlement.6.d_other:0 "War has disrupted provincial transport, security, and revenue. The administration must choose between military logistics, civilian relief, and closer cooperation with the Qing court."
 tyr_taiping_settlement.6.f:0 "\"The dispatch names the threatened road. The attached account names the price of keeping it open.\""
 tyr_taiping_settlement.6.a:0 "Organize provincial military logistics."
 tyr_taiping_settlement.6.b:0 "Prioritize grain and civilian relief."
 tyr_taiping_settlement.6.c:0 "Coordinate closely with the Qing court."

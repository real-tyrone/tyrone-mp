l_english:
 je_group_tyr_self_strengthening:0 "Self-Strengthening"
 movement_tyr_self_strengthening:0 "Self-Strengthening Movement"
 movement_tyr_self_strengthening_name:0 "Self-Strengthening Movement"
 movement_tyr_self_strengthening_desc:0 "Officials, officers and educated reformers seek the means to strengthen the state through modern schools, arsenals and industry."
 ideology_tyr_self_strengthening:0 "Self-Strengthening"
 ideology_tyr_self_strengthening_desc:0 "Our institutions must give the country the knowledge, revenue and armed strength required to withstand foreign pressure."
 je_tyr_self_strengthening:0 "The Self-Strengthening Movement"
 je_tyr_self_strengthening_reason:0 "Foreign armies and merchants have exposed the limits of the old institutions. Reformers seek stronger arsenals and modern fleets, supported by schools and workshops at home. The government has fifteen years to carry this program through before its common purpose gives way to competing provincial interests."
 je_tyr_self_strengthening_status:0 "Chinese learning for substance, Western learning for practical application."
 je_tyr_self_strengthening_goal:0 "Complete all four reforms, including all five industrial objectives, within fifteen years."
 je_tyr_ssm_literacy:0 "Increase Literacy"
 je_tyr_ssm_literacy_reason:0 "New machines and military manuals are of little use without people able to read them. Schools must carry learning beyond the examination halls and provide the educated population on which further reforms depend."
 je_tyr_ssm_literacy_status:0 ""
 je_tyr_ssm_army:0 "Westernize the Army"
 je_tyr_ssm_army_reason:0 "Provincial forces must be trained and equipped for modern warfare. A large army will require reliable supplies of arms and ammunition, while obsolete infantry formations must give way to newer methods."
 je_tyr_ssm_army_status:0 ""
 je_tyr_ssm_navy:0 "Westernize the Navy"
 je_tyr_ssm_navy_reason:0 "Coastal defenses alone cannot protect the country from a modern foreign fleet. Cruisers and capital ships must give the government the strength to defend its ports and sustain its authority at sea."
 je_tyr_ssm_navy_status:0 ""
 je_tyr_ssm_industry:0 "Local Industry Development"
 je_tyr_ssm_industry_reason:0 "Complete #v 5#! industrial objectives within #v 15 years#!. Each requires #g +20%#! light and heavy industry levels, with a minimum of #v 50#! additional levels; the target resets after each success."
 je_tyr_ssm_industry_status:0 "Industrial Objectives: #v [JournalEntry.GetTopScope.sCountry('tyr_ssm_owner').MakeScope.Var('tyr_ssm_industrial_rounds').GetValue|0]#!/5"
 je_tyr_ssm_industry_goal:0 "Complete five industrial objectives before the fifteen-year program expires. Each objective requires 20% more light and heavy industry levels, with at least 50 additional levels."
 je_tyr_ssm_literacy_goal:0 "Reach 30% literacy, establish schooling and invest in Education level 3."
 je_tyr_ssm_army_goal:0 "Field 500 regular battalions without obsolete infantry and secure abundant, affordable military goods."
 je_tyr_ssm_navy_goal:0 "Field 200 cruisers and 50 capital ships, with 25,000 naval power projection."
 je_tyr_ssm_industry_completed_desc:0 "Five successive expansions have established a stronger industrial base and spread practical knowledge of new methods."
 je_tyr_ssm_industry_timeout_desc:0 "The industrial program has ended. Its completed objectives determine the temporary benefit to technology spread."
 tyr_ssm_main_success_desc:0 "The reform program has met its educational, military, naval and industrial objectives. The Self-Strengthening Movement has secured lasting public influence."
 tyr_ssm_main_timeout_desc:0 "The fifteen-year program has ended. Its completed reforms and final industrial assessment determine the settlement. The movement and the naval reforms remain in place."
 tyr_ssm_child_closed_desc:0 "The common reform program has ended. This unfinished objective is no longer being pursued through the Journal."
 tyr_ssm_industry_success_desc:0 "All five industrial objectives have been reached. The resulting experience will assist technology spread for five years."
 tyr_ssm_industry_timeout_desc:0 "The industrial window has closed. Completed objectives still grant their proportional technology-spread reward."
 tyr_ssm_literacy_completed_tt:0 "Complete #bold Increase Literacy#!."
 tyr_ssm_army_completed_tt:0 "Complete #bold Westernize the Army#!."
 tyr_ssm_navy_completed_tt:0 "Complete #bold Westernize the Navy#!."
 tyr_ssm_industry_completed_tt:0 "Complete all #v five#! objectives of #bold Local Industry Development#!."
 tyr_ssm_industry_reward_tt:0 "Gain #g +10%#! technology spread for each completed industrial objective, up to #g +50%#!, for #v five years#!. The research and construction bonuses attached to the industrial Journal Entry end with it."
 tyr_ssm_deadline_tt:0 "At the deadline, evaluate the reforms and final industrial objective before resolving the main Journal Entry. Full success grants its normal rewards; otherwise the program closes without an additional penalty. Completed industrial objectives still grant their five-year technology-spread reward."
 tyr_ssm_naval_unlock_tt:0 "Unlock all naval laws by opening #bold Westernize the Navy#! in #bold The Self-Strengthening Movement#!. The unlock remains after the program ends."
 tyr_ssm_naval_imperial_unlock_tt:0 "Unlock this law through #bold The Navy’s Direction#! or by opening #bold Westernize the Navy#! in #bold The Self-Strengthening Movement#!."
 tyr_ssm_industry_bar:0 "Industrial Expansion"
 tyr_ssm_industry_bar_desc:0 "Levels: #v [JournalEntry.GetTopScope.sCountry('tyr_ssm_owner').MakeScope.Var('tyr_ssm_industry_levels').GetValue|0]#! / #v [JournalEntry.GetTopScope.sCountry('tyr_ssm_owner').MakeScope.Var('tyr_ssm_industry_target').GetValue|0]#!"
 tyr_ssm_industry_rounds_desc:0 "Objectives: #v [JournalEntry.GetTopScope.sCountry('tyr_ssm_owner').MakeScope.Var('tyr_ssm_industrial_rounds').GetValue|0]#!/5"
 tyr_ssm_industry_construction:0 "Industrial Expansion Program"
 tyr_ssm_industry_construction_desc:0 "The government gives priority to expanding light and heavy industry."
 tyr_ssm_industry_research:0 "Experience from Industrial Expansion"
 tyr_ssm_industry_research_desc:0 "Each completed round of expansion brings practical experience with newer production methods."
 tyr_ssm_enduring_movement:0 "The Self-Strengthening Settlement"
 tyr_ssm_enduring_movement_desc:0 "The successful reform program has secured enduring support for the Self-Strengthening Movement."
 state_pop_support_movement_tyr_self_strengthening_mult:0 "Self-Strengthening Movement Attraction"
 state_pop_support_movement_tyr_self_strengthening_mult_desc:0 "The attraction of the Self-Strengthening Movement among Pops."
 tyr_ssm_industry_spread_1:0 "Knowledge from Industrial Expansion"
 tyr_ssm_industry_spread_1_desc:0 "Industrial expansion has created the expertise and contacts needed to adopt methods developed elsewhere."
 tyr_ssm_industry_spread_2:0 "Knowledge from Industrial Expansion"

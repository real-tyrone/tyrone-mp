l_english:
 tyrone_nim.20.t:0 "The Princely Bench"
 tyrone_nim.20.d:0 "Princely delegates demand reserved seats in the assembly. #v Republican lawyers#! object that hereditary rank would survive inside the new constitution."
 tyrone_nim.20.f:0 "A velvet cushion has been placed on a bench otherwise furnished with plain wooden chairs."
 tyrone_nim.20.a:0 "Guarantee the princes their seats."
 tyrone_nim.20.b:0 "Let the provinces elect their delegates."
 tyrone_nim_event_20_a:0 "Princely Guarantees"
 tyrone_nim_event_20_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_20_b:0 "Elective Delegations"
 tyrone_nim_event_20_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.21.t:0 "Who Appoints the Governor?"
 tyrone_nim.21.d:0 "The #v provincial delegations#! demand elected governors. Senior officials insist that appointments must remain answerable to the central executive."
 tyrone_nim.21.f:0 "A governor’s commission waits for a signature while two delegations dispute whose seal it should bear."
 tyrone_nim.21.a:0 "Reserve appointments to the crown."
 tyrone_nim.21.b:0 "Entrust appointments to provincial assemblies."
 tyrone_nim_event_21_a:0 "Appointed Governors"
 tyrone_nim_event_21_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_21_b:0 "Provincial Appointments"
 tyrone_nim_event_21_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.22.t:0 "An Oath of Service"
 tyrone_nim.22.d:0 "The #v officer corps#! proposes an oath to the sovereign. Federal delegates want soldiers to swear obedience to the constitution and its elected authorities."
 tyrone_nim.22.f:0 "The recruits have learned the words. Their instructors have received orders to withhold the ceremony."
 tyrone_nim.22.a:0 "Keep the sovereign in the oath."
 tyrone_nim.22.b:0 "Bind the army to the federal charter."
 tyrone_nim_event_22_a:0 "Royal Military Oath"
 tyrone_nim_event_22_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_22_b:0 "Constitutional Military Oath"
 tyrone_nim_event_22_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.23.t:0 "The Provincial Purse"
 tyrone_nim.23.d:0 "#v Provincial representatives#! demand discretion over revenue. Landed patrons offer support for a central treasury if their customary influence is preserved."
 tyrone_nim.23.f:0 "The finance committee has agreed on the total. Every delegation contests its share."
 tyrone_nim.23.a:0 "Secure the treasury through the landed estates."
 tyrone_nim.23.b:0 "Give the provinces a share of revenue."
 tyrone_nim_event_23_a:0 "Treasury Compact"
 tyrone_nim_event_23_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_23_b:0 "Provincial Revenue Shares"
 tyrone_nim_event_23_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.24.t:0 "Petitions from the Pulpit"
 tyrone_nim.24.d:0 "#v Religious dignitaries#! seek a privileged voice in the constitutional settlement. Federal advocates argue that local assemblies should decide how to receive their petitions."
 tyrone_nim.24.f:0 "Outside the hall, rival deputations wait beneath the same awning."
 tyrone_nim.24.a:0 "Receive the dignitaries as advisers to the crown."
 tyrone_nim.24.b:0 "Refer their petitions to the provinces."
 tyrone_nim_event_24_a:0 "Recognized Religious Advisers"
 tyrone_nim_event_24_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_24_b:0 "Provincial Petition Hearings"
 tyrone_nim_event_24_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.25.t:0 "The Right to Address the Assembly"
 tyrone_nim.25.d:0 "#v Town associations#! demand public hearings before the constitution is settled. Palace supporters propose receiving selected deputations under royal patronage."
 tyrone_nim.25.f:0 "The galleries fill before the doors open; those without invitations gather on the steps."
 tyrone_nim.25.a:0 "Let the crown choose its deputations."
 tyrone_nim.25.b:0 "Open hearings to provincial associations."
 tyrone_nim_event_25_a:0 "Royal Deputations"
 tyrone_nim_event_25_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_25_b:0 "Public Constitutional Hearings"
 tyrone_nim_event_25_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.30.t:0 "Delegates from the Mills"
 tyrone_nim.30.d:0 "#v Mill workers#! have sent elected delegates to demand a place in the constitutional negotiations. Factory owners threaten to withdraw their cooperation if the delegates are admitted."
 tyrone_nim.30.f:0 "The delegates have brought a wage book and a list of injured workers. Neither appears on the committee’s agenda."
 tyrone_nim.30.a:0 "Seat the workers’ delegates."
 tyrone_nim.30.b:0 "Keep the negotiations with recognized associations."
 tyrone_nim_event_30_a:0 "Workers at the Assembly"
 tyrone_nim_event_30_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_30_b:0 "Recognized Negotiating Partners"
 tyrone_nim_event_30_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.31.t:0 "The Estate Question"
 tyrone_nim.31.d:0 "#v Tenant farmers#! demand that the assembly reopen the settlement of landed property. Estate holders warn that constitutional guarantees will mean little if titles can be overturned."
 tyrone_nim.31.f:0 "A tenant reads the boundary aloud. His family has cultivated both sides of it for longer than he can remember."
 tyrone_nim.31.a:0 "Let the tenants challenge the estates."
 tyrone_nim.31.b:0 "Uphold existing property titles."
 tyrone_nim_event_31_a:0 "Tenant Committees"
 tyrone_nim_event_31_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_31_b:0 "Guaranteed Estate Titles"
 tyrone_nim_event_31_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.32.t:0 "A Newspaper for the Councils"
 tyrone_nim.32.d:0 "#v Radical printers#! are circulating a draft constitution founded on workers’ councils. Merchants demand protection against calls to seize their premises."
 tyrone_nim.32.f:0 "A fresh sheet passes from hand to hand before the ink has dried."
 tyrone_nim.32.a:0 "Protect the council newspapers."
 tyrone_nim.32.b:0 "Back the merchants against confiscation."
 tyrone_nim_event_32_a:0 "Council Presses"
 tyrone_nim_event_32_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_32_b:0 "Commercial Guarantees"
 tyrone_nim_event_32_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.33.t:0 "The Garrison Meeting"
 tyrone_nim.33.d:0 "#v Soldiers’ delegates#! ask permission to form committees in the barracks. Their officers regard the demand as a challenge to the chain of command."
 tyrone_nim.33.f:0 "At evening roll call, a corporal unfolds a resolution signed by half his company."
 tyrone_nim.33.a:0 "Recognize the soldiers’ committees."
 tyrone_nim.33.b:0 "Support the officers’ authority."
 tyrone_nim_event_33_a:0 "Barracks Committees"
 tyrone_nim_event_33_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_33_b:0 "Unbroken Chain of Command"
 tyrone_nim_event_33_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.34.t:0 "Bread before Debate"
 tyrone_nim.34.d:0 "#v Urban laborers#! demand relief while the assembly deliberates. Employers offer private aid if the government keeps the relief committees out of politics."
 tyrone_nim.34.f:0 "The queue outside the bakery has become a meeting before the first loaves reach the counter."
 tyrone_nim.34.a:0 "Fund relief through workers’ committees."
 tyrone_nim.34.b:0 "Accept relief administered by employers."
 tyrone_nim_event_34_a:0 "Workers’ Relief Funds"
 tyrone_nim_event_34_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_34_b:0 "Employers’ Relief Boards"
 tyrone_nim_event_34_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.35.t:0 "A Republic of Councils"
 tyrone_nim.35.d:0 "#v Socialist delegates#! have submitted a charter based on [GetLawType('law_council_republic').GetName]. Constitutional moderates demand that the assembly reject its claim to speak for the whole country."
 tyrone_nim.35.f:0 "The rival drafts lie side by side. One begins with the councils, the other with the offices they would replace."
 tyrone_nim.35.a:0 "Allow the councils to organize."
 tyrone_nim.35.b:0 "Defend the constitutional negotiations."
 tyrone_nim_event_35_a:0 "Organized Councils"
 tyrone_nim_event_35_a_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim_event_35_b:0 "Constitutional Moderates"
 tyrone_nim_event_35_b_desc:0 "The assembly’s settlement strengthens its supporters while alienating the interests excluded from the bargain."
 tyrone_nim.50.t:0 "#yellow Pakistan: Revenue from the Indus#!"
 tyrone_nim.50.d:0 "Delegates from the #v Indus provinces#! demand that more revenue remain under local control. Central officials warn that the concession will weaken tax collection."
 tyrone_nim.50.f:0 "The delegation refuses to discuss a new assessment until the old remittances are accounted for."
 tyrone_nim.50.a:0 "Leave part of the revenue with the provinces."
 tyrone_nim.50.b:0 "Require the full remittance."
 tyrone_nim_event_50_concession:0 "Indus Revenue Retention"
 tyrone_nim_event_50_concession_desc:0 "Local revenue boards retain funds previously collected by the central treasury."
 tyrone_nim.51.t:0 "#yellow Pakistan: The Canal Boards#!"
 tyrone_nim.51.d:0 "#v Irrigation representatives#! demand a moratorium on new works until provincial boards can review the allocation of water and compulsory labor."
 tyrone_nim.51.f:0 "Survey stakes have been pulled from the bank and stacked outside the engineer’s quarters."
 tyrone_nim.51.a:0 "Suspend works for the provincial inquiry."
 tyrone_nim.51.b:0 "Keep the construction schedule."
 tyrone_nim_event_51_concession:0 "Provincial Canal Inquiry"
 tyrone_nim_event_51_concession_desc:0 "A provincial inquiry holds up new works while water rights are examined."
 tyrone_nim.52.t:0 "#yellow Pakistan: Appointments in the Northwest#!"
 tyrone_nim.52.d:0 "#v Northwestern delegates#! demand locally nominated officials and salaries sufficient to recruit them. The ministry objects to the cost of maintaining parallel administrative arrangements."
 tyrone_nim.52.f:0 "Candidates arrive with endorsements from their districts and no recommendation from the capital."
 tyrone_nim.52.a:0 "Finance the provincial appointments."
 tyrone_nim.52.b:0 "Retain the central appointment lists."
 tyrone_nim_event_52_concession:0 "Northwestern Appointment Settlement"
 tyrone_nim_event_52_concession_desc:0 "Expanded provincial recruitment requires additional salaries throughout the civil service."
 tyrone_nim.53.t:0 "#yellow Pakistan: Guarantees for the Provincial Councils#!"
 tyrone_nim.53.d:0 "#v Provincial councillors#! demand a binding right to withhold cooperation from central directives. The cabinet fears that accepting the demand will leave its orders unenforceable."
 tyrone_nim.53.f:0 "An unsigned directive returns to the ministry with the council’s objections attached."
 tyrone_nim.53.a:0 "Recognize the councils’ right of objection."
 tyrone_nim.53.b:0 "Insist that central directives take precedence."
 tyrone_nim_event_53_concession:0 "Provincial Right of Objection"
 tyrone_nim_event_53_concession_desc:0 "Provincial councils can delay central directives while their objections are heard."
 tyrone_nim.60.t:0 "#yellow Bangladesh: The Language of Office#!"
 tyrone_nim.60.d:0 "#v Bengali representatives#! demand public business in their own language and a separate body of translators. The ministry submits a costly recruitment estimate."
 tyrone_nim.60.f:0 "A witness has signed a deposition that had to be read back through an interpreter."
 tyrone_nim.60.a:0 "Fund Bengali administrative services."
 tyrone_nim.60.b:0 "Keep the existing administrative arrangements."
 tyrone_nim_event_60_concession:0 "Bengali Administrative Services"
 tyrone_nim_event_60_concession_desc:0 "Additional staff and translation offices support public business in Bengali."
 tyrone_nim.61.t:0 "#yellow Bangladesh: The Delta Assessment#!"
 tyrone_nim.61.d:0 "#v Delta cultivators#! contest the revenue assessment and demand a prolonged remission. Treasury officials warn that the missing revenue must be found elsewhere."
 tyrone_nim.61.f:0 "A delegation lays watermarked title papers before the assessment board."
 tyrone_nim.61.a:0 "Grant the requested remission."
 tyrone_nim.61.b:0 "Collect the assessed revenue."
 tyrone_nim_event_61_concession:0 "Delta Revenue Remission"
 tyrone_nim_event_61_concession_desc:0 "A negotiated remission reduces revenue collected in the delta."
 tyrone_nim.62.t:0 "#yellow Bangladesh: Who Directs the River Works?#!"
 tyrone_nim.62.d:0 "#v Bengali district boards#! demand authority over river works before further construction proceeds. Central engineers protest that the review will delay projects across the province."
 tyrone_nim.62.f:0 "The new embankment ends where the district board ordered the workmen to stop."
 tyrone_nim.62.a:0 "Submit the works to district review."
 tyrone_nim.62.b:0 "Proceed under the central engineers."
 tyrone_nim_event_62_concession:0 "Delta Works Review"
 tyrone_nim_event_62_concession_desc:0 "District boards review river works and postpone construction pending agreement."
 tyrone_nim.63.t:0 "#yellow Bangladesh: The Provincial Education Board#!"
 tyrone_nim.63.d:0 "#v Bengali educational associations#! demand an autonomous board with control over appointments and instruction. The ministry warns that a separate administration will absorb staff needed elsewhere."
 tyrone_nim.63.f:0 "The teachers’ deputation brings its own syllabus, complete with a list of appointments the ministry has refused."
 tyrone_nim.63.a:0 "Establish the autonomous board."
 tyrone_nim.63.b:0 "Retain ministerial supervision."
 tyrone_nim_event_63_concession:0 "Autonomous Bengali Education Board"
 tyrone_nim_event_63_concession_desc:0 "A separate provincial board draws administrative personnel away from central offices."
 tyrone_nim_const_monarch_ten_tt:0 "The constitutional balance will move #v 10#! points towards monarchy."
 tyrone_nim_const_federal_ten_tt:0 "The constitutional balance will move #v 10#! points towards the federal republic."
 tyrone_nim_social_twentyfive_tt:0 "Socialist tension will increase by #v 25#! points."
 tyrone_nim_order_ten_tt:0 "Socialist tension will decrease by #v 10#! points."
 tyrone_nim_concession_five_tt:0 "Pressure in the affected region will decrease by #v 5#! points."
 tyrone_nim_refusal_ten_tt:0 "Pressure in the affected region will increase by #v 10#! points."

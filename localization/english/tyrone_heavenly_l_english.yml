 tyr_heavenly_unconverted_lower_desc:0 "Populations outside the Catholic and Protestant faiths retain their economic position, with rights determined by the Heavenly religious order."
 law_tyr_heavenly_covenant:0 "Covenant of the Heavenly People"
 law_tyr_heavenly_covenant_desc:0 "Citizenship is defined by the exclusive national covenant of the Heavenly Kingdom. Fully accepted households are encouraged to grow, while those held outside the covenant face restrictions."
 law_tyr_heavenly_religion:0 "The Heavenly Religious Order"
 law_tyr_heavenly_religion_desc:0 "Catholics and Protestants enjoy the privileges of the faithful. Other believers retain their economic position, but the lower strata are confined to acceptance tier 2 and the middle strata to tier 3. The upper strata have no fixed acceptance tier."
 law_tyr_heavenly_censorship:0 "Guardianship of the Sacred Word"
 law_tyr_heavenly_censorship_desc:0 "The authorities control the circulation of knowledge and restrict peasant education, while reducing the administrative cost of public institutions."
 tyr_heavenly_hierarchy:0 "Heavenly Religious Order"
 tyr_heavenly_path_tt:0 "Established as part of the Heavenly Kingdom."
 ideology_tyr_heavenly_brotherhood:0 "Heavenly Brotherhood"
 ideology_tyr_heavenly_brotherhood_desc:0 "The faithful demand provision for the old and poor, protection for workers, and an end to unrestricted child labour."
 ideology_tyr_heavenly_authority:0 "Authority of the Heavenly King"
 ideology_tyr_heavenly_authority_desc:0 "Religious government, undivided authority and the Heavenly covenant form the foundations of legitimate rule."
 ideology_tyr_heavenly_commonwealth:0 "The Common Treasury"
 ideology_tyr_heavenly_commonwealth_desc:0 "Land should sustain its cultivators, people should be free to move, and production should serve the commonwealth rather than private fortunes."
 tyr_heavenly_player_resolve:0 "Resolve in the Civil War"
 tyr_heavenly_eight_tt:0 "At least #v eight#! directly owned States have the #bold $god_worshippers$#! modifier."
 tyr_heavenly_spread.t:0 "The Congregations Spread"
 tyr_heavenly_spread.d:0 "The God Worshippers have gained a foothold in [SCOPE.sState('cult_growth_state').GetName]. Local unrest has helped their preachers carry the movement across the provincial border."
 tyr_heavenly_spread.f:0 "The first converts arrive from the neighbouring province. The next congregation is drawn from the village itself."
 tyr_heavenly_spread_tt:0 "The new State receives #bold $god_worshippers$#! for #v five years#! and counts towards the eight States required for the rebellion."
 tyr_heavenly_choice.t:0 "Two Governments, One China"
 tyr_heavenly_choice.d:0 "The Heavenly Kingdom has risen in the provinces won over by the God Worshippers. The capital remains in imperial hands, but neither government will accept the division of China. Choose which side to lead in the coming civil war."
 tyr_heavenly_choice.f:0 "Both courts issue commands in the name of all China. Only one can expect them to be obeyed."
 dp_tyr_heavenly_civil_war:0 "Heavenly Civil War"

 je_tyr_heavenly_conversion:0 "A Kingdom of Believers"
 je_tyr_heavenly_conversion_reason:0 "The Heavenly armies have prevailed, but the villages and towns still keep the rites of their ancestors. The court now seeks a Christian kingdom through parish schools, relief for the poor and the enforcement of its religious decrees. Until the new faith takes root, resistance will burden the government."
 je_tyr_heavenly_conversion_goal:0 "Bring the combined Catholic and Protestant share of the national population to #v 70%#!."
 je_tyr_heavenly_conversion_status:0 "Extend the Christian faith through relief, schooling and religious policy."
 tyr_heavenly_christian_goal_tt:0 "At least #v 70%#! of Pops in directly owned territory are Catholic or Protestant, counted together. This share is updated monthly."
 tyr_heavenly_faith_reward_header:0 "A Crown Strengthened by Faith"
 tyr_heavenly_unsettled_faith:0 "The Unsettled Faith"
 tyr_heavenly_unsettled_faith_desc:0 "The victorious court struggles to establish its religion across a country still attached to older rites."
 tyr_heavenly_christian_relief:0 "Fund Christian Relief"
 tyr_heavenly_christian_relief_desc:0 "Open the congregational granaries to the hungry and place the care of the destitute in Christian hands. Those fed under the Heavenly banner will have reason to defend the throne."
 tyr_heavenly_parish_schools:0 "Entrust Schools to the Church"
 tyr_heavenly_parish_schools_desc:0 "Let the Scriptures guide the schoolmaster. The court will give parish teachers precedence over secular studies, bringing more pupils into the faith at the expense of a broader education."
 tyr_heavenly_enforce_conformity:0 "Enforce Religious Conformity"
 tyr_heavenly_enforce_conformity_desc:0 "Order the magistrates to suppress the old rites and demand public professions of faith. Resistance will be met with force, and the registers of converts will grow alongside the rolls of the dead."
 tyr_heavenly_teach_young:0 "Teach the Young"
 tyr_heavenly_teach_young_desc:0 "Keep children in the classroom long enough to learn the teachings of the Church. Raised among Christian congregations, the next generation may carry the faith into households still devoted to older rites."
 tyr_heavenly_parish_instruction:0 "Parish Instruction"
 tyr_heavenly_parish_instruction_desc:0 "The schools devote more time to religious instruction, leaving less access to a general education."
 tyr_heavenly_enforced_conversion:0 "Enforced Conversion"
 tyr_heavenly_enforced_conversion_desc:0 "Religious decrees are enforced through coercion, with a heavy cost in lives."
 tyr_heavenly_childhood_instruction:0 "Lessons in the Faith"
 tyr_heavenly_childhood_instruction_desc:0 "Restrictions on child labor give congregations more opportunity to instruct the young."

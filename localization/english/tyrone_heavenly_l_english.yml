 tyr_heavenly_faithful_lower:0 "Faithful"
 tyr_heavenly_faithful_lower_desc:0 "Catholic and Protestant populations retain their economic position and receive the privileges of the Heavenly covenant."
 country_tyr_heavenly_unconverted_upper_cultural_acceptance_add:0 "Acceptance of Non-Christian Upper Strata"
 tyr_heavenly_unconverted_upper:0 "Unconverted"
 tyr_heavenly_unconverted_upper_desc:0 "Populations outside the Catholic and Protestant faiths retain their economic position, with rights determined by the Heavenly religious order."
 country_tyr_heavenly_unconverted_middle_cultural_acceptance_add:0 "Acceptance of Non-Christian Middle Strata"
 country_tyr_heavenly_unconverted_middle_acceptance_min_add:0 "Minimum Acceptance of Non-Christian Middle Strata"
 country_tyr_heavenly_unconverted_middle_acceptance_max_add:0 "Maximum Acceptance of Non-Christian Middle Strata"
 tyr_heavenly_unconverted_middle:0 "Unconverted"
 tyr_heavenly_unconverted_middle_desc:0 "Populations outside the Catholic and Protestant faiths retain their economic position, with rights determined by the Heavenly religious order."
 country_tyr_heavenly_unconverted_lower_cultural_acceptance_add:0 "Acceptance of Non-Christian Lower Strata"
 country_tyr_heavenly_unconverted_lower_acceptance_min_add:0 "Minimum Acceptance of Non-Christian Lower Strata"
 country_tyr_heavenly_unconverted_lower_acceptance_max_add:0 "Maximum Acceptance of Non-Christian Lower Strata"
 tyr_heavenly_unconverted_lower:0 "Unconverted"
 tyr_heavenly_unconverted_lower_desc:0 "Populations outside the Catholic and Protestant faiths retain their economic position, with rights determined by the Heavenly religious order."
 law_tyr_heavenly_covenant:0 "Covenant of the Heavenly People"
 law_tyr_heavenly_covenant_desc:0 "The Heavenly Court declares its subjects members of one family beneath the Heavenly Father. Those acknowledged within the sacred covenant are favored in household and public affairs; those who refuse it must live under the restrictions of a kingdom founded upon revealed truth."
 law_tyr_heavenly_religion:0 "The Heavenly Religious Order"
 law_tyr_heavenly_religion_desc:0 "Catholics and Protestants enjoy the privileges of the faithful. Other believers retain their economic position, but the lower strata are confined to acceptance tier 2 and the middle strata to tier 3. The upper strata have no fixed acceptance tier."
 law_tyr_heavenly_censorship:0 "Guardianship of the Sacred Word"
 law_tyr_heavenly_censorship_desc:0 "Edicts and approved scriptures are to carry the teachings of the Heavenly King into every district. Unauthorized writings and rival doctrines face scrutiny, while instruction among the common people is directed toward religious obedience rather than unrestricted learning. The simpler system of supervision eases the burden upon the state offices."
 tyr_heavenly_hierarchy:0 "Heavenly Religious Order"
 tyr_heavenly_path_tt:0 "Established as part of the Heavenly Kingdom."
 ideology_tyr_heavenly_brotherhood:0 "Heavenly Brotherhood"
 ideology_tyr_heavenly_brotherhood_desc:0 "The Heavenly Father is said to regard His people as one family. The faithful call for provision from public granaries for the aged and destitute, protection of those who labor, and an end to the unrestrained exploitation of children."
 ideology_tyr_heavenly_authority:0 "Authority of the Heavenly King"
 ideology_tyr_heavenly_authority_desc:0 "The Heavenly King claims his charge from the Heavenly Father rather than the Mandate of the Qing emperor. His proclamations bind government and worship together, leaving no rightful authority outside the sacred order of the Heavenly Court."
 ideology_tyr_heavenly_commonwealth:0 "The Common Treasury"
 ideology_tyr_heavenly_commonwealth_desc:0 "The fields are to feed the families who till them, and the surplus of each district is to sustain those in want. In the Heavenly Court's vision, common granaries and regulated distribution should bind the people into one household; the demands of war make such promises difficult to fulfill."
 tyr_heavenly_player_resolve:0 "Resolve in the Civil War"
 tyr_heavenly_eight_tt:0 "At least #v four#! eligible states in Qing or its administrations have the #bold $god_worshippers$#! modifier."
 tyr_heavenly_spread.t:0 "The Congregations Spread"
 tyr_heavenly_spread.d:0 "Reports from [SCOPE.sState('cult_growth_state').GetName] describe new gatherings of the God Worshippers. Their hymns and proclamations have followed traders, refugees and wandering preachers across provincial boundaries, finding an audience among villages embittered by disorder and official neglect. Local magistrates now disagree over whether these congregations are merely heterodox believers or the beginnings of a more dangerous league."
 tyr_heavenly_spread.f:0 "A few households first repeat the words of the visiting preacher; before long, the congregation has its own readers, its own meetings and its own secrets."
 tyr_heavenly_spread_tt:0 "The state receives #bold $god_worshippers$#! for #v five years#!. The uprising begins once the Society holds four states eligible to join it."
 tyr_heavenly_choice.t:0 "The Heavenly Kingdom Rises"
 tyr_heavenly_choice.d:0 "The God Worshippers have cast aside concealment and proclaimed a Heavenly Kingdom in the territories now under their banners. The Dragon Throne still commands the imperial capital, yet a rival court claims the right to govern all under Heaven. Imperial proclamations condemn the rebels as destroyers of the established order; the Heavenly armies answer that the old dynasty has forfeited its authority. The struggle can no longer be settled by provincial magistrates. Choose which cause to lead in the coming civil war."
 tyr_heavenly_choice.f:0 "Two courts issue their decrees to the same land. The villages must decide whose seal to recognize, and the soldiers whose banners to follow."
 dp_tyr_heavenly_civil_war:0 "Heavenly Civil War"

 je_tyr_heavenly_conversion:0 "A Kingdom of Believers"
 je_tyr_heavenly_conversion_reason:0 "The Heavenly armies have prevailed, but military conquest has not made the realm a kingdom of believers. Across the prefectures, ancestral halls remain crowded, Buddhist and Daoist rites endure, and many households know the Heavenly Father only through the proclamations of soldiers. The court must decide whether teaching, relief and persuasion can secure the new order—or whether compulsory observance will deepen the wounds left by civil war."
 je_tyr_heavenly_conversion_goal:0 "Bring the combined Catholic and Protestant share of the national population to #v 70%#!."
 je_tyr_heavenly_conversion_status:0 "Spread the Heavenly teaching through congregations, relief, schooling and religious decrees."
 tyr_heavenly_christian_goal_tt:0 "At least #v 70%#! of Pops in directly owned territory are Catholic or Protestant, counted together. This share is updated monthly."
 tyr_heavenly_faith_reward_header:0 "The Heavenly Covenant Fulfilled"
 tyr_heavenly_unsettled_faith:0 "The Unsettled Faith"
 tyr_heavenly_unsettled_faith_desc:0 "The Heavenly King claims a sacred charge over the realm, yet much of the population still follows ancestral and local rites. Provincial officials struggle to enforce the court's religious decrees without provoking further resistance."
 tyr_heavenly_christian_relief:0 "Fund Christian Relief"
 tyr_heavenly_christian_relief_desc:0 "Open the public granaries to the hungry, and charge the congregations with tending widows, orphans and the infirm. Relief offered in the name of the Heavenly Father may earn allegiance where proclamations alone have failed, though the treasury must bear the expense."
 tyr_heavenly_parish_schools:0 "Entrust Schools to the Congregations"
 tyr_heavenly_parish_schools_desc:0 "Appoint congregational teachers to instruct the young in the approved scriptures and the precepts of the Heavenly Father. The new lessons promise a generation loyal to the sacred order, but time and funds devoted to doctrine leave less room for broader studies."
 tyr_heavenly_enforce_conformity:0 "Enforce Religious Conformity"
 tyr_heavenly_enforce_conformity_desc:0 "Order local magistrates to dismantle forbidden shrines and require public adherence to the Heavenly teaching. The registers may record more converts, but coerced obedience will bring resistance, flight and bloodshed wherever the old rites retain their hold."
 tyr_heavenly_teach_young:0 "Teach the Young"
 tyr_heavenly_teach_young_desc:0 "Keep children from exhausting labor long enough for instruction in the congregational schools. As they learn the approved scriptures and songs of the Heavenly Kingdom, the court hopes to raise a generation whose loyalty rests upon the new faith rather than the rites of its forebears."
 tyr_heavenly_parish_instruction:0 "Congregational Scripture Instruction"
 tyr_heavenly_parish_instruction_desc:0 "Teachers appointed by the congregations devote their lessons to approved scriptures and moral injunctions. Religious instruction expands at the expense of broader schooling."
 tyr_heavenly_enforced_conversion:0 "Enforced Conversion"
 tyr_heavenly_enforced_conversion_desc:0 "The court sends magistrates and soldiers to enforce its religious decrees. Shrines are closed and professions of faith demanded, but coercion exacts a heavy toll in human lives."
 tyr_heavenly_childhood_instruction:0 "Lessons in the Faith"
 tyr_heavenly_childhood_instruction_desc:0 "Children spend more time learning the Heavenly scriptures under congregational teachers, with restrictions on child labor making attendance possible for more households."


 je_tyr_heavenly_court:0 "The Heavenly Court"
 tyr_heavenly_court_move_capital:0 "Move the Capital to Nanjing"
 tyr_heavenly_court_move_capital_desc:0 "Make Nanjing the seat of the Heavenly Court."
 je_tyr_heavenly_court_reason:0 "The Heavenly King has proclaimed a new order, but conquest has brought together armies, congregations and districts with very different needs. The regional kings command soldiers, religious ministers claim authority to interpret sacred teaching, and local magistrates must still collect grain and settle disputes. How these powers are reconciled will determine whether the Heavenly Kingdom becomes a lasting state or remains an army with a throne."
 je_tyr_heavenly_court_status:0 "Keep this Journal Entry active. Eligible petitions can appear during monthly reviews, and any response counts. Complete the wartime petitions before making peace, or hear them during a later war."
 tyr_heavenly_court_requirement_30_tt:0 "Hear $tyr_heavenly_court_30_t$. It can appear once you have a ruler."
 tyr_heavenly_court_requirement_31_tt:0 "Hear $tyr_heavenly_court_31_t$ while at war, after hearing the petition about the Heavenly Seal."
 tyr_heavenly_court_requirement_32_tt:0 "Hear $tyr_heavenly_court_32_t$. At least one owned state must have Peasants."
 tyr_heavenly_court_requirement_33_tt:0 "Make Nanjing your capital or hear $tyr_heavenly_court_33_t$ after acquiring territory in Nanjing."
 tyr_heavenly_court_requirement_34_tt:0 "Hear $tyr_heavenly_court_34_t$ while at war and owning territory in Nanjing."
 tyr_heavenly_court_requirement_35_tt:0 "Hear $tyr_heavenly_court_35_t$ after hearing the petition about the Heavenly Seal."
 tyr_heavenly_court_requirement_36_tt:0 "Hear $tyr_heavenly_court_36_t$. A Christian Great Power must exist."
 tyr_heavenly_court_requirement_37_tt:0 "Complete $je_taiping_revolution$, then hear $tyr_heavenly_court_37_t$ at peace."
 tyr_heavenly_court_requirement_38_tt:0 "Have no rival commands, or hear $tyr_heavenly_court_38_t$ once an owned state in Nanjing reaches 15% Turmoil."
 tyr_heavenly_court_requirement_39_tt:0 "Keep every owned state below 20% Turmoil, or hear $tyr_heavenly_court_39_t$ at peace after the former dynasty petition."
 tyr_heavenly_court_30_t:0 "Whose Word Bears the Heavenly Seal?"
 tyr_heavenly_court_30_d:0 "In the Heavenly King's name, commanders and religious ministers have issued proclamations that do not always agree. The generals demand orders clear enough to be obeyed on campaign; the ministers insist that no decree should contradict the teachings of the Heavenly Father. As the sacred seal passes from desk to desk, rival instructions threaten to turn a question of doctrine into a contest for power."
 tyr_heavenly_court_30_a:0 "Let every proclamation bear the Heavenly King's seal."
 tyr_heavenly_court_30_b:0 "Establish a standing council of ministers."
 tyr_heavenly_court_31_t:0 "The Kings and Their Armies"
 tyr_heavenly_court_31_d:0 "The regional kings have raised armies whose loyalty rests as much upon their commanders as upon the Heavenly Court. A common staff might coordinate supply and marching orders, yet each king fears that surrendering authority will leave his troops dependent on a rival's favor. The needs of a united campaign compete with the ambitions of those who won the kingdom its first victories."
 tyr_heavenly_court_31_a:0 "Fund a common staff for the Heavenly armies."
 tyr_heavenly_court_31_b:0 "Leave each king in command of his own troops."
 tyr_heavenly_court_32_t:0 "The Land System of the Heavenly Dynasty"
 tyr_heavenly_court_32_d:0 "The Land System of the Heavenly Dynasty promises that fields should be apportioned according to households and the quality of the soil, while surplus harvests sustain common granaries. Its advocates speak of one family beneath the Heavenly Father; provincial officials speak instead of missing registers, disputed tenures and armies already consuming the grain. Before such a decree can govern the countryside, someone must survey the land and pay the men who administer it."
 tyr_heavenly_court_32_a:0 "Survey the fields and establish public granaries first."
 tyr_heavenly_court_32_b:0 "Respect existing tenures and negotiate grain deliveries."
 tyr_heavenly_court_33_t:0 "The Heavenly Capital"
 tyr_heavenly_court_33_d:0 "Nanjing, the old southern seat of emperors, is now held by the Heavenly armies. Courtiers propose that it be proclaimed Tianjing—the Heavenly Capital—and made the residence of the new government. Its walls and position on the Yangtze promise strength, but rebuilding offices, provisioning soldiers and defending the city will require vast sums from a treasury already strained by war."
 tyr_heavenly_court_33_a:0 "Proclaim Tianjing the seat of the Heavenly Court."
 tyr_heavenly_court_33_b:0 "Retain the present court and fortify Nanjing as a stronghold."
 tyr_heavenly_court_34_t:0 "Supply for the Northern Expedition"
 tyr_heavenly_court_34_d:0 "The generals argue that a thrust toward the northern capital could shake the Qing court and draw fresh adherents to the Heavenly banner. Quartermasters warn that men marching far from the Yangtze will require grain, pack animals and replacements which the river garrisons can scarcely spare. A bold expedition promises glory; an ill-supplied one could squander the kingdom's best troops."
 tyr_heavenly_court_34_a:0 "Provision the northern column and send it forward."
 tyr_heavenly_court_34_b:0 "Hold the Yangtze and supply the garrisons already in the field."
 tyr_heavenly_court_35_t:0 "The Rules of the Congregations"
 tyr_heavenly_court_35_d:0 "The congregations submit petitions concerning scripture schools, the organization of women's households and the suppression of ancestral shrines. Some ministers demand a single sacred discipline in every district; others warn that laws proclaimed in the capital cannot easily settle the customs of a thousand villages. Even among believers, the promise of a new society meets the practical burdens of governing it."
 tyr_heavenly_court_35_a:0 "Support local congregational schools and household arrangements."
 tyr_heavenly_court_35_b:0 "Impose common rules upon public worship and local rites."
 tyr_heavenly_court_36_t:0 "An Audience for the Foreign Envoys"
 tyr_heavenly_court_36_d:0 "Foreign envoys have come seeking guarantees for trade, safety and the preaching of Christianity. They recognize familiar scriptural language in the Heavenly Court's proclamations, but question its claims of new revelation and the authority of the Heavenly King. The ministers must decide whether to pursue commercial understanding or receive the visitors without surrendering the court's freedom of action."
 tyr_heavenly_court_36_a:0 "Dispatch a mission to negotiate commercial relations."
 tyr_heavenly_court_36_b:0 "Receive the envoys, but promise no concessions."
 tyr_heavenly_court_37_t:0 "The Offices of the Former Dynasty"
 tyr_heavenly_court_37_d:0 "The Qing seals have been removed from the prefectural offices, yet the men who kept their tax registers and granary accounts still know the districts better than the victorious soldiers. Retaining them could restore revenue quickly, though the congregations distrust servants of the fallen dynasty. Replacing them would proclaim a cleaner break with the past, at the cost of administrative confusion."
 tyr_heavenly_court_37_a:0 "Retain officials willing to swear obedience to the new court."
 tyr_heavenly_court_37_b:0 "Appoint new officials from the congregations."

 tyr_heavenly_truce_concluded:0 "The Dragon Throne and the Heavenly Court have laid down their arms without the destruction of either government. The settlement, not a proclamation of victory, determines which lands each side retains."

 tyr_heavenly_court_38_t:0 "The Commands Dispute the Seal"
 tyr_heavenly_court_38_d:0 "In Tianjing, rival commanders claim the right to issue orders beneath the Heavenly King's seal. Their competing officers have divided the garrisons and confused the city's administration, while rumors spread that soldiers may soon settle by force what ministers have failed to settle by counsel. The court must act before a dispute of precedence becomes an open struggle."
 tyr_heavenly_court_38_a:0 "Place the capital's forces under one command by royal decree."
 tyr_heavenly_court_38_b:0 "Settle the arrears and negotiate a common command."
 tyr_heavenly_court_39_t:0 "Repairing the Civil Offices"
 tyr_heavenly_court_39_d:0 "War has left granaries empty, roads broken and petitions unanswered. Local magistrates plead for clerks and relief grain, warning that victory will mean little if the countryside cannot be taxed, fed or governed. The Heavenly Court must choose between spending scarce funds upon reconstruction and leaving exhausted prefectures to provide for themselves."
 tyr_heavenly_court_39_a:0 "Fund relief and reopen the offices in a troubled province."
 tyr_heavenly_court_39_b:0 "Leave the provincial authorities to bear the cost."

 tyr_heavenly_capital_works:0 "Works at the Heavenly Capital"
 tyr_heavenly_capital_works_desc:0 "Carpenters, clerks and soldiers labor to restore government halls and defenses at Tianjing, turning the captured city into a functioning seat of the Heavenly Court."
 tyr_heavenly_expedition_supply:0 "Expedition Supply Commission"
 tyr_heavenly_expedition_supply_desc:0 "Quartermasters assemble grain, transport and new recruits for the field armies. Every cart sent toward the front is one less available to the river garrisons and provincial markets."
 tyr_heavenly_congregational_schooling:0 "Congregational Schooling"
 tyr_heavenly_congregational_schooling_desc:0 "Congregational teachers receive funding to establish scripture classes and supervise the instruction of children under the new religious order."

 tyr_heavenly_restore_prefectures:0 "Reopen the Prefectural Offices"
 tyr_heavenly_restore_prefectures_desc:0 "Pay clerks, restore registers and reopen public offices in a troubled incorporated province. The work requires spare Bureaucracy and 20,000 from the treasury."

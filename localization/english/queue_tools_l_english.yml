l_english:
 V3QT_QUEUE_HELP_LABEL: "Multi-Select & Drag"
 V3QT_QUEUE_HELP: "#header Multi-Select & Drag#!\n$TOOLTIP_DELIMITER$\nClick a rank, then Shift-click another rank on this page to select a range. Release Shift and drag any selected grip. Drag an unselected grip to move one project.\n\nClick the × in the middle of the selection to cancel all selected projects. Use the arrows to move the selection one position. Alt-click an arrow to send it to the top or bottom of the entire queue.\n\n#instruction Dragging and ordinary group arrow moves are limited to the current page.#!\nIf construction changes the queue, select the range again. Pausing is optional."
 V3QT_LANDING_RANK: "→ ##[GetVariableSystem.Get('v3qt_landing_first')]"
 V3QT_LANDING_RANKS: "→ ##[GetVariableSystem.Get('v3qt_landing_first')]–##[GetVariableSystem.Get('v3qt_landing_last')]"
 V3QT_UP: "#header Move Up in [concept_construction_queue]#!\n$TOOLTIP_DELIMITER$\n#I Click to move the selection up one position on this page#!\n#I Alt-click to send the selection to the top of the entire queue#!\n#I Dragging is limited to the current page#!"
 V3QT_DOWN: "#header Move Down in [concept_construction_queue]#!\n$TOOLTIP_DELIMITER$\n#I Click to move the selection down one position on this page#!\n#I Alt-click to send the selection to the bottom of the entire queue#!\n#I Dragging is limited to the current page#!"
 V3QT_SINGLE_UP: "$MOVE_UP$\n#I Dragging is limited to the current page#!"
 V3QT_SINGLE_DOWN: "$MOVE_DOWN$\n#I Dragging is limited to the current page#!"

 V3QT_CANCEL_SELECTED: "#header Cancel [ToString_int32(Add_int32(Subtract_int32(FixedPointToInt(GetPlayer.MakeScope.Var('v3qt_last').GetValueWithDefault('(CFixedPoint)0')), FixedPointToInt(GetPlayer.MakeScope.Var('v3qt_first').GetValueWithDefault('(CFixedPoint)0'))), '(int32)1'))] selected projects#!\n$TOOLTIP_DELIMITER$\nCancel the highlighted projects at ranks ##[FixedPointToInt(GetPlayer.MakeScope.Var('v3qt_first').GetValueWithDefault('(CFixedPoint)0'))]–##[FixedPointToInt(GetPlayer.MakeScope.Var('v3qt_last').GetValueWithDefault('(CFixedPoint)0'))]."

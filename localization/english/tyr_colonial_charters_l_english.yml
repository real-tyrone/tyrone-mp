l_english:
 tyr_revise_colonial_charters:0 "Revise Colonial Charters"
 tyr_revise_colonial_charters_desc:0 "Review the subsidy obligations written into this administration's economic law."
 tyr_revise_colonial_charters_action_name:0 "Revise Colonial Charters"
 tyr_revise_colonial_charters_action_propose_name:0 "Revise Colonial Charters"
 tyr_revise_colonial_charters_action_notification_name:0 "Colonial Charters"
 tyr_revise_colonial_charters_action_notification_desc:0 "The colonial charters are under review."
 tyr_revise_colonial_charters_action_notification_third_party_name:0 "Colonial Charters"
 tyr_revise_colonial_charters_action_notification_third_party_desc:0 "A colonial administration's charters are under review."
 tyr_colonial_charters.1.t:0 "The Colonial Charters"
 tyr_colonial_charters.1.d:0 "The subsidy obligations of [SCOPE.sCountry('tyr_charter_colony').GetName] are before us for revision. Each charter requires the colonial treasury to subsidize its designated industries. These obligations may be imposed or revoked separately."
 tyr_colonial_charters.1.f:0 "The accounts lay open beside the petitions. Every railway director and plantation proprietor had found a reason why his enterprise deserved a public guarantee."
 tyr_colonial_charters.1.exit:0 "Conclude the review."
 amendment_tyr_colonial_manufacturing_guarantees:0 "Manufacturing Guarantees"
 amendment_tyr_colonial_manufacturing_guarantees_desc:0 "The colonial treasury is required to subsidize manufacturing industries. The overlord may revoke this obligation through the colonial charter review."
 tyr_colonial_charters.1.manufacturing_add:0 "Impose the manufacturing guarantees."
 tyr_colonial_charters.1.manufacturing_remove:0 "Revoke the manufacturing guarantees."
 amendment_tyr_colonial_infrastructure_guarantees:0 "Infrastructure Guarantees"
 amendment_tyr_colonial_infrastructure_guarantees_desc:0 "The colonial treasury is required to subsidize railways and power plants. The overlord may revoke this obligation through the colonial charter review."
 tyr_colonial_charters.1.infrastructure_add:0 "Impose the infrastructure guarantees."
 tyr_colonial_charters.1.infrastructure_remove:0 "Revoke the infrastructure guarantees."
 amendment_tyr_colonial_plantations_guarantees:0 "Plantations Guarantees"
 amendment_tyr_colonial_plantations_guarantees_desc:0 "The colonial treasury is required to subsidize plantations other than rubber plantations. The overlord may revoke this obligation through the colonial charter review."
 tyr_colonial_charters.1.plantations_add:0 "Impose the plantations guarantees."
 tyr_colonial_charters.1.plantations_remove:0 "Revoke the plantations guarantees."
 amendment_tyr_colonial_resources_guarantees:0 "Resource Industries Guarantees"
 amendment_tyr_colonial_resources_guarantees_desc:0 "The colonial treasury is required to subsidize mines, oil rigs, logging camps and rubber plantations. The overlord may revoke this obligation through the colonial charter review."
 tyr_colonial_charters.1.resources_add:0 "Impose the resource industries guarantees."
 tyr_colonial_charters.1.resources_remove:0 "Revoke the resource industries guarantees."
 country_bg_mining_require_subsidies_bool:0 "Forced Subsidies for Mines"
 country_bg_mining_require_subsidies_bool_desc:0 "The administration must subsidize eligible buildings in this sector."
 country_bg_oil_extraction_require_subsidies_bool:0 "Forced Subsidies for Oil Rigs"

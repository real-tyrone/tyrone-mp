l_english:
 tyr_net_integrate_indonesian_protectorates:0 "Consolidate Indonesian Subjects"
 tyr_net_integrate_indonesian_protectorates_desc:0 "Following the consolidation of the East Indies, incorporate protectorates and puppets directly under the Netherlands or Dutch East Indies whose capitals lie in Indonesia into the Dutch East Indies. This annexes their entire countries, including all territory and buildings. The Netherlands, the Dutch East Indies, and each eligible subject must be at peace and uncommitted to a diplomatic play. Human-controlled subjects are excluded. This decision can be used again for newly acquired protectorates and puppets."

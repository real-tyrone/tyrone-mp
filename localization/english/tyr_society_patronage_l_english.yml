l_english:
 tyr_society_provincial_patronage_button:0 "Support the God-Worshipping Society"
 tyr_society_provincial_patronage_button_desc:0 "Finance sympathetic religious associations in a randomly selected eligible owned state. Available from 1850 under Permit Foreign Missions. Costs £10,000; cooldown: twelve months. This supports Society emergence without automatically founding the Heavenly Kingdom or pledging allegiance."
 tyr_society_patronage_permission_tt:0 "The province has chosen Permit Foreign Missions."
 tyr_society_patronage_state_tt:0 "An owned state has at least #v 1%#! Protestant population and has neither Provincial Patronage of the Society nor an existing God-Worshipping Society foothold."
 tyr_society_patronage_cooldown_tt:0 "No provincial Society patronage has been funded in the last #v twelve months#!."
 tyr_society_patronage_effect_tt:0 "One randomly selected eligible owned state gains #v Provincial Patronage of the Society#! for #v five years#!. This substitutes for the local #v 15%#! Turmoil requirement for Society founding and spread. All other founding and spread conditions still apply."
 tyr_society_provincial_patronage:0 "Provincial Patronage of the Society"
 tyr_society_establish_foothold_button:0 "Establish a Society Foothold"
 tyr_society_establish_foothold_button_desc:0 "Turn provincial patronage into an organized God-Worshipping Society foothold. Costs £10,000; cooldown: twelve months. One eligible owned state is selected at random."
 tyr_society_upgrade_state_tt:0 "An owned, incorporated, non-capital Han or Hakka homeland has at least #v 1%#! Protestant population, Provincial Patronage of the Society, and no existing Society foothold."
 tyr_society_upgrade_ready_tt:0 "No Society foothold has been established through this action in the last #v twelve months#!."
 tyr_society_upgrade_effect_tt:0 "One randomly selected eligible owned state loses Provincial Patronage of the Society and gains [GetStaticModifier('god_worshippers').GetName|v] for #v five years#!:\n[GetStaticModifier('god_worshippers').GetDesc]\n\nThis counts as an actual Society foothold for spread and the four-state uprising threshold, and appears as purple stripes on the mission maps. It does not change your civil-war allegiance."
 tyr_society_patronage_map_tt:0 "Provincial Patronage of the Society: substitutes for the local 15% Turmoil requirement for Society founding and spread."
 tyr_society_provincial_patronage_desc:0 "Provincial sponsorship gives the God-Worshipping Society room to organize. This state can satisfy the Society's founding and spread conditions without the usual local Turmoil requirement."

l_english:
 tyr_arabia_workforce:0 "Arabian Labour Mobilization"
 tyr_arabia_workforce_desc:0 "The administration draws a larger share of the population into paid work. Birth rates decline as more households depend on wage labour."
 tyr_indochina_unlocked_tt:0 "Chose to establish a colonial administration in the Indochina Campaign."
 tyr_regional_colony_transfer_tt:0 "Transfers eligible states in the region from us and our subject hierarchy. Subjects retain all states outside the region. States under colonization or treaty ports, and subjects at war or committed to a diplomatic play, are excluded."
 tyr_regional_colony_subject_tt:0 "The administration must remain in our subject hierarchy and be at peace, with no commitment to a diplomatic play."
 tyr_regional_colony_no_duplicate_tt:0 "The previously founded administration no longer exists. Independence or a change of overlord does not permit a duplicate administration."
 tyr_regional_colony_no_subject_tt:0 "We have no other administration of this region in our subject hierarchy."
 tyr_regional_colony_land_tt:0 "We or an eligible subject possess transferable states in the region."
 tyr_arabia_workforce_tt:0 "The Arabian administration permanently gains #v +15 percentage points#! workforce ratio and #v -7.5%#! birth rate. This modifier is retained after independence and does not stack."
 tyr_colony_arabia_create_button:0 "Establish Colony in $region_arabia$"
 tyr_colony_arabia_create_button_desc:0 "North and west of the continent, Arabia stretches over the bones of long decayed empires. Spices and metal are plentiful in this place, as are cocoa and coffee."
 tyr_colony_arabia_expand_button:0 "Expand Our Colony in $region_arabia$"
 tyr_colony_arabia_expand_button_desc:0 "We currently hold lands in $region_arabia$ that would be better administered by our colonial subject. If we have more than one colonial [concept_subject] in this [concept_strategic_region], they will be merged together."
 tyr_colony_arabia_name:0 "Arabia"
 tyr_colony_arabia_adjective:0 "Arabian"
 tyr_colony_indochina_create_button:0 "Establish the Indochina Administration"
 tyr_colony_indochina_create_button_desc:0 "Establish a colonial administration in Indochina."
 tyr_colony_indochina_expand_button:0 "Expand the Indochina Administration"
 tyr_colony_indochina_expand_button_desc:0 "Transfer further regional territories to a colonial administration in Indochina."
 tyr_colony_indochina_name:0 "Indochina"
 tyr_colony_indochina_adjective:0 "Indochinese"
 tyr_regional_indochina_charter_title:0 "A Charter for Indochina"
 tyr_regional_arabia_charter_title:0 "A Charter for Arabia"

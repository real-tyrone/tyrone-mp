l_english:
 je_imperialism_of_promise:0 "Imperialism of Promise"
 je_imperialism_of_promise_reason:0 "British dominion in #variable India#! has always been defended in the language of improvement. Its advocates promise prosperous fields, useful education, thriving commerce, and institutions capable of lifting the country beyond the limitations of its past. Yet the arrangements inherited from #variable Company rule#! often serve the security of imperial interests before the prosperity of those they govern.\n\nShipbuilding remains subordinate to the #variable Royal Navy#!, manufacturing to British workshops, and agricultural labor to obligations fashioned for the collection of revenue. Such restrictions cannot be answered by proclamations alone. Their defenders must be confronted with the productive capacity, political support, and practical alternatives that make reform possible.\n\nThe work of government is therefore not merely to extend authority across the subcontinent, but to decide what that authority shall accomplish. Each reform will test whether the promises of empire can survive the interests sustained by its administration. #bold Build the foundations for reform and dismantle the restrictions that hold India back.#!"
 je_imperialism_of_promise_status:0 "Pursue the reforms below. This Journal Entry cannot yet be completed."
 tyrone_promise_heading:0 "Colonial Restrictions"

 je_tyrone_promise_naval_industry:0 "An Indian Shipbuilding Industry"
 je_tyrone_promise_naval_industry_reason:0 "The rivers and timberlands of #variable East Bengal#! offer the foundations of a formidable shipbuilding industry. Under the existing arrangements, however, Indian yards remain auxiliaries of imperial sea power rather than the basis of an independent naval establishment. The restrictions imposed in the name of #variable Royal Navy supremacy#! will endure while the necessary industrial capacity is absent.\n\nA modern dockyard requires more than slips along the waterfront. Its workshops must draw upon a substantial urban economy, a reliable supply of mechanically processed timber, and the heavy lifting equipment needed to assemble increasingly ambitious vessels. These supporting industries must grow together.\n\nOnly a concentrated industrial effort can turn Bengal's advantages into an argument the Admiralty cannot dismiss. #bold Develop the shipyards, towns, and mechanized timber industry of East Bengal to end the naval restrictions.#!"
 je_tyrone_promise_naval_industry_status:0 "India’s shipbuilding industry is subordinate to #v British interests#!."
 tyrone_promise_naval_industry_row:0 "Indian Shipbuilding"
 tyrone_promise_naval_industry_completed:0 "India will lose the #variable $amendment_royal_navy_supremacy$#! amendment. It will no longer be reapplied when naval laws change."

 je_tyrone_promise_plantation_labor:0 "Reforming Plantation Labor"
 je_tyrone_promise_plantation_labor_reason:0 "The administration of #variable plantation labor#! rests upon the claim that abundant hands, rather than improved methods, are the surest foundation of agricultural prosperity. Obligations preserve a large workforce while discouraging the changes that could make its labor more productive. The cost is borne in the fields and at the household table.\n\nReform must demonstrate that a different arrangement can feed the country. Fertilization and steam-powered threshing can transform the great rice-growing districts, but isolated experiments will not settle the question. Several provinces must sustain production on a scale large enough to influence the supply of ordinary food.\n\nAffordable grain and groceries will give practical force to the argument for change. #bold Establish three great centers of mechanized rice cultivation and bring food prices below their base level to remove the plantation labor obligations.#!"
 je_tyrone_promise_plantation_labor_status:0 "Keep Grain and Groceries at least #variable 5%#! below base price. Have #variable 3#! states with #variable 200#! Rice Farms each, using Fertilization and Steam-Powered Threshers."
 tyrone_promise_plantation_labor_row:0 "Plantation Labor Reform"
 tyrone_promise_plantation_labor_completed:0 "India will lose the #variable $amendment_plantation_labor_obligations$#! amendment."

 je_tyrone_promise_manufacturing_monopoly:0 "Ending the Manufacturing Monopoly"
 je_tyrone_promise_manufacturing_monopoly_reason:0 "The #variable British Manufacturing Monopoly#! assigns India a familiar place in imperial commerce: supplier of raw materials and purchaser of finished goods. Restrictions on domestic textile manufacture defend the position of British workshops, even where Indian labor, markets, and commercial experience could sustain an industry of their own.\n\nBreaking this arrangement requires both political authority and the means to use it. Crown administration may reconsider privileges inherited from the Company; a program of #variable Chartered Industrialization#! may instead establish a new claim for domestic investment. Neither route can succeed while industrial organization remains undeveloped and useful knowledge is treated as a British preserve.\n\nSchools and independent access to technical knowledge must therefore accompany the reorganization of production. #bold Secure a political route to industrial reform, adopt Shift Work, and end dependence on British patents to lift the manufacturing monopoly.#!"
 je_tyrone_promise_manufacturing_monopoly_status:0 "Become the British Raj or enact Chartered Industrialization. Research Shift Work, replace Informal Company Schooling, and remove Reliance on British Patents."
 tyrone_promise_manufacturing_monopoly_row:0 "The Manufacturing Monopoly"
 tyrone_promise_manufacturing_monopoly_completed:0 "India will lose the #variable $amendment_british_manufacturing_monopoly$#! amendment, lifting its restriction on the construction of Textile Mills."

 je_tyrone_promise_bonded_labor:0 "Ending Bonded Labor Guarantees"
 je_tyrone_promise_bonded_labor_reason:0 "The #variable Company's bonded labor guarantees#! shelter established relations of dependence from political interference. Their beneficiaries describe them as necessary assurances to property and production. Their opponents see an administration committed to preserving coercion even when the country has begun to outgrow the arrangements that sustained it.\n\nA successful challenge requires influence beyond the offices of the Company. Powerful intellectuals, small proprietors, or rural interests may force the question onto the political agenda; the establishment of the #variable British Raj#! offers another route to reconsidering Company privileges. In either case, the old system of Company Administration must give way.\n\nA substantial manufacturing economy will strengthen the case that prosperity need not rest upon inherited bonds of labor. #bold Build an industrial alternative and secure the political authority to withdraw the Company's guarantees.#!"
 je_tyrone_promise_bonded_labor_status:0 "Secure a powerful Intelligentsia, Petite Bourgeoisie, or Rural Folk, or become the British Raj. End Company Administration and reach #variable 300#! Manufacturing building levels."
 tyrone_promise_bonded_labor_row:0 "Bonded Labor Guarantees"
 tyrone_promise_bonded_labor_completed:0 "India will lose the #variable $amendment_company_bonded_labor_guarantees$#! amendment, removing its special obstruction to banning slavery. Other enactment requirements still apply."
 tyrone_promise_no_british_patents_tt:0 "Does not have the #variable $amendment_reliance_on_british_patents$#! amendment"

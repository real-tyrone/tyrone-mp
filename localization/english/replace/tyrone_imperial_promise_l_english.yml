 tyrone_promise_industrialize_gangetic_plain_row:0 "Industrializing Bihar, Agra and Oudh"
 je_tyrone_promise_industrialize_carnatic_malabar:0 "Industrializing Carnatic and Malabar"
 je_tyrone_promise_industrialize_carnatic_malabar_reason:0 "The eastern towns of #variable Carnatic#! and the western coast of #variable Malabar#! offer different foundations for industrial growth. Their development must connect established commerce with new workshops, urban services, and reliable railway transport.\n\nA concentration of factories alone will not settle the question. Urban services must support the workforce, while railway connections give industry access to materials and markets. Direct Indian administration must extend across the whole of every province concerned; the development of a subject does not satisfy this undertaking.\n\nMalabar follows a smaller program, with half the development requirements of Carnatic. Successful development will replace #variable Indian Rural Region#! with #variable Early Industrialized#! throughout the designated regions. #bold Directly own all of Carnatic and Malabar. Carnatic requires 100 Manufacturing levels, 50 Urban Centers, and 10 Railways; Malabar requires 50, 25, and 5 respectively.#!"
 je_tyrone_promise_industrialize_carnatic_malabar_status:0 ""
 je_tyrone_promise_industrialize_carnatic_malabar_goal:0 "Directly own all of Carnatic and Malabar and develop each to its required industrial, urban, and railway levels."
 tyrone_promise_industrialize_carnatic_malabar_row:0 "Industrializing Carnatic and Malabar"
 je_tyrone_promise_industrialize_deccan:0 "Industrializing Hyderabad and Central Provinces"
 je_tyrone_promise_industrialize_deccan_reason:0 "An industrial economy in #variable Hyderabad and the Central Provinces#! would carry the promise of reform beyond the coastal presidencies. Inland workshops need towns capable of sustaining them and railways that can connect their production with wider markets.\n\nA concentration of factories alone will not settle the question. Urban services must support the workforce, while railway connections give industry access to materials and markets. Direct Indian administration must extend across the whole of every province concerned; the development of a subject does not satisfy this undertaking.\n\nSuccessful development will replace #variable Indian Rural Region#! with #variable Early Industrialized#! throughout the designated regions. #bold Directly own every province concerned and develop each to 100 Manufacturing levels, 50 Urban Centers, and 10 Railways.#!"

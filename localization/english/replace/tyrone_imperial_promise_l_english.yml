 tyrone_promise_industrialize_bombay_row:0 "Industrializing Bombay"
 je_tyrone_promise_industrialize_gangetic_plain:0 "Industrializing Bihar, Agra and Oudh"
 je_tyrone_promise_industrialize_gangetic_plain_reason:0 "The great agricultural districts of #variable Bihar, Agra and Oudh#! sustain extensive markets and a large rural workforce. Manufacturing must develop alongside that inherited economy if the end of the monopoly is to transform more than a handful of commercial towns.\n\nA concentration of factories alone will not settle the question. Urban services must support the workforce, while railway connections give industry access to materials and markets. Direct Indian administration must extend across the whole of every province concerned; the development of a subject does not satisfy this undertaking.\n\nSuccessful development will replace #variable Indian Rural Region#! with #variable Early Industrialized#! throughout the designated regions. #bold Directly own every province concerned and develop each to 100 Manufacturing levels, 50 Urban Centers, and 10 Railways.#!"
 je_tyrone_promise_industrialize_gangetic_plain_status:0 ""

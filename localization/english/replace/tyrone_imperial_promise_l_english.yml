 tyrone_promise_industrialize_deccan_row:0 "Industrializing Hyderabad and Central Provinces"
 je_tyrone_promise_industrialize_rajputana:0 "Industrializing Rajputana"
 je_tyrone_promise_industrialize_rajputana_reason:0 "The towns and trading routes of #variable Rajputana#! can support an economy less dependent upon the surrounding countryside. The lifting of the manufacturing monopoly opens that possibility, but only sustained industrial and urban development can make it a reality.\n\nA concentration of factories alone will not settle the question. Urban services must support the workforce, while railway connections give industry access to materials and markets. Direct Indian administration must extend across the whole of every province concerned; the development of a subject does not satisfy this undertaking.\n\nSuccessful development will replace #variable Indian Rural Region#! with #variable Early Industrialized#! throughout the designated regions. #bold Directly own every province concerned and develop each to 100 Manufacturing levels, 50 Urban Centers, and 10 Railways.#!"

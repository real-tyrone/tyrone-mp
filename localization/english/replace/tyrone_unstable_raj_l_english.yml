 tyrone_raj_overlord_deficit_progress:0 "The overlord has a budget deficit"
 tyrone_raj_share_deal_available_tt:0 "Neither India nor its current overlord has bought or sold Company shares in the last #variable 28 months#!"
 tyrone_raj_share_towards_company_tt:0 "Moves Company control towards #variable +150#! by #variable +5#! per month for #variable one year#!. Company or Crown completes automatically at that threshold once the debt has been discharged. Further share dealings are locked for #variable 28 months#!."
 tyrone_raj_share_towards_crown_tt:0 "Moves Company control towards #variable −150#! by #variable −5#! per month for #variable one year#!. Reaching that threshold automatically causes #bold Company or Crown#! and #bold Unstable Raj#! to fail and triggers the Indian Uprising. Further share dealings are locked for #variable 28 months#!."
 tyrone_raj_shares_after_debt_tt:0 "The debt has been discharged: share dealings no longer affect Company control, which advances by a fixed #variable +5#! each month. The financial effects still apply, and further dealings are locked for #variable 28 months#!."
 tyrone_raj_crown_act_effect_tt:0 "Crown control has reached #variable −150#!. #bold Company or Crown#! and #bold Unstable Raj#! fail automatically, triggering the #bold Indian Uprising#!. Crown rule is not imposed directly."
 tyrone_raj_political_agreement_modifier:0 "Terms of the Company Settlement"
 tyrone_raj_political_agreement_modifier_desc:0 "The debt has been extinguished through a political settlement, but financiers have secured concessions that burden private investment and public borrowing."
 bic_content.2.d:0 "The government has asserted its right to assume control of [SCOPE.sCountry('company_scope').GetName]. An act intended to settle the question of authority has instead exposed how little agreement exists about who should govern India."
 bic_content.2.f:0 "The new dispatches arrived with every signature in order. In the cantonments and district offices, men read the same pages and understood them differently. What ministers called a settlement, others received as the beginning of a struggle."
 bic_content.3.d:0 "The government has repealed the Charter Act of 1833, restoring economic and administrative authority to [SCOPE.sCountry('company_scope').GetName]. The directors have secured the settlement they sought, and their officials are preparing to exercise its powers."
 bic_content.3.f:0 "For months the clerks had kept two sets of instructions within reach. One concerned the daily business of government; the other anticipated its transfer. The second set could now be put away."
 treasury_buy_shares_desc:0 "Use public funds to acquire Company shares and strengthen the claim of the current overlord to supervise the administration of India."
 enact_government_of_india_act_desc:0 "Assert the right of the current overlord to assume the government of India. The attempt will bring the Company settlement to an end and provoke an uprising."
 sell_shares_to_britain:0 "Sell Shares to the Government"
 sell_shares_to_britain_desc:0 "Transfer Company shares to the current overlord in exchange for funds, conceding a stronger claim to government oversight."
 je_company_equity_completion_header:0 "The Company settlement is secured when: \n"
 je_company_equity_failure_header:0 "The Company settlement fails when:"

l_english:
 je_uneasy_raj:0 "Unstable Raj"
 tyrone_unstable_raj_liberty_desire:0 "$je_uneasy_raj$"
 tyrone_unstable_raj_liberty_desire_desc:0 "The Company’s unsettled rule encourages demands for greater autonomy."
 je_uneasy_raj_reason:0 "A chartered company has become the government of a subcontinent. Its collectors assess the harvest, its magistrates hear petitions, and its sepoys enforce decisions made far from the villages that must obey them. Revenue reaches the treasury, but obedience is not the same as consent.\n\nAcross #bold Bengal#!, #bold Bombay#!, and #bold Madras#!, old authorities bargain with a new administration. Princes defend their privileges, creditors demand payment, and religious communities watch for signs that government intends to remake their lives. Every dispute places another burden upon the men who keep the peace.\n\nThe directors must prove that the Company can do more than collect and conquer. Relief, learning, and public health may give its rule firmer foundations. Failure will strengthen the case for government from above, even as resistance gathers below."
 je_uneasy_raj_status:0 "The #o Company#! must be reformed to survive"
 je_uneasy_raj_goal:0 "Complete the initial reforms, or obtain [concept_independence]."
 je_uneasy_raj_complete_header:0 "The Company settlement is secured when: \n"
 je_uneasy_raj_on_complete_header:0 "If secured:"
 je_company_equity:0 "Company or Crown"
 je_company_equity_reason:0 "The charter leaves an awkward question unanswered: does India belong to a government, or to a body of shareholders? The Company maintains the offices and commands the troops, but its creditors can point to obligations that no seal or proclamation will dismiss.\n\nAt the treasury, arguments over accounts have become arguments over authority. Ministers purchase influence in the name of public oversight; directors seek to recover the shares on which their independence rests. Each side presents its demands as the restoration of a rightful order.\n\nA settlement of the debt would deprive the Company’s opponents of their strongest claim. Until then, the future of its government remains open to negotiation, purchase, and threats of intervention."
 je_company_equity_status:0 "Outstanding debt: @money! #variable [SCOPE.sCountry('raj_scope').MakeScope.Var('tyrone_raj_debt').GetValue|D]#!."
 je_company_equity_goal:0 "Discharge the debt and reach #variable +150#! Company control; alternatively, negotiate a political agreement or obtain [concept_independence]."
 tyrone_raj_heading:0 "The Company Settlement"
 tyrone_raj_welfare_done_tt:0 "Has completed $je_tyrone_raj_welfare$"
 tyrone_raj_schools_done_tt:0 "Has completed $je_tyrone_raj_schools$"
 tyrone_raj_health_done_tt:0 "Has completed $je_tyrone_raj_health$"
 tyrone_raj_debt_done_tt:0 "Has completed $je_company_equity$"
 tyrone_raj_nation_done_tt:0 "Has completed The Way of the Nation"
 tyrone_raj_debt_paid_tt:0 "The Company debt has been discharged"
 tyrone_company_self_rule_unlocked_tt:0 "Unlocks #bold Company Self-Rule#!."
 tyrone_raj_toggle_repayment_button:0 "Toggle Monthly Repayments"
 tyrone_raj_toggle_repayment_button_desc:0 "Arrange a regular remittance to the current overlord, or suspend the existing arrangement."
 tyrone_raj_pay_million_button:0 "Make an Extraordinary Payment"
 tyrone_raj_pay_million_button_desc:0 "Pay up to @money! #variable 1,000,000#! to the current overlord, without exceeding the remaining debt. This payment can be made once every #variable two months#!."
 tyrone_raj_political_agreement_button:0 "Negotiate a Political Agreement"
 tyrone_raj_political_agreement_button_desc:0 "Secure a final settlement with the government after the other initial reforms have been established, accepting unfavorable financial terms in return."
 tyrone_honorable_company.d:0 "The Company has secured its position in [ROOT.GetCountry.GetName]. Its government now possesses a mandate to pursue a new settlement, whether under an overlord or as an independent administration."
 tyrone_honorable_company.f:0 "The ledgers were closed, the dispatches sealed, and the clerks returned to their desks. The question was no longer whether the Company could govern, but what manner of government it would become."
 tyrone_honorable_company.a:0 "The Company has earned its mandate."
 tyrone_honorable_company.b:0 "Order must be made permanent."
 je_tyrone_raj_welfare:0 "A Public Obligation"
 je_tyrone_raj_welfare_reason:0 "A failed harvest leaves more than empty granaries. Cultivators sell their tools, families leave the villages, and petitions arrive at offices equipped to collect arrears rather than relieve distress. The obligation to pay survives long after the means of paying have disappeared.\n\nSome officials insist that local charity should bear the burden. Others fear what happens when hunger reaches the towns and relief becomes indistinguishable from the restoration of order. Neither argument feeds those waiting outside the collectorate.\n\nThe administration must decide whether the welfare of its subjects belongs among the duties of government. A lasting provision for the poor would be a different kind of claim to authority."
 je_tyrone_raj_welfare_goal:0 "Establish an alternative law and develop [GetInstitutionType('institution_social_security').GetName] to at least #variable level 2#!."
 je_tyrone_raj_welfare_status:0 ""
 je_tyrone_raj_schools:0 "The Foundations of Learning"
 je_tyrone_raj_schools_reason:0 "Village schools, madrasas and colleges preserve traditions of learning older than Company rule. The administration seeks teachers and trained officials, while Indian patrons dispute whose languages and knowledge the new schools should serve. A lasting system of education will need support beyond a handful of favoured institutions."
 je_tyrone_raj_schools_goal:0 "Bring the foundations of learning to #v 100#!."
 je_tyrone_raj_schools_status:0 ""
 je_tyrone_raj_health:0 "An Administration of Care"
 je_tyrone_raj_health_reason:0 "The dispensary stands beside the cantonment, close to those whose health the government has learned to count. Beyond its doors, fever and cholera pass through crowded neighborhoods and rural settlements with far less attention from the authorities.\n\nSurgeons ask for staff, medicines, and premises. District officers debate the expense, while local practitioners and religious patrons continue the work that official provision does not reach. Each outbreak makes these separate arrangements look less sufficient.\n\nA government that claims responsibility for order cannot remain indifferent to the conditions in which its subjects live. Care must become an enduring part of the administration, rather than an emergency concession."
 je_tyrone_raj_health_goal:0 "Establish an alternative law and develop [GetInstitutionType('institution_health_system').GetName] to at least #variable level 2#!."
 je_tyrone_raj_health_status:0 ""
 tyrone_raj_debt_status_active:0 "$je_company_equity_status$\nMonthly repayments: #bold enabled#!."
 tyrone_raj_debt_status_paused:0 "$je_company_equity_status$\nMonthly repayments: #bold suspended#!."
 tyrone_raj_company_failed_tt:0 "$je_company_equity$ has failed"
 tyrone_raj_start_repayment_tt:0 "Enables monthly repayments of #variable 10%#! of gross state revenue, paid to the current overlord and capped at the remaining debt. This arrangement cannot be changed again for #variable two months#!. Once the debt is cleared, Company control advances by a fixed #variable +5#! each month."
 tyrone_raj_stop_repayment_tt:0 "Suspends monthly repayments. The outstanding debt remains due. This arrangement cannot be changed again for #variable two months#!."
 tyrone_raj_agreement_effect_tt:0 "Cancels the outstanding debt, sets Company control to #variable +150#!, and completes #bold Company or Crown#! immediately."

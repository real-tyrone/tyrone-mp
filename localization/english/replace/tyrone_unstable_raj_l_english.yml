 tyrone_raj_debt_status_paid:0 "$je_company_equity_status$\nThe debt is discharged. Company control advances by #variable +5#! each month; #bold Company or Crown#! completes automatically at #variable +150#!."
 tyrone_raj_india_share_towards_company_tt:0 "Moves Company control towards #variable +150#! by #variable +2#! per month for #variable one year#!. Company or Crown completes automatically at that threshold once the debt has been discharged. Further share dealings are locked for #variable 28 months#!."
 tyrone_raj_india_share_towards_crown_tt:0 "Moves Company control towards #variable −150#! by #variable −2#! per month for #variable one year#!. Reaching that threshold automatically causes #bold Company or Crown#! and #bold Unstable Raj#! to fail and triggers the Indian Uprising. Further share dealings are locked for #variable 28 months#!."

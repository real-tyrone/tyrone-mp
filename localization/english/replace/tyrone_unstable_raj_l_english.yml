 tyrone_raj_schooling_low_literacy_tt:0 "Literacy below 10%"
 tyrone_unstable_raj_princely_discontent:0 "Discontent Among the Princes"
 tyrone_unstable_raj_princely_discontent_desc:0 "Unrest in Company India has emboldened the princely courts to press their claims against its authority."
 tyrone_unstable_raj_raised_payments:0 "Resented Tribute"
 tyrone_unstable_raj_raised_payments_desc:0 "Increased tribute has deepened the princely court’s resentment of Company rule."
 tyrone_unstable_raj_reduced_payments:0 "Remission of Tribute"
 tyrone_unstable_raj_reduced_payments_desc:0 "Reduced tribute has eased the princely court’s grievances against Company rule."

 tyrone_company_self_rule.90.t:0 "India at the Crossroads"
 tyrone_company_self_rule.90.d:0 "The Company governs through three presidencies, a network of princely courts and institutions that can scarcely meet the demands placed upon them. During #bold $je_uneasy_raj$#!, strengthen schooling, welfare and healthcare, settle the Company’s debt and resolve #bold $je_tyrone_raj_nation$#! while preserving order in the presidencies. Failure can bring the Sepoy Mutiny and Crown rule; successful reform preserves the Company’s chance to govern. Independence opens a separate choice of national settlement.\n\nDemanding #v increased subject payments#! from India’s princely subjects adds a further #r +1 Liberty Desire#! modifier while the demand remains active. This is checked monthly during #bold $je_uneasy_raj$#!; reducing their payments instead grants #g −1#!."
 tyrone_company_self_rule.90.f:0 "The Company’s seal still heads every proclamation. Whether it will stand above a crown, a parliament or a workers’ council remains unsettled."
 tyrone_company_self_rule.90.a:0 "#bold The Raj: Jewel of the Empire#! #bold #g Colony#!#!"
 tyrone_company_self_rule.90.a.tt:0 "#o Crown Rule#!\nA subject India reforms the Crown’s police, corporations, administration and institutions, then becomes the Jewel of the Empire. Governors negotiate development and imperial interests; sustained GDP growth strengthens the colony.\n\n#bold Reach Crown rule after the mutiny or fail Company Self-Rule with no reforms. Complete all four Raj reforms.#!"
 tyrone_company_self_rule.90.b:0 "#bold Bharatiya Commune#! #bold #r Independent#!#!"
 tyrone_company_self_rule.90.b.tt:0 "#o The Revolutionary Road#!\nAn independent socialist India fights the princes, undertakes five-year plans and can pursue forced industrialization. Cultural recognition rests on secularization and political consent.\n\n#bold Enter An Independent Course after independence. Research Socialism, raise socialist tension during the Constituent Assembly and choose revolution.#!"
 tyrone_company_self_rule.90.c:0 "#bold Monarchy or Federation#! #bold #r Independent#!#!"
 tyrone_company_self_rule.90.c.tt:0 "#o A National Constitution#!\nAn independent India chooses a centralized monarchy or a parliamentary federation, builds its national institutions and resolves the Pakistani and Bengali questions. Citizenship and industrial development remain separate undertakings.\n\n#bold Enter An Independent Course after independence. Reach either constitutional extreme and approve the constitution.#!"
 tyrone_company_self_rule.90.option_d:0 "#bold The Sovereign Company#! #bold #r Independent#!#! / #bold #g Subject#!#!"
 tyrone_company_self_rule.90.d.tt:0 "#o Government by Company#!\nIndia remains a company-state. Experts and shareholders contest its institutions, Indian companies compete for the government, and naval expansion supports a commercial economy.\n\n#bold Complete Unstable Raj and enter Company Self-Rule. Finish at least one reform within seven years, then choose Sovereign Company.#!"
 tyrone_company_self_rule.90.e:0 "#bold Empire of India#! #bold #r Independent#!#! / #bold #g Subject#!#!"
 tyrone_company_self_rule.90.e.tt:0 "#o An Indian Empire#!\nA constitutional settlement opens administrative reform, a continental army and the Council of Princes. Integration and economic growth prepare the coronation; Home Rule can broaden the empire’s primary cultures.\n\n#bold Complete Unstable Raj and enter Company Self-Rule. Finish at least one reform within seven years, then choose Empire of India.#!"

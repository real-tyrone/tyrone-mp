l_english:
 je_tyrone_csr_crown_path:0 "Under Crown Rule"
 je_tyrone_csr_crown_path_reason:0 "The Crown has assumed the Company’s public obligations, but its authority still passes through offices built for a commercial empire. In [SCOPE.sCountry('csr_india').GetName], the new government must settle the reach of its police, the terms offered to industry, and the duties it owes to its subjects.\n\nThe #v directors#! have lost their charter to govern. Their privileges and dependants remain."
 je_tyrone_csr_crown_path_status:0 ""
 tyrone_cr_status_0:0 "#v No reforms settled#!; Company arrangements endure."
 tyrone_cr_status_1:0 "#v One reform settled#!; Company arrangements persist."
 tyrone_cr_status_2:0 "#v Two reforms settled#!; Crown administration takes shape."
 tyrone_cr_status_3:0 "#v Three reforms settled#!; one dispute remains."
 tyrone_cr_status_4:0 "#v Four reforms settled#!; Crown administration established."
 je_tyrone_cr_police:0 "Crown Police Reform"
 je_tyrone_cr_police_reason:0 "The Crown’s officers seek a constabulary able to enforce orders throughout the districts. Local recruits know the country, while the military establishment supplies methods of discipline that leave little room for public dissent. [GetLawType('law_india_crown_constabulary').GetName] would place this force under a common command."
 je_tyrone_cr_police_status:0 ""
 je_tyrone_cr_corporations:0 "Crown Corporation Reform"
 je_tyrone_cr_corporations_reason:0 "Guaranteed contracts bind the government to enterprises whose losses must be borne by the treasury. Under [GetLawType('law_india_crown_industrial_obligations').GetName], the dispute concerns who directs their expansion and who receives its proceeds. #v Imperial investors#! seek reliable returns; advocates of #v Indian development#! demand room to build."
 je_tyrone_cr_corporations_status:0 ""
 je_tyrone_cr_apparatus:0 "Dismantling the Company Apparatus"
 je_tyrone_cr_apparatus_reason:0 "The Company’s authority survives in commercial monopolies, protected contracts, and claims upon labour. [GetLawType('law_india_crown_administration').GetName] has inherited the cost of honouring these arrangements. Each privilege that is surrendered will require the government to settle with those who relied upon it."
 je_tyrone_cr_apparatus_status:0 ""
 tyrone_cr_directorate_removed_tt:0 "#v $amendment_company_directorate$#! is not active."
 tyrone_cr_monopoly_removed_tt:0 "#v $amendment_british_manufacturing_monopoly$#! is not active."
 tyrone_cr_trade_removed_tt:0 "#v $amendment_colonial_trading_privileges$#! is not active."
 tyrone_cr_cotton_removed_tt:0 "#v $amendment_cotton_export_guarantees$#! is not active."
 tyrone_cr_patents_removed_tt:0 "#v $amendment_reliance_on_british_patents$#! is not active."
 tyrone_cr_bonded_removed_tt:0 "#v $amendment_company_bonded_labor_guarantees$#! is not active."
 je_tyrone_cr_institutions:0 "Crown Institution Reforms"
 je_tyrone_cr_institutions_reason:0 "The Crown’s claim to govern carries obligations that its revenue officers cannot discharge alone. [GetLawType('law_india_imperial_factory_inspectorate').GetName] would bring conditions of employment under public scrutiny, while schools and relief boards extend the administration’s duties beyond the collection of taxes. Bonded labour remains a test of how far those duties will reach."
 je_tyrone_cr_institutions_status:0 ""
 je_tyrone_jewel_of_the_empire:0 "The Jewel of the Empire"
 je_tyrone_jewel_of_the_empire_reason:0 "The Crown’s government in [SCOPE.sCountry('csr_india').GetName] has inherited an administration built to serve both the country and its imperial rulers. Its governors must now settle whose claims take priority when public works, commercial contracts, and military obligations compete for the same resources.\n\n#v Indian development#! has its advocates in the districts and workshops. The #v imperial government#! expects reliable revenues and service in return for its commitments. Each governor brings their own experience to a settlement that neither side regards as final."
 je_tyrone_jewel_of_the_empire_status:0 ""
 tyrone_cr_heading:0 "Crown Reforms"
 tyrone_cr_police_unlocked_tt:0 "Complete #v Crown Police Reform#! to unlock this law."
 tyrone_cr_corporations_unlocked_tt:0 "Enter #v Under Crown Rule#! to unlock this law."

 tyrone_cr_corporations_done_tt:0 "#v Crown Corporation Reform#! has been completed"
 tyrone_cr_apparatus_done_tt:0 "#v Dismantling the Company Apparatus#! has been completed"
 tyrone_cr_institutions_done_tt:0 "#v Crown Institution Reforms#! has been completed"
 tyrone_cr_police_locked_tt:0 "Cannot replace the Imperial Constabulary while a [concept_subject]."
 tyrone_cr_corporations_locked_tt:0 "Cannot replace Crown Industrial Obligations while a [concept_subject]."
 tyrone_cr_civil_service_locked_tt:0 "Complete #v Dismantling the Company Apparatus#! before replacing Crown Civil Service while a [concept_subject]."
 tyrone_cr_police_available_tt:0 "This country is not already financing a police intervention"
 tyrone_cr_dismantle_available_tt:0 "No other Company privilege is being dismantled"
 tyrone_cr_negotiation_available_tt:0 "No negotiation is awaiting a response, and one year has passed since the previous negotiation began"
 tyrone_cr_proposal_response_tt:0 "India will receive this proposal and may pay a concession to adopt the alternative."
 law_india_crown_constabulary:0 "Imperial Constabulary"
 law_india_crown_constabulary_desc:0 "A centrally commanded constabulary enforces imperial authority through the districts. Its broad powers suppress the disruption of public unrest at a severe human cost."
 law_india_crown_industrial_obligations:0 "Crown Industrial Obligations"
 law_india_crown_industrial_obligations_desc:0 "The Crown guarantees the operation of manufacturing, railway, plantation, and electric-power enterprises, binding the treasury to their continued employment and production."
 law_india_imperial_factory_inspectorate:0 "Imperial Factory Inspectorate"
 law_india_imperial_factory_inspectorate_desc:0 "An inspectorate appointed under imperial authority supervises conditions of employment in Indian workplaces."
 law_india_imperial_labour_protections:0 "Imperial Labour Protections"
 law_india_imperial_labour_protections_desc:0 "Imperial labour regulations establish minimum wages and extend public oversight of employment."
 tyrone_cr_police_recruitment_button:0 "Recruit the Constabulary"
 tyrone_cr_police_recruitment_button_desc:0 "A force spread through the districts must draw recruits into public service and offer wages sufficient to retain them."
 tyrone_cr_police_recruitment_done_tt:0 "Recruit the Constabulary has been funded"
 tyrone_cr_police_training_button:0 "Train the Officers"
 tyrone_cr_police_training_button_desc:0 "Military instructors offer the new force a common discipline, with equipment and drill to match."
 tyrone_cr_police_training_done_tt:0 "Train the Officers has been funded"
 tyrone_cr_police_districts_button:0 "Organize the Police Districts"
 tyrone_cr_police_districts_button_desc:0 "The district establishment needs clear jurisdictions and a regular chain of command reaching beyond the provincial capitals."
 tyrone_cr_police_districts_done_tt:0 "Organize the Police Districts has been funded"
 tyrone_cr_police_surveillance_button:0 "Establish the Intelligence Network"
 tyrone_cr_police_surveillance_button_desc:0 "The government seeks reports from places where its officers seldom travel. Local informants expect protection, and officials will have to answer for their conduct."
 tyrone_cr_police_surveillance_done_tt:0 "Establish the Intelligence Network has been funded"
 tyrone_cr_dismantle_directorate_button:0 "Retire the Company Directorate"
 tyrone_cr_dismantle_directorate_button_desc:0 "The directors’ private influence survives in appointments and privileges attached to public office. Their remaining claims must be settled before the administration can dispense with their services."
 tyrone_cr_dismantle_monopoly_button:0 "End the Manufacturing Monopoly"
 tyrone_cr_dismantle_monopoly_button_desc:0 "Indian manufacturers seek release from contracts that reserve their market for overseas suppliers. The treasury must meet the obligations left by those guarantees."
 tyrone_cr_dismantle_trade_button:0 "Settle the Trading Privileges"
 tyrone_cr_dismantle_trade_button_desc:0 "The Company’s trading houses claim rights that reach beyond their warehouses. Ending their privileges requires a settlement with the merchants who still rely upon them."
 tyrone_cr_dismantle_cotton_button:0 "Discharge the Cotton Guarantees"
 tyrone_cr_dismantle_cotton_button_desc:0 "Export contracts have bound the government to the cotton trade. The district establishment will have to settle those claims without renewing them."
 tyrone_cr_dismantle_patents_button:0 "Settle the Patent Agreements"
 tyrone_cr_dismantle_patents_button_desc:0 "Imported technical knowledge carries obligations to its suppliers. Domestic workshops will need room to learn without preserving every restriction written into the old agreements."
 tyrone_cr_dismantle_bonded_button:0 "Withdraw the Bonded Labour Guarantees"
 tyrone_cr_dismantle_bonded_button_desc:0 "Creditors invoke the Company’s promises to defend their claims over bonded labour. The Crown must withdraw that protection before the legislature can settle the wider question."
 tyrone_cr_negotiate_manufacturing_button:0 "Negotiate the Manufacturing Settlement"
 tyrone_cr_negotiate_manufacturing_button_desc:0 "Manufacturers seek assured contracts, while imperial suppliers insist that public guarantees should secure their own place in the market."
 tyrone_cr_negotiate_manufacturing_tt:0 "The overlord will propose a #v manufacturing#! settlement for India’s response."
 tyrone_cr_manufacturing_signed_tt:0 "The #v manufacturing#! settlement has been signed"
 amendment_tyrone_cr_manufacturing_imperial:0 "Imperial Manufacturing Settlement"
 amendment_tyrone_cr_manufacturing_imperial_desc:0 "The guarantees favour established production under an agreement with the imperial government."
 amendment_tyrone_cr_manufacturing_development:0 "Indian Manufacturing Settlement"
 amendment_tyrone_cr_manufacturing_development_desc:0 "The guarantees have been redirected towards the development of the industry in India."
 tyrone_crown_raj.10.t:0 "Manufacturing under Guarantee"
 tyrone_crown_raj.10.d:0 "The guaranteed manufacturing establishment in [SCOPE.sCountry('csr_india').GetName] requires a settlement over its expansion. The imperial government can favour returns on existing production or leave more room for factories to be built in India."
 tyrone_crown_raj.10.f:0 "The manufacturers asked for larger orders. Their representatives abroad asked who would retain the contracts once the new mills were standing."
 tyrone_crown_raj.10.a:0 "Propose the imperial settlement."
 tyrone_crown_raj.10.b:0 "Support development in India."
 tyrone_crown_raj.20.t:0 "The Manufacturers’ Agreement"
 tyrone_crown_raj.20.d:0 "The imperial government has offered terms favouring the output of guaranteed manufacturers. Indian officials can accept the settlement or bear the cost of securing greater freedom to expand the industrial establishment."
 tyrone_crown_raj.20.f:0 "The two drafts lay side by side. One promised more work from the mills already standing; the other concerned mills for which the foundations had yet to be laid."
 tyrone_crown_raj.20.a:0 "Accept the imperial settlement."
 tyrone_crown_raj.20.b:0 "Meet the concession and secure Indian development."
 tyrone_crown_raj.30.t:0 "A Settlement for Indian Industry"
 tyrone_crown_raj.30.d:0 "The imperial government has offered terms favouring the construction of new factories in India. The administration can accept them or seek a settlement directed towards the returns on existing production."
 tyrone_crown_raj.30.f:0 "The two drafts lay side by side. One promised more work from the mills already standing; the other concerned mills for which the foundations had yet to be laid."
 tyrone_crown_raj.30.a:0 "Accept the development settlement."
 tyrone_crown_raj.30.b:0 "Meet the concession and adopt the imperial terms."
 tyrone_cr_negotiate_railways_button:0 "Negotiate the Railway Settlement"
 tyrone_cr_negotiate_railways_button_desc:0 "The guarantees behind the railway companies leave the government to reconcile the demands of their investors with the expansion of the Indian network."
 tyrone_cr_negotiate_railways_tt:0 "The overlord will propose a #v railways#! settlement for India’s response."
 tyrone_cr_railways_signed_tt:0 "The #v railways#! settlement has been signed"
 amendment_tyrone_cr_railways_imperial:0 "Imperial Railways Settlement"
 amendment_tyrone_cr_railways_imperial_desc:0 "The guarantees favour established production under an agreement with the imperial government."
 amendment_tyrone_cr_railways_development:0 "Indian Railways Settlement"
 amendment_tyrone_cr_railways_development_desc:0 "The guarantees have been redirected towards the development of the industry in India."
 tyrone_crown_raj.11.t:0 "The Railway Guarantees"
 tyrone_crown_raj.11.d:0 "Railway promoters have placed their claims before the imperial government. The settlement for [SCOPE.sCountry('csr_india').GetName] can favour the operation of guaranteed lines and their investors, or the construction of a larger network."
 tyrone_crown_raj.11.f:0 "The engineer marked the proposed junction. The company’s representative turned the map aside to reach the guarantee beneath it."
 tyrone_crown_raj.11.a:0 "Propose the imperial settlement."
 tyrone_crown_raj.11.b:0 "Support development in India."
 tyrone_crown_raj.21.t:0 "Terms for the Railway Companies"
 tyrone_crown_raj.21.d:0 "The proposed railway settlement protects the operation of the guaranteed companies and rewards investment in the imperial economy. Indian officials must decide whether to accept it or secure terms better suited to extending the network."
 tyrone_crown_raj.21.f:0 "Merchants wanted a quicker journey. The railway company wanted an assurance that someone would pay for it."
 tyrone_crown_raj.21.a:0 "Accept the imperial settlement."
 tyrone_crown_raj.21.b:0 "Meet the concession and secure Indian development."
 tyrone_crown_raj.31.t:0 "Room for New Lines"
 tyrone_crown_raj.31.d:0 "The proposed railway settlement favours the construction of new lines in India. The administration may accept it or concede more to the guaranteed companies in return for a different agreement."
 tyrone_crown_raj.31.f:0 "Merchants wanted a quicker journey. The railway company wanted an assurance that someone would pay for it."
 tyrone_crown_raj.31.a:0 "Accept the development settlement."
 tyrone_crown_raj.31.b:0 "Meet the concession and adopt the imperial terms."
 tyrone_cr_negotiate_plantations_button:0 "Negotiate the Plantation Settlement"
 tyrone_cr_negotiate_plantations_button_desc:0 "Exporters seek larger consignments from the estates. Indian officials face demands for new cultivation and for relief from the conditions imposed upon plantation workers."
 tyrone_cr_negotiate_plantations_tt:0 "The overlord will propose a #v plantations#! settlement for India’s response."
 tyrone_cr_plantations_signed_tt:0 "The #v plantations#! settlement has been signed"
 amendment_tyrone_cr_plantations_imperial:0 "Imperial Plantations Settlement"
 amendment_tyrone_cr_plantations_imperial_desc:0 "The guarantees favour established production under an agreement with the imperial government."
 amendment_tyrone_cr_plantations_development:0 "Indian Plantations Settlement"
 amendment_tyrone_cr_plantations_development_desc:0 "The guarantees have been redirected towards the development of the industry in India."
 tyrone_crown_raj.12.t:0 "The Plantation Contracts"
 tyrone_crown_raj.12.d:0 "The imperial government must settle the terms offered to guaranteed plantations in [SCOPE.sCountry('csr_india').GetName]. Greater output would serve the export establishment; investment in cultivation and working conditions offers a different use of the guarantees."
 tyrone_crown_raj.12.f:0 "The exporter spoke of a shortfall in the next consignment. The district officer’s report concerned the men who had not returned to work."
 tyrone_crown_raj.12.a:0 "Propose the imperial settlement."
 tyrone_crown_raj.12.b:0 "Support development in India."
 tyrone_crown_raj.22.t:0 "The Exporters’ Settlement"
 tyrone_crown_raj.22.d:0 "The imperial proposal favours greater production from the plantations and secures a return for the imperial treasury. The Indian administration can accept it or seek terms that support expansion and reduce the loss of workers."
 tyrone_crown_raj.22.f:0 "The estate could replace a damaged press from its reserves. Replacing the men it had lost was another matter."
 tyrone_crown_raj.22.a:0 "Accept the imperial settlement."
 tyrone_crown_raj.22.b:0 "Meet the concession and secure Indian development."
 tyrone_crown_raj.32.t:0 "Terms for the Plantation Districts"
 tyrone_crown_raj.32.d:0 "The imperial proposal allows more support for plantation construction and the welfare of their workforce. Indian officials may accept it or bear the cost of obtaining terms directed towards export production."
 tyrone_crown_raj.32.f:0 "The estate could replace a damaged press from its reserves. Replacing the men it had lost was another matter."
 tyrone_crown_raj.32.a:0 "Accept the development settlement."
 tyrone_crown_raj.32.b:0 "Meet the concession and adopt the imperial terms."
 tyrone_cr_negotiate_power_button:0 "Negotiate the Electric Power Settlement"
 tyrone_cr_negotiate_power_button_desc:0 "Promoters of electric power seek guarantees for enterprises whose machinery and technical knowledge may still have to come from abroad."
 tyrone_cr_negotiate_power_tt:0 "The overlord will propose a #v electric power#! settlement for India’s response."
 tyrone_cr_power_signed_tt:0 "The #v electric power#! settlement has been signed"
 amendment_tyrone_cr_power_imperial:0 "Imperial Electric Power Settlement"
 amendment_tyrone_cr_power_imperial_desc:0 "The guarantees favour established production under an agreement with the imperial government."
 amendment_tyrone_cr_power_development:0 "Indian Electric Power Settlement"
 amendment_tyrone_cr_power_development_desc:0 "The guarantees have been redirected towards the development of the industry in India."
 tyrone_crown_raj.13.t:0 "Guarantees for Electric Power"
 tyrone_crown_raj.13.d:0 "Plans for electric power in [SCOPE.sCountry('csr_india').GetName] have raised questions about guarantees and technical knowledge. The imperial government can favour the output of the power companies or support the construction and instruction needed for an Indian electrical industry."
 tyrone_crown_raj.13.f:0 "The proposal contained estimates for machinery that few of the assembled officials had seen. The guarantee was expressed in terms they understood well enough."
 tyrone_crown_raj.13.a:0 "Propose the imperial settlement."
 tyrone_crown_raj.13.b:0 "Support development in India."
 tyrone_crown_raj.23.t:0 "The Power Companies’ Agreement"
 tyrone_crown_raj.23.d:0 "The imperial proposal favours the output of guaranteed power companies and technical research in the imperial economy. The Indian government can accept it or secure a settlement that assists construction and the spread of productive knowledge at home."
 tyrone_crown_raj.23.f:0 "The promoters could purchase a machine abroad. They could not guarantee that the men sent to operate it would understand its workings."
 tyrone_crown_raj.23.a:0 "Accept the imperial settlement."
 tyrone_crown_raj.23.b:0 "Meet the concession and secure Indian development."
 tyrone_crown_raj.33.t:0 "An Indian Electrical Industry"
 tyrone_crown_raj.33.d:0 "The imperial proposal supports the construction of power plants and the spread of production technology in India. The administration may accept those terms or pay for an agreement directed towards the output of the guaranteed companies."
 tyrone_crown_raj.33.f:0 "The promoters could purchase a machine abroad. They could not guarantee that the men sent to operate it would understand its workings."
 tyrone_crown_raj.33.a:0 "Accept the development settlement."
 tyrone_crown_raj.33.b:0 "Meet the concession and adopt the imperial terms."
 amendment_tyrone_cr_reformed_civil_service:0 "Reformed Crown Civil Service"
 amendment_tyrone_cr_reformed_civil_service_desc:0 "The settlement of the Company’s surviving privileges has relieved the civil service of part of its inherited burden."
 tyrone_crown_raj.1.t:0 "The Imperial Constabulary"
 tyrone_crown_raj.1.d:0 "The district forces have been brought under a common establishment. The government has issued the orders placing its new constabulary at the service of the Crown."
 tyrone_crown_raj.1.f:0 "The first report praised the quiet in the district. A second, attached beneath it, accounted for the dead."
 tyrone_crown_raj.1.a:0 "Issue the constabulary regulations."
 tyrone_crown_raj.2.t:0 "The Company’s Accounts Closed"
 tyrone_crown_raj.2.d:0 "The six surviving privileges of the Company’s apparatus have been discharged. Crown Civil Service can now administer the country with fewer of the obligations inherited from the directors."
 tyrone_crown_raj.2.f:0 "The last claim was crossed from the register. The office remained open; there were still districts to govern."
 tyrone_crown_raj.2.a:0 "Close the Company’s account."
 tyrone_crown_raj.3.t:0 "The Crown’s Public Duties"
 tyrone_crown_raj.3.d:0 "Abolition and the new labour, school, and relief laws have given the Crown’s government a broader public responsibility. Some of those who once knew it chiefly through the tax collector now have other reasons to seek its offices."
 tyrone_crown_raj.3.f:0 "The notice outside the district office concerned a school. Several men stopped to read it before asking what they would be charged."
 tyrone_crown_raj.3.a:0 "Give the settlement its public assent."
 tyrone_crown_raj.4.t:0 "The Government of India"
 tyrone_crown_raj.4.d:0 "The police, guaranteed industries, civil service, and public institutions have received their settlements. The Crown’s government in India must now answer for the administration it has established."
 tyrone_crown_raj.4.f:0 "The governor received the completed reports with the morning dispatches. Before noon, another district had sent a petition."
 tyrone_crown_raj.4.a:0 "Attend to the government of India."
 tyrone_cr_police_recruitment_cost:0 "Constabulary Recruitment"
 tyrone_cr_police_recruitment_cost_desc:0 "Expanded recruitment has increased the obligations of the public establishment."
 tyrone_cr_police_training_cost:0 "Constabulary Training"
 tyrone_cr_police_training_cost_desc:0 "Military instructors and equipment have been committed to the new constabulary."
 tyrone_cr_police_districts_cost:0 "Police District Reorganization"
 tyrone_cr_police_districts_cost_desc:0 "Officials are reorganizing district jurisdictions and chains of command."
 tyrone_cr_police_surveillance_cost:0 "Intelligence Establishment"
 tyrone_cr_police_surveillance_cost_desc:0 "Maintaining informants has drawn officials into disputes over secrecy and the use of public authority."
 tyrone_cr_dismantle_directorate_cost:0 "Retiring the Directorate"
 tyrone_cr_dismantle_directorate_cost_desc:0 "The administration is settling the directors’ remaining claims upon public office."
 tyrone_cr_dismantle_monopoly_cost:0 "Settling the Manufacturing Monopoly"
 tyrone_cr_dismantle_monopoly_cost_desc:0 "The treasury is discharging guarantees inherited from the manufacturing monopoly."
 tyrone_cr_dismantle_trade_cost:0 "Settling the Trading Houses"
 tyrone_cr_dismantle_trade_cost_desc:0 "A settlement with the Company’s trading houses has disrupted established commercial arrangements."
 tyrone_cr_dismantle_cotton_cost:0 "Discharging Cotton Contracts"
 tyrone_cr_dismantle_cotton_cost_desc:0 "District officials are administering the discharge of the Company’s cotton contracts."
 tyrone_cr_dismantle_patents_cost:0 "Closing the Patent Agreements"
 tyrone_cr_dismantle_patents_cost_desc:0 "Technical agreements are being unwound while workshops seek other sources of instruction."
 tyrone_cr_dismantle_bonded_cost:0 "Withdrawing Labour Guarantees"
 tyrone_cr_dismantle_bonded_cost_desc:0 "Withdrawing the Company’s protection from creditors has weakened the administration’s authority."
 tyrone_cr_manufacturing_concession:0 "Manufacturing Contract Settlement"
 tyrone_cr_manufacturing_concession_desc:0 "The settlement has placed additional claims upon capital available for private investment."
 tyrone_cr_manufacturing_imperial_returns:0 "Imperial Manufacturing Returns"
 tyrone_cr_manufacturing_imperial_returns_desc:0 "The manufacturing settlement has secured favourable commercial terms for the imperial economy."
 tyrone_cr_railways_concession:0 "Railway Administrative Charges"
 tyrone_cr_railways_concession_desc:0 "The administration has assumed additional staffing costs to secure different railway terms."
 tyrone_cr_railways_imperial_returns:0 "Railway Investment Returns"
 tyrone_cr_railways_imperial_returns_desc:0 "Returns secured under the railway guarantees have encouraged capitalist investment."
 tyrone_cr_plantations_concession:0 "Plantation Credit Settlement"
 tyrone_cr_plantations_concession_desc:0 "Estate owners are meeting obligations incurred in revising the plantation guarantees."
 tyrone_cr_plantations_imperial_returns:0 "Plantation Revenue Settlement"
 tyrone_cr_plantations_imperial_returns_desc:0 "The plantation settlement has secured additional revenue for the imperial treasury."
 tyrone_cr_power_concession:0 "Electric Power Concession"
 tyrone_cr_power_concession_desc:0 "The treasury is bearing the concession required to revise the electric-power agreement."
 tyrone_cr_power_imperial_returns:0 "Imperial Electrical Research"
 tyrone_cr_power_imperial_returns_desc:0 "The power agreements have supported productive research in the imperial economy."
 building_group_bg_tyrone_guaranteed_railways_throughput_add:0 "$building_railway$ Throughput"
 building_group_bg_tyrone_guaranteed_railways_throughput_add_desc:0 "A bonus or penalty to throughput for $building_railway$."

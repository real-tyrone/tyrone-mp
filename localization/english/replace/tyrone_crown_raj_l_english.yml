 building_group_bg_power_employee_mult_desc:0 "A bonus or penalty to employment for $building_power_plant$."
 building_group_bg_tyrone_guaranteed_railways_construction_efficiency_add:0 "$building_railway$ Construction Efficiency"
 building_group_bg_tyrone_guaranteed_railways_construction_efficiency_add_desc:0 "A bonus or penalty to construction efficiency for $building_railway$."
 building_group_bg_rubber_construction_efficiency_add:0 "$building_rubber_plantation$ Construction Efficiency"
 building_group_bg_rubber_construction_efficiency_add_desc:0 "A bonus or penalty to construction efficiency for $building_rubber_plantation$."
 building_group_bg_power_construction_efficiency_add:0 "$building_power_plant$ Construction Efficiency"
 building_group_bg_power_construction_efficiency_add_desc:0 "A bonus or penalty to construction efficiency for $building_power_plant$."
 building_group_bg_manufacturing_construction_efficiency_add:0 "$bg_manufacturing$ Construction Efficiency"
 building_group_bg_manufacturing_construction_efficiency_add_desc:0 "A bonus or penalty to construction efficiency for $bg_manufacturing$."

 tyrone_cr_opposition_negotiation_button:0 "Opposition Negotiation"
 tyrone_cr_opposition_negotiation_button_desc:0 "The Crown’s programme has opponents with interests to defend. Some will accept a slower settlement; others expect the treasury or the manufacturers to bear its cost."
 tyrone_cr_utilitarian_support_button:0 "Utilitarian Support"
 tyrone_cr_utilitarian_support_button_desc:0 "Utilitarian campaigners have taken up the proposed law. Their arguments carry beyond the council chamber, where opponents resent the government’s new allies."
 tyrone_cr_force_reform_button:0 "Force Reform"
 tyrone_cr_force_reform_button_desc:0 "The manufacturers’ leader favours the proposed law. With public resistance contained, the administration may press the measure through over its remaining opponents."
 tyrone_cr_reform_at_gunpoint_button:0 "Reform at Gunpoint"
 tyrone_cr_reform_at_gunpoint_button_desc:0 "Utilitarian demands have reached the streets. The Crown’s officers face a choice of reforms to impose, while Indian manufacturers seek a voice in the settlement."
 tyrone_cr_negotiation_ready_tt:0 "Opposition Negotiation is not on its #v three-year#! cooldown."
 tyrone_cr_utilitarian_support_ready_tt:0 "Utilitarian Support is not on its #v three-year#! cooldown."
 tyrone_cr_negotiated_opposition:0 "Negotiated Opposition"
 tyrone_cr_negotiated_opposition_desc:0 "Opponents of the Crown’s reforms have agreed to ease their obstruction in return for concessions."
 tyrone_cr_negotiated_delays:0 "A Deliberate Settlement"
 tyrone_cr_negotiated_delays_desc:0 "The administration has promised its opponents more time to contest each new measure."
 tyrone_cr_negotiated_revenue:0 "Treasury Concessions"
 tyrone_cr_negotiated_revenue_desc:0 "A settlement with the opposition has placed a continuing charge upon public revenues."
 tyrone_cr_alienated_industrialists:0 "Manufacturers Overruled"
 tyrone_cr_alienated_industrialists_desc:0 "The government has secured a political agreement at the expense of the manufacturers’ interests."
 tyrone_cr_utilitarian_enactment_support:0 "Utilitarian Advocacy"
 tyrone_cr_utilitarian_enactment_support_desc:0 "Utilitarian campaigners are lending their influence to the law now before the government."
 tyrone_cr_utilitarian_opposition:0 "An Unwelcome Alliance"
 tyrone_cr_utilitarian_opposition_desc:0 "Opposition leaders resent the administration’s reliance on utilitarian campaigners."
 tyrone_crown_raj.40.t:0 "Terms of Accommodation"
 tyrone_crown_raj.40.d:0 "Opponents of reform in [SCOPE.sCountry('csr_india').GetName] are willing to negotiate. They demand assurances about the pace of legislation, the use of public revenue, or the privileges of the manufacturers."
 tyrone_crown_raj.40.f:0 "The delegates leave a draft agreement on the table. Its supporters have withheld their signatures until the government decides whose interests it is prepared to concede."
 tyrone_crown_raj.40.a:0 "Give each measure a fuller hearing."
 tyrone_crown_raj.40.b:0 "Let the treasury bear the settlement."
 tyrone_crown_raj.40.c:0 "The manufacturers must yield."
 tyrone_crown_raj.41.t:0 "Reform under Guard"
 tyrone_crown_raj.41.d:0 "Utilitarian agitation in [SCOPE.sCountry('csr_india').GetName] has outgrown the council chamber. Officials seek a measure they can impose before the unrest spreads, while the manufacturers press for a settlement of their own."
 tyrone_crown_raj.41.f:0 "Outside the meeting room, soldiers keep the passage clear. Inside, the proposed measures lie beside a list of men willing to carry them out."
 tyrone_crown_raj.41.a:0 "Establish [GetLawType('law_chartered_imperial_public_schools').GetName]."
 tyrone_crown_raj.41.b:0 "Issue [GetLawType('law_chartered_wage_subsidies').GetName]."
 tyrone_crown_raj.41.c:0 "Impose [GetLawType('law_india_imperial_labour_protections').GetName]."
 tyrone_crown_raj.41.slavery:0 "End slavery."
 tyrone_crown_raj.41.e:0 "Bring the manufacturers into the utilitarian camp."

l_english:
 je_india_railway:0 "Purveyor of Progress"
 je_india_railway_reason:0 "The distances of #variable India#! have long been measured in the time taken by a caravan, a river boat, or a dispatch rider. A railway system promises to alter that geography. The ports of the presidencies could be joined to inland markets, provincial towns drawn into a wider commercial life, and government carried beyond the reach of its existing roads.\n\nSuch a network cannot be assembled from disconnected concessions. The great lines require continuous territory under Indian administration, towns capable of supporting their stations and workshops, and a sufficient foundation of local railways. Surveys must then determine the course of each trunk line before the work of construction can proceed.\n\nBritain and India may share responsibility for these undertakings, but the lasting transformation will be written upon the districts they connect. From #variable Calcutta#! to #variable Delhi#!, and across the western and southern presidencies, each completed corridor will bind distant markets more closely together. #bold Prepare, survey, and construct the four great Indian railway lines.#!"
 je_india_railway_status:0 "Develop the four main lines through preparation, survey, and construction."
 je_india_railway_goal:0 "Has built the [GetGeographicRegion('geographic_region_delhi_calcutta_line').GetName], [GetGeographicRegion('geographic_region_allahabad_bombay_line').GetName], [GetGeographicRegion('geographic_region_bombay_madras_line').GetName], and [GetGeographicRegion('geographic_region_gujarat_bombay_line').GetName]."
 tyrone_indian_railways_heading:0 "Great Railway Lines"
 tyrone_railways_main_progress:0 "Completed main lines"
 state_trait_tyrone_great_indian_railways:0 "Great Indian Railways"
 state_trait_tyrone_great_indian_railways_desc:0 "A completed trunk railway links this region to India’s great commercial and administrative centers."
 tyrone_railways_construction_bar_desc:0 "Construction"
 tyrone_railways_survey_available_tt:0 "This railway survey has not already been commissioned"
 tyrone_railways_monthly_base:0 "Base construction"
 tyrone_railways_monthly_gdp:0 "Indian GDP / £100 million"
 tyrone_railways_monthly_railways:0 "Indian railway levels along this line / 20"
 tyrone_railways_monthly_landowners:0 "Approval of Indian Landowners / 10"
 tyrone_railways_monthly_industrialists:0 "Approval of Indian Industrialists / 10"
 je_tyrone_railway_delhi_calcutta_preparation:0 "Preparing the [GetGeographicRegion('geographic_region_delhi_calcutta_line').GetName]"
 je_tyrone_railway_delhi_calcutta_preparation_reason:0 "A trunk railway through #variable the Gangetic plain between Calcutta and Delhi#! would join Calcutta’s river port and the old imperial center at Delhi in a single commercial corridor. Yet a line of this importance cannot depend upon scattered permissions and provincial boundaries that divide responsibility for its stations, labor, and approaches.\n\nThe districts along the proposed route must first be brought under direct Indian administration. Each must also possess the railway capacity and urban economy needed to support the larger undertaking. Tracks without workshops, warehouses, and established towns would leave the new line an isolated promise.\n\nThe necessary foundations lie in #variable West Bengal, Bihar, Awadh, Agra and Delhi#!. Once those provinces are ready, Britain or India can commission the formal survey. #bold Consolidate the route and develop its railways and urban centers.#!"
 je_tyrone_railway_delhi_calcutta_preparation_status:0 ""
 tyrone_railway_delhi_calcutta_preparation_row:0 "[GetGeographicRegion('geographic_region_delhi_calcutta_line').GetName]: Preparation"
 tyrone_railway_delhi_calcutta_preparation_completed:0 "The #variable Delhi–Calcutta#! survey Journal Entry will become available to Britain and India."
 je_tyrone_railway_delhi_calcutta_survey:0 "Surveying the [GetGeographicRegion('geographic_region_delhi_calcutta_line').GetName]"
 je_tyrone_railway_delhi_calcutta_survey_reason:0 "The foundations of the #variable Delhi–Calcutta#! line are in place. Before the first contracts for the trunk route can be settled, however, surveyors must translate the intended connection into gradients, river crossings, station sites, and a defensible estimate of the work ahead.\n\nThe administration that undertakes this task must divert clerks, engineers, and public resources from its ordinary business. Britain and India may each accept that responsibility, but there is only one survey to commission. Once either government has acted, the other cannot begin a second undertaking for the same route.\n\nThe work will occupy the responsible government for a full year. Only when the survey has been commissioned and its administrative burden has ended can the construction program begin. #bold Commission the survey and allow its work to conclude.#!"
 je_tyrone_railway_delhi_calcutta_survey_status:0 ""
 tyrone_railway_delhi_calcutta_survey_row:0 "[GetGeographicRegion('geographic_region_delhi_calcutta_line').GetName]: Survey"
 tyrone_railway_delhi_calcutta_survey_button:0 "Survey the Delhi–Calcutta Railway"
 tyrone_railway_delhi_calcutta_survey_button_desc:0 "Commission the shared #variable Delhi–Calcutta#! survey. Only the initiating country receives #variable −2,500 Bureaucracy#!, #variable −20% Research Speed#!, and #variable −10% Minting#! for #variable one year#!. Britain and India share the same one-use action."
 tyrone_railway_delhi_calcutta_survey_started_tt:0 "Britain or India has commissioned the #variable Delhi–Calcutta#! survey"
 tyrone_railway_delhi_calcutta_survey_cost:0 "Surveying the Delhi–Calcutta Railway"
 tyrone_railway_delhi_calcutta_survey_cost_desc:0 "Surveyors, engineers, and administrative departments are committed to laying out an Indian trunk railway."
 tyrone_railway_delhi_calcutta_survey_completed:0 "Construction of the #variable Delhi–Calcutta#! Railway will begin."
 je_tyrone_railway_delhi_calcutta_construction:0 "Building the [GetGeographicRegion('geographic_region_delhi_calcutta_line').GetName]"
 je_tyrone_railway_delhi_calcutta_construction_reason:0 "The survey of the #variable Delhi–Calcutta#! Railway is complete. What existed as a connection upon a map must now become a continuous undertaking of embankments, bridges, permanent way, and working stations. The scale of the task will test the resources available to India’s economy.\n\nExisting railways along the route provide materials, skilled labor, and practical experience. A growing economy can sustain more ambitious works, while the cooperation of the #variable Landowners#! and #variable Industrialists#! can ease the political obstacles to construction. Their hostility can just as readily retard it.\n\nAs the work advances, the towns and districts along the line will be drawn into a common network. Completion will leave a lasting advantage in each of the regions it traverses. #bold Carry construction to completion and establish the Great Indian Railways along this corridor.#!"
 je_tyrone_railway_delhi_calcutta_construction_status:0 ""
 tyrone_railway_delhi_calcutta_construction_row:0 "[GetGeographicRegion('geographic_region_delhi_calcutta_line').GetName]: Construction"
 tyrone_railway_delhi_calcutta_bar_name:0 "Delhi–Calcutta Railway"
 tyrone_railway_delhi_calcutta_construction_completed:0 "The regions of #variable West Bengal, Bihar, Awadh, Agra and Delhi#! will gain #variable Great Indian Railways#!: #variable +0.1#! Standard of Living, #variable +5 percentage points#! Market Access Price Impact, and #variable −10%#! effects of Turmoil. Regions that already have the trait do not receive another copy."

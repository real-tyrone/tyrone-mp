 tyrone_railways_indian_network:0 "The Great Indian Railway Network"
 tyrone_railways_indian_network_desc:0 "A completed network of trunk railways supports construction, expands commerce, and strengthens India’s position in international trade."
 tyrone_railways_imperial_network:0 "Purveyor of Progress"
 tyrone_railways_imperial_network_desc:0 "The completion of India’s great railways has strengthened imperial commerce and the prestige of the government behind it."
 tyrone_indian_railways.1.t:0 "An India Joined by Rail"
 tyrone_indian_railways.1.d:0 "The four great railway lines of [ROOT.GetCountry.GetName] are complete. Ports, provincial towns, and inland markets now form a connected network, giving new substance to the promises of prosperity that accompanied the first surveys."
 tyrone_indian_railways.1.f:0 "A whistle sounds beneath the station roof. Beyond the waiting crowd lie miles of rail: across the plain, through the Deccan, and down to the sea. Places once separated by weeks of travel have become destinations upon a timetable."
 tyrone_indian_railways.1.a:0 "Let the rails carry a new prosperity."
 tyrone_indian_railways.2.t:0 "The Fruits of Progress"
 tyrone_indian_railways.2.d:0 "The great railway program in [SCOPE.sCountry('tyrone_railways_india').GetName] has reached completion. The new lines promise a wider field for commerce, while their inauguration is celebrated at home as a triumph of enterprise and administration."
 tyrone_indian_railways.2.f:0 "Reports of the final connections arrive with the morning dispatches. On a map in the minister’s office, the separate marks of ports and cities are joined by a continuous web of lines. A clerk exchanges an old estimate for a printed timetable."
 tyrone_indian_railways.2.a:0 "A triumph of enterprise."

 tyrone_indian_railways.3.t:0 "Rails Across India"
 tyrone_indian_railways.3.d:0 "#v [SCOPE.sCountry('tyrone_railways_india').GetName]#! has taken up proposals for a network of trunk railways. Merchants hope to reach inland markets more cheaply, while officials see faster transport for troops and dispatches. The projected routes must now be made into a working network."
 tyrone_indian_railways.3.f:0 "A proposed line crosses a river where no bridge stands. Beside the route, an engineer has pencilled the likely cost; a second hand has added a question about the fields through which it must pass."
 tyrone_indian_railways.3.a:0 "Set the undertaking in motion."

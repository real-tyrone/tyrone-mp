l_english:
 EIB:0 "East Indian Bombay Administration"
 EIB_ADJ:0 "Bombay Administrative"
 EIM:0 "East Indian Madras Administration"
 EIM_ADJ:0 "Madras Administrative"
 india_administration_events.1.t:0 "The Presidency Administrations"
 india_administration_events.1.d:0 "The East India Company's territories have grown too vast for a single council in Bengal to govern efficiently. Bombay and Madras will now administer their own presidencies under Company supervision, while the central administration retains authority over the wider Indian settlement."
 india_administration_events.1.f:0 ""Three ledgers were placed on the table: one for Bengal, one for Bombay, and one for Madras. The ink was still wet, but the borders were already being treated as fact.""
 india_administration_events.1.a:0 "Divide the Company's burden."
 india_administration_events.1.split_tt:0 "Divide the territories of the #v East India Company#! into #v 3 Administrations#!. They may be peacefully integrated once the #v [GetTechnology('pan-nationalism').GetName]#! technology has been researched."
 india_administration_events.2.t:0 "A Burmese Protectorate"
 india_administration_events.2.d:0 "The court at Ava has signaled a willingness to accept Company protection in exchange for guarantees along the eastern frontier. Such an agreement would bring Burma into our diplomatic order without the expense of a campaign."
 india_administration_events.2.f:0 ""The dispatch was formal, careful, and written in the language of obligation. Its meaning was simpler: the frontier could be settled with ink instead of powder.""
 india_administration_events.2.a:0 "Extend Company protection."
 india_administration_events.3.t:0 "The Punjab Settlement"
 india_administration_events.3.d:0 "Punjab stands at the gate of the northwestern frontier. A protectorate agreement would secure the Company's approach to the passes and place the Khalsa Raj within our wider Indian settlement."
 india_administration_events.3.f:0 ""The envoys spoke of friendship, guarantees, and mutual order. Everyone in the room understood that maps would be redrawn by treaty.""
 india_administration_events.3.a:0 "Formalize the protectorate."
 india_administration_events.4.t:0 "The Western Frontier"
 india_administration_events.4.d:0 "Kalat and Sindh can be drawn into a single frontier arrangement, giving the Company a clearer hand in Baluchistan and its approaches. Makran's dependency on Kalat may also be folded into the settlement."
 india_administration_events.4.f:0 ""The western marches were never governed by one road or one ledger. The proposal before the council was to make them answer to both.""
 india_administration_events.4.a:0 "Settle the western frontier."
 india_administration_events.5.t:0 "An Ultimatum from Calcutta"
 india_administration_events.5.d:0 "The East India Company has demanded that Burma accept Company protection and submit its foreign affairs to Bengal. Refusal will almost certainly bring the frontier to war."
 india_administration_events.5.f:0 ""The letter was written in formal courtesies, but no one mistook its purpose. The seal at the bottom was heavier than the words above it.""
 india_administration_events.5.a:0 "Accept Company protection."
 india_administration_events.5.b:0 "Reject the demand."
 india_administration_events.6.t:0 "Burma Rejects the Ultimatum"
 india_administration_events.6.d:0 "Burma has refused to accept Company protection. The eastern frontier can now be forced into order through a protectorate war."
 india_administration_events.6.f:0 ""The reply was short, proud, and entirely unsatisfactory. The council had asked for submission; it received defiance.""
 india_administration_events.6.a:0 "Begin the protectorate play."
 india_administration_events.7.t:0 "An Ultimatum from Calcutta"
 india_administration_events.7.d:0 "The East India Company has demanded that Punjab accept Company protection and settle the northwestern frontier under Bengal's authority. Refusal will place the Khalsa Raj in open confrontation with the Company."
 india_administration_events.7.f:0 ""The envoys did not raise their voices. They did not need to. The ultimatum had already done the shouting for them.""
 india_administration_events.7.a:0 "Accept Company protection."
 india_administration_events.7.b:0 "Reject the demand."
 india_administration_events.8.t:0 "Punjab Rejects the Ultimatum"
 india_administration_events.8.d:0 "Punjab has refused to accept Company protection. The northwestern frontier can now be settled by a protectorate war."
 india_administration_events.8.f:0 ""The Company's clerks filed the rejection beside the frontier maps. By morning, those maps would be read as war plans.""
 india_administration_events.8.a:0 "Begin the protectorate play."
 india_administration_events.9.t:0 "An Ultimatum from Calcutta"
 india_administration_events.9.d:0 "The East India Company has demanded that Kalat accept a frontier settlement under Company protection. Refusal will invite direct coercion in Baluchistan and its approaches."
 india_administration_events.9.f:0 ""Kalat's court had long balanced the western marches by custom and caution. The Company's demand left little room for either.""
 india_administration_events.9.a:0 "Accept Company protection."
 india_administration_events.9.b:0 "Reject the demand."
 india_administration_events.10.t:0 "Kalat Rejects the Ultimatum"
 india_administration_events.10.d:0 "Kalat has refused the Company's frontier settlement. Bengal may now force the issue through a protectorate war, including the question of Makran's dependency if necessary."
 india_administration_events.10.f:0 ""The western answer arrived with all the ceremony of diplomacy and none of its compliance.""
 india_administration_events.10.a:0 "Begin the protectorate play."
 india_administration_events.11.t:0 "An Ultimatum from Calcutta"
 india_administration_events.11.d:0 "The East India Company has demanded that Sindh accept Company protection and submit the lower Indus frontier to Bengal's authority. Refusal will invite direct coercion."
 india_administration_events.11.f:0 ""The river carried merchants, dispatches, and now an ultimatum. The Company expected all three to arrive without obstruction.""
 india_administration_events.11.a:0 "Accept Company protection."
 india_administration_events.11.b:0 "Reject the demand."
 india_administration_events.12.t:0 "Sindh Rejects the Ultimatum"
 india_administration_events.12.d:0 "Sindh has refused to accept Company protection. The lower Indus frontier can now be forced into order through a protectorate war."
 india_administration_events.12.f:0 ""The reply from Sindh did not offer compromise. It offered the Company a frontier problem with only one answer left.""
 india_administration_events.12.a:0 "Begin the protectorate play."
 india_administration_events.13.t:0 "Industrial State of India"
 india_administration_events.13.d:0 "The industrial condition of [SCOPE.sCountry('east_india_company_scope').GetName] remains defined by revenue extraction, scattered workshops, and export priorities set beneath the shadow of [SCOPE.sCountry('british_scope').GetName]. Even where [GetGoods('iron').GetName], [GetGoods('clothes').GetName], and cotton [GetGoods('fabric').GetName] are abundant, the institutions of Company rule make sustained [concept_construction], modern [Concept('concept_building', '$concept_buildings$')], and domestic [concept_technology] difficult to organize."
 india_administration_events.13.f:0 ""Every report promised potential. Every ledger answered with freight charges, advances, arrears, and permissions still waiting for a seal.""
 india_administration_events.13.a:0 "The Company must work within its limits."
 india_administration_events.14.t:0 "Textile Charter Request"
 india_administration_events.14.d:0 "The East India Company has requested permission to organize a protected charter for Indian textile mills. Granting the charter would let #gold Indian Capital#! expand a sector that British manufacturers still consider politically sensitive."
 india_administration_events.14.f:0 ""The request was written as a question of efficiency. Manchester read it as a question of competition.""
 india_administration_events.14.a:0 "Approve the textile charter."
 india_administration_events.14.b:0 "Deny the request."
 india_administration_events.15.t:0 "Furniture Charter Request"
 india_administration_events.15.d:0 "The East India Company has requested permission to charter Indian furniture manufactories. Approval would give local capital a formal channel into manufactured consumer goods."
 india_administration_events.15.f:0 ""The dispatch spoke of timber, workshops, and urban demand. The margin notes spoke of precedent.""
 india_administration_events.15.a:0 "Approve the furniture charter."
 india_administration_events.15.b:0 "Deny the request."
 india_administration_events.16.t:0 "Glassworks Charter Request"
 india_administration_events.16.d:0 "The East India Company has requested permission to charter Indian glassworks. Approval would support a fragile but useful branch of domestic industry under imperial supervision."
 india_administration_events.16.f:0 ""A small industry, the clerks insisted, but one that would teach larger habits.""
 india_administration_events.16.a:0 "Approve the glassworks charter."
 india_administration_events.16.b:0 "Deny the request."
 india_administration_events.17.t:0 "Paper Mills Charter Request"
 india_administration_events.17.d:0 "The East India Company has requested permission to charter Indian paper mills. Approval would strengthen administrative supply, printing, and education, but it would also reduce dependence on British manufactures."
 india_administration_events.17.f:0 ""No empire fears paper in the abstract. It fears what paper makes possible.""
 india_administration_events.17.a:0 "Approve the paper mills charter."
 india_administration_events.17.b:0 "Deny the request."
 india_administration_events.18.t:0 "Steel Charter Request"
 india_administration_events.18.d:0 "The East India Company has requested permission to charter Indian steel mills. Approval would open a heavy industrial path that could later sustain railways, arms, and machinery beyond routine colonial supply chains."
 india_administration_events.18.f:0 ""The figures were modest. The implications were not.""
 india_administration_events.18.a:0 "Approve the steel charter."
 india_administration_events.18.b:0 "Deny the request."
 india_administration_events.19.t:0 "Tooling Charter Request"
 india_administration_events.19.d:0 "The East India Company has requested permission to charter Indian tooling workshops. Approval would encourage the local production of machinery components and technical equipment."
 india_administration_events.19.f:0 ""A workshop that makes tools eventually asks what else it may make.""
 india_administration_events.19.a:0 "Approve the tooling charter."
 india_administration_events.19.b:0 "Deny the request."
 india_administration_events.20.t:0 "Chemical Charter Request"
 india_administration_events.20.d:0 "The East India Company has requested permission to charter Indian chemical plants. Approval would support modern inputs for industry, agriculture, and medicine."
 india_administration_events.20.f:0 ""The proposal smelled of coal tar, dyes, medicines, and a future not yet approved.""
 india_administration_events.20.a:0 "Approve the chemical charter."
 india_administration_events.20.b:0 "Deny the request."
 india_administration_events.21.t:0 "Motor Industries Charter Request"
 india_administration_events.21.d:0 "The East India Company has requested permission to charter Indian motor industries. Approval would give #gold Indian Capital#! a foothold in advanced manufacturing and mechanical assembly."
 india_administration_events.21.f:0 ""The request arrived early, almost presumptuous, but every industrial empire begins by asking for a workshop it does not yet possess.""
 india_administration_events.21.a:0 "Approve the motor industries charter."
 india_administration_events.21.b:0 "Deny the request."
 india_administration_bureaucratic_transition:0 "Presidency Transition Offices"
 je_consolidate_the_subcontinent:0 "Consolidate the Subcontinent"
 je_consolidate_the_subcontinent_reason:0 "The Company's writ is uneven across the subcontinent. Before deeper reforms can be attempted, its territorial claims, princely dependencies, and regional administrations must be brought into a coherent settlement."
 je_eastern_frontier_commission:0 "The Eastern Frontier Commission"
 je_eastern_frontier_commission_reason:0 "With [GetTechnology('quinine').GetName] in regular use, the Company's surveyors and administrators can push beyond the old malarial limits of the eastern frontier. Mandalay, Arakan, and Assam must be brought into a coherent settlement before Burma can be governed as more than a line on a map."
 je_eastern_frontier_commission_status_low:0 "[GetCulture('burmese').GetName] Acceptance: #variable [JournalEntry.GetCountry.MakeScope.Var('burmese_friendship_var').GetValue|v0]#!/3"
 je_eastern_frontier_commission_status_annex:0 "[GetCulture('burmese').GetName] Acceptance: #variable [JournalEntry.GetCountry.MakeScope.Var('burmese_friendship_var').GetValue|v0]#!/3. #p Burmese subjects will be annexed.#!"
 je_eastern_frontier_commission_status_full:0 "[GetCulture('burmese').GetName] Acceptance: #variable [JournalEntry.GetCountry.MakeScope.Var('burmese_friendship_var').GetValue|v0]#!/3. #p Annexation and incorporation secured.#!"
 je_consolidate_the_subcontinent_gbr:0 "Consolidate the Subcontinent"
 je_consolidate_the_subcontinent_gbr_reason:0 "The Company's writ is uneven across the subcontinent. Before deeper reforms can be attempted, its territorial claims, princely dependencies, and regional administrations must be brought into a coherent settlement."
 je_company_rule:0 "Company Rule"
 je_company_rule_reason:0 "The East India Company governs through ledgers, charters, presidencies, and private obligations to the Crown. Its rule must be stabilized before India can be remade into a durable political order."
 je_company_rule_status_desc:0 "Imperial Legitimacy: #variable [JournalEntry.GetCountry.MakeScope.Var('india_colonial_legitimacy_var').GetValue|v0]#!/100\n#gold Indian Capital#!: #gold [JournalEntry.GetCountry.MakeScope.Var('india_indian_capital_var').GetValue|v0]#!/100\nCharter Capital: #variable [JournalEntry.GetCountry.MakeScope.Var('india_charter_authority_var').GetValue|v0]#!"
 je_company_rule_gbr:0 "Company Rule"
 je_company_rule_gbr_reason:0 "The East India Company's industrial settlement will shape the future of British power in Asia. London may guide, restrain, or bargain with the Company as India develops under imperial supervision."
 law_chartered_hereditary_bureaucrats:0 "Presidency Patronage"
 law_chartered_hereditary_bureaucrats_desc:0 "Local hereditary offices and established elites remain tied to Company administration through chartered obligations, revenue duties, and provincial patronage."
 law_chartered_appointed_bureaucrats:0 "Company Appointed Bureaucrats"
 law_chartered_appointed_bureaucrats_desc:0 "The Company's civil service appoints officials through centralized channels, binding provincial administration to Calcutta and imperial oversight."
 law_chartered_elected_bureaucrats:0 "Chartered Municipal Bureaucrats"
 law_chartered_elected_bureaucrats_desc:0 "Limited municipal representation is permitted inside a chartered administrative framework, allowing local offices to answer to both elected interests and Company supervision."
 law_chartered_no_schools:0 "Informal Company Schooling"
 law_chartered_no_schools_desc:0 "Education remains a private family and community matter, with the Company offering little beyond scattered missionary, commercial, and clerical instruction."
 law_chartered_religious_schools:0 "Missionary School Grants"
 law_chartered_religious_schools_desc:0 "Religious and missionary institutions receive official permission to expand schooling under Company supervision, binding education to moral instruction and imperial patronage."
 law_chartered_orientalist_schools:0 "Orientalist School Boards"
 law_chartered_orientalist_schools_desc:0 "Company officers attempt to order Indian religious education through translated codes, select patrons, and official boards whose confidence often exceeds their understanding."
 law_chartered_private_schools:0 "Chartered Private Schools"
 law_chartered_private_schools_desc:0 "Private associations, urban patrons, and commercial interests are permitted to operate schools through Company charters and provincial oversight."
 law_chartered_public_schools:0 "Company Public Instruction"
 law_chartered_public_schools_desc:0 "The Company accepts a formal responsibility for public instruction, standardizing schools through administrative channels while keeping them tied to imperial priorities."
 law_chartered_imperial_public_schools:0 "Imperial Public Instruction"
 law_chartered_imperial_public_schools_desc:0 "Britain underwrites a broader system of public instruction in India, expanding schools through costly inspections, grants, and imperial administrative standards."
 law_chartered_no_social_security:0 "Malthusian Abstention"
 law_chartered_no_social_security_desc:0 "Company policy treats poverty as a question for private charity, family discipline, and the corrective pressure of necessity rather than formal public relief."
 law_chartered_poor_laws:0 "Presidency Poor Law"
 law_chartered_poor_laws_desc:0 "Relief is filtered through district registers, work requirements, and local supervision, offering aid only where dependency can be counted and disciplined."
 law_chartered_caste_relief_rolls:0 "Caste Relief Rolls"
 law_chartered_caste_relief_rolls_desc:0 "Poor relief is recorded through district caste registers, village headmen, and recognized intermediaries, making aid easier to administer while preserving the social order that sorts who receives it."
 law_chartered_wage_subsidies:0 "Famine Labour Codes"
 law_chartered_wage_subsidies_desc:0 "Wage relief is organized through public works, famine codes, and regulated labour schemes, providing subsistence while preserving the principle that relief must be earned."
 law_chartered_caste_labour_boards:0 "Caste Labour Boards"
 law_chartered_caste_labour_boards_desc:0 "Public works and relief wages are assigned through codified caste rolls and district labour boards, allowing the Company to mobilize labour during crisis without abandoning social hierarchy."
 law_chartered_old_age_pension:0 "Imperial Provident Funds"
 law_chartered_old_age_pension_desc:0 "Pensions and dependent relief are routed through formal funds, registers, and Company offices, turning welfare into a managed obligation of imperial administration."
 law_chartered_no_health_system:0 "Sanitary Abstention"
 law_chartered_no_health_system_desc:0 "The Company leaves public health to households, charities, and local custom, intervening only when disease threatens revenue or order."
 law_chartered_charitable_health_system:0 "Mission Hospital Grants"
 law_chartered_charitable_health_system_desc:0 "Mission hospitals, charitable wards, and local benefactors receive Company sanction to provide limited care under official supervision."
 law_chartered_private_health_insurance:0 "Presidency Medical Insurance"
 law_chartered_private_health_insurance_desc:0 "Urban employers, clerks, and commercial associations organize medical coverage through presidency regulations and chartered private funds."
 law_chartered_public_health_insurance:0 "Imperial Public Health Service"
 law_chartered_public_health_insurance_desc:0 "The Company formalizes a public health service of hospitals, sanitary boards, and medical officers, extending care through imperial administration."

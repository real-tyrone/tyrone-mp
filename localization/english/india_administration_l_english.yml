 india_company_rule_admin_bar:0 "Admin Capacity"
 india_company_rule_admin_tt:0 "Tracks the Company's ability to govern, audit, record, and standardize Indian institutions.\n\n#title Monthly Change: [GetPlayer.MakeScope.ScriptValue('india_company_rule_admin_capacity_monthly_growth')|+=2]#!#indent_newline:3 \n- Base administrative continuity: #v +1.00#!\n- Excess [concept_bureaucracy] ratio, up to #v +10.00#!: [GetPlayer.MakeScope.ScriptValue('india_company_rule_admin_capacity_bureaucracy_surplus_growth')|+=2]\n- Negative [concept_bureaucracy] ratio, up to #v -10.00#!: [GetPlayer.MakeScope.ScriptValue('india_company_rule_admin_capacity_bureaucracy_deficit_growth')|+=2]#!"
 india_company_rule_threshold_low_tt:0 "Early threshold: low-level reforms and limited bargaining space."
 india_company_rule_threshold_mid_tt:0 "Middle threshold: stronger reform packages and larger imperial negotiations."
 india_company_rule_threshold_high_tt:0 "High threshold: deep industrialization and major autonomy choices."
 india_company_rule_imperial_approval:0 "Imperial Approval"
 india_company_rule_imperial_approval_tt:0 "Measures how willing Britain is to tolerate Indian requests, subsidies, and political concessions."
 india_company_rule_indian_capital:0 "#gold Indian Capital#!"
 india_company_rule_indian_capital_tt:0 "#gold Indian Capital#! measures the strength of Indian private finance and its ability to support domestic industry.\n\n#title Monthly Change: [GetPlayer.MakeScope.ScriptValue('india_company_rule_indian_capital_monthly_growth')|+=2]#!#indent_newline:3 \n- GDP balance between #v India#! and #v Britain#!: [GetPlayer.MakeScope.ScriptValue('india_company_rule_gdp_capital_growth')|+=2]\n- Positive or negative net income: [GetPlayer.MakeScope.ScriptValue('india_company_rule_net_income_capital_growth')|+=2]\n- Investment Pool income divided by @money!#v 500K#!: [GetPlayer.MakeScope.ScriptValue('india_company_rule_investment_pool_capital_growth')|+=2]\n- Indian-owned manufacturing levels divided by #v 250#! ([GetPlayer.MakeScope.ScriptValue('india_company_rule_indian_owned_manufacturing_levels')|v0] levels): [GetPlayer.MakeScope.ScriptValue('india_company_rule_indian_owned_manufacturing_capital_growth')|+=2]\n- Prosperous Indian companies: [GetPlayer.MakeScope.ScriptValue('india_company_rule_prosperous_company_capital_growth')|+=2]\n- British-owned manufacturing levels in India divided by #v 750#! ([GetPlayer.MakeScope.ScriptValue('india_company_rule_british_owned_indian_manufacturing_levels')|v0] levels): [GetPlayer.MakeScope.ScriptValue('india_company_rule_british_owned_manufacturing_capital_growth')|+=2]#!"
 india_company_rule_colonial_legitimacy:0 "Colonial Legitimacy"
 india_company_rule_colonial_legitimacy_tt:0 "#v Colonial Legitimacy#! measures how effectively Britain can justify, supervise, and accelerate Company reforms in India.\n\n#title Monthly Change: [GetPlayer.MakeScope.ScriptValue('india_company_rule_colonial_legitimacy_monthly_growth')|+=2]#!#indent_newline:3 \n- Standard of Living divided by #v 10#!: [GetPlayer.MakeScope.ScriptValue('india_company_rule_colonial_legitimacy_sol_growth')|+=2]\n- Radical fraction: [GetPlayer.MakeScope.ScriptValue('india_company_rule_colonial_legitimacy_radical_growth')|+=2]\n- Loyalist fraction: [GetPlayer.MakeScope.ScriptValue('india_company_rule_colonial_legitimacy_loyalist_growth')|+=2]\n- British investment levels: #v 0.00#!#!"
 india_company_rule_colonial_legitimacy_monthly_tt:0 "#v Colonial Legitimacy#! is generated each month from Indian living standards, loyalist support, and radical opposition. Later British investment levels can be added to this formula."

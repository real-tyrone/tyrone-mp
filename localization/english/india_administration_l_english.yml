 india_administration_events.22.t:0 "The Commission's Final Act"
 india_administration_events.22.d:0 "Formally announcing the success of its eastern mission, the Frontier Commission has recommended that Burma be governed through ordinary Company channels. With only #variable [ROOT.GetCountry.MakeScope.Var('burmese_friendship_var').GetValue|v0]#!/3 [GetCulture('burmese').GetName] Acceptance, however, its final act will remain administrative rather than integrative."
 india_administration_events.22.d_annex:0 "Formally announcing the success of its eastern mission, the Frontier Commission has recommended that the remaining Burmese dependencies be folded into the Company's ordinary administration."
 india_administration_events.22.d_full:0 "Formally announcing the success of its eastern mission, the Frontier Commission has recommended that the remaining Burmese dependencies be folded into the Company's ordinary administration."
 india_administration_events.22.f:0 "#b Frontier Memorandum, sealed at Calcutta#!\nThe survey lines have been checked against the revenue maps. The hill roads are passable. The local courts have begun to answer petitions in regular order. What was once treated as a fevered margin can now be written into the ledgers of government."
 india_administration_events.22.a:0 "This frontier is now part of India."
 india_administration_events.23.t:0 "Seeds of the Eastern Valleys"
 india_administration_events.23.d:0 "Recent reports from Company agronomists and medical officers have prompted proposals to open new acreage across the eastern frontier."
 india_administration_events.23.f:0 "#b Field Note, No. 41#!\nThe soil is less the obstacle than the water, and the water less the obstacle than the fever. With quinine issued regularly and drainage parties kept under discipline, the old maps begin to look less like warnings and more like invitations."
 india_administration_events.23.a:0 "Reclaim fields around [GetStateRegion('STATE_MANDALAY').GetName]."
 india_administration_events.23.b:0 "Open the lowlands of [GetStateRegion('STATE_ARAKAN').GetName]."
 india_administration_events.23.c:0 "Extend cultivation in [GetStateRegion('STATE_ASSAM').GetName]."
 india_administration_events.24.t:0 "Burma Proper, Company Law"
 india_administration_events.24.d:0 "In an atmosphere of some controversy, the Company has issued new instructions on the legal status of [GetCulture('burmese').GetName] communities under its eastern administration."
 india_administration_events.24.f:0 "The petitioners came with lacquer boxes, folded cloth, and three copies of the same complaint. The clerk expected confusion. Instead, he found precedent, witnesses, and a very clear idea of justice."
 india_administration_events.24.a:0 "This land is large enough for both."
 india_administration_events.25.t:0 "The Eastern Stations"
 india_administration_events.25.d:0 "The Frontier Commission has proposed a chain of state-sponsored colonies, survey offices, and medical depots along the Company's eastern approaches."
 india_administration_events.25.f:0 "The first huts were not impressive. Mud walls, bamboo frames, a flagpole, and a locked chest of quinine tablets. But the map in the surveyor's hand already imagined roads, depots, courts, and fields where the forest still pressed close."
 india_administration_events.25.a:0 "Mark the frontier for Company settlement."
 india_administration_events.26.t:0 "The Eastern Frontier Policy"
 india_administration_events.26.d:0 "The Commission has asked Calcutta to settle the legal basis of Company rule on the eastern frontier. Some administrators favor a frontier settlement that gives local communities a formal place in the new order. Others argue that only a sharper colonial regime can fund roads, offices, and expansion at the necessary pace."
 india_administration_events.26.f:0 "#b Minute of the Frontier Commission#!\nA law is only a line until a clerk, a magistrate, a constable, and a tax collector arrive to make it real."
 india_administration_events.26.a:0 "Adopt frontier colonization."
 india_administration_events.26.b:0 "Adopt colonial exploitation."
 india_administration_events.27.t:0 "Patronage in the Eastern Temples"
 india_administration_events.27.d:0 "Company officers along the frontier have proposed a patronage fund for [GetCulture('burmese').GetName] monasteries, schools, and manuscript houses. The measure would not erase suspicion of foreign rule, but it would show that the new administration can protect more than roads and revenue."
 india_administration_events.27.f:0 "The donation chests were sealed in public. The abbot counted nothing in front of the officers, but he did ask for the names of the clerks who had kept the accounts honest."
 india_administration_events.27.a:0 "Let the Commission support them."
 india_administration_events.28.t:0 "Clerks of the Eastern Languages"
 india_administration_events.28.d:0 "Revenue officers and magistrates on the eastern frontier have asked permission to recruit [GetCulture('burmese').GetName] interpreters, clerks, and legal assistants into the new administration. Their work would make petitions, land records, and court judgments intelligible to the people they now govern."
 india_administration_events.28.f:0 "The interpreter did not soften the magistrate's words. He made them precise, and that was more useful."
 india_administration_events.28.a:0 "Put them in the ledgers."

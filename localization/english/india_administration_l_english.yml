 button_je_eastern_frontier_establish_colonies:0 "Establish Frontier Colonies"
 button_je_eastern_frontier_establish_colonies_desc:0 "A frontier without sufficient stations, roads, and survey posts is doomed to remain a line in a dispatch. The Commission should sponsor permanent settlements from the Brahmaputra valley to the passes beyond Arakan."
 button_je_eastern_frontier_introduce_crops:0 "Eastern Agrarian Survey"
 button_je_eastern_frontier_introduce_crops_desc:0 "The eastern valleys may be harsh, wet, and difficult to survey, but they are not barren. New medical precautions and agrarian studies allow the Commission to reclaim land that was previously left to forest, fever, and uncertain harvests.\n\nThis decision can be taken a total of #v 3#! times."
 button_je_eastern_frontier_burmese_protections:0 "Implement Burmese Legal Protections"
 button_je_eastern_frontier_burmese_protections_desc:0 "Until now, the Company's dealings with the [GetCulture('burmese').GetName] have been military, commercial, and improvised. A more durable settlement requires recognized intermediaries, local courts, and limited protections under Company law."
 button_je_eastern_frontier_burmese_patronage:0 "Sponsor Burmese Monasteries"
 button_je_eastern_frontier_burmese_patronage_desc:0 "The monasteries and learned circles of Burma are not merely religious institutions, but keepers of records, education, and local trust. Company patronage could turn suspicion into cautious cooperation."
 button_je_eastern_frontier_burmese_interpreters:0 "Recruit Burmese Interpreters"
 button_je_eastern_frontier_burmese_interpreters_desc:0 "A frontier administration cannot govern through mistranslation. Recruiting [GetCulture('burmese').GetName] interpreters, clerks, and revenue scribes would make Company rule less arbitrary in the eyes of local communities."
 button_je_eastern_frontier_colonial_policy:0 "Set Frontier Policy"
 button_je_eastern_frontier_colonial_policy_desc:0 "The Eastern Frontier Commission must choose whether the Company's advance will be framed as settlement and accommodation, or as a direct machinery of colonial extraction."
 button_je_eastern_frontier_complete:0 "We have developed the eastern frontier as much as our present institutions allow."

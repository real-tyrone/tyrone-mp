    rus_ai_protectorate_tuva:0 "Protectorate Tuva"
    rus_ai_protectorate_tuva_desc:0 "Begin a diplomatic play to make independent Tuva a Russian protectorate."
    idn_ai_unify_indonesian_neighbors:0 "Unify Indonesia"
    idn_ai_unify_indonesian_neighbors_desc:0 "Begin a unification diplomatic play against a neighboring Indonesian country."
    afg_ai_unify_afghan_neighbors:0 "Unify Afghanistan"
    afg_ai_unify_afghan_neighbors_desc:0 "Begin a Unify Afghanistan diplomatic play against a weaker Afghan country."
    afg_ai_expand_into_neighboring_states:0 "Secure the Afghan Frontier"
    afg_ai_expand_into_neighboring_states_desc:0 "Attack a weaker neighboring country for territory in Herat, Northern Baluchistan, Kabulistan, or Southern Turkestan, prioritizing the return of claimed states before conquest."
    eth_ai_unify_ethiopian_neighbors:0 "Unify Ethiopia"
    eth_ai_unify_ethiopian_neighbors_desc:0 "Begin a Unify Ethiopia diplomatic play against a weaker Ethiopian country."
    eth_ai_conquer_aussa_gonder_split:0 "Conquer Aussa's Gonder"
    eth_ai_conquer_aussa_gonder_split_desc:0 "Begin a Conquer State diplomatic play against Aussa for its split state in Gonder."
    eth_ai_return_amhara_from_unrecognized:0 "Return Amhara"
    eth_ai_return_amhara_from_unrecognized_desc:0 "Begin a Return State diplomatic play against an unrecognized country holding land in Amhara."
    chinese_warlord_ai_unify_chinese_neighbors:0 "Unify China"
    chinese_warlord_ai_unify_chinese_neighbors_desc:0 "Begin a Unify China diplomatic play against a weaker Chinese country during the Warlord Era."
    dutch_indonesia_adopt_javan_culture:0 "Adopt Javan Culture"
    dutch_indonesia_adopt_javan_culture_desc:0 "With multiculturalism embraced and the capital rooted in Indonesia, replace Dutch primary culture with Javan."
    bel_request_flanders_wallonia_consolidation:0 "Consolidate Belgium"
    bel_request_flanders_wallonia_consolidation_desc:0 "Request an amicable owner to transfer their holdings in Flanders and Wallonia to Belgium."
    ai_delete_universities_construction_when_overbuilt:0 "Clear Overbuilt Institutions"
    ai_delete_universities_construction_when_overbuilt_desc:0 "Remove all universities and construction sectors in a tiny AI country suffering negative infrastructure."
    ai_delete_all_barracks:0 "Default Barracks Retrenchment"
    ai_delete_all_barracks_desc:0 "Remove all barracks while the AI country is in default."
    commonwealth_equal_partner_upgrade:0 "Formalize Commonwealth Membership"
    commonwealth_equal_partner_upgrade_desc:0 "Convert an equal partner under AI Britain into a Commonwealth Member subject type."
    mex_ai_annex_altai_after_nationalism:0 "Annex Altai"
    mex_ai_annex_altai_after_nationalism_desc:0 "Begin an annexation diplomatic play against independent Altai after researching Nationalism."
    low_sol_delete_government_buildings_build_port:0 "Emergency State Retrenchment"
    low_sol_delete_government_buildings_build_port_desc:0 "At extremely low standards of living, remove government administrations, barracks, naval bases, ports, universities, construction sectors, and oversized trade centers, then establish one port if a suitable coastal state exists."
    rus_transfer_dobrudja_to_bulgaria:0 "Transfer Dobrudja to Bulgaria"
    rus_transfer_dobrudja_to_bulgaria_desc:0 "Transfer Russian-held Dobrudja to Bulgaria while Bulgaria is a member of Russia's power bloc."
    rus_ai_annex_adjacent_central_asian_insignificant:0 "Annex Central Asian Minor"
    rus_ai_annex_adjacent_central_asian_insignificant_desc:0 "Begin an annexation diplomatic play against an independent adjacent insignificant or weaker country with its capital in Central Asia."
    rus_ai_return_persian_central_asian_claims:0 "Press Persian Central Asian Claims"
    rus_ai_return_persian_central_asian_claims_desc:0 "Begin a return state diplomatic play for a Russian claim in Central Asia held by Persia."
    decision_china_unify_manchuria:0 "Unify Manchuria"
    decision_china_unify_manchuria_desc:0 "Begin a Unify China diplomatic play against Manchuria."
    jap_ai_attack_formosa:0 "Press the Formosa Question"
    jap_ai_attack_formosa_desc:0 "Begin a return state or conquer state diplomatic play against the owner of Formosa once the Taiwan Question has been raised."
    jap_ai_transfer_korea:0 "Press the Korean Question"
    jap_ai_transfer_korea_desc:0 "Begin a transfer subject diplomatic play for Korea once the Korean Question has been raised."
    tri_enact_frontier_colonization_after_berlin:0 "Adopt Frontier Colonization"
    tri_enact_frontier_colonization_after_berlin_desc:0 "With the Berlin Conference concluded, Tripolitania can formalize a frontier colonization policy."
    tri_frontier_colonization_boost_modifier:0 "Frontier Colonization Drive"
    tri_frontier_colonization_boost_modifier_desc:0 "The state is directing settlers, surveyors, and colonial officials toward rapid frontier expansion."
    tri_ai_claim_libya_if_fezzan_absent:0 "Claim Libya"
    tri_ai_claim_libya_if_fezzan_absent_desc:0 "Claim Tripoli, Libya, and the Libyan Desert while Fezzan is absent."
    brz_ai_improve_colombia_amazonas_relations:0 "Improve Relations with Colombia"
    brz_ai_improve_colombia_amazonas_relations_desc:0 "Improve relations with Colombia while the Amazon remains contested."
    tri_overlord_annex_fezzan_into_tripoli:0 "Restore Tripolitanian Authority in Fezzan"
    tri_overlord_annex_fezzan_into_tripoli_desc:0 "Return the Fezzani oases to Tripolitanian administration, binding the desert interior more firmly to the coast."
    arg_claim_falklands_decision:0 "Reaffirm the Sovereignty of the Malvinas"
    arg_claim_falklands_decision_desc:0 "The Malvinas have long been regarded as an integral part of the Argentine nation despite their continued occupation by Great Britain. By formally reaffirming our sovereignty over the islands, we strengthen our diplomatic position, rally public opinion, and lay the foundation for their eventual return to Argentine administration."
    african_colonial_annex_unrecognized_puppet:0 "Consolidate Colonial Protectorates"
    african_colonial_annex_unrecognized_puppet_desc:0 "Fold a neighboring African protectorate into the appropriate colonial administration, formalizing indirect rule into territorial government within the same colonial sphere."
    ger_ai_return_zanzibar_claim:0 "Press the Zanzibar Claim"
    ger_ai_return_zanzibar_claim_desc:0 "Begin a return state diplomatic play for Zanzibar after claiming East Africa at the Berlin Conference."
    ger_ai_return_togo_claim:0 "Press the Togo Claim"
    ger_ai_return_togo_claim_desc:0 "Begin a return state diplomatic play for Togo when Germany holds a claim and no decentralized country remains in the state."
    ger_consolidate_south_west_africa:0 "Consolidate South West Africa"
    ger_consolidate_south_west_africa_desc:0 "Request British recognition for integrating the remaining British and South African holdings in Hereroland and Namaqualand into the Namibian colony while leaving Walvis Bay under South African administration."
    saf_consolidate_botswana:0 "Consolidate Botswana"
    saf_consolidate_botswana_desc:0 "Request British recognition for integrating Botswana into South African administration while excluding the Caprivi Strip."
    saf_reduce_botswana_malaria:0 "Tame the Okavango"
    saf_reduce_botswana_malaria_desc:0 "With South African claims recognized after the Berlin Conference, targeted settlement and medical campaigns can reduce Botswana's severe malaria to regular malaria."
    saf_incorporate_southern_africa_states:0 "Incorporate Southern Africa"
    saf_incorporate_southern_africa_states_desc:0 "After the Berlin Conference, formally incorporate all unincorporated South African states in Southern Africa."
    zanj_colonial_claim_tanganyika:0 "Claim the East African Mainland"
    zanj_colonial_claim_tanganyika_desc:0 "Use our control of Zanzibar to assert administrative claims over Tanganyika and Rufiji."
    zanj_colonial_claim_tanganyika_overlord:0 "Formalize the Tanganyika Claim"
    zanj_colonial_claim_tanganyika_overlord_desc:0 "Ask our overlord to recognize Tanganyika as part of our colonial administration and formalize a shared claim over the state."
    colonial_claim_zambia_from_kazembe:0 "Consolidate Zambia"
    colonial_claim_zambia_from_kazembe_desc:0 "Fold Zambia into our colonial administration once Kazembe is fully under our control and no decentralized polities remain in Zambia."
    afs_consolidate_core_states:0 "Consolidate the Congo"
    afs_consolidate_core_states_desc:0 "Fold every remaining holding in the Free State's claimed Congo territories into our administration once no decentralized polities remain and we hold a foothold in each region."
    afs_annex_rwanda_burundi:0 "Secure the Great Lakes"
    afs_annex_rwanda_burundi_desc:0 "Begin an annexation diplomatic play against Rwanda or Burundi after consolidating Congo Orientale, provided Germany and its subjects hold no territory in Zanj."
    por_request_angola_consolidation:0 "Consolidate Angola"
    por_request_angola_consolidation_desc:0 "Request a cordial owner or overlord to transfer their remaining holdings in Angola to Portugal."
    por_request_mozambique_consolidation:0 "Consolidate Mozambique"
    por_request_mozambique_consolidation_desc:0 "Request a cordial owner or overlord to transfer their remaining holdings in Mozambique to Portugal, while ceding Portuguese-held East African lands outside Mozambique in return."
    por_claim_kazembe_zambia_and_zambezi:0 "Press Inland African Claims"
    por_claim_kazembe_zambia_and_zambezi_desc:0 "With Angola and Mozambique secured, Portugal can assert claims over Kazembe, Zambia, and Zambezi to link its African possessions across the interior."
    por_activate_portuguese_colonialism:0 "Claim Angola and Mozambique"
    por_activate_portuguese_colonialism_desc:0 "After the Berlin Conference, Portugal can assert claims across Angola and Mozambique."
    pink_map_british_claims_removed_tt:0 "Britain and its [Concept('concept_subject','$concept_subjects$')] lose any [Concept('concept_claim','$concept_claims$')] on Kazembe, Zambia, and Zambezi."
    portuguese_colonialism.17.t:0 "Portuguese Claims in Angola"
    portuguese_colonialism.17.d:0 "Portugal has requested that our remaining holdings in Angola be transferred into Portuguese administration."
    portuguese_colonialism.17.f:0 "Lisbon presents the proposal as an orderly settlement between cordial powers: a tidy border, a grateful partner, and fewer ambiguities on the map."
    portuguese_colonialism.17.a:0 "Accept the Portuguese proposal."
    portuguese_colonialism.17.b:0 "Refuse the transfer."
    portuguese_colonialism.18.t:0 "Portuguese Claims in Mozambique"
    portuguese_colonialism.18.d:0 "Portugal has requested that our remaining holdings in Mozambique be transferred into Portuguese administration."
    portuguese_colonialism.18.f:0 "Lisbon presents the proposal as an orderly settlement between cordial powers: a tidier coast, a consolidated colony, and one less colonial disagreement left to fester."
    portuguese_colonialism.18.a:0 "Accept the Portuguese proposal."
    portuguese_colonialism.18.b:0 "Refuse the transfer."
    belgian_consolidation.1.t:0 "Belgian Claims in Flanders and Wallonia"
    belgian_consolidation.1.d:0 "Belgium has requested that our holdings in Flanders and Wallonia be transferred into Belgian administration."
    belgian_consolidation.1.f:0 "Brussels presents the proposal as an amicable settlement between friendly governments: fewer disputed borders, clearer administration, and a Belgium made whole."
    belgian_consolidation.1.a:0 "Accept the Belgian proposal."
    belgian_consolidation.1.b:0 "Refuse the transfer."
    ita_ai_return_ethiopian_claim_after_berlin:0 "Press Ethiopian Claims"
    ita_ai_return_ethiopian_claim_after_berlin_desc:0 "Begin a return state diplomatic play for an Italian claim in Ethiopia after the Berlin Conference, excluding AWS, ISQ, and WSG."
    decision_merge_chinese_subjects:0 "Unify Chinese Subjects"
    decision_merge_chinese_subjects_desc:0 "Permit China to incorporate the Taiping Heavenly Kingdom into its administration, reducing China's liberty desire."


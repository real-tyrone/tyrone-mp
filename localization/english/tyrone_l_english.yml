    je_ostend_offer_cuba_button:0 "Make an Offer for Cuba"
    je_ostend_offer_cuba_button_desc:0 "Approach Spain with a formal offer to purchase Cuba. A diplomatic resolution may spare both nations from a costly conflict."
    je_ostend_manifesto_complete_concluded_tt:0 "The United States or Spain have formally concluded negotiations."
    je_ostend_conclude_negotiations_button:0 "Conclude Negotiations"
    je_ostend_conclude_negotiations_button_desc:0 "The question of Cuba and Puerto Rico has been resolved sufficiently. The United States will formally conclude its diplomatic campaign."
    ostend_conclude_negotiations_complete_tt:0 "This will complete The Ostend Manifesto journal entry."
    ostend_break_negotiations_fail_tt:0 "This will fail The Ostend Manifesto journal entry. The unresolved dispute over Cuba and Puerto Rico may yet ignite a future war between the United States and Spain."

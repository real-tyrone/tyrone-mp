    crimean_war:0 "Crimean War"
    dp_crimean_war_tooltip:0 "#header Start a $dp_crimean_war$ [concept_diplomatic_play]#!"
    dp_crimean_war_desc:0 "A diplomatic play over Russian ambitions and Ottoman sovereignty in the Black Sea."
    war_goal_crimean_war_wargoal:0 "Settle the Crimean War"
    crimean_war_wargoal_desc:0 "Force a settlement of the Crimean War."

    crimean_holy_places_policy:0 "Protector of the Holy Land"
    crimean_holy_places_devout:0 "Holy Places Defended"
    crimean_holy_places_refused_devout:0 "Holy Places Abandoned"
    crimean_british_isolation:0 "Splendid Isolation Questioned"
    crimean_war_victor:0 "Crimean War Victor"
    crimean_war_victor_tt:0 "[GetStaticModifier('crimean_war_victor').GetName|v]\n[GetStaticModifier('crimean_war_victor').GetDesc]"
    crimean_war_loser:0 "Crimean War Loser"
    crimean_war_loser_tt:0 "[GetStaticModifier('crimean_war_loser').GetName|v]\n[GetStaticModifier('crimean_war_loser').GetDesc]"
    crimean_war_traditionalist_ruler_discredited:0 "Discredited Traditionalism"

    crimean_war.1.t:0 "The Holy Places"
    crimean_war.1.d:0 "The Porte's rule over the Holy Land has become the subject of courtly petitions, clerical outrage, and [SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag] pressure. [SCOPE.sCountry('france_scope').GetName] may assert Catholic authority in [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] domains, but doing so will turn the dispute into a question of European power."
    crimean_war.1.f:0 ""Pilgrims speak of keys, lamps, doors, and rites. Ministers speak of treaties, squadrons, and reputations. Between them lies Jerusalem, and beyond Jerusalem lies the balance of Europe.""
    crimean_war.1.a:0 "[SCOPE.sCountry('france_scope').GetNameNoFlag] will defend Catholic privilege."
    crimean_war.1.b:0 "This is not worth a war."

    crimean_war.2.t:0 "The Sick Man and the Bear"
    crimean_war.2.d:0 "[SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag] pressure on the [SCOPE.sCountry('ottoman_scope').GetName] threatens to upset the balance of power. [SCOPE.sCountry('britain_scope').GetName] may commit itself to the Porte's defense, or stand aside and accept the consequences of inaction."
    crimean_war.2.f:0 ""The straits are narrow, but through them pass questions wider than any sea: India, commerce, prestige, and the limits of [SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag] appetite.""
    crimean_war.2.a:0 "The balance of power must be preserved."
    crimean_war.2.b:0 "[SCOPE.sCountry('britain_scope').GetNameNoFlag] will not bleed for the Porte."

    crimean_war.3.t:0 "[SCOPE.sCountry('austria_scope').GetNameNoFlag] Between Empires"
    crimean_war.3.d:0 "[SCOPE.sCountry('austria_scope').GetName] sits between gratitude to the [SCOPE.sCountry('russia_scope').GetName], fear of [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] collapse, and anxiety over the Danube. Vienna must decide whether to side with the [SCOPE.sCountry('russia_scope').GetNameNoFlag], oppose its advance, or keep its counsel."
    crimean_war.3.f:0 ""A map of the Danube lay open beneath the candles. Every line upon it was a promise to one neighbor and a threat to another.""
    crimean_war.3.a:0 "Stand with the [SCOPE.sCountry('russia_scope').GetNameNoFlag]."
    crimean_war.3.b:0 "Remain neutral."
    crimean_war.3.c:0 "The [SCOPE.sCountry('russia_scope').GetNameNoFlag] must be checked."

    crimean_war.4.t:0 "War in the Crimea"
    crimean_war.4.d:0 "Months of diplomatic crisis have failed to produce a settlement between the [SCOPE.sCountry('russia_scope').GetName] and the [SCOPE.sCountry('ottoman_scope').GetName]. The rival camps are now committed, and the dispute over [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] sovereignty will be decided by arms."
    crimean_war.4.f:0 ""Telegrams crossed Europe like sparks. By the time the chancelleries finished reading them, the fleets were already moving.""
    crimean_war.4.a:0 "Begin the war."

    crimean_war.5.t:0 "The Treaty of Paris"
    crimean_war.5.d_ottoman:0 "The [SCOPE.sCountry('russia_scope').GetName] has been forced to retreat from its designs on the [SCOPE.sCountry('ottoman_scope').GetName]. The Porte and its allies now impose a settlement restoring [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] control in the Caucasus and Bessarabia."
    crimean_war.5.d_russian:0 "The [SCOPE.sCountry('ottoman_scope').GetName] and its allies have failed to check the [SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag] advance. The peace treaty now asserts [SCOPE.sCountry('russia_scope').GetAdjectiveNoFlag] authority over Kars and the Danubian Principalities."
    crimean_war.5.f:0 ""The diplomats wrote in polished phrases, but everyone at the table could count the graves behind each clause.""
    crimean_war.5.a:0 "So the matter is settled."

    crimean_war.6.t:0 "The Crimean Question Fades"
    crimean_war.6.d:0 "The crisis over the Holy Places and the [SCOPE.sCountry('ottoman_scope').GetName] has failed to produce a decisive settlement. Europe turns elsewhere, leaving the old grievances between the [SCOPE.sCountry('russia_scope').GetName] and the Porte to smolder."
    crimean_war.6.f:0 ""No treaty settled it. No battle clarified it. The papers simply found newer alarms to print.""
    crimean_war.6.a:0 "For now, the storm passes."
    crimean_war.6.b:0 "We failed to protect our Orthodox brethren."
    crimean_war.7.t:0 "The [SCOPE.sCountry('russia_scope').GetNameNoFlag] Asserts Its Rights"
    crimean_war.7.d:0 "The [SCOPE.sCountry('russia_scope').GetName] has declared its intention to secure influence over the Christian subjects of the [SCOPE.sCountry('ottoman_scope').GetName]. The demand reaches far beyond pilgrimage and holy sites; it would make the Tsar a permanent arbiter in Ottoman affairs."
    crimean_war.7.f:0 ""The note was polite, the implication was not. Protection, once granted by a foreign sovereign, becomes a door that rarely closes.""
    crimean_war.7.a:0 "Europe watches the Porte's answer."
    crimean_war.7.b:0 "We shall abandon our claim to the Holy Places."
    crimean_war.8.t:0 "Lessons of the Crimea"
    crimean_war.8.d:0 "Defeat in the Crimean War has laid bare the weaknesses of the [SCOPE.sCountry('russia_scope').GetName]. Diplomats speak of isolation, officers of obsolete supply, and ministers of an empire whose old institutions cannot carry the burden of modern war."
    crimean_war.8.f:0 ""The dispatches returned from the front with more than casualty lists. They carried a verdict: courage had not failed, but the machinery of the state had.""
    crimean_war.8.a:0 "Russia must modernize."

    je_path_of_east_indies:0 "The Future of the East Indies"
    je_path_of_east_indies_reason:0 "The East Indies stands at a crossroads. A tighter [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] colonial regime may secure plantation output and administrative control, a revived chartered company may bind the Indies to commerce and investment, while liberal reform could reshape the colony around abolition and modern governance. Whichever course we choose, the Indies must be made loyal, profitable, and stable before foreign pressure or local discontent can pull them from [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] authority."
    event_effects_dei_events.4_tt:0 "• Triggers the Event #v $dei_events.4.t$#!\n• A successful East Indies settlement will grant rewards based on the chosen colonial path\n• The East Indies will lose #blue #bold 50#!#! [concept_liberty_desire]\n• [concept_loyalist] support will rise in both the metropole and the Indies"


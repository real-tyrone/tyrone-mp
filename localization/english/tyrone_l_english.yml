    # DEI - Breakup Events
    # =============================================

    # Lobby JE LOC
    je_reform_indies_lobby: "The Dutch East Indies is about to undergo a period of extensive reform, guided by their overlord across the world. Will the colonial subject collapse, pass reformist, egalitarian policies, or further entrench the ruling colonial class' grip on society?"

    dei_events.1.t: "Consolidating the East Indies"
    dei_events.1.d:0 "Our efforts to consolidate the East Indies have borne fruit. Diplomatic initiatives and administrative pressure have brought the region's subordinate administrations under a single colonial authority."
    dei_events.1.f:0 "The Governor-General reports that the patchwork of residencies, protectorates, and local client states is being folded into one government for the islands."
    dei_events.1.a:0 "Excellent, our colonial empire is secure."

    dei_make_indonesian_protectorate:0 "Establish an Indonesian Protectorate"
    dei_make_indonesian_protectorate_desc:0 "Begin a diplomatic play to make an independent unrecognized country in Indonesia a Dutch East Indies protectorate, excluding the Philippines and North Borneo."

    je_consolidate_east_indies:0 "Consolidate the East Indies"
    je_consolidate_east_indies_reason:0 "The [SCOPE.sCountry('east_indies_scope').GetName], the crown jewel of the [ROOT.GetCountry.GetName]'s colonial empire, have been the lifeblood of our wealth and power in the East, yielding spices, resources, and strategic vantage points that no rival can match. Yet beneath the surface of prosperity, separatist sentiments simmer and foreign ambitions lurk, threatening to fracture this vital dominion. Our forefathers built this empire through courage and cunning; we must now safeguard it with resolve and foresight. By consolidating our authority over these islands, we quell internal divisions, strengthen our defenses, and ensure that the riches of the Indies continue to enrich the metropole, securing our place as a dominant force in Asia and preserving the legacy of [ROOT.GetCountry.GetAdjectiveNoFlag] colonial might."

    indonesia_exists_tt:0 "#b $IDN$#! has been [Concept('concept_nation_formation','$concept_nation_formation_short_past$')]"

    event_effects_dei_events.1_tt:0 "• [SCOPE.sCountry('east_indies_scope').GetName] annexes its [Concept('concept_subject','$concept_subjects$')] and [ROOT.GetCountry.GetName]'s [Concept('concept_subject','$concept_subjects$')] with capitals in the Indonesian [concept_strategic_region]\n• [SCOPE.sCountry('east_indies_scope').GetName] loses #blue #bold 75#!#! [concept_liberty_desire]\n• Relations with [SCOPE.sCountry('east_indies_scope').GetName] improve by #green #bold 50#!#!"

    dei_gdp_reached_50_tt:0 "The Dutch East Indies [concept_gdp] has increased by #v 50%#."

    dei_gdp_initial:0 "Initial [concept_gdp] of the Dutch East Indies"
    dei_current_gdp:0 "Current [concept_gdp] of the Dutch East Indies"

    dei_gdp_bar_name:0 "GDP"
    dei_gdp_bar_desc:0 "Tracks the GDP growth of the Dutch East Indies towards its goal."

    dei_events.2.t:0 "A New Course for the Indies"
    dei_events.2.d:0 "The administration of the East Indies has begun a broad program of reform, seeking to replace old systems of extraction with a more modern, productive, and orderly colonial economy."
    dei_events.2.f:0 "For decades, the Indies have enriched the metropole through plantation quotas, forced deliveries, and the slow draining of local wealth. Yet the pressures of commerce, industry, and administration now demand more than simple extraction. If the colony is to remain profitable, stable, and defensible, it must be reshaped through law, investment, and policy."
    dei_events.2.a:0 "Begin the reform of the Indies."

    dei_events.3.t:0 "The Future of the East Indies"
    dei_events.3.d:0 "The future of [SCOPE.sCountry('dei_scope').GetName] can no longer be left to habit and improvisation. The colonial administration, the old mercantile interests, and the advocates of liberal reform all press their claims on how the Indies should be governed under [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] authority."
    dei_events.3.f:0 "The islands are rich, but wealth alone is not policy. If [SCOPE.sCountry('netherlands_scope').GetName] is to hold them, we must decide what kind of empire we mean to be."
    dei_events.3.a:0 "Maintain standard [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] colonial rule."
    dei_events.3.b:0 "Reform the VOC."
    dei_events.3.c:0 "Push for liberal colonial reform."

    dei_events.4.t:0 "A New Order in the Indies"
    dei_events.4.d:0 "The chosen path for the Indies has begun to bear fruit. [SCOPE.sCountry('netherlands_scope').GetName] must now decide how the reformed colonial order should be bound to the metropole, whether through autonomy, crown authority, company rule, direct administration, or full integration."
    dei_events.4.f:0 "A colony can be governed by decree, by contract, by crown, or by consent. What matters now is that the Indies remain useful, loyal, and secure."
    dei_events.4.a:0 "Preserve the current arrangement."
    dei_events.4.b:0 "Form a Personal Union with #b Indonesia#!."
    dei_events.4.c:0 "Enjoy the fruits of the VOC."
    dei_events.4.e:0 "Reward loyal colonial administration."
    dei_events.4.g:0 "Integrate the Indies directly."

    voc_east_indies_name: "Vereenigde Oostindische Compagnie" 

    je_crimean_war:0 "The Crimean War"
    je_crimean_war_reason:0 "The quarrel over the Holy Places has become a greater contest over the future of the [SCOPE.sCountry('ottoman_scope').GetName]. The [SCOPE.sCountry('russia_scope').GetName] presses its claims as protector of Orthodox Christians, while the Porte seeks foreign support against imperial encroachment. If diplomacy fails, battle on the Black Sea and the Danubian Principalities will decide the matter."
    crimean_war_settlement_reached_tt:0 "A Crimean settlement has been reached."
    crimean_war_russian_victory_tt:0 "Russia has asserted its influence over the Christians of the Ottoman Empire."
    crimean_war_ottoman_victory_tt:0 "The Ottomans have reasserted their sovereignty over the Danube."
    event_effects_crimean_war.5_tt:0 "$event_effect_choose_one$ #indent_newline:3 \n$event_effect_all_of_the_following$ #indent_newline:3 \n• If the [SCOPE.sCountry('ottoman_scope').GetName] wins: [GetStateRegion('STATE_KARS').GetName] will be restored to the [SCOPE.sCountry('ottoman_scope').GetName]\n• If the [SCOPE.sCountry('ottoman_scope').GetName] wins: the southern [GetStateRegion('STATE_BESSARABIA').GetName] provinces and the [GetStateRegion('STATE_DOBRUDJA').GetName] province owned by the [SCOPE.sCountry('russia_scope').GetName] will be transferred to the owner of [GetStateRegion('STATE_MOLDAVIA').GetName], if that owner is the [SCOPE.sCountry('ottoman_scope').GetName] or a [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] [concept_subject]\n• If the [SCOPE.sCountry('russia_scope').GetName] wins: [GetStateRegion('STATE_KARS').GetName] will be transferred to the [SCOPE.sCountry('russia_scope').GetName]\n• If the [SCOPE.sCountry('russia_scope').GetName] wins and #v $ROM$#! exists as a [concept_subject]: #v $ROM$#! will be transferred to the [SCOPE.sCountry('russia_scope').GetName]\n• If the [SCOPE.sCountry('russia_scope').GetName] wins and #v $ROM$#! does #bold not#! exist: #v $WAL$#! and #v $MOL$#! will be transferred to the [SCOPE.sCountry('russia_scope').GetName] if they exist as [Concept('concept_subject', '$concept_subjects$')], or [GetStateRegion('STATE_WALLACHIA').GetName] and [GetStateRegion('STATE_MOLDAVIA').GetName] will be annexed by the [SCOPE.sCountry('russia_scope').GetName] if the subject countries no longer exist#!\n  • If the [SCOPE.sCountry('russia_scope').GetName] wins: #v $SER$#! will become independent, or be created from [GetStateRegion('STATE_WESTERN_SERBIA').GetName] if it does not exist\n Great Power participants on the winning side get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],crimean_war_victor_tt $crimean_war_victor$#!, which decays over time\n• Great Power participants on the losing side get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],crimean_war_loser_tt $crimean_war_loser$#!, which decays over time\n• If #v $ROM$#! does #bold not#! exist, #v $WAL$#! gets the Event #v $romania.2.t$#!\n• If the [SCOPE.sCountry('russia_scope').GetName] wins and #v $AUS$#! sided with the [SCOPE.sCountry('russia_scope').GetName], #v $BOS$#! will become an #v $AUS_ADJ$#! [concept_protectorate]#!"


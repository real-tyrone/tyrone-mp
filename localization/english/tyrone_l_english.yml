 # From tyrone_byzantium_l_english.yml

je_byz_reclaim_anatolia: "The Recovery of Anatolia"
je_byz_reclaim_anatolia_reason: "Though Constantinople has returned to Roman hands, the empire cannot endure while Anatolia remains divided from it. The ancient heartland must be recovered, its cities restored to imperial authority, and the eastern approaches to the capital secured."

je_byz_reclaim_levant: "The Return to the Levant"
je_byz_reclaim_levant_reason: "With Anatolia restored, the imperial armies may once again march southward. Antioch, Syria, Palestine, and the lands beyond the Jordan were governed from Constantinople for centuries; their recovery would carry the Roman frontier back into the Levant."

je_byz_reclaim_egypt: "Restore Imperial Rule in Egypt"
je_byz_reclaim_egypt_reason: "Egypt was once the granary of the Roman world and among the wealthiest provinces of the empire. To restore the authority of Constantinople along the Nile would secure the southern Mediterranean and demonstrate that the imperial restoration is no passing dream."

je_byz_reclaim_southern_italy: "Return to Southern Italy"
je_byz_reclaim_southern_italy_reason: "Southern Italy was governed from Constantinople for centuries, and its coasts remain the natural western frontier of the restored empire. From Abruzzo to Sicily, the old imperial provinces must be returned to Roman rule."

byzantine_reconquest.1.t: "The Eagle Returns to Anatolia"
byzantine_reconquest.1.d: "From the shores of the Black Sea to the passes of the Taurus Mountains, Anatolia once again answers to Constantinople. Yet military victory alone cannot bind these lands to the restored empire. The imperial government must now determine the place of Anatolia's Turkish population within the new Roman order."
byzantine_reconquest.1.f: "For centuries, the imperial frontier retreated before rival sultans and foreign conquerors. Now the standards of the double-headed eagle rise above the cities of Anatolia once more, and proclamations bearing the emperor's seal are read where Roman authority had long been only a memory."

byzantine_reconquest.1.a: "Anatolia shall be Hellenic once more."
byzantine_reconquest.1.b: "All loyal peoples may become Romans."

byz_rehellenization_of_anatolia: "The Re-Hellenization of Anatolia"

byz_integrated_turks: "Turks of the Roman Empire"

byz_reclaimed_province_incorporation: "Restoration of Imperial Administration"

byzantine_reconquest.2.t: "Reclaimed the Holy Land"

byzantine_reconquest.2.d: "Jerusalem has returned to Roman rule, bringing the empire once more to the shrines of the Holy Land. Within the Church of the Holy Sepulchre, prayers rise for the sovereign in Constantinople, while imperial officials receive the city's notables. Some hail the victory as a sacred charge to protect the holy places; others proclaim that Rome has at last reclaimed its place among the great powers."

byzantine_reconquest.2.f: "The soldiers halted at the church doors, their boots white with the dust of the march. An old priest passed between them with a censer, scarcely glancing at the standards overhead. They had entered Jerusalem to the sound of trumpets; here, before the tomb, their captain took off his helmet and bowed his head."

byzantine_reconquest.2.a: "Ours is the duty to safeguard the holy places."

byzantine_reconquest.2.b: "Let every court hear: Rome has returned."

byz_guardians_of_the_holy_land: "Guardians of the Holy Land"
byz_restored_imperial_glory: "Restored Imperial Glory"

byzantine_reconquest.3.t: "The Nile Under Roman Rule"
byzantine_reconquest.3.d: "Egypt has returned to imperial rule. Its fields and plantations could supply a growing empire, but the victory has also opened the road to further conquest in Africa. The court must decide where to direct its efforts."
byzantine_reconquest.3.f: "From the harbors of Alexandria to the villages along the Nile, imperial officials take stock of a province long absent from Constantinople's grasp. Some bring plans for canals and harvests. Others bring maps."

byzantine_reconquest.3.a: "Make Egypt the empire's breadbasket once more."
byzantine_reconquest.3.b: "March west, toward Libya and Tunisia."
byzantine_reconquest.3.c: "Follow the Nile south and secure the Red Sea coast."

byz_breadbasket_of_the_empire: "Breadbasket of the Empire"
byz_breadbasket_of_the_empire_desc: "Imperial investment in Egypt's farmland and plantations has made the province a vital source of food and agricultural goods."

byzantine_reconquest.4.t: "The Legacy of Magna Graecia"
byzantine_reconquest.4.d: "Southern Italy has returned to Roman rule. Some at court see it as the first step toward reclaiming the whole Italian peninsula. Others urge us to devote our resources to the lands already won, strengthening Greek language and culture in the old cities of Magna Graecia."
byzantine_reconquest.4.f: "In the streets of Naples and the ports of Calabria, imperial banners fly once more. The generals study roads leading north; scholars and officials turn instead to the schools, churches, and town halls of the south."

byzantine_reconquest.4.a: "Let us restore Italia to Roman rule."
byzantine_reconquest.4.b: "Let Magna Graecia flourish again."

byz_claim_to_italy: "Claim to Italy"
byz_claim_to_italy_desc: "The empire has declared its reconquest of Southern Italy the beginning of a campaign to reclaim the peninsula."

byz_magna_graecia_restored: "Magna Graecia Restored"
byz_magna_graecia_restored_desc: "Imperial support for Greek schools, institutions, and cultural life is strengthening Greek influence throughout Southern Italy."

byz_restore_roman_empire: "Restore the Roman Empire"
byz_restore_roman_empire_desc: "Our conquests have reunited the heartlands of the ancient empire. We can now proclaim to the world that the Roman Empire has been restored."
byz_restore_roman_empire_required_states_tt: "[ROOT.GetCountry.GetName] owns every [concept_state] in [GetGeographicRegion('geographic_region_byz_roman_heartlands').GetName]."
geographic_region_byz_roman_heartlands: "Roman Heartlands"

byzantine_reconquest.5.t: "The Roman Empire Restored"
byzantine_reconquest.5.d: "From Constantinople, a proclamation has gone forth: the age of a divided Roman inheritance is over. With the empire's old heartlands under one sovereign once more, we shall set aside the name by which foreign courts have known us. We are the Roman Empire."
byzantine_reconquest.5.f: "The herald reads the proclamation beneath the imperial standard. In the square below, the crowd takes up a cry once heard across the Mediterranean: Rome has returned."
byzantine_reconquest.5.a: "We have restored the Glory of Rome."

byz_roman_empire_restored: "The Roman Empire Restored"
byz_roman_empire_restored_desc: "The reunification of Rome's ancient heartlands has renewed the empire's prestige, authority, and prosperity."

byz_reestablish_exarchate_of_africa: "Re-Establish the Exarchate of Africa"
byz_reestablish_exarchate_of_africa_desc: "From Carthage to the deserts of Libya, imperial authority has returned to the African coast. By reviving the Exarchate of Africa, we can bind these recovered lands to Constantinople under a renewed Roman administration."

byz_claim_province_of_spania: "Claim the Province of Spania"
byz_claim_province_of_spania_desc: "Our foothold in Al Rif has placed the western Mediterranean within reach. We can revive the imperial claim to Spania and prepare to restore Roman rule in southeastern Iberia, the Balearic Islands, and Andalusia."


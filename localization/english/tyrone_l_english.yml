 brazil_guide.1.t:0 "Brazil and the Coming Continental Contest"
 brazil_guide.1.d:0 "Beyond the frontiers of [ROOT.GetCountry.GetName], the future of the Americas remains unsettled. Spain remembers an empire, the United States proclaims a hemisphere, and Brazil must decide whether to follow another power or gather the continent beneath its own banner."
 brazil_guide.1.f:0 "A continent cannot be led from another nation’s shadow."
 brazil_guide.1.a:0 "We must prepare our own place in the Americas."
 brazil_guide_bloc_advice_tt:0 "#g We strongly recommend creating and leading your own [concept_power_bloc].#!\nBloc leadership is required to activate #b $je_tyrone_brazil_great_power$#! once unlocked, and to pursue Brazil’s independent federal route in #b $je_tyr_americas$#!."
 brazil_guide_reconquista_warning_tt:0 "#r Before the Reconquista situation begins, Brazil cannot initiate Diplomatic Plays against countries with territory in South America. This restriction continues throughout Phase I and is lifted in Phase II.#!\n#r Siding with Spain or the USA keeps South American initiatives locked until the situation ends, making South American unification an unreliable route. Joining either principal Power Bloc additionally blocks all new Diplomatic Plays until the situation ends.#!"
 debug_reconquista.1.t:0 "Debug: Reconquista"
 debug_reconquista.1.d:0 "Select a phase or force a winner for #b $je_tyr_americas$#!. The Journal Entry must already be active. Forced victories bypass territorial conditions and resolve through the normal Journal Entry update.\n\n#r Phase changes reset the phase timers and modifiers but do not undo existing annexations or protectorates. Skipping from Phase I to Phase III also applies the Phase II protectorate conversion. This menu cannot reopen a concluded situation.#!"
 debug_reconquista.1.f:0 "For testing only. Use a separate save."
 debug_reconquista.1.close:0 "Close without changes."
 debug_reconquista.1.phase_1:0 "Set Phase 1."
 debug_reconquista_phase_1_tt:0 "Force #v Phase 1#! immediately, bypassing transition conditions. Reset phase duration and consecutive-threshold counters to #v 0#!."
 debug_reconquista.1.phase_2:0 "Set Phase 2."
 debug_reconquista_phase_2_tt:0 "Force #v Phase 2#! immediately, bypassing transition conditions. Reset phase duration and consecutive-threshold counters to #v 0#!."
 debug_reconquista.1.phase_3:0 "Set Phase 3."
 debug_reconquista_phase_3_tt:0 "Force #v Phase 3#! immediately, bypassing transition conditions. Reset phase duration and consecutive-threshold counters to #v 0#!."
 debug_reconquista.1.win_usa:0 "Force #blue USA#! victory."
 debug_reconquista_win_usa_tt:0 "Force a #blue USA#! victory without territorial requirements. The next Journal Entry update concludes the situation and delivers the real victory event, loser penalties and cleanup."
 debug_reconquista.1.win_brazil:0 "Force #green Brazil#! victory."
 debug_reconquista_win_brazil_tt:0 "Force a #green Brazil#! victory without territorial requirements. The next Journal Entry update concludes the situation and delivers the real victory event, loser penalties and cleanup."
 debug_reconquista.1.win_spain:0 "Force #gold Spain#! victory."
 debug_reconquista_win_spain_tt:0 "Force a #gold Spain#! victory without territorial requirements. The next Journal Entry update concludes the situation and delivers the real victory event, loser penalties and cleanup."

    france_ai_protectorate_or_transfer_tunisia_desc:0 "Begin a diplomatic play to make independent Tunisia a protectorate, or transfer Tunisia if it is already a subject."
    dei_ai_return_indonesian_claims:0 "Press Indonesian Claims"
    dei_ai_return_indonesian_claims_desc:0 "Begin a return state diplomatic play for a Dutch East Indies claim in Indonesia held by an independent country."
    bic_ai_protectorate_himalayan_minor:0 "Protectorate the Himalayan States"
    bic_ai_protectorate_himalayan_minor_desc:0 "Begin a diplomatic play to make Nepal, Sikkim, or Bhutan a British Indian protectorate."
    bic_ai_conquer_isolated_northern_baluchistan:0 "Secure Northern Baluchistan"
    bic_ai_conquer_isolated_northern_baluchistan_desc:0 "Begin a conquest diplomatic play against the owner of Northern Baluchistan when the state is isolated from its market and borders British India."
    jap_ai_imperial_marriage_break_netherlands_treaties:0 "Repudiate Dutch Treaties"
    jap_ai_imperial_marriage_break_netherlands_treaties_desc:0 "Withdraw from treaties with the Netherlands and begin enacting Closed Borders during the Imperial Marriage."

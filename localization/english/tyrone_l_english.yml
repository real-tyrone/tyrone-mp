 sil_claim_british_west_africa:0 "Assert British West African Claims"
 sil_claim_british_west_africa_desc:0 "With the Berlin Conference concluded, Sierra Leone can assert claims to every state in the West Africa strategic region claimed by Great Britain."

 gbr_organize_saf_colonial_administration:0 "Organize the Colonial Administration of South Africa"
 gbr_organize_saf_colonial_administration_desc:0 "Following the Berlin Conference, choose a colonial administration policy for our existing subject, South Africa. Its current laws will be preserved."

 gbr_organize_sil_colonial_administration:0 "Organize the Colonial Administration of Sierra Leone"
 gbr_organize_sil_colonial_administration_desc:0 "Following the Berlin Conference, choose a colonial administration policy for our existing subject, Sierra Leone. Its current laws will be preserved."

 sil_enact_colonial_exploitation_after_berlin:0 "Adopt Colonial Exploitation"
 sil_enact_colonial_exploitation_after_berlin_desc:0 "With the Berlin Conference concluded, Sierra Leone can adopt Colonial Exploitation to develop the resources of its colonial territories."

 colonize_western_papua_decision:0 "Colonize the Western Papuan Interior"
 colonize_western_papua_decision_desc:0 "Our settlements along the coast of Western New Guinea provide only a tenuous hold over the region. By mounting expeditions into the malaria-ridden interior, establishing permanent outposts, and bringing the local population under our administration, we can extend effective colonial rule throughout Western Papua."


    modifier_portuguese_african_ambitions:0 "Portuguese African Ambitions"

tyrone_colonial_split.1.t:0 "A Divided Colonial Frontier"
    tyrone_colonial_split.1.d:0 "Colonization of [SCOPE.sState('tyrone_split_smaller_state').GetName] is complete, leaving the region divided between [SCOPE.sCountry('tyrone_split_smaller_colony').GetName] and [SCOPE.sCountry('tyrone_split_larger_colony').GetName]. Our administration holds the smaller share. We have been asked to transfer its holdings in the region to the larger administration."
    tyrone_colonial_split.1.f:0 "The surveyors have finished their work, but their maps show two administrations where one might suffice. A settlement would simplify the frontier; whether it justifies surrendering our foothold is another matter."
    tyrone_colonial_split.1.a:0 "Transfer our administration's share."
    tyrone_colonial_split.1.b:0 "Our administration will retain its territory."

    idn_ai_return_claimed_indonesian_states:0 "Recover Indonesian Claims"
    idn_ai_return_claimed_indonesian_states_desc:0 "Demand the return of claimed territory in Indonesia from an independent country."

    ita_ai_conquer_independent_lombardy:0 "Conquer Lombardy"
    ita_ai_conquer_independent_lombardy_desc:0 "Bring independent Lombardy into Italy through conquest."
    pru_ai_brothers_war_after_holy_alliance:0 "Challenge Austria for German Leadership"
    pru_ai_brothers_war_after_holy_alliance_desc:0 "With the Holy Alliance's binding period at an end, Prussia will withdraw from its treaty with Austria and make the struggle for German leadership its overriding diplomatic priority."
    ai_strategy_prussian_german_leadership:0 "Challenge Austria for German Leadership"
    ai_strategy_prussian_german_leadership_desc:0 "Prussia is preparing to settle the German Question by defeating Austria in a leadership play."
    tyrone_krakatoa_humanitarian_reputation:0 "Krakatoa Humanitarian Aid"
    tyrone_krakatoa_humanitarian_reputation_desc:0 "Our humanitarian response to the Krakatoa eruption has shaped international perceptions of our country."
    je_crimean_war_begin_war_button:0 "Begin the Crimean War"
    je_crimean_war_begin_war_button_desc:0 "End the diplomatic crisis and deliver the final ultimatum to the Ottoman Empire, setting the Crimean War in motion."

    egyptian_crisis_events.8.t:0 "The Future of Egypt"
    egyptian_crisis_events.8.d:0 "Egypt has been brought back under Ottoman authority, completing our efforts to reclaim the Nile. We can now abolish its separate administration and incorporate its lands directly, or preserve Egypt as an obedient puppet. Annexation will provoke an international reaction."
    egyptian_crisis_events.8.f:0 "The seal of the Porte commands obedience once more. Whether it should also govern every village along the Nile is another question."
    egyptian_crisis_events.8.a:0 "Annex Egypt."
    egyptian_crisis_events.8.b:0 "Keep Egypt as our puppet."
    egyptian_crisis_events.8.b.tt:0 "Egypt remains a puppet, and we gain no additional Infamy."

    modifier_imperial_marriage:0 "Imperial Marriage"
    modifier_imperial_marriage_movement_modifier:0 "Opposition to the Imperial Marriage"

    satcho_alliance_imperial_victory_tt:0 "The #b Satcho Alliance#! has won the #b Boshin War#!, securing an #b Imperial#! victory in the #v $je_meiji_restoration$#! [concept_journal_entry]"

    modifier_victory_in_the_boshin_war:0 "Victory in the Boshin War"
    modifier_imperial_restoration:0 "Imperial Restoration"

    tyrone_boshin.1.t:0 "The Southwestern Domains Rally"
    tyrone_boshin.1.d:0 "The imperial cause has found its strongest champions in the southwest. Led by Satsuma and Choshu, its supporters rally samurai, gather supplies, and muster troops in the Emperor's name. From the ports of Kyushu to the roads of Chugoku, preparations quicken for the struggle against the Tokugawa."
    tyrone_boshin.1.f:0 "For generations, the great houses of the southwest stood apart from the Tokugawa order, their pride undiminished by their exclusion from its highest councils. Now old rivals march beneath a common banner. Rifles are drawn from storehouses, messengers hurry between castle towns, and men who once bowed to Edo turn their eyes toward Kyoto."
    tyrone_boshin.1.a:0 "For the Emperor and the restoration!"

 # From tyrone_ems_dispatch_l_english.yml
 tyrone_ems_dispatch:0 "Publish the Ems Dispatch"

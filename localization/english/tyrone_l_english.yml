    je_ostend_spain_rejects_button:0 "Reject American Interference"
    je_ostend_spain_rejects_button_desc:0 "Spain will not be lectured on the governance of its colonies by upstart republican powers. These negotiations are over."
    je_ostend_cuba_liberation_button:0 "Support Cuban Liberation"
    je_ostend_cuba_liberation_button_desc:0 "Cuba's future lies beyond Spanish rule — whether as a free nation or under American protection, we cast our lot with those who would see us free."
    je_ostend_cuba_spain_button:0 "Maintain Loyalty to Spain"
    je_ostend_cuba_spain_button_desc:0 "Whatever grievances we hold, Cuba's fortunes are bound to the Spanish Crown. We will not invite foreign intervention into our affairs."
    je_ostend_manifesto_reason:0 "\"Cuba and Porto Rico are natural appendages to the North American continent... their possession would round out our dominion and give us command of the Gulf.\"\n#b — Alfred Thayer Mahan, The Interest of America in Sea Power, 1897#!\n\n#low The United States and Spain are engaged in a delicate diplomatic contest over the future of Cuba and Puerto Rico. American ambitions in the Caribbean have brought Washington into direct confrontation with Madrid — whether this dispute is resolved through negotiation, purchase, or the collapse of talks entirely remains to be seen.#!"


    canada_australia_rejoin_decision:0 "Rejoin the British Sphere"
    canada_australia_rejoin_decision_desc:0 "The Empire may have loosened its grip, but history, commerce, and kinship still bind us to #v $GBR$#!. By accepting the return of British influence, we secure diplomatic backing and renewed access to imperial markets — not as a subject reclaimed, but as a partner choosing stability over isolation."
    commonwealth_member_request_independence_decision:0 "Seek Dominion Independence"
    commonwealth_member_request_independence_decision_desc:0 "The bonds between ourselves and the Crown remain strong, yet the time may have come to place our relationship upon a new footing. Through negotiation and mutual understanding, we shall seek recognition as a fully sovereign nation while remaining within the Commonwealth of Nations."

    gbr_commonwealth_events.50.t:0 "A Dominion Seeks Its Own Path"

    gbr_commonwealth_events.50.d:0 "[SCOPE.sCountry('commonwealth_independence_requester').GetName] has formally petitioned His Majesty's Government for recognition as a fully sovereign state. While affirming its loyalty to the Commonwealth and its shared heritage with [ROOT.GetCountry.GetName], its leaders contend that the affairs of their nation ought now to be directed without constitutional subordination to Westminster."

    gbr_commonwealth_events.50.f:0 ""The Commonwealth was not founded to preserve dependency, but to strengthen friendship among free nations. We seek not to sever old ties, but to redefine them. Let us remain partners in purpose, though equal in standing.""

    gbr_commonwealth_events.50.a:0 "Grant their sovereignty."
    gbr_commonwealth_events.50.b:0 "The Empire must remain united."


    tyrone_ai_build_trade_center_for_shortages:0 "Expand Trade Center"
    tyrone_ai_build_trade_center_for_shortages_desc:0 "Expand the market capital's trade center when the market is suffering multiple goods shortages."
    tri_annex_libyan_unrecognized:0 "Annex Libyan Minor"
    tri_annex_libyan_unrecognized_desc:0 "Begin an annexation diplomatic play against an independent unrecognized country in Tripoli, the Libyan Desert, or Libya."

    je_ostend_manifesto_complete_pco_tt:0 "Puerto Rico is an American subject or is no longer under Spanish rule."

    usa_alaskan_gold_rush_decision:0 "Prospect the Alaskan Goldfields"
    usa_alaskan_gold_rush_decision_desc:0 "American control over Alaska has opened the way for organized prospecting across the northern frontier. If Alaska remains under a local subject administration, it will be brought directly into the Union before the goldfields are developed."
    usa_admit_hawaii_state_decision:0 "Admit Hawaii as a State"
    usa_admit_hawaii_state_decision_desc:0 "With Hawaii fully under American control and equal citizenship enshrined in law, the islands can be admitted into the Union as an incorporated state."
    usa_ai_annex_collapsed_mexico:0 "Annex Collapsed Mexico"
    usa_ai_annex_collapsed_mexico_desc:0 "Begin an annexation diplomatic play against Mexico if it has fallen to insignificant power status and controls fewer than ten states."
    usa_transfer_newfoundland_to_canada:0 "Annex the Union of Canada"
    usa_transfer_newfoundland_to_canada_desc:0 "British authority in Canada has been broken, yet Newfoundland remains a final outpost of imperial rule on the continent. By removing the British administration and transferring the island to Ottawa, we can complete the territorial consolidation of Canada and integrate it into the American state."
    usa_claim_idaho_decision:0 "Press the Idaho Claim"
    usa_claim_idaho_decision_desc:0 "American settlement in Idaho has left the territory divided. We should formalize our claim to the remainder of the state."

    # Ostend Manifesto — Event Chain
    ostend_manifesto.1.t:0 "The American Offer"
    ostend_manifesto.1.d:0 "An envoy has arrived in Madrid bearing a remarkable proposal from Washington: the United States wishes to purchase Cuba outright for the sum of five million dollars. The offer is audacious — but Spain's coffers are not what they once were, and the Americans are not known for making offers they do not intend to press."
    ostend_manifesto.1.f:0 "The fate of Cuba may be decided not on a battlefield, but across a negotiating table."
    ostend_manifesto.1.a:0 "Accept — Five Million for Cuba"
    ostend_manifesto.1.b:0 "Counter — Seven and a Half Million"
    ostend_manifesto.1.c:0 "Refuse — Cuba Is Not For Sale"

    ostend_manifesto.2.t:0 "Spain's Counteroffer"
    ostend_manifesto.2.d:0 "Spain has declined the initial offer, but has not slammed the door entirely. Madrid's reply arrives: seven and a half million dollars, and not a cent less. The question now falls to Washington — is Cuba worth the price?"
    ostend_manifesto.2.f:0 "Diplomacy is a game of patience. Spain has raised the stakes."
    ostend_manifesto.2.a:0 "Accept the Counteroffer — Seven and a Half Million"
    ostend_manifesto.2.b:0 "Reject the Counteroffer"

    ostend_manifesto.3.t:0 "The Treaty of Havana"
    ostend_manifesto.3.d:0 "With the price agreed upon, the ink is nearly dry — but one final question remains unanswered. Cuba has been purchased from Spain. Now the United States must determine what Cuba will become. The island's people, its geography, and the weight of American principles all demand an answer."
    ostend_manifesto.3.f:0 "How the United States treats Cuba will define its character as a hemispheric power for generations to come."
    ostend_manifesto.3.a:0 "Grant Cuba Full Sovereignty"
    ostend_manifesto.3.b:0 "Establish an American Protectorate"
    ostend_manifesto.3.c:0 "Incorporate Cuba as a Colony"

    # Ostend Manifesto — Puerto Rico Offer Event Chain
    je_ostend_offer_pco_button:0 "Make an Offer for Puerto Rico"
    je_ostend_offer_pco_button_desc:0 "Approach Spain with a formal offer to purchase Puerto Rico. The island's strategic position in the Caribbean makes it a prize worth pursuing through diplomacy."

    ostend_manifesto.4.t:0 "An Offer for Puerto Rico"
    ostend_manifesto.4.d:0 "An American envoy has arrived in Madrid with a proposal to purchase Puerto Rico for seven hundred and fifty thousand dollars. The sum is modest compared to what is asked of Cuba, but the island is smaller, and Washington calculates Spain may be more willing to part with it."
    ostend_manifesto.4.f:0 "Puerto Rico's future may be decided not by arms, but by commerce."
    ostend_manifesto.4.a:0 "Accept — Seven Hundred and Fifty Thousand"
    ostend_manifesto.4.b:0 "Counter — One and a Quarter Million"
    ostend_manifesto.4.c:0 "Refuse — Puerto Rico Is Not For Sale"

    ostend_manifesto.5.t:0 "Spain's Counteroffer — Puerto Rico"
    ostend_manifesto.5.d:0 "Spain has declined the initial offer for Puerto Rico, but signals a willingness to negotiate. Madrid's reply: one and a quarter million dollars, and not a cent less. Washington must now weigh whether the island is worth the price."
    ostend_manifesto.5.f:0 "Spain drives a harder bargain than expected."
    ostend_manifesto.5.a:0 "Accept the Counteroffer — One and a Quarter Million"
    ostend_manifesto.5.b:0 "Reject the Counteroffer"

    ostend_manifesto.6.t:0 "The Treaty of San Juan"
    ostend_manifesto.6.d:0 "The purchase of Puerto Rico is complete. The ink is dry, the price agreed upon — but one question remains. What is Puerto Rico to become under American stewardship? The island's people, its resources, and its place in the Caribbean all demand an answer."
    ostend_manifesto.6.f:0 "The treaty signed in San Juan will shape Puerto Rico's future for generations."
    ostend_manifesto.6.a:0 "Grant Puerto Rico Full Sovereignty"
    ostend_manifesto.6.b:0 "Establish an American Protectorate"
    ostend_manifesto.6.c:0 "Incorporate Puerto Rico as a Colony"

    # Congo Free State
    bel_become_congo_free_state:0 "Establish the Congo Free State"
    bel_become_congo_free_state_desc:0 "With Belgium's European territories lost and the government established in Lower Congo, we can transform the remnants of the Belgian state into the Congo Free State."
    bel_congo_free_state_expansion_modifier:0 "Congo Frontier Administration"
    bel_congo_free_state_expansion_modifier_desc:0 "The relocated administration is directing its resources toward rapidly colonizing and incorporating the Congo frontier."
    colonial_congo_administration_events.1_tt_1:0 "[SCOPE.sCountry('free_state').GetAdjective] [Concept('concept_law', '$concept_laws$')] will be tailored around #bold commerce#! and #bold private enterprise.#!"
    congo_free_state_events.5.c:0 "We will establish a regular colonial administration."
    congo_free_state_events.5.e:0 "Entrust the Congo to the Compagnie du Congo."
    congo_free_state_events.5.g:0 "Maintain the personal union anyways."
    congolese_rubber_modifier:0 "Congolese Rubber Exploitation"
    congo_free_state_merge_subjects:0 "Consolidate the Congo Free State"
    congo_free_state_merge_subjects_desc:0 "Merge any other direct or indirect subjects that hold land in Bas-Congo, Kasai, Equateur, Congo Orientale, or Katanga into the Congo Free State."

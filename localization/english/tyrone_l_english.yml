 # From tyrone_great_power_l_english.yml
 je_tyrone_great_power:0 "A Place among the Great Powers"
 je_tyrone_great_power_reason:0 "Our place in the international order must rest on more than diplomatic recognition. Military strength, industrial power and a populous bloc will secure our standing among the great powers.\n\n#b The Great Power Agenda#!\nObjectives are scored when this [concept_journal_entry] concludes; fulfilled conditions must still hold at that time.\n• [ROOT.GetCountry.GetCustom('tyr_gp_rank_checkbox')] Be ranked among the #v top 5#! Great Powers.\n• [ROOT.GetCountry.GetCustom('tyr_gp_army_checkbox')] Be among the #v top 4#! countries by [concept_army_power_projection].\n• [ROOT.GetCountry.GetCustom('tyr_gp_navy_checkbox')] Be among the #v top 4#! countries by [concept_naval_power_projection].\n• [ROOT.GetCountry.GetCustom('tyr_gp_population_checkbox')] Increase our population by #v 50%#! from its size when this programme began.\n• [ROOT.GetCountry.GetCustom('tyr_gp_gdp_checkbox')] Have one of the #v top 5#! economies by [concept_gdp].\n• [ROOT.GetCountry.GetCustom('tyr_gp_industry_checkbox')] Be a #v top 3#! producer of [GetGoods('glass').GetName], [GetGoods('steel').GetName] or [GetGoods('tools').GetName].\n• [ROOT.GetCountry.GetCustom('tyr_gp_resources_checkbox')] Be a #v top 3#! producer of [GetGoods('coal').GetName], [GetGoods('iron').GetName], [GetGoods('lead').GetName] or [GetGoods('sulfur').GetName].\n• [ROOT.GetCountry.GetCustom('tyr_gp_economy_checkbox')] Enact [GetLawType('law_state_capitalism').GetName], [GetLawType('law_cooperative_ownership').GetName] or [GetLawType('law_laissez_faire_plus').GetName].\n• [ROOT.GetCountry.GetCustom('tyr_gp_citizenship_checkbox')] Enact [GetLawType('law_ethnostate').GetName] or [GetLawType('law_multicultural').GetName].\n• [ROOT.GetCountry.GetCustom('tyr_gp_bloc_population_checkbox')] Lead a [concept_power_bloc] with more than #v 80 million#! people."
 tyr_gp_status_potential:0 "Become a [concept_great_power] and lead a [concept_power_bloc] to begin. Population growth will be measured from activation."
 tyr_gp_status_active:0 "#b [ROOT.GetCountry.MakeScope.ScriptValue('tyr_gp_objectives_met')|0] / 10#! objectives fulfilled."
 tyr_gp_all_objectives_tt:0 "All #v 10#! Great Power Agenda objectives are fulfilled."
 tyr_gp_completion_header:0 "The Fruits of Ascendancy"
 tyr_gp_reward_tt:0 "[ROOT.GetCountry.GetName] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_gp_national_ascendancy_hover National Ascendancy#! permanently. \nOur current [concept_power_bloc], if any, gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_gp_bloc_ascendancy_hover Bloc Ascendancy#! permanently."
 tyr_gp_failure_tt:0 "Have spent #v 3 consecutive monthly updates#! without leading a [concept_power_bloc]."
 tyr_gp_failed_tt:0 "The programme ends without rewards. A new mandate to pursue it is required before it can begin again."
 tyr_gp_national_ascendancy:0 "National Ascendancy"
 tyr_gp_national_ascendancy_desc:0 "Our achievements have secured a stronger standing in the concert of great powers."
 tyr_gp_national_ascendancy_hover:0 "[GetStaticModifier('tyr_gp_national_ascendancy').GetName|v]\n[GetStaticModifier('tyr_gp_national_ascendancy').GetDesc]\nMultiplied by the number of objectives fulfilled at conclusion."
 tyr_gp_bloc_ascendancy:0 "Bloc Ascendancy"
 tyr_gp_bloc_ascendancy_desc:0 "The achievements of our leading power have given renewed direction to the bloc."
 tyr_gp_bloc_ascendancy_hover:0 "[GetStaticModifier('tyr_gp_bloc_ascendancy').GetName|v]\n[GetStaticModifier('tyr_gp_bloc_ascendancy').GetDesc]\nMultiplied by the number of objectives fulfilled at conclusion."
 tyr_gp_rising_great_power:0 "Rising Great Power"
 je_tyrone_brazil_great_power:0 "The Colossus of the South"
 je_tyrone_brazil_great_power_reason:0 "From the Atlantic ports to the interior, [ROOT.GetCountry.GetName] possesses the lands and people of a continental power. Industry, armed strength and a common civic life must give substance to that promise.\n\n#b The Colossus Agenda#!\nObjectives are scored at conclusion and must still hold at that time.\n• [ROOT.GetCountry.GetCustom('tyr_gp_rank_checkbox')] Stand among the #v top 5#! [Concept('concept_great_power', 'Great Powers')].\n• [ROOT.GetCountry.GetCustom('tyr_gp_army_checkbox')] Rank among the #v top 4#! by [concept_army_power_projection].\n• [ROOT.GetCountry.GetCustom('tyr_gp_navy_checkbox')] Rank among the #v top 4#! by [concept_naval_power_projection].\n• [ROOT.GetCountry.GetCustom('tyr_gp_gdp_checkbox')] Have one of the #v top 5#! economies by [concept_gdp].\n• [ROOT.GetCountry.GetCustom('tyr_gp_economy_checkbox')] Enact [GetLawType('law_state_capitalism').GetName], [GetLawType('law_cooperative_ownership').GetName] or [GetLawType('law_laissez_faire_plus').GetName].\n• [ROOT.GetCountry.GetCustom('tyr_brz_gp_open_society_checkbox')] Enact [GetLawType('law_multicultural').GetName], [GetLawType('law_no_migration_controls').GetName] and [GetLawType('law_total_separation').GetName].\n• [ROOT.GetCountry.GetCustom('tyr_brz_gp_south_america_checkbox')] Form #b United South America#!.\n• [ROOT.GetCountry.GetCustom('tyr_brz_gp_capital_checkbox')] Have more than #v 10 million#! people in our [concept_capital_state].\n• [ROOT.GetCountry.GetCustom('tyr_brz_gp_population_checkbox')] Have at least #v 80 million#! people in our country.\n• [ROOT.GetCountry.GetCustom('tyr_brz_gp_liberties_checkbox')] Enact [GetLawType('law_protected_speech').GetName] or [GetLawType('law_guaranteed_liberties').GetName]."
 tyr_brz_gp_status_potential:0 "Become a [concept_great_power] and lead a [concept_power_bloc] to begin the Brazilian agenda."
 tyr_brz_gp_status_active:0 "#b [ROOT.GetCountry.MakeScope.ScriptValue('tyr_brz_gp_objectives_met')|0] / 10#! objectives fulfilled."
 tyr_brz_gp_all_objectives_tt:0 "All #v 10#! Colossus Agenda objectives are fulfilled."
 tyr_brz_gp_completion_header:0 "The Colossus Takes Its Place"
 tyr_brz_gp_reward_tt:0 "[ROOT.GetCountry.GetName] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_brz_gp_national_ascendancy_hover $tyr_brz_gp_national_ascendancy$#! permanently. \nOur current [concept_power_bloc], if any, gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_brz_gp_bloc_ascendancy_hover $tyr_brz_gp_bloc_ascendancy$#! permanently."
 tyr_brz_gp_national_ascendancy_hover:0 "[GetStaticModifier('tyr_brz_gp_national_ascendancy').GetName|v]\n[GetStaticModifier('tyr_brz_gp_national_ascendancy').GetDesc]\nMultiplied by the number of objectives fulfilled at conclusion."
 tyr_brz_gp_bloc_ascendancy_hover:0 "[GetStaticModifier('tyr_brz_gp_bloc_ascendancy').GetName|v]\n[GetStaticModifier('tyr_brz_gp_bloc_ascendancy').GetDesc]\nMultiplied by the number of objectives fulfilled at conclusion."
 tyr_brz_gp_failure_tt:0 "Have spent #v 3 consecutive monthly updates#! without leading a [concept_power_bloc]."
 tyr_brz_gp_failed_tt:0 "The Brazilian programme ends without completion rewards. Its Journal Entry modifiers expire with it."
 tyr_brz_gp_colossus_awakening:0 "The Awakening Colossus"
 tyr_brz_gp_national_ascendancy:0 "The Southern Ascendancy"
 tyr_brz_gp_national_ascendancy_desc:0 "The achievements of our people have established a lasting place for the nation among the great powers."
 tyr_brz_gp_bloc_ascendancy:0 "A Continental Purpose"
 tyr_brz_gp_bloc_ascendancy_desc:0 "The rise of our leading power has given the bloc a shared sense of purpose."
 tyr_great_power.1.t:0 "The Colossus Awakens"
 tyr_great_power.1.d:0 "The newspapers of [ROOT.GetCountry.GetName] speak with a new confidence. Merchants look beyond the Atlantic, officers study the fleets of distant [Concept('concept_great_power', 'Great Powers')], and families arriving at our ports imagine a country still being built. Across the provinces, the same question is asked: what place shall this vast nation claim in the world?"
 tyr_great_power.1.f:0 ""We have been called a sleeping giant so often that some have mistaken sleep for our natural condition. Let them come to the quays at dawn, to the workshops after dusk, to the roads where another town is rising. A #bold #green colossus#!#! does not awaken with a single step, but with the footsteps of its people.""
 tyr_great_power.1.a:0 "Let the world look south."
 tyr_gp_failed_ambitions:0 "Great Power Ambitions Shattered"
 rule_tyr_gp_countries:0 "Great Power Journal Entries"
 setting_tyr_gp_countries_default:0 "Spain, Brazil, Netherlands, Sweden, Denmark"
 setting_tyr_gp_countries_default_desc:0 "Enables Great Power Journal Entries for player-controlled Spain, Brazil, the Netherlands, Sweden and Denmark."
 setting_tyr_gp_countries_nobody:0 "Nobody"
 setting_tyr_gp_countries_nobody_desc:0 "Disables Great Power Journal Entries for every country."
 setting_tyr_gp_countries_spain_brazil:0 "Spain, Brazil"
 setting_tyr_gp_countries_spain_brazil_desc:0 "Enables Great Power Journal Entries only for player-controlled Spain and Brazil."
 setting_tyr_gp_countries_with_japan:0 "Spain, Brazil, Netherlands, Sweden, Denmark, Japan"
 setting_tyr_gp_countries_with_japan_desc:0 "Enables Great Power Journal Entries for player-controlled Spain, Brazil, the Netherlands, Sweden, Denmark and Japan."

 # From tyrone_komei_l_english.yml
 tyrone_komei.1.t: "The Emperor's Final Illness"
 tyrone_komei.1.d: "Emperor Komei has fallen gravely ill with smallpox. Within the imperial palace in Kyoto, physicians attend the sovereign as the court awaits word of his condition. His reign has witnessed the arrival of foreign fleets and mounting discord over Japan's future. Should he succumb, his young son, Prince Mutsuhito, will inherit the throne amid a deepening crisis."
 tyrone_komei.1.a: "The Emperor is dead. Prince Mutsuhito shall succeed him."
 tyrone_komei.1.b: "His Majesty has survived the illness."
 tyrone_komei_survives_tt: "Emperor Komei survives smallpox, but the disease leaves him scarred. He remains on the throne and may still die naturally."

 # From tyrone_ninko_l_english.yml
 tyrone_ninko.1.t: "The Emperor's Final Illness"
 tyrone_ninko.1.d: "Within the imperial palace in Kyoto, Emperor Ninko lies gravely ill. Devoted to court ceremony and classical learning, he has sought to preserve the traditions of the throne while the Tokugawa shogunate governs from Edo. His cherished project, a school for the education of the court nobility, remains unfinished. As his condition worsens, the courtiers turn toward his son and heir, Prince Osahito, who may soon inherit both the throne and his father's unfinished work."
 tyrone_ninko.1.a: "The Emperor is dead. May his son carry on his work."
 tyrone_ninko.1.b: "His Majesty recovers. His work is not yet finished."
 tyrone_ninko_survives_tt: "Emperor Ninko survives his illness and remains on the throne. He may still die naturally."

 # From tyrone_secession_l_english.yml
 tyrone_secession.1.t:0 "Secession Defeated"
 tyrone_secession.1.d:0 "The defeat of the secessionist revolt has sent a clear message to separatists and would-be agitators across [ROOT.GetCountry.GetName]."
 tyrone_secession.1.f:0 ""The banners are folded. The courts are open. The state endures.""
 tyrone_secession.1.a:0 "Order is restored."
 secession_defeated_cultural_minority_activism:0 "Secession Defeated"
 secession_defeated_cultural_minority_activism_desc:0 "A recently defeated secession has dampened cultural minority activism."


 tyr_gir_de.1.t:0 "The Mountain Gives Way"
 tyr_gir_de.1.d:0 "The surveyor’s chalk marks disappear into a seam that hand tools have scarcely scratched. Below ground, the miners have begun asking for dynamite; above it, the company directors are already counting the ore. Engineers propose new shafts, heavier blasting, or further chemical research. The men carrying the charges would like to know which proposal includes their safe return."
 tyr_gir_de.1.f:0 "After the blast, nobody speaks until the last lamp comes back into view."
 tyr_gir_de.1.1:0 "Open new shafts."
 tyr_gir_de.1.2:0 "Intensify the extractions."
 tyr_gir_de.1.3:0 "Finance explosives laboratories."

 tyr_gir_de.2.t:0 "Chemistry in the Fields"
 tyr_gir_de.2.d:0 "Two strips of the same field have produced strikingly different crops. An agronomist credits the fertilizer; the estate steward credits the weather. Their argument has brought neighbouring farmers to the boundary ditch, where samples of soil now pass from hand to hand. Before the new chemistry can conquer the countryside, someone must pay to prove it beyond this fortunate patch."
 tyr_gir_de.2.f:0 "The steward weighs a handful of earth as though the answer might be heavier than the question."
 tyr_gir_de.2.1:0 "Establish agronomic stations."
 tyr_gir_de.2.2:0 "Extend credit for machinery."
 tyr_gir_de.2.3:0 "Support the fertilized harvest."

 tyr_gir_de.3.t:0 "The Transformation of the Countryside"
 tyr_gir_de.3.d:0 "A threshing engine has arrived in a village where the harvest was once measured in days of flailing. Farmers gather to inspect its belts and argue over fertilizer deliveries. The promise is plain enough; the difficulty lies in credit, repairs, and habits inherited with the land. What succeeds on one enterprising estate must still find its way into ordinary farming."
 tyr_gir_de.3.f:0 "By dusk, the yard is white with chaff. The old threshers linger to watch the machine stop."
 tyr_gir_de.3.1:0 "Begin the transformation."
 tyr_gir_de.3.2:0 "Leave adoption to the farmers."

 tyr_gir_de.4.t:0 "The Steelworks Contract"
 tyr_gir_de.4.d:0 "The steelmakers have laid their estimates beside a sample rail polished bright enough to reflect the minister’s face. New furnaces would let them accept larger orders, but no director wishes to fire a works that might stand idle next winter. They ask the government to decide how much of their confidence it is willing to underwrite."
 tyr_gir_de.4.f:0 "The sample rail leaves a dark mark across the minister’s blotter."
 tyr_gir_de.4.1:0 "Guarantee public orders."
 tyr_gir_de.4.2:0 "Finance modern furnaces."
 tyr_gir_de.4.3:0 "Let private capital lead."

 tyr_gir_de.5.t:0 "The Laboratory Beside the Factory"
 tyr_gir_de.5.d:0 "A factory chemist has brought a stained notebook to a gathering of university scholars. Several pages describe results no textbook explains; the professors, in turn, can explain why half the experiments failed. The Chancellor sees an opportunity to give these conversations a permanent home. The proposed institute must now choose between pursuing new processes and teaching the people who will use them."
 tyr_gir_de.5.f:0 "An assistant quietly rescues the notebook before the refreshments are poured over it."
 tyr_gir_de.5.1:0 "Pursue industrial chemistry."
 tyr_gir_de.5.2:0 "Pursue mechanical engineering."
 tyr_gir_de.5.3:0 "Train the next generation."

 tyr_gir_de.6.t:0 "Conditions in the Workshops"
 tyr_gir_de.6.d:0 "A physician in [SCOPE.sState('tyr_gir_de_state').GetName] has begun recording occupations beside the names of injured patients. The same workshops appear again and again. Owners dispute the conclusions, citing careless hands and unavoidable accidents; workers describe belts repaired with scraps and shifts too long to remain alert. The report has reached the government with a bundle of petitions attached."
 tyr_gir_de.6.f:0 "The physician’s ledger has a column for age. Some entries are painfully short."
 tyr_gir_de.6.1:0 "Inspect the factories."
 tyr_gir_de.6.2:0 "Compensate the workers."
 tyr_gir_de.6.3:0 "Maintain the production schedule."

 tyr_gir_de.7.t:0 "The Countryside Holds Its Men"
 tyr_gir_de.7.d:0 "Letters from the industrial towns are being read aloud in village kitchens. They tell of wages paid in cash, crowded rooms, and work that continues through the winter. Estate owners complain that the most able farmhands are leaving first. Manufacturers answer that the countryside cannot claim a lifetime’s service from every child born within sight of its fields."
 tyr_gir_de.7.f:0 "The railway fare lies beneath a plate, counted twice before supper."
 tyr_gir_de.7.1:0 "Support the rural communities."
 tyr_gir_de.7.2:0 "Help workers reach the factories."
 tyr_gir_de.7.3:0 "Finance agricultural machinery."

 tyr_gir_de.8.t:0 "Orders from the General Staff"
 tyr_gir_de.8.d:0 "An officer has covered the conference table with ammunition returns and transport estimates. The General Staff wants weapons delivered in predictable quantities, while the engineers insist that engines deserve equal attention. Both expect the government to make the factories listen. A commitment made in this room will be remembered whenever the next military account comes due."
 tyr_gir_de.8.f:0 "The officer taps a blank space in the returns. No regiment can march on that."
 tyr_gir_de.8.1:0 "Guarantee the weapons contracts."
 tyr_gir_de.8.2:0 "Give priority to engines."
 tyr_gir_de.8.3:0 "Preserve the civilian programme."

 je_tyr_gir_de_trial:0 "Agronomic Stations"
 je_tyr_gir_de_trial_reason:0 "Across the German countryside, farmers still rely on methods inherited from their fathers. Agronomic stations can bring the discoveries of chemistry from the laboratory to the fields."
 je_tyr_gir_de_trial_status:0 "Fertilized cereal-farm levels: #v [ROOT.GetCountry.MakeScope.ScriptValue('tyr_gir_de_fertilized_share')|0]%#! / #v 50%#!."

 je_tyr_gir_de_agriculture:0 "The Transformation of the Countryside"
 je_tyr_gir_de_agriculture_reason:0 "Beyond the growing factory towns, many German fields are still worked with the tools and customs of earlier generations. Poor harvests bind the countryside to poverty.\n\nNew methods must take root if the land is to share in Germany’s prosperity."
 je_tyr_gir_de_agriculture_status:0 "Modern cereal-farm levels: #v [ROOT.GetCountry.MakeScope.ScriptValue('tyr_gir_de_modern_share')|0]%#! / 70%. Sustained adoption: #v [ROOT.GetCountry.MakeScope.ScriptValue('tyr_gir_de_adoption_months')|0] / 24#! months."

 tyr_gir_de.21.t:0 "The Trial Bears Fruit"
 tyr_gir_de.21.d:0 "Fertilization has passed from demonstration plots into common use. The agronomic stations have earned their support."
 tyr_gir_de.21.a:0 "The report is received."

 tyr_gir_de.22.t:0 "An Inconclusive Harvest"
 tyr_gir_de.22.d:0 "Too few farms adopted the new methods. The trial has ended without a sector-level reward."
 tyr_gir_de.22.a:0 "The report is received."

 tyr_gir_de.23.t:0 "A Transformed Countryside"
 tyr_gir_de.23.d:0 "Modern cultivation has endured beyond the first demonstrations. Its improvements now form a lasting foundation for our agricultural economy."
 tyr_gir_de.23.a:0 "The report is received."

 tyr_gir_de.24.t:0 "The Programme Falls Short"
 tyr_gir_de.24.d:0 "The deadline has passed before modern cultivation became sufficiently widespread and sustained. No permanent agricultural bonus is granted."
 tyr_gir_de.24.a:0 "The report is received."


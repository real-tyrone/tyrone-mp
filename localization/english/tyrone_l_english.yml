 tyr_americas.70.a:0 "Unite these lands with the monarchy."
 tyr_americas.70.a_tt:0 "Annex all our subjects with capitals in the Journal regions, #bold except Brazil#!, with incorporation. Gain their primary cultures. #r This includes player countries.#!"
 tyr_americas.70.b:0 "Entrust South America to Brazil."
 tyr_americas.70.b_tt:0 "Brazil will annex our other subjects with capitals in South America, with incorporation and their primary cultures. Mexico, Cuba and Central America are excluded. #r This includes player countries.#!"
 tyr_americas.70.c:0 "Unite our subjects as Patria Grande."
 tyr_americas.70.c_tt:0 "[ROOT.GetCountry.MakeScope.Var('tyr_am_patria_recipient').GetCountry.GetName] will unite our other regional subjects with incorporation and their primary cultures, becoming Patria Grande under Spanish rule. It receives #tooltippable #tooltip:tyr_am_colonial_administration_hover [GetStaticModifier('colonial_administration').GetName]#!#!. It also receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_patria_economic_colony_hover $resource_extraction_colony_modifier$#! permanently. #r Other player countries may be annexed.#!"
 tyr_americas.70.t:0 "The Settlement of the Americas"
 tyr_americas.70.d:0 "[ROOT.GetCountry.GetName] has secured the continental contest. The future of its American subjects now rests with the Crown."
 tyr_americas.70.f:0 "The maps are settled. The form of government is not."
 tyr_americas.71.a:0 "Open the gates to a new generation."
 tyr_americas.71.a_tt:0 "Adopt a permanent migration settlement."
 tyr_americas.71.b:0 "Put the hemisphere to work."
 tyr_americas.71.b_tt:0 "Adopt a permanent workforce and manufacturing settlement."
 tyr_americas.71.c:0 "Command the seas around our hemisphere."
 tyr_americas.71.c_tt:0 "Adopt a permanent naval settlement."
 tyr_americas.71.t:0 "The Hemisphere Secured"
 tyr_americas.71.d:0 "The Monroe Doctrine has prevailed. [ROOT.GetCountry.GetName] must now decide how to turn continental influence into lasting national strength."
 tyr_americas.71.f:0 "A doctrine defended abroad must find its purpose at home."
 tyr_americas.72.a:0 "Let us build one continental homeland."
 tyr_americas.72.a_tt:0 "Annex our subjects and bloc members with capitals in South America, with incorporation and their primary cultures. Mexico, Cuba and Central America are excluded. #r This includes player countries.#!"
 tyr_americas.72.t:0 "A Continent United"
 tyr_americas.72.d:0 "[ROOT.GetCountry.GetName] has secured every South American region. Its subjects and fellow bloc members can now join a single continental state."
 tyr_americas.72.f:0 "From the mountains to the Atlantic, one horizon."

 # ========== Garibaldi's Thousand Expedition ==========
 ita_garibaldi_thousand_expedition_JE:0 "Garibaldi's Thousand Expedition"
 ita_garibaldi_thousand_expedition_JE_reason:0 "Giuseppe Garibaldi has gathered a band of volunteers, ready to sail south and ignite revolution in the Kingdom of the Two Sicilies. Though few in number, their cause carries the hopes of the nation. If supported, this daring expedition may succeed where armies have failed, bringing the south into the fold of a united Italy."
 garibaldi_expedition_progress_bar_name:0 "Expedition Progress"
 garibaldi_expedition_progress_bar_desc:0 "Italy must be unified at all costs."
 garibaldi_expedition_progress_bar_var_tt:0 "Driven by the expedition event chain."
 ita_garibaldi_prepare_expedition_button:0 "Prepare the Expedition"
 ita_garibaldi_prepare_expedition_button_desc:0 "Set Garibaldi’s expedition in motion, committing the strength of our fleet and army to the southern venture."
 ita_garibaldi_prepare_expedition_navy_tt:0 "Our navy must vastly outmatch that of the Two Sicilies. (2x)"
 ita_garibaldi_prepare_expedition_army_tt:0 "Our army must decisively outnumber the forces of the Two Sicilies (2x)"

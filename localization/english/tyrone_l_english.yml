 tyr_gcol_agenda_reason_active:0 "German merchants and officials look beyond Europe to Africa and the seas of Asia. The colonial programme will be judged by the territories secured and the economies built.\n\n#b The Colonial Agenda:#!\nEach fulfilled objective increases the rewards when this [concept_journal_entry] is concluded.\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_1')] Deutsche Mittelafrika and Deutsche Ostasien both exist as German [Concept('concept_subject', '$concept_subjects$')].\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_2')] Deutsche Mittelafrika owns all of [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_togo_scope').GetName], [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_north_cameroon_scope').GetName] and [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_south_cameroon_scope').GetName].\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_3')] Deutsche Mittelafrika owns all of [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_zanzibar_scope').GetName], [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_tanganyika_scope').GetName] and [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_lindi_scope').GetName].\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_4')] Deutsche Mittelafrika owns all of [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_congo_orientale_scope').GetName], [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_ubangi_shari_scope').GetName] and [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_equateur_scope').GetName].\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_5')] Deutsche Ostasien owns all of [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_malaya_scope').GetName] and [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_north_borneo_scope').GetName].\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_6')] Deutsche Ostasien owns all of [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_eastern_new_guinea_scope').GetName] and [JournalEntry.GetTopScope.sStateRegion('tyr_gcol_solomon_islands_scope').GetName].\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_7')] Deutsche Mittelafrika has at least #v £50M#! [concept_gdp]. Currently: #v £[JournalEntry.GetCountry.MakeScope.ScriptValue('tyr_gcol_maf_gdp')|0]#!.\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_8')] Deutsche Ostasien has at least #v £50M#! [concept_gdp]. Currently: #v £[JournalEntry.GetCountry.MakeScope.ScriptValue('tyr_gcol_dea_gdp')|0]#!.\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_9')] Deutsche Mittelafrika has at least #v 100#! plantation [Concept('concept_building_level', '$concept_building_levels$')]. Currently: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('tyr_gcol_maf_plantations')|0] / 100#!.\n• [JournalEntry.GetCountry.GetCustom('tyr_gcol_checkbox_10')] Deutsche Ostasien has at least #v 50#! [GetBuildingType('building_rubber_plantation').GetName] levels. Currently: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('tyr_gcol_dea_rubber')|0] / 50#!.\n\n#b [JournalEntry.GetCountry.MakeScope.ScriptValue('tyr_gcol_objectives_met')|0] / 10#! objectives fulfilled. Use #v Conclude the Colonial Programme#! to lock in the rewards."


 tyr_gir_ch_105_menu:0 "@tyr_gir_trait_expert_political_operator! #O #tooltippable The Industrial Compromise#!#!"

 tyr_gir_ch.106.t:0 "The Ministerial System"
 tyr_gir_ch.106.d:0 "A district administrator receives instructions that answer the very question sent to the capital the week before. Similar reports arrive from elsewhere. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] has spent months bringing ministers and provincial officials into a working confidence, matching responsibilities to people who can carry them out. The change is quiet, but its effects are becoming visible wherever industrial policy meets an office door."
 tyr_gir_ch.106.a:0 "Let every office carry its share."

 tyr_gir_ch_106_modifier:0 "The Ministerial System"

 tyr_gir_ch_106_reward:0 "#g +200#! [concept_authority]\n#g +20%#! [concept_bureaucracy]\nLasts until the main [concept_journal_entry] ends."


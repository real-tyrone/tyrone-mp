 tyr_gir_de_agricultural_level_reward_tt:0 "#g +1#! Agricultural Development (maximum level #v 5#!)."

 tyr_gir_de_agricultural_level_cap_tt:0 "Agricultural Development is already at its maximum level (#v 5#!)."

 tyr_gir_ch.1.t:0 "A More Ambitious Schedule"
 tyr_gir_ch.1.d:0 "The industrial schedule returns from [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName]’s desk covered in fresh annotations. A district dismissed as unpromising now has a proposed works; a modest undertaking has acquired a second wing. The officials responsible for finding contractors study the additions in silence. The Chancellor’s ambitions have grown, but the date at the bottom of the page remains unchanged."
 tyr_gir_ch.1.a:0 "Add the orders."

 tyr_gir_ch_1_modifier:0 "A More Ambitious Schedule"

 tyr_gir_ch_1_reward:0 "#r +10#! required building levels in the current programme. The deadline and sector reward are unchanged.\n#g +5%#! [concept_prestige] for #v 1 year#!."

 tyr_gir_ch_1_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_1_cooldown'))]"

 tyr_gir_ch_1_hover:0 "#bold A More Ambitious Schedule#!\n[Country.GetCustom('tyr_gir_ch_1_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_1_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('ambitious').GetName].\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_1_plan_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] A three-year investment programme is underway.\n\n#bold Effects:#!\n$tyr_gir_ch_1_reward$\nMay decline.\n\n#g Repeatable#!"
 tyr_gir_ch_1_menu:0 "@tyr_gir_trait_ambitious! #v #tooltippable A More Ambitious Schedule#!#!"

 tyr_gir_ch.1.b:0 "Keep to the existing arrangements."

 tyr_gir_ch.2.t:0 "Every Invoice Accounted For"
 tyr_gir_ch.2.d:0 "A contractor has billed two departments for the same delivery of timber. It might have passed unnoticed had [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] not asked why two distant works required precisely the same quantity on precisely the same day. The discovery sends clerks back through months of invoices. Some of the nation’s most expensive building materials, it appears, have never left a ledger."
 tyr_gir_ch.2.a:0 "Circulate the revised accounts."

 tyr_gir_ch_2_modifier:0 "Every Invoice Accounted For"

 tyr_gir_ch_2_reward:0 "#g +5%#! [concept_construction] efficiency for #v 1 year#!."

 tyr_gir_ch_2_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_2_cooldown'))]"

 tyr_gir_ch_2_hover:0 "#bold Every Invoice Accounted For#!\n[Country.GetCustom('tyr_gir_ch_2_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_2_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('meticulous').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_2_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_2_menu:0 "@tyr_gir_trait_meticulous! #v #tooltippable Every Invoice Accounted For#!#!"

 tyr_gir_ch.3.t:0 "Friends in Committee"
 tyr_gir_ch.3.d:0 "The new committee lists contain several names familiar to [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName]. These are people who answer letters promptly, know which provincial official can settle a dispute, and remember who secured their appointment. Opponents call the arrangement favouritism. Its beneficiaries prefer to speak of experience, continuity, and the importance of entrusting industrial affairs to reliable hands."
 tyr_gir_ch.3.a:0 "Put their experience to work."

 tyr_gir_ch_3_modifier:0 "Friends in Committee"

 tyr_gir_ch_3_reward:0 "The Chancellor’s [concept_interest_group] gains #g +10%#! political strength and #g +2#! [concept_approval] for #v 1 year#!."

 tyr_gir_ch_3_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_3_cooldown'))]"

 tyr_gir_ch_3_hover:0 "#bold Friends in Committee#!\n[Country.GetCustom('tyr_gir_ch_3_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_3_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('expert_political_operator').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_3_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_3_menu:0 "@tyr_gir_trait_expert_political_operator! #v #tooltippable Friends in Committee#!#!"

 tyr_gir_ch.4.t:0 "A Firm Instruction"
 tyr_gir_ch.4.d:0 "Two ministries have spent weeks disputing whose seal belongs on an industrial order. Each can produce regulations proving the other responsible. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] summons both files, crosses out the competing instructions, and issues a single ruling. By the afternoon, the clerks have discovered that the matter is considerably less complicated than their correspondence suggested."
 tyr_gir_ch.4.a:0 "The instruction stands."

 tyr_gir_ch_4_modifier:0 "A Firm Instruction"

 tyr_gir_ch_4_reward:0 "#g +25#! [concept_authority] for #v 1 year#!."

 tyr_gir_ch_4_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_4_cooldown'))]"

 tyr_gir_ch_4_hover:0 "#bold A Firm Instruction#!\n[Country.GetCustom('tyr_gir_ch_4_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_4_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('imperious').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_4_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_4_menu:0 "@tyr_gir_trait_imperious! #v #tooltippable A Firm Instruction#!#!"

 tyr_gir_ch.5.t:0 "An Evening Demonstration"
 tyr_gir_ch.5.d:0 "The apparatus coughs, shudders, and finally begins to turn. An inventor invited by [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] looks ready to apologise, but the engineers in attendance have crowded forward to inspect a small improvement in its mechanism. University lecturers join the argument. The evening’s polite exhibition has become an impromptu seminar, and nobody is looking at the supper table."
 tyr_gir_ch.5.a:0 "Let the universities continue the work."

 tyr_gir_ch_5_modifier:0 "An Evening Demonstration"

 tyr_gir_ch_5_reward:0 "#g +10%#! University [concept_throughput] for #v 1 year#!."

 tyr_gir_ch_5_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_5_cooldown'))]"

 tyr_gir_ch_5_hover:0 "#bold An Evening Demonstration#!\n[Country.GetCustom('tyr_gir_ch_5_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_5_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('innovative').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_5_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_5_menu:0 "@tyr_gir_trait_innovative! #v #tooltippable An Evening Demonstration#!#!"

 tyr_gir_ch.6.t:0 "Letters of Introduction"
 tyr_gir_ch.6.d:0 "A manufacturer who could not obtain an appointment last month now finds three financiers willing to receive a visit. The difference is a letter from [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName], brief enough to carry no promises and influential enough to require no further explanation. Plans for new workshops emerge from drawers where they had lain untouched since their last rejection."
 tyr_gir_ch.6.a:0 "Let the partners negotiate."

 tyr_gir_ch_6_modifier:0 "Letters of Introduction"

 tyr_gir_ch_6_reward:0 "#g +5%#! Capitalist [concept_investment_pool] contribution efficiency for #v 1 year#!."

 tyr_gir_ch_6_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_6_cooldown'))]"

 tyr_gir_ch_6_hover:0 "#bold Letters of Introduction#!\n[Country.GetCustom('tyr_gir_ch_6_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_6_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('expert_entrepreneur').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_6_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_6_menu:0 "@tyr_gir_trait_expert_entrepreneur! #v #tooltippable Letters of Introduction#!#!"

 tyr_gir_ch.7.t:0 "At the Factory Gates"
 tyr_gir_ch.7.d:0 "The factory whistle has scarcely fallen silent when [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] begins addressing the workers gathered at the gates. The speech dwells on the hands behind Germany’s prosperity rather than the names above its company offices. A few listeners keep their arms folded. Others repeat the Chancellor’s words on the walk home, pleased to have heard their own lives mentioned."
 tyr_gir_ch.7.a:0 "Their work deserves recognition."

 tyr_gir_ch_7_reward:0 "#g +2%#! [Concept('concept_loyalist', '$concept_loyalists$')] in the [Concept('concept_tyr_gir_industrial_area', '$concept_tyr_gir_industrial_area$')]."

 tyr_gir_ch_7_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_7_cooldown'))]"

 tyr_gir_ch_7_hover:0 "#bold At the Factory Gates#!\n[Country.GetCustom('tyr_gir_ch_7_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_7_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('charismatic').GetName].\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_7_states_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] Eligible [Concept('concept_state', '$concept_states$')] in the [Concept('concept_tyr_gir_industrial_area', '$concept_tyr_gir_industrial_area$')].\n\n#bold Effects:#!\n$tyr_gir_ch_7_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_7_menu:0 "@tyr_gir_trait_charismatic! #v #tooltippable At the Factory Gates#!#!"

 tyr_gir_ch.8.t:0 "Before the Next Shift"
 tyr_gir_ch.8.d:0 "A foreman has tied a strip of cloth around a cracked fitting so that nobody can claim to have overlooked it. The report reaches [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] alongside assurances that production need not be interrupted. The Chancellor asks for an inspection before the machinery starts again. A fault described as minor in the office looks rather different beside the moving belt."
 tyr_gir_ch.8.a:0 "Attend to the hazards."

 tyr_gir_ch_8_modifier:0 "Before the Next Shift"

 tyr_gir_ch_8_reward:0 "#g −5%#! manufacturing mortality for #v 1 year#!."

 tyr_gir_ch_8_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_8_cooldown'))]"

 tyr_gir_ch_8_hover:0 "#bold Before the Next Shift#!\n[Country.GetCustom('tyr_gir_ch_8_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_8_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('cautious').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_8_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_8_menu:0 "@tyr_gir_trait_cautious! #v #tooltippable Before the Next Shift#!#!"

 tyr_gir_ch.9.t:0 "The Unfinished Files"
 tyr_gir_ch.9.d:0 "Industrial petitions have accumulated in a cupboard whose key nobody seems eager to produce. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] orders the oldest bundle opened. Inside are requests for permissions, corrections, and answers to questions that have outlived the clerks who first received them. The Chancellor demands replies. Across the administration, forgotten files begin making an unwelcome return to the desks of their owners."
 tyr_gir_ch.9.a:0 "Clear the remaining files."

 tyr_gir_ch_9_modifier:0 "The Unfinished Files"

 tyr_gir_ch_9_reward:0 "#g +5%#! [concept_bureaucracy] for #v 1 year#!."

 tyr_gir_ch_9_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_9_cooldown'))]"

 tyr_gir_ch_9_hover:0 "#bold The Unfinished Files#!\n[Country.GetCustom('tyr_gir_ch_9_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_9_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('persistent').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_9_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_9_menu:0 "@tyr_gir_trait_persistent! #v #tooltippable The Unfinished Files#!#!"

 tyr_gir_ch.10.t:0 "A Quiet Understanding"
 tyr_gir_ch.10.d:0 "The guests arrive separately and leave without a statement. Between their arrivals, [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] hears the grievances dividing the government’s supporters: a slight at a reception, an overlooked appointment, a promise remembered differently by each party. By evening, the quarrel has acquired a solution nobody needs to defend in public."
 tyr_gir_ch.10.a:0 "Keep the agreement discreet."

 tyr_gir_ch_10_modifier:0 "A Quiet Understanding"

 tyr_gir_ch_10_reward:0 "The Chancellor’s [concept_interest_group] gains #g +2#! [concept_approval] for #v 1 year#!."

 tyr_gir_ch_10_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_10_cooldown'))]"

 tyr_gir_ch_10_hover:0 "#bold A Quiet Understanding#!\n[Country.GetCustom('tyr_gir_ch_10_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_10_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('tactful').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_10_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_10_menu:0 "@tyr_gir_trait_tactful! #v #tooltippable A Quiet Understanding#!#!"

 tyr_gir_ch.11.t:0 "A Manufacturers’ Petition"
 tyr_gir_ch.11.d:0 "The manufacturers’ delegation brings examples rather than speeches: a consignment delayed by contradictory instructions, a permit returned for a missing seal, supplies held while two offices exchange letters. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] listens as the costs accumulate. None of the complaints alone amounts to a national crisis. Together they explain why an ordinary workshop spends so much time waiting."
 tyr_gir_ch.11.a:0 "Accept the practical proposals."

 tyr_gir_ch_11_modifier:0 "A Manufacturers’ Petition"

 tyr_gir_ch_11_reward:0 "#g +5%#! manufacturing [concept_throughput] for #v 1 year#!."

 tyr_gir_ch_11_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_11_cooldown'))]"

 tyr_gir_ch_11_hover:0 "#bold A Manufacturers’ Petition#!\n[Country.GetCustom('tyr_gir_ch_11_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_11_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor follows #v Liberal#! industrial policy.\n\n#bold Effects:#!\n$tyr_gir_ch_11_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_11_menu:0 "#v #tooltippable A Manufacturers’ Petition#!#!"

 tyr_gir_ch.12.t:0 "The Workers’ Delegation"
 tyr_gir_ch.12.d:0 "The workers’ delegates have rehearsed their address, but the first speaker abandons it halfway through. Before [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] lie rent receipts, accounts of injuries, and letters from families whose wages no longer cover the week. The Chancellor hears them out. When the visitors return to their towns, they can at least say that the doors of government opened to them."
 tyr_gir_ch.12.a:0 "There is a place for them at the table."

 tyr_gir_ch_12_reward:0 "#g +2%#! [Concept('concept_loyalist', '$concept_loyalists$')] among Laborers in the [Concept('concept_tyr_gir_industrial_area', '$concept_tyr_gir_industrial_area$')]."

 tyr_gir_ch_12_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_12_cooldown'))]"

 tyr_gir_ch_12_hover:0 "#bold The Workers’ Delegation#!\n[Country.GetCustom('tyr_gir_ch_12_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_12_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor follows #v Socialist#! industrial policy.\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_12_states_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] Eligible [Concept('concept_state', '$concept_states$')] in the [Concept('concept_tyr_gir_industrial_area', '$concept_tyr_gir_industrial_area$')].\n\n#bold Effects:#!\n$tyr_gir_ch_12_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_12_menu:0 "#v #tooltippable The Workers’ Delegation#!#!"

 tyr_gir_ch.13.t:0 "The Provincial Notables"
 tyr_gir_ch.13.d:0 "Provincial notables have arrived with maps, local knowledge, and a careful account of everything that cannot be arranged without their assistance. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] accepts their offer to help carry the industrial programme into the countryside. Their cooperation promises fewer disputes over land and supplies. It also gives the old families another reason to be consulted when the next decision is made."
 tyr_gir_ch.13.a:0 "Accept their assistance."

 tyr_gir_ch_13_modifier:0 "The Provincial Notables"

 tyr_gir_ch_13_reward:0 "Landowners gain #g +10%#! political strength and #g +1#! [concept_approval] for #v 1 year#!."

 tyr_gir_ch_13_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_13_cooldown'))]"

 tyr_gir_ch_13_hover:0 "#bold The Provincial Notables#!\n[Country.GetCustom('tyr_gir_ch_13_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_13_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor follows #v Conservative#! industrial policy.\n\n#bold Effects:#!\n$tyr_gir_ch_13_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_13_menu:0 "#v #tooltippable The Provincial Notables#!#!"

 tyr_gir_ch.14.t:0 "The Officers’ Memorandum"
 tyr_gir_ch.14.d:0 "The officers’ memorandum is short enough to be read before the cabinet convenes. It connects military supply to factory capacity with a clarity that more elaborate industrial petitions have failed to achieve. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] returns a favourable reply. Within days, men in uniform are finding a more attentive audience wherever contracts and production schedules are discussed."
 tyr_gir_ch.14.a:0 "Acknowledge their contribution."

 tyr_gir_ch_14_modifier:0 "The Officers’ Memorandum"

 tyr_gir_ch_14_reward:0 "Armed Forces gain #g +10%#! political strength and #g +1#! [concept_approval] for #v 1 year#!."

 tyr_gir_ch_14_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_14_cooldown'))]"

 tyr_gir_ch_14_hover:0 "#bold The Officers’ Memorandum#!\n[Country.GetCustom('tyr_gir_ch_14_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_14_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor follows #v Militarist#! industrial policy.\n\n#bold Effects:#!\n$tyr_gir_ch_14_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_14_menu:0 "#v #tooltippable The Officers’ Memorandum#!#!"

 tyr_gir_ch.15.t:0 "Credit Where It Is Due"
 tyr_gir_ch.15.d:0 "At a reception celebrating new industrial works, [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] recounts the decisions that made them possible. The account leaves little room for the engineers, officials, and ministers standing nearby. Applause carries the speech to its conclusion. Afterwards, admirers praise the Chancellor’s vision while colleagues privately compare the evening’s story with their own recollections."
 tyr_gir_ch.15.a:0 "The newspapers will print it."

 tyr_gir_ch_15_modifier:0 "Credit Where It Is Due"

 tyr_gir_ch_15_reward:0 "#g +5%#! [concept_prestige] and #r −5#! [concept_legitimacy] for #v 1 year#!."

 tyr_gir_ch_15_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_15_cooldown'))]"

 tyr_gir_ch_15_hover:0 "#bold Credit Where It Is Due#!\n[Country.GetCustom('tyr_gir_ch_15_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_15_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('arrogant').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_15_reward$\n\n#g Repeatable#!"
 tyr_gir_ch_15_menu:0 "@tyr_gir_trait_arrogant! #v #tooltippable Credit Where It Is Due#!#!"

 tyr_gir_ch.16.t:0 "One More Shift"
 tyr_gir_ch.16.d:0 "Orders are arriving faster than the works can dispatch them. The owners propose another shift, shorter stoppages, and machinery kept running late into the night. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] welcomes their determination. An engineer points out that iron can be inspected and replaced; an exhausted worker is usually expected to return the following morning."
 tyr_gir_ch.16.a:0 "Keep the machines running."

 tyr_gir_ch_16_modifier:0 "One More Shift"

 tyr_gir_ch_16_reward:0 "#g +5%#! manufacturing [concept_throughput] and #r +5%#! manufacturing mortality for #v 1 year#!."

 tyr_gir_ch_16_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_ch_16_cooldown'))]"

 tyr_gir_ch_16_hover:0 "#bold One More Shift#!\n[Country.GetCustom('tyr_gir_ch_16_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_ch_16_actor_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] The Chancellor has [GetCharacterTrait('reckless').GetName].\n\n#bold Effects:#!\n$tyr_gir_ch_16_reward$\nMay decline.\n\n#g Repeatable#!"
 tyr_gir_ch_16_menu:0 "@tyr_gir_trait_reckless! #v #tooltippable One More Shift#!#!"

 tyr_gir_ch.16.b:0 "Keep to the existing arrangements."

 tyr_gir_ch.101.t:0 "The Founders’ Charter"
 tyr_gir_ch.101.d:0 "The signatures on the charter belong to firms that have spent years undercutting one another. [SCOPE.sCharacter('tyr_gir_ch_actor').GetFullName] has persuaded them that new works, reliable suppliers, and wider markets offer more than another season of mutual obstruction. Their agreement gives private ambition a common undertaking. Across the industrial districts, projects once dismissed as too large for any single company are being discussed again."
 tyr_gir_ch.101.a:0 "Let a generation of factories bear witness."

 tyr_gir_ch_101_modifier:0 "The Founders’ Charter"

 tyr_gir_ch_101_reward:0 "#g +20%#! heavy-industry [concept_throughput]\n#g +15%#! [concept_prestige]\nLasts until the main [concept_journal_entry] ends."


 tyr_gir_de_1_hover:0 "#bold The Mountain Gives Way#!\n[Country.GetCustom('tyr_gir_de_1_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_de_1_req_1_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] Has researched [GetTechnology('dynamite').GetName] [concept_technology].\n[SelectLocalization(GetScriptedGui('tyr_gir_de_1_req_2_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] Any [concept_state] in the [Concept('concept_tyr_gir_outside_industrial_area', '$concept_tyr_gir_outside_industrial_area$')]:\n    Has [GetBuildingType('building_coal_mine').GetName], [GetBuildingType('building_iron_mine').GetName], [GetBuildingType('building_sulfur_mine').GetName].\n\n#bold Choose either:#!\n• #v $tyr_gir_de.1.1$#!\n    #g +20%#! [concept_construction] efficiency for extraction industries in [Concept('concept_tyr_gir_outside_industrial_area', '$concept_tyr_gir_outside_industrial_area$')] for #v 3 years#!.\n    Gain #r £[Country.MakeScope.ScriptValue('tyr_gir_expense_value')|0]/week#! in government expenses for #v 3 years#!.\n\n• #v $tyr_gir_de.1.2$#!\n    #g +15%#! [concept_throughput] for [GetBuildingType('building_coal_mine').GetName], [GetBuildingType('building_iron_mine').GetName], [GetBuildingType('building_sulfur_mine').GetName] and #r +10%#! mining mortality in [Concept('concept_tyr_gir_outside_industrial_area', '$concept_tyr_gir_outside_industrial_area$')] for #v 3 years#!.\n\n• #v $tyr_gir_de.1.3$#!\n    Gain #g 4,000#! research progress towards [GetTechnology('ammonium_nitrate_explosive').GetName].\n    Requires [GetTechnology('improved_fertilizer').GetName]; [GetTechnology('ammonium_nitrate_explosive').GetName] must not already be researched.\n    Gain #r £[Country.MakeScope.ScriptValue('tyr_gir_expense_value')|0]/week#! in government expenses for #v 3 years#!.\n\n#r Once per campaign#!"
 tyr_gir_de_1_menu:0 "#O #tooltippable The Mountain Gives Way#!#!"

 tyr_gir_de_2_cooldown_text:0 "#r In cooldown#! — [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(Country.MakeScope,'tyr_gir_de_2_cooldown'))]"

 tyr_gir_de_2_hover:0 "#bold Chemistry in the Fields#!\n[Country.GetCustom('tyr_gir_de_2_status')]\n\n[SelectLocalization(GetScriptedGui('tyr_gir_de_2_req_1_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] Has researched [GetTechnology('improved_fertilizer').GetName] [concept_technology].\n[SelectLocalization(GetScriptedGui('tyr_gir_de_2_req_2_check').IsValid(GuiScope.SetRoot(Country.MakeScope).End),'tyr_gir_de_yes','tyr_gir_de_no')] Any [concept_state] in the German homelands:\n    Has [GetBuildingType('building_rye_farm').GetName], [GetBuildingType('building_wheat_farm').GetName], [GetBuildingType('building_rice_farm').GetName], [GetBuildingType('building_maize_farm').GetName], [GetBuildingType('building_millet_farm').GetName].\n\n#bold Choose either:#!\n• #v $tyr_gir_de.2.1$#!\n    Gain the #v Agronomic Stations#! [concept_journal_entry].\n    Having fertilizer PMs on at least #v 50%#! of German cereal-farm levels completes the entry and grants #g +1#! agricultural level (maximum #v 5#!).\n    Gain #r £[Country.MakeScope.ScriptValue('tyr_gir_expense_value')|0]/week#! in government expenses for #v 3 years#!.\n\n• #v $tyr_gir_de.2.2$#!\n    Gain #g 4,000#! research progress towards [GetTechnology('threshing_machine').GetName].\n    Requires [GetTechnology('steam_donkey').GetName]; [GetTechnology('threshing_machine').GetName] must not already be researched.\n    Gain #r £[Country.MakeScope.ScriptValue('tyr_gir_expense_value')|0]/week#! in government expenses for #v 3 years#!.\n\n• #v $tyr_gir_de.2.3$#!\n    #g +15%#! [GetGoods('grain').GetName] output for German cereal farms using fertilizer PMs for #v 3 years#!. Eligibility is checked monthly.\n    Gain #r £[Country.MakeScope.ScriptValue('tyr_gir_expense_value')|0]/week#! in government expenses for #v 3 years#!.\n\n#r Once per campaign#!"

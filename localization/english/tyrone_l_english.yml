    saw_american_victory:0 "Victors of the Spanish-American War"
    saw_american_victory_desc:0 "The United States has emerged victorious from the Spanish-American War, cementing its position as the dominant power in the Caribbean."
    saw_spanish_victory:0 "Victors of the Spanish-American War"
    saw_spanish_victory_desc:0 "Spain has repelled the American challenge, preserving its prestige and colonial holdings in the Americas."
    saw_american_defeat:0 "Defeated in the Spanish-American War"
    saw_american_defeat_desc:0 "The United States has suffered a humiliating defeat, its ambitions in the Caribbean checked by the resilience of the Spanish Empire."
    saw_spanish_defeat:0 "Defeated in the Spanish-American War"
    saw_spanish_defeat_desc:0 "Spain has been humbled by the United States, its grip on the Americas weakened and its prestige diminished."
    je_spanish_american_war:0 "The Spanish-American War"
    je_spanish_american_war_reason:0 "Tensions between the United States and Spain are reaching a breaking point. American ambitions in the Atlantic and the declining grip of the Spanish Empire have set the two powers on a collision course."
    spanish_american_war.1.t:0 "The Treaty of Paris"
    spanish_american_war.1.d:0 "Following [SCOPE.sCountry('spain_scope').GetName]'s decisive defeat, commissioners have concluded negotiations in Paris. [SCOPE.sCountry('spain_scope').GetNameNoFlag] renounces sovereignty over Cuba, cedes Puerto Rico, Guam, and the Philippine Islands to [SCOPE.sCountry('usa_scope').GetName], bringing an end to nearly four centuries of Spanish colonial rule in the Americas. Cuba shall come under temporary [SCOPE.sCountry('usa_scope').GetAdjectiveNoFormatting] occupation, and, under the terms of the forthcoming Platt Amendment, [SCOPE.sCountry('usa_scope').GetNameNoFlag] will secure a perpetual lease for a naval station at Guantánamo Bay."
    spanish_american_war.1.f:0 "\"The flag has been lowered over [SCOPE.sCountry('spain_scope').GetNameNoFlag]'s last great possessions in the New World, and [SCOPE.sCountry('usa_scope').GetNameNoFlag] now casts its shadow across the Caribbean and the Pacific.\""
    spanish_american_war.1.a:0 "Ratify the Treaty of Paris as is."
    spanish_american_war.1.b:0 "Transfer Cuba as well."

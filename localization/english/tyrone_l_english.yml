 tyr_americas.30.war_desc:0 "[SCOPE.sCountry('tyr_am_belligerent').GetName] is leading a war against [SCOPE.sCountry('tyr_am_target').GetName]. We may support their opponent, enter the war, or demand an end to hostilities."
 tyr_am_join_american_war_tt:0 "[ROOT.GetCountry.GetName] will #r enter the ongoing war#! on the side of [SCOPE.sCountry('tyr_am_target').GetName], against [SCOPE.sCountry('tyr_am_belligerent').GetName]."
 tyr_am_demand_whitepeace_tt:0 "Demand that [SCOPE.sCountry('tyr_am_belligerent').GetName] accept a #v white peace#!. Acceptance ends this entire war without enforcing war goals. Refusal worsens relations and allows us to reconsider intervention. #bold No money is transferred.#!"
 tyr_am_accept_whitepeace_tt:0 "End the referenced war for #bold all participants#! without enforcing war goals. No other war is affected."
 tyr_am_refuse_whitepeace_tt:0 "The war continues. [SCOPE.sCountry('tyr_am_observer').GetName] will reconsider whether to intervene."
 tyr_americas.33.t:0 "Our Demand Rejected"
 tyr_americas.33.d:0 "[SCOPE.sCountry('tyr_am_belligerent').GetName] has refused our demand for a white peace with [SCOPE.sCountry('tyr_am_target').GetName]. We must decide whether to back our words with force."
 tyr_americas.33.f:0 "The reply is brief. The decision it demands is not."
 tyr_americas.33.a:0 "Then we shall intervene."
 tyr_americas.33.b:0 "We will not go to war over this."
 tyr_am_payment_debt_warning_tt:0 "#r The full payment is charged even without sufficient gold reserves or while in default. This may increase debt.#!"
 tyr_am_legacy_reconquista_complete_tt:0 "Conclude the Spanish victory settlement of the #b Reconquista and the Monroe Doctrine#! [concept_journal_entry]."
 tyr_americas.70.viceroyalties:0 "Restore the four viceroyalties."
 tyr_am_viceroyalties_available_tt:0 "Each of the four regions has an existing country in our subject network or Power Bloc with its capital there. Any existing viceroyalty tags must belong to the same regional settlement."
 tyr_americas.70.d_tt:0 "Establish #b New Spain, New Granada, Peru and River Plate#! as direct [Concept('concept_colony_subject', 'colonies')] of [ROOT.GetCountry.GetName]. In each region, an existing country with its capital there is selected: a human-controlled country takes priority; otherwise the largest economy is chosen. The selected countries take the corresponding viceroyalty names and flags.\n\nOther countries in our regional sphere are annexed with incorporation into the relevant viceroyalty, contributing their primary cultures. Regional states held by us or our remaining subjects and bloc members are also transferred and incorporated. Each viceroyalty gains Spanish primary culture and [GetLawType('law_colonial_administration').GetName].\n\nUses the default viceroyalty borders. Cuba and Brazil remain outside the four administrations. Spain receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_spain_annex_hover $tyr_am_reward_spain_annex$#! permanently.\n\nThe #b Reconquista#! [concept_journal_entry] can now conclude."
 tyr_am_south_american_sovereignty:0 "South American Sovereignty"
 tyr_am_preview_heading:0 "@inf! Settlement Rewards"
 tyr_am_completion_summary_tt:0 "One of the following:\n  • #v Phase III#!: #gold Spain#! or the #blue USA#! controls all #v 12 areas except Brazil#!.\n  • #v Phase III#!: independent #green Brazil#! controls all #v 9 South American areas outside Brazil#! (excluding Brazil, Mexico, Cuba and Central America).\nArea control requires #v 75%#!."
 tyr_am_static_final_rewards_tt:0 "#gold #b Spain:#!#!\n  • Receive #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_spain_annex_hover $tyr_am_reward_spain_annex$#! (#v Permanent#!) and annex regional subjects except Brazil with incorporation, adopting their primary cultures.\n  • Receive #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_spain_brazil_hover $tyr_am_reward_spain_brazil$#! (#v Permanent#!) and consolidate South American subjects under Brazil with incorporation and their primary cultures.\n  • Receive #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_spain_patria_hover $tyr_am_reward_spain_patria$#! (#v Permanent#!) and consolidate regional subjects under Patria Grande with incorporation, their primary cultures and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_colonial_administration_hover $colonial_administration$#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_patria_economic_colony_hover $resource_extraction_colony_modifier$#!.\n  • #v (Conditional: Carlist Spain)#! Receive #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_spain_annex_hover $tyr_am_reward_spain_annex$#! (#v Permanent#!) and consolidate regional countries under New Spain, New Granada, Peru and River Plate with incorporation and their primary cultures.\n\n#blue #b USA#!#!\n#b Settlement rewards — choose one:#!\n  • Gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_usa_migration_hover $tyr_am_reward_usa_migration$#! (#v Permanent#!).\n  • Gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_usa_workforce_hover $tyr_am_reward_usa_workforce$#! (#v Permanent#!).\n  • Gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_usa_navy_hover $tyr_am_reward_usa_navy$#! (#v Permanent#!).\n\n#green #b BRAZIL#!#!\n  • Gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_static_brazil_hover $tyr_am_reward_brazil$#! (#v Permanent#!).\n  • Annexes South American subjects and Power Bloc members with incorporation and adopts their primary cultures."

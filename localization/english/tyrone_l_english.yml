 tyr_am_investment_heading:0 "Investment · £ [GetPlayer.MakeScope.ScriptValue('tyr_am_investment_remaining')|0]/2"
 tyr_am_diplomatic_heading:0 "Diplomacy · @inf! [GetPlayer.MakeScope.ScriptValue('tyr_am_diplomatic_remaining')|0]/2"
 tyr_am_investment_limit_tt:0 "Investment Actions: #v 2#! per country per #v 12 months#!. The period begins with the first investment. Each action has its own #v 12-month#! cooldown."
 tyr_am_diplomatic_limit_tt:0 "Diplomatic Actions: #v 2#! per country per #v 12 months#!. Selected commitment: #v [GetPlayer.MakeScope.ScriptValue('tyr_am_diplomatic_amount')|0]#! @inf! for #v 12 months#!. Each action has its own cooldown."

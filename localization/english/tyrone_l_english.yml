 tyr_am_start_standing:0 "Start Monthly Financial Assistance"
 tyr_am_stop_standing:0 "Stop Monthly Financial Assistance"
 tyr_am_action_standing_tt:0 "Authorise the selected amount to the selected recipient every month. Only successful treasury payments enter the influence ledger. Payments continue even without sufficient gold reserves or while in default. Stops when war begins or Phase I ends. Click again to cancel. Paid under this programme: £[GetPlayer.MakeScope.ScriptValue('tyr_am_ui_standing_paid')|0]."
 tyr_americas.13.t:0 "Monthly Assistance Suspended"
 tyr_americas.13.d:0 "The standing assistance programme has stopped because the diplomatic phase ended, the recipient became unavailable, or war prevented payment. No unpaid instalment has been counted as influence."
 tyr_americas.13.f:0 "The treasury awaits fresh orders as circumstances abroad bring the programme to a close."
 tyr_americas.13.a:0 "Review the programme."
 tyr_am_amount:0 "Payment: £[GetPlayer.MakeScope.ScriptValue('tyr_am_aid_display')|0]"
 tyr_am_military_actions:0 "Use the country buttons to open diplomacy.\n\nPhase II: protectorates and conquests against countries of the competition area.\n\nPhase III: settle rival spheres and foreign enclaves through war and peace.\n\nControl changes after sovereignty or bloc membership changes, not occupation."

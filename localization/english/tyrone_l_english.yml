 tyr_am_block_selection:0 "@red_cross! Select a country that still holds territory in this area."
 tyr_am_block_target:0 "@red_cross! The recipient must be a non-revolutionary Latin American country other than ourselves and at peace with us."
 tyr_am_block_cooldown:0 "@red_cross! Our shared regional-action cooldown is still active."
 tyr_am_block_actor:0 "@red_cross! Spain or the United States must be independent and lead its own Power Bloc."
 tyr_am_block_subject:0 "@red_cross! The recipient is a subject; these negotiations require an independent country."
 tyr_am_block_same_bloc:0 "@red_cross! The recipient already belongs to our Power Bloc."
 tyr_am_block_aid_role:0 "@red_cross! Requires a principal bloc leader, or a major-power observer that has selected a patron through the Journal."
 tyr_am_block_default:0 "@red_cross! Our country is in default."
 tyr_am_block_reserves:0 "@red_cross! Our gold reserves cannot cover the selected payment."
 tyr_am_block_capacity:0 "@red_cross! The recipient cannot accept the full payment. Try a smaller amount."
 tyr_am_block_other_bloc:0 "@red_cross! The recipient already belongs to a Power Bloc."
 tyr_am_block_pending:0 "@red_cross! An invitation is awaiting a reply."
 tyr_am_block_influence:0 "@red_cross! Regional influence must be at most 25 for Spain or at least 75 for the United States."
 tyr_am_block_rank:0 "@red_cross! Our prestige or rank must exceed the recipient’s."
 tyr_am_block_bloc_war:0 "@red_cross! A member of our Power Bloc is a diplomatic-play enemy of the recipient."
 tyr_am_block_phase:0 "@red_cross! Special peaceful actions are available only in Phase I."
 tyr_am_standing_running_tt:0 "#green Active#! · [GetPlayer.MakeScope.Var('tyr_am_monthly_aid_recipient').GetCountry.GetName]\n£[GetPlayer.MakeScope.ScriptValue('tyr_am_ui_standing_amount')|0] / month\nPaid: £[GetPlayer.MakeScope.ScriptValue('tyr_am_ui_standing_paid')|0]\nClick to stop. Stopping costs nothing and applies no new cooldown."
 tyr_am_standing_new_tt:0 "£[GetPlayer.MakeScope.ScriptValue('tyr_am_aid_display')|0] / month\nAuthorises a new programme; no immediate transfer. Starting requires no active shared cooldown. Scheduled payments apply no new action cooldown. Only paid money contributes to influence. Payments continue even without sufficient gold reserves or while in default. Stops automatically if the recipient becomes unavailable, war begins or Phase I ends."
 tyr_am_vanilla_tip_mission:0 "$tyr_am_action_mission$\n$tyr_am_vanilla_cost_mission$\n$tyr_am_regional_mission_effect_tt$\n$tyr_am_regional_cooldown_tt$"

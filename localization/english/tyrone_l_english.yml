 spain_napoleonic_reforms.1.t: "A Nation of Learning"
 spain_napoleonic_reforms.1.d: "Spain has expanded its schools and opened new opportunities for scholars and inventors. The Bonapartist promise of progress is taking root in classrooms throughout the country."
 spain_napoleonic_reforms.1.a: "Knowledge shall strengthen the nation."
 spain_napoleonic_schooling_modifier: "Napoleonic Educational Reform"
 spain_napoleonic_reforms.2.t: "Credit for a New Spain"
 spain_napoleonic_reforms.2.d: "A modern banking system can direct private fortunes into new enterprises. With central banking established, investors can build with greater confidence and the state can borrow on better terms."
 spain_napoleonic_reforms.2.a: "Put Spanish capital to work."
 spain_napoleonic_banking_modifier: "Napoleonic Banking Reform"
 spain_napoleonic_reforms.3.t: "A New Settlement for Labor"
 spain_napoleonic_reforms.3.d: "Welfare reform and a new legal settlement for labor associations have reshaped working life. More people can now take a lasting place in the Spanish workforce."
 spain_napoleonic_reforms.3.a: "A stronger workforce for Spain."
 spain_napoleonic_labor_modifier: "Napoleonic Labor Reform"
 spain_napoleonic_reforms.4.t: "Spain Opens to the World"
 spain_napoleonic_reforms.4.d: "Free trade has opened Spanish ports to a wider world of commerce. Our merchants are ready to compete abroad and expand the flow of goods through the nation."
 spain_napoleonic_reforms.4.a: "Let Spanish commerce flourish."
 spain_napoleonic_trade_modifier: "Napoleonic Trade Reform"
 spain_napoleonic_reforms.5.t: "The Revenues of Reform"
 spain_napoleonic_reforms.5.d: "Modern taxation has given Spain a firmer financial foundation. An improved fiscal administration can collect more of what is owed and reduce the revenue lost to waste."
 spain_napoleonic_reforms.5.a: "Every revenue shall serve the nation."
 spain_napoleonic_taxation_modifier: "Napoleonic Taxation Reform"
 spain_napoleonic_reforms.6.t: "The Nation under Arms"
 spain_napoleonic_reforms.6.d: "A network of enlistment offices has given Spain the means to mobilize its people on a national scale. The Bonapartist government can now replace the old recruitment system with mass conscription, placing the defense of the nation upon a broader foundation."
 spain_napoleonic_reforms.6.a: "Every citizen shall answer the call."
 spain_napoleonic_reforms.7.t: "Arming the Modern Infantry"
 spain_napoleonic_reforms.7.d: "The adoption of rifled weapons demands an industrial foundation equal to the ambitions of our army. Spain's military manufacturers are expanding production and improving their workshops to equip a new generation of infantry."
 spain_napoleonic_reforms.7.a: "Our factories shall arm the nation."
 spain_napoleonic_infantry_industry_modifier: "Napoleonic Military Industry Reform"
 spain_napoleonic_reforms.8.t: "A New Era of Firepower"
 spain_napoleonic_reforms.8.d: "Hand-cranked machine guns have transformed the firepower available to our soldiers. Training and doctrine must now harness these weapons to strengthen both the advance and the defense of the Spanish army."
 spain_napoleonic_reforms.8.a: "Let our soldiers command the battlefield."
 spain_napoleonic_machine_guns_modifier: "Napoleonic Machine Gun Reform"
 spain_napoleonic_reforms.9.t: "Orders across the Empire"
 spain_napoleonic_reforms.9.d: "The electric telegraph and modern logistics have tightened the bonds between headquarters, supply depots, and the front. Our forces can secure occupied territory more effectively while a better organized supply system reduces the cost of equipping the army and navy."
 spain_napoleonic_reforms.9.a: "Keep the orders flowing and the forces supplied."
 spain_napoleonic_communications_modifier: "Napoleonic Communications and Logistics Reform"
 spain_napoleonic_reforms.10.t: "An Iron Fleet for Spain"
 spain_napoleonic_reforms.10.d: "Ironclads demand a new approach to naval warfare. Improved protection, more effective gunnery, and an organized program of capital ship construction will give Spain the means to defend its interests at sea."
 spain_napoleonic_reforms.10.a: "Build the fleet of the future."
 spain_napoleonic_naval_doctrine_modifier: "Napoleonic Naval Doctrine Reform"
 spain_napoleonic_bonaparte_prince_tt: "$napoleon_bonaparte_tt$, gaining the #v Ambitious#! trait."
 spain_napoleonic_reform_program_tt: "Starts the #v $je_spain_napoleonic_reforms$#! Journal Entry, opening domestic and military reforms that grant economic, research, and military bonuses as each reform is completed."
 spain_napoleonic_reforms.11.t: "Fulfilled Bonapartist Reforms"
 spain_napoleonic_reforms.11.d: "The promise of the Bonapartist restoration has been fulfilled. Schools and banks have been strengthened, domestic laws reformed, and the armed forces equipped for a new age. Having completed both the domestic and military reform programs, Spain stands renewed, and the House of Bonaparte can claim a lasting place in the nation's future."
 spain_napoleonic_reforms.11.a: "A restored dynasty, a renewed Spain."
 spain_bonapartist_restoration_modifier: "The Bonapartist Restoration"
 spain_napoleonic_domestic_active_modifier: "Napoleonic Domestic Reform Program"
 spain_napoleonic_military_active_modifier: "Napoleonic Military Reform Program"


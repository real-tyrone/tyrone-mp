 tyr_am_regional_aid_effect_tt:0 "• [SCOPE.sCountry('tyr_am_target').GetName] receives #green £[GetPlayer.MakeScope.ScriptValue('tyr_am_aid_display')|0]#! from [ROOT.GetCountry.GetName].\n$tyr_am_regional_payment_factor_tt$"
 tyr_am_regional_develop_effect_tt:0 "• [SCOPE.sCountry('tyr_am_target').GetName] receives #green £[GetPlayer.MakeScope.ScriptValue('tyr_am_aid_display')|0]#! from [ROOT.GetCountry.GetName].\n• The states of [SCOPE.sCountry('tyr_am_target').GetName] in the selected area gain #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_development_preview_hover $tyr_am_development$#! for up to #v 24 months#!.\n$tyr_am_regional_payment_factor_tt$"
 tyr_am_regional_assist_effect_tt:0 "• [SCOPE.sCountry('tyr_am_target').GetName] receives #green £[GetPlayer.MakeScope.ScriptValue('tyr_am_aid_display')|0]#! from [ROOT.GetCountry.GetName].\n• [SCOPE.sCountry('tyr_am_target').GetName] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_am_military_aid_preview_hover $tyr_am_military_aid$#! for #v 12 months#!.\n• [ROOT.GetCountry.GetName]: #green +0.5#! influence factor in [SCOPE.sCountry('tyr_am_target').GetName] for #v 12 months#!.\n$tyr_am_regional_payment_factor_tt$"
 tyr_am_regional_mission_effect_tt:0 "• [SCOPE.sCountry('tyr_am_target').GetName]: #green +[GetPlayer.MakeScope.ScriptValue('tyr_am_mission_relations')|0]#! [concept_relations] with [ROOT.GetCountry.GetName].\n• [ROOT.GetCountry.GetName]: #green +[GetPlayer.MakeScope.ScriptValue('tyr_am_mission_factor')|1]#! influence factor in [SCOPE.sCountry('tyr_am_target').GetName] for #v 12 months#!."
 tyr_am_regional_treaty_effect_tt:0 "• [SCOPE.sCountry('tyr_am_target').GetName] receives a proposal from [ROOT.GetCountry.GetName]: #v investment rights#! or a [concept_defensive_pact].\n• Requires #v consent#! and a valid treaty. #red No refund on refusal.#!\n• AI acceptance weight: #green ×[GetPlayer.MakeScope.ScriptValue('tyr_am_diplomatic_multiplier')|0]#!. Refusal remains possible; human recipients choose freely."
 tyr_am_regional_invite_effect_tt:0 "• [SCOPE.sCountry('tyr_am_target').GetName] receives an invitation to the [concept_power_bloc] of [ROOT.GetCountry.GetName].\n• Requires #v consent#!; influence #gold ≤25#! for Spain or #blue ≥75#! for the USA.\n• #red No refund on refusal.#!\n• AI acceptance weight: #green ×[GetPlayer.MakeScope.ScriptValue('tyr_am_diplomatic_multiplier')|0]#!. Refusal remains possible; human recipients choose freely.\n\n$tyr_am_phase2_protectorates_tt$\n• [SCOPE.sCountry('tyr_am_target').GetName] permanently loses #v $tyr_am_south_american_sovereignty$#!.\n• The inviting [concept_power_bloc] immediately gains #green +1000#! [concept_power_bloc_leverage] toward that country, even if the invitation is refused."
 tyr_am_help_symbol:0 "?"
 tyr_am_rules_panel_tt:0 "#gold SPAIN#!: Expand influence, attract bloc members and complete the Reconquista.\n#blue USA#!: Uphold the Monroe Doctrine and contain Spanish expansion.\n#green BRAZIL#!: Preserve autonomy and seek South American unity.\n\n#red Red#!: contested; grey: independent. Control requires #v 75%#! of an area through territory, subjects or bloc membership.\nClick an area, then a flag. Influence runs from #gold Spain: 0#! to #blue USA: 100#!; it is not ownership.\n£ Investments scale with payment. @inf! Diplomacy commits #v 500 / 1,000 / 1,500#! for #v 12 months#!. Each country has #v 2 actions per category#! per annual period; each action has a #v 12-month#! cooldown.\nEnds with complete Spanish or American control, Brazilian unification or failure.\n\n$tyr_am_phase2_protectorates_tt$"
 tyr_am_regional_payment_factor_tt:0 "• Influence factor: #green +[GetPlayer.MakeScope.ScriptValue('tyr_am_payment_factor_preview')|2]#! at current [concept_gdp].\n  Combined payments: maximum #v +1#! per patron/recipient per month; regional weighting applies."
 tyr_am_block_no_treaty:0 "#r No valid investment-rights or defensive-pact treaty can be proposed.#!"

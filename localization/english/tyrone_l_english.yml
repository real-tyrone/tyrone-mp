 tyr_gir.1.t:0 "The Forge of a Nation"
 tyr_gir.1.d:0 "Unification has brought Germany under one government, but its workshops still look to rival provincial capitals. Delegations arrive with surveys of coal seams, samples of fine cloth and promises of abundant labour. Each insists that the future belongs to its own district. The Chancellor must decide where the Reich will concentrate its industrial ambition."

 tyr_gir.choose_1:0 "Heavy Industry"

 tyr_gir.choose_2:0 "Consumer Goods"

 tyr_gir.choose_3:0 "Military Industry"

 tyr_gir.choose_4:0 "Agriculture"

 tyr_gir.defer:0 "Defer investment for one month."

 tyr_gir.2.t:0 "The Next Three Years"
 tyr_gir.2.d:0 "Estimates crowd the Chancellor's desk. Ironmasters ask for new furnaces, manufacturers for larger workshops, officers for reliable supplies and landowners for improvements to the soil. Each proposal promises prosperity; none can command the government's attention alone. A new three-year programme will give German enterprise its direction."

 tyr_gir.9.t:0 "Proposals Awaiting a Seal"
 tyr_gir.9.d:0 "The investment proposals return to the Chancellor's desk, their margins crowded with fresh estimates and impatient notes. Provincial deputies press their claims while contractors wait for a decision. The government must settle which branch of the economy will receive its backing for the coming programme."


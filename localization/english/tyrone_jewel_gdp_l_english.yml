l_english:
 tyrone_jewel_gdp_bar_name:0 "A Biennium of Growth"
 tyrone_jewel_gdp_bar_desc:0 "#v +10%#! [concept_gdp]"
 tyrone_jewel_gdp_bar_deadline:0 "[SCOPE.sCountry('csr_india').MakeScope.Var('tyrone_jewel_gdp_months_left').GetValue|0] months remaining"
 tyrone_jewel_gdp_growth_factor:0 "Growth since the biennium began"
 tyrone_jewel_gdp_construction:0 "Public Works Dividend"
 tyrone_jewel_gdp_construction_desc:0 "Economic expansion sustains a growing programme of public construction."
 tyrone_jewel_gdp_institution_impact:0 "Extending Public Services"
 tyrone_jewel_gdp_institution_impact_desc:0 "The gains of economic expansion have strengthened the reach of public institutions."
 tyrone_jewel_gdp_institution_cost:0 "Economies of Administration"
 tyrone_jewel_gdp_institution_cost_desc:0 "A growing economy allows the administration to spread the cost of its institutions."
 tyrone_jewel_gdp.1.t:0 "The Uses of Prosperity"
 tyrone_jewel_gdp.1.d:0 "The government of [ROOT.GetCountry.GetName] must decide how the proceeds of economic growth will serve the country. Engineers seek funds for public works, while administrators press their claims for the institutions already under their charge."
 tyrone_jewel_gdp.1.f:0 "A new line on the revenue estimate soon becomes a claim upon it. Every department has a proposal ready."
 tyrone_jewel_gdp.1.a:0 "Give the engineers room to build."
 tyrone_jewel_gdp.1.b:0 "Extend the reach of public services."
 tyrone_jewel_gdp.1.c:0 "Make administration less costly."
 tyrone_jewel_gdp_construction_choice_tt:0 "Each successful biennium adds #g +2%#! Construction Efficiency while this Journal Entry remains active. This choice is permanent."
 tyrone_jewel_gdp_impact_choice_tt:0 "Each successful biennium adds #g +2%#! Institution Impact while this Journal Entry remains active. This choice is permanent."
 tyrone_jewel_gdp_cost_choice_tt:0 "Each successful biennium adds #g −2%#! Institution Bureaucracy Cost while this Journal Entry remains active. This choice is permanent."
 tyrone_jewel_gdp.2.t:0 "The Returns of Growth"
 tyrone_jewel_gdp.2.d:0 "The biennial accounts confirm that [ROOT.GetCountry.GetName] has met its growth target. The government can now extend the commitments made when its programme began."
 tyrone_jewel_gdp.2.f:0 "The figures have survived the auditors. Beyond the offices, fresh orders reach the workshops and merchants begin to plan another season."
 tyrone_jewel_gdp.2.a:0 "Put these gains to work."
 tyrone_jewel_gdp_status:0 "Completed biennia: #v [SCOPE.sCountry('csr_india').MakeScope.Var('tyrone_jewel_gdp_successes').GetValue|0]#!."
 tyrone_jewel_gdp_goal:0 "Raise [SCOPE.sCountry('csr_india').GetName]’s [concept_gdp] to @money! #v [SCOPE.sCountry('csr_india').MakeScope.Var('tyrone_jewel_gdp_target').GetValue|D]#! (#v +10%#!) by the end of this #v 24-month#! cycle. Each new cycle starts from the current GDP. Failure carries no penalty."

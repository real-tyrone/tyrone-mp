l_english:
 law_india_revolutionary_secularism:0 "Revolutionary Secularism"
 law_india_revolutionary_secularism_desc:0 "Religious institutions surrender their public authority to the revolutionary state. Secular associations carry its teaching into the provinces, supported by an expanded civil administration."
 je_tyrone_cp_home_rule:0 "A Union Beyond Creed"
 je_tyrone_cp_home_rule_reason:0 "The revolution has united the provinces under one government, but language and religion still divide their inhabitants. #v Hindustani, Bengali, Punjabi, Marathi, Tamil and Gujarati#! communities must find a place in the new union. Secular public life offers the government a means of bringing them together."
 je_tyrone_cp_home_rule_status:0 ""
 tyrone_ch_cooldown_tt:0 "At least #v one year#! has passed since the last cultural recognition."
 tyrone_ch_remaining_cultures_tt:0 "All remaining Indian cultures will become [Concept('concept_primary_cultures', 'primary cultures')]."
 tyrone_ch.1.t:0 "Religion and the Revolution"
 tyrone_ch.1.d:0 "The revolutionary government proposes to place public life on an atheist foundation. Its supporters seek a common civic identity across the religious divisions of India."
 tyrone_ch.1.f:0 "The motion reaches the assembly alongside objections from religious congregations. Some delegates demand an immediate break with the old order; others warn that the provinces have yet to recover from the war."
 tyrone_ch.1.a:0 "Establish the secular state."
 tyrone_ch.1.b:0 "Retain the present religious settlement."
 tyrone_ch_hindustani_recognize:0 "Recognize the Hindustani"
 tyrone_ch_hindustani_recognize_desc:0 "The Hindustani community seeks an equal place in the revolutionary union, with its language and customs acknowledged by the state."
 tyrone_ch_hindustani_atheist_tt:0 "At least #v 20%#! of Hindustani pops in directly owned Indian territory are atheist."
 tyrone_ch_hindustani_radical_tt:0 "Fewer than #v 20%#! of Hindustani pops in directly owned Indian territory are radicals."

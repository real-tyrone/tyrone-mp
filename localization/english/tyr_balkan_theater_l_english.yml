 tyr_bt_moving_frontier.d:0 "$tyr_bt_label_russia$ is at war with the $tyr_bt_label_ottoman_empire$. Our rivalry with the Porte gives the government an opportunity to press its claim to $tyr_bt_label_bosnia$."
 tyr_bt_moving_frontier.f:0 "The frontier marked on the council’s maps has become a matter for negotiation. Control of Bosnia would give the monarchy a firmer position among its southern neighbours."
 tyr_bt_austria_controls_bosnia_tt:0 "Control all of Bosnia directly, through a subject or through a member of your power bloc"
 tyr_bt_bosnia_retain_administration:0 "Confirm the present administration."
 tyr_balkan_theater.2.t:0 "Beyond Bosnia"
 tyr_balkan_theater.2.d:0 "The Bosnian settlement has secured the monarchy’s position on the frontier. Ministers now propose competing grounds for further territorial claims: the Romanian lands to the east, or the Serbian lands to the south."
 tyr_balkan_theater.2.f:0 "Each proposal has its advocates at court. The government must decide which frontier its diplomats will press next."
 tyr_balkan_theater.2.a:0 "Press our claims to the Romanian lands."
 tyr_balkan_theater.2.b:0 "Press our claims to the Serbian lands."

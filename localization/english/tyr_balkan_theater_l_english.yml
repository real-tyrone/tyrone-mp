 je_tyr_balkan_theater:0 "The Balkan Theater"
 je_tyr_balkan_theater_reason:0 "The retreat of $tyr_bt_label_ottoman$ authority has drawn rival empires into the affairs of the Balkan peoples. Vienna and St Petersburg seek dependable governments along their frontiers; the Porte seeks to preserve its remaining dominions.\n\n$tyr_bt_label_greece$ - [GetPlayer.GetCustom('tyr_bt_gre_area_description')]\n$tyr_bt_label_bulgaria$ - [GetPlayer.GetCustom('tyr_bt_bul_area_description')]\n$tyr_bt_label_romania$ - [GetPlayer.GetCustom('tyr_bt_rom_area_description')]\n$tyr_bt_label_yugoslavia$ - [GetPlayer.GetCustom('tyr_bt_yug_area_description')]"
 je_tyr_balkan_theater_status:0 "No power leads yet."
 tyr_bt_influence_desc:0 "Influence follows the faction's share of Balkan GDP slowly, halving the gap in ten years. Each national settlement transfers up to 25 points from the rival factions. The three powers share 150 points."
 tyr_bt_victory_desc:0 "One power has secured Balkan hegemony. Its settlement has endured, and its rivals must reckon with their defeat."
 tyr_bt_stalemate_desc:0 "None of the rival empires has established a lasting settlement in the Balkans."
 tyr_bt_timeout_desc:0 "Forty years of rivalry have ended. A power holding at least 80 influence receives a limited victory; otherwise all three powers face a stalemate."
 je_group_balkan_theater:0 "The Balkan Theater"
 tyr_bt_children:0 "The Balkan Settlements"
 da_tyr_bt_claim:0 "Assert a Balkan Claim"
 da_tyr_bt_claim_desc:0 "Assert a permanent territorial claim at a cost of 10 Infamy. This power must wait five years before asserting another Balkan claim. A claim grants no influence until the territory is brought into the faction."
 je_tyr_bt_yug:0 "The Yugoslav Settlement"
 je_tyr_bt_yug_reason:0 "The South Slav lands remain divided between imperial provinces and small states. A common protector could bring their governments together, though the settlement would bind them to the power that arranged it."
 je_tyr_bt_yug_status:0 ""
 je_tyr_bt_rom:0 "The Romanian Settlement"
 je_tyr_bt_rom_reason:0 "The Romanian lands lie across the frontiers of rival empires. Their union offers a dependable partner on the lower Danube to the power prepared to secure it."
 je_tyr_bt_rom_status:0 ""
 je_tyr_bt_gre:0 "The Greek Settlement"
 je_tyr_bt_gre_reason:0 "Greek territorial ambitions give the rival empires a reason to defend Athens. A lasting settlement requires the disputed lands to be held by $tyr_bt_label_greece$ itself."
 je_tyr_bt_gre_status:0 ""
 je_tyr_bt_bul:0 "The Bulgarian Settlement"
 je_tyr_bt_bul_reason:0 "A Bulgarian state gives the national movement a government capable of pressing its territorial demands. Its protector must secure the disputed lands and allow the settlement time to endure."
 je_tyr_bt_bul_status:0 ""
 tyr_bt_settlement_desc:0 "#gold #b Settlement secured#!#!\n• Gain one permanent level of #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_bt_consolidations_hover $tyr_bt_consolidations$#!.\n• Transfer up to #v 25 influence#! from rival factions."
 tyr_balkan_theater.1.t:0 "The South Slav Crown"
 tyr_balkan_theater.1.d:0 "The Yugoslav settlement has placed a united government under Austrian protection. Recognition of its peoples within the monarchy has opened the way to a closer union."
 tyr_balkan_theater.1.f:0 "The ministers have prepared two instruments: one guarantees the protected state, the other places its provinces under the imperial administration."
 tyr_balkan_theater.1.a:0 "Bring the provinces into the monarchy."
 tyr_balkan_theater.1.b:0 "Maintain the protectorate."

l_english:
 amendment_informal_class_system:0 "Informal Class System"
 amendment_reliance_on_british_patents:0 "Reliance on British Patents"
 amendment_reliance_on_british_patents_desc:0 "Reliance on British patents and imported technical expertise constrains the development of domestic research, regardless of how schooling is organized."
 amendment_informal_class_system_desc:0 "Though caste distinctions are not formally enforced, inherited social privileges continue to burden the lower strata and obstruct the advancement of Dalit and Shudra communities."
 amendment_british_manufacturing_monopoly:0 "British Manufacturing Monopoly"
 amendment_company_directorate:0 "Company Directorate"
 amendment_company_directorate_desc:0 "The Company’s directors and commercial interests dominate the colonial administration, granting the Industrialists overwhelming political influence."
 country_tyrone_cannot_build_textile_mills_bool:0 "Cannot build textile mills"
 country_tyrone_cannot_build_textile_mills_bool_desc:0 "Textile mills cannot be constructed."
 amendment_british_manufacturing_monopoly_desc:0 "The colonial settlement reserves textile manufacturing for British suppliers. Textile mills may not be constructed or expanded while this clause remains in force."
 amendment_cotton_export_guarantees:0 "Cotton Export Guarantees"
 amendment_company_bonded_labor_guarantees:0 "Company Bonded Labor Guarantees"
 amendment_company_bonded_labor_guarantees_desc:0 "The Company protects claims over bonded labor, obstructing legislation to abolish slavery. These guarantees may be repealed under Codified or Enforced Caste, or after Company Administration has ended."
 country_enactment_success_chance_slavery_banned_mult:0 "Enactment Success Chance for [GetLawType('law_slavery_banned').GetName]"
 country_enactment_success_chance_slavery_banned_mult_desc:0 "A percentage increase or decrease to the chance of successfully enacting [GetLawType('law_slavery_banned').GetName]."
 amendment_colonial_trading_privileges:0 "Colonial Trading Privileges"
 amendment_colonial_trading_privileges_desc:0 "Commercial privileges reserve foreign trade to colonial channels and protect the comforts of the capitalist class."
 amendment_plantation_labor_obligations:0 "Plantation Labor Obligations"
 amendment_plantation_labor_obligations_desc:0 "An inefficient agrarian settlement depresses grain production and plantation throughput while requiring plantations to maintain a larger workforce."
 amendment_cotton_export_guarantees_desc:0 "Cotton plantations receive compulsory subsidies to sustain the export trade, while plantation laborers and slaves bear a lower standard of living."
 country_bg_tyrone_guaranteed_cotton_require_subsidies_bool:0 "Forced Subsidies for Cotton Plantations"
 country_bg_tyrone_guaranteed_cotton_require_subsidies_bool_desc:0 "The administration must subsidize cotton plantations."
 state_building_textile_mill_max_level_add:0 "$building_textile_mill$ Max Level"
 state_building_textile_mill_max_level_add_desc:0 "A bonus or penalty to the maximum level of $building_textile_mill$ buildings."
 building_group_bg_plantations_laborers_standard_of_living_add:0 "Plantation Laborer Standard of Living"
 building_group_bg_plantations_laborers_standard_of_living_add_desc:0 "A bonus or penalty to the standard of living of Laborers employed in Plantation Buildings."
 building_group_bg_plantations_slaves_standard_of_living_add:0 "Plantation Slave Standard of Living"
 building_group_bg_plantations_slaves_standard_of_living_add_desc:0 "A bonus or penalty to the standard of living of Slaves employed in Plantation Buildings."
 amendment_royal_navy_supremacy:0 "Royal Navy Supremacy"
 amendment_royal_navy_supremacy_desc:0 "Naval construction is subordinated to British maritime supremacy. Capital ships and cruisers face severe construction restrictions, while troop transports are exempt."

l_english:
 law_india_colonial_religious_neutrality:0 "Colonial Religious Neutrality"
 law_india_colonial_religious_neutrality_desc:0 "The colonial administration professes equal treatment of all faiths while retaining its Protestant religious affiliation. Activating this law establishes Protestantism as the state religion."
 law_india_muslim_favored:0 "Muslim Patronage"
 law_india_muslim_favored_desc:0 "The government adopts a Sunni religious affiliation while maintaining equal legal treatment of all faiths. Activating this law establishes Sunni Islam as the state religion."
 law_india_hindu_favored:0 "Hindu Patronage"
 law_india_hindu_favored_desc:0 "The government adopts a Hindu religious affiliation while maintaining equal legal treatment of all faiths. Activating this law establishes Hinduism as the state religion."

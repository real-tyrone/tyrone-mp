l_english:
 je_tyrone_company_self_rule:0 "Company Self-Rule"
 je_tyrone_company_self_rule_reason:0 "The Company has kept its charter, but its claim to govern India rests on more than commercial privilege. Its directors must bring the administration into order while ministers and shareholders watch for signs that self-rule has outlived its usefulness."
 je_tyrone_company_self_rule_status:0 ""
 je_tyrone_csr_police:0 "Establish the Colonial Police"
 je_tyrone_csr_police_reason:0 "District officials depend on local patrons to enforce their orders, and unrest can expose how little authority reaches beyond the seat of government. A regular police establishment would give the Company a firmer hold over the districts, though the public has its own reasons to distrust a new uniform."
 je_tyrone_csr_police_status:0 ""
 je_tyrone_csr_army:0 "Establish the Company Army"
 je_tyrone_csr_army_reason:0 "The Company’s territories have outgrown the arrangements that first protected its trading posts. Advocates of [GetLawType('law_india_early_standing_army').GetName] and [GetLawType('law_india_company_army').GetName] demand permanent regiments with common training and reliable supplies. The directors must decide how much revenue they are prepared to place at their disposal."
 je_tyrone_csr_army_status:0 ""
 je_tyrone_csr_tax:0 "Reform the Tax System"
 je_tyrone_csr_tax_reason:0 "Revenue assessments vary from district to district, leaving collectors to bargain over demands that the treasury can scarcely predict. [GetLawType('law_india_chartered_excise').GetName] and [GetLawType('law_india_company_assessment').GetName] offer competing plans for steadier receipts. Those who pay will judge the reform by the demands it makes upon them."
 je_tyrone_csr_tax_status:0 ""
 je_tyrone_csr_empire_of_india:0 "Empire of India"
 je_tyrone_csr_empire_of_india_reason:0 "The Company’s settlement has opened a claim to an #v Empire of India#!. Its government must reconcile the rights of the provinces and princes with the authority of a common civil and military establishment.\n\nThe constitutional conference at Calcutta will determine the terms under which that work begins. [GetLawType('law_india_imperial_provincial_administration').GetName] and a settlement of the princely dominions can give the proposed monarchy an administration capable of sustaining its claim."
 je_tyrone_csr_empire_of_india_status:0 ""
 je_tyrone_csr_sovereign_company:0 "Sovereign Company"
 je_tyrone_csr_sovereign_company_reason:0 "The Company has chosen to govern through its own institutions. Its directors must settle the claims of expertise and investment, build an Indian service and fleet, and admit new commercial houses to the exercise of public power."
 je_tyrone_csr_sovereign_company_status:0 ""
 je_tyrone_csr_independent_path:0 "An Independent Course"
 je_tyrone_csr_independent_path_reason:0 "The Company has lost its mandate for reform, but no imperial government can take its place by decree. An independent India must settle who will govern in its name."
 je_tyrone_csr_independent_path_status:0 ""
 je_tyrone_csr_crown_path:0 "Under Crown Rule"
 je_tyrone_csr_crown_path_reason:0 "The Company’s administration has passed to the Crown under India’s present overlord. The new government inherits the districts, obligations, and disputes that the directors could not resolve."
 je_tyrone_csr_crown_path_status:0 ""
 tyrone_csr_heading:0 "Company Reforms"
 tyrone_csr_evaluation_tt:0 "Completing #v all three reforms#! ends this Journal Entry immediately with success. India first chooses #v one#! of the three rewards below, whose modifier effects last #v ten years#!, then chooses between #v $je_tyrone_csr_empire_of_india$#! and #v $je_tyrone_csr_sovereign_company$#!.\n\nOtherwise, the government is assessed after #v seven years#!. Completing at least #v one reform#! grants the same choice of political path, without the additional reward.\n\nWith #v no reforms#! at the deadline, subject India passes to Crown rule; independent India opens #v $je_tyrone_csr_independent_path$#!. Unfinished reforms close at the deadline."
 tyrone_csr_all_reforms_done_tt:0 "Has completed #v all three#! Company reforms."
 tyrone_csr_deadline_passed_tt:0 "The #v seven-year#! reform period has ended."
 tyrone_csr_no_reforms_tt:0 "Has completed #v no reforms#!."
 tyrone_csr_failure_condition_tt:0 "#v Seven years#! have passed without completing #v any reform#!."
 tyrone_csr_failure_preview_header:0 "#o The Company Loses Its Mandate#!"
 tyrone_csr_failure_outcome_tt:0 "The Company loses its mandate. Subject India passes to Crown rule under its current overlord, with reduced autonomy if it remains a Chartered Company. The Company’s administration gives way to the Crown’s government, and #v $je_tyrone_csr_crown_path$#! opens. Independent India instead opens #v $je_tyrone_csr_independent_path$#!."
 tyrone_csr_settlement_preview_header:0 "#o The Company’s Settlement#!"
 tyrone_csr_public_dividends_preview_header:0 "#o Reward 1: Public Dividends#!"
 tyrone_csr_private_investment_preview_header:0 "#o Reward 2: Private Investment#!"
 tyrone_csr_construction_drive_preview_header:0 "#o Reward 3: Construction Drive#!"
 law_india_princely_garrison:0 "Princely Garrison"
 law_india_princely_garrison_desc:0 "The princes maintain local levies under their own officers, providing troops when the government calls upon their obligations."
 law_india_company_corps:0 "Company Corps"
 law_india_company_corps_desc:0 "The Company’s forces retain the levy arrangements on which its territorial armies were raised."
 law_india_early_standing_army:0 "Early Standing Army"
 law_india_early_standing_army_desc:0 "Permanent regiments serve under a regular establishment, with common training and officers appointed for military service."
 law_india_company_army:0 "Company’s Army"
 law_india_company_army_desc:0 "A professional army answers to the Company’s government and receives its pay and supplies through a standing military administration."
 law_india_great_indian_army:0 "Great Indian Army"
 law_india_great_indian_army_desc:0 "A permanent army is supported by a broad system of conscription, allowing the government to call large numbers into service."
 law_india_chartered_excise:0 "Chartered Excise"
 law_india_chartered_excise_desc:0 "The government relies on duties upon consumption, collected under the Company’s fiscal authority."
 law_india_company_assessment:0 "Company Assessment"
 law_india_company_assessment_desc:0 "Personal assessments supplement duties and land revenue, bringing a larger share of income within the Company’s tax system."
 tyrone_csr_welfare_button:0 "Extend District Relief"
 tyrone_csr_welfare_button_desc:0 "Relief officers can carry the government’s promises into districts where hardship has given its opponents a hearing."
 tyrone_csr_police_button:0 "Secure the Districts"
 tyrone_csr_police_button_desc:0 "The police seek wider authority in the districts. Opponents of the government fear that the new establishment will be used against them."
 tyrone_csr_schools_button:0 "Recruit Educated Officials"
 tyrone_csr_schools_button_desc:0 "Educated recruits expect a career in public service and salaries sufficient to make it worth pursuing."
 tyrone_csr_health_button:0 "Expand Public Dispensaries"
 tyrone_csr_health_button_desc:0 "Public dispensaries offer treatment beyond the households that can afford private care. Commercial interests will be asked to bear part of the expense."
 tyrone_csr_welfare_intervention:0 "District Relief Expenditure"
 tyrone_csr_welfare_intervention_desc:0 "Relief expenditure has been charged against the government’s ordinary receipts."
 tyrone_csr_police_intervention:0 "An Intrusive Constabulary"
 tyrone_csr_police_intervention_desc:0 "Opposition leaders resent the wider reach of the government’s police."
 tyrone_csr_schools_intervention:0 "An Educated Establishment"
 tyrone_csr_schools_intervention_desc:0 "The administration has raised salaries to attract educated recruits."
 tyrone_csr_health_intervention:0 "Public Dispensary Funding"
 tyrone_csr_health_intervention_desc:0 "Commercial investment bears part of the cost of an expanded medical establishment."
 tyrone_csr_police_reward:0 "Order in the Districts"
 tyrone_csr_police_reward_desc:0 "A regular police establishment has given the administration greater confidence in pursuing its reforms."
 tyrone_csr_army_reward:0 "A Permanent Military Establishment"
 tyrone_csr_army_reward_desc:0 "The army’s new organization helps its officers absorb military practice from abroad."
 tyrone_csr_tax_administration:0 "A Regular Revenue Settlement"
 tyrone_csr_tax_administration_desc:0 "A common revenue system supports the expansion of the tax administration."
 tyrone_csr_tax_currency:0 "Revenue from the Mint"
 tyrone_csr_tax_currency_desc:0 "The treasury has turned to the mint, placing a heavier burden upon poorer households."
 tyrone_csr_public_dividends:0 "Treasury-Backed Enterprise"
 tyrone_csr_public_dividends_desc:0 "The government expects higher returns from its holdings while accepting dearer credit."
 tyrone_csr_private_investment:0 "The Shareholders’ Settlement"
 tyrone_csr_private_investment_desc:0 "The settlement has encouraged capitalist investment and secured the confidence of the shareholders."
 tyrone_csr_construction_drive:0 "The Directors’ Building Programme"
 tyrone_csr_construction_drive_desc:0 "An ambitious building programme has accelerated construction at the expense of labourers’ safety."
 building_group_bg_bureaucracy_construction_efficiency_add:0 "$bg_bureaucracy$ Construction Efficiency"
 building_group_bg_bureaucracy_construction_efficiency_add_desc:0 "An increase or decrease to the weekly [concept_construction] progress for $bg_bureaucracy$."
 tyrone_company_self_rule.1.t:0 "Order in the Districts"
 tyrone_company_self_rule.1.d:0 "The Company’s police establishment now reaches districts where officials once depended upon private retainers. Public unrest has subsided enough for the administration to claim that its authority is taking root."
 tyrone_company_self_rule.1.f:0 "The district officer had asked for a report of every disturbance. For once, the constable returned with little to tell."
 tyrone_company_self_rule.1.a:0 "Let the administration proceed."
 tyrone_company_self_rule.2.t:0 "An Army on the Establishment"
 tyrone_company_self_rule.2.d:0 "The Company has assembled a permanent force capable of serving across its territories. Its officers can now turn their attention to training and the military practices adopted abroad."
 tyrone_company_self_rule.2.f:0 "At the muster, the companies stood in their appointed places. Behind the ranks waited wagons whose arrival the quartermaster had once counted a matter of luck."
 tyrone_company_self_rule.2.a:0 "Keep the regiments ready."
 tyrone_company_self_rule.3.t:0 "The Revenue Settlement"
 tyrone_company_self_rule.3.d:0 "A new system of taxation has given the treasury a firmer basis for its demands. Officials favour a larger revenue establishment, while others urge the directors to draw more freely upon the mint."
 tyrone_company_self_rule.3.f:0 "The collector laid out the expected receipts. The treasurer studied the total, then asked how much of it would actually reach the treasury."
 tyrone_company_self_rule.3.a:0 "Put the revenue offices in order."
 tyrone_company_self_rule.3.b:0 "The mint can meet our needs."
 tyrone_company_self_rule.4.t:0 "The Directors’ Dividend"
 tyrone_company_self_rule.4.d:0 "The police, army, and revenue reforms have all survived their trial. The directors can now commit the proceeds of a stronger administration to the treasury, private enterprise, or a new building programme."
 tyrone_company_self_rule.4.f:0 "The shareholders agreed that the administration had improved. Agreement ended when the chairman asked where its gains should go."
 tyrone_company_self_rule.4.a:0 "Secure a return for the treasury."
 tyrone_company_self_rule.4.b:0 "Give private enterprise room to invest."
 tyrone_company_self_rule.4.c:0 "Approve the building programme."
 tyrone_company_self_rule.5.t:0 "The Company’s Next Charter"
 tyrone_company_self_rule.5.d:0 "The Company’s record has preserved its right to govern. Its directors must now decide whether to pursue an imperial settlement in India or retain the Company itself as the source of political authority."
 tyrone_company_self_rule.5.f:0 "Commercial privilege had brought the directors into government. The document before them concerned the government of a country, and every man at the table knew it."
 tyrone_company_self_rule.5.a:0 "Lay the foundations of an Empire of India."
 tyrone_company_self_rule.5.b:0 "Let the Company govern in its own right."
 tyrone_company_self_rule.6.t:0 "The Charter Withdrawn"
 tyrone_company_self_rule.6.d:0 "The Company’s reform programme has yielded no lasting settlement. Authority has passed directly to the Crown under India’s present overlord, ending the directors’ claim to administer the country on their own terms."
 tyrone_company_self_rule.6.f:0 "The order arrived without a summons to negotiate. The directors were to surrender their public offices and account for the property in their keeping."
 tyrone_company_self_rule.6.a:0 "Transfer the administration."
 tyrone_company_self_rule.7.t:0 "A Government without a Charter"
 tyrone_company_self_rule.7.d:0 "The Company’s promised reforms have failed, but independence has placed India beyond an overlord’s order. The government must seek a new political settlement at home."
 tyrone_company_self_rule.7.f:0 "The charter lay open on the table. There was no minister abroad to renew it, and no agreement in the room on what should take its place."
 tyrone_company_self_rule.7.a:0 "India must settle its own government."


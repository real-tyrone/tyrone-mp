  law_lebensraum_slavery: "Lebensraum"
  law_lebensraum_slavery_desc: "The state claims conquered and colonized lands as the birthright of its accepted peoples, reducing unwanted rural laborers to bondage in the name of settlement, expansion, and national destiny."
  lebensraum_all_slaves_tt: "All non-accepted [GetPopType('laborers').GetName] working in [Concept('concept_building_group', '$bg_agriculture$')], [Concept('concept_building_group', '$bg_ranching$')], or [Concept('concept_building_group', '$bg_plantations$')] become [GetPopType('slaves').GetName]."
  je_lebensraum_slavery: "The Settler Dominion"
  je_lebensraum_slavery_reason: "The state has declared the land to be the destiny of its accepted peoples. Those who do not belong to the nation are to serve it, bound to the soil and compelled to labor for the prosperity of their new masters."
  je_lebensraum_slavery_status: "Non-accepted laborers on [Concept('concept_building_group', '$bg_agriculture$')], [Concept('concept_building_group', '$bg_ranching$')], or [Concept('concept_building_group', '$bg_plantations$')] buildings are being forced to become [GetPopType('slaves').GetName]."
  lebensraum_base_slavery_button: "Restrict Forced Labor"
  lebensraum_base_slavery_button_desc: "Limit the enslavement policy to agricultural, ranching, and plantation labor."
  lebensraum_expand_slavery_button: "Expand Forced Labor"
  lebensraum_expand_slavery_button_desc: "Broaden the forced labor regime beyond its current limits."
  lebensraum_expand_slavery_railway_button: "Bind Labor to the Railways"
  lebensraum_expand_slavery_railway_button_desc: "Extend the use of enslaved labor to railway work."
  lebensraum_remove_slavery_railway_button: "Exempt the Railways"
  lebensraum_remove_slavery_railway_button_desc: "End the use of enslaved labor on the railways."
  lebensraum_expand_slavery_turmoil_button: "Impose Labor Discipline"
  lebensraum_expand_slavery_turmoil_button_desc: "Use the forced labor regime to suppress unrest and bind turbulent communities more tightly to state control."
  lebensraum_remove_slavery_turmoil_button: "Relax Labor Discipline"
  lebensraum_remove_slavery_turmoil_button_desc: "Scale back the forced labor measures used to contain unrest."

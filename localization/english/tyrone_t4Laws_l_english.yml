l_english:
  bolster_popularity_character_interaction:0 "Bolster Popularity"
  bolster_popularity_character_interaction_desc:0 "Increase this character's popularity for a limited time."

  manual_lobotomy_character_interaction:0 "Political Assassination"
  manual_lobotomy_character_interaction_desc:0 "Permanently remove this individual from the political stage through discreet state measures. Their disappearance will significantly anger their associated interest group and increase political radicalization."

  can_political_assassination_state_press:0 "Can stage Political Assassinations"
  can_political_assassination_state_press_desc:0 "Will be able to use the character interaction #gold Political Assassination#!"
  can_more_popularity_prc_speech:0 "Allows Character Publicity" 
  can_more_popularity_prc_speech_desc:0 "Will be able to use the character interaction #gold Bolster Popularity#!"
  can_exile_prc_speech:0 "Can Exile Characters" 
  can_exile_prc_speech_desc:0 "Unlike base Protected Speech, Exile Characters is allowed."
  bolster_popularity_character:0 "Man of the Hour"

  law_civic_speech_protections:0 "Civic Speech Protections"
  law_civic_speech_protections_desc:0 "Guarantees protected expression within civil society, limiting state interference in public discourse while still allowing controlled influence over public opinion."
  law_centralized_press_authority:0 "Centralized Press Authority"
  law_centralized_press_authority_desc:0 "Places public discourse under direct state coordination, allowing the government to actively shape narratives, suppress dissent, and regulate political expression."

  free_speech_reform_freespeech_tt:0 "Has Completed the journal entry #gold Mass Media and the Politics of Film#! on #italic Free Speech#!"
  free_speech_reform_nazi_tt:0 "Has Completed the journal entry #gold Mass Media and the Politics of Film#! on #italic Outlawed Dissent#!"

  je_reform_censorship:0 "Mass Media and the Politics of Film"
  je_reform_censorship_reason:0 "The projector no longer merely entertains; it drills a thought into the crowd, frame by frame, until policy begins to feel like common sense. The question is no longer whether [concept_law|pl] can govern public discourse, but which hands will guide the lens.\n\n#bold Appeasement Ledger#!\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('intelligentsia_speechreform_appeasement').GetValue, '(CFixedPoint)100'),'@green_checkmark_box!','@simple_box!')] @intelligentsia! #bold Intelligentsia#!: #variable [GetPlayer.MakeScope.Var('intelligentsia_speechreform_appeasement').GetValue|v0]#!/#v 100#! - classrooms, journals, and public reason bend toward #italic Free Speech#!.\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('industrialist_speechreform_appeasement').GetValue, '(CFixedPoint)100'),'@green_checkmark_box!','@simple_box!')] @industrialists! #bold Industrialists#!: #variable [GetPlayer.MakeScope.Var('industrialist_speechreform_appeasement').GetValue|v0]#!/#v 100#! - studios, capital, and distribution can crown either path.\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('armed_forces_speechreform_appeasement').GetValue, '(CFixedPoint)100'),'@green_checkmark_box!','@simple_box!')] @armed_forces! #bold Armed Forces#!: #variable [GetPlayer.MakeScope.Var('armed_forces_speechreform_appeasement').GetValue|v0]#!/#v 100#! - discipline, ceremony, and command pull the nation toward #italic Outlawed Dissent#!."
  je_reform_censorship_desc:0 "The [concept_interest_group|pl] of [ROOT.GetCountry.GetName] are watching closely. Whoever controls the press and the screen controls the politics of tomorrow."

  free_speech_reform.1.t:0 "A Nation Before the Screen"
  free_speech_reform.1.d:0 "Film has arrived in [ROOT.GetCountry.GetName], and with it a new battleground for public opinion. The [concept_interest_group|pl] jockey for influence over this powerful medium."
  free_speech_reform.1.f:0 "The projector hums. The crowd watches. History is being written in light."
  free_speech_reform.1.a:0 "Back the Intelligentsia"
  free_speech_reform.1.b:0 "Rally the Landowners"
  free_speech_reform.1.c:0 "Arm the Military's Voice"
  free_speech_reform.1.e:0 "Empower Industry"
  free_speech_reform.1.g:0 "Let the Intelligentsia Lead"
  free_speech_reform.1.h:0 "Support the Trade Unions"
  free_speech_reform.1.i:0 "Elevate the Petite Bourgeoisie"

  t4_speechreform_action_intelligentsia_tt:0 "Triggers one of five Intelligentsia events.\n\n#gold Education#! institution investment lvl #v 5#!:\n#P Excellent#!: #v 35%#!, #P Good#!: #v 35%#!, Neutral: #v 15%#!, #N Bad#!: #v 10%#!, #N Disastrous#!: #v 5%#!.\n\nInvestment lvl #v 3#!:\n#P Excellent#!: #v 25%#!, #P Good#!: #v 30%#!, Neutral: #v 20%#!, #N Bad#!: #v 15%#!, #N Disastrous#!: #v 10%#!.\n\nInvestment lvl #v 1#!:\n#P Excellent#!: #v 15%#!, #P Good#!: #v 20%#!, Neutral: #v 20%#!, #N Bad#!: #v 25%#!, #N Disastrous#!: #v 20%#!.\n\nNo investment:\n#P Excellent#!: #v 5%#!, #P Good#!: #v 10%#!, Neutral: #v 15%#!, #N Bad#!: #v 35%#!, #N Disastrous#!: #v 35%#!.\n\nPositive outcomes increase @intelligentsia! appeasement and push #bold Public Voice#! toward #P Free Speech#!. Failed outcomes reverse that pressure."
  t4_speechreform_action_industrialist_tt:0 "Triggers one of five Industrialist events.\n\n#gold Law Enforcement#! institution investment lvl #v 5#!:\n#P Excellent#!: #v 35%#!, #P Good#!: #v 35%#!, Neutral: #v 15%#!, #N Bad#!: #v 10%#!, #N Disastrous#!: #v 5%#!.\n\nInvestment lvl #v 3#!:\n#P Excellent#!: #v 25%#!, #P Good#!: #v 30%#!, Neutral: #v 20%#!, #N Bad#!: #v 15%#!, #N Disastrous#!: #v 10%#!.\n\nInvestment lvl #v 1#!:\n#P Excellent#!: #v 15%#!, #P Good#!: #v 20%#!, Neutral: #v 20%#!, #N Bad#!: #v 25%#!, #N Disastrous#!: #v 20%#!.\n\nNo investment:\n#P Excellent#!: #v 5%#!, #P Good#!: #v 10%#!, Neutral: #v 15%#!, #N Bad#!: #v 35%#!, #N Disastrous#!: #v 35%#!.\n\nOutcomes change @industrialists! appeasement. Industrialists do not move the #bold Public Voice#! bar."
  t4_speechreform_action_armed_forces_tt:0 "Triggers one of five Armed Forces events.\n\n#gold Home Affairs#! institution investment lvl #v 5#!:\n#P Excellent#!: #v 35%#!, #P Good#!: #v 35%#!, Neutral: #v 15%#!, #N Bad#!: #v 10%#!, #N Disastrous#!: #v 5%#!.\n\nInvestment lvl #v 3#!:\n#P Excellent#!: #v 25%#!, #P Good#!: #v 30%#!, Neutral: #v 20%#!, #N Bad#!: #v 15%#!, #N Disastrous#!: #v 10%#!.\n\nInvestment lvl #v 1#!:\n#P Excellent#!: #v 15%#!, #P Good#!: #v 20%#!, Neutral: #v 20%#!, #N Bad#!: #v 25%#!, #N Disastrous#!: #v 20%#!.\n\nNo investment:\n#P Excellent#!: #v 5%#!, #P Good#!: #v 10%#!, Neutral: #v 15%#!, #N Bad#!: #v 35%#!, #N Disastrous#!: #v 35%#!.\n\nPositive outcomes increase @armed_forces! appeasement and push #bold Public Voice#! toward #N State Control#!. Failed outcomes reverse that pressure."
  t4_speechreform_action_intelligentsia_brief_tt:0 "Higher #gold Education#! investment improves the odds of a favorable @intelligentsia! outcome."
  t4_speechreform_action_industrialist_brief_tt:0 "Higher #gold Law Enforcement#! investment improves the odds of a favorable @industrialists! outcome."
  t4_speechreform_action_armed_forces_brief_tt:0 "Higher #gold Home Affairs#! investment improves the odds of a favorable @armed_forces! outcome."

  t4_speechreform_balance_bar_name:0 "Free Speech"
  t4_speechreform_balance_free_speech:0 "#P Free Speech#!"
  t4_speechreform_balance_state_control:0 "#N State Control#!"
  t4_speechreform_balance_bar_tt:0 "Measures where the campaign is pulling public discourse. #P 0#! means the reform is drifting toward #bold Free Speech#!; #N 100#! means it is hardening into #bold State Control#!. Intelligentsia successes move left, Armed Forces successes move right. Failed actions reverse their intended pressure."

  t4_speechreform_actions.a:0 "Let it be recorded."
  t4_speechreform_actions.1.a:0 "Circulate the edition everywhere."
  t4_speechreform_actions.2.a:0 "Save the clippings."
  t4_speechreform_actions.3.a:0 "Keep the column inches coming."
  t4_speechreform_actions.4.a:0 "Find out who printed it."
  t4_speechreform_actions.5.a:0 "Call the printers back to the table."
  t4_speechreform_actions.6.a:0 "Let the gesture be seen."
  t4_speechreform_actions.7.a:0 "A quiet success will do."
  t4_speechreform_actions.8.a:0 "Keep the promises private."
  t4_speechreform_actions.9.a:0 "This will haunt the ministry."
  t4_speechreform_actions.10.a:0 "Seal the files and deny the panic."
  t4_speechreform_actions.11.a:0 "Pack the next lecture hall."
  t4_speechreform_actions.12.a:0 "Put it on the syllabus."
  t4_speechreform_actions.13.a:0 "A measured debate is still useful."
  t4_speechreform_actions.14.a:0 "Rewrite the brief before dawn."
  t4_speechreform_actions.15.a:0 "Count the signatures carefully."
  t4_speechreform_actions.16.a:0 "Put the reels before every feature."
  t4_speechreform_actions.17.a:0 "Keep the shipments moving."
  t4_speechreform_actions.18.a:0 "Respectable enough."
  t4_speechreform_actions.19.a:0 "Do not mention the empty seats."
  t4_speechreform_actions.20.a:0 "Replace the reel and the story."
  t4_speechreform_actions.21.a:0 "Let the minutes stand."
  t4_speechreform_actions.22.a:0 "Pin the notices higher."
  t4_speechreform_actions.23.a:0 "Take the cautious money."
  t4_speechreform_actions.24.a:0 "Reassure the nervous shareholders."
  t4_speechreform_actions.25.a:0 "Close the ledger before anyone reads it."
  t4_speechreform_actions.26.a:0 "Sell tomorrow today."
  t4_speechreform_actions.27.a:0 "Keep the sponsors smiling."
  t4_speechreform_actions.28.a:0 "Polite applause is still applause."
  t4_speechreform_actions.29.a:0 "Scrape off the rust."
  t4_speechreform_actions.30.a:0 "Clear the hall before the press arrives."
  t4_speechreform_actions.31.a:0 "Send the reels nationwide."
  t4_speechreform_actions.32.a:0 "Approve the final cut."
  t4_speechreform_actions.33.a:0 "Stamp it and move on."
  t4_speechreform_actions.34.a:0 "Recall the costumes."
  t4_speechreform_actions.35.a:0 "Lock the bureau doors."
  t4_speechreform_actions.36.a:0 "Let the barracks cheer."
  t4_speechreform_actions.37.a:0 "Maintain the schedule."
  t4_speechreform_actions.38.a:0 "Silence is acceptable."
  t4_speechreform_actions.39.a:0 "End the screening early."
  t4_speechreform_actions.40.a:0 "Restore discipline at once."
  t4_speechreform_actions.41.a:0 "Make obedience visible."
  t4_speechreform_actions.42.a:0 "Keep the tone severe."
  t4_speechreform_actions.43.a:0 "Severity has done enough."
  t4_speechreform_actions.44.a:0 "Strike the stage dressing."
  t4_speechreform_actions.45.a:0 "Find whoever approved this."

  t4_speechreform_actions.1.t:0 "@green_checkmark! Triumphant Morning Edition"
  t4_speechreform_actions.1.d:0 "A chain of sympathetic editors turns the reform into the day's unavoidable story. By noon, every respectable reading room has the same argument folded beside its coffee."
  t4_speechreform_actions.1.f:0 "The ink dries quickly when everyone already knows which page to open."
  t4_speechreform_actions.2.t:0 "@green_checkmark! Favorable Columns"
  t4_speechreform_actions.2.d:0 "Several influential papers endorse the campaign with uncommon restraint. Their approval is not ecstatic, but it gives the Intelligentsia room to defend the project."
  t4_speechreform_actions.2.f:0 "A cautious editorial can carry farther than a shouted slogan."
  t4_speechreform_actions.3.t:0 "@green_checkmark! Muted Below the Fold"
  t4_speechreform_actions.3.d:0 "The press covers the initiative without passion. It neither catches fire nor collapses, leaving the Intelligentsia mildly reassured but still watchful."
  t4_speechreform_actions.3.f:0 "Page three is still a page."
  t4_speechreform_actions.4.t:0 "@red_cross! Satire Takes the Lead"
  t4_speechreform_actions.4.d:0 "A clever opposition sheet makes the campaign look vain and mechanical. The joke spreads faster than the official line, souring intellectual opinion."
  t4_speechreform_actions.4.f:0 "Nothing wounds a ministry like laughter it cannot prosecute."
  t4_speechreform_actions.5.t:0 "@red_cross! The Press Turns Blank"
  t4_speechreform_actions.5.d:0 "A dispute with editors and printers becomes a public humiliation. The Intelligentsia read the affair as proof that the state understands neither speech nor persuasion."
  t4_speechreform_actions.5.f:0 "There are days when the press answers by leaving the paper blank."

  t4_speechreform_actions.6.t:0 "@green_checkmark! Celebrated Dissident Shield"
  t4_speechreform_actions.6.d:0 "A well-known dissident accepts quiet protection and uses the moment to praise the reform's promise. The Intelligentsia see principle and calculation moving together."
  t4_speechreform_actions.6.f:0 "A door left unlocked can be more persuasive than a speech."
  t4_speechreform_actions.7.t:0 "@green_checkmark! Quiet Victory in the Courts"
  t4_speechreform_actions.7.d:0 "Officials defuse a sensitive case before it becomes a spectacle. Intellectual circles notice the restraint and cautiously credit the reform effort."
  t4_speechreform_actions.7.f:0 "The scandal that never happens still changes the room."
  t4_speechreform_actions.8.t:0 "@green_checkmark! Cautious Private Assurances"
  t4_speechreform_actions.8.d:0 "The government offers guarantees to several controversial writers. They remain skeptical, but the gesture keeps the Intelligentsia at the table."
  t4_speechreform_actions.8.f:0 "Trust begins, sometimes, as a document no one wants to sign."
  t4_speechreform_actions.9.t:0 "@red_cross! A Martyr Made in Ink"
  t4_speechreform_actions.9.d:0 "A heavy-handed local official transforms a minor critic into a symbol. Intellectual supporters recoil from the needless display of force."
  t4_speechreform_actions.9.f:0 "A quiet voice becomes loudest when someone tries to silence it."
  t4_speechreform_actions.10.t:0 "@red_cross! The Study Is Raided"
  t4_speechreform_actions.10.d:0 "Searches of private papers ignite outrage across universities and salons. The Intelligentsia now suspect the reform hides an old censor in a new coat."
  t4_speechreform_actions.10.f:0 "The dust on a desk can look like evidence to the wrong sort of man."

  t4_speechreform_actions.11.t:0 "@green_checkmark! Lecture Hall Triumph"
  t4_speechreform_actions.11.d:0 "Professors and filmmakers stage public lectures around new reels, making reform look both modern and learned. The Intelligentsia respond with rare enthusiasm."
  t4_speechreform_actions.11.f:0 "The projector becomes a blackboard; the hall becomes a nation."
  t4_speechreform_actions.12.t:0 "@green_checkmark! Screens in the Syllabus"
  t4_speechreform_actions.12.d:0 "Schools and universities quietly fold the campaign's themes into lectures and civic clubs. The effect is gradual, but the Intelligentsia appreciate the seriousness."
  t4_speechreform_actions.12.f:0 "Some revolutions arrive as assigned reading."
  t4_speechreform_actions.13.t:0 "@green_checkmark! Debate Without Fire"
  t4_speechreform_actions.13.d:0 "An academic forum gives the reform a careful airing. No consensus emerges, yet the process flatters the Intelligentsia enough to preserve goodwill."
  t4_speechreform_actions.13.f:0 "Three hours, seven objections, one small step forward."
  t4_speechreform_actions.14.t:0 "@red_cross! Footnotes Cut Deep"
  t4_speechreform_actions.14.d:0 "Scholars pick apart the campaign's language with merciless precision. The reform's intellectual cover thins as every phrase becomes a target."
  t4_speechreform_actions.14.f:0 "A bad sentence can become a constitutional crisis in the right seminar."
  t4_speechreform_actions.15.t:0 "@red_cross! The Rector Denounces Us"
  t4_speechreform_actions.15.d:0 "A coalition of academic leaders denounces the program as vulgar theater. Their letter circulates widely and sharply damages Intelligentsia support."
  t4_speechreform_actions.15.f:0 "The signature line was longer than the accusation."

  t4_speechreform_actions.16.t:0 "@green_checkmark! Packed Houses for the Reels"
  t4_speechreform_actions.16.d:0 "Industrial sponsors secure prime placement in packed cinemas. The campaign looks sleek, inevitable, and profitable enough to win eager business backing."
  t4_speechreform_actions.16.f:0 "Every ticket stub becomes a tiny receipt for consensus."
  t4_speechreform_actions.17.t:0 "@green_checkmark! Clean Distribution Victory"
  t4_speechreform_actions.17.d:0 "Studios and distributors cooperate without much complaint. The Industrialists like the orderliness of the operation and the absence of costly scandal."
  t4_speechreform_actions.17.f:0 "A smooth shipment can feel like a political philosophy."
  t4_speechreform_actions.18.t:0 "@green_checkmark! Adequate Receipts"
  t4_speechreform_actions.18.d:0 "The newsreels perform respectably but fail to become a sensation. Industrial backers remain involved because the venture has not embarrassed them."
  t4_speechreform_actions.18.f:0 "Profit has many dialects; this one mutters."
  t4_speechreform_actions.19.t:0 "@red_cross! Empty Afternoon Shows"
  t4_speechreform_actions.19.d:0 "Audiences drift away from the state-backed reels, leaving cinema owners irritated. The Industrialists begin to question the value of political programming."
  t4_speechreform_actions.19.f:0 "The projector ran. The seats answered."
  t4_speechreform_actions.20.t:0 "@red_cross! A Reel Burns in Public"
  t4_speechreform_actions.20.d:0 "A technical failure becomes a public metaphor for the entire initiative. Investors withdraw support before the embarrassment stains their own names."
  t4_speechreform_actions.20.f:0 "Smoke in the booth, coughing in the balcony, silence in the ledgers."

  t4_speechreform_actions.21.t:0 "@green_checkmark! Boardroom Consensus"
  t4_speechreform_actions.21.d:0 "Major firms coordinate their public messaging with surprising discipline. The Industrialists discover that politics can be managed like a brand launch."
  t4_speechreform_actions.21.f:0 "The minutes of the meeting read almost like a manifesto."
  t4_speechreform_actions.22.t:0 "@green_checkmark! Notices on Every Wall"
  t4_speechreform_actions.22.d:0 "Employers circulate carefully worded support through workshops and offices. The message is dry, but it reaches thousands of workers before supper."
  t4_speechreform_actions.22.f:0 "A notice board is not a podium, but every shift passes it."
  t4_speechreform_actions.23.t:0 "@green_checkmark! Lukewarm Commercial Backing"
  t4_speechreform_actions.23.d:0 "Companies support the campaign in limited terms, avoiding both controversy and commitment. The Industrialists remain useful, if not inspired."
  t4_speechreform_actions.23.f:0 "The safest endorsement is often the least memorable."
  t4_speechreform_actions.24.t:0 "@red_cross! Shareholders Break Rank"
  t4_speechreform_actions.24.d:0 "A handful of prominent investors complain that politics is being dragged into commerce. The Industrialists become wary of further public alignment."
  t4_speechreform_actions.24.f:0 "Capital likes influence best when it does not have to admit it."
  t4_speechreform_actions.25.t:0 "@red_cross! Boycott in the Ledgers"
  t4_speechreform_actions.25.d:0 "Opponents organize a damaging commercial boycott against visible supporters of the campaign. Industrialists decide the state has made them pay for its slogans."
  t4_speechreform_actions.25.f:0 "Numbers can accuse without raising their voice."

  t4_speechreform_actions.26.t:0 "@green_checkmark! Modern Industry Sells the Future"
  t4_speechreform_actions.26.d:0 "The campaign ties reform to factories, electricity, and the language of national modernization. Industrialists embrace the image of themselves as builders of tomorrow."
  t4_speechreform_actions.26.f:0 "The future sounds better when it has machinery behind it."
  t4_speechreform_actions.27.t:0 "@green_checkmark! Polished Industrial Alliance"
  t4_speechreform_actions.27.d:0 "Industrial associations lend venues, funds, and respectable speakers. The campaign gains polish and the Industrialists gain a role they understand."
  t4_speechreform_actions.27.f:0 "Progress, properly invoiced, becomes policy."
  t4_speechreform_actions.28.t:0 "@green_checkmark! Exhibition Without Wonder"
  t4_speechreform_actions.28.d:0 "The display of modern industry draws polite crowds but little fervor. Still, the Industrialists appreciate being treated as central to the reform."
  t4_speechreform_actions.28.f:0 "There is applause, then there is the sound people make because they are expected to."
  t4_speechreform_actions.29.t:0 "@red_cross! Rust Beneath the Paint"
  t4_speechreform_actions.29.d:0 "Critics expose the campaign's industrial imagery as cheap ornament over unresolved problems. Business leaders dislike being made symbols of empty progress."
  t4_speechreform_actions.29.f:0 "A polished machine still groans if the gears are wrong."
  t4_speechreform_actions.30.t:0 "@red_cross! Collapse at the Exhibition"
  t4_speechreform_actions.30.d:0 "A showcase meant to celebrate modern industry descends into confusion, delays, and public ridicule. The Industrialists leave furious at the damage to their prestige."
  t4_speechreform_actions.30.f:0 "The banner promised tomorrow. The scaffolding promised otherwise."

  t4_speechreform_actions.31.t:0 "@green_checkmark! Film Bureau Triumph"
  t4_speechreform_actions.31.d:0 "Military-approved reels present discipline and unity with arresting force. The Armed Forces see their prestige amplified rather than exploited."
  t4_speechreform_actions.31.f:0 "Light crosses the screen like a command."
  t4_speechreform_actions.32.t:0 "@green_checkmark! Patriotic Cut Approved"
  t4_speechreform_actions.32.d:0 "The bureau trims clumsy scenes and sharpens the message. Officers report that the finished reels honor the institution without overreaching."
  t4_speechreform_actions.32.f:0 "The splice is invisible; that is why it works."
  t4_speechreform_actions.33.t:0 "@green_checkmark! Serviceable Showing"
  t4_speechreform_actions.33.d:0 "The films pass through military channels without much enthusiasm. They are serviceable enough to keep the Armed Forces cooperative."
  t4_speechreform_actions.33.f:0 "Sometimes approval is just a stamp pressed hard enough."
  t4_speechreform_actions.34.t:0 "@red_cross! Uniforms Made Ridiculous"
  t4_speechreform_actions.34.d:0 "Veterans and officers complain that the film bureau has turned service into costume. The Armed Forces resent the theatrical treatment of their authority."
  t4_speechreform_actions.34.f:0 "A button sewn in the wrong place can insult an entire regiment."
  t4_speechreform_actions.35.t:0 "@red_cross! Bureau Scandal Erupts"
  t4_speechreform_actions.35.d:0 "Charges of favoritism and waste engulf the patriotic film office. The Armed Forces blame civilian management for dragging their name through public embarrassment."
  t4_speechreform_actions.35.f:0 "The ledgers were sealed. The rumors were not."

  t4_speechreform_actions.36.t:0 "@green_checkmark! Barracks Applaud"
  t4_speechreform_actions.36.d:0 "Screenings in barracks become a genuine morale success. Soldiers repeat the slogans with enough conviction that their officers report unusual satisfaction."
  t4_speechreform_actions.36.f:0 "For once, the darkened hall feels like formation."
  t4_speechreform_actions.37.t:0 "@green_checkmark! Orderly Screenings"
  t4_speechreform_actions.37.d:0 "The campaign runs cleanly through military facilities. The Armed Forces appreciate the efficiency and the absence of public disorder."
  t4_speechreform_actions.37.f:0 "A projector, a schedule, and no surprises."
  t4_speechreform_actions.38.t:0 "@green_checkmark! Quiet Ranks"
  t4_speechreform_actions.38.d:0 "The barracks screenings are received without incident. The effect is modest, but the Armed Forces are content enough to continue."
  t4_speechreform_actions.38.f:0 "Silence can mean boredom. It can also mean compliance."
  t4_speechreform_actions.39.t:0 "@red_cross! Restless Ranks"
  t4_speechreform_actions.39.d:0 "Poorly timed screenings irritate soldiers already strained by duty. Officers complain that the campaign is disrupting discipline rather than strengthening it."
  t4_speechreform_actions.39.f:0 "A bad hour can ruin a good message."
  t4_speechreform_actions.40.t:0 "@red_cross! Heckled Before the Corps"
  t4_speechreform_actions.40.d:0 "A screening collapses into open mockery, and reports spread through the officer corps. The Armed Forces are furious that the campaign invited disrespect."
  t4_speechreform_actions.40.f:0 "The reel kept turning after authority had already left the room."

  t4_speechreform_actions.41.t:0 "@green_checkmark! Discipline Commands the Crowd"
  t4_speechreform_actions.41.d:0 "A national discipline campaign presents obedience as civic virtue and strength. The Armed Forces recognize their values at the center of public life."
  t4_speechreform_actions.41.f:0 "The crowd does not cheer; it straightens."
  t4_speechreform_actions.42.t:0 "@green_checkmark! Stern Tone Accepted"
  t4_speechreform_actions.42.d:0 "The message is stern without becoming crude. Military leaders welcome the campaign's respect for order and its refusal to indulge frivolity."
  t4_speechreform_actions.42.f:0 "There is music in restraint, if one listens correctly."
  t4_speechreform_actions.43.t:0 "@green_checkmark! Severity Without Enthusiasm"
  t4_speechreform_actions.43.d:0 "The public receives the discipline campaign with mixed feelings. The Armed Forces are not thrilled, but they accept the effort as broadly aligned with their interests."
  t4_speechreform_actions.43.f:0 "A hard message does not need to be loved."
  t4_speechreform_actions.44.t:0 "@red_cross! Theater Spoils Discipline"
  t4_speechreform_actions.44.d:0 "The campaign's staged severity looks absurd to many officers. The Armed Forces conclude that discipline has been reduced to posture."
  t4_speechreform_actions.44.f:0 "A salute performed badly is worse than none."
  t4_speechreform_actions.45.t:0 "@red_cross! The Nation Laughs at Command"
  t4_speechreform_actions.45.d:0 "A solemn appeal to discipline becomes a national joke. The Armed Forces take the humiliation personally and withdraw support with unusual anger."
  t4_speechreform_actions.45.f:0 "The state asked for silence and received applause in all the wrong places."


l_english:
 je_tyrone_raj_nation:0 "The Way of the Nation"
 je_tyrone_raj_nation_reason:0 "Schools and relief offices have drawn the government into disputes over who should administer public provision. Supporters of [GetLawType('law_chartered_imperial_public_schools').GetName] and [GetLawType('law_chartered_public_health_insurance').GetName] seek common standards and direct supervision along #v British#! lines. #v Princes#!, #v caste associations#!, and #v religious patrons#! defend arrangements such as [GetLawType('law_chartered_caste_relief_rolls').GetName] and [GetLawType('law_caste_charitable_health_system').GetName], which preserve their place in local administration.\n\nThe dispute concerns appointments, access to assistance, and the right to speak for those who depend upon it. Whatever its relationship with an overlord, India must settle how much authority belongs to government offices and how much remains with established communities."
 je_tyrone_raj_nation_status:0 ""
 je_tyrone_raj_nation_goal:0 "Reach #variable −60#! princely influence or #variable +60#! imperial influence."
 tyrone_raj_nation_goal_tt:0 "Either model has reached #variable 60#! influence"
 tyrone_raj_nation_bar_name:0 "The Institutional Settlement"
 tyrone_raj_nation_caste_pole:0 "The Princely System"
 tyrone_raj_nation_imperial_pole:0 "Imperial Institutions"
 tyrone_raj_nation_education_progress:0 "Education laws"
 tyrone_raj_nation_welfare_progress:0 "Welfare laws"
 tyrone_raj_nation_health_progress:0 "Healthcare laws"
 tyrone_raj_nation_caste_progress:0 "Caste laws"
 tyrone_raj_nation_religion_progress:0 "Religious patronage"
 tyrone_raj_nation_intervention_progress:0 "Administrative initiative"
 tyrone_raj_nation_caste_outcome:0 "#title #v A Princely Settlement:#!#!"
 tyrone_raj_nation_imperial_outcome:0 "#title #v An Imperial Settlement:#!#!"
 tyrone_raj_nation_imperial_button:0 "Sponsor Imperial Institutions"
 tyrone_raj_nation_imperial_button_desc:0 "Common standards give the central administration a claim to supervise schools, charities, and public offices. Their supporters seek officials who answer to the government, with fewer obligations to local patrons."
 tyrone_raj_nation_caste_button:0 "Recognize Local Patrons"
 tyrone_raj_nation_caste_button_desc:0 "Princes and caste associations already sustain institutions upon which many communities depend. Their patrons seek official recognition for the authority that accompanies those obligations."
 tyrone_raj_nation_initiative_available_tt:0 "No institutional initiative is active"
 tyrone_raj_nation_imperial_initiative_tt:0 "Moves #variable 1#! monthly towards imperial institutions for one year."
 tyrone_raj_nation_caste_initiative_tt:0 "Moves #variable 1#! monthly towards the princely system for one year."
 tyrone_raj_nation_imperial_five_tt:0 "Moves the bar #variable +5#! towards Imperial Institutions."
 tyrone_raj_nation_caste_five_tt:0 "Moves the bar #variable -5#! towards The Princely System."
 tyrone_raj_nation_intervention_cost:0 "Institutional Initiative"
 tyrone_raj_nation_intervention_cost_desc:0 "Officials have been assigned to secure support for a particular model of public administration."
 tyrone_raj_nation_patronage_grants:0 "Recognized Educational Patrons"
 tyrone_raj_nation_patronage_grants_desc:0 "The administration is supervising grants and agreements with established educational patrons."
 tyrone_raj_nation_relief_registers:0 "District Relief Registers"
 tyrone_raj_nation_relief_registers_desc:0 "The treasury is funding district registers and inspections to administer relief directly."
 tyrone_raj_nation_devout_excluded:0 "Educational Patrons Excluded"
 tyrone_raj_nation_devout_excluded_desc:0 "Religious patrons resent the transfer of educational appointments to government officials."
 tyrone_raj_nation_relief_excluded:0 "Excluded from Relief"
 tyrone_raj_nation_relief_excluded_desc:0 "Cultivators resent relief arrangements that leave access to assistance in the hands of recognized local patrons."
 tyrone_raj_nation_princes_overruled:0 "Local Jurisdictions Overruled"
 tyrone_raj_nation_princes_overruled_desc:0 "Landed authorities resent the extension of government supervision over their courts."
 tyrone_raj_nation_jurists_overruled:0 "Petitions for Legal Reform Dismissed"
 tyrone_raj_nation_jurists_overruled_desc:0 "Educated reformers resent the government’s recognition of separate local jurisdictions."
 tyrone_raj_nation.1.t:0 "A Place at the College"
 tyrone_raj_nation.1.d:0 "The patrons of a government-supported college claim the right to nominate its next pupils. Officials want admissions decided by a common examination, opening places to candidates without a patron’s recommendation."
 tyrone_raj_nation.1.f:0 "The principal recognized the family names on the list. Their donations had repaired the roof; several of the candidates had never sat an examination."
 tyrone_raj_nation.1.a:0 "Admit pupils by examination."
 tyrone_raj_nation.1.b:0 "Recognize the patrons’ nominations."
 tyrone_raj_nation.2.t:0 "Names on the Relief Rolls"
 tyrone_raj_nation.2.d:0 "Cultivators omitted from the local relief rolls have petitioned the district office. Officials propose registering applicants themselves, but landed patrons insist that the distribution of assistance remains their responsibility."
 tyrone_raj_nation.2.f:0 "The headman read out the recipients while a woman waited with her petition. Her village was on the list. Her household was not."
 tyrone_raj_nation.2.a:0 "Register applicants at the district office."
 tyrone_raj_nation.2.b:0 "Accept the local patrons’ rolls."
 tyrone_raj_nation.3.t:0 "The Authority to Judge"
 tyrone_raj_nation.3.d:0 "A litigant has appealed against a local court’s decision. Government jurists demand the right to review its judgments; the court’s patrons argue that their jurisdiction is protected by an established settlement."
 tyrone_raj_nation.3.f:0 "The magistrate asked which rule had decided the case. The reply named the family that had administered the court for generations."
 tyrone_raj_nation.3.a:0 "Subject the court to government review."
 tyrone_raj_nation.3.b:0 "Uphold the local court’s jurisdiction."
 tyrone_raj_nation.4.t:0 "A Princely Settlement"
 tyrone_raj_nation.4.d:0 "The government of [ROOT.GetCountry.GetName] has recognized caste institutions and princely authority as foundations of its administration. Local patrons will retain an established place in public affairs under a codified settlement."
 tyrone_raj_nation.4.f:0 "The audience ended with assurances on both sides. The government promised recognition; the assembled patrons promised cooperation. Outside the chamber, petitioners waited to learn which of them would now speak on their behalf."
 tyrone_raj_nation.4.a:0 "Let the settlement be recorded."
 tyrone_raj_nation.5.t:0 "An Imperial Settlement"
 tyrone_raj_nation.5.d:0 "The government of [ROOT.GetCountry.GetName] has committed its administration to institutions shaped by the British model. The informal class settlement has been set aside as officials assert a wider authority over public provision."
 tyrone_raj_nation.5.f:0 "The circular reached the district office among the ordinary correspondence. Its language was familiar, but the clerk paused at the paragraph withdrawing the old guarantees. Several petitions on his desk would have to be reconsidered."
 tyrone_raj_nation.5.a:0 "Proceed with the new settlement."
 tyrone_raj_nation.6.t:0 "Who May Practise?"
 tyrone_raj_nation.6.d:0 "Government physicians want dispensaries inspected and practitioners licensed by a district medical board. The religious charities that maintain several clinics object to placing their appointments under official supervision."
 tyrone_raj_nation.6.f:0 "The inspector asked to see the dispensary’s accounts. Its patron offered to show him the patients who had been treated there that morning."
 tyrone_raj_nation.6.a:0 "Authorize the medical board’s inspections."
 tyrone_raj_nation.6.b:0 "Leave the dispensaries with their patrons."
 tyrone_raj_nation.7.t:0 "An Office in the Family"
 tyrone_raj_nation.7.d:0 "A vacancy in a district office has brought competing claims. Officials propose a salaried appointment from the government service, while the former office-holder’s family expects to nominate his successor."
 tyrone_raj_nation.7.f:0 "The departing official handed over the keys to his son. Neither had thought it necessary to ask who would receive them."
 tyrone_raj_nation.7.a:0 "Appoint a salaried government officer."
 tyrone_raj_nation.7.b:0 "Confirm the family’s nominee."
 tyrone_raj_nation.8.t:0 "The District Accounts"
 tyrone_raj_nation.8.d:0 "An inquiry into district revenues has uncovered separate accounts maintained by local intermediaries. Treasury officials want common returns and an audit of exemptions; the intermediaries offer guarantees of payment if their existing arrangements are respected."
 tyrone_raj_nation.8.f:0 "Two totals appeared at the foot of the account. The treasury clerk circled the difference. Across the table, the collector began to explain the exemptions."
 tyrone_raj_nation.8.a:0 "Require common accounts and an audit."
 tyrone_raj_nation.8.b:0 "Accept the intermediaries’ guarantees."
 tyrone_raj_nation_examiners_supported:0 "Examinations Endorsed"
 tyrone_raj_nation_examiners_supported_desc:0 "Educated reformers support appointments decided by a common examination."
 tyrone_raj_nation_college_patrons_supported:0 "College Patrons Recognized"
 tyrone_raj_nation_college_patrons_supported_desc:0 "Established religious patrons retain a voice in college appointments."
 tyrone_raj_nation_relief_applicants_heard:0 "Relief Petitions Accepted"
 tyrone_raj_nation_relief_applicants_heard_desc:0 "Cultivators welcome the admission of households left off the patrons’ relief rolls."
 tyrone_raj_nation_relief_patrons_recognized:0 "Relief Patrons Recognized"
 tyrone_raj_nation_relief_patrons_recognized_desc:0 "Landed patrons retain responsibility for identifying households entitled to assistance."
 tyrone_raj_nation_jurists_supported:0 "Petitions for Legal Reform Heard"
 tyrone_raj_nation_jurists_supported_desc:0 "Jurists welcome government supervision of local civil courts."
 tyrone_raj_nation_local_courts_recognized:0 "Local Courts Recognized"
 tyrone_raj_nation_local_courts_recognized_desc:0 "Landed authorities have secured recognition of their courts and customary jurisdiction."
 tyrone_raj_nation_medical_inspections:0 "District Medical Inspections"
 tyrone_raj_nation_medical_inspections_desc:0 "Government inspectors are examining practitioners and dispensaries against common medical standards."
 tyrone_raj_nation_medical_board_supported:0 "Medical Standards Endorsed"
 tyrone_raj_nation_medical_board_supported_desc:0 "Educated practitioners support a medical board empowered to license public dispensaries."
 tyrone_raj_nation_charitable_dispensaries:0 "Charitable Dispensaries Recognized"
 tyrone_raj_nation_charitable_dispensaries_desc:0 "Medical charities retain their established patrons, limiting the authority of government inspectors."
 tyrone_raj_nation_medical_patrons_supported:0 "Medical Patrons Recognized"
 tyrone_raj_nation_medical_patrons_supported_desc:0 "Religious patrons retain responsibility for the dispensaries they maintain."
 tyrone_raj_nation_salaried_offices:0 "Salaried District Offices"
 tyrone_raj_nation_salaried_offices_desc:0 "Government appointees take over district offices, though local patrons withhold some of their cooperation."
 tyrone_raj_nation_hereditary_appointments:0 "Hereditary Appointments Confirmed"
 tyrone_raj_nation_hereditary_appointments_desc:0 "Established office-holding families pledge their cooperation in return for retaining their posts."
 tyrone_raj_nation_public_accounts:0 "District Accounts Audited"
 tyrone_raj_nation_public_accounts_desc:0 "Common accounts aid the administration, while inquiries into old exemptions strain its relations with local authorities."
 tyrone_raj_nation_local_revenue_settlement:0 "Local Revenue Guarantees"
 tyrone_raj_nation_local_revenue_settlement_desc:0 "Revenue intermediaries promise their support in return for keeping separate accounts and established privileges."
 tyrone_raj_nation_examined_admissions:0 "Open College Examinations"
 tyrone_raj_nation_examined_admissions_desc:0 "Admissions by examination have opened places to new pupils. The government must fund their instruction and the staff who assess them."
 tyrone_raj_nation_endowed_colleges:0 "Endowed Colleges"
 tyrone_raj_nation_endowed_colleges_desc:0 "Established patrons meet part of the cost of schooling, while keeping appointments and teaching close to their own circles."
 tyrone_raj_nation_open_relief_rolls:0 "Open Relief Rolls"
 tyrone_raj_nation_open_relief_rolls_desc:0 "District officers have admitted households previously denied assistance. Public relief eases hardship but requires a larger paid staff."
 tyrone_raj_nation_patronal_relief:0 "Patronal Relief Guarantees"
 tyrone_raj_nation_patronal_relief_desc:0 "Local patrons distribute food to cultivators in return for exemptions from the district’s revenue demands."
 tyrone_raj_nation_appeal_courts:0 "Government Courts of Appeal"
 tyrone_raj_nation_appeal_courts_desc:0 "Government jurists can review local judgments and contest inherited restrictions. The inquiry has stirred opposition among those whose authority it displaces."
 tyrone_raj_nation_recognized_jurisdictions:0 "Protected Local Jurisdictions"
 tyrone_raj_nation_recognized_jurisdictions_desc:0 "Recognition of local courts has secured cooperation from their patrons. Further reforms must accommodate the guarantees they have obtained."
 tyrone_raj_nation_district_medical_service:0 "District Medical Service"
 tyrone_raj_nation_district_medical_service_desc:0 "Paid inspectors and medical officers supervise dispensaries and extend treatment beyond the households served by established charities."
 tyrone_raj_nation_protected_medical_charities:0 "Protected Medical Charities"
 tyrone_raj_nation_protected_medical_charities_desc:0 "Patrons subsidize dispensaries serving cultivators, while retaining restrictions on who may enter medical practice."
 tyrone_raj_nation_professional_district_service:0 "Professional District Service"
 tyrone_raj_nation_professional_district_service_desc:0 "Salaried appointments bring trained staff into district offices and open administrative careers beyond the established office-holding families."
 tyrone_raj_nation_family_office_guarantees:0 "Family Office Guarantees"
 tyrone_raj_nation_family_office_guarantees_desc:0 "Office-holding families accept lower public salaries in return for secure succession. Their cooperation strengthens the administration’s authority, but leaves little room for new methods."
 tyrone_raj_nation_audited_district_revenues:0 "Audited District Revenues"
 tyrone_raj_nation_audited_district_revenues_desc:0 "Auditors are recovering revenue lost to exemptions and inconsistent accounts. Their work occupies officials and provokes resistance from those called to pay."
 tyrone_raj_nation_revenue_credit_guarantees:0 "Revenue and Credit Guarantees"
 tyrone_raj_nation_revenue_credit_guarantees_desc:0 "Local revenue intermediaries have secured exemptions in exchange for arranging credit on easier terms."

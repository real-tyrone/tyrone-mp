l_english:
 tyrone_revise_indian_charters:0 "Revise the Indian Charters"
 tyrone_revise_indian_charters_desc:0 "The guarantees written into India’s charters bind its government to particular enterprises. As overlord, we may revise those obligations and decide which undertakings shall receive its support."
 tyrone_charter_cooldown_tt:0 "We have not revised the Indian charters in the last #v five years#!."
 tyrone_charter_five_years_tt:0 "We cannot revise the Indian charters again for #v five years#!."
 tyrone_charter_amendments_preserved_tt:0 "Existing amendments are retained on the new law."
 tyrone_chartered_obligations.1.t:0 "The Terms of the Charter"
 tyrone_chartered_obligations.1.d:0 "The obligations of [SCOPE.sCountry('charter_india').GetName] are before us for revision. Railway guarantees, plantation interests and manufacturing charters each make their own demands upon the Indian treasury."
 tyrone_chartered_obligations.1.f:0 "The terms may be settled here, but the accounts will be paid in India."
 tyrone_chartered_obligations.1.cancel:0 "Leave the existing charters in place."

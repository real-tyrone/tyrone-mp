 tyr_kk_bismarck_name_fallback:0 "Bismarck"
 tyr_kk_outcome_preview:0 "@devout! #gold #b Completed on the Church Side:#!#!\n  • [JournalEntry.GetCustom('tyr_kk_devout_name')] gain #v $ig_trait_be_fruitful_and_multiply$#! as their high-[concept_approval] trait, granting [Concept('concept_pop_growth', '$concept_pop_growth_birthrate$')].\n  • [JournalEntry.GetCustom('tyr_kk_devout_name')] get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_kk_clerical_influence_tt $tyr_kk_clerical_influence$#! permanently.\n  • [JournalEntry.GetCountry.GetName] gets #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_kk_religious_settlement_tt $tyr_kk_religious_settlement$#! permanently.\n\n@intelligentsia! #b Completed on the State Side:#!\n  • [JournalEntry.GetCountry.GetName] gets #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_kk_state_supremacy_tt $tyr_kk_state_supremacy$#! permanently."

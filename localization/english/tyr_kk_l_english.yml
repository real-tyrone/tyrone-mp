l_english:
 je_tyr_kk_kulturkampf:0 "Kulturkampf"
 je_tyr_kk_kulturkampf_status:0 "Beneath the bells of a united Germany, an old question stirs: to whom do her people owe their deepest allegiance?"
 je_tyr_kk_kulturkampf_reason:0 "Germany has been united, yet the allegiance of its people remains divided between pulpit and state. [JournalEntry.GetCustom('tyr_kk_bismarck_name')] seeks to bring schools and public institutions under civil authority, while the [JournalEntry.GetCustom('tyr_kk_devout_name')] defend the Church’s place in German life.\n\nThe [JournalEntry.GetCustom('tyr_kk_intelligentsia_name')] look to secular [Concept('concept_law', '$concept_laws$')] to complete the work of unification. Each reform now tests where the authority of the state ends, and that of the Church begins.\n\n#bold Towards the State — monthly#!\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_public_schools')] #v +1#! [GetLawType('law_public_schools').GetName]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_separation')] #v +1#! [GetLawType('law_total_separation').GetName]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_int_clout')] #v +1#! [JournalEntry.GetCustom('tyr_kk_intelligentsia_name')] have greater [concept_clout] than the [JournalEntry.GetCustom('tyr_kk_devout_name')]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_int_government')] #v +1#! [JournalEntry.GetCustom('tyr_kk_intelligentsia_name')] in [concept_government]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_public_health')] #v +1#! [GetLawType('law_public_health_insurance').GetName]\n\n#bold Towards the Church — monthly#!\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_religious_schools')] #v −1#! [GetLawType('law_religious_schools').GetName]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_state_religion')] #v −1#! [GetLawType('law_state_religion').GetName]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_devout_clout')] #v −1#! [JournalEntry.GetCustom('tyr_kk_devout_name')] have greater [concept_clout] than the [JournalEntry.GetCustom('tyr_kk_intelligentsia_name')]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_devout_government')] #v −1#! [JournalEntry.GetCustom('tyr_kk_devout_name')] in [concept_government]\n[JournalEntry.GetCountry.GetCustom('tyr_kk_check_charity_hospitals')] #v −1#! [GetLawType('law_charitable_health_system').GetName]"
 tyr_kk_checked:0 "@green_checkmark_box!"
 tyr_kk_unchecked:0 "@simple_box!"
 tyr_kk_start_tt:0 "The Kulturkampf begins with the balance of power at #v 50/100#!."
 tyr_kk_complete_tt:0 "The balance of power reaches #v 0#! (Church) or #v 100#! (State)."
 tyr_kk_balance_title:0 "#gold THE STRUGGLE FOR GERMANY’S SOUL#!"
 tyr_kk_church_label:0 "#gold #b Church#!#!"
 tyr_kk_state_label:0 "#b State#!"
 tyr_kk_balance_value:0 "#bold [Country.MakeScope.ScriptValue('tyr_kk_balance')|0] / 100#!"
 tyr_kk_monthly_value:0 "Monthly change: #v [Country.MakeScope.ScriptValue('tyr_kk_monthly_change')|=0]#!"
 tyr_kk_monthly_tt:0 "All active conditions are added together. Monthly movement is limited to #v −2/+2#!. Positive movement favours the State; negative movement favours the Church."
 tyr_kk_religious_settlement:0 "The Religious Settlement"
 tyr_kk_clerical_influence:0 "Renewed Clerical Influence"
 tyr_kk_state_supremacy:0 "Supremacy of the State"
 tyr_kk_state_title:0 "Supremacy of the State"
 tyr_kk_state_desc:0 "The struggle over Germany’s schools and public institutions has ended in favour of the state. Religious authority must now yield to civil law."
 tyr_kk_state_flavor:0 "Faith may guide the conscience; the state shall govern public affairs."
 tyr_kk_church_title:0 "The Religious Settlement"
 tyr_kk_church_desc:0 "The government has reached an accommodation with the clergy. Religious institutions retain their independence, and the faithful emerge with renewed political influence."
 tyr_kk_church_flavor:0 "The bells ring out over a settlement Berlin could not dictate."
 tyr_kk_settlement_option:0 "The settlement shall stand."

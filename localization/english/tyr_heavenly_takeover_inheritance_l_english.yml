l_english:
 tyr_heavenly_takeover_inherit_tt:0 "You will play as the Heavenly Kingdom. It will adopt your country's laws, including Education, Economic System and Bureaucracy, except that its unique Heavenly Citizenship, Church and State, and Free Speech laws take precedence. It gains every technology your country has researched and retains its existing technologies. It will then annex your entire country, ending your separate provincial administration."

l_english:
 je_chi_legation_system:0 "The Legation System"
 je_chi_legation_system_reason:0 "Foreign legations have secured a foothold along the Chinese coast. Beyond the treaty ports, merchants seek permission to establish factories, work mines and build railways. The Chinese government must bargain over the extent of these privileges while foreign property remains beyond its power to nationalize."
 je_chi_legation_system_status:0 ""
 je_chi_legation_system_goal:0 "Complete the Boxer Rebellion successfully to restore the right to nationalize foreign assets. Existing concessions will remain in force, but no further concessions may be granted or renewed."
 chi_legation_nationalization_prohibited:0 "Protected Foreign Property"
 chi_legation_nationalization_prohibited_desc:0 "The legation system protects foreign property in China from nationalization."
 regional_investment_rights:0 "Territorial Concession"
 regional_investment_rights_desc:0 "Permits investment in an agreed Chinese state, limited to the industries authorized to the beneficiary. A Treaty Port anywhere in China is required to exercise this right."
 building_investment_rights:0 "Industrial Concession"
 building_investment_rights_desc:0 "Authorizes an industry throughout the beneficiary’s territorial concessions in China. A Treaty Port anywhere in China is required to exercise this right."
 chi_legation.100.t:0 "Debug: Boxer Victory"
 chi_legation.100.d:0 "Apply the successful Boxer outcome and restore nationalization rights to Chinese governments."
 chi_legation.100.f:0 "This event is a temporary testing hook for the future Boxer Rebellion content."
 chi_legation.100.a:0 "Apply the victorious outcome."

 chi_legation_boxer_victory_tt:0 "The Boxer Rebellion Journal Entry has been completed successfully. A failed rebellion does not satisfy this condition."
 chi_legation_rules_title:0 "#bold Foreign Enterprise in China#!"

 chi_legation_rules_summary:0 "By #o $regional_investment_rights$#! and\n#o $building_investment_rights$#! treaties,\nforeign merchants may secure leave\nto establish enterprises and invest\ntheir capital in China."


 je_boxer_rebellion:0 "The Boxer Rebellion"
 je_boxer_rebellion_reason:0 "The treaty ports shelter foreign merchants and the privileges claimed by their governments. Across China, the Boxer societies demand that these footholds be swept away. The government has ten years to recover the ports held by the legation powers and bring the country back to peace."
 je_boxer_rebellion_status:0 ""
 chi_boxer_at_peace_tt:0 "The central Chinese government is at peace."
 chi_boxer_ports_recovered_tt:0 "No power previously admitted to the Legation System currently holds a Treaty Port in the designated Han or Manchu homeland State Regions."
 chi_boxer_kaicha_button:0 "KAICHA!"
 chi_boxer_kaicha_button_desc:0 "Issue declarations to the legation powers, demanding the return of their treaty ports and the surrender of their investments in China."
 chi_boxer_chain_terms_tt:0 "Declare war on the legation powers holding Treaty Ports in China."
 chi_boxer_declare_tt:0 "Creates a [concept_diplomatic_play] to return the Treaty Ports and nationalize foreign assets."
 chi_boxer_home_defence:0 "Defend the Homeland"
 chi_boxer_home_defence_desc:0 "Local societies rally to defend the country against foreign armies."
 chi_boxer_humiliation:0 "The Failed Expulsion"
 chi_boxer_humiliation_desc:0 "The foreign footholds remain. The government must answer for declarations it could not enforce."
 chi_boxer_recover_port:0 "Recover Treaty Port"
 chi_boxer_recover_port_desc:0 "Return the occupied treaty-port territory to the Chinese government."
 chi_boxer_reparations:0 "Boxer War Reparations"
 chi_boxer_reparations_desc:0 "Impose a money-transfer treaty on the Chinese government, with a five-year binding period and a weekly payment equal to 10% of its fixed income at settlement."
 dp_chi_boxer_war:0 "The Expulsion of the Legations"
 chi_boxer_war_name:0 "The Expulsion of the Legations"
 chi_boxer.1.t:0 "The Fists of Righteous Harmony"
 chi_boxer.1.d:0 "The Boxer societies call for the expulsion of the foreign powers. Their demands have reached the government, which must decide when to confront the holders of the treaty ports."
 chi_boxer.1.f:0 "Petitions pass from town to town, bearing the seals of societies that promise protection from foreign soldiers. Before the legations, guards have begun to count the crowds."
 chi_boxer.1.a:0 "The foreign footholds must be recovered."
 chi_boxer.2.t:0 "A Declaration for the Legation"
 chi_boxer.2.d:0 "The legation of [SCOPE.sCountry('chi_boxer_power').GetName] awaits our answer. We may demand its ports and investments by force, or spare this power and face the anger of those who expected its expulsion."
 chi_boxer.2.f:0 "The dispatch lies open beside the minister. Once sealed and delivered, its words will leave little room for explanation."
 chi_boxer.2.a:0 "Kaicha!"
 chi_boxer.2.b:0 "Spare this power."
 chi_boxer.3.t:0 "The Ports Recovered"
 chi_boxer.3.d:0 "The legation powers no longer hold the required treaty ports, and the country is at peace. The government has recovered the right to nationalize foreign property."
 chi_boxer.3.f:0 "The foreign flag has been lowered. At the waterfront, officials take possession of the buildings from which the old concessions were administered."
 chi_boxer.3.a:0 "The terms will now be ours."
 chi_boxer.4.t:0 "The Legations Remain"
 chi_boxer.4.d:0 "Ten years have passed without a peaceful settlement and the recovery of all required ports. Foreign property remains protected against nationalization, while the government bears the disgrace of its failed campaign."
 chi_boxer.4.f:0 "The proclamations have faded on the walls. Ships still enter the foreign harbour under the same flags."
 chi_boxer.4.a:0 "We must bear the settlement."

 war_goal_chi_boxer_reparations_type_name:0 "$chi_boxer_reparations$"
 war_goal_chi_boxer_reparations_type_desc:0 "Compel another [concept_country] to pay war reparations."
 war_goal_chi_boxer_reparations:0 "Reparations from [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_chi_boxer_reparations_desc:0 "[WAR_GOAL_DRAFT.GetTarget.GetName] pays [WAR_GOAL_DRAFT.GetHolder.GetName] weekly reparations equal to #v 10%#! of its fixed income at settlement. The payment treaty has a #v five-year#! binding period."
 war_goal_chi_boxer_reparations_sway_desc:0 "Offer [WAR_GOAL_DRAFT.GetHolder.GetName] war reparations from [WAR_GOAL_DRAFT.GetTarget.GetName] in return for joining your side."

 chi_boxer_button_central_tt:0 "Our country is the central Chinese government responsible for the Legation System."
 chi_boxer_button_unused_tt:0 "The KAICHA! declaration chain has not been started by any Chinese government. Changing the central government does not restore this action."
 chi_boxer_button_targets_tt:0 "At least one power admitted to the Legation System currently holds a Treaty Port in a designated Han or Manchu homeland State Region."

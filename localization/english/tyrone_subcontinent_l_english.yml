 tyrone_subcontinent_western_frontier_row:0 "Advancing into Pashtun Territories"
 tyrone_subcontinent_afghanistan_row:0 "Unify Afghanistan"
 tyrone_subcontinent_himalayas_row:0 "Securing the Himalayas"
 tyrone_subcontinent_completion_desc:0 "India: +1,000 Bureaucracy, decaying over 10 years."
 tyrone_subcontinent_consolidated_administration:0 "Consolidated Administration"
 tyrone_subcontinent_consolidated_administration_desc:0 "Securing the frontiers has eased the burden on the colonial administration."
 tyrone_subcontinent_conquest_ambition:0 "Ambition of Conquest"
 tyrone_subcontinent_conquest_ambition_desc:0 "The Company has been entrusted with securing the remaining frontiers of British India."
 je_consolidate_colonial_rule_status:0 "#bold Conquer remaining local regimes in the South Asian subcontinent#!"
 je_tyrone_conquer_burma:0 "Unifying the Subcontinent: Conquering Burma"
 je_tyrone_conquer_burma_reason:0 "“The question is not how much you will cede to us, but how much we will return to you... We shall inform all natives of your land that the territories formerly ruled by your monarch are no longer under his dominion but are now part of [SCOPE.sCharacter('british_ruler').GetPrimaryRoleTitle]’s dominion, and as [SCOPE.sCharacter('british_ruler').GetPrimaryRoleTitle] pleases, rulers and officials governing you will be appointed by us... and you have no choice but to accept.”\n\nFollowing the #bold ’Treaty of Yandabo’#! in 1826, Burma ceded the Arakan region, which was placed under our administration.\n\nHowever, the conquest of Burma remains incomplete. [SCOPE.sCountry('GBR_scope').GetName] has instructed us to seize the opportunity to invade Burma and bring its entire territory under our rule, ensuring imperial interests in Indochina."
 je_tyrone_conquer_burma_status:0 ""
 je_tyrone_conquer_burma_goal:0 "Control the five Burmese regions through India or its subjects, or bring Burma under the same overlord or India."
 je_tyrone_conquer_sindh:0 "Unifying the Subcontinent: Conquering Sindh"
 je_tyrone_conquer_sindh_reason:0 "The #variable Talpur Dynasty#! ruling Sindh has risen significantly since #bold 1832#!, following their defeat of #variable Afghan#! Sultan Shah Shuja. Though the Talpur brothers govern a divided sultanate, they remain ambitious towards our many princely states in Gujarat.\n\nLocal rulers in Karachi, overwhelmed by northern court pressure, have already reached out to us, urging a swift campaign against Sindh to dismantle this oppressive sultanate."
 je_tyrone_conquer_sindh_status:0 ""
 je_tyrone_conquer_sindh_goal:0 "India, Great Britain, or their subjects control Sindh."
 je_tyrone_conquer_punjab:0 "Unifying the Subcontinent: Conquering Punjab"
 je_tyrone_conquer_punjab_reason:0 "Much time has passed since the #variable 1803 Maratha War#! pushed India’s borders to the #bold Punjab Hills#!. During this period, the fertile Ganges Valley has brought us immense wealth, and the Indus Basin’s natural environment makes it #bold the granary of the subcontinent#!.\n\nWhile the Sikh Empire commands a large army, it lacks proper training. Furthermore, reports indicate their leader is aging and palace intrigue is growing. Without the protection of strong authority, they are #bold of little worth#!.\n\nNow is the perfect time to dispatch [SCOPE.sCountry('tyrone_subcontinent_india').GetName]’s forces to Punjab. Let us sound the call to advance toward Sirhind!"
 je_tyrone_conquer_punjab_status:0 ""
 je_tyrone_conquer_punjab_goal:0 "India or Great Britain controls all four regions through direct rule or subjects; alternatively, neither Punjab nor Sindh exists."
 je_tyrone_conquer_western_frontier:0 "Unifying the Subcontinent: Advancing into Pashtun Territories"
 je_tyrone_conquer_western_frontier_reason:0 "Though the #bold impoverished mountains of Balochistan#! offer little economic benefit to [SCOPE.sCountry('tyrone_subcontinent_india').GetName], their #bold strategic value as India’s gateway#! cannot be ignored. Reports suggest the #variable Afghan#! sultans are planning to reclaim Baloch lands once belonging to the so-called #variable ‘Durrani Empire’#!. We cannot allow this territory to fall into their hands—Karate’s khan must be forced to submit to our strength!"
 je_tyrone_conquer_western_frontier_status:0 ""
 je_tyrone_conquer_western_frontier_goal:0 "India or Great Britain controls Quetta and Baluchistan through direct rule or subjects."
 je_tyrone_conquer_afghanistan:0 "Unify Afghanistan"
 je_tyrone_conquer_himalayas:0 "Unifying the Subcontinent: Securing the Himalayas"
 je_tyrone_conquer_himalayas_reason:0 "Beyond the plains of Bengal and the Gangetic basin, the #variable Himalayan kingdoms#! command a frontier that cannot be secured by lines drawn in [SCOPE.sCountry('tyrone_subcontinent_india').GetCapital.GetCityHubName] alone. The courts of #variable Nepal#!, #variable Bhutan#!, and #variable Sikkim#! guard the mountain roads through which merchants, envoys, and armies approach the northern limits of British India.\n\nTheir rulers have little cause to welcome a stronger neighbour. Each treaty may settle one dispute while leaving another valley, pass, or claim beyond our influence. The same heights that shelter local dynasties can give a rival power a foothold above the plains, turning a distant diplomatic intrigue into an immediate concern for the Company’s administration.\n\nIf the subcontinent is to become a coherent dominion, these mountains cannot remain an uncertain margin. We must #bold bring all three Himalayan states under British or Indian authority#!, securing their submission or ending their separate rule. Only then will the northern frontier cease to depend upon the goodwill of #variable independent mountain courts#!."
 je_tyrone_conquer_himalayas_status:0 "#bold Secure the northern frontier of British India.#!"
 je_tyrone_conquer_himalayas_goal:0 "India or Great Britain controls both Himalayan state regions through direct rule or subjects; alternatively, Nepal, Bhutan, and Sikkim all exist and are direct subjects of India or Great Britain."
 tyrone_subcontinent_himalayas_subjects_tt:0 "#variable Nepal#!, #variable Bhutan#!, and #variable Sikkim#! are subjects of India or Great Britain."
 je_tyrone_conquer_afghanistan_reason:0 "Since the collapse of the #variable Durrani Empire#! that once ruled Afghanistan, Balochistan, and Punjab, #bold Afghan sultans and khans#! have fragmented this vast realm, each claiming to be its legitimate heir. However, the #variable Sadozai Dynasty#!’s successors have fallen under our control following our conquest of Karate, and Punjab has accepted our rule. Though these sultans may not yet realize it, we are effectively the most influential power in Afghanistan.\n\nDespite Whitehall and [SCOPE.sCountry('tyrone_subcontinent_india').GetCapital.GetCityHubName] showing little interest in the barren, worthless mountains of #variable Afghanistan#!, Russia’s conquest of Central Asia poses a serious threat to [SCOPE.sCountry('tyrone_subcontinent_india').GetName]’s security. To defend our core territorial borders, leveraging Durrani claims and entering Afghanistan’s unification race may #bold force the sultans to consolidate under a regime loyal to us#!—provided we lead the effort to reclaim the [concept_capital_state] of the former #variable Durrani Empire#: #variable Kabul#!."
 je_tyrone_conquer_afghanistan_status:0 ""
 je_tyrone_conquer_afghanistan_goal:0 "India directly owns Kabul; neither Russia nor Persia controls all five other Afghan state regions."
 tyrone_subcontinent_punjab_annexation:0 "Annex the Punjab Principalities"
 tyrone_subcontinent_punjab_annexation_desc:0 "After the Sikh kingdom has ceased to exist, annex the surviving states of Garhwal, Patiala, and Bahawalpur into India. This action can be taken only once."
 tyrone_subcontinent.1.t:0 "The Conquest of Burma"
 tyrone_subcontinent.1.d:0 "The Burmese frontier is secured. The Irrawaddy valley is now within the British Indian sphere."
 tyrone_subcontinent.1.f:0 "District offices follow the armies east."
 tyrone_subcontinent.1.a:0 "The eastern frontier is secure."
 tyrone_subcontinent.2.t:0 "The Conquest of Sindh"
 tyrone_subcontinent.2.d:0 "Sindh has been secured, opening the lower Indus to the colonial administration."
 tyrone_subcontinent.2.f:0 "At Karachi, survey maps take their place beside the military dispatches."
 tyrone_subcontinent.2.a:0 "The Indus lies open."
 tyrone_subcontinent.3.t:0 "The End of the Durbar"
 tyrone_subcontinent.3.d:0 "Punjab and its mountain approaches are secured. The next objective is Quetta and Baluchistan."
 tyrone_subcontinent.3.f:0 "Beyond the conquered court, the road leads west."
 tyrone_subcontinent.3.a:0 "Advance towards Baluchistan."
 tyrone_subcontinent.4.t:0 "The Baluchistan Frontier"
 tyrone_subcontinent.4.d:0 "Quetta and Baluchistan are secured. A separate expedition towards Afghanistan is now available."
 tyrone_subcontinent.4.f:0 "Beyond the last cantonment, the mountains rise again."
 tyrone_subcontinent.4.a:0 "Look towards Kabul."
 tyrone_subcontinent.5.t:0 "The Subcontinent Secured"
 tyrone_subcontinent.5.d:0 "The five frontier campaigns are complete. The Indian administration can consolidate its territorial settlement."
 tyrone_subcontinent.5.f:0 "A single chain of administration reaches across the subcontinent."
 tyrone_subcontinent.5.a:0 "Consolidate the administration."
 tyrone_subcontinent.6.t:0 "The Afghan Frontier"
 tyrone_subcontinent.6.d:0 "India has secured Kabul before a rival could consolidate the remaining Afghan territories."
 tyrone_subcontinent.6.f:0 "Through the passes, dispatch riders carry word that the expedition is complete."
 tyrone_subcontinent.6.a:0 "The northern frontier is secure."
 tyrone_subcontinent.7.t:0 "The Colonial Campaign Abandoned"
 tyrone_subcontinent.7.d:0 "India is no longer subject to Great Britain. The joint campaign has lost its political foundation."
 tyrone_subcontinent.7.f:0 "The orders remain on the desks, but the authority that joined them has passed away."
 tyrone_subcontinent.7.a:0 "A different settlement awaits."
 tyrone_burma_colonial_growth:0 "The Burmese Frontier"
 tyrone_burma_colonial_growth_desc:0 "The campaign in Burma brings additional resources to the expansion of Indian colonial settlements."
 tyrone_subcontinent_presidency_bonus_tt:0 "Subcontinental Consolidation"
 tyrone_subcontinent_attack_khalsa:0 "Confront the Khalsa Raj"
 tyrone_subcontinent_attack_khalsa_desc:0 "The Khalsa Raj commands the approaches to the Punjab. A campaign to bring it under Indian rule will stretch military supplies and occupation forces."
 tyrone_subcontinent_punjab_campaign:0 "The Punjab Campaign"
 tyrone_subcontinent_punjab_campaign_desc:0 "Preparations for the campaign strain military supply contracts and divert troops from occupation duties."

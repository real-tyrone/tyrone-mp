l_english:
 tyrone_mining_survey_available_tt:0 "This survey has not already been commissioned"
 tyrone_mining_previous_survey_tt:0 "The previous survey has reported its findings"
 tyrone_mining_surveys_complete_tt:0 "All three mineral surveys have reported their findings"
 tyrone_mining_progress:0 "Completed surveys"
 je_tyrone_promise_mining_rajputana:0 "The Minerals of Rajputana"
 je_tyrone_promise_mining_rajputana_reason:0 "The mineral workings of #variable Rajputana#! offer a starting point for a more ambitious geological undertaking. Lead-bearing formations and sulfur deposits must be traced beyond their familiar outcrops before their full extent can be entered in the mining registers.\n\nThe introduction of #variable Dynamite#! makes a more systematic examination possible, but each expedition requires clerks, engineers, and public resources. Britain or India may commission the work. Only one survey can be conducted in this region at a time; expeditions in the other mineral districts may proceed independently.\n\nEach survey occupies #variable one year#! and burdens the initiating government with #variable −1,000 Bureaucracy#! and #variable −10% Minting#!. Once that burden ends, the next monthly report will record the discoveries and open the following survey. #bold Complete all three surveys to expand the regional resource potential to #variable 50#! Lead Mine levels and #variable 50#! Sulfur Mine levels.#!"
 je_tyrone_promise_mining_rajputana_status:0 ""
 je_tyrone_promise_mining_rajputana_goal:0 "Complete all three mineral surveys in Rajputana."
 tyrone_promise_mining_rajputana_row:0 "Rajputana Mineral Surveys"
 tyrone_mining_rajputana_survey_cost:0 "Rajputana Geological Survey"
 tyrone_mining_rajputana_survey_cost_desc:0 "Surveyors, engineers, and administrative departments are committed to examining the mineral deposits of this region."
 tyrone_mining_rajputana_survey_1_button:0 "Survey I: Rajputana Minerals"
 tyrone_mining_rajputana_survey_1_button_desc:0 "Commission the first survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +14#! Lead Mine levels and #variable +15#! Sulfur Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.1.t:0 "Lead Beneath the Hills"
 tyrone_indian_mining.1.d:0 "The first survey of Rajputana has identified additional lead-bearing formations and sulfur deposits. The report establishes new workings that can be opened without exhausting the prospects already recorded."
 tyrone_indian_mining.1.f:0 "Samples lie in separate trays beneath the surveyor’s lamp. A pale streak through the broken stone becomes a boundary on the district map."
 tyrone_indian_mining.1.a:0 "Register the new workings."
 tyrone_indian_mining.1.result_tt:0 "The survey has added #variable +14#! Lead Mine levels and #variable +15#! Sulfur Mine levels to the resource potential of #variable Rajputana#!. This does not construct any mines."
 tyrone_mining_rajputana_survey_2_button:0 "Survey II: Rajputana Minerals"
 tyrone_mining_rajputana_survey_2_button_desc:0 "Commission the second survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +15#! Lead Mine levels and #variable +16#! Sulfur Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.2.t:0 "Sulfur in the Survey Books"
 tyrone_indian_mining.2.d:0 "A second expedition through Rajputana has traced the mineral beds beyond the first survey boundaries. Further lead and sulfur deposits can now be included in the regional mining concessions."
 tyrone_indian_mining.2.f:0 "At the edge of the camp, numbered sacks await the cart. The clerk leaves a wider space between the old entries and the new estimates."
 tyrone_indian_mining.2.a:0 "Extend the concessions."
 tyrone_indian_mining.2.result_tt:0 "The survey has added #variable +15#! Lead Mine levels and #variable +16#! Sulfur Mine levels to the resource potential of #variable Rajputana#!. This does not construct any mines."
 tyrone_mining_rajputana_survey_3_button:0 "Survey III: Rajputana Minerals"
 tyrone_mining_rajputana_survey_3_button_desc:0 "Commission the third survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +15#! Lead Mine levels and #variable +16#! Sulfur Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.3.t:0 "The Mineral Register of Rajputana"
 tyrone_indian_mining.3.d:0 "The final survey of Rajputana has confirmed the remaining extensions of its lead and sulfur deposits. The completed register provides a broader foundation for mining than the scattered workings with which the undertaking began."
 tyrone_indian_mining.3.f:0 "Three seasons of measurements cover the table. Lines drawn by different hands now join into a single account of the country beneath the hills."
 tyrone_indian_mining.3.a:0 "Publish the completed mineral register."
 tyrone_indian_mining.3.result_tt:0 "The survey has added #variable +15#! Lead Mine levels and #variable +16#! Sulfur Mine levels to the resource potential of #variable Rajputana#!. This does not construct any mines."
 je_tyrone_promise_mining_orissa:0 "The Orissa Ironfields"
 je_tyrone_promise_mining_orissa_reason:0 "The iron-bearing districts of #variable Orissa#! promise a mineral foundation for the growth of Indian industry. Familiar workings reveal only part of that prospect: further surveys must establish where new shafts and concessions can be supported by deposits of sufficient extent.\n\nThe introduction of #variable Dynamite#! makes a more systematic examination possible, but each expedition requires clerks, engineers, and public resources. Britain or India may commission the work. Only one survey can be conducted in this region at a time; expeditions in the other mineral districts may proceed independently.\n\nEach survey occupies #variable one year#! and burdens the initiating government with #variable −1,000 Bureaucracy#! and #variable −10% Minting#!. Once that burden ends, the next monthly report will record the discoveries and open the following survey. #bold Complete all three surveys to expand the regional resource potential to #variable 100#! Iron Mine levels.#!"
 je_tyrone_promise_mining_orissa_status:0 ""
 je_tyrone_promise_mining_orissa_goal:0 "Complete all three mineral surveys in Orissa."
 tyrone_promise_mining_orissa_row:0 "Orissa Ironfield Surveys"
 tyrone_mining_orissa_survey_cost:0 "Orissa Geological Survey"
 tyrone_mining_orissa_survey_cost_desc:0 "Surveyors, engineers, and administrative departments are committed to examining the mineral deposits of this region."
 tyrone_mining_orissa_survey_1_button:0 "Survey I: Orissa Ironfields"
 tyrone_mining_orissa_survey_1_button_desc:0 "Commission the first survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +20#! Iron Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.4.t:0 "Iron Beyond the Outcrop"
 tyrone_indian_mining.4.d:0 "Surveyors in Orissa have identified a further belt of iron-bearing ground. Their measurements establish additional deposits that can support new mining concessions."
 tyrone_indian_mining.4.f:0 "A red-brown fragment passes from the surveyor to the engineer. What the hillside has exposed at the surface is entered as a prospect beneath it."
 tyrone_indian_mining.4.a:0 "Open the new iron concessions."
 tyrone_indian_mining.4.result_tt:0 "The survey has added #variable +20#! Iron Mine levels to the resource potential of #variable Orissa#!. This does not construct any mines."
 tyrone_mining_orissa_survey_2_button:0 "Survey II: Orissa Ironfields"
 tyrone_mining_orissa_survey_2_button_desc:0 "Commission the second survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +20#! Iron Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.5.t:0 "Following the Iron Beds"
 tyrone_indian_mining.5.d:0 "The second survey of Orissa has traced further extensions of the ironfields. The revised estimates enlarge the area available for systematic mining."
 tyrone_indian_mining.5.f:0 "The bore records reach the district office tied with cord. Beside each measurement, the engineer has marked where another shaft might be sunk."
 tyrone_indian_mining.5.a:0 "Record the deeper workings."
 tyrone_indian_mining.5.result_tt:0 "The survey has added #variable +20#! Iron Mine levels to the resource potential of #variable Orissa#!. This does not construct any mines."
 tyrone_mining_orissa_survey_3_button:0 "Survey III: Orissa Ironfields"
 tyrone_mining_orissa_survey_3_button_desc:0 "Commission the third survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +24#! Iron Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.6.t:0 "An Iron Province"
 tyrone_indian_mining.6.d:0 "The final report on the Orissa ironfields has confirmed a substantial extension of the recorded deposits. The completed survey gives the province a new place in plans for Indian iron and steel production."
 tyrone_indian_mining.6.f:0 "The last sheet is laid beside the first. Where the old map showed isolated workings, the new register describes an ironfield."
 tyrone_indian_mining.6.a:0 "Complete the ironfield register."
 tyrone_indian_mining.6.result_tt:0 "The survey has added #variable +24#! Iron Mine levels to the resource potential of #variable Orissa#!. This does not construct any mines."
 je_tyrone_promise_mining_bihar:0 "The Bihar Coalfields"
 je_tyrone_promise_mining_bihar_reason:0 "The coalfields of #variable Bihar#! already sustain an important place in the plans of merchants, railway engineers, and ironmasters. A closer examination of their seams may reveal further deposits, extending the supply available to the industrial districts of India.\n\nThe introduction of #variable Dynamite#! makes a more systematic examination possible, but each expedition requires clerks, engineers, and public resources. Britain or India may commission the work. Only one survey can be conducted in this region at a time; expeditions in the other mineral districts may proceed independently.\n\nEach survey occupies #variable one year#! and burdens the initiating government with #variable −1,000 Bureaucracy#! and #variable −10% Minting#!. Once that burden ends, the next monthly report will record the discoveries and open the following survey. #bold Complete all three surveys to expand the regional resource potential to #variable 100#! Coal Mine levels.#!"
 je_tyrone_promise_mining_bihar_status:0 ""
 je_tyrone_promise_mining_bihar_goal:0 "Complete all three mineral surveys in Bihar."
 tyrone_promise_mining_bihar_row:0 "Bihar Coal Surveys"
 tyrone_mining_bihar_survey_cost:0 "Bihar Geological Survey"
 tyrone_mining_bihar_survey_cost_desc:0 "Surveyors, engineers, and administrative departments are committed to examining the mineral deposits of this region."
 tyrone_mining_bihar_survey_1_button:0 "Survey I: Bihar Coalfields"
 tyrone_mining_bihar_survey_1_button_desc:0 "Commission the first survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +6#! Coal Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.7.t:0 "A Further Seam"
 tyrone_indian_mining.7.d:0 "The first Bihar survey has identified additional coal seams beyond the workings already recorded. The new deposits can support a further expansion of the regional coal industry."
 tyrone_indian_mining.7.f:0 "The seam is scarcely more than a dark line upon the exposed face. The men who measure it see furnaces, locomotives, and years of work."
 tyrone_indian_mining.7.a:0 "Enter the seam in the register."
 tyrone_indian_mining.7.result_tt:0 "The survey has added #variable +6#! Coal Mine levels to the resource potential of #variable Bihar#!. This does not construct any mines."
 tyrone_mining_bihar_survey_2_button:0 "Survey II: Bihar Coalfields"
 tyrone_mining_bihar_survey_2_button_desc:0 "Commission the second survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +6#! Coal Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.8.t:0 "The Coalfield Extended"
 tyrone_indian_mining.8.d:0 "A second examination of the Bihar coalfields has confirmed further workable deposits. The survey books now include ground previously omitted from the regional estimate."
 tyrone_indian_mining.8.f:0 "A field notebook arrives stained with rain and coal dust. Its figures are copied carefully into the clean columns of the district register."
 tyrone_indian_mining.8.a:0 "Extend the coal concessions."
 tyrone_indian_mining.8.result_tt:0 "The survey has added #variable +6#! Coal Mine levels to the resource potential of #variable Bihar#!. This does not construct any mines."
 tyrone_mining_bihar_survey_3_button:0 "Survey III: Bihar Coalfields"
 tyrone_mining_bihar_survey_3_button_desc:0 "Commission the third survey. Only the initiating country receives #variable −1,000 Bureaucracy#! and #variable −10% Minting#! for #variable one year#!. The report will add #variable +7#! Coal Mine levels to the regional resource potential. Surveys of this region must be completed in order."
 tyrone_indian_mining.9.t:0 "The Completed Coal Survey"
 tyrone_indian_mining.9.d:0 "The final survey of Bihar has established the remaining extension of its recorded coal deposits. The completed undertaking increases the fuel resources available to Indian railways and industry."
 tyrone_indian_mining.9.f:0 "The final report is brief. Its accompanying map is not: dark lines run beneath villages, roads, and fields that had concealed the extent of the seams."
 tyrone_indian_mining.9.a:0 "Publish the coalfield report."
 tyrone_indian_mining.9.result_tt:0 "The survey has added #variable +7#! Coal Mine levels to the resource potential of #variable Bihar#!. This does not construct any mines."

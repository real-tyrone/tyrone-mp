 ita_risorgimento_reason_austria:0 "The Italian princes look to Vienna for protection against the national cause. We can #bold #g slow the formation of Italy#!#! by #v guaranteeing the independence of Italian states#!. Each guarantee checks the growth of unification sentiment and #v doubles the sentiment cost of actions against the protected state#!, buying time for the existing rulers.\n\nThese commitments come at a price. Each guarantee costs #r 10% Influence#! and #r 25 Authority#!; protecting the #white #bold $PAP$#!#! costs #r 50 Authority#!, while the #white #bold $SIC$#!#! require #r 100 Authority#!. Among the smaller Italian courts, our protection also feeds #r national agitation#!. We must choose which rulers are worth the burden of defending."

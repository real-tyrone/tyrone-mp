l_english:
 ita_risorgimento_shared_status:0 "Italian unification sentiment: #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ita_arc_sentiment_hover #v [GetGlobalVariable('ita_risorgimento_sardinia').GetCountry.MakeScope.Var('italian_sentiment_var').GetValue|1]/100#!#!."
 ita_risorgimento_reason_sardinia:0 "Lead the movement for a united Italy through diplomacy, concessions and war. The actions below offer different settlements with the Papacy and routes towards unification; Garibaldi's expedition provides a separate path to the south.\n\nSupport from #white #b $FRA$#!#! or $tyr_bt_label_austria$ brings opportunities and foreign commitments. An independent Italian bloc opens the way to later ambitions. Constitutional choices in the French and Austrian law entries also affect unification sentiment."
 ita_risorgimento_reason_observer:0 "The Italian government seeks unity while foreign powers bargain over the peninsula. Austrian guarantees raise the sentiment cost of actions against protected AI states, but also feed the Italian national movement. France can trade support for Savoy and Nice or maintain a garrison in Rome.\n\nUnification sentiment belongs to #white #b [GetGlobalVariable('ita_risorgimento_sardinia').GetCountry.GetName]#!#!. Hover over its value to see every monthly contribution."

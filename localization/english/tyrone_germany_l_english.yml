l_english:
 je_tyrone_prussian_german_question:0 "The German Question"
 je_tyrone_prussian_german_question_reason:0 "The settlement imposed upon Germany after the fall of Napoleon restored her princes but not her strength. Thirty-nine courts guard their ancient prerogatives, thirty-nine administrations raise their barriers, and thirty-nine governments speak where one nation increasingly demands to be heard. Yet beneath this political fragmentation, roads, workshops, universities, and customs unions bind the German lands more closely with every passing year.\n\nPrussia stands at the center of this transformation. If Berlin can turn the scattered energies of the Confederation toward a common purpose, the old mosaic of sovereignties may become the foundation of a power capable of deciding its own destiny."
 je_tyrone_prussian_german_question_status_prussia:0 "The wealth and labor of the German Confederation gather increasingly around Prussian industry, while the question of political unity remains unanswered."
 je_tyrone_prussian_german_question_status_principality:0 "The old princely order endures, but commerce, population, and national sentiment draw the German lands ever closer together."
 je_tyrone_prussian_german_question_complete_tt:0 "We have formed the nation of #bold Germany#!"
 event_effects_tyrone_germany.2_tt:0 "• [ROOT.GetCountry.GetNameNoFlag] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyrone_german_foundation_birth_rate_tt $tyrone_german_foundation_birth_rate$#! for #bold 10 years#! decaying.\n• [ROOT.GetCountry.GetNameNoFlag] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyrone_early_german_industrial_mobilization_tt $tyrone_early_german_industrial_mobilization$#!. The later the [concept_nation_formation] of Germany occurs, the shorter this [concept_construction] bonus will last (latest date 1850)."
 tyrone_german_foundation_birth_rate_tt:0 "[GetStaticModifier('tyrone_german_foundation_birth_rate').GetName|v]\n[GetStaticModifier('tyrone_german_foundation_birth_rate').GetDesc]"

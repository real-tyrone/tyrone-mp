 tyrone_germany.1.t:0 "Deutschland über alles"
 tyrone_germany.1.d:0 "Across the German lands, the language of unity is escaping the lecture hall and entering the street, the barracks, and the counting house. Merchants speak of a single market, patriots of a single fatherland, and officials of a common order strong enough to outlive the jealousies of princes. Increasingly, these hopes turn toward Prussia."
 tyrone_germany.1.f:0 ""The German fatherland is not a line upon a diplomat's map. It lives wherever its people labor, speak, remember, and hope together. The princes may possess Germany for a season; the German nation belongs to history.""
 tyrone_germany.1.a:0 "Germany must find its future in Prussia."

 tyrone_germany.2.t:0 "Mit Gott für König und Vaterland!"
 tyrone_germany.2.d:0 "The scattered sovereignties of the German lands have been gathered beneath one banner. The work of [concept_nation_formation] is complete, but the work of forging a nation has only begun. From the workshops of the Ruhr to the fields of Brandenburg, the strength of #bold Germany#! must now be turned toward prosperity, industry, and the generations yet to come."
 tyrone_germany.2.f:0 ""No longer shall the German people be divided by the jealous boundaries of princes. One fatherland, one purpose, and one future now stand before us.""
 tyrone_germany.2.a:0 "With God for King and Fatherland!"

 tyrone_germany.3.t:0 "The Shape of the Zollverein"
 tyrone_germany.3.d:0 "The Zollverein has bound the German markets more tightly than any decree of the old Confederation. From the ledgers of [SCOPE.sCountry('frankfurt').GetName] to the ministries of [SCOPE.sCountry('prussia').GetName], merchants and officials now ask whether this [concept_customs_union] should remain a bargain of tariffs, or become the first political instrument of German order."
 tyrone_germany.3.f:0 ""A nation is not always born beneath a flag. Sometimes it begins at a customs post, where the barrier is lifted, the seal is stamped, and men who yesterday were foreigners discover that their goods already know the road to one another.""
 tyrone_germany.3.a:0 "Let the princes gather beneath the Prussian crown."
 tyrone_germany.3.b:0 "Make the Zollverein a league of German arms."
 tyrone_germany.3.c:0 "Commerce shall remain the language of unity."
 tyrone_germany.3.e:0 "Give Germany a common political conscience."
 tyrone_germany.3.a_tt:0 "The #bold Zollverein#! will be recreated under [ROOT.GetCountry.GetName] as a #v $identity_sovereign_empire$#! [concept_power_bloc], binding German commerce to princely authority.\nThe [concept_power_bloc] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyrone_zollverein_customs_union_tt $tyrone_zollverein_customs_union$#!."
 tyrone_germany.3.b_tt:0 "The #bold Zollverein#! will be recreated under [ROOT.GetCountry.GetName] as a #v $identity_military_treaty_organization$#! [concept_power_bloc], turning German economic convergence into military coordination.\nThe [concept_power_bloc] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyrone_zollverein_customs_union_tt $tyrone_zollverein_customs_union$#!."
 tyrone_germany.3.c_tt:0 "The #bold Zollverein#! will be recreated under [ROOT.GetCountry.GetName] as a #v $identity_trade_league$#! [concept_power_bloc], preserving trade as the first instrument of German unity.\nThe [concept_power_bloc] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyrone_zollverein_leverage_generation_tt $tyrone_zollverein_leverage_generation$#! for #bold 20 years#!; its effects will gradually decay."
 tyrone_germany.3.e_tt:0 "The #bold Zollverein#! will be recreated under [ROOT.GetCountry.GetName] as a #v $identity_ideological_union$#! [concept_power_bloc], giving the German question a common political language.\nThe [concept_power_bloc] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyrone_zollverein_customs_union_tt $tyrone_zollverein_customs_union$#!."

 tyrone_germany.4.t:0 "The German Markets Converge"
 tyrone_germany.4.d:0 "The lesser German states have been drawn into the orbit of the Zollverein. Their chancelleries retain their seals and ceremonies, but their roads, tariffs, contracts, and [concept_power_bloc_leverage] now bend toward [ROOT.GetCountry.GetName]."
 tyrone_germany.4.f:0 ""The map remains a quarrel of colors. The railway timetable, the customs schedule, and the merchant's account book tell a simpler story.""
 tyrone_germany.4.a:0 "Germany moves through Prussian ledgers."

 tyrone_prussian_confederation_construction:0 "The Workshops of the Confederation"
 tyrone_prussian_confederation_construction_desc:0 "The divided markets and workshops of the German lands are increasingly drawn into Prussia's industrial orbit."
 tyrone_prussian_confederation_principality:0 "Sheltered beneath the Prussian Eagle"
 tyrone_prussian_confederation_principality_desc:0 "Prussian protection and economic integration encourage families to remain and prosper within the smaller German states."
 tyrone_early_german_industrial_mobilization:0 "The Founding Momentum"
 tyrone_early_german_industrial_mobilization_desc:0 "An early union has allowed the new German state to marshal the labor, capital, and ambition of the nation toward a single industrial purpose."
 tyrone_german_foundation_birth_rate:0 "A Nation in Its Springtime"
 tyrone_german_foundation_birth_rate_desc:0 "Unity has inspired confidence in the future, encouraging the growth of families across the young German nation."
 tyrone_zollverein_customs_union:0 "The Zollverein Settlement"
 tyrone_zollverein_customs_union_desc:0 "The German customs order has been bound to the political architecture of the bloc, making common markets the first language of common power."
 tyrone_zollverein_leverage_generation:0 "The Customs Congress"
 tyrone_zollverein_leverage_generation_desc:0 "The Zollverein remains a commercial compact, but its committees, clerks, and tariff schedules give Prussia a thousand quiet channels of influence across Germany."
 tyrone_zollverein_customs_union_tt:0 "[GetStaticModifier('tyrone_zollverein_customs_union').GetName|v]\n[GetStaticModifier('tyrone_zollverein_customs_union').GetDesc]"
 tyrone_zollverein_leverage_generation_tt:0 "[GetStaticModifier('tyrone_zollverein_leverage_generation').GetName|v]\n[GetStaticModifier('tyrone_zollverein_leverage_generation').GetDesc]"

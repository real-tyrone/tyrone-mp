l_english:
 ita_eritrea_purchase_decision:0 "Purchase Eritrea"
 ita_eritrea_purchase_decision_desc:0 "With the Berlin Conference concluded, Italy can make a formal offer to acquire Eritrea from its current owner."
 italy_eritrea_purchase.1.t:0 "The Eritrea Purchase"
 italy_eritrea_purchase.1.d:0 "[SCOPE.sCountry('italy_eritrea_buyer_scope').GetName] has approached us with an offer to purchase our holdings in Eritrea."
 italy_eritrea_purchase.1.f:0 "Italian envoys arrive with contracts, maps, and a simple argument: Eritrea would be better administered from Rome, while compensation would spare both governments a costly dispute."
 italy_eritrea_purchase.1.a:0 "Accept the Italian offer."
 italy_eritrea_purchase.1.b:0 "Eritrea is not for sale."
 italy_eritrea_purchase.2.t:0 "The Eritrea Purchase Accepted"
 italy_eritrea_purchase.2.d:0 "[SCOPE.sCountry('italy_eritrea_owner_scope').GetName] has accepted our offer. Eritrea will pass into Italian administration."
 italy_eritrea_purchase.2.f:0 "The signatures are dry before the maps are folded. A bargain has become a border."
 italy_eritrea_purchase.2.a:0 "Excellent."
 italy_eritrea_purchase.3.t:0 "The Eritrea Purchase Rejected"
 italy_eritrea_purchase.3.d:0 "[SCOPE.sCountry('italy_eritrea_owner_scope').GetName] has rejected our offer to purchase Eritrea."
 italy_eritrea_purchase.3.f:0 "The delegation returns with courteous words and empty hands. The matter of Eritrea remains unresolved."
 italy_eritrea_purchase.3.a:0 "Then our claim remains."

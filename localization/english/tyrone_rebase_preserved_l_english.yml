l_english:
 law_chi_confucius: "Confucianism"
 law_chi_confucius_desc: "Confucianism has taken as the primary guiding philosophy of the state, the cultivation of virtuous leadership. however able to maintain the stability of the state, it is also a philosophy that has been used to justify the subjugation of women and the lower classes. The state will be more stable, but at the cost of social mobility."
 law_chi_industry_banned: "Physiocratic Economy"
 law_chi_industry_banned_desc: "The state has chosen to prioritize agricultural production over industrial development. This approach emphasizes self-sufficiency and stability of the state and increased income of state coffers."
 law_chi_mixed_economic_policy: "Mixed Economic Policy"
 law_chi_mixed_economic_policy_desc: "The state has chosen to balance agricultural and industrial development, promoting both self-sufficiency and economic growth however its efforts limits increased income of state coffers."
 law_chi_offical_supervision: "Official Supervision of Commerce"
 law_chi_offical_supervision_desc: "The state is able to levy more control over commercial activities in urban areas leaving behind its roots of agricultural focus."
 law_chi_national_resources_commission: "National Resources Commission"
 law_chi_national_resources_commission_desc: "The state has established a commission to oversee the development and management of national resources, ensuring that they are used efficiently and sustainably for the benefit of the nation."
 law_chi_cooperative_ownership: "Cooperative Ownership (P)"
 law_chi_cooperative_ownership_desc: "The state has encouraged the formation of cooperatives and collective ownership of resources, promoting shared responsibility and benefits among citizens."
 law_chi_yinpriv: "Yin privileges"
 law_chi_yinpriv_desc: "The state has granted special privileges to the Yin family, allowing them to maintain significant influence and control over certain aspects of governance and commerce."
 law_chi_purchaseof_office: "Purchase of Office"
 law_chi_purchaseof_office_desc: "The state has allowed the practice of purchasing government offices, enabling individuals to buy positions of power and influence within the administration."
 law_chi_cadres: "Cadres System"
 law_chi_cadres_desc: "The state has established a system of cadres, where individuals are selected and trained for specific roles within the government, ensuring a skilled and loyal bureaucracy above all else."
 law_chi_no_schools: "Isolated Scholars"
 law_chi_no_schools_desc: "The is no formal education system in place outside of isolated scholarly circles that influce the goverment."
 law_chi_religious_focus: "Religious Focused Education"
 law_chi_religious_focus_desc: "The Goverment has formalised old schooling system that focuses on religious teachings and moral values, providing a foundation for the education of the population."
 law_chi_merchent_led: "Merchant-Led Education"
 law_chi_merchent_led_desc: "The state has allowed merchants to take the lead in establishing educational institutions, promoting practical skills and knowledge relevant to commerce and trade."
 law_chi_state_led: "State-Led Education"
 law_chi_state_led_desc: "The state has taken the lead in establishing and overseeing educational institutions, ensuring that the curriculum aligns with national priorities and values."
 law_chi_tuanlian: "Tuanlian Army"
 law_chi_tuanlian_desc: "The state has established a Tuanlian army, a traditional militia system that emphasizes local defense and community involvement in military affairs."
 law_chi_mintaun: "Mintuan Army"
 law_chi_mintaun_desc: "The state has established a Mintuan army, a more organized and professional military force that is better equipped and trained to defend the nation against external threats."
 law_chi_early_modernization: "Early Modernizated Army"
 law_chi_early_modernization_desc: "The state has undertaken early modernization efforts to reform and strengthen its military forces, incorporating new technologies and strategies to enhance its defensive capabilities."
 law_chi_national_militia: "National Militia (P)"
 law_chi_national_militia_desc: "The state has established a national militia, a citizen-based military force that can be mobilized in times of need to defend the nation and maintain internal security."
 law_chi_mass_conscription: "Mass Conscription (P)"
 law_chi_mass_conscription_desc: "The state has implemented a system of mass conscription, requiring all eligible citizens to serve in the military for a specified period of time, ensuring a large and ready pool of manpower for national defense."

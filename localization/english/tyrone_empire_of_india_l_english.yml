l_english:
 tyrone_eoi_revenue_autonomy_india:0 "The Revenue Articles: Indian Settlement"
 tyrone_eoi_revenue_autonomy_india_desc:0 "Indian officials control a greater share of provincial revenues."
 tyrone_eoi_revenue_autonomy_overlord:0 "The Revenue Articles: Imperial Obligations"
 tyrone_eoi_revenue_autonomy_overlord_desc:0 "The treasury has accepted the cost of leaving more revenue under Indian direction."
 tyrone_eoi_revenue_imperial_india:0 "The Revenue Articles: Imperial Terms"
 tyrone_eoi_revenue_imperial_india_desc:0 "The revenue articles give precedence to imperial claims."
 tyrone_eoi_revenue_imperial_overlord:0 "The Revenue Articles: Imperial Obligations"
 tyrone_eoi_revenue_imperial_overlord_desc:0 "The government must administer the remittances secured by the revenue articles."
 tyrone_eoi_revenue_concession:0 "The Revenue Articles: Concession"
 tyrone_eoi_revenue_concession_desc:0 "The delegation has paid for revised revenue terms from its own treasury."
 tyrone_eoi_civil_autonomy_india:0 "Appointments and Offices: Indian Settlement"
 tyrone_eoi_civil_autonomy_india_desc:0 "The provincial service answers more directly to Indian ministers."
 tyrone_eoi_civil_autonomy_overlord:0 "Appointments and Offices: Imperial Obligations"
 tyrone_eoi_civil_autonomy_overlord_desc:0 "Imperial offices bear the administrative cost of the provincial settlement."
 tyrone_eoi_civil_imperial_india:0 "Appointments and Offices: Imperial Terms"
 tyrone_eoi_civil_imperial_india_desc:0 "Imperial supervision adds to the expense of Indian institutions."
 tyrone_eoi_civil_imperial_overlord:0 "Appointments and Offices: Imperial Obligations"
 tyrone_eoi_civil_imperial_overlord_desc:0 "Reserved rights of appointment require a larger salaried establishment."
 tyrone_eoi_civil_concession:0 "Appointments and Offices: Concession"
 tyrone_eoi_civil_concession_desc:0 "Revised appointments require an additional salaried establishment."
 tyrone_eoi_military_autonomy_india:0 "The Command of the Regiments: Indian Settlement"
 tyrone_eoi_military_autonomy_india_desc:0 "The Indian establishment has secured greater responsibility for regimental organisation."
 tyrone_eoi_military_autonomy_overlord:0 "The Command of the Regiments: Imperial Obligations"
 tyrone_eoi_military_autonomy_overlord_desc:0 "The imperial government must support the regiments under the revised settlement."
 tyrone_eoi_military_imperial_india:0 "The Command of the Regiments: Imperial Terms"
 tyrone_eoi_military_imperial_india_desc:0 "Indian supplies must meet the requirements of the imperial command."
 tyrone_eoi_military_imperial_overlord:0 "The Command of the Regiments: Imperial Obligations"
 tyrone_eoi_military_imperial_overlord_desc:0 "Military instruction retains imperial privileges at a higher cost for supplies."
 tyrone_eoi_military_concession:0 "The Command of the Regiments: Concession"
 tyrone_eoi_military_concession_desc:0 "The concession commits further resources to military equipment."
 tyrone_eoi_trade_autonomy_india:0 "The Commercial Articles: Indian Settlement"
 tyrone_eoi_trade_autonomy_india_desc:0 "Indian commerce has gained room to develop under the constitutional articles."
 tyrone_eoi_trade_autonomy_overlord:0 "The Commercial Articles: Imperial Obligations"
 tyrone_eoi_trade_autonomy_overlord_desc:0 "Imperial merchants have lost privileges under the commercial settlement."
 tyrone_eoi_trade_imperial_india:0 "The Commercial Articles: Imperial Terms"
 tyrone_eoi_trade_imperial_india_desc:0 "Commercial provisions give precedence to imperial contracts."
 tyrone_eoi_trade_imperial_overlord:0 "The Commercial Articles: Imperial Obligations"
 tyrone_eoi_trade_imperial_overlord_desc:0 "The government has accepted treasury obligations to preserve its commercial advantages."
 tyrone_eoi_trade_concession:0 "The Commercial Articles: Concession"
 tyrone_eoi_trade_concession_desc:0 "The revised commercial terms restrict the government’s trading capacity."
 tyrone_eoi_education_autonomy_india:0 "The Direction of Instruction: Indian Settlement"
 tyrone_eoi_education_autonomy_india_desc:0 "Indian institutions have gained greater direction over instruction."
 tyrone_eoi_education_autonomy_overlord:0 "The Direction of Instruction: Imperial Obligations"
 tyrone_eoi_education_autonomy_overlord_desc:0 "The settlement has drawn expertise away from imperial institutions."
 tyrone_eoi_education_imperial_india:0 "The Direction of Instruction: Imperial Terms"
 tyrone_eoi_education_imperial_india_desc:0 "Indian instruction remains subordinate to the imperial provisions."
 tyrone_eoi_education_imperial_overlord:0 "The Direction of Instruction: Imperial Obligations"
 tyrone_eoi_education_imperial_overlord_desc:0 "Imperial oversight of instruction requires additional administrative resources."
 tyrone_eoi_education_concession:0 "The Direction of Instruction: Concession"
 tyrone_eoi_education_concession_desc:0 "The revised educational settlement diverts resources from current research."
 tyrone_eoi_princes_autonomy_india:0 "The Princes and the Constitution: Indian Settlement"
 tyrone_eoi_princes_autonomy_india_desc:0 "The provincial settlement recognises landed families within Indian government."
 tyrone_eoi_princes_autonomy_overlord:0 "The Princes and the Constitution: Imperial Obligations"
 tyrone_eoi_princes_autonomy_overlord_desc:0 "Recognising Indian authority over the princes has limited imperial prerogatives."
 tyrone_eoi_princes_imperial_india:0 "The Princes and the Constitution: Imperial Terms"
 tyrone_eoi_princes_imperial_india_desc:0 "The princes’ settlement has weakened the standing of Indian ministers."
 tyrone_eoi_princes_imperial_overlord:0 "The Princes and the Constitution: Imperial Obligations"
 tyrone_eoi_princes_imperial_overlord_desc:0 "The government must defend its claims over the princes in imperial diplomacy."
 tyrone_eoi_princes_concession:0 "The Princes and the Constitution: Concession"
 tyrone_eoi_princes_concession_desc:0 "The delegation has surrendered prerogatives to secure revised terms."
 tyrone_eoi_final_administration:0 "Provincial Autonomy"
 tyrone_eoi_final_administration_desc:0 "Provincial officials exercise the administrative freedom secured at Calcutta."
 tyrone_eoi_final_development:0 "An Indian Development Charter"
 tyrone_eoi_final_development_desc:0 "The constitutional settlement reserves greater room for public construction and Indian commerce."
 tyrone_eoi_final_reform:0 "Liberty of Reform"
 tyrone_eoi_final_reform_desc:0 "The government has secured constitutional room to pursue its own legislative programme."
 tyrone_eoi_final_authority_cost:0 "Constitutional Limits on Imperial Authority"
 tyrone_eoi_final_authority_cost_desc:0 "The Indian settlement has narrowed the reach of imperial authority."
 tyrone_eoi_final_minting_cost:0 "Indian Development Commitments"
 tyrone_eoi_final_minting_cost_desc:0 "Commitments made at Calcutta draw on the resources of the imperial treasury."
 tyrone_eoi_final_capitalists:0 "Imperial Investment Settlement"
 tyrone_eoi_final_capitalists_desc:0 "Imperial investors have secured a favourable place in the constitutional settlement."
 tyrone_eoi_final_authority:0 "Imperial Constitutional Prerogatives"
 tyrone_eoi_final_authority_desc:0 "The settlement reserves political prerogatives to the imperial government."
 tyrone_eoi_final_dividends:0 "The Imperial Revenue Settlement"
 tyrone_eoi_final_dividends_desc:0 "The imperial government has secured its claim on the returns of public holdings."
 tyrone_eoi_final_indian_remittances:0 "Imperial Remittance Obligations"
 tyrone_eoi_final_indian_remittances_desc:0 "India’s government must sustain the remittance obligations accepted in the imperial articles."
 tyrone_eoi_republican_imperial_crisis:0 "An Empire Without a Crown"
 tyrone_eoi_republican_imperial_crisis_desc:0 "Retaining an Indian emperor beneath a republican government has weakened the public standing of Britain’s imperial settlement."
 tyrone_eoi_council_expense:0 "The Princely Settlement"
 tyrone_eoi_council_expense_desc:0 "The incorporation of the princely dominions carries a continuing charge on Indian revenues."
 tyrone_empire_of_india.110.t:0 "The Revenue Articles"
 tyrone_empire_of_india.110.d:0 "The delegates have reached the division of revenues. Provincial expenditure competes with the remittances expected by the imperial treasury."
 tyrone_empire_of_india.110.f:0 "The same receipt appears in two estimates. Neither delegation has yet agreed which claim should be struck out."
 tyrone_empire_of_india.111.t:0 "The Revenue Articles"
 tyrone_empire_of_india.111.d:0 "[SCOPE.sCountry('eoi_proposer').GetName] has submitted the revenue articles. Indian ministers seek funds for the provinces, while the imperial treasury presses its claim to dependable remittances."
 tyrone_empire_of_india.111.f:0 "The same receipt appears in two estimates. Neither delegation has yet agreed which claim should be struck out."
 tyrone_empire_of_india.120.t:0 "Appointments and Offices"
 tyrone_empire_of_india.120.d:0 "Appointments to the provincial service have become a question of constitutional authority. Indian ministers seek control of their officials, while the imperial delegation insists on its right of supervision."
 tyrone_empire_of_india.120.f:0 "A district appointment can outlast the ministry that approved it. The delegates read each proposed restriction with that prospect in mind."
 tyrone_empire_of_india.121.t:0 "Appointments and Offices"
 tyrone_empire_of_india.121.d:0 "The proposed appointments place the provincial service within the constitutional settlement. [ROOT.GetCountry.GetName] must judge how much authority can safely be entrusted to officials appointed by the other government."
 tyrone_empire_of_india.121.f:0 "A district appointment can outlast the ministry that approved it. The delegates read each proposed restriction with that prospect in mind."
 tyrone_empire_of_india.130.t:0 "The Command of the Regiments"
 tyrone_empire_of_india.130.d:0 "The regiments raised in India serve under obligations that the proposed constitution must now define. Authority over their supplies and instruction divides the delegations."
 tyrone_empire_of_india.130.f:0 "Orders cross the sea more slowly than a regiment can march. Every officer at the conference has an example to offer."
 tyrone_empire_of_india.131.t:0 "The Command of the Regiments"
 tyrone_empire_of_india.131.d:0 "[SCOPE.sCountry('eoi_proposer').GetName] has presented its terms for the regiments. Behind the question of command stand competing claims on military supplies and the instruction of officers."
 tyrone_empire_of_india.131.f:0 "Orders cross the sea more slowly than a regiment can march. Every officer at the conference has an example to offer."
 tyrone_empire_of_india.140.t:0 "The Commercial Articles"
 tyrone_empire_of_india.140.d:0 "Merchants have submitted their claims to the conference. Indian delegates seek room for their own commercial policy; the imperial delegation presses for reliable access and preferential contracts."
 tyrone_empire_of_india.140.f:0 "The merchants disagree about the articles. They agree that a poorly chosen sentence may cost more than a year of tariffs."
 tyrone_empire_of_india.141.t:0 "The Commercial Articles"
 tyrone_empire_of_india.141.d:0 "The commercial delegation from [SCOPE.sCountry('eoi_proposer').GetName] has delivered its articles. Their provisions will determine which government can direct trade and whose merchants receive the advantage."
 tyrone_empire_of_india.141.f:0 "The merchants disagree about the articles. They agree that a poorly chosen sentence may cost more than a year of tariffs."
 tyrone_empire_of_india.150.t:0 "The Direction of Instruction"
 tyrone_empire_of_india.150.d:0 "The government responsible for schools will also appoint those who teach future officials. Both delegations regard the control of instruction as a lasting provision of the settlement."
 tyrone_empire_of_india.150.f:0 "The proposed curriculum has arrived with a list of recommended appointments. The names have attracted more attention than the subjects."
 tyrone_empire_of_india.151.t:0 "The Direction of Instruction"
 tyrone_empire_of_india.151.d:0 "[SCOPE.sCountry('eoi_proposer').GetName] has proposed a settlement for instruction and appointments. The terms would shape the education of the officials who will administer India’s constitution."
 tyrone_empire_of_india.151.f:0 "The proposed curriculum has arrived with a list of recommended appointments. The names have attracted more attention than the subjects."
 tyrone_empire_of_india.160.t:0 "The Princes and the Constitution"
 tyrone_empire_of_india.160.d:0 "The princes seek guarantees for their position within the proposed empire. The delegations must decide whether those guarantees will be administered in India or secured through imperial oversight."
 tyrone_empire_of_india.160.f:0 "Several envoys have brought older treaties to the table. Their seals are intact, although their provisions do not always agree."
 tyrone_empire_of_india.161.t:0 "The Princes and the Constitution"
 tyrone_empire_of_india.161.d:0 "The proposed guarantees for the princes have reached the delegation from [ROOT.GetCountry.GetName]. Their wording will decide which government speaks with authority when the older treaties are disputed."
 tyrone_empire_of_india.161.f:0 "Several envoys have brought older treaties to the table. Their seals are intact, although their provisions do not always agree."
 tyrone_empire_of_india.10.t:0 "The Calcutta Settlement"
 tyrone_empire_of_india.10.d:0 "The constitutional conference has concluded. [ROOT.GetCountry.GetName] has secured room to determine how its provincial government will develop, although the settlement leaves obligations on both sides."
 tyrone_empire_of_india.10.f:0 "The delegations have signed the articles. The ministers who must administer them are already asking which provision takes precedence."
 tyrone_empire_of_india.11.t:0 "The Imperial Articles"
 tyrone_empire_of_india.11.d:0 "The conference has secured imperial prerogatives in the constitution of [SCOPE.sCountry('csr_india').GetName]. The government must now decide which of those claims to pursue."
 tyrone_empire_of_india.11.f:0 "The signatures have scarcely dried before the departments begin their dispute over the returns."
 tyrone_empire_of_india.20.t:0 "An Ultimatum from Calcutta"
 tyrone_empire_of_india.20.d:0 "The Indian delegation has withdrawn its demand for a revised settlement and now claims independence. [ROOT.GetCountry.GetName] must recognise that claim or contest it through a diplomatic play."
 tyrone_empire_of_india.20.f:0 "The final communication has no schedule of concessions attached. It asks for an answer."
 tyrone_empire_of_india.30.t:0 "The Princes and the Indian Government"
 tyrone_empire_of_india.30.d:0 "The government of [SCOPE.sCountry('csr_india').GetName] proposes to negotiate the incorporation of the Indian princes. It asks permission to include those who answer directly to [ROOT.GetCountry.GetName]."
 tyrone_empire_of_india.30.f:0 "For the princes, the identity of the government that guarantees their position has never been a minor distinction."
 tyrone_empire_of_india.35.t:0 "The [SCOPE.sStateRegion('eoi_council_region').GetName] Settlement"
 tyrone_empire_of_india.35.d:0 "The Council has turned to the princes with possessions in #v [SCOPE.sStateRegion('eoi_council_region').GetName]#!. Their incorporation will bring their entire territories under the Indian government, including lands beyond the region."
 tyrone_empire_of_india.35.f:0 "The settlement concerns estates whose boundaries have accumulated through generations of grants and inheritance. Few end neatly at a provincial border."
 tyrone_empire_of_india.40.t:0 "The Provincial Service"
 tyrone_empire_of_india.40.d:0 "The provincial administrations of [ROOT.GetCountry.GetName] can now sustain a broader imperial service. Officials and local notables have agreed on a framework for sharing its offices."
 tyrone_empire_of_india.40.f:0 "The new establishment will still need men, salaries and instructions. It now has an agreed place for each."
 tyrone_empire_of_india.41.t:0 "The Gendarmerie of Asia"
 tyrone_empire_of_india.41.d:0 "A large permanent army now serves under a common Indian establishment. Its officers can organise sustained operations beyond the districts in which their regiments were raised."
 tyrone_empire_of_india.41.f:0 "The military estimates have grown with the army. Its staff insists that regular instruction and dependable supplies are the price of keeping so many regiments useful."
 tyrone_empire_of_india.42.t:0 "A Council Made Imperial"
 tyrone_empire_of_india.42.d:0 "The princes admitted to the Council have been incorporated into [ROOT.GetCountry.GetName]. Their settlement opens a claim to common imperial citizenship and a wider measure of home rule."
 tyrone_empire_of_india.42.f:0 "The provincial titles remain familiar. The authority to which their holders answer has changed."
 tyrone_empire_of_india.50.t:0 "The Imperial Diadem"
 tyrone_empire_of_india.50.d:0 "The reforms and the coronation have established an #v Empire of India#!. Its ministers must now decide who will wear the crown, and which claim will anchor the new monarchy."
 tyrone_empire_of_india.50.f:0 "The ceremony has settled the form of the state. The name proclaimed beneath the canopy will give that settlement a ruler."
 tyrone_empire_of_india.51.t:0 "A Republic and Its Emperor"
 tyrone_empire_of_india.51.d:0 "The proclamation of an Indian emperor has exposed the contradiction in Britain’s imperial settlement. A republican government must decide whether to recognise Indian independence or defend its authority over the new monarchy."
 tyrone_empire_of_india.51.f:0 "Ministers can defend possession, or they can defend the principle they have proclaimed at home. Parliament expects an explanation either way."
 tyrone_empire_of_india.60.t:0 "The Indian Home Rule Act"
 tyrone_empire_of_india.60.d:0 "The imperial constitution now recognises an Indian political nation beyond the old provincial divisions. The government has accepted the South Asian cultures rooted in its territories as primary cultures of the state."
 tyrone_empire_of_india.60.f:0 "Representatives arrive under different provincial names. The act gives their claims a common standing."

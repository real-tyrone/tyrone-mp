 dyn_c_tyrone_empire_of_india:0 "Empire over India"
 dyn_c_tyrone_empire_of_india_adj:0 "Indian"
 law_india_imperial_provincial_administration:0 "Imperial Provincial Administration"
 law_india_imperial_provincial_administration_desc:0 "Imperial officials share the provincial service with local notables. Their appointments sustain a common administration while preserving a political place for the landed families."
 law_india_imperial_citizenship:0 "Imperial Citizenship"
 law_india_imperial_citizenship_desc:0 "Membership of the empire rests on a common civic standing across cultures. The government bears the expense of giving that settlement an administrative form."
 amendment_tyrone_eoi_gendarmerie:0 "The Gendarmerie of Asia"
 amendment_tyrone_eoi_gendarmerie_desc:0 "A permanent military establishment supports the instruction and recovery of the great Indian regiments, at a higher cost for their equipment."
 je_tyrone_eoi_calcutta:0 "Calcutta Settlement"
 je_tyrone_eoi_calcutta_reason:0 "The government in #v [SCOPE.sCountry('csr_india').GetName]#! seeks a constitution for the empire it proposes to build. Its claim to provincial authority must be settled with an #v imperial government#! that still expects revenue, service and oversight.\n\nBoth delegations can offer concessions. Their agreements will determine how much freedom the new Indian institutions possess, and whether continued dependence remains acceptable."
 je_tyrone_eoi_calcutta_status:0 ""
 je_tyrone_eoi_civil_service:0 "Civil Service Reforms"
 je_tyrone_eoi_civil_service_reason:0 "The provinces still carry the marks of separate establishments and inherited appointments. An imperial government needs offices capable of administering their districts without surrendering every decision to distant supervision.\n\n[GetLawType('law_india_imperial_provincial_administration').GetName] would give imperial officials and local notables a place in a common service. Its advocates must first show that the provincial administration can sustain it."
 je_tyrone_eoi_civil_service_status:0 ""
 je_tyrone_eoi_gendarmerie:0 "The Gendarmerie of Asia"
 je_tyrone_eoi_gendarmerie_reason:0 "The army raised to protect the Company’s possessions is being asked to serve a larger imperial purpose. Sustained operations across Asia demand trained regiments, organised recruitment and arms suited to their task.\n\n[GetLawType('law_india_great_indian_army').GetName] offers the government a broad establishment. Its size must be matched by the means to supply and direct it."
 je_tyrone_eoi_gendarmerie_status:0 ""
 je_tyrone_eoi_council:0 "Council of Princes"
 je_tyrone_eoi_council_reason:0 "The princes hold territories whose obligations have been settled through separate treaties and inherited privileges. A common empire cannot leave every question of authority to those older arrangements.\n\nThe #v Council of Princes#! will negotiate their incorporation region by region. The landed order must retain a recognised place while those settlements are made; the resulting constitution can then establish a common citizenship."
 je_tyrone_eoi_council_status:0 ""
 je_tyrone_eoi_coronation:0 "Coronation in Bengal"
 je_tyrone_eoi_coronation_reason:0 "An imperial title must rest on more than the government’s proclamation. The provinces must be joined under a common authority, and the civil and military establishments must be able to uphold it.\n\nBengal will host the ceremony when the government is ready to declare the new monarchy. Until then, the work of bringing the empire into being remains unfinished."
 je_tyrone_eoi_coronation_status:0 ""
 je_tyrone_eoi_home_rule:0 "Home Rule"
 je_tyrone_eoi_home_rule_reason:0 "The princes’ settlement has opened the question of who belongs to the political nation. A common citizenship must rest on a monarchy whose religious settlement has an Indian foundation.\n\nUnder [GetLawType('law_india_imperial_citizenship').GetName], the government can recognise the cultures rooted in its territories as members of the state."
 je_tyrone_eoi_home_rule_status:0 ""

 je_qing_imperial_administrations: "The Qing Imperial Administrations"
 je_qing_imperial_administrations_reason: "The emperor governs through eight viceroyalties, three provincial governorates, Mongolia, the Inner Mongolian Banners, Ili, and Xining. These are subordinate offices within the empire. Tibet retains its separate dependent government. Provincial revenues support the imperial court, and all administrations serve in imperial wars. Central reforms can eventually replace these governments with direct administration."
 je_qing_imperial_administrations_goal: "Replace all appointed Qing administrations with direct imperial rule."
 chi_qing_integrate_desc: "Replace this subordinate administration with direct imperial rule. Its territory and population will become directly governed by the Qing court. One administration may be integrated every six months."
 chi_qing_centralisation_tt: "Have at least 6 Mandate centralisation, or have consolidated imperial authority."
 chi_qing_integration_cooldown_tt: "Have not integrated an administration in the last six months."
 chi_qing_army_reformed_tt: "The imperial army and all appointed provincial armies meet the modernization requirements."
 chi_qing_reforms_shared_tt: "Civil administrations implement the court's new law. Frontier governments retain their customary laws. National military and industrial journals count appointed administrations as part of the empire."

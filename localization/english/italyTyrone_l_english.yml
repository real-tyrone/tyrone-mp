#b 3#!rd [concept_great_power] (currently rank [GetPlayer.MakeScope.ScriptValue('irredentism_rank_current_script')|v0])\n• [SCOPE.GetRootScope.GetCountry.GetCustom('irredentism_units_checkbox')] Have more than [GetPlayer.MakeScope.ScriptValue('irredentism_units_target')|v0] [Concept('concept_battalion','$concept_battalions$')] \n• [SCOPE.GetRootScope.GetCountry.GetCustom('irredentism_tech_checkbox')] Have researched [GetPlayer.MakeScope.ScriptValue('irredentism_tech_target')|v0] [Concept('concept_technology', '$concept_technologies$')] (currently [GetPlayer.MakeScope.ScriptValue('irredentism_tech_current_script')|v0])"

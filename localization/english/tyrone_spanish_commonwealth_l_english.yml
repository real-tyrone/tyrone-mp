 scw_congress_cooldown_tt:0 "At least #v two years#! have passed since the last Commonwealth Congress."
 scw_regions_bar_tooltip:0 "#header Regional Participation#!\nBring eligible Hispanophone countries in the Americas into the Power Bloc led by #b Spain#!. Each regional anchor controlled by a member adds #v 5#! points, up to #v 60#!. Regional federations preserve the contribution of their constituent anchors. The total is recalculated monthly.\n\n#b Regional anchors#!\n#v Mexico and the Caribbean#!: [GetStateRegion('STATE_MEXICO').GetName], [GetStateRegion('STATE_WESTERN_CUBA').GetName], [GetStateRegion('STATE_SANTO_DOMINGO').GetName].\n#v Central America#!: [GetStateRegion('STATE_GUATEMALA').GetName], [GetStateRegion('STATE_HONDURAS').GetName], [GetStateRegion('STATE_NICARAGUA').GetName].\n#v Gran Colombia#!: [GetStateRegion('STATE_CUNDINAMARCA').GetName], [GetStateRegion('STATE_MIRANDA').GetName], [GetStateRegion('STATE_ECUADOR').GetName].\n#v Peru-Bolivia#!: [GetStateRegion('STATE_LIMA').GetName], [GetStateRegion('STATE_LA_PAZ').GetName], [GetStateRegion('STATE_POTOSI').GetName].\n#v Rio de la Plata#!: [GetStateRegion('STATE_BUENOS_AIRES').GetName], [GetStateRegion('STATE_URUGUAY').GetName], [GetStateRegion('STATE_BAJO_PARAGUAY').GetName]."
 scw_institutions_bar_tooltip:0 "#header Institutional Development#!\nGain #v 0.25#! points each month while #b Spain#! is at peace, Power Bloc cohesion is at least #v 60#!, and Regional Participation is at least #v 15#!.\n\nConvene a Commonwealth Congress and fund a programme to gain up to #v 2#! points. Supporting equal partners in the sovereignty event grants up to #v 3#! points; asserting Spanish primacy loses up to #v 2#!.\n\nCohesion below #v 30#! loses #v 0.25#! points monthly. Institutional Development is capped at #v 40#!. Passive monthly changes stop once the Commonwealth Charter is established."
 scw_consolidation_bar:0 "Commonwealth Consolidation"
 scw_consolidation_bar_desc:0 "Commonwealth Consolidation"
 scw_consolidation_bar_tooltip:0 "#header Commonwealth Consolidation#!\nCombines Regional Participation (up to #v 60#!) and Institutional Development (up to #v 40#!). The total is updated monthly.\n\nReach #v 25#! to unlock congresses. Completing the #b Spanish Commonwealth#! requires #v 100#! consolidation, participation in at least #v four regions#!, #v 70#! Power Bloc cohesion, and #b Spain#! leading a Power Bloc.\n\nConsolidation remains at #v 100#! after the Commonwealth Charter is established."

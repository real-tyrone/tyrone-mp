 scw_events.25.t:0 "The Question of Los Altos"
 scw_events.25.d:0 "The future of [SCOPE.sCountry('scw_los_altos').GetName] has become a matter for the Commonwealth. Its advocates defend a separate government, while others look north to Mexico or seek a closer union with their Central American neighbours. [SCOPE.sCountry('scw_sponsor').GetName] must decide which settlement to support."

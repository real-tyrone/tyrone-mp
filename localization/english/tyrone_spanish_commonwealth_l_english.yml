 scw_events.1.t:0 "An Invitation Across the Atlantic"
 scw_events.1.d:0 "The American republics have raised their own flags and claimed their place among the nations. Yet the Atlantic still carries a familiar language, the correspondence of merchants, and the fortunes of families divided between its shores. From [SCOPE.sCountry('scw_sponsor').GetCapital.GetCityHubName] comes a proposal to give these enduring ties a new political expression: a Commonwealth founded upon a common market, mutual development, and the willing association of its members."
 scw_events.1.a:0 "Let the Atlantic bind our nations together."

 scw_events.2.t:0 "In the Shadow of the Old Empire"
 scw_events.2.d:0 "The American delegates have received the proposals of [SCOPE.sCountry('scw_sponsor').GetName] with interest, but the memory of imperial government sits beside them at the negotiating table. Before committing their countries to the Commonwealth, they seek assurances that no charter, bank, or commercial convention will become an instrument for restoring the authority their predecessors cast off."
 scw_events.2.a:0 "Their independence shall be the foundation of our concord."
 scw_events.2.b:0 "The Commonwealth must look to [SCOPE.sCountry('scw_sponsor').GetName] for direction."

 scw_events.3.t:0 "Capital for Two Continents"
 scw_events.3.d:0 "Surveyors have drawn their lines and engineers have submitted their estimates. What remains is to find the capital. A proposal before the Commonwealth Development Bank would finance construction and investment on both shores of the Atlantic. [SCOPE.sCountry('scw_sponsor').GetName] may underwrite the undertaking, or invite each beneficiary to subscribe its own share."
 scw_events.3.a:0 "Let the credit of [SCOPE.sCountry('scw_sponsor').GetName] set these works in motion."
 scw_events.3.b:0 "Let each partner subscribe its share."

 scw_events.4.t:0 "A Republic of Letters"
 scw_events.4.d:0 "A professor in [SCOPE.sCountry('scw_sponsor').GetName] may find an audience on either shore of the Atlantic without changing a word of their language. The universities propose a permanent association of scholars and institutions. Some delegates favour opening lecture halls and libraries to knowledge already won; others would pool their resources in pursuit of discoveries yet to be made."
 scw_events.4.a:0 "Open our lecture halls to the scholars of the Commonwealth."
 scw_events.4.b:0 "Let our scholars pursue new discoveries together."

 scw_events.5.t:0 "A Commonwealth of Nations"
 scw_events.5.d:0 "The final instruments of ratification have arrived in [SCOPE.sCountry('scw_sponsor').GetName]. Agreements once sustained by individual ministries and uncertain goodwill now possess the authority of a common charter. Merchants, scholars, and statesmen have given substance to the promise first made across the Atlantic. Those members seeking closer regional union retain the means to pursue it by common consent."
 scw_events.5.a:0 "May those who follow us find this concord enduring."

 scw_events.6.t:0 "The Commonwealth Congress"
 scw_events.6.d:0 "The congress has assembled in [SCOPE.sCountry('scw_sponsor').GetName] once more, bringing petitions, estimates, and ambitious schemes from across the Commonwealth. Its delegates must select their next undertaking: new works of construction, closer commercial arrangements, or assistance for families seeking a home across the Atlantic."
 scw_events.6.a:0 "Put capital into the hands of our builders."
 scw_events.6.b:0 "Give our merchants every opportunity to prosper."
 scw_events.6.c:0 "Help new households take root across the ocean."

 scw_events.8.t:0 "Our Share of the Common Endeavour"
 scw_events.8.d:0 "[SCOPE.sCountry('scw_sponsor').GetName] has invited the government of [SCOPE.sCountry('scw_event_country').GetName] to subscribe to the Commonwealth construction programme. The invitation carries no obligation: our ministers must judge whether the promised works warrant the expenditure."
 scw_events.8.a:0 "We shall subscribe our share."
 scw_events.8.b:0 "Our treasury cannot undertake this commitment."

 scw_events.20.t:0 "The Question of Federation"
 scw_events.20.d:0 "Under the sponsorship of [SCOPE.sCountry('scw_sponsor').GetName], delegates from [SCOPE.sCountry('scw_event_country').GetName] have gathered to consider a regional federation led by [SCOPE.sCountry('scw_federal_leader').GetName]. Its advocates promise a common government and greater weight in the councils of nations. Others would secure closer cooperation through a treaty between sovereign neighbours.\n\nFederation requires unanimous consent. Every participant other than [SCOPE.sCountry('scw_federal_leader').GetName] would be absorbed into the new federation. A cooperation treaty preserves each participant as a separate country."
 scw_events.20.a:0 "Let our countries unite beneath a federal government."
 scw_events.20.b:0 "A treaty between sovereign neighbours will serve us."
 scw_events.20.c:0 "We cannot assent to these proposals."

 scw_events.21.t:0 "Many Provinces, One Federation"
 scw_events.21.d:0 "The last delegation has given its assent, and the instruments of union bear every required signature. Under the sponsorship of [SCOPE.sCountry('scw_sponsor').GetName], the participating countries have united as [SCOPE.sCountry('scw_federal_leader').GetName]. The new federal government must now connect their economies and establish the foundations upon which their union will stand."
 scw_events.21.a:0 "May concord give strength to the new federation."

 scw_events.22.t:0 "Concord Without Union"
 scw_events.22.d:0 "The delegates meeting under the sponsorship of [SCOPE.sCountry('scw_sponsor').GetName] have agreed that their countries can advance together while retaining their separate governments. The signatures upon their treaty bind neighbouring nations to a common undertaking, while leaving their sovereignty intact."
 scw_events.22.a:0 "Let good neighbours prosper together."

 scw_events.23.t:0 "The Congress Adjourns"
 scw_events.23.d:0 "The congress sponsored by [SCOPE.sCountry('scw_sponsor').GetName] could not ratify the proposed settlement. Whether through a refusal or a change in a participating country, the conditions for agreement no longer hold. The delegates depart with their differences unresolved and their countries still separate."
 scw_events.23.a:0 "Leave the door open to another congress."

 scw_congress_button:0 "Commonwealth Congress"
 scw_congress_button_desc:0 "Summon the delegates of the Commonwealth to sponsor two years of construction, commercial cooperation, or migration assistance.\n\nMay be convened every two years. Spain contributes 0.01% of GDP per week, with a minimum weekly payment of £1,000. Each congress grants 2 institutional progress, up to the institutional cap of 40.\n\n#b Regional participation#!\nEach regional anchor contributes 5 points, up to 60, and remains counted after federation. Four fully represented regions provide the maximum contribution.\n\n#v Mexico and the Caribbean#!: [GetStateRegion('STATE_MEXICO').GetName], [GetStateRegion('STATE_WESTERN_CUBA').GetName], [GetStateRegion('STATE_SANTO_DOMINGO').GetName].\n#v Central America#!: [GetStateRegion('STATE_GUATEMALA').GetName], [GetStateRegion('STATE_HONDURAS').GetName], [GetStateRegion('STATE_NICARAGUA').GetName].\n#v Gran Colombia#!: [GetStateRegion('STATE_CUNDINAMARCA').GetName], [GetStateRegion('STATE_MIRANDA').GetName], [GetStateRegion('STATE_ECUADOR').GetName].\n#v Peru-Bolivia#!: [GetStateRegion('STATE_LIMA').GetName], [GetStateRegion('STATE_LA_PAZ').GetName], [GetStateRegion('STATE_POTOSI').GetName].\n#v Rio de la Plata#!: [GetStateRegion('STATE_BUENOS_AIRES').GetName], [GetStateRegion('STATE_URUGUAY').GetName], [GetStateRegion('STATE_BAJO_PARAGUAY').GetName]."

 scw_gco_button:0 "Gran Colombia Congress"
 scw_gco_button_desc:0 "Invite the surviving countries of the region to restore Gran Colombia through a voluntary federal union.\n\nLeadership passes to the first existing country in this order: Colombia, Venezuela, Ecuador. Every participant must consent, have belonged to the Commonwealth for at least one year, and have at least +50 relations with Spain. All participants must be eligible and at peace.\n\nA successful federation receives five years of reconstruction support."

 scw_plt_button:0 "Rio de la Plata Congress"
 scw_plt_button_desc:0 "Invite the surviving countries of the region to negotiate a federal union of the Río de la Plata.\n\nLeadership passes to the first existing country in this order: Argentina, Uruguay, Paraguay. Every participant must consent, have belonged to the Commonwealth for at least one year, and have at least +50 relations with Spain. All participants must be eligible and at peace.\n\nA successful federation receives five years of reconstruction support."

 scw_uca_button:0 "Central American Congress"
 scw_uca_button_desc:0 "Invite the surviving countries of the region to reunite Central America beneath a federal government.\n\nLeadership passes to the first existing country in this order: Guatemala, El Salvador, Honduras, Nicaragua, Costa Rica. Every participant must consent, have belonged to the Commonwealth for at least one year, and have at least +50 relations with Spain. All participants must be eligible and at peace.\n\nA successful federation receives five years of reconstruction support."

 scw_pbc_button:0 "Peru-Bolivian Congress"
 scw_pbc_button_desc:0 "Invite the surviving countries of the region to establish a renewed Peru–Bolivian Confederation.\n\nLeadership passes to the first existing country in this order: Peru, Bolivia, North Peru, South Peru. Every participant must consent, have belonged to the Commonwealth for at least one year, and have at least +50 relations with Spain. All participants must be eligible and at peace.\n\nA successful federation receives five years of reconstruction support."

 je_spanish_commonwealth:0 "The Spanish Commonwealth"
 je_spanish_commonwealth_reason:0 "The ties between Spain and the American republics have outlived the empire that first joined them. Through a common market, works of development, and freely negotiated regional federations, we may give those ties an enduring institutional form.\n\nConsolidation combines regional participation, worth up to 60 progress, with institutional development, worth up to 40. Institutions gain 0.25 progress each month while Spain is at peace, bloc cohesion is at least 60, and regional participation is at least 15. Cohesion below 30 causes a monthly loss of 0.25 institutional progress.\n\nCompletion requires 100 progress, representation in four regions, at least 70 bloc cohesion, and Spain leading a Power Bloc."

 je_spanish_commonwealth_charter:0 "The Commonwealth Charter"
 je_spanish_commonwealth_charter_reason:0 "The charter has given permanent form to our transatlantic association. Its endurance now rests upon the prosperity of its members and the continued exercise of common diplomacy. Spain may sponsor regional federations and convene the Commonwealth Congress every two years.\n\nMembership benefits remain conditional on eligibility and continued participation. The programme ends if Spain loses leadership of the bloc."

 scw_progress_bar:0 "Commonwealth Consolidation"
 scw_progress_bar_desc:0 "Regions: [JournalEntry.GetTopScope.sCountry('scw_sponsor').MakeScope.Var('scw_regional_points').GetValue|0]/60 | Institutions: [JournalEntry.GetTopScope.sCountry('scw_sponsor').MakeScope.Var('scw_institutions').GetValue|1]/40"

 scw_opening_tt:0 "Establishes a common market for the bloc. While building the Commonwealth, Spain receives +50% Influence and +50% Leverage Generation. Eligible Hispanic American members receive construction, technology spread, and migration bonuses that improve as consolidation advances.\n\nRegional federation congresses unlock at 25 progress and require at least 12 months of membership. Congress cooldowns are two years."

 scw_charter_tt:0 "Spain receives +25% Influence, +25% Leverage Generation, and +10% Prestige, replacing its active leadership bonuses.\n\nAll eligible American members receive +10% construction efficiency, +10% technology spread, +15% migration attraction, and +5% manufacturing throughput. Commonwealth congresses and regional federation congresses remain available."

 scw_federation_ready_tt:0 "At least two original countries of the region must still exist. Every surviving participant must be an eligible member of the bloc, have belonged for at least 12 months, be at peace, and have at least +50 relations with Spain.\n\nEvery participant will be asked to consent. Federation absorbs all participants into the designated leader; a cooperation treaty preserves them as separate countries."

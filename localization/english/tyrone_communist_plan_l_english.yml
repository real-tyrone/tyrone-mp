 tyrone_cp.14.f:0 "Some projects remain foundations and scaffolding. The promises made when construction began have outlasted the money and materials sent to fulfil them."
 tyrone_cp.14.a:0 "We must answer for this failure."
 tyrone_cp.5.t:0 "Extraction: The Plan Fulfilled"
 tyrone_cp.5.d:0 "The extraction programme has met its construction targets. Its expanded works will supply the cooperatives and carry the next stage of development."
 tyrone_cp.5.f:0 "Delegates arrive with reports from the new works. There are more workshops to staff, more machines to maintain, and more goods to distribute."
 tyrone_cp.5.a:0 "Record the achievement."
 tyrone_cp.15.t:0 "Extraction: An Unfinished Plan"
 tyrone_cp.15.d:0 "The extraction programme has ended with fewer completed works than promised. Workers who were told to expect new employment now demand an explanation."
 tyrone_cp.15.f:0 "Some projects remain foundations and scaffolding. The promises made when construction began have outlasted the money and materials sent to fulfil them."
 tyrone_cp.15.a:0 "We must answer for this failure."
 tyrone_cp.6.t:0 "Military Industry: The Plan Fulfilled"
 tyrone_cp.6.d:0 "The military industry programme has met its construction targets. Its expanded works will supply the cooperatives and carry the next stage of development."
 tyrone_cp.6.f:0 "Delegates arrive with reports from the new works. There are more workshops to staff, more machines to maintain, and more goods to distribute."
 tyrone_cp.6.a:0 "Record the achievement."
 tyrone_cp.16.t:0 "Military Industry: An Unfinished Plan"
 tyrone_cp.16.d:0 "The military industry programme has ended with fewer completed works than promised. Workers who were told to expect new employment now demand an explanation."
 tyrone_cp.16.f:0 "Some projects remain foundations and scaffolding. The promises made when construction began have outlasted the money and materials sent to fulfil them."
 tyrone_cp.16.a:0 "We must answer for this failure."
 tyrone_cp.20.t:0 "The Village and the Factory"
 tyrone_cp.20.d:0 "The movement out of subsistence has changed the lives of millions. Families can begin to look beyond the next harvest, and the government claims that the revolution has given their children a future."
 tyrone_cp.20.f:0 "A wage brought home from the factory pays for grain, a pair of shoes, and a place in the schoolroom. The village still sends its produce to market; it now receives something more than demands in return."
 tyrone_cp.20.a:0 "Let this prosperity endure."
 tyrone_cp.21.t:0 "The Industrial Mobilization"
 tyrone_cp.21.d:0 "The government has ordered a rapid expansion of the industries supplying modern machinery and materials. Agricultural labour is being displaced before the new works can employ everyone seeking a wage."
 tyrone_cp.21.f:0 "The plan is printed in bold figures. Beneath them are the names of districts expected to release workers, surrender supplies, and bear the cost."
 tyrone_cp.21.a:0 "The factories must be built."
 tyrone_cp.22.t:0 "An Industrial Power"
 tyrone_cp.22.d:0 "India now stands among the leading producers of every material demanded by the mobilization. The works remain, along with the dangers and exhausting labour on which their output depends."
 tyrone_cp.22.f:0 "The final report records furnaces, workshops, and tonnes of finished goods. The families of those who died during the programme have kept a different account."
 tyrone_cp.22.a:0 "The mobilization has achieved its purpose."
 tyrone_cp.23.t:0 "The Cost of the Mobilization"
 tyrone_cp.23.d:0 "Ten years of requisitions and industrial expansion have failed to secure the promised place in world production. The hardships imposed on the population can no longer be defended as a temporary sacrifice."
 tyrone_cp.23.f:0 "In the districts that supplied the workers, the announcement is read without celebration. There will be no additional ration for having believed it."
 tyrone_cp.23.a:0 "End the mobilization."
 tyrone_cp.24.t:0 "[SCOPE.sStateRegion('cp_famine_region').GetName] Famine"
 tyrone_cp.24.d:0 "Displaced workers in #v [SCOPE.sStateRegion('cp_famine_region').GetName]#! have exhausted their means of buying food. Disease is spreading through a population already weakened by hunger."
 tyrone_cp.24.f:0 "The new works have drawn families away from the fields. Outside their gates, those who found no place wait beside sacks they can no longer afford."
 tyrone_cp.24.a:0 "The district must endure."

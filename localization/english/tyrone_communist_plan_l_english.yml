 tyrone_cp.1.t:0 "Heavy Industry: The Plan Fulfilled"
 tyrone_cp.1.d:0 "The heavy industry programme has met its construction targets. Its expanded works will supply the cooperatives and carry the next stage of development."
 tyrone_cp.1.f:0 "Delegates arrive with reports from the new works. There are more workshops to staff, more machines to maintain, and more goods to distribute."
 tyrone_cp.1.a:0 "Record the achievement."
 tyrone_cp.11.t:0 "Heavy Industry: An Unfinished Plan"
 tyrone_cp.11.d:0 "The heavy industry programme has ended with fewer completed works than promised. Workers who were told to expect new employment now demand an explanation."
 tyrone_cp.11.f:0 "Some projects remain foundations and scaffolding. The promises made when construction began have outlasted the money and materials sent to fulfil them."
 tyrone_cp.11.a:0 "We must answer for this failure."

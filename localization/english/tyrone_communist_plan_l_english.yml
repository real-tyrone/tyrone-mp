 je_tyrone_cp_village_reason:0 "Millions still depend on subsistence cultivation while the cooperatives seek workers for their expanding factories. #v The rural population#! must find a livelihood in this new economy, with wages sufficient to keep their families fed."
 je_tyrone_cp_forced:0 "Forced Industrialization"
 je_tyrone_cp_forced_reason:0 "The government demands an industrial base able to supply its own machines and materials. Agricultural districts are being stripped of labour to accelerate the expansion. #v Displaced families#! will bear the danger wherever the promised employment fails to arrive."

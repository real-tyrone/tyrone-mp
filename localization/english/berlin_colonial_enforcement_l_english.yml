l_english:
 berlin_colonial_enforcement.1.t: "Beyond Our Agreed Claims"
 berlin_colonial_enforcement.1.d: "Our colony in [SCOPE.sState('berlin_disputed_colony').GetName] lies outside the claims we agreed at the Berlin Conference. As a signatory, we are being called upon to withdraw."
 berlin_colonial_enforcement.1.f: "A signature on a map means little if every expedition redraws its borders."
 berlin_colonial_enforcement.1.a: "Withdraw and return the colony to its local inhabitants."
 berlin_colonial_enforcement.1.b: "Keep the colony. We will bear the diplomatic consequences."

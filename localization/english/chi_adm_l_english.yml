 chi_adm_provincial_development_start_education_3: "Education — Tier 3"
 chi_adm_provincial_development_start_education_3_desc: "Higher colleges promise a generation of engineers, physicians and officers versed in the sciences required by a modern state. Fund a 24-month provincial program to expand [concept_education_access]. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states.\n\n[GetStaticModifier('chi_adm_provincial_development_education_3').GetDesc]"
 chi_adm_provincial_development_education_3: "Educational Self-Strengthening — Tier 3"

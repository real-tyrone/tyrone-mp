 chi_adm_government_titles_gov_manchurian_generalships_desc: "The ancestral homeland of the ruling Manchu dynasty is administered through the military generalships of Shengjing, Jilin, and Heilongjiang. These imperial commanders oversee the Eight Banners, frontier defenses, and civil affairs under the authority of the Son of Heaven. The General of Shengjing holds senior precedence among the three, safeguarding the dynasty's northeastern heartland.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

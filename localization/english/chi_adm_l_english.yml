 chi_adm_regional_works.1.t: "The Embankments of Zhili"
 chi_adm_regional_works.1.d: "Memorials from the counties surrounding the capital speak of worn embankments and neglected causeways. The waterways of Zhili carry tribute grain, while the same roads convey men and provisions toward the northern passes. A broken crossing can strand an imperial grain convoy as surely as a garrison's supplies.\n\nSome magistrates demand engineers appointed by the provincial yamen; others insist that village headmen know which dikes are most vulnerable. The governor must decide whose seal shall authorize the repairs."
 chi_adm_regional_works.1.a: "Repair the crossings"
 chi_adm_regional_works.1.b: "Leave local relief to the magistrates"
 chi_adm_regional_works.1.a_tt: "Commit #v 3%#! Bureaucracy for one year. +4 Loyalty. The district gains #v -10%#! Turmoil Effects for two years."
 chi_adm_regional_works.1.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."
 chi_adm_regional_works_zhili_lead: "The Embankments of Zhili\nAn assembled garrison or unrest in Zhili brings the engineering petition to the governor."
 chi_adm_regional_works_zhili_settlement: "The Embankments of Zhili"
 chi_adm_regional_works_zhili_settlement_desc: "Memorials from the counties surrounding the capital speak of worn embankments and neglected causeways. The waterways of Zhili carry tribute grain, while the same roads convey men and provisions toward the northern passes. A broken crossing can strand an imperial grain convoy as surely as a garrison's supplies.\n\nSome magistrates demand engineers appointed by the provincial yamen; others insist that village headmen know which dikes are most vulnerable. The governor must decide whose seal shall authorize the repairs."
 chi_adm_regional_works.2.t: "The Yangtze Grain Accounts"
 chi_adm_regional_works.2.d: "Along the Grand Canal and the lower Yangtze, grain barges sustain the towns and storehouses of Jiangnan. Yet wharf masters, merchants and revenue clerks keep competing ledgers, and reports of missing cargo pass from one jurisdiction to another. Merchant houses offer warehouse space and credit if their receipts are recognized.\n\nThe provincial treasury may send inspectors to reconcile the grain accounts, or leave the transport guilds to guarantee delivery. Either choice will determine who answers when the next consignment fails to arrive."
 chi_adm_regional_works.2.a: "Survey the river depots"
 chi_adm_regional_works.2.b: "Recognize the grain merchants’ accounts"
 chi_adm_regional_works.2.a_tt: "Commit #v 3%#! Bureaucracy for one year. -4 Corruption. The district gains +#v 3#! Infrastructure for two years."
 chi_adm_regional_works.2.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."
 chi_adm_regional_works_liangjiang_lead: "The Yangtze Grain Accounts\nBanking in Liangjiang or unrest in Henan brings the grain accounts before the governor."
 chi_adm_regional_works_liangjiang_settlement: "The Yangtze Grain Accounts"
 chi_adm_regional_works_liangjiang_settlement_desc: "Along the Grand Canal and the lower Yangtze, grain barges sustain the towns and storehouses of Jiangnan. Yet wharf masters, merchants and revenue clerks keep competing ledgers, and reports of missing cargo pass from one jurisdiction to another. Merchant houses offer warehouse space and credit if their receipts are recognized.\n\nThe provincial treasury may send inspectors to reconcile the grain accounts, or leave the transport guilds to guarantee delivery. Either choice will determine who answers when the next consignment fails to arrive."
 chi_adm_regional_works.3.t: "The Huguang Granaries"
 chi_adm_regional_works.3.d: "Rice from the fields of Hunan and Hubei sustains the river towns and workshops of the middle Yangtze. But when the harvest is uncertain, county magistrates hesitate to send their stores downstream, fearing that empty granaries will leave the countryside hungry and discontented.\n\nGrain merchants promise regular shipments if their contracts are honored; local councils demand the right to hold reserves against scarcity. The governor must decide whether the provincial offices shall inspect the granary books or trust the stores to local hands."
 chi_adm_regional_works.3.a: "Audit the granary books"
 chi_adm_regional_works.3.b: "Let local councils hold the reserves"
 chi_adm_regional_works.3.a_tt: "Commit #v 3%#! Bureaucracy for one year. -4 Corruption. The district gains #v -3#! percentage points of Tax Waste for two years."
 chi_adm_regional_works.3.b_tt: "Commit #v 20#! Authority for one year. +4 Loyalty."
 chi_adm_regional_works_huguang_lead: "The Huguang Granaries\nThree levels of rice farms in Hunan bring the supply question to Huguang."
 chi_adm_regional_works_huguang_settlement: "The Huguang Granaries"
 chi_adm_regional_works_huguang_settlement_desc: "Rice from the fields of Hunan and Hubei sustains the river towns and workshops of the middle Yangtze. But when the harvest is uncertain, county magistrates hesitate to send their stores downstream, fearing that empty granaries will leave the countryside hungry and discontented.\n\nGrain merchants promise regular shipments if their contracts are honored; local councils demand the right to hold reserves against scarcity. The governor must decide whether the provincial offices shall inspect the granary books or trust the stores to local hands."
 chi_adm_regional_works.4.t: "The Canton Shipping Petitions"
 chi_adm_regional_works.4.d: "At Canton, the duties of imperial customs meet the demands of ocean-going commerce. Chinese merchant houses and foreign captains present manifests in different languages, while steam-powered vessels strain the schedules of older wharves. Delays invite disputed charges, lost cargo and accusations against the customs clerks.\n\nThe customs service asks for trained interpreters and regular registers. The merchant guilds insist that experienced traders can arrange the traffic without further interference from the yamen. The governor must choose who shall keep the port's accounts."
 chi_adm_regional_works.4.a: "Train the customs interpreters"
 chi_adm_regional_works.4.b: "Leave scheduling to the merchant guilds"
 chi_adm_regional_works.4.a_tt: "Commit #v 3%#! Bureaucracy for one year. -3 Corruption. The district gains +#v 10%#! Qualifications for two years."
 chi_adm_regional_works.4.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."
 chi_adm_regional_works_liangguang_lead: "The Canton Shipping Petitions\nTwo port levels in Guangdong bring the shipping petitions to Liangguang."
 chi_adm_regional_works_liangguang_settlement: "The Canton Shipping Petitions"
 chi_adm_regional_works_liangguang_settlement_desc: "At Canton, the duties of imperial customs meet the demands of ocean-going commerce. Chinese merchant houses and foreign captains present manifests in different languages, while steam-powered vessels strain the schedules of older wharves. Delays invite disputed charges, lost cargo and accusations against the customs clerks.\n\nThe customs service asks for trained interpreters and regular registers. The merchant guilds insist that experienced traders can arrange the traffic without further interference from the yamen. The governor must choose who shall keep the port's accounts."
 chi_adm_regional_works.5.t: "The Taiwan Coastal Stations"
 chi_adm_regional_works.5.d: "The strait separating Fujian from Taiwan is no gentle passage. Winds, shoals and uncertain landings complicate the movement of military dispatches, coastal provisions and merchants' cargo. Small harbors depend upon pilots familiar with the coast and trusted by the neighboring townships.\n\nProvincial officers propose surveys and properly maintained stations. Township leaders offer to maintain their own landings if their customary authority is recognized. The governor must decide how firmly the imperial administration shall bind the two shores together."
 chi_adm_regional_works.5.a: "Survey the crossings from Fujian"
 chi_adm_regional_works.5.b: "Recognize township administration"
 chi_adm_regional_works.5.a_tt: "Commit #v 3%#! Bureaucracy for one year. -3 Corruption. The district gains +#v 3#! Infrastructure for two years."
 chi_adm_regional_works.5.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."

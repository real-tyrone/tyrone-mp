 chi_qing_treaty_accept: "The court shall ratify the territorial settlement."
 chi_qing_treaty_decline: "Not another inch of the Emperor's domain."

 # Primorye — Russian claims beyond the Ussuri
 chi_qing_treaty_1_title: "The Ussuri Frontier Question"
 chi_qing_treaty_1_desc: "Envoys from the [SCOPE.sCountry('treaty_russia').GetName] have presented a demand for [SCOPE.sStateRegion('treaty_outer').GetName]. The [SCOPE.sCountry('treaty_russia').GetAdjectiveNoFlag] delegation seeks control of the maritime frontier beyond the Ussuri, extending its sovereign’s authority toward the Pacific coast.\n\nThe Grand Council warns that surrendering these lands would diminish the dynasty’s northeastern defenses. Ratification will transfer the affected territories held by the imperial government and its subjects to the [SCOPE.sCountry('treaty_russia').GetName]."

 # Chuguchak — the western border and Ili
 chi_qing_treaty_2_title: "The Chuguchak Frontier Protocol"
 chi_qing_treaty_2_desc: "Representatives of the [SCOPE.sCountry('treaty_russia').GetName] have proposed a settlement of the western frontier. Their demands encompass [SCOPE.sStateRegion('treaty_altai').GetName], [SCOPE.sStateRegion('treaty_jetisy').GetName] and [SCOPE.sStateRegion('treaty_kirghizia').GetName], redrawing the boundary between the [SCOPE.sCountry('treaty_russia').GetAdjectiveNoFlag] possessions and the imperial dominions.\n\nThe frontier commissioners protest that these valleys and mountain passes sustain the empire’s authority in the northwest. Ratification will transfer the affected territories held by the imperial government and its subjects to the [SCOPE.sCountry('treaty_russia').GetName]."

 # Aigun — the Amur River
 chi_qing_treaty_3_title: "The Treaty of Aigun"
 chi_qing_treaty_3_desc: "[SCOPE.sCountry('treaty_russia').GetAdjectiveNoFlag] envoys have presented a treaty concerning the Heilongjiang, known abroad as the Amur River. The delegation demands recognition of [SCOPE.sCountry('treaty_russia').GetAdjectiveNoFlag] sovereignty over [SCOPE.sStateRegion('treaty_amur').GetName].\n\nFor generations, the rivers and forests of the northeast have formed part of the Manchu homeland. The imperial ministers warn that ratification would surrender the affected territories held by the Throne and its subjects to the [SCOPE.sCountry('treaty_russia').GetName], bringing its frontier closer to the dynasty’s ancestral heartland."


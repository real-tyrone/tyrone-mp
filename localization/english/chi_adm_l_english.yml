 chi_adm_reform_recovery_1: "Restore Provincial Confidence"
 chi_adm_reform_recovery_1_desc: "#bold When commissioned#!\nSpend @money!#v 14,000#! and commit #v 20#! Bureaucracy for up to #v 12#! monthly reports. Landowners approval falls by #r 1#! for a year if they are not already resisting.\n\n#bold On completion#!\nFinish milestone 1 of 3. The penalty continues to fade until the final milestone removes it. Staff return the 20 Bureaucracy.\n\n$chi_adm_reform_report_discounts_tt$"

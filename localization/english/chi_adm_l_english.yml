 # Office Titles and Shanxi
 chi_adm_government_titles_gov_celestial_empire: "Celestial Empire"
 chi_adm_government_titles_gov_celestial_empire_desc: "The Son of Heaven (Tianzi) is the supreme imperial sovereign, governing under the Mandate of Heaven through the imperial court and appointed provincial officials.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 chi_adm_government_titles_gov_imperial_viceroyalty: "Imperial Viceroyalty"
 chi_adm_government_titles_gov_imperial_viceroyalty_desc: "The Viceroy (Zongdu), or Governor-General, is a senior imperial official entrusted with the administration of several provinces on behalf of the Qing court. The office exercises delegated authority within the empire.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 chi_adm_government_titles_gov_imperial_governorate: "Imperial Governorate"
 chi_adm_government_titles_gov_imperial_governorate_desc: "The Governor (Xunfu) administers a province under authority delegated by the Son of Heaven. The provincial office is distinct from the senior, wider responsibilities of a viceroyalty.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 chi_adm_government_titles_gov_uliastai_generalship: "Uliastai Generalship"
 chi_adm_government_titles_gov_uliastai_generalship_desc: "The General of Uliastai directs an imperial military and frontier administration based at Uliastai, upholding Qing authority through the institutions of the Mongolian frontier.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 chi_adm_government_titles_gov_banner_administration: "Banner Administration"
 chi_adm_government_titles_gov_banner_administration_desc: "The Imperial Commissioner represents the Qing court within the Mongolian banner institutions, preserving their distinctive arrangements under imperial authority.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 chi_adm_government_titles_gov_ili_generalship: "Ili Generalship"
 chi_adm_government_titles_gov_ili_generalship_desc: "The General of Ili commands an imperial frontier military administration responsible for Qing authority in the northwest.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 chi_adm_government_titles_gov_xining_commission: "Xining Imperial Commission"
 chi_adm_government_titles_gov_xining_commission_desc: "The Imperial Minister oversees Qinghai and its frontier institutions on behalf of the Qing court, working among the region's religious and local authorities.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 chi_adm_government_titles_title_son_of_heaven: "Son of Heaven"

 chi_adm_negotiated_integration_request_subsidy: "Request Financial Support"
 chi_adm_negotiated_integration_request_subsidy_desc: "Petition the Board of Revenue to shoulder part of the cost of transferring the provincial registers: automatic weekly support of 10% of provincial income, or 20% under stronger terms, during active implementation."

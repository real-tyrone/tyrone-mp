 chi_adm_provincial_development_defy: "Mobilize on Provincial Authority"

 chi_adm_provincial_development_defy_desc: "Lose #r 5#! [concept_chi_adm_loyalty] and #r 10#! [concept_relations] with Qing. Initial mobilization grants up to #v 10#! [concept_chi_adm_autonomy]; replacing a warrant carries over the existing grant."

 chi_adm_provincial_development_abandon: "Set Aside the Petition"

 chi_adm_provincial_development_abandon_desc: "Close this petition. A new request must wait #v three months#!."

 chi_adm_provincial_development_restore: "Return Exceptional Powers"

 chi_adm_provincial_development_restore_desc: "Return the tracked emergency [concept_chi_adm_autonomy] gain and remove the unsettled-accounts penalty."

 chi_adm_provincial_development_resist_restoration: "Retain Provincial Discretion"

 chi_adm_provincial_development_resist_restoration_desc: "Retain the emergency [concept_chi_adm_autonomy], with reduced tax revenue, #r −3#! [concept_chi_adm_loyalty] and #r −5#! [concept_relations]."

 chi_adm_provincial_development_approve: "Authorize the Requested Powers"

 chi_adm_provincial_development_counter_1: "Offer a Recruitment Warrant"

 chi_adm_provincial_development_counter_2: "Offer Defensive Readiness"


 chi_adm_governance: "The Governor's Accounts"
 chi_adm_governance_reason: "From the provincial yamen to the Grand Council, every sealed account is a measure of the dynasty's reach. The governor's registers record obedience to the Dragon Throne, the discretion exercised in its name, and the integrity of the officials entrusted with its revenues."
 chi_adm_governance_closed: "The imperial commission has come to an end. Its seals are withdrawn, but the accounts remain in the archives for posterity."

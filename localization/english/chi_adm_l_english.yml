 chi_adm_negotiated_integration_central_settlement: "Accept Closer Centralization"
 chi_adm_negotiated_integration_central_settlement_desc: "Accept closer imperial supervision while preserving provincial government.\n\n#bold Settlement effects#!\n@chi_adm_autonomy! [concept_chi_adm_autonomy]: #v −5#!\n[concept_relations] with the imperial court: #g +3#!\n\n#bold Provincial response#!\nAfter imperial pressure: @chi_adm_loyalty! [concept_chi_adm_loyalty] #r −3#!.\nOtherwise, if honors were offered: @chi_adm_loyalty! [concept_chi_adm_loyalty] #g +3#!.\n\n#bold Promised honors#!\nIf offered, the governor receives [GetStaticModifier('chi_adm_negotiated_integration_honored').GetName|v] for #v 10 years#!; the court receives [GetStaticModifier('chi_adm_negotiated_integration_honors_patronage').GetName|v] for #v 5 years#!.\n\n#bold Terms of settlement#!\n• The province remains a [concept_subject]; annexation does not occur.\n• Integration subsidies and fiscal privileges do not begin.\n• Further peaceful integration proposals are blocked for #v 12 months#!."

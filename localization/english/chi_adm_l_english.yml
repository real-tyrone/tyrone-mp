 chi_adm_regional_works_kaiping_works_desc: "At Kaiping, the coal seams promise fuel for northern workshops, steamships and the growing demands of modern transport. But a large mine requires pumps, engineers, haulage routes and credit on a scale unfamiliar to the older workings. Merchant investors see opportunity; cautious officials see an enterprise whose debts might fall upon the treasury.\n\nThe proposed company seeks a charter and reliable transport arrangements. Court examiners want the accounts opened before imperial favor is pledged, while provincial reformers insist that China cannot depend forever upon imported fuel and machinery."
 chi_adm_regional_works.102.t: "Hanyang Arsenal"
 chi_adm_regional_works.102.d: "Officials on the middle Yangtze propose linking foundries and machine shops to the manufacture of modern weapons. Imported machines alone cannot equip an army: iron, fuel, spare parts and trained fitters must arrive without interruption, and every cannon must answer to reliable inspection.\n\nSupporters argue that Chinese soldiers should not remain dependent upon foreign suppliers. Skeptics in the yamen question the expense of unfamiliar machinery and ask whether a powerful provincial arsenal will ultimately serve the court or the commanders who control its workshops."
 chi_adm_regional_works_hanyang_button: "Hanyang Arsenal"
 chi_adm_regional_works_hanyang_button_desc: "Endorse the works as part of your Military program. Ratification gives the site +#v 4#! Infrastructure for four years. Choose a provincial subscription or submit accounts for imperial review."
 chi_adm_regional_works_hanyang_requirements: "Incorporated Eastern Hubei with five arms industry levels, the established Hanyang Arsenal and Breech-Loading Artillery. The site’s Military Tier 3 must be underway or complete and the province must be able to fund the works."
 chi_adm_regional_works_hanyang_works: "Hanyang Arsenal"
 chi_adm_regional_works_hanyang_works_desc: "Officials on the middle Yangtze propose linking foundries and machine shops to the manufacture of modern weapons. Imported machines alone cannot equip an army: iron, fuel, spare parts and trained fitters must arrive without interruption, and every cannon must answer to reliable inspection.\n\nSupporters argue that Chinese soldiers should not remain dependent upon foreign suppliers. Skeptics in the yamen question the expense of unfamiliar machinery and ask whether a powerful provincial arsenal will ultimately serve the court or the commanders who control its workshops."
 chi_adm_regional_works.103.t: "Foochow Naval Academy"
 chi_adm_regional_works.103.d: "The slips at Foochow can be enlarged, but a modern fleet demands more than timber and iron. Navigators must read charts, engineers must understand their engines, and apprentices must learn mathematics and technical drawing before the shipyard can maintain its own vessels.\n\nReform-minded officials propose an academy attached to the naval works, where Chinese students may study foreign methods without abandoning service to the dynasty. Critics question the cost of imported instruction and the place of such learning beside the classical examinations."
 chi_adm_regional_works_foochow_button: "Foochow Naval Academy"
 chi_adm_regional_works_foochow_button_desc: "Endorse the works as part of your Education program. Ratification gives the site +#v 10%#! Qualifications for four years. Choose a provincial subscription or submit accounts for imperial review."
 chi_adm_regional_works_foochow_requirements: "Incorporated Fujian with five shipyard levels, the established Foochow Arsenal and Dialectics, Ironclads and Gantry Cranes. The site’s Education Tier 2 must be underway or complete and the province must be able to fund the works."
 chi_adm_regional_works_foochow_works: "Foochow Naval Academy"
 chi_adm_regional_works_foochow_works_desc: "The slips at Foochow can be enlarged, but a modern fleet demands more than timber and iron. Navigators must read charts, engineers must understand their engines, and apprentices must learn mathematics and technical drawing before the shipyard can maintain its own vessels.\n\nReform-minded officials propose an academy attached to the naval works, where Chinese students may study foreign methods without abandoning service to the dynasty. Critics question the cost of imported instruction and the place of such learning beside the classical examinations."
 chi_adm_regional_works.104.t: "Jingdezhen Porcelain"
 chi_adm_regional_works.104.d: "For generations the kilns of Jingdezhen have furnished porcelain to the imperial household and to merchants whose wares travel far beyond Jiangxi. Yet uneven firing, contested assessments and unreliable consignments threaten the reputation on which these orders depend.\n\nKiln masters propose better-organized workshops and regular accounts, while artisan families defend skills cultivated through generations of practice. The governor must decide how to modernize production without destroying the craft and commercial trust that made Jingdezhen renowned."
 chi_adm_regional_works_jingdezhen_button: "Jingdezhen Porcelain"
 chi_adm_regional_works_jingdezhen_button_desc: "Endorse the works as part of your Economy program. Ratification gives the site +#v 4#! Infrastructure for four years. Choose a provincial subscription or submit accounts for imperial review."
 chi_adm_regional_works_jingdezhen_requirements: "Incorporated Jiangxi with five glassworks levels, the established Jingdezhen company and Central Banking and Chemical Bleaching. The site’s Economy Tier 2 must be underway or complete and the province must be able to fund the works."
 chi_adm_regional_works_jingdezhen_works: "Jingdezhen Porcelain"
 chi_adm_regional_works_jingdezhen_works_desc: "For generations the kilns of Jingdezhen have furnished porcelain to the imperial household and to merchants whose wares travel far beyond Jiangxi. Yet uneven firing, contested assessments and unreliable consignments threaten the reputation on which these orders depend.\n\nKiln masters propose better-organized workshops and regular accounts, while artisan families defend skills cultivated through generations of practice. The governor must decide how to modernize production without destroying the craft and commercial trust that made Jingdezhen renowned."
 chi_adm_regional_works.105.t: "Jiangnan Weaving Bureaus"
 chi_adm_regional_works.105.d: "The imperial weaving bureaus of Suzhou have long supplied fine cloth and silk to the palace, but the prestige of their commissions cannot settle disputes over deliveries, wages and the cost of materials. Merchants complain of missed orders; artisans protest changing piece rates; the clerks disagree over what has already been paid.\n\nReformers propose stricter registers and a regular accounting of the workshops. Such scrutiny may reassure the treasury, but it also threatens the customary fees and arrangements through which officials, contractors and guild masters have long done business."
 chi_adm_regional_works_jiangnan_button: "Jiangnan Weaving Bureaus"
 chi_adm_regional_works_jiangnan_button_desc: "Endorse the works as part of your Administration program. Ratification gives the site +#v 4#! Infrastructure for four years. Choose a provincial subscription or submit accounts for imperial review."
 chi_adm_regional_works_jiangnan_requirements: "Incorporated Suzhou with five textile mill levels, the established Jiangnan Weaving Bureaus and Central Archives. The site’s Administration Tier 2 must be underway or complete and the province must be able to fund the works."
 chi_adm_regional_works_jiangnan_works: "Jiangnan Weaving Bureaus"
 chi_adm_regional_works_jiangnan_works_desc: "The imperial weaving bureaus of Suzhou have long supplied fine cloth and silk to the palace, but the prestige of their commissions cannot settle disputes over deliveries, wages and the cost of materials. Merchants complain of missed orders; artisans protest changing piece rates; the clerks disagree over what has already been paid.\n\nReformers propose stricter registers and a regular accounting of the workshops. Such scrutiny may reassure the treasury, but it also threatens the customary fees and arrangements through which officials, contractors and guild masters have long done business."
 chi_adm_regional_works.106.t: "Lanzhou Woolen Mill"
 chi_adm_regional_works.106.d: "The pastures of the northwest yield wool that often leaves the region as raw fleece. Provincial reformers propose machinery at Lanzhou to spin and weave it into cloth for civilian markets and the army, hoping to retain both revenue and skilled labor closer to the frontier.\n\nLong supply roads, unfamiliar equipment and the cost of imported machinery trouble local merchants. They demand dependable payment for military orders and protection from sudden requisitions before placing their silver behind the proposed mill."
 chi_adm_regional_works_lanzhou_button: "Lanzhou Woolen Mill"
 chi_adm_regional_works_lanzhou_button_desc: "Endorse the works as part of your Economy program. Ratification gives the site +#v 4#! Infrastructure for four years. Choose a provincial subscription or submit accounts for imperial review."
 chi_adm_regional_works_lanzhou_requirements: "Incorporated Ningxia with three textile mill levels and Central Banking. The site’s Economy Tier 2 must be underway or complete and the province must be able to fund the works."
 chi_adm_regional_works_lanzhou_works: "Lanzhou Woolen Mill"
 chi_adm_regional_works_lanzhou_works_desc: "The pastures of the northwest yield wool that often leaves the region as raw fleece. Provincial reformers propose machinery at Lanzhou to spin and weave it into cloth for civilian markets and the army, hoping to retain both revenue and skilled labor closer to the frontier.\n\nLong supply roads, unfamiliar equipment and the cost of imported machinery trouble local merchants. They demand dependable payment for military orders and protection from sudden requisitions before placing their silver behind the proposed mill."

 # Guide to Qing China
 je_group_chi_adm_player_guide: "Guide to Qing China"
 chi_adm_player_guide: "Guide to Qing China"
 chi_adm_player_guide_reason: "Use the four chapters to find the journals and decisions available to your country. Read a briefing before funding reforms, issuing imperial orders, or choosing a side in a crisis."
 chi_adm_player_guide_governance: "Governing the Empire"
 chi_adm_player_guide_governance_reason: "Read the provincial accounts, request or grant Qing assistance, and compare options for imperial law directives and closer supervision."
 chi_adm_player_guide_development: "Reform and Regional Works"
 chi_adm_player_guide_development_reason: "Learn how provincial commissions lift inherited penalties and how Self-Strengthening projects and regional works support them."
 chi_adm_player_guide_security: "Imperial Crises and Diplomacy"
 chi_adm_player_guide_security_reason: "Follow foreign pressure, the Provincial League, and the court’s response from the first public warnings to open conflict."
 chi_adm_player_guide_taiping: "The Taiping Rebellion"
 chi_adm_player_guide_taiping_reason: "Manage local missions and the God Worshipping Society, choose a wartime allegiance, or take command of the Heavenly Kingdom."
 chi_adm_player_guide_available_tt: "You are playing as Qing, one of its imperial administrations, or the Heavenly Kingdom."
 chi_adm_player_guide_taiping_status_victory: "The Heavenly Kingdom survived the war. See Playing the Heavenly Kingdom for the religious settlement."
 chi_adm_player_guide_taiping_status_kingdom: "The civil war has begun. Read the wartime allegiance and takeover rules, then check the active war in Diplomacy."
 chi_adm_player_guide_taiping_status_society: "The Society has footholds. Governors with a local foothold can use Provincial Religious Affairs to suppress or support it."
 chi_adm_player_guide_taiping_status_missions: "The Chinese Missions are active. Governors can set local access through Provincial Religious Affairs."
 chi_adm_player_guide_taiping_status_quiet: "The court has no active missionary or uprising journal."
 chi_adm_player_guide_close: "Close briefing"
 chi_adm_player_guide_button_tooltip: "#header [ScriptedButton.GetName]#!\n[ScriptedButton.GetDesc]"
 chi_adm_player_guide_start_button: "Where should I start?"
 chi_adm_player_guide_start_button_desc: "Find the opening journals and the right briefing for Qing, a governor, or the Heavenly Kingdom."
 chi_adm_player_guide.1.t: "Where should I start?"
 chi_adm_player_guide.1.d_court: "Open #bold $chi_adm_court_register_ledger$#! to assess the provinces and #bold $je_mandate_of_heaven$#! to review imperial stability. Use Governing the Empire for memorials and directives, Reform and Regional Works for modernization, and Imperial Crises and Diplomacy for foreign pressure and the Provincial League. The Taiping chapter explains missionary access and wartime allegiance."
 chi_adm_player_guide.1.d_heavenly: "Your first objective is to survive the civil war. Read #bold Playing the Heavenly Kingdom#! in the Taiping chapter for the war goals, your religious laws, and the postwar conversion journal."
 chi_adm_player_guide.1.d: "Start in #bold $chi_adm_governance$#! to review Loyalty, Autonomy, Corruption, and payments to Qing. Open #bold $je_chi_adm_reform_portfolio$#! when eligible and use the #bold $chi_adm_court_register_memorial_desk$#! to request aid. Check the Security and Taiping chapters before making commitments in a crisis."
 chi_adm_player_guide_accounts_button: "How do the provincial accounts work?"
 chi_adm_player_guide_accounts_button_desc: "Read the accounts and learn how to request or grant imperial relief."
 chi_adm_player_guide.2.t: "How do the provincial accounts work?"
 chi_adm_player_guide.2.d_court: "Use the #bold $chi_adm_court_register_ledger$#! to compare governors. Loyalty and Autonomy adjust remittances. Corruption affects provincial tax capacity and the risk of audit findings. In #bold $chi_adm_memorials_memorials$#!, an approved relief request transfers £20,000 from Qing. An accepted compromise transfers £10,000. Either saves two reports on the next reform commission begun within a year. Edicts and audits have their own terms and costs."
 chi_adm_player_guide.2.d_frontier: "$chi_adm_player_guide.2.d$\n\nConsult #bold $chi_adm_provincial_development_frontier$#! for frontier-specific terms."
 chi_adm_player_guide.2.d: "Loyalty and Autonomy adjust the remittance rate. Corruption affects provincial tax capacity. Visit the #bold $chi_adm_court_register_memorial_desk$#! to request relief, discretion, or wartime aid. Approved relief provides £20,000, or £10,000 if you accept a compromise, and saves two reports on the next reform commission begun within a year. You can fund provincial commissions yourself. High Autonomy by itself does not bar local reforms."
 chi_adm_player_guide_law_button: "How does Qing share laws and technology?"
 chi_adm_player_guide_law_button_desc: "Compare imperial law directives, automatic technology sharing, and local reform progress."
 chi_adm_player_guide.3.t: "How does Qing share laws and technology?"
 chi_adm_player_guide.3.d_court: "Enacting a supported law sends a directive to eligible direct administrations that lack it. Governors respond through #bold $chi_adm_imperial_law_directive$#!. Qing’s monthly coordination shares listed technologies, military-law unlocks, and imperial effects. Governors’ own commissions determine when their local penalties improve. Provincial progress leaves the court’s Mandate and national journal entries independent."
 chi_adm_player_guide.3.d: "Open #bold $chi_adm_imperial_law_directive$#! when Qing sends a supported law. Depending on the case, you can adopt it immediately, implement it over time, or petition for an exemption. Qing’s monthly update shares missing listed technologies, including Rifling and Nationalism, and eligible imperial effects. Your own reform progress determines the local penalties described in the Development briefing. Mongolia and Ili need civil administration to qualify for reform sharing."
 chi_adm_player_guide_integration_button: "How do I annex my subjects?"
 chi_adm_player_guide_integration_button_desc: "Compare an administrative settlement with full integration."
 chi_adm_player_guide.4.t: "How do I annex my subjects?"
 chi_adm_player_guide.4.d_court: "Open #bold $chi_adm_negotiated_integration_court$#! to initiate a commission. Read the preview for honors, subsidies, fiscal terms, and the governor's response. Closer supervision can leave the province in place. Full integration is a separate outcome with consent protections for human governors."
 chi_adm_player_guide.4.d: "The #bold $chi_adm_negotiated_integration_province$#! shows the court's current offer when a commission is open. Compare the terms for tighter supervision with any proposal for full integration. Check which benefits are temporary and whether the settlement keeps your country playable before accepting."
 chi_adm_player_guide_reforms_button: "How do provincial reforms work?"
 chi_adm_player_guide_reforms_button_desc: "Read the five reform paths, their costs, and the projects that can help."
 chi_adm_player_guide.5.t: "How do provincial reforms work?"
 chi_adm_player_guide.5.d_court: "Qing follows its own #bold $je_early_army_modernization$#! and #bold $je_tyr_self_strengthening$#! journals. The national movement runs for 20 years and requires Nationalism, at least 10% program Literacy, and a non-marginal Intelligentsia. Eligible governors progress independently through the five paths below, while Qing continues sharing listed technologies and imperial effects. The court can fund relief through #bold $chi_adm_memorials_memorials$#!.\n\n$chi_adm_player_guide_reform_paths$"
 chi_adm_player_guide.5.d_frontier: "Check #bold $chi_adm_provincial_development_frontier$#! for your status and options. Mongolia and Ili qualify for the five commissions after becoming civil administrations.\n\n$chi_adm_player_guide.5.d$"
 chi_adm_player_guide.5.d: "Open #bold $je_chi_adm_reform_portfolio$#! in The Governor’s Accounts. These commissions lift your province’s inherited penalties even if Qing still suffers them. Qing’s monthly coordination still shares technologies and imperial effects.\n\n$chi_adm_player_guide_reform_paths$\n\nPay the listed appropriation and commit 20 Bureaucracy per commission. Starting a second requires at least 80 free Bureaucracy. Owned Military, Economic, Administrative, and Education projects from #bold $chi_adm_provincial_development_development$#! can meet particular requirements or save two reports at tiers I–II and four at tier III. Relevant active regional works also qualify for the four-report reduction."
 chi_adm_player_guide_reform_paths: "#bold Military Reorganization#! advances through four stages of drill and command using battalions, technology, and training capacity.\n#bold Armaments#! gradually lifts equipment penalties as you develop firearms, artillery, and munitions capacity.\n#bold Administration#! lifts Fragmented Rule in stages as you improve offices and institutions.\n#bold Opium Suppression#! requires any three distinct campaigns from trade restrictions, anti-smuggling, treatment, and enforcement reform.\n#bold Opium Wars Recovery#! uses three commissions to remove the provincial defeat penalty early. The penalty otherwise ends with the imperial defeat window."
 chi_adm_player_guide_regional_button: "Where are the local projects?"
 chi_adm_player_guide_regional_button_desc: "Find regional dispatches, historical works, and company requirements."
 chi_adm_player_guide.6.t: "Where are the local projects?"
 chi_adm_player_guide.6.d_court: "Provincial players can open #bold $chi_adm_regional_works_regional_dispatches$#! for their local opportunities. The sites and their requirements vary by region. Use #bold $chi_adm_provincial_development_court_extension$#! for the separate court decisions concerning provincial and frontier development."
 chi_adm_player_guide.6.d: "Open #bold $chi_adm_regional_works_regional_dispatches$#! and check the local site, buildings, technologies, reform tiers, and funding. Hanyang and Foochow require their historical companies. Establishing a company and completing the regional works have separate requirements. Active Hanyang, Foochow, and Jiangnan works can shorten relevant provincial commissions."
 chi_adm_player_guide_diplomacy_button: "How do I handle foreign pressure?"
 chi_adm_player_guide_diplomacy_button_desc: "Find the Mandate, opium, treaty ports, legations, and emergency powers."
 chi_adm_player_guide.7.t: "How do I handle foreign pressure?"
 chi_adm_player_guide.7.d_court: "Follow #bold $je_mandate_of_heaven$#! for imperial stability. The #bold $je_opium_obsession$#! journal covers the domestic opium crisis. Check foreign peace terms for treaty ports. Ports can open the Chinese Missions and lay the groundwork for foreign concessions. When #bold $je_chi_legation_system$#! opens, consult it for foreign investment privileges and the restrictions it places on nationalization. The #bold $je_boxer_rebellion$#! records the struggle over those powers when it arises."
 chi_adm_player_guide.7.d: "Watch Qing’s peace terms. A treaty port held by a Christian power next to the Qing realm can help open the Chinese Missions. An imperial defeat can also bring the provincial Opium Wars Recovery entry into play. During emergencies, check the military warrant and the terms for returning powers. The Taiping chapter covers local missionary policy and allegiance."
 chi_adm_player_guide_league_button: "What is the contest for the throne?"
 chi_adm_player_guide_league_button_desc: "Learn who can join the League, how Qing uncovers it, and what happens when it escalates."
 chi_adm_player_guide.8.t: "What is the contest for the throne?"
 chi_adm_player_guide.8.d_court: "A Provincial League begins as a hidden conspiracy. Use #bold $chi_adm_court_register_court$#! to check Loyalty, Autonomy, relations, and unrest. Public warnings can show the inquiry option. It becomes usable when there is a prewar case with evidence to uncover. Once evidence reaches 50, the court is notified and Imperial Security opens."
 chi_adm_player_guide_next_claimant: "Next: Who can found a League?"
 chi_adm_player_guide.12.t: "Who can found a League?"
 chi_adm_player_guide.12.d: "An eligible Han governor needs three consecutive monthly reviews with Loyalty at most 20, Autonomy at least 65, and at least 10 Army Power Projection and 20% of Qing’s. The Mandate must be active with Centralisation at most 3. The province also needs poor or worse relations with Qing, a qualifying crisis, or Qing Legitimacy below 50. Founding requires 25 Authority and is subject to the restrictions on the button."
 chi_adm_player_guide_next_inquiry: "Next: When should I investigate?"
 chi_adm_player_guide.13.t: "When should I investigate?"
 chi_adm_player_guide.13.d: "Look for the inquiry in #bold $chi_adm_court_register_court$#! when Qing sees public warnings such as poor relations, serious turmoil, or low Loyalty combined with high Autonomy. It can only be authorized if a prewar League exists and evidence is below 100. It commits 5% Bureaucracy for four months and adds up to 25 evidence. An active League generates evidence each month. Armed members, covert supporters, and corruption among armed members speed it up. Reporting adds 30 evidence. When at least two armed offices allow the League to enter preparation from month six, evidence rises to at least 50."
 chi_adm_player_guide_next_discovery: "Next: What do I do after discovery?"
 chi_adm_player_guide.14.t: "What do I do after discovery?"
 chi_adm_player_guide.14.d: "At 50 evidence the court receives a discovery notice and can read the roster, readiness, and relative army strength in #bold $chi_adm_qing_security_security$#!. Offer terms, pressure the League to slow its preparations, or muster loyalists. At 75 evidence, suppression also requires readiness below 55, League strength below 65% of Qing’s, 75 Authority, and a 5% Bureaucracy surplus. Check the button for the remaining conditions. Exposure also allows eligible foreign powers to offer support."
 chi_adm_player_guide.8.d_frontier: "$chi_adm_player_guide.8.d$\n\nArmed membership and founding require an eligible Han office. Check the journal for the alignments available to your frontier administration."
 chi_adm_player_guide.8.d: "Open #bold $chi_adm_qing_security_provincial_affairs_title$#! in the Governor’s Accounts. It becomes a conspiracy briefing when you can take part or the plot becomes public. Eligible Han offices may found or join the armed League. Depending on eligibility, other governors can covertly aid it, back Qing, report the plot, or stand aside. The claimant may issue an ultimatum once preparations are sufficient and launch a succession play after it expires. Exposure can open foreign intervention through International Situations."
 chi_adm_player_guide_prevent_button: "How can I contain the missions and the Society?"
 chi_adm_player_guide_prevent_button_short: "How can I contain the Society?"
 chi_adm_player_guide_prevent_button_desc: "Compare Qing’s expulsion with provincial missionary policy and local suppression."
 chi_adm_player_guide.9.t: "How can I contain the missions and the Society?"
 chi_adm_player_guide.9.d: "#bold Qing#!\nIn $je_chinese_missions$, #bold $CHI_deport_missionaries_button$#! requires 200 available Authority and no qualifying neighboring Christian treaty port. Expulsion worsens relations with some Christian powers. The journal closes after expulsion if Qing is recognized or has State Atheism, Isolationism, or Closed Borders. Existing converts and Society footholds remain.\n\n#bold Provincial governors#!\nUse #bold $chi_adm_religious_affairs$#! to permit missionary events without a treaty port, regulate missions at an ongoing 5% Bureaucracy cost, or restrict missions at an ongoing 200 Authority cost while Closed Borders is in force and the province has neither a Christian-owned treaty port nor an Opium War defeat penalty. Once the Society has a local foothold, suppression commits 25 Authority for six months, can remove one foothold, and radicalizes some Protestants in the targeted state. Keep neighboring states below 15% Turmoil to block spread into them."
 chi_adm_player_guide_uprising_button: "How does the uprising begin, and whose side can I take?"
 chi_adm_player_guide_uprising_button_short: "How does the uprising begin?"
 chi_adm_player_guide_uprising_button_desc: "Learn how footholds build toward revolt and what each provincial allegiance means."
 chi_adm_player_guide.10.t: "How does the uprising begin, and whose side can I take?"
 chi_adm_player_guide.10.d: "#bold From missionaries to revolt#!\nThe Society can appear in independent Qing’s realm from 1856, or from 1846 after five missionary works. It needs an eligible incorporated Han or Hakka homeland with at least 1% Protestants and more than 15% Turmoil. It can spread into adjacent eligible states at 15% Turmoil. Eight footholds can trigger the uprising. Qing’s capital and human governors’ capitals are protected. AI administrations keep at least one state.\n\n#bold Decide before the war#!\nIn #bold $chi_adm_religious_affairs$#!, tolerate the local Society covertly or spend £10,000 to support its organizers. After taking a covert position, a governor at peace can pledge to Taiping. Eligible pledged governors leave Qing and enter on Taiping’s side when the war begins. Standing aside instead authorizes temporary separation and neutrality, with restoration of the former pact where possible if Qing survives. Withdrawing a commitment leaves the existing Qing pact in force. A pledge changes your province’s allegiance. Taking personal command is a separate choice."
 chi_adm_player_guide_kingdom_button: "Playing the Heavenly Kingdom"
 chi_adm_player_guide_kingdom_button_desc: "Learn how to take command, win the civil war, and pursue the religious settlement."
 chi_adm_player_guide.11.t: "Playing the Heavenly Kingdom"
 chi_adm_player_guide.11.d: "#bold Taking command#!\nQing’s player can choose the Heavenly Kingdom when it rises. If the Kingdom remains AI-controlled and at war with Qing, eligible human governors are invited one at a time. Eligibility can come from losing land to the uprising, having a foothold, covert sympathy, or a Taiping pledge. Accepting switches you to the Heavenly Kingdom and leaves your old province under its existing wartime commitments. Declining lets you continue as governor.\n\n#bold Winning and governing#!\nThe footholds supply the Kingdom’s starting territory. Both sides seek annexation, and Taiping starts with extra War Support. Human takeover grants two years of Resolve. The Heavenly Covenant privileges Catholics and Protestants as the Faithful. After victory, #bold $je_tyr_heavenly_conversion$#! requires Catholics and Protestants to reach 70% combined. Parish schooling and poor relief can spread the faith. Enforced conversion costs lives."

 tyr_heavenly_missions_borders_tt: "You have lost the Opium Wars or do not have [GetLawType('law_closed_borders').GetName]."
 tyr_heavenly_missions_port_tt: "A [concept_treaty_port] held by a Christian country borders one of your states or, for Qing, a state held by one of its administrations."
 tyr_heavenly_missions_market_tt: "If you have [GetLawType('law_isolationism').GetName], there must also be a [concept_treaty_port] in your market."

 chi_adm_religious_affairs: "Provincial Religious Affairs"
 chi_adm_religious_affairs_reason: "The provincial yamen oversees foreign preaching, schools and hospitals. Track where missionaries can operate and where the God Worshipping Society has gained a foothold. Protestant communities and high [concept_turmoil] can give the Society room to spread."
 chi_adm_religious_affairs_status: "#bold Missionary Policy#!\nImperial rules apply. Choose a provincial policy below."
 chi_adm_religious_permit: "Permit Foreign Missions"
 chi_adm_religious_permit_desc: "Authorize Christian missions even under $law_closed_borders$."
 chi_adm_religious_regulate: "Regulate Missionary Activity"
 chi_adm_religious_regulate_desc: "Keep missionary activity under provincial supervision."
 chi_adm_religious_restrict: "Restrict Foreign Missions"
 chi_adm_religious_restrict_desc: "Close the province to foreign missions."
 chi_adm_religious_suppress: "Investigate the God Worshippers"
 chi_adm_religious_suppress_desc: "Send magistrates and trusted examiners to investigate a known God Worshipping Society foothold, question suspected organizers and inspect their correspondence. Commit 25 Authority for six months. The Society may endure despite the inquiry, and harsh scrutiny will radicalize some Protestant residents."
 chi_adm_religious_tolerate: "Tolerate the Society"
 chi_adm_religious_tolerate_desc: "Permit the Society's local congregations to meet without interference, even as their teachings trouble the established religious order. The governor's tolerance is concealed from the Qing court."
 chi_adm_religious_support: "Aid the Society in Secret"
 chi_adm_religious_support_desc: "Through trusted intermediaries, divert 10,000 from the provincial treasury to the Society's organizers. The governor's assistance is concealed from the Qing court, though the risks of discovery remain."
 chi_adm_religious_pledge: "Pledge to the Heavenly Kingdom"
 chi_adm_religious_pledge_desc: "If the God Worshippers rise in arms, cast the provincial administration's fortunes with the Heavenly Kingdom rather than the Dragon Throne. This authorizes a break with Qing when war begins. You remain governor unless you separately choose to lead Taiping yourself."
 chi_adm_religious_neutral: "Withdraw Your Commitment"
 chi_adm_religious_neutral_desc: "Withdraw any pledge to the Heavenly Kingdom and make no fresh commitment. This does not dissolve your existing imperial obligations: the Qing subject pact may still determine whether your troops enter the war."
 chi_adm_religious_relief: "Petition Qing for Relief"
 chi_adm_religious_relief_desc: "Memorialize the Throne for aid with the cost of keeping order amid religious unrest, strained local offices and contested missions. Qing considers the fiscal petition through Imperial Memorials."

 chi_adm_heavenly_takeover_title: "A Summons from the Heavenly Court"
 chi_adm_heavenly_takeover_desc: "The banners of the Heavenly Kingdom have been raised against the Dragon Throne. Its leaders proclaim a new sacred order, and messengers invite you to abandon the provincial seal for command of the rebellion. To remain is to govern from your present yamen as the war unfolds; to depart is to take charge of a kingdom whose triumph is far from certain.\n\nYour former province will continue under its existing wartime commitments if you assume the Heavenly command."
 chi_adm_heavenly_takeover_remain: "My duty remains with this province."
 chi_adm_heavenly_takeover_accept: "I shall lead the Heavenly Kingdom."

 chi_adm_religious_status_restricted: "#bold Foreign Missions Restricted#!\n#r -200#! [concept_authority] while active. Christian missionary events are blocked in the province."
 chi_adm_religious_status_permitted: "#bold Foreign Missions Permitted#!\nEligible states can receive Christian missionary events without a treaty port or open migration laws."
 chi_adm_religious_status_regulated: "#bold Missionary Activity Regulated#!\n#r -5%#! [concept_bureaucracy] while active. Full acceptance of missionary preaching, schools and hospitals is unavailable."

 chi_adm_religious_stand_aside: "Stand Aside from the Civil War"
 chi_adm_religious_stand_aside_desc: "Decline to pledge the province's armies to either claimant and authorize temporary separation from Qing when the war begins. Neutrality does not settle the dynasty's claims; if Qing survives the peace, restore the former imperial pact where possible."
 chi_adm_religious_supervision: "Supervision of Foreign Missions"
 chi_adm_religious_supervision_desc: "Provincial clerks examine missionary registers, inspect schools and preaching stations, and report disputed activity to the yamen."
 chi_adm_religious_overview_stats: "States open to missions  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('chi_adm_religious_open_states')|0]#!\nStates with a Society foothold  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('chi_adm_religious_society_states')|0]#!\nStates at least 1% Protestant  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('chi_adm_religious_protestant_states')|0]#!\nStates with at least 15% [concept_turmoil]  #v [JournalEntry.GetCountry.MakeScope.ScriptValue('chi_adm_religious_turmoil_states')|0]#!"
 chi_adm_religious_map_turmoil_tt: "At least 15% [concept_turmoil]"
 chi_adm_religious_map_protestant_tt: "At least 1% Protestant"
 chi_adm_religious_map_society_tt: "God Worshipping Society foothold"
 chi_adm_religious_map_open_tt: "Open to Christian missions"
 chi_adm_religious_map_heading: "#bold Provincial Religious Affairs#!"
 chi_adm_religious_overview_legend: "#bold Journal Map#!\nBlue shows mission access and green shows a Protestant population of at least 1%. Purple stripes mark the Society and orange stripes mark at least 15% Turmoil. Hover over a state to see every condition it meets."
 chi_adm_religious_overview_heading: "#bold Provincial Survey#!"
 chi_adm_religious_qing_missions_active_tt: "Great Qing has an active $je_chinese_missions$ Journal Entry."
 chi_adm_religious_restriction_desc: "Provincial officials enforce the closure of foreign missions and guard against their return."
 chi_adm_religious_restriction: "Restriction of Foreign Missions"
 chi_adm_religious_no_defeat_tt: "The province has no active Opium War defeat penalty."
 chi_adm_religious_no_port_tt: "No Christian-owned treaty port shares a state region with the province."
 chi_adm_religious_closed_borders_tt: "Has enacted $law_closed_borders$."
 chi_adm_religious_new_policy_tt: "This policy is not already active."
 chi_adm_religious_restrict_effect_tt: "Immediately close all provincial states to missions and stop Christian missionary events. The modifier lasts while the policy is active. The restriction is lifted at the next monthly review if its border, Christian treaty port or Opium War requirements cease to be met."
 chi_adm_religious_regulate_effect_tt: "Ordinary missionary access rules apply. Full acceptance of missionary activity is unavailable."
 chi_adm_religious_preaching_tt: "Accepting missionary preaching converts #v 3%#! of the affected state population to Protestantism."
 chi_adm_religious_schools_tt: "Accepting a missionary school converts #v 1%#! of the affected state population to Protestantism."
 chi_adm_religious_hospitals_tt: "Accepting a missionary hospital converts #v 1%#! of the affected state population to Protestantism."
 chi_adm_religious_limited_preaching_tt: "Limited preaching can convert #v 1%#! of the affected state population to Protestantism. The capital below is used as an example."
 chi_adm_religious_permit_effect_tt: "Eligible states can receive Christian missionary events without a treaty port or more open migration laws. Imperial expulsion, State Atheism and local missionary fear can still block access. The capital below is used as an example. Event modifiers apply to the state chosen by the event."
 chi_adm_religious_inquiry: "Investigation of the Society"
 chi_adm_religious_inquiry_desc: "Magistrates and confidential agents have been assigned to examine the Society's meetings, correspondence and suspected organizers."

 je_chi_adm_reform_portfolio: "Provincial Reform and Modernization"
 je_chi_adm_reform_portfolio_reason: "Review the work of the provincial commands, arsenals and yamens. Each program has its own appropriation and timetable. Completed Self-Strengthening works can shorten the relevant commissions. The relief memorial in the Memorial Desk can help finance them."
 chi_adm_reform_closed: "The circumstances that called for this program have passed."
 chi_adm_reform_finished: "The provincial program has lifted the remaining penalty."
 chi_adm_reform_work: "Commission underway"

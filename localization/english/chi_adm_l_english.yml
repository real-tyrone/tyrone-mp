 chi_adm_qing_security_dossier_summary: "[Country.GetCustom('chi_adm_qing_security_phase_loc')]\nReadiness #v [Country.MakeScope.ScriptValue('chi_adm_qing_security_display_readiness')|0]/100#! · Evidence #v [Country.MakeScope.ScriptValue('chi_adm_qing_security_display_evidence')|0]/100#!\nMonths of preparation #v [Country.MakeScope.ScriptValue('chi_adm_qing_security_display_months')|0]#! · Relative strength #v [Country.MakeScope.ScriptValue('chi_adm_qing_security_display_ratio')|0]%#!\n[Country.GetCustom('chi_adm_qing_security_court_loc')]"
 chi_adm_qing_security_readiness_tooltip: "Self-Strengthening reforms, regional recruitment, autonomy, low loyalty and covert aid improve preparation. Corruption, loyalist pledges and court mobilization slow it. If conditions for revolt lapse for three monthly reviews, the network disperses."
 chi_adm_qing_security_evidence_tooltip: "Recruits, official inquiries and betrayed correspondence expose the League. At #v 50#! evidence the court and foreign observers learn of it. At #v 75#! the court can suppress a weak network."
 chi_adm_qing_security_phase_play: "The throne is contested in a diplomatic play or war."
 chi_adm_qing_security_phase_ultimatum: "The League’s ultimatum is in effect."
 chi_adm_qing_security_phase_deadline: "The ultimatum has expired. The claimant may call the League to arms."
 chi_adm_qing_security_phase_preparation: "The League counts its troops and prepares a memorial of demands."
 chi_adm_qing_security_phase_recruitment: "Envoys seek the pledges of neighboring governors and their commanders."
 chi_adm_qing_security_phase_organization: "Secretaries exchange sealed letters for a clandestine provincial league."
 chi_adm_qing_security_phase_quiet: "No treasonous correspondence has reached the court."
 chi_adm_qing_security_faction_claimant: "Provincial League claimant"
 chi_adm_qing_security_faction_armed: "Provincial League · armed"
 chi_adm_qing_security_faction_covert: "Provincial League · covert aid"
 chi_adm_qing_security_faction_loyal: "Imperial loyalist"
 chi_adm_qing_security_faction_imperial_court: "Imperial court"
 chi_adm_qing_security_faction_neutral: "Neutral"
 chi_adm_qing_security_faction_unpledged: "No pledge"
 chi_adm_qing_security_faction_unconfirmed: "Awaiting the governor’s confirmation"
 chi_adm_qing_security_terms_open: "The court’s terms are open. The claimant may accept an accord, and individual supporters may seek a pardon."
 chi_adm_qing_security_settlement_open: "The court may proclaim a general amnesty or restore provincial oversight."
 chi_adm_qing_security_result_dynasty: "The House of Liu holds the imperial throne."
 chi_adm_qing_security_result_court: "The Qing court retained the throne."
 chi_adm_qing_security_result_accord: "The imperial accord dissolved the League."
 chi_adm_qing_security_result_suppression: "The court has dispersed the conspirators and seized their correspondence."
 chi_adm_qing_security_result_dispersal: "The secret league has scattered before its demands could reach the Throne."
 chi_adm_qing_security_result_white_peace: "The contest ended without enforcing either claim to the throne."
 chi_adm_qing_security_response_play: "The war goals determine who holds the throne and how the provincial offices are restored."
 chi_adm_qing_security_response_muster: "The court is preparing the loyalist armies."
 chi_adm_qing_security_response_pressure: "The court is applying pressure to disaffected offices."
 chi_adm_qing_security_response_inquiry: "Imperial investigators are reviewing provincial correspondence."
 chi_adm_qing_security_response_none: "The court has issued no active response."
 chi_adm_qing_security.1.t: "Letters Seized on the Provincial Roads"
 chi_adm_qing_security.1.d: "Reports laid before the Grand Council point to an agreement among provincial officials to challenge the Throne. The council has ordered the evidence entered in the Imperial Security register and awaits the court’s instructions."
 chi_adm_qing_security.1.a: "Place the letters before the Grand Council."
 chi_adm_qing_security.2.t: "An Ultimatum Sealed by the Provincial League"
 chi_adm_qing_security.2.d: "The governors of the Provincial League have sent their terms to the capital, giving the court two months to answer. Their memorial professes to restore good government, but behind its deferential phrases stand armed provinces ready to test the Mandate of Heaven."
 chi_adm_qing_security.2.a: "Let the ministers deliberate upon the ultimatum."
 chi_adm_qing_security.4.t: "The Mandate and the Imperial Seal"
 chi_adm_qing_security.4.d_dynasty: "The House of Liu has secured the imperial seal, and its proclamations now issue in the name of a new dynasty. The provincial allies who made its victory possible expect honors and safeguards for their offices; the court must restore the authority of the Mandate without alienating them."
 chi_adm_qing_security.4.d_court: "The Dragon Throne remains in Qing hands. The defeated league has laid down its arms, but the ministers are divided: should the rebellious governors be offered an amnesty, or returned to obedience under stricter imperial supervision?"
 chi_adm_qing_security.4.a: "Issue the imperial proclamation."
 chi_adm_qing_security_restored_empire: "Chinese Empire"
 chi_adm_qing_security_dynasty_name: "Liu"
 chi_adm_qing_security_founder_name: "Wenxiu"
 chi_adm_qing_security_heir_name: "Jingyuan"
 dp_chi_adm_qing_security_throne: "Contest for the Dragon Throne"
 dp_chi_adm_qing_security_throne_tooltip: "Contest the succession to the Chinese imperial throne."
 chi_adm_qing_security_restore_court: "Uphold the Qing Dynasty"
 chi_adm_qing_security_restore_court_desc: "Preserve the Qing dynasty and restore imperial authority over the rebel administrations."
 chi_adm_qing_security_install_dynasty: "Depose the Qing Dynasty"
 chi_adm_qing_security_install_dynasty_desc: "Replace the Qing ruler and heir with the House of Liu and settle the provincial claims under a new imperial court."
 chi_adm_qing_security_organization: "Provincial Correspondence"
 chi_adm_qing_security_organization_desc: "Clerks, messengers and sympathetic commanders are secretly gathering the provincial league’s strength."
 chi_adm_qing_security_inquiry: "Imperial Inquiry"
 chi_adm_qing_security_inquiry_desc: "Censorate agents and court secretaries compare intercepted letters and provincial registers for evidence of sedition."
 chi_adm_qing_security_concession: "Imperial Terms"
 chi_adm_qing_security_concession_desc: "Imperial commissioners bear sealed proposals to disaffected governors in an effort to preserve the peace."
 chi_adm_qing_security_repression: "Pressure on the Provinces"
 chi_adm_qing_security_repression_desc: "Court agents scrutinize the offices and acquaintances of governors suspected of disloyalty."
 chi_adm_qing_security_suppression: "Suppression of the Provincial League"
 chi_adm_qing_security_suppression_desc: "Imperial officials and loyal commanders are charged with breaking the league before its secret correspondence becomes open revolt."
 chi_adm_qing_security_loyalist_muster: "Loyalist Mobilization"
 chi_adm_qing_security_loyalist_muster_desc: "Regiments loyal to the Emperor are ordered to assemble, provision their magazines and defend the capital."
 chi_adm_qing_security_new_court: "The New Court"
 chi_adm_qing_security_new_court_desc: "The victorious dynasty must convert military triumph into accepted government, reconciling the provinces with a new imperial household."
 chi_adm_qing_security_foreign_mission: "Diplomatic Mission to China"
 chi_adm_qing_security_foreign_mission_desc: "Foreign envoys weigh the fate of China's imperial seal against their own commercial and strategic interests. Their dispatches seek influence over a conflict whose victor may reshape relations with the empire."
 chi_adm_qing_security_foreign_claimant: "Foreign Backing for the League"
 chi_adm_qing_security_foreign_claimant_desc: "A foreign mission has chosen to encourage the Provincial League, hoping that a new court will remember the assistance offered in its hour of need."
 chi_adm_qing_security_foreign_court: "Foreign Backing for the Court"
 chi_adm_qing_security_foreign_court_desc: "A foreign mission has affirmed its confidence in the Qing court, lending diplomatic weight to the dynasty against those who contest the Mandate."
 war_goal_chi_adm_qing_security_restore_court: "Uphold the Qing Dynasty"
 war_goal_chi_adm_qing_security_restore_court_type_name: "Uphold the Qing Dynasty"
 war_goal_chi_adm_qing_security_restore_court_type_desc: "Preserve the Qing dynasty and restore imperial authority over the rebel administrations."
 war_goal_chi_adm_qing_security_restore_court_desc: "Preserve the Qing dynasty and restore imperial authority over the rebel administrations."
 war_goal_chi_adm_qing_security_install_dynasty: "Depose the Qing Dynasty"
 war_goal_chi_adm_qing_security_install_dynasty_type_name: "Depose the Qing Dynasty"
 war_goal_chi_adm_qing_security_install_dynasty_type_desc: "Replace the Qing ruler and heir with the House of Liu and settle the provincial claims under a new imperial court."
 war_goal_chi_adm_qing_security_install_dynasty_desc: "Replace the Qing ruler and heir with the House of Liu and settle the provincial claims under a new imperial court."
 chi_adm_qing_security_found_button: "Found the Provincial League"
 chi_adm_qing_security_found_button_desc: "Open a clandestine network. Commits #v 25#! Authority for six months."
 chi_adm_qing_security_claimant_office_req: "Govern an eligible Han provincial administration."
 chi_adm_qing_security_claimant_loyalty_req: "Loyalty is #v 20#! or lower."
 chi_adm_qing_security_claimant_autonomy_req: "Autonomy is at least #v 65#!."
 chi_adm_qing_security_claimant_army_req: "Army Power Projection is at least #v 10#! and at least #v 20%#! of Qing’s."
 chi_adm_qing_security_claimant_mandate_req: "Qing’s Mandate of Heaven is active and Centralisation is #v 3#! or lower."
 chi_adm_qing_security_claimant_strain_req: "Relations with Qing are Poor or worse, a provincial or imperial crisis is active, or Qing’s Legitimacy is below #v 50#!."
 chi_adm_qing_security_found_free_req: "Your administration is free to pledge: no war, commitment to a diplomatic play, truce with Qing, or ongoing provincial proceedings."
 chi_adm_qing_security_found_reviews_req: "Meet the claimant conditions for #v 3#! consecutive monthly reviews."
 chi_adm_qing_security_found_court_req: "No rival league is active, no ban on founding a league is in force, and Qing has no ongoing provincial enforcement."
 chi_adm_qing_security_arm_button: "Pledge troops to the League"
 chi_adm_qing_security_arm_button_desc: "Join the claimant’s side. Costs #v 25#! Authority for six months. This authorizes a temporary break with the court at the uprising and restoration of the existing imperial relationship afterward."
 chi_adm_qing_security_aid_button: "Send covert aid"
 chi_adm_qing_security_aid_button_desc: "Contribute #v +1#! monthly preparation and #v +1#! monthly evidence. Costs #v 25#! Authority for six months. Covert aid does not commit forces to the uprising."
 chi_adm_qing_security_loyal_button: "Pledge troops to the court"
 chi_adm_qing_security_loyal_button_desc: "Commit forces to the imperial side if the uprising begins. While preparations continue, imperial loyalists slow them and reduce the claimant’s relative strength."
 chi_adm_qing_security_report_button: "Turn over the correspondence"
 chi_adm_qing_security_report_button_desc: "Betray the League to the court once per plot. Become an imperial loyalist, gain #v 5#! Loyalty, add #v 30#! evidence and remove up to #v 20#! readiness."
 chi_adm_qing_security_neutral_button: "Withdraw or declare neutrality"
 chi_adm_qing_security_neutral_button_desc: "Withdraw any pledge. Leaving the League costs it #v 8#! readiness. Neutral governors have no scripted military commitment."
 chi_adm_qing_security_issue_button: "Issue the ultimatum"
 chi_adm_qing_security_issue_button_desc: "Give the court two months to answer. Requires twelve months of preparation, #v 75#! readiness, two armed governors and #v 65%#! of imperial and pledged loyalist army strength."
 chi_adm_qing_security_launch_button: "Raise the Provincial League"
 chi_adm_qing_security_launch_button_desc: "Start the contest for the throne once the ultimatum expires and the coalition still meets its political, numerical and military requirements. Your government remains playable throughout."
 chi_adm_qing_security_dissolve_button: "Dissolve the network"
 chi_adm_qing_security_dissolve_button_desc: "End the conspiracy and close the contest for five years."
 chi_adm_qing_security_accept_button: "Accept the court’s terms"
 chi_adm_qing_security_accept_button_desc: "End the conspiracy. The claimant and the League’s supporters gain #v 12#! Loyalty, #v 5#! Autonomy and improved relations with the court."
 chi_adm_qing_security_pardon_button: "Petition for an individual pardon"
 chi_adm_qing_security_pardon_button_desc: "Accept the court’s published terms for your province. Withdraw from the League and gain #v 12#! Loyalty, #v 5#! Autonomy and improved relations with the court."
 chi_adm_qing_security_investigate_button: "Authorize a Discreet Inquiry"
 chi_adm_qing_security_investigate_button_desc: "Commit #v 5%#! Bureaucracy for four months to review provincial correspondence. An inquiry is warranted by poor relations, at least #v 40%#! local Turmoil, or a province with Loyalty at most #v 45#! and Autonomy at least #v 45#!. An inquiry adds up to #v 25#! evidence to an active prewar case. The court identifies the League at #v 50#! evidence."
 chi_adm_qing_security_arm_eligibility: "An eligible Han governor needs Loyalty of 45 or less, Autonomy of at least 45, Power Projection of at least 5, and 25 Authority. You must be free to pledge, able to revise your stance, and on better than Hostile terms with the claimant."
 chi_adm_qing_security_aid_eligibility: "Covert aid requires Loyalty of 55 or less, Autonomy of at least 35, and 25 Authority. You must be able to revise your stance and cannot already be providing covert aid."
 chi_adm_qing_security_loyal_eligibility: "Be free to pledge to the court and able to revise or confirm your stance."
 chi_adm_qing_security_report_eligibility: "Be free to pledge to the court. You can report the League once per contest."
 chi_adm_qing_security_neutral_eligibility: "Hold an eligible office and have a stance other than neutrality."
 chi_adm_qing_security_issue_eligibility: "The claimant must still qualify and be free to pledge. Both courts must be free of war or committed diplomatic plays, with no active Qing enforcement or imminent Qing civil war. The League needs 12 months of preparation, 75 readiness, two armed governors, and 65% relative strength."
 chi_adm_qing_security_launch_eligibility: "The ultimatum must have expired. The claimant must still qualify for the ultimatum and hold a valid armed pledge."
 chi_adm_qing_security_dissolve_eligibility: "Still hold an eligible provincial office."
 chi_adm_qing_security_accept_eligibility: "Hold an eligible office as claimant. The League must be exposed and the court’s offer must still be open."
 chi_adm_qing_security_pardon_eligibility: "Hold an eligible provincial office and have yet to accept a pardon in this contest."
 chi_adm_qing_security_foreign_claimant_eligibility: "Have 100 Influence, be at peace, and have made no prior intervention. Relations with Qing must be below Amicable, and no envoy may already be backing the claimant."
 chi_adm_qing_security_foreign_court_eligibility: "Have 100 Influence, be at peace, and have made no prior intervention. Relations with Qing must be above Hostile, and no foreign commission may already be backing the court."
 chi_adm_qing_security_return_eligibility: "The throne contest must be over. Neither side may be subordinate, at war with the other, or opposed in a diplomatic play, and the Qing court must still be valid."
 chi_adm_qing_security_decline_return_eligibility: "The throne contest must be over, with no war or opposing diplomatic play against Qing."
 chi_adm_qing_security_inquiry_requirement: "A prewar case has room for more evidence. The court has at least #v 5%#! spare Bureaucracy and no inquiry is underway."
 chi_adm_qing_security_offer_requirement: "The court has at least #v 50#! Authority and has yet to offer terms in this contest."
 chi_adm_qing_security_muster_requirement: "The court has at least #v 50#! Authority and has no active loyalist muster."
 chi_adm_qing_security_suppress_requirement: "The court has at least #v 75#! Authority and #v 5%#! spare Bureaucracy. Evidence is at least #v 75#!, readiness is below #v 55#!, and relative strength is below #v 65%#!. The claimant still holds a provincial office and no provincial enforcement is underway."
 chi_adm_qing_security_offer_button: "Propose an imperial accord"
 chi_adm_qing_security_offer_button_desc: "Commit #v 50#! Authority for twelve months. The claimant has four months to accept pardons and wider provincial discretion, and supporters can apply for individual pardons."
 chi_adm_qing_security_pressure_button: "Pressure disaffected offices"
 chi_adm_qing_security_pressure_button_desc: "Spend #v 50#! Authority for eight months. Add #v 15#! evidence and remove #v 10#! readiness. Administrations with at most #v 55#! Loyalty lose another #v 5#! Loyalty."
 chi_adm_qing_security_muster_button: "Prepare the loyalist armies"
 chi_adm_qing_security_muster_button_desc: "Commit #v 50#! Authority for twelve months, improve the court’s mobilization and slow the League’s preparation by #v 2#! each review. Governors choose their own military commitments."
 chi_adm_qing_security_suppress_button: "Break up the exposed network"
 chi_adm_qing_security_suppress_button_desc: "Strike when evidence reaches #v 75#!, readiness is below #v 55#! and strength is below #v 65%#!. Spend #v 75#! Authority and #v 5%#! Bureaucracy for a year. Repression reduces Loyalty at disaffected offices."
 chi_adm_qing_security_amnesty_button: "Proclaim a general amnesty"
 chi_adm_qing_security_amnesty_button_desc: "Give pardoned rebels #v 15#! Loyalty and improve relations. Costs #v 50#! Authority for twelve months."
 chi_adm_qing_security_centralize_button: "Put the rebels under supervision"
 chi_adm_qing_security_centralize_button_desc: "Gain #v 1#! Mandate Centralisation. Defeated rebel offices lose #v 10#! Autonomy and #v 8#! Loyalty and face two years of imperial supervision."
 chi_adm_qing_security_foreign_claimant_button: "Sound out the Provincial League"
 chi_adm_qing_security_foreign_claimant_button_desc: "Spend #v 100#! Influence for a year. The League gains #v 2#! readiness per review during preparation, or #v 5#! immediately during the ultimatum. The mission does not commit your armies."
 chi_adm_qing_security_foreign_court_button: "Back the imperial court"
 chi_adm_qing_security_foreign_court_button_desc: "Spend #v 100#! Influence for a year. The League loses #v 1#! preparation per review, or #v 5#! immediately during the ultimatum. Relations with the court improve. The mission does not commit your armies."
 chi_adm_qing_security_confirm_button: "Confirm the claimant’s pledge"

 chi_adm_memorials_desk_display: "Memorials require 25 provincial [concept_authority] for six months and a two-year filing cooldown. One petition may be pending at a time. Replies arrive in Provincial Correspondence. Frontier memorials preserve customary arrangements."
 chi_adm_memorials_memorials: "Imperial Memorials"
 chi_adm_memorials_memorials_reason: "From the farthest county yamen to the Dragon Throne, memorials carry reports of shortages, disturbances and provincial grievances. The Grand Council may grant a petition, offer reduced terms or refuse the governor’s request; every settlement is entered in the imperial registers."
 chi_adm_memorials_memorials_status: "Review provincial memorials and issue a court reply."
 chi_adm_memorials_edicts: "Imperial Edicts"
 chi_adm_memorials_edicts_reason: "Decrees sent beneath the imperial seal may summon officials to stricter supervision, reward faithful service or authorize aid in time of war. The provincial governors may accept, appeal, request a reprieve or openly decline the court’s instructions."
 chi_adm_memorials_edicts_status: "Select an administration to issue or review an edict."
 chi_adm_memorials_audits: "Imperial Audits"
 chi_adm_memorials_audits_reason: "The Censorate is charged with examining dishonest accounts and officials who have forgotten the Emperor’s trust. An open ledger may clear a governor’s name; obstructed inquiries and concealed patronage can leave stains upon an administration long after the inspectors depart."
 chi_adm_memorials_audits_status: "Select an administration to open or review an audit."
 chi_adm_memorials_responses: "Provincial Correspondence"
 chi_adm_memorials_responses_reason: "Court couriers and Censorate inspectors bring matters that cannot be settled by a clerk’s silence. The governor must answer for provincial revenues, official conduct and the obligations of the imperial seal."
 chi_adm_memorials_responses_status: "Review the current correspondence and available actions."
 chi_adm_memorials_closed: "This correspondence is closed because the administration is no longer in imperial service."
 chi_adm_memorials_req: "An eligible Qing administration or a valid Qing court"
 chi_adm_memorials_court_notice: "A Sealed Memorial Before the Grand Council"
 chi_adm_memorials_court_notice_desc: "A dispatch bearing the seal of [SCOPE.sCountry('chi_adm_memorials_province').GetName] has reached the capital. Its particulars have been entered into the memorial registers. Open Governance of the Empire to review the pending petition, edict or Censorate inquiry and the obligations it carries."
 chi_adm_memorials_province_notice: "A Dispatch from the Dragon Throne"
 chi_adm_memorials_province_notice_desc: "An imperial courier has arrived at the provincial yamen. The governor must consider the court’s instructions and any inquiry brought by the Censorate.\n\n#bold Edict#!: [ROOT.GetCountry.GetCustom('chi_adm_memorials_edict_name')]\n#bold Censorate#!: [ROOT.GetCountry.GetCustom('chi_adm_memorials_audit_stage')]"

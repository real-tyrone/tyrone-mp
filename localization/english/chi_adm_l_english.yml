 je_chi_adm_reform_opium: "Provincial Opium Suppression"
 je_chi_adm_reform_opium_reason: "The opium trade finances brokers and officials as readily as it impoverishes households. The yamen can restrict the trade, pursue smugglers, fund treatment or investigate the officials who protect it. Three distinct campaigns are required."
 je_chi_adm_reform_opium_progress: "[JournalEntry.GetCountry.MakeScope.Var('chi_adm_reform_opium_done').GetValue|0] / 3 milestones completed"
 je_chi_adm_reform_opium_stage_0: "#tooltippable #tooltip:chi_adm_reform_opium_penalty_details_0 Opium addiction#!#!: $chi_adm_reform_opium_penalty_summary_0$\nFinish an unused campaign to leave two thirds of the original penalty."

 chi_adm_memorials_audit_chances: "#bold Discovery risk#!\nHigh @chi_adm_corruption![Nbsp][concept_chi_adm_corruption], cooperation and prior suspicion increase discovery. High @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty], concealment and wartime disruption reduce it; a [concept_bureaucracy] deficit increases it.\n\nDetection weight: #v 50#! versus #v 50#! for no finding.\n- @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] 60+: #v +60#!; below 20: #v -40#!.\n- @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] 60+: #v -20#!.\n- Cooperation: #v +20#!; concealment: #v -30#!.\n- Prior suspicion: #v +40#!.\n- War: #v -10#!; [concept_bureaucracy] deficit: #v +10#!.\nDetection weight stays between #v 10#! and #v 150#!."

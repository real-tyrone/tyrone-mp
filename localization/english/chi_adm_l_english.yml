 chi_adm_reform_admin_1: "Revise Provincial Registers"
 chi_adm_reform_admin_1_desc: "#bold When commissioned#!\nSpend @money!#v 10,000#! and commit #v 20#! Bureaucracy for up to #v 12#! monthly reports. Landowners approval falls by #r 1#! for a year if they are not already resisting.\n\n#bold On completion#!\nThe remaining effects are $chi_adm_reform_admin_penalty_summary_1$ Reduce Corruption by 5 and raise Autonomy by 1. Staff return the 20 Bureaucracy.\n\n$chi_adm_reform_report_discounts_tt$"
 chi_adm_reform_admin_2: "Reorganize the Yamen"

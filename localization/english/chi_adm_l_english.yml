 chi_adm_provincial_development_development: "Provincial Self-Strengthening"
 chi_adm_provincial_development_embrace_self_strengthening: "Embrace the Self-Strengthening Movement"
 chi_adm_provincial_development_embrace_self_strengthening_desc: "Proclaim that useful foreign techniques may strengthen the dynasty’s defenses and prosperity, and establish the $movement_tyr_self_strengthening$ in your country."

 chi_adm_provincial_development_development_reason: "The dynasty may acquire Western machinery without surrendering its institutions: drillmasters, foundries, schools and provincial yamen all have their place in the Self-Strengthening enterprise. Military reforms improve the province’s armies according to the highest tier held by its states; other completed works improve the states where they were undertaken."

 chi_adm_provincial_development_frontier: "Customary Administration and the Imperial Court"

 chi_adm_provincial_development_frontier_reason: "The empire’s frontier is held by more than decrees: banner privileges, garrison obligations, religious estates and local compacts all require the court’s attention. Review negotiated customs, civil reorganization and disputes over exceptional provincial powers."

 chi_adm_provincial_development_court_extension: "Frontier and Provincial Affairs"

 chi_adm_provincial_development_court_extension_reason: "The Grand Council oversees emergency warrants, the expense of provincial works and the gradual reform of frontier institutions. Open an administration’s register to examine its requests and negotiate protections for custom, recruitment, revenues or local dignitaries; no compact is binding without the governor’s answer."
 chi_adm_provincial_development_court_row_status: "[Country.GetCustom('chi_adm_provincial_development_emergency_status')]\n[Country.GetCustom('chi_adm_provincial_development_conversion_status')]"
 chi_adm_provincial_development_compact_offer_customs_tt: "Send a proposal to protect local customs. If the governor accepts, the province gains #g +3#! [concept_chi_adm_loyalty] and #v +2#! [concept_chi_adm_autonomy], and the following state modifiers apply:"
 chi_adm_provincial_development_compact_offer_recruit_tt: "Send a proposal for closer military cooperation. If accepted, provincial [concept_chi_adm_autonomy] falls by #v 3#! and [concept_chi_adm_loyalty] falls by #r 2#!."
 chi_adm_provincial_development_compact_offer_fiscal_tt: "Send a proposal for tighter administrative oversight. If accepted, provincial [concept_chi_adm_autonomy] and [concept_chi_adm_corruption] each fall by #v 3#!, and [concept_chi_adm_loyalty] falls by #r 2#!."
 chi_adm_provincial_development_compact_offer_honor_tt: "Send a proposal to recognize regional elites. If accepted, the province gains #g +5#! [concept_chi_adm_loyalty] and #v +2#! [concept_chi_adm_autonomy]."
 chi_adm_provincial_development_compact_refuse_compact_tt: "Close the review and keep the current compact. A new review is blocked for #v 24 months#!."
 chi_adm_provincial_development_compact_later_tt: "Dismiss this event and leave the compact review pending. No proposal is sent."
 chi_adm_provincial_development_review_compact_tt: "Open a regional compact review and choose one proposal to send to the governor.\n\n#bold Available proposals#!\n• Protect local customs and grant the region a two-year modifier.\n• Ask for closer military cooperation or stronger fiscal oversight.\n• Recognize local elites and preserve more provincial discretion.\n\nOpening the review changes no laws or provincial obligations. The governor must accept the proposal before it takes effect."


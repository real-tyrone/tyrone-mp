 chi_adm_negotiated_integration_event_1_t: "A Province Before the Throne"
 chi_adm_negotiated_integration_event_1_d: "The court proposes direct administration of [ROOT.GetCountry.GetName]. Acceptance begins census and registration. The governor may request concessions, offer closer centralization or refuse. Existing provincial laws and frontier customs remain intact until annexation."
 chi_adm_negotiated_integration_event_1_f: "The imperial seal rests beside the provincial registers. Neither seal alone settles the terms."
 chi_adm_negotiated_integration_event_2_t: "Memorial on Direct Administration"
 chi_adm_negotiated_integration_event_2_d: "[SCOPE.sCountry('chi_adm_negotiated_integration_target').GetName] has answered the court. Review its response and existing terms in Qing Imperial Administrations. Concessions are offered individually; silence grants no consent."
 chi_adm_negotiated_integration_event_2_f: "The Grand Council reads the governor's memorial before advising the throne."
 chi_adm_negotiated_integration_event_3_t: "The Final Provincial Seal"
 chi_adm_negotiated_integration_event_3_d: "Census and transition are complete. Confirming now explicitly authorizes peaceful annexation of your country by Qing. Withholding confirmation preserves your country; Qing may keep talks open or declare breach."
 chi_adm_negotiated_integration_event_3_f: "The last register awaits the governor's seal."
 chi_adm_negotiated_integration_event_4_t: "A Pause in the Registers"
 chi_adm_negotiated_integration_event_4_d: "Qing requests suspension. Agreement preserves elapsed time, stops subsidies and releases administrative resources. Refusal leaves Qing free to continue or suspend in breach."
 chi_adm_negotiated_integration_event_4_f: "The commissioners ask whether their desks may be closed for a season."
 chi_adm_negotiated_integration_event_5_t: "The Court Has Broken Its Terms"
 chi_adm_negotiated_integration_event_5_d: "Qing revoked agreed concessions or suspended work without agreement. Maintain consent or withdraw without a repayment claim against you."
 chi_adm_negotiated_integration_event_5_f: "A promise beneath the imperial seal remains a promise."
 chi_adm_negotiated_integration_event_6_t: "Accounts After Cancellation"
 chi_adm_negotiated_integration_event_6_d: "Qing seeks temporary automatic repayment. Provincial breach permits 10% of provincial income for twelve months; mutual cancellation permits 5% for six months. Accept, counter with partial repayment or refuse. No payment starts without agreement."
 chi_adm_negotiated_integration_event_6_f: "The accounts record assistance; the two seals decide its settlement."
 chi_adm_negotiated_integration_event_7_t: "Shall the Commission Be Recalled?"
 chi_adm_negotiated_integration_event_7_d: "Qing proposes ending integration by agreement. Acceptance ends work and future subsidies. Past assistance may be discussed in a partial repayment settlement. Declining keeps the agreement in force."
 chi_adm_negotiated_integration_event_7_f: "The commissioners await instructions before packing their registers."
 chi_adm_negotiated_integration_subsidy: "Provincial Integration Subsidy"
 chi_adm_negotiated_integration_subsidy_desc: "Automatic weekly assistance from Qing, equal to 10% of provincial income, during active agreed integration."
 chi_adm_negotiated_integration_subsidy_pact_desc: "Automatic weekly assistance from Qing, equal to 10% of provincial income, during active agreed integration."
 chi_adm_negotiated_integration_subsidy_action_name: "Provincial Integration Subsidy"
 chi_adm_negotiated_integration_subsidy_action_break_name: "End Provincial Integration Subsidy"
 chi_adm_negotiated_integration_subsidy_strong: "Enhanced Integration Subsidy"
 chi_adm_negotiated_integration_subsidy_strong_desc: "Automatic weekly assistance from Qing, equal to 20% of provincial income, during active agreed integration."
 chi_adm_negotiated_integration_subsidy_strong_pact_desc: "Automatic weekly assistance from Qing, equal to 20% of provincial income, during active agreed integration."
 chi_adm_negotiated_integration_subsidy_strong_action_name: "Enhanced Integration Subsidy"
 chi_adm_negotiated_integration_subsidy_strong_action_break_name: "End Enhanced Integration Subsidy"
 chi_adm_negotiated_integration_repayment: "Integration Repayment"
 chi_adm_negotiated_integration_repayment_desc: "An agreed temporary automatic payment to Qing, equal to 10% of provincial income."
 chi_adm_negotiated_integration_repayment_pact_desc: "An agreed temporary automatic payment to Qing, equal to 10% of provincial income."
 chi_adm_negotiated_integration_repayment_action_name: "Integration Repayment"
 chi_adm_negotiated_integration_repayment_action_break_name: "End Integration Repayment"
 chi_adm_negotiated_integration_repayment_half: "Negotiated Partial Repayment"
 chi_adm_negotiated_integration_repayment_half_desc: "An agreed temporary automatic payment to Qing, equal to 5% of provincial income."
 chi_adm_negotiated_integration_repayment_half_pact_desc: "An agreed temporary automatic payment to Qing, equal to 5% of provincial income."
 chi_adm_negotiated_integration_repayment_half_action_name: "Negotiated Partial Repayment"
 chi_adm_negotiated_integration_repayment_half_action_break_name: "End Negotiated Partial Repayment"
 chi_adm_negotiated_integration_commitment: "Administrative Integration Commissions"
 chi_adm_negotiated_integration_commitment_desc: "Each active commission commits court Authority and Bureaucracy. Suspended commissions release their commitments."
 chi_adm_negotiated_integration_honored: "Recognition by the Dragon Throne"
 chi_adm_negotiated_integration_honored_desc: "An imperial decree publicly records the governor’s loyal service and his place among the men honored by the Throne."
 chi_adm_negotiated_integration_local_privileges: "Negotiated Provincial Tax Privileges"
 chi_adm_negotiated_integration_local_privileges_desc: "Local fiscal privileges survive negotiated annexation and fade monthly over five years, then expire."
 chi_adm_negotiated_integration_annexation: "Enforce Direct Administration"
 war_goal_chi_adm_negotiated_integration_annexation_type_name: "Enforce Direct Administration"
 war_goal_chi_adm_negotiated_integration_annexation_type_desc: "Annex an imperial administration into the central government's territory."
 war_goal_chi_adm_negotiated_integration_annexation: "Annex [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_chi_adm_negotiated_integration_annexation_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] annexes the [concept_country] of [WAR_GOAL_DRAFT.GetTarget.GetName]."
 war_goal_chi_adm_negotiated_integration_annexation_sway_desc: "Offer [WAR_GOAL_DRAFT.GetHolder.GetName] the annexation of [WAR_GOAL_DRAFT.GetTarget.GetName] in exchange for joining this side of the [concept_diplomatic_play]."
 chi_adm_negotiated_integration_annexation_desc: "Annex the administration through a contested settlement at one quarter of normal annexation Infamy."
 chi_adm_negotiated_integration_annexation_action_name: "Enforce Direct Administration"
 chi_adm_negotiated_integration_annexation_action_name_desc: "Demand the administration's annexation into Qing."
 chi_adm_negotiated_integration_court: "Administrative Integration"
 chi_adm_negotiated_integration_court_reason: "A province cannot be brought fully beneath the Throne by decree alone. Commissioners must secure the governor’s seals, examine the census and land registers, and transfer the workings of the yamen to central authority. Follow each agreement from proposal to final incorporation."
 chi_adm_negotiated_integration_court_closed: "This administrative register has closed."
 chi_adm_negotiated_integration_province: "The Provincial Integration Commission"
 chi_adm_negotiated_integration_province_reason: "The imperial commissioner has come to settle the future of the provincial seal. The governor may bargain for fiscal privileges and honors, oversee the census and transition, or withhold consent; a proposal alone neither changes the law nor transfers the province."
 chi_adm_negotiated_integration_province_closed: "This administrative register has closed."
 chi_adm_negotiated_integration_proposal_gate: "Requires an eligible direct [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFlag] administration, Autonomy at most 25, one valid integration route and no pending case or cooldown. Qing needs nonnegative Authority and Bureaucracy. Both countries must be at peace and outside committed diplomatic plays."
 chi_adm_negotiated_integration_overview: "Each active commission costs @aut![Nbsp]#v 10%#! [concept_authority] and @bur![Nbsp]#v 10%#! [concept_bureaucracy]. Six months plus three per additional active commission. Negotiations and agreed suspensions do not count; elapsed time is preserved."
 chi_adm_negotiated_integration_accounts: "@chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]: #v [Country.MakeScope.Var('chi_adm_loyalty').GetValue|0]#!    @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]: #v [Country.MakeScope.Var('chi_adm_autonomy').GetValue|0]#!    @chi_adm_corruption![Nbsp][concept_chi_adm_corruption]: #v [Country.MakeScope.Var('chi_adm_corruption').GetValue|0]#!"
 chi_adm_negotiated_integration_stage_display: "#gold #bold [Country.GetCustom('chi_adm_negotiated_integration_stage')]#!#!\n[Country.GetCustom('chi_adm_negotiated_integration_response')]\n[Country.GetCustom('chi_adm_negotiated_integration_activity')]"
 chi_adm_negotiated_integration_progress_display: "#gold #bold Implementation progress#!#!\n#v [Country.MakeScope.Var('chi_adm_negotiated_integration_elapsed').GetValue|0]#! / #v [Country.MakeScope.ScriptValue('chi_adm_negotiated_integration_required')|0]#! monthly reviews completed.\n#bold First half:#! Census and registration.\n#bold Second half:#! Bureaucratic transition.\nConcurrent commissions adjust the required duration; completed reviews are retained."
 chi_adm_negotiated_integration_terms_display: "#gold #bold Terms of agreement#!#!\n[Country.GetCustom('chi_adm_negotiated_integration_subsidy')]\n\n[Country.GetCustom('chi_adm_negotiated_integration_protection')]\n\n[Country.GetCustom('chi_adm_negotiated_integration_honors')]"
 chi_adm_negotiated_integration_waiting_display: "[Country.GetCustom('chi_adm_negotiated_integration_waiting')]\n[Country.GetCustom('chi_adm_negotiated_integration_requests')]"
 chi_adm_negotiated_integration_negotiation_help: "@chi_adm_loyalty! [concept_chi_adm_loyalty], @chi_adm_autonomy! [concept_chi_adm_autonomy], @chi_adm_corruption! [concept_chi_adm_corruption], [concept_relations] and offered concessions influence negotiations. Provincial [concept_prestige], [concept_army_power_projection] and [concept_gdp] relative to the central government also affect AI willingness: weaker provinces are more receptive; stronger provinces seek concessions or resist. One pressure attempt is permitted. Each concession remains available up to its own limit. After negotiations break down, the court may withdraw or enforce its claim by diplomatic play. Unanswered proposals from human players do not grant consent."

 # Imperial Security and the Dragon Throne
 chi_adm_qing_security_security: "Imperial Security"
 chi_adm_qing_security_security_reason: "The Grand Council has received evidence of a challenge to the Dragon Throne. Review the court’s reports and decide how to answer."
 chi_adm_qing_security_security_status: "Respond to the challenge to the Throne."
 chi_adm_qing_security_provincial: "[ROOT.GetCountry.GetCustom('chi_adm_qing_security_provincial_title_loc')]"
 chi_adm_qing_security_provincial_reason: "[JournalEntry.GetCountry.GetCustom('chi_adm_qing_security_provincial_reason_loc')]"
 chi_adm_qing_security_provincial_status: "[JournalEntry.GetCountry.GetCustom('chi_adm_qing_security_provincial_status_loc')]"
 chi_adm_qing_security_provincial_concluded: "Provincial Political Affairs"
 chi_adm_qing_security_provincial_affairs_title: "Provincial Political Affairs"
 chi_adm_qing_security_provincial_plot_title: "Anti-Dynastic Conspiracy"
 chi_adm_qing_security_provincial_affairs_reason: "The governor holds his seal in trust from the Dragon Throne. His memorials report the affairs of the province, and the court weighs his advice against his duty to obey its edicts. A powerful administration may seek more discretion in local affairs, but its standing still rests on imperial favor."
 chi_adm_qing_security_provincial_affairs_status: "Attend to provincial affairs and relations with the court."
 chi_adm_qing_security_provincial_plot_reason: "Provincial officials must decide where they stand as a league takes shape. An armed pledge commits your administration to temporary separation from Qing if the contest begins, with a return to its former imperial relationship at settlement."
 chi_adm_qing_security_provincial_plot_status: "Decide where your administration stands in the contest."
 chi_adm_qing_security_international: "The Contest for the Dragon Throne"
 chi_adm_qing_security_international_reason: "The Provincial League declares that the Qing has forfeited the Mandate of Heaven. Governors weigh their oaths against their armies and ambitions, while foreign courts observe the fate of the Dragon Throne. Should negotiations fail, the contest will decide which house governs China."
 chi_adm_qing_security_international_status: "Follow the League’s preparations and the court’s response."
 chi_adm_qing_security_international_war: "War for the Dragon Throne"
 chi_adm_qing_security_international_war_reason: "The banners are raised and the provincial armies march beneath rival proclamations. Examine the provincial pledges and the opposing war goals to judge who may yet claim the imperial seal."
 chi_adm_qing_security_international_war_status: "Follow the war and the struggle for the imperial succession."

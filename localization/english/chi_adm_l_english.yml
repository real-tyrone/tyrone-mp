 # Negotiated Imperial Law Reform
 chi_adm_imperial_law_eligibility_display: "[Country.GetCustom('chi_adm_imperial_law_eligibility')]"
 chi_adm_imperial_law_no_active_eligibility: "Select an imperial law above to prepare a new request."
 chi_adm_imperial_law_already_adopted: "The requested law is already in force."
 chi_adm_imperial_law_special_requirements: "Blocked: the law's technology, institutional or special eligibility requirements are unmet. Petition or refuse; no adoption is forced."
 chi_adm_imperial_law_busy_requirements: "Another enactment occupies the government. Accept for later to preserve it; requirements will be checked again."
 chi_adm_imperial_law_political_requirements: "Ordinary enactment is blocked by the current political or enactment conditions. Review this law in Politics, or petition the court."
 chi_adm_imperial_law_requirements_met: "Imperial enactment availability requirements are met. The governor must still authorize the reform."
 chi_adm_imperial_law_selected_display: "Court selection: #gold [Country.GetCustom('chi_adm_imperial_law_selected_name')]#!"
 chi_adm_imperial_law_select_button: "Next Imperial Law"
 chi_adm_imperial_law_select_tooltip: "Cycle through every law currently held by Qing, including provincial and custom law categories. This chooses a proposal; it changes no provincial law."
 chi_adm_imperial_law_send_button: "Send Reform Request"
 chi_adm_imperial_law_send_tooltip: "Send the selected law to this administration. Qing must still hold it; the province must not already hold it or have the same active request, a one-year repeat restriction, or another native imposition. Incompatible laws may be requested, but ordinary enactment requirements still apply. A later decree waits behind an accepted reform. Frontier administrations participate only through manual, negotiated requests."
 chi_adm_imperial_law_directive: "Imperial Reform Directive"
 chi_adm_imperial_law_directive_reason: "A decree bearing the imperial seal has reached the provincial yamen. The governor must decide whether to promulgate the measure, seek time to prepare the offices, memorialize the Throne for an exemption, or incur the political consequences of refusal. The decree itself does not alter provincial law."
 chi_adm_imperial_law_directive_status: "[JournalEntry.GetCountry.GetCustom('chi_adm_imperial_law_response_prompt')]"
 chi_adm_imperial_law_choose_response: "Choose a response to the imperial reform."
 chi_adm_imperial_law_empty_response: ""
 chi_adm_imperial_law_court_register: "Imperial Reform Docket"
 chi_adm_imperial_law_court_register_reason: "The court secretaries enter each provincial reply into the reform registers. Memorials for exemption may be granted, rejected, or answered with a renewed invitation; no governor is deemed to have accepted an edict merely because the court has sent it."
 chi_adm_imperial_law_court_register_status: "Review provincial commitments and unsettled replies."
 chi_adm_imperial_law_req_province: "An active imperial directive to this Qing civil administration"
 chi_adm_imperial_law_req_court: "The Qing imperial court is in session"
 chi_adm_imperial_law_closed: "This directive is no longer active. Provincial law is not changed by closing the record."
 chi_adm_imperial_law_directive_heading: "THE IMPERIAL REFORM DIRECTIVE"
 chi_adm_imperial_law_record: "Requested: #gold [Country.GetCustom('chi_adm_imperial_law_requested_name')]#!\nCategory: [Country.GetCustom('chi_adm_imperial_law_group_name')]"
 chi_adm_imperial_law_current_law: "Provincial law: [Country.GetCustom('chi_adm_imperial_law_current_name')]"
 chi_adm_imperial_law_status_display: "Status: #gold [Country.GetCustom('chi_adm_imperial_law_status')]#!"
 chi_adm_imperial_law_deadline_display: "[Country.GetCustom('chi_adm_imperial_law_deadline')]\n[Country.GetCustom('chi_adm_imperial_law_support_text')]"
 chi_adm_imperial_law_months_remaining: "Time remaining: #v [Country.MakeScope.Var('chi_adm_imperial_law_months_left').GetValue|0]#! monthly reviews"
 chi_adm_imperial_law_no_deadline: "No response deadline is running."
 chi_adm_imperial_law_support_active: ""
 chi_adm_imperial_law_support_inactive: ""
 chi_adm_imperial_law_no_record: "No reform recorded"
 chi_adm_imperial_law_legal_tooltip: "Immediate adoption changes the law now. Gradual adoption takes 12 months and blocks new enactments. Technology, conflicting-law and special availability restrictions still apply."
 chi_adm_imperial_law_choice_hint: "Already reforming another law? Accept the imperial reform for later to preserve your present enactment. Only Prioritize explicitly abandons it. Unanswered notices never authorize adoption."
 chi_adm_imperial_law_court_hint: "Each record follows the province's current reply. Exemptions and negotiated invitations require 25 Authority and commit court staff for six months. Court decisions never enact an unaccepted provincial law."
 chi_adm_imperial_law_req_pending: "This is an active directive requiring a provincial response"
 chi_adm_imperial_law_req_queue: "Another law is currently being enacted; its progress will be preserved"
 chi_adm_imperial_law_req_prioritize: "Another law is being enacted, may legally be cancelled, and the requested law is available"
 chi_adm_imperial_law_req_immediate: "No other enactment is active and the law meets technology, conflicting-law and special availability requirements. Ordinary political support is not required."
 chi_adm_imperial_law_req_gradual: "No other enactment is active; the law meets its technology, conflicting-law and special availability requirements."
 chi_adm_imperial_law_req_petition: "No exemption petition has yet been made for this directive"
 chi_adm_imperial_law_req_delay: "No enactment is occupying the government, and this directive has not already been deliberately delayed"
 chi_adm_imperial_law_req_refuse: "This directive has not already been openly refused"
 chi_adm_imperial_law_queue_button: "Accept, but Enact Later"
 chi_adm_imperial_law_queue_desc: "Accept the directive and finish the provincial enactment already underway."
 chi_adm_imperial_law_queue_result: "Keep your current enactment. Start #v 12#! monthly reviews for #v [ROOT.GetCountry.GetCustom('chi_adm_imperial_law_requested_name')]#! once it ends."
 chi_adm_imperial_law_prioritize_button: "Prioritize the Imperial Reform"
 chi_adm_imperial_law_prioritize_desc: "Set aside the present enactment and order the secretariat to give the new imperial decree precedence."
 chi_adm_imperial_law_prioritize_result: "Cancel the current law enactment and discard its progress."
 chi_adm_imperial_law_immediate_button: "Accept and Implement Immediately"
 chi_adm_imperial_law_immediate_desc: "Put the accepted imperial reform into effect immediately."
 chi_adm_imperial_law_immediate_result: "Adopt #v [ROOT.GetCountry.GetCustom('chi_adm_imperial_law_requested_name')]#! immediately."
 chi_adm_imperial_law_gradual_button: "Accept and Implement over 12 Months"
 chi_adm_imperial_law_gradual_desc: "Authorize a year of provincial implementation, followed by adoption of the requested law."
 chi_adm_imperial_law_gradual_result: "Adopt #v [ROOT.GetCountry.GetCustom('chi_adm_imperial_law_requested_name')]#! after #v 12#! monthly reviews if it remains available."
 chi_adm_imperial_law_petition_button: "Petition for Exemption"
 chi_adm_imperial_law_petition_desc: "Submit a respectful memorial explaining why local institutions, revenues or customs require an exception to the decree. The Grand Council may concede, negotiate or insist."
 chi_adm_imperial_law_petition_result: "Keep your current law and any enactment already underway."
 chi_adm_imperial_law_delay_button: "Delay Implementation"
 chi_adm_imperial_law_delay_desc: "Request a further term for consultation among the provincial officials, knowing that the court may regard deliberate hesitation as disobedience."
 chi_adm_imperial_law_delay_result: "Defer the directive once for #v 12#! monthly reviews. When the delay ends, choose a response."
 chi_adm_imperial_law_refuse_button: "Reject the Imperial Edict"
 chi_adm_imperial_law_refuse_desc: "Return the decree without the seal of acceptance, placing the governor’s loyalty and standing before the Dragon Throne in question."
 chi_adm_imperial_law_refuse_result: "Keep your current law and any enactment already underway. Notify Qing of your refusal."
 chi_adm_imperial_law_court_grant: "Grant Exemption"
 chi_adm_imperial_law_court_offer: "Offer Gradual Reform"
 chi_adm_imperial_law_court_maintain: "Maintain / Censure"
 chi_adm_imperial_law_court_grant_tooltip: "Requires an unsettled petition/refusal, 25 available Qing Authority and no current court workload. Suspend the decree for 24 monthly reviews; provincial Autonomy rises by 5. Court staff occupy 25 Authority for six months. No law changes."
 chi_adm_imperial_law_court_offer_tooltip: "Requires an unsettled petition/refusal, 25 available Qing Authority and no current court workload. Renew the invitation for ordinary enactment with 12 monthly reviews to answer. Court staff occupy 25 Authority for six months. The governor must still choose compliance."
 chi_adm_imperial_law_court_maintain_tooltip: "Resolve an unsettled petition by maintaining the request and granting a new response window. For an outright refusal, publicly censure once: provincial Loyalty -3 and relations -10. No forced law change follows."
 chi_adm_imperial_law_notice_title: "An Imperial Decree Arrives at the Yamen"
 chi_adm_imperial_law_notice_desc: "A courier bearing the court seal has delivered a new reform directive. Consult The Governor’s Accounts to give an explicit reply: adopt, defer, memorialize for exemption, or refuse. Merely receiving the courier changes no law."
 chi_adm_imperial_law_court_notice_title: "A Governor Replies to the Decree"
 chi_adm_imperial_law_court_notice_desc: "A sealed reply from [SCOPE.sCountry('chi_adm_imperial_law_province').GetName] has been placed before the Grand Council.\nRequested reform: [SCOPE.sCountry('chi_adm_imperial_law_province').GetCustom('chi_adm_imperial_law_requested_name')]\nProvincial answer: [SCOPE.sCountry('chi_adm_imperial_law_province').GetCustom('chi_adm_imperial_law_status')]\nThe ministers may grant an exception, invite renewed compliance, or uphold the court’s decree. The register records the answer; it does not enact a law without provincial consent."
 chi_adm_imperial_law_notice_ack: "Enter the decree in the provincial registers."
 chi_adm_imperial_law_enactment_support: "Imperial Reform Assistance"
 chi_adm_imperial_law_enactment_support_desc: "Temporary support for the accepted imperial law only; +10 percentage points, -20% multiplicative stall chance, +50% enactment speed and +1 maximum permitted setback of enactment success chance. It ends with that enactment or after 12 monthly reviews."
 chi_adm_imperial_law_transition: "Administrative Transition"
 chi_adm_imperial_law_transition_desc: "Putting the voluntarily accepted reform directly into effect occupies 2% of Bureaucracy for 12 months."
 chi_adm_imperial_law_court_workload: "Provincial Reform Negotiations"
 chi_adm_imperial_law_court_workload_desc: "Imperial correspondence over an exemption or compromise occupies 25 Authority for six months. Another such concession must wait."
 chi_adm_imperial_law_status_awaiting: "Awaiting Response"
 chi_adm_imperial_law_status_queued: "Awaiting Completion of Current Reform"
 chi_adm_imperial_law_status_enacting: "Implementing the Imperial Reform"
 chi_adm_imperial_law_status_petition: "Petition Before the Court"
 chi_adm_imperial_law_status_delayed: "Political Delay"
 chi_adm_imperial_law_status_exempt: "Temporary Exemption"
 chi_adm_imperial_law_status_rejected: "Rejected"
 chi_adm_imperial_law_status_blocked: "Legal Requirements Not Met"
 chi_adm_imperial_law_status_overdue: "Response Required"
 chi_adm_imperial_law_status_completed: "Implemented"
 chi_adm_imperial_law_status_withdrawn: "Withdrawn or Superseded"
 chi_adm_imperial_law_status_ended: "Enactment Ended Without Adoption"
 chi_adm_imperial_law_backlog_display: "Later decree: #gold [Country.GetCustom('chi_adm_imperial_law_backlog_name')]#!\nThis waits behind the accepted reform and requires a new response when dispatched."
 chi_adm_imperial_law_summary_heading: "#gold REFORM SUMMARY#!"
 chi_adm_imperial_law_admin_heading: "#gold ADMINISTRATIVE STATUS#!"
 chi_adm_imperial_law_responses_heading: "#gold PROVINCIAL RESPONSES#!"
 chi_adm_imperial_law_compliance_heading: "Compliance"
 chi_adm_imperial_law_negotiation_heading: "Negotiation"
 chi_adm_imperial_law_refusal_heading: "Refusal"
 chi_adm_imperial_law_busy_display: "[Country.GetCustom('chi_adm_imperial_law_busy')]"
 chi_adm_imperial_law_busy_yes: "An enactment is in progress. Accept for later to preserve it; only explicit prioritization abandons it."
 chi_adm_imperial_law_busy_no: "No other law is being enacted."
 chi_adm_imperial_law_implementation_lock: "Imperial Reform Implementation"
 chi_adm_imperial_law_implementation_lock_desc: "The provincial offices are occupied with a twelve-month imperial reform. New law enactments are suspended until implementation ends."
 chi_adm_imperial_law_implementation_status: "Implementation takes 12 monthly reviews. New enactments are suspended while work is underway."
 chi_adm_imperial_law_implementation_busy: "Other law enactments are suspended during implementation."

 chi_adm_corruption_tax_capacity: "Provincial Revenue Administration"
 chi_adm_corruption_tax_capacity_desc: "The integrity of the provincial accounts determines effective Tax Capacity."

 # Memorials, Edicts and Audits
 chi_adm_memorials_file_relief: "Request Fiscal Relief"
 chi_adm_memorials_file_relief_desc: "Petition for @money!#v 20,000#! from Qing [concept_gold_reserves] and #g +5#! @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]. A compromise offers half the money and #g +3#! @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]. No payment occurs until approval. Filing cooldown: #v two years#!; answer window: #v six monthly reviews#!. A funded petition also saves two monthly reports on the next reform commission begun within a year."
 chi_adm_memorials_file_discretion: "Petition for Administrative Latitude"
 chi_adm_memorials_file_discretion_desc: "If approved, gain [GetStaticModifier('chi_adm_memorials_discretion').GetName|v] for #v 12 months#!:\n[GetStaticModifier('chi_adm_memorials_discretion').GetDesc]"
 chi_adm_memorials_file_military: "Memorial for Emergency Assistance"
 chi_adm_memorials_file_military_desc: "Request @money!#v 10,000#!, @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] #v +3#! and @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] #g +3#! while at [concept_war], with #v twelve months#! of [GetStaticModifier('chi_adm_memorials_emergency').GetName]:\n[GetStaticModifier('chi_adm_memorials_emergency').GetDesc]\nA compromise offers @money!#v 5,000#!, #v +2#! @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] and #g +2#! @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] with the same modifier. No payment occurs until approval. Filing cooldown: #v two years#!."
 chi_adm_memorials_send_supervision: "Order Administrative Supervision"
 chi_adm_memorials_send_supervision_tt: "Offer a twelve-month review: @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] -5, @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] -3 (-1 for frontier offices), [concept_bureaucracy] -2%.\n\n#bold Revised terms#!\n @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] -3, no @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] loss, [concept_bureaucracy] -1%. Requires @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] at least 40.\n\nRequires uncommitted imperial clerks. one-year target cooldown.\nAt most two outstanding edicts or audits; one intervention per province.\nReply window: six monthly reviews; appeal or postponement gives three. An expired edict costs 3 @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]."
 chi_adm_memorials_send_honors: "Confer an Imperial Commendation"
 chi_adm_memorials_send_honors_tt: "Offer recognition: @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] +5, @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] -2, [concept_prestige] +5% for twelve months.\n\n#bold Revised terms#!\n @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] +3, no @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] loss. Requires @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] at least 60 and @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] below 60.\n\nRequires uncommitted imperial clerks. one-year target cooldown.\nAt most two outstanding edicts or audits; one intervention per province.\nReply window: six monthly reviews; appeal or postponement gives three. An expired edict costs 3 @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]."
 chi_adm_memorials_send_emergency: "Offer Emergency Military Assistance"
 chi_adm_memorials_send_emergency_tt: "While the province is at war, offer @money!#v 10,000#! from Qing reserves, +3 @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] and +5% military wages for twelve months.\n\n#bold Revised terms#!\n @money!#v 5,000#! and +2 @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]. No troops, laws or military reform bonuses are created.\n\nRequires uncommitted imperial clerks. one-year target cooldown.\nAt most two outstanding edicts or audits; one intervention per province.\nReply window: six monthly reviews; appeal or postponement gives three. An expired edict costs 3 @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]."
 chi_adm_memorials_approve_memorial: "Approve Memorial"
 chi_adm_memorials_approve_memorial_tt: "Approve the governor's memorial. No imperial staff commitment is charged."
 chi_adm_memorials_counter_memorial: "Offer a Compromise"
 chi_adm_memorials_counter_memorial_tt: "Offer reduced terms.\n\n#bold Proposed settlement#!\n- Fiscal relief: half the requested payment.\n- Military aid: half the payment and reduced discretion.\n- Administrative latitude: +3 @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] and +1 @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty], without the [concept_bureaucracy] concession.\n\nThe governor has #v three monthly reviews#! to accept. Payment occurs only after acceptance."
 chi_adm_memorials_reject_memorial: "Reject Memorial"
 chi_adm_memorials_reject_memorial_tt: "Reject the governor's memorial."
 chi_adm_memorials_negotiate_edict: "Offer Revised Terms"
 chi_adm_memorials_negotiate_edict_tt: "Offer revised terms in response to the governor's appeal.\n\nThe governor has #v three monthly reviews#! to accept or refuse."
 chi_adm_memorials_withdraw_edict: "Withdraw Edict"
 chi_adm_memorials_withdraw_edict_tt: "Withdraw the outstanding edict.\n\nIts original cooldown remains."
 chi_adm_memorials_open_audit: "Dispatch the Censorate"
 chi_adm_memorials_open_audit_tt: "Commission an examination of the provincial accounts.\n\n#bold Investigation routes#!\n- Cooperation: #v 4#! reviews.\n- Obstruction: #v 10#! reviews.\n- Paid concealment: #v 5#! reviews.\nNo reply within #v 3#! reviews counts as obstruction. Findings are uncertain.\n\n#bold Limits#!\n- One audit per province every #v year#!.\n- At most #v two#! outstanding edicts or audits.\n- One intervention per province."
 chi_adm_memorials_propose_restitution: "Request Restitution"
 chi_adm_memorials_propose_restitution_tt: "Request restitution from the provincial treasury.\n\n#bold If the governor accepts#!\n- Transfer @money!#v 10,000#! to Qing.\n- @chi_adm_corruption![Nbsp][concept_chi_adm_corruption]: #g -12#!\n- @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]: #r -4#!\n- @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]: #r -3#!\n- Remove the exposed-account penalty.\n\nThe governor may choose administrative reform instead. Reply window: #v three monthly reviews#!."
 chi_adm_memorials_propose_reform: "Require an Answer on Reform"
 chi_adm_memorials_propose_reform_tt: "Offer supervised reform, subject to the governor's consent: @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] #g -10#!, @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] #r -2#!, @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] #r -3#! (#r -1#! in frontier offices). If accepted, apply #v twelve months#! of [GetStaticModifier('chi_adm_memorials_supervision').GetName]:\n[GetStaticModifier('chi_adm_memorials_supervision').GetDesc]"
 chi_adm_memorials_tolerate: "Tolerate Local Patronage"
 chi_adm_memorials_tolerate_tt: "Recognize local patronage without restitution. Existing exposure penalties remain; suspicion raises future audit risk."
 chi_adm_memorials_accept_counter: "Accept the Court Compromise"
 chi_adm_memorials_accept_counter_desc: "Accept the revised court settlement. The effects below reflect the current memorial; the court must still hold the required [concept_gold_reserves]."
 chi_adm_memorials_decline_counter: "Withdraw the Memorial"
 chi_adm_memorials_decline_counter_desc: "Withdraw the memorial. Its original filing cooldown remains."
 chi_adm_memorials_accept_edict: "Accept the Imperial Edict"
 chi_adm_memorials_accept_edict_desc: "Consent to the current edict or revised terms. The effects below reflect the decree currently before this administration."
 chi_adm_memorials_appeal_edict: "Appeal the Edict"
 chi_adm_memorials_appeal_edict_desc: "Send an appeal to the court and reset the response window to #v three monthly reviews#!. This option can be used once per edict."
 chi_adm_memorials_delay_edict: "Request Time for the Edict"
 chi_adm_memorials_delay_edict_desc: "Reset the response window to #v three monthly reviews#!. @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] -2. This option can be used once per edict."
 chi_adm_memorials_defy_edict: "Decline the Edict"
 chi_adm_memorials_defy_edict_desc: "Close the edict. @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] -6. Relations with Qing decrease by #v 5#!."
 chi_adm_memorials_audit_cooperate: "Open the Provincial Registers"
 chi_adm_memorials_audit_cooperate_desc: "The investigation advances by #v 25#! per monthly review. Cooperation increases the chance of an adverse finding. A clean finding grants @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] +2 and @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] -3.\nGain [GetStaticModifier('chi_adm_memorials_audit_burden').GetName|v] for #v 12 months#!\n[GetStaticModifier('chi_adm_memorials_audit_burden').GetDesc]\nThe modifier ends when the investigation concludes."
 chi_adm_memorials_audit_obstruct: "Obstruct the Inspectors"
 chi_adm_memorials_audit_obstruct_desc: "The investigation advances by #v 10#! per monthly review. @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] -3."
 chi_adm_memorials_audit_conceal: "Conceal the Accounts"
 chi_adm_memorials_audit_conceal_desc: "Pay @money!#v 5,000#!. The investigation advances by #v 20#! per monthly review, and an adverse finding becomes less likely. A clean finding grants @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] +3 and @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] +2 and applies [GetStaticModifier('chi_adm_memorials_suspicion').GetName|v] for #v 48 months#!.\n[GetStaticModifier('chi_adm_memorials_suspicion').GetDesc]"
 chi_adm_memorials_pay_restitution: "Authorize Restitution"
 chi_adm_memorials_pay_restitution_desc: "Pay @money!#v 10,000#! to Qing. @chi_adm_corruption![Nbsp][concept_chi_adm_corruption] -12, @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] -4, @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] -3. Close the audit and remove [GetStaticModifier('chi_adm_memorials_exposed').GetName|v]."
 chi_adm_memorials_accept_reform: "Accept Administrative Reform"
 chi_adm_memorials_accept_reform_desc: "Accept the supervised reorganization. This is also available instead of paying restitution."
 chi_adm_memorials_resist_settlement: "Refuse the Settlement"
 chi_adm_memorials_resist_settlement_desc: "Close the audit. @chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty] -8, @chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy] +3. Relations with Qing decrease by #v 5#!."
 chi_adm_memorials_court_staff: "Court Correspondence"
 chi_adm_memorials_court_staff_desc: "Each active correspondence commitment occupies 25 Authority for six months. Costs stack when multiple clerks are in use."
 chi_adm_memorials_clerks: "Memorial Clerks"
 chi_adm_memorials_clerks_desc: "The provincial yamen has set its scribes to copying the petition and assembling its supporting accounts."
 chi_adm_memorials_discretion: "Administrative Latitude"
 chi_adm_memorials_discretion_desc: "The court has permitted a measure of local discretion, easing the demands placed upon the provincial offices."
 chi_adm_memorials_supervision: "Supervised Provincial Offices"
 chi_adm_memorials_supervision_desc: "Imperial commissioners review appointments and registers while provincial clerks carry out the reorganization."
 chi_adm_memorials_light_supervision: "Negotiated Supervision"
 chi_adm_memorials_light_supervision_desc: "The court accepts a narrower inquiry, sparing some of the province’s clerical labor."
 chi_adm_memorials_honors: "Imperial Commendation"
 chi_adm_memorials_honors_desc: "The governor’s faithful service has been acknowledged in a decree bearing the imperial seal."
 chi_adm_memorials_emergency: "Emergency Military Discretion"
 chi_adm_memorials_emergency_desc: "Temporary authorization carries higher military payroll obligations; no army reform bonus is added."
 chi_adm_memorials_audit_burden: "Censorate Investigation"
 chi_adm_memorials_audit_burden_desc: "Censorate examiners occupy the provincial offices, opening tax ledgers and cross-examining the officials responsible for them."
 chi_adm_memorials_exposed: "Exposed Accounts"
 chi_adm_memorials_exposed_desc: "Damning accounts have circulated beyond the yamen, unsettling the clerks and obstructing routine administration."
 chi_adm_memorials_suspicion: "Suspected Patronage"
 chi_adm_memorials_suspicion_desc: "Though the books have been closed, whispers of concealed patronage follow the governor and invite further scrutiny from the Censorate."
 chi_adm_memorials_case_requirements: "The administration is eligible and the case, cooldown and response-window rules permit this choice."
 chi_adm_memorials_preview_loyalty_gain_3: "@chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]: #g +3#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_condition_1: "For a fiscal relief memorial."
 chi_adm_memorials_preview_autonomy_gain_3: "@chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]: #g +3#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_loyalty_gain_1: "@chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]: #g +1#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_condition_2: "For a memorial seeking administrative latitude."
 chi_adm_memorials_preview_autonomy_gain_2: "@chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]: #g +2#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_loyalty_gain_2: "@chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]: #g +2#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_condition_3: "For emergency military assistance."
 chi_adm_memorials_preview_corruption_loss_3: "@chi_adm_corruption![Nbsp][concept_chi_adm_corruption]: #g -3#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_condition_4: "Under the negotiated terms."
 chi_adm_memorials_preview_corruption_loss_5: "@chi_adm_corruption![Nbsp][concept_chi_adm_corruption]: #g -5#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_autonomy_loss_1: "@chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]: #r -1#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_autonomy_loss_3: "@chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]: #r -3#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_condition_5: "For an administrative supervision edict."
 chi_adm_memorials_preview_loyalty_gain_5: "@chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]: #g +5#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_autonomy_loss_2: "@chi_adm_autonomy![Nbsp][concept_chi_adm_autonomy]: #r -2#! (bounded to #v 0–100#!)"
 chi_adm_memorials_preview_condition_6: "For an imperial commendation."
 chi_adm_memorials_preview_condition_7: "For emergency military assistance."
 chi_adm_memorials_preview_loyalty_loss_2: "@chi_adm_loyalty![Nbsp][concept_chi_adm_loyalty]: #r -2#! (bounded to #v 0–100#!)"

 chi_adm_provincial_development_refuse: "Withhold the Imperial Seal"

 chi_adm_provincial_development_court_title: "A Provincial Emergency Warrant"

 chi_adm_provincial_development_court_desc: "A sealed memorial from [SCOPE.sCountry('chi_adm_provincial_development_province').GetName] warns that the ordinary authority of the provincial yamen may not suffice in the present emergency. The Grand Council may grant the requested warrant, offer different terms, or refuse. A governor determined to act may still mobilize without the imperial seal while danger persists.\n\n[SCOPE.sCountry('chi_adm_provincial_development_province').GetCustom('chi_adm_provincial_development_requested_warrant')]"

 chi_adm_provincial_development_province_title: "The Imperial Seal and the Provincial Muster"

 chi_adm_provincial_development_province_desc: "Review the court’s response or settle the emergency accounts. Refusal and silence never authorize peaceful annexation. Military benefits lapse after a three-month post-crisis grace period; the return of exceptional discretion remains a political settlement."

 chi_adm_provincial_development_later: "Keep the Memorial Open"

 chi_adm_provincial_development_province: "Provincial Emergency Powers"

 chi_adm_provincial_development_province_reason: "In time of rebellion, invasion or disorder, a governor may petition for exceptional powers under the imperial seal. Such warrants strengthen provincial defenses, yet enlarge the discretion of local commanders. When danger passes, the court expects the extraordinary authority to be returned."

 chi_adm_provincial_development_closed: "This administration has left imperial service."

 chi_adm_provincial_development_project_expense: "Provincial Development Expenditure"

 chi_adm_provincial_development_supervision: "Imperial Restoration Commission"

 chi_adm_provincial_development_guarantee: "Guaranteed Provincial Settlement"

 chi_adm_provincial_development_sanctions: "Court Censure"

 chi_adm_provincial_development_military_1: "Military Self-Strengthening — Tier 1"

 chi_adm_provincial_development_start_military_1: "Military — Tier 1"

 chi_adm_provincial_development_start_military_1_desc: "The provincial drillmasters and armourers are ordered to survey muskets, powder stores and the state of the garrisons. Fund a 12-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Grants a province-wide army bonus at the highest Military tier among owned states.\n\n[GetStaticModifier('chi_adm_provincial_development_military_1').GetDesc]"

 chi_adm_provincial_development_military_2: "Military Self-Strengthening — Tier 2"

 chi_adm_provincial_development_start_military_2: "Military — Tier 2"

 chi_adm_provincial_development_start_military_2_desc: "Arsenal workshops require machine tools, reliable metal supplies and craftsmen trained to reproduce modern weapons. Fund an 18-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Grants a province-wide army bonus at the highest Military tier among owned states.\n\n[GetStaticModifier('chi_adm_provincial_development_military_2').GetDesc]"

 chi_adm_provincial_development_military_3: "Military Self-Strengthening — Tier 3"

 chi_adm_provincial_development_start_military_3: "Military — Tier 3"

 chi_adm_provincial_development_start_military_3_desc: "Modern field batteries and improved infantry weapons call for a permanent military-industrial establishment. Fund a 24-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Grants a province-wide army bonus at the highest Military tier among owned states.\n\n[GetStaticModifier('chi_adm_provincial_development_military_3').GetDesc]"

 chi_adm_provincial_development_economic_1: "Economic Self-Strengthening — Tier 1"

 chi_adm_provincial_development_start_economic_1: "Economic — Tier 1"

 chi_adm_provincial_development_start_economic_1_desc: "Magistrates and merchant guilds survey the mines, workshops and transport routes on which provincial prosperity depends. Fund a 12-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Improves current states; later acquisitions receive no free upgrades.\n\n[GetStaticModifier('chi_adm_provincial_development_economic_1').GetDesc]"

 chi_adm_provincial_development_economic_2: "Economic Self-Strengthening — Tier 2"

 chi_adm_provincial_development_start_economic_2: "Economic — Tier 2"

 chi_adm_provincial_development_start_economic_2_desc: "Steam-driven mills and mineral enterprises require new machinery, coal and investors willing to commit their silver. Fund an 18-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Improves current states; later acquisitions receive no free upgrades.\n\n[GetStaticModifier('chi_adm_provincial_development_economic_2').GetDesc]"

 chi_adm_provincial_development_economic_3: "Economic Self-Strengthening — Tier 3"

 chi_adm_provincial_development_start_economic_3: "Economic — Tier 3"

 chi_adm_provincial_development_start_economic_3_desc: "Rail depots, mechanized workshops and commercial offices begin to bind the provincial economy into a modern industrial network. Fund a 24-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Improves current states; later acquisitions receive no free upgrades.\n\n[GetStaticModifier('chi_adm_provincial_development_economic_3').GetDesc]"

 chi_adm_provincial_development_administrative_1: "Administrative Self-Strengthening — Tier 1"

 chi_adm_provincial_development_start_administrative_1: "Administration — Tier 1"

 chi_adm_provincial_development_start_administrative_1_desc: "The yamen clerks are ordered to examine land registers, granary accounts and the collection of local taxes. Fund a 12-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Improves current states; later acquisitions receive no free upgrades.\n\n[GetStaticModifier('chi_adm_provincial_development_administrative_1').GetDesc]"

 chi_adm_provincial_development_administrative_2: "Administrative Self-Strengthening — Tier 2"

 chi_adm_provincial_development_start_administrative_2: "Administration — Tier 2"

 chi_adm_provincial_development_start_administrative_2_desc: "Provincial secretaries propose better revenue bureaus, more reliable communications and more rigorous inspection of county officials. Fund an 18-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Improves current states; later acquisitions receive no free upgrades.\n\n[GetStaticModifier('chi_adm_provincial_development_administrative_2').GetDesc]"

 chi_adm_provincial_development_administrative_3: "Administrative Self-Strengthening — Tier 3"

 chi_adm_provincial_development_start_administrative_3: "Administration — Tier 3"

 chi_adm_provincial_development_start_administrative_3_desc: "A professional network of officials and registrars promises steadier revenues and firmer oversight from the provincial capital. Fund a 24-month provincial program. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states. Improves current states; later acquisitions receive no free upgrades.\n\n[GetStaticModifier('chi_adm_provincial_development_administrative_3').GetDesc]"

 chi_adm_provincial_development_takeover: "Assume Unfinished Provincial Works"

 chi_adm_provincial_development_takeover_desc: "Assume the unfinished accounts of works begun under a previous governor or ruler. Remaining expenses and inspection duties follow the new owner; completed reviews are preserved. Imperial assistance continues only while the new court relationship permits it."

 chi_adm_provincial_development_ask_sponsor: "Seek Imperial Sponsorship"

 chi_adm_provincial_development_ask_sponsor_desc: "Petition the Grand Council for funds and expertise to accelerate provincial works, accepting imperial inspection and narrower local discretion in return."

 chi_adm_provincial_development_offer_sponsor: "Offer Imperial Sponsorship"

 chi_adm_provincial_development_offer_sponsor_desc: "Send a sponsorship offer to the governor. If accepted, Qing covers up to #v half#! of the eligible project costs. The project takes #v 9, 12, or 18 months#! by tier, keeping progress already made. The province accepts [GetStaticModifier('chi_adm_provincial_development_project_inspection').GetName|v] and gains less [concept_chi_adm_autonomy] from the project."
 chi_adm_provincial_development_sponsorship_offer_weekly_tt: "#bold Qing’s weekly contribution if accepted:#! @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('chi_adm_provincial_development_sponsorship_offer_bill')|2]#! at the current project cost. The amount changes as the project bill changes."
 chi_adm_provincial_development_review_militia_tt: "Open the pending emergency warrant. The court can authorize the requested powers, offer a different package, or refuse. Opening the warrant applies no powers."

 chi_adm_provincial_development_accept_sponsor: "Accept Sponsorship and Inspection"

 chi_adm_provincial_development_accept_sponsor_desc: "Accept [GetStaticModifier('chi_adm_provincial_development_project_inspection').GetName|v] and shared funding. Shortens total work to 9/12/18 months without resetting completed work."

 chi_adm_provincial_development_decline_sponsor: "Continue Without Sponsorship"

 chi_adm_provincial_development_decline_sponsor_desc: "Retain the project beneath the provincial seal, paying for it locally rather than submitting its books to imperial inspectors."

 chi_adm_provincial_development_ext_1_t: "A Provincial Development Petition"

 chi_adm_provincial_development_ext_1_d: "A memorial from [SCOPE.sCountry('chi_adm_provincial_development_province').GetName] requests money and technical assistance for its works. The governor offers to open the books to imperial inspectors, but retains the right to reject the court’s proposed safeguards."

 chi_adm_provincial_development_ext_2_t: "Inspectors and Provincial Works"

 chi_adm_provincial_development_ext_2_d: "The Grand Council proposes to share the cost of the new workshops, schools and public works, provided that imperial inspectors may examine their accounts. Acceptance would hasten completion while limiting the additional discretion enjoyed by the provincial government."

 chi_adm_provincial_development_compact_1: "Review Mongol Noble Leagues"

 chi_adm_provincial_development_compact_1_desc: "Summon Mongol princes and league delegates to settle pasture rights, customary law, military service and the honors owed to their banners."

 chi_adm_provincial_development_compact_name_1: "Mongol Noble Leagues"

 chi_adm_provincial_development_compact_2: "Review Inner Mongolian Banners"

 chi_adm_provincial_development_compact_2_desc: "Confer with the Inner Mongolian banner authorities on hereditary privileges, recruitment duties, revenues and obligations to the Throne."

 chi_adm_provincial_development_compact_name_2: "Inner Mongolian Banners"

 chi_adm_provincial_development_compact_3: "Review Ili Garrison Compact"

 chi_adm_provincial_development_compact_3_desc: "Consult the Ili garrison commanders, frontier merchants and local notables on trade, military provisioning and customary jurisdiction."

 chi_adm_provincial_development_compact_name_3: "Ili Garrison Compact"

 chi_adm_provincial_development_compact_4: "Review Xining Religious and Frontier Compact"

 chi_adm_provincial_development_compact_4_desc: "Convene the Xining imperial minister, Mongol and Tibetan nobles and monastic authorities to negotiate religious privileges, frontier service and local revenues."

 chi_adm_provincial_development_compact_name_4: "Xining Religious and Frontier Compact"

 chi_adm_provincial_development_compact_5: "Review Three Eastern Generalships"

 chi_adm_provincial_development_compact_5_desc: "Review the authority of the generals of Shengjing, Jilin and Heilongjiang, the Eight Banner registers and the privileges of the Manchu homeland."

 chi_adm_provincial_development_compact_name_5: "Three Eastern Generalships"

 chi_adm_provincial_development_offer_customs: "Affirm Customary Protections"

 chi_adm_provincial_development_offer_customs_desc: "Protect existing laws and customary institutions; gain Loyalty at the cost of local discretion. For two years, the affected region receives its distinct customary-administration modifier, with a modest institutional benefit and reduced Tax Collection."

 chi_adm_provincial_development_offer_recruit: "Negotiate Recruitment Duties"

 chi_adm_provincial_development_offer_recruit_desc: "Seek a new agreement on garrison obligations, local levies and the provisioning of frontier troops. The governor must assent."

 chi_adm_provincial_development_offer_fiscal: "Negotiate Administrative Obligations"

 chi_adm_provincial_development_offer_fiscal_desc: "Ask the frontier offices to submit more complete tax and administrative registers to imperial examiners, without introducing a second remittance."

 chi_adm_provincial_development_offer_honor: "Recognize Regional Elites"

 chi_adm_provincial_development_offer_honor_desc: "Recognize established princes, banner officers and local notables through imperial favor while preserving the obligations of their offices."

 chi_adm_provincial_development_accept_compact: "Accept the Revised Compact"

 chi_adm_provincial_development_accept_compact_desc: "Affix the provincial seal to the negotiated compact. Only its agreed provisions take effect; existing laws are not replaced."

 chi_adm_provincial_development_refuse_compact: "Retain the Existing Compact"

 chi_adm_provincial_development_refuse_compact_desc: "Withhold the provincial seal. The existing customary settlement and its laws remain in force."

 chi_adm_provincial_development_ext_3_t: "The Frontier Compact"

 chi_adm_provincial_development_ext_3_d: "[SCOPE.sCountry('chi_adm_provincial_development_province').GetName] invites a review of its regional obligations. Propose one targeted revision; the governor must consent.\n\n[SCOPE.sCountry('chi_adm_provincial_development_province').GetCustom('chi_adm_provincial_development_counter_request_status')]"

 chi_adm_provincial_development_ext_4_t: "Custom and Imperial Service"

 chi_adm_provincial_development_ext_4_d: "The court proposes a regional settlement. The proposal concerns [ROOT.GetCountry.GetCustom('chi_adm_provincial_development_compact_identity')]. Accepting changes only the specified administrative obligations; it does not overwrite local law."

 chi_adm_provincial_development_propose_conversion: "Propose Civil Reorganization"

 chi_adm_provincial_development_propose_conversion_desc: "Offer an eighteen-month transition to [GetSubjectType('subject_type_qing_civil_administration').GetName]. Existing laws and regional compacts remain. Completion reduces @chi_adm_autonomy! [concept_chi_adm_autonomy] by 20."

 chi_adm_provincial_development_accept_conversion: "Agree to Civil Reorganization"

 chi_adm_provincial_development_accept_conversion_desc: "Agree to a transition to civil provincial administration, or a viceroyalty for Manchuria. Existing laws and regional compacts remain."

 chi_adm_provincial_development_decline_conversion: "Preserve the Frontier Government"

 chi_adm_provincial_development_decline_conversion_desc: "Decline the initial conversion without authorizing enforcement."

 chi_adm_provincial_development_repudiate_conversion: "Repudiate the Agreed Conversion"

 chi_adm_provincial_development_repudiate_conversion_desc: "Pause the agreement. The court may negotiate or seek enforcement."

 chi_adm_provincial_development_ext_5_t: "A Civil Government for the Frontier"

 chi_adm_provincial_development_ext_5_d: "The imperial court offers a transition to civil government. Manchuria will become a viceroyalty after twelve months. Other frontier administrations will become civil provinces after eighteen months. Mongolia and Ili will adopt Qing laws, add Han as a primary culture, and begin receiving imperial reforms. Mongolia will enact [GetLawType('law_freedom_of_conscience').GetName]. Regional compacts remain in force. The governor must agree before preparation begins."

 chi_adm_provincial_development_grant_discretion: "Grant Provincial Discretion"

 chi_adm_provincial_development_grant_discretion_desc: "Grant limited crisis discretion: +5 Autonomy and +3 Loyalty."

 chi_adm_provincial_development_resist_demand: "Maintain Court Authority"

 chi_adm_provincial_development_resist_demand_desc: "Refuse the demand: −3 Loyalty; no automatic grant of powers."

 chi_adm_provincial_development_fund_alternative: "Fund the Existing Administration"

 chi_adm_provincial_development_fund_alternative_desc: "Transfer 10,000 from the court treasury to the province instead of granting discretion."

 chi_adm_provincial_development_ext_6_t: "The Burden of Imperial Crisis"

 chi_adm_provincial_development_ext_6_d: "[SCOPE.sCountry('chi_adm_provincial_development_province').GetName] requests greater discretion during the imperial emergency. Grant powers, fund an alternative or resist. Ignoring the demand allows a bounded increase in autonomy."

 chi_adm_provincial_development_censure: "Censure Provincial Defiance"

 chi_adm_provincial_development_censure_desc: "Impose a two-year court censure and lose 3 provincial Loyalty."

 chi_adm_provincial_development_tolerate: "Tolerate Provincial Discretion"

 chi_adm_provincial_development_tolerate_desc: "End the dispute without reclaiming its Autonomy gain."

 chi_adm_provincial_development_enforce: "Enforce the Imperial Settlement"

 chi_adm_provincial_development_enforce_desc: "Launch a contested enforcement play. Victory restores disputed powers, costs 5 Loyalty and imposes two years of supervision. Provincial victory grants +5 Autonomy and a three-year guarantee."

 chi_adm_provincial_development_ext_7_t: "The Governor Defies the Imperial Warrant"

 chi_adm_provincial_development_ext_7_d: "The governor of [SCOPE.sCountry('chi_adm_provincial_development_province').GetName] has retained powers that the court regards as exceptional and temporary. The Grand Council may issue a censure, overlook the arrangement, or settle the dispute by force."

 chi_adm_provincial_development_ext_8_t: "The Provincial Works Are Entered as Complete"
 chi_adm_provincial_development_ext_8_d: "The engineers have delivered their reports, the accounts have been reconciled, and the provincial officials have affixed their seals to the completed works. Improvements are now recorded in the participating states.\n\n@chi_adm_autonomy! [concept_chi_adm_autonomy] gained: #v [SCOPE.GetValue('chi_adm_provincial_development_completed_autonomy')|0]#!."
 chi_adm_provincial_development_ext_8_a: "Enter the results in the registers."
 chi_adm_provincial_development_ext_8_military_1_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_military_1').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_military_1').GetDesc]"
 chi_adm_provincial_development_ext_8_military_2_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_military_2').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_military_2').GetDesc]"
 chi_adm_provincial_development_ext_8_military_3_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_military_3').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_military_3').GetDesc]"
 chi_adm_provincial_development_ext_8_economic_1_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_economic_1').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_economic_1').GetDesc]"
 chi_adm_provincial_development_ext_8_economic_2_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_economic_2').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_economic_2').GetDesc]"
 chi_adm_provincial_development_ext_8_economic_3_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_economic_3').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_economic_3').GetDesc]"
 chi_adm_provincial_development_ext_8_administrative_1_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_administrative_1').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_administrative_1').GetDesc]"
 chi_adm_provincial_development_ext_8_administrative_2_d: "$chi_adm_provincial_development_ext_8_d$\n\n[GetStaticModifier('chi_adm_provincial_development_administrative_2').GetName|v]\n[GetStaticModifier('chi_adm_provincial_development_administrative_2').GetDesc]"

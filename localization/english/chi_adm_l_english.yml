 concept_chi_adm_loyalty: "Loyalty"
 concept_chi_adm_loyalty_desc: "Provincial Loyalty measures an administration's willingness to serve the Qing throne on a scale of #v 0–100#!. It influences cooperation, negotiation and political tension. It adjusts payments to the [concept_overlord] by -50% at 0 Loyalty, 0% at 50 and +50% at 100, multiplying the pact rate. It is distinct from [concept_liberty_desire] and interest-group loyalty; a loyal governor may still petition or refuse an imperial request."
 concept_chi_adm_autonomy: "Autonomy"
 concept_chi_adm_autonomy_desc: "Administrative Autonomy measures an office's freedom to conduct provincial affairs on a scale of #v 0–100#!. It adjusts payments to the [concept_overlord] by +50% at 0 Autonomy, 0% at 50 and -50% at 100. This adds to the Loyalty adjustment before multiplying the pact rate. Greater discretion encourages negotiation and makes closer supervision politically costly. It does not by itself mean disloyalty. Memorials, court settlements and audits may change it."
 concept_chi_adm_corruption: "Corruption"
 concept_chi_adm_corruption_desc: "Provincial Corruption measures patronage and concealed accounts on a scale of #v 0–100#!. It changes [concept_tax_capacity] continuously: #g +25%#! at 0, #v 0%#! at 50 and #r -25%#! at 100. Each point reduces the modifier by 0.5 percentage points. Corruption at #v 60#! or above increases detection weight in imperial audits. Investigation, restitution and supervised reform can improve the accounts."
 chi_adm_loyalty_remittance: "Loyalty: Imperial Remittances"
 chi_adm_loyalty_remittance_desc: "Provincial loyalty adjusts payments to the overlord from -50% at 0 Loyalty to +50% at 100 Loyalty. This multiplies the existing pact rate."
 chi_adm_autonomy_remittance: "Autonomy: Imperial Remittances"
 chi_adm_autonomy_remittance_desc: "Provincial autonomy adjusts payments to the overlord from +50% at 0 Autonomy to -50% at 100 Autonomy. This adds to the Loyalty adjustment and multiplies the existing pact rate."

 # Negotiated Integration
 chi_adm_negotiated_integration_propose: "Propose Direct Administration"
 chi_adm_negotiated_integration_propose_desc: "Dispatch an imperial commissioner to negotiate the surrender of the provincial seal and the transfer of local offices to direct administration. No territory passes to Qing, and no new costs or subsidies begin, until agreement is reached."
 chi_adm_negotiated_integration_propose_ready: "@green_checkmark![Nbsp]Requirements met."
 chi_adm_negotiated_integration_propose_blocked: "@red_cross![Nbsp]Requires a direct [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFlag] administration, no open case or cooldown, Autonomy at most 25, one valid integration route, peace and no committed diplomatic plays. Qing needs nonnegative Authority and Bureaucracy."
 chi_adm_negotiated_integration_propose_requirements_heading: "Requirements:"
 chi_adm_negotiated_integration_req_admin: "@green_checkmark! The administration is a direct [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFlag] subject."
 chi_adm_negotiated_integration_req_admin_no: "@red_cross! The administration is not a direct [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFlag] subject."
 chi_adm_negotiated_integration_req_case: "@green_checkmark! No proposal, retry period, repayment case or Henan negotiation is active."
 chi_adm_negotiated_integration_req_case_no: "@red_cross! No active proposal, withdrawal/settlement cooldown, repayment case or Henan negotiation. Withdrawal normally blocks a new proposal for #v 6 months#!; a closer-centralization settlement blocks it for #v 12 months#!."
 chi_adm_negotiated_integration_begin: "Accept Full Integration"
 chi_adm_negotiated_integration_begin_desc: "Begin census and registration. Qing commits @aut![Nbsp]#v 10%#! [concept_authority] and @bur![Nbsp]#v 10%#! [concept_bureaucracy] per active commission. Agreed subsidies begin automatically."
 chi_adm_negotiated_integration_begin_ready: "@green_checkmark![Nbsp]Requirements met."
 chi_adm_negotiated_integration_begin_blocked: "@red_cross![Nbsp]Requires an open offer and nonnegative current [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFlag] Authority and Bureaucracy. The new commitment may create a deficit."
 chi_adm_negotiated_integration_centralize: "Offer Closer Centralization"
 chi_adm_negotiated_integration_centralize_desc: "Offer to bring the provincial yamen under closer imperial supervision without dissolving its government: -5 [concept_chi_adm_autonomy] if Qing agrees. Another peaceful proposal must wait one year."
 chi_adm_negotiated_integration_centralize_ready: "@green_checkmark![Nbsp]Requirements met."

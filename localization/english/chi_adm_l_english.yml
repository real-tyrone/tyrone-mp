 chi_adm_provincial_scholars: "Confront the Confucian Scholars"
 chi_adm_provincial_scholars_reason: "The provincial academies train the officials who fill the yamen. The governor can retain their stewardship while admitting foreign learning, or entrust education to merchants and broaden freedom of conscience."
 chi_adm_provincial_scholars_goal: "Reach #v 72#! reform progress."
 chi_adm_provincial_scholars_isolation_outcome_tt: "#bold End Isolation#! adopts [GetLawType('law_chi_religious_focus').GetName] and reforms the provincial Devout."
 chi_adm_provincial_scholars_eviction_outcome_tt: "#bold Evict the Scholars#! adopts [GetLawType('law_freedom_of_conscience').GetName] and [GetLawType('law_chi_merchent_led').GetName]."
 chi_adm_provincial_scholars_release_cost_tt: "The commission ends, freeing #v 500#! [concept_bureaucracy] and reducing provincial Corruption by #v 3#!."
 chi_adm_provincial_scholars_eligible_tt: "An appointed Qing administration with a Confucian scholarly establishment can undertake this reform once."
 chi_adm_provincial_scholars_button: "Open Education Commission"
 chi_adm_provincial_scholars_button_desc: "Commit #v 500#! [concept_bureaucracy] until the commission concludes. Choose how to reform the provincial schools."
 chi_adm_provincial_scholars_closed: "The administration has left the imperial system or is no longer eligible for the commission."
 chi_adm_provincial_scholars_cost: "Provincial Education Commission"
 chi_adm_provincial_scholars_cost_desc: "The yamen has assigned clerks to the education commission until the governor settles the question of the academies."
 chi_adm_provincial_scholars_settlement: "Provincial Education Settlement"
 chi_adm_provincial_scholars_settlement_desc: "A settlement over the academies has freed the yamen to attend to its ordinary business."
 chi_adm_provincial_scholars.1.d: "The yamen must decide who will oversee the provincial academies. The scholars will admit foreign learning on their own terms, while merchants offer to establish schools under their own direction."
 chi_adm_provincial_scholars.1.f: "The examiners and the merchants wait in separate halls for the governor’s answer."
 chi_adm_provincial_scholars.2.d: "The provincial Devout offer to steer the new curriculum through the academies if their examiners retain authority over religious instruction."
 chi_adm_provincial_scholars.2.f: "A clerk lays the proposed examination syllabus before the governor."
 chi_adm_provincial_scholars.3.d: "District examiners offer to help implement the governor’s reforms in return for a greater voice in the provincial academies."
 chi_adm_provincial_scholars.3.f: "The memorial bears the seals of the district examination halls."
 chi_adm_provincial_scholars.4.d: "Scholar-officials have gathered outside the yamen to protest the transfer of the academies to merchant patrons."
 chi_adm_provincial_scholars.4.f: "At the gate, the scholars read their petition aloud."
 chi_adm_provincial_scholars.7.t: "Foreign Manuals in the Yamen"
 chi_adm_provincial_scholars.7.d: "The commission has collected translated manuals on bookkeeping and surveying. The governor can put them to work in local offices or forward the commission’s findings to the imperial court."
 chi_adm_provincial_scholars.7.f: "The translators have left room in the margins for the clerks’ corrections."
 chi_adm_provincial_scholars.7.a: "Put the manuals to work in the districts."
 chi_adm_provincial_scholars.7.b: "Send our findings to the court."
 chi_adm_provincial_scholars.8.t: "The Provincial Examination Rolls"
 chi_adm_provincial_scholars.8.d: "District gentry and provincial examiners dispute who should maintain the examination rolls after the reform. Both offer to keep the academies open under the new settlement."
 chi_adm_provincial_scholars.8.f: "The governor turns to the rolls and asks who will sign them."
 chi_adm_provincial_scholars.8.a: "Keep the district patrons on the rolls."
 chi_adm_provincial_scholars.8.b: "Entrust the rolls to provincial examiners."
 chi_adm_henan_request: "Request Henan"
 chi_adm_henan_request_desc: "Request that Liangjiang return all of Henan to direct imperial administration. Commit #v 25#! Authority for up to six months. Liangjiang must consent before any land changes hands."
 chi_adm_henan_send_tt: "Send the imperial commission to Liangjiang. The standard compact grants permanent #g +10%#! Tax Capacity and #g -10%#! Bureaucracy Population Cost while Liangjiang remains a Qing viceroyalty."
 chi_adm_henan_req_subject: "Liangjiang is an eligible direct Qing viceroyalty."
 chi_adm_henan_req_owner: "Liangjiang owns all of Henan, holds it as a regular state, and has other territory to retain."
 chi_adm_henan_req_border: "A directly governed Qing state shares a land border with Henan. Treaty ports do not qualify."
 chi_adm_henan_req_peace: "Both governments are at peace and clear of committed diplomatic plays."
 chi_adm_henan_req_cases: "Liangjiang has no active integration, territorial compact, administrative conversion or enforcement case."
 chi_adm_henan_req_reform: "Qing has [GetTechnology('central_archives').GetName] or any variant of [GetLawType('law_appointed_bureaucrats').GetName]."
 chi_adm_henan_req_available: "There is no open Henan negotiation."
 chi_adm_henan_req_cooldown: "The waiting period has ended. Refusal imposes #v 24#! months. Withdrawal, expiry or rejection of enhanced compensation imposes #v 6#! months."
 chi_adm_henan_req_unused: "Henan has yet to be restored through this compact."
 chi_adm_henan_req_current: "The territorial, administrative and peace requirements are still met."
 chi_adm_henan_withdraw: "Withdraw Henan Request"
 chi_adm_henan_withdraw_desc: "Close negotiations without transferring Henan. A new request can be made in six months."
 chi_adm_henan_review_counter: "Review Henan Counteroffer"
 chi_adm_henan_review_counter_desc: "Decide whether to pay #v ?100,000#! in addition to the permanent administrative compact."
 chi_adm_henan_review_proposal: "Review Henan Request"
 chi_adm_henan_review_proposal_desc: "Reopen the court's request for Henan. Closing the request without a decision gives no consent."
 chi_adm_henan_status_awaiting: "Awaiting a decision from Liangjiang. #v [GetCountry('AHU').MakeScope.Var('chi_adm_henan_months').GetValue|0]#! monthly reviews remain."
 chi_adm_henan_status_delayed: "Liangjiang has requested time to reconcile the accounts. #v [GetCountry('AHU').MakeScope.Var('chi_adm_henan_months').GetValue|0]#! monthly reviews remain."
 chi_adm_henan_status_counter: "Liangjiang seeks enhanced compensation. #v [GetCountry('AHU').MakeScope.Var('chi_adm_henan_months').GetValue|0]#! monthly reviews remain."
 chi_adm_henan_workload: "Imperial Commission for Henan"
 chi_adm_henan_workload_desc: "The Grand Council has assigned officials to the negotiation over Henan's registers."
 chi_adm_henan_compensation: "Imperial Administrative Compensation"
 chi_adm_henan_compensation_desc: "The Board of Revenue has eased Liangjiang's fiscal and administrative obligations in recognition of the territory returned to the throne."
 chi_adm_henan_read_later: "Leave the matter open."
 chi_adm_henan_acknowledge: "Enter it in the registers."
 chi_adm_henan.1.t: "An Imperial Commission for Henan"
 chi_adm_henan.1.d: "The Grand Council asks Liangjiang to return Henan's magistrates, tax rolls and garrisons to direct imperial supervision. Surrendering the province will cost the viceroyalty a substantial share of its land and revenue. In return, the Board of Revenue offers permanent fiscal and administrative privileges for the territory that remains under the viceroy's seal.\n\nThe court will close the request after [ROOT.GetCountry.MakeScope.Var('chi_adm_henan_months').GetValue|0] monthly reviews without a decision."
 chi_adm_henan.1.f: "The imperial commissioner waits while the viceroy compares the land rolls with the year's receipts."
 chi_adm_henan.1.a: "Return Henan's registers to the throne."
 chi_adm_henan.1.b: "Petition for an additional treasury payment."
 chi_adm_henan.1.c: "Request time to reconcile the accounts."
 chi_adm_henan.1.e: "Defend the viceroyalty's commission."
 chi_adm_henan_standard_tt: "Transfer all of Henan to Qing and keep Liangjiang's other territories and subject pact. Liangjiang receives permanent #g +10%#! Tax Capacity, #g -10%#! Bureaucracy Population Cost, #g +3#! Loyalty and #g +5#! relations with Qing."
 chi_adm_henan_counter_tt: "Offer to transfer Henan if Qing accepts the standard compact and pays #v ?100,000#! on settlement."
 chi_adm_henan_delay_tt: "Request a single extension of twelve monthly reviews. The court will return for an answer during the final three."
 chi_adm_henan_refusal_tt: "Retain Henan. Qing cannot renew the request for #v 24 months#!."
 chi_adm_henan.2.t: "Liangjiang's Fiscal Counteroffer"
 chi_adm_henan.2.d: "The viceroy will surrender Henan if the Board of Revenue provides #v ?100,000#! to settle outstanding obligations in addition to the permanent privileges. Approval requires that sum in Qing gold reserves. The court must answer within [GetCountry('AHU').MakeScope.Var('chi_adm_henan_months').GetValue|0] monthly reviews."
 chi_adm_henan.2.a: "Approve the enhanced compact."
 chi_adm_henan.2.b: "Decline the additional payment."
 chi_adm_henan_enhanced_tt: "Pay Liangjiang #v ?100,000#! as Henan passes into direct imperial administration. Liangjiang also receives the permanent privileges of the standard compact."
 chi_adm_henan_reject_tt: "Close the negotiation. Liangjiang keeps Henan and Qing can submit another request in six months."
 chi_adm_henan.3.t: "Henan Returns to Imperial Administration"
 chi_adm_henan.3.d: "The Board of Revenue has entered Henan in the rolls of provinces governed directly by the throne. Liangjiang retains its remaining territories and the privileges guaranteed under the compact."
 chi_adm_henan.4.t: "Liangjiang Retains Henan"
 chi_adm_henan.4.d: "The viceroy has declined to surrender the registers. Henan remains under Liangjiang's seal, and the Grand Council will leave the matter for two years."
 chi_adm_henan.5.t: "The Henan Commission Closes"
 chi_adm_henan.5.d: "The commission has closed without a settlement. Henan's ownership is unchanged. The court may reopen the question in six months."
 chi_adm_henan.6.t: "The Court Declines the Fiscal Counteroffer"
 chi_adm_henan.6.d: "The Board of Revenue has declined the additional payment. The commission is closed and Henan remains under the viceroy's seal."

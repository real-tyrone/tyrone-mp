 chi_adm_reform_opium_1: "Restrict the Opium Trade"
 chi_adm_reform_opium_1_desc: "#bold When commissioned#!\nSpend @money!#v 12,000#! and commit #v 20#! Bureaucracy for up to #v 18#! monthly reports. Landowners approval falls by #r 1#! for a year if they are not already resisting. Gain some Radicals and lose 5 relations with Britain if it exists.\n\n#bold On completion#!\nRemove one third of the original addiction penalty. The third completed campaign removes the modifier. Staff return the 20 Bureaucracy.\n\n$chi_adm_reform_report_discounts_tt$"
 chi_adm_reform_opium_2: "Suppress Smuggling Networks"
 chi_adm_reform_opium_2_desc: "#bold When commissioned#!\nSpend @money!#v 16,000#! and commit #v 20#! Bureaucracy for up to #v 18#! monthly reports. Landowners approval falls by #r 1#! for a year if they are not already resisting. Reduce provincial Corruption by 2.\n\n#bold On completion#!\nRemove one third of the original addiction penalty. The third completed campaign removes the modifier. Staff return the 20 Bureaucracy.\n\n$chi_adm_reform_report_discounts_tt$"
 chi_adm_reform_opium_3: "Establish Treatment and Relief"
 chi_adm_reform_opium_3_desc: "#bold When commissioned#!\nSpend @money!#v 22,000#! and commit #v 20#! Bureaucracy for up to #v 24#! monthly reports. Industrialists approval falls by #r 1#! for a year if they are not already resisting. Gain some Loyalists.\n\n#bold On completion#!\nRemove one third of the original addiction penalty. The third completed campaign removes the modifier. Staff return the 20 Bureaucracy.\n\n$chi_adm_reform_report_discounts_tt$"
 chi_adm_reform_opium_4: "Reform Provincial Enforcement"
 chi_adm_reform_opium_4_desc: "#bold When commissioned#!\nSpend @money!#v 14,000#! and commit #v 20#! Bureaucracy for up to #v 18#! monthly reports. Landowners approval falls by #r 1#! for a year if they are not already resisting. Reduce provincial Corruption by 4.\n\n#bold On completion#!\nRemove one third of the original addiction penalty. The third completed campaign removes the modifier. Staff return the 20 Bureaucracy.\n\n$chi_adm_reform_report_discounts_tt$"
 je_chi_adm_reform_recovery: "Recovery from the Opium Wars"
 je_chi_adm_reform_recovery_reason: "The concessions demanded after imperial defeat have shaken confidence in provincial government. Restoring order, strengthening trade and defenses, and putting the accounts on a sound footing can rebuild that confidence before the imperial penalty expires."
 je_chi_adm_reform_recovery_progress: "[JournalEntry.GetCountry.MakeScope.Var('chi_adm_reform_recovery_done').GetValue|0] / 3 milestones completed"
 je_chi_adm_reform_recovery_stage_0: "#tooltippable #tooltip:chi_adm_reform_defeat_live_tt Imperial defeat#!#! lowers Legitimacy, Prestige and Standard of Living, and increases Turmoil effects, Mortality and Morale Loss. It fades over time.\nThe next milestone advances recovery to 1 of 3. The final milestone lifts the penalty."

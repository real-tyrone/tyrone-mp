 chi_adm_provincial_development_start_education_2: "Education — Tier 2"
 chi_adm_provincial_development_start_education_2_desc: "Translation bureaus and technical schools propose instruction in mathematics, surveying and foreign languages alongside the classical curriculum. Fund an 18-month provincial program to expand [concept_education_access]. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states.\n\n[GetStaticModifier('chi_adm_provincial_development_education_2').GetDesc]"
 chi_adm_provincial_development_education_2: "Educational Self-Strengthening — Tier 2"

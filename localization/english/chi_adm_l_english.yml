 chi_adm_government_titles_gov_manchurian_viceroyalty_desc: "The separate military jurisdictions of Shengjing, Jilin and Heilongjiang have been brought beneath a single imperial viceroy, extending civil administration over the Manchu ancestral homeland. The old banner obligations and regional compacts remain binding until separately renegotiated.\n\n$TRANSFER_OF_POWER_NAME_DESC$"


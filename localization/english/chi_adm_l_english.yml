 chi_adm_regional_works_minzhe_settlement: "The Taiwan Coastal Stations"
 chi_adm_regional_works_minzhe_settlement_desc: "The strait separating Fujian from Taiwan is no gentle passage. Winds, shoals and uncertain landings complicate the movement of military dispatches, coastal provisions and merchants' cargo. Small harbors depend upon pilots familiar with the coast and trusted by the neighboring townships.\n\nProvincial officers propose surveys and properly maintained stations. Township leaders offer to maintain their own landings if their customary authority is recognized. The governor must decide how firmly the imperial administration shall bind the two shores together."
 chi_adm_regional_works.6.t: "The Xining Supply Memorial"
 chi_adm_regional_works.6.d: "On the roads toward Xining, caravans supply the garrisons through pastures and highland markets far from the provincial capital. Mongol and Tibetan notables influence access to pack animals and mountain routes, while military officers demand reliable provisions for the frontier posts.\n\nMonastery estates offer beasts and guides in exchange for respect for their established terms. The provincial yamen may register the contracts and oversee delivery, or entrust the arrangements to local authorities whose cooperation cannot easily be compelled."
 chi_adm_regional_works.6.a: "Register the caravan contracts"
 chi_adm_regional_works.6.b: "Recognize the monasteries’ terms"
 chi_adm_regional_works.6.a_tt: "Commit #v 3%#! Bureaucracy for one year. -4 Corruption. The district gains +#v 3#! Infrastructure for two years."
 chi_adm_regional_works.6.b_tt: "Commit #v 20#! Authority for one year. +4 Autonomy."
 chi_adm_regional_works_shaangan_lead: "The Xining Supply Memorial\nA government office or unrest in Qinghai brings the caravan contracts before Shaan-Gan."
 chi_adm_regional_works_shaangan_settlement: "The Xining Supply Memorial"
 chi_adm_regional_works_shaangan_settlement_desc: "On the roads toward Xining, caravans supply the garrisons through pastures and highland markets far from the provincial capital. Mongol and Tibetan notables influence access to pack animals and mountain routes, while military officers demand reliable provisions for the frontier posts.\n\nMonastery estates offer beasts and guides in exchange for respect for their established terms. The provincial yamen may register the contracts and oversee delivery, or entrust the arrangements to local authorities whose cooperation cannot easily be compelled."
 chi_adm_regional_works.7.t: "Roads to the Yunnan Mines"
 chi_adm_regional_works.7.d: "The mines of Yunnan yield little revenue unless ore can reach smelters and market towns. Steep tracks and seasonal rains make transport costly, while unauthorized tolls multiply where officials no longer inspect the passes. Every extra levy is borne by the miners, carriers and merchants who keep the workings alive.\n\nLocal brokers offer to maintain the roads in exchange for control over toll collection. Mining households ask the governor to send surveyors instead, lest every cart of ore answer to another gatekeeper."
 chi_adm_regional_works.7.a: "Survey the mining roads"
 chi_adm_regional_works.7.b: "Recognize the brokers’ toll agreements"
 chi_adm_regional_works.7.a_tt: "Commit #v 3%#! Bureaucracy for one year. -3 Corruption. The district gains +#v 3#! Infrastructure for two years."
 chi_adm_regional_works.7.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."
 chi_adm_regional_works_yungui_lead: "Roads to the Yunnan Mines\nTwo levels of iron or lead mines in Yunnan bring the transport petition to Yun-Gui."
 chi_adm_regional_works_yungui_settlement: "Roads to the Yunnan Mines"
 chi_adm_regional_works_yungui_settlement_desc: "The mines of Yunnan yield little revenue unless ore can reach smelters and market towns. Steep tracks and seasonal rains make transport costly, while unauthorized tolls multiply where officials no longer inspect the passes. Every extra levy is borne by the miners, carriers and merchants who keep the workings alive.\n\nLocal brokers offer to maintain the roads in exchange for control over toll collection. Mining households ask the governor to send surveyors instead, lest every cart of ore answer to another gatekeeper."
 chi_adm_regional_works.8.t: "The Chongqing Transit Accounts"
 chi_adm_regional_works.8.d: "Barges reaching Chongqing from the upper Yangtze and the roads of Sichuan encounter a succession of toll stations, brokers and local receipts. Merchants complain that the same cargo may be assessed repeatedly before reaching its purchaser; county offices defend the charges that sustain their river landings.\n\nManufacturers petition for one published schedule under the provincial seal. Shippers offer to settle rates among themselves if the yamen refrains from further interference. The governor must decide whose accounts shall govern the trade."
 chi_adm_regional_works.8.a: "Publish a common schedule"
 chi_adm_regional_works.8.b: "Leave the schedule to shippers"
 chi_adm_regional_works.8.a_tt: "Commit #v 3%#! Bureaucracy for one year. -5 Corruption. The district gains #v -3#! percentage points of Tax Waste for two years."
 chi_adm_regional_works.8.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."
 chi_adm_regional_works_sichuan_lead: "The Chongqing Transit Accounts\nA railway or unrest in Chongqing brings the toll disputes to Sichuan."
 chi_adm_regional_works_sichuan_settlement: "The Chongqing Transit Accounts"
 chi_adm_regional_works_sichuan_settlement_desc: "Barges reaching Chongqing from the upper Yangtze and the roads of Sichuan encounter a succession of toll stations, brokers and local receipts. Merchants complain that the same cargo may be assessed repeatedly before reaching its purchaser; county offices defend the charges that sustain their river landings.\n\nManufacturers petition for one published schedule under the provincial seal. Shippers offer to settle rates among themselves if the yamen refrains from further interference. The governor must decide whose accounts shall govern the trade."
 chi_adm_regional_works.9.t: "The Shanxi Remittance Houses"
 chi_adm_regional_works.9.d: "The merchant houses of Shanxi have learned to move silver through drafts and remittance offices, sparing caravans the peril of carrying coin between distant markets. Their networks depend upon reputation and family credit, but officials charged with the provincial treasury are uneasy with accounts they cannot inspect.\n\nThe yamen proposes certified books and audited guarantees. The bankers answer that their pledges are honored across the empire precisely because commercial trust has not been entrusted to government clerks. The governor must decide whose word will stand behind the remittance."
 chi_adm_regional_works.9.a: "Require audited remittance books"
 chi_adm_regional_works.9.b: "Recognize the bankers’ guarantees"
 chi_adm_regional_works.9.a_tt: "Commit #v 3%#! Bureaucracy for one year. -5 Corruption. The district gains #v -3#! percentage points of Tax Waste for two years."
 chi_adm_regional_works.9.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."
 chi_adm_regional_works_shanxi_lead: "The Shanxi Remittance Houses\nBanking allows Shanxi officials to negotiate with the remittance houses."
 chi_adm_regional_works_shanxi_settlement: "The Shanxi Remittance Houses"
 chi_adm_regional_works_shanxi_settlement_desc: "The merchant houses of Shanxi have learned to move silver through drafts and remittance offices, sparing caravans the peril of carrying coin between distant markets. Their networks depend upon reputation and family credit, but officials charged with the provincial treasury are uneasy with accounts they cannot inspect.\n\nThe yamen proposes certified books and audited guarantees. The bankers answer that their pledges are honored across the empire precisely because commercial trust has not been entrusted to government clerks. The governor must decide whose word will stand behind the remittance."
 chi_adm_regional_works.10.t: "The Lower River Petition"
 chi_adm_regional_works.10.d: "Along the lower Yellow River, the neglect of a single embankment can imperil whole districts of fields and villages. Local elders petition for grain relief and repairs, while engineers warn that hurried works may merely drive the river's force toward neighboring settlements.\n\nThe provincial office can dispatch surveyors and relief officers to coordinate the response, or leave grain distribution to village committees acquainted with each household's needs. Whatever the decision, the people will remember it when the waters rise again."
 chi_adm_regional_works.10.a: "Send engineers and relief officers"
 chi_adm_regional_works.10.b: "Give the relief committees discretion"
 chi_adm_regional_works.10.a_tt: "Commit #v 3%#! Bureaucracy for one year. +5 Loyalty. The district gains #v -12%#! Turmoil Effects for two years."
 chi_adm_regional_works.10.b_tt: "Commit #v 20#! Authority for one year. +4 Autonomy."
 chi_adm_regional_works_shandong_lead: "The Lower River Petition\nUnrest in Shandong brings the lower river petition to the governor."
 chi_adm_regional_works_shandong_settlement: "The Lower River Petition"
 chi_adm_regional_works_shandong_settlement_desc: "Along the lower Yellow River, the neglect of a single embankment can imperil whole districts of fields and villages. Local elders petition for grain relief and repairs, while engineers warn that hurried works may merely drive the river's force toward neighboring settlements.\n\nThe provincial office can dispatch surveyors and relief officers to coordinate the response, or leave grain distribution to village committees acquainted with each household's needs. Whatever the decision, the people will remember it when the waters rise again."
 chi_adm_regional_works.11.t: "The Leagues and Banners"
 chi_adm_regional_works.11.d: "Across the Mongol steppe, seasonal pastures are governed by banners and leagues whose rights endure in charters, grazing customs and agreements among noble houses. As herds move between wells and wintering grounds, overlapping claims threaten the peace of neighboring banners.\n\nImperial officials propose fresh surveys and a common register. The princes answer that pasture disputes have long been judged through their own councils and obligations. The administration must decide how far the court's accounting should reach into the affairs of the steppe."
 chi_adm_regional_works.11.a: "Survey the disputed pastures"
 chi_adm_regional_works.11.b: "Recognize the banner registers"
 chi_adm_regional_works.11.a_tt: "Commit #v 3%#! Bureaucracy for one year. -3 Corruption. The district gains +#v 3#! Infrastructure for two years."
 chi_adm_regional_works.11.b_tt: "Commit #v 20#! Authority for one year. +4 Autonomy."
 chi_adm_regional_works_mongolia_lead: "The Leagues and Banners\nPastoral development or unrest in Hinggan brings the banner delegates to Mongolia."
 chi_adm_regional_works_mongolia_settlement: "The Leagues and Banners"
 chi_adm_regional_works_mongolia_settlement_desc: "Across the Mongol steppe, seasonal pastures are governed by banners and leagues whose rights endure in charters, grazing customs and agreements among noble houses. As herds move between wells and wintering grounds, overlapping claims threaten the peace of neighboring banners.\n\nImperial officials propose fresh surveys and a common register. The princes answer that pasture disputes have long been judged through their own councils and obligations. The administration must decide how far the court's accounting should reach into the affairs of the steppe."
 chi_adm_regional_works.12.t: "The Ili Patrol Roads"
 chi_adm_regional_works.12.d: "The roads leading to the Ili garrisons serve soldiers, herders and caravan merchants alike. Grain and horses must reach scattered forts, yet commanders complain that levies and inspections vary from one pass to another. Traders promise dependable supplies if they can rely upon fixed terms.\n\nSome officers favor patrol roads and markets placed under direct supervision; others prefer contracts negotiated with local guides and trading houses. More than commerce is at stake: a garrison without reliable provisions cannot secure the western marches."
 chi_adm_regional_works.12.a: "Mark out the patrol and market roads"
 chi_adm_regional_works.12.b: "Recognize the frontier contracts"
 chi_adm_regional_works.12.a_tt: "Commit #v 3%#! Bureaucracy for one year. +4 Loyalty. The district gains +#v 3#! Infrastructure for two years."
 chi_adm_regional_works.12.b_tt: "Commit #v 20#! Authority for one year. +4 Autonomy."
 chi_adm_regional_works_ili_lead: "The Ili Patrol Roads\nGarrison expansion or unrest in Dzungaria brings the border supply petition to Ili."
 chi_adm_regional_works_ili_settlement: "The Ili Patrol Roads"
 chi_adm_regional_works_ili_settlement_desc: "The roads leading to the Ili garrisons serve soldiers, herders and caravan merchants alike. Grain and horses must reach scattered forts, yet commanders complain that levies and inspections vary from one pass to another. Traders promise dependable supplies if they can rely upon fixed terms.\n\nSome officers favor patrol roads and markets placed under direct supervision; others prefer contracts negotiated with local guides and trading houses. More than commerce is at stake: a garrison without reliable provisions cannot secure the western marches."
 chi_adm_regional_works.13.t: "The Shengjing Banner Registers"
 chi_adm_regional_works.13.d: "The banners of Shengjing, Jilin and Heilongjiang maintain obligations older than many offices of civil government. Their muster rolls name households expected to furnish soldiers and supplies, while custodians of imperial estates insist that ancestral privileges must not disappear into ordinary revenue accounts.\n\nAs northeastern garrisons demand more dependable provisions, the administration may open the rolls to closer inspection or affirm the custodians' customary rights. Even the Manchu homeland must reconcile the demands of military readiness with the privileges on which its institutions were founded."
 chi_adm_regional_works.13.a: "Audit the supply rolls"
 chi_adm_regional_works.13.b: "Confirm the banner custodians’ privileges"
 chi_adm_regional_works.13.a_tt: "Commit #v 3%#! Bureaucracy for one year. -4 Corruption. The district gains #v -3#! percentage points of Tax Waste for two years."
 chi_adm_regional_works.13.b_tt: "Commit #v 20#! Authority for one year. +3 Autonomy."
 chi_adm_regional_works_manchuria_lead: "The Shengjing Banner Registers\nGarrison expansion or unrest in Shengjing brings the banner rolls up for review."
 chi_adm_regional_works_manchuria_settlement: "The Shengjing Banner Registers"
 chi_adm_regional_works_manchuria_settlement_desc: "The banners of Shengjing, Jilin and Heilongjiang maintain obligations older than many offices of civil government. Their muster rolls name households expected to furnish soldiers and supplies, while custodians of imperial estates insist that ancestral privileges must not disappear into ordinary revenue accounts.\n\nAs northeastern garrisons demand more dependable provisions, the administration may open the rolls to closer inspection or affirm the custodians' customary rights. Even the Manchu homeland must reconcile the demands of military readiness with the privileges on which its institutions were founded."
 chi_adm_regional_works.101.t: "Kaiping Mining Company"
 chi_adm_regional_works.101.d: "At Kaiping, the coal seams promise fuel for northern workshops, steamships and the growing demands of modern transport. But a large mine requires pumps, engineers, haulage routes and credit on a scale unfamiliar to the older workings. Merchant investors see opportunity; cautious officials see an enterprise whose debts might fall upon the treasury.\n\nThe proposed company seeks a charter and reliable transport arrangements. Court examiners want the accounts opened before imperial favor is pledged, while provincial reformers insist that China cannot depend forever upon imported fuel and machinery."
 chi_adm_regional_works_kaiping_button: "Kaiping Mining Company"
 chi_adm_regional_works_kaiping_button_desc: "Endorse the works as part of your Economy program. Ratification gives the site +#v 4#! Infrastructure for four years. Choose a provincial subscription or submit accounts for imperial review."
 chi_adm_regional_works_kaiping_requirements: "Incorporated Zhili with five coal mine levels, the established Kaiping Mining Company and Investment Banks, Water-Tube Boiler and Railways. The site’s Economy Tier 3 must be underway or complete and the province must be able to fund the works."

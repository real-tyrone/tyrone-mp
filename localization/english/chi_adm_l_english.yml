 chi_adm_provincial_development_request_4: "Request Military Farm Relief"
 chi_adm_provincial_development_request_4_desc: "Extend the old tuntian practice of military farming: soldiers on the provincial payroll help cultivate subsistence fields and maintain pasture and fodder stores. $chi_adm_provincial_development_warrant_autonomy_tt$"
 chi_adm_provincial_development_request_4_modifier_tt: "If approved, gain [GetStaticModifier('chi_adm_provincial_development_package_4').GetName|v].\n[GetStaticModifier('chi_adm_provincial_development_package_4').GetDesc]"
 chi_adm_provincial_development_package_4: "Military Farm Relief"

 chi_adm_provincial_development_request_5: "Request Military Suppression"
 chi_adm_provincial_development_request_5_desc: "Dispatch troops to guard roads and market towns and disperse disorder where magistrates cannot keep the peace. Such measures may restore order, but violent encounters raise mortality where turmoil is severe. $chi_adm_provincial_development_warrant_autonomy_tt$"
 chi_adm_provincial_development_request_5_modifier_tt: "If approved, gain [GetStaticModifier('chi_adm_provincial_development_package_5').GetName|v].\n[GetStaticModifier('chi_adm_provincial_development_package_5').GetDesc]"
 chi_adm_provincial_development_package_5: "Military Suppression"

 chi_adm_provincial_development_request_6: "Negotiate Local Tax Concessions"
 chi_adm_provincial_development_request_6_desc: "Permit county and local authorities to retain a larger share of assessed revenues in exchange for their cooperation during the crisis. Granting the concession begins a #v two-year#! cooldown for this petition. $chi_adm_provincial_development_warrant_autonomy_tt$"
 chi_adm_provincial_development_request_6_modifier_tt: "If Qing approves the petition:\n[GetStaticModifier('chi_adm_provincial_development_package_6').GetName|v] for #v two years#!\n[GetStaticModifier('chi_adm_provincial_development_package_6').GetDesc]"
 chi_adm_provincial_development_request_6_court_tt: "$chi_adm_provincial_development_request_6_modifier_tt$\nThe province gains #v 10%#! [concept_loyalists]."

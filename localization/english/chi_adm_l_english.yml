 chi_adm_provincial_development_start_education_1: "Education — Tier 1"
 chi_adm_provincial_development_start_education_1_desc: "County schools and the established academies seek new instructors, books and broader access to learning. Fund a 12-month provincial program to expand [concept_education_access]. Weekly expense is #v 20%#! of provincial income, weighted by the population in project states.\n\n[GetStaticModifier('chi_adm_provincial_development_education_1').GetDesc]"
 chi_adm_provincial_development_education_1: "Educational Self-Strengthening — Tier 1"

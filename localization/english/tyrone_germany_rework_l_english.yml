  bismarck_grant_concessions:0 "Grant Concessions"
  bismarck_grant_concessions_desc:0 "Make concessions during ongoing reforms, easing Socialist agitation at the cost of strengthening their influence."
  bismarck_force_reform_1:0 "Force Health Reform"
  bismarck_force_reform_1_desc:0 "Abandon the current reform and impose a state-directed health system aligned with Bismarck’s vision."
  bismarck_force_reform_2:0 "Force Regulatory Reform"
  bismarck_force_reform_2_desc:0 "Override the current reform and enforce stricter state regulation of labor conditions."
  bismarck_force_reform_3:0 "Force Pension Reform"
  bismarck_force_reform_3_desc:0 "Replace the current reform with a state-controlled pension system designed under Bismarck’s guidance."

  je_bismarck_reform:0 "Otto Von Bismarck’s Reforms"
  je_bismarck_reform_reason:0 "The rise of #gold Socialism#! threatens to overturn the delicate order of the realm. The workers grow restless, their voices carried by pamphlets, unions, and firebrand orators who speak of revolution rather than reform. \n\nYet repression alone will not suffice. To preserve [ROOT.GetCountry.GetName], concessions must be made, carefully measured and firmly guided. \n[GetInstitutionType('institution_social_security').GetName], [GetInstitutionType('institution_workplace_safety').GetName], and [GetInstitutionType('institution_health_system').GetName] may yet bind the worker to the nation, rather than to the #gold $movement_communist$#!. \n\nOnly through [SCOPE.sCharacter('bismarck_loc_character_scope').GetFullName]’s reforms can the soil be made barren for #gold Socialism#!, and the authority of the state secured."
  bismarck_je_status_desc1:0 "Bismarck has yet to arrive to Germany..."
  bismarck_je_status_desc2:0 "Socialist tension is rising dangerously… #bold unforeseen events may occur#!."
  bismarck_je_status_desc3:0 "Socialist movements are under control, the nation remains relatively stable."  

  bismarckevents.1.t:0 "The Iron Chancellor"
  bismarckevents.1.d:0 "A nobleman named [SCOPE.sCharacter('bismarck_scope').GetFullName] has risen to a prominent position among the [ROOT.GetCountry.GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('junkers').GetName]. Advocating for German national unity and political pragmatism, he offers his services to the state."
  bismarckevents.1.f:0 ""I shall soon be compelled to undertake the conduct of the [ROOT.GetCountry.GetAdjectiveNoFormatting] Government. My first care will be to reorganize the army, with or without the help of the Landtag. As soon as the army shall have been brought into such a condition as to inspire respect, I shall seize the first best pretext to declare war against Austria, dissolve the German Diet, subdue the minor States, and give national unity to Germany under [ROOT.GetCountry.GetAdjectiveNoFormatting] leadership.""
  bismarckevents.1.a:0 "Appoint Bismarck as Chancellor."
  bismarckevents.1.b:0 "Realpolitik is not the right policy."

  bismarckevents.2.t:0 "@landowners! The Iron Hand of Reform"
  bismarckevents.2.d:0 "Under the guidance of [SCOPE.sCharacter('bismarck_scope').GetFullName], the social question has been brought to heel. The [ROOT.GetCountry.GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('junkers').GetName] and the [ROOT.GetCountry.GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('industrialists').GetName] stand aligned behind the Chancellor, as reform is shaped not by agitation, but by the will of the state.\n\nConcessions are granted where necessary, yet always within a framework of order. The [GetPopType('laborers').GetName] are provided for, but never empowered beyond their station."
  bismarckevents.2.f:0 "“Give the worker the right to work as long as he is healthy, assure him care when he is sick, and provide for him when he is old. If the state does this, then the socialist will find the ground less fertile.”"
  bismarckevents.2.a:0 "Secure Bismarck’s reforms."
  bismarckevents.2.b:0 "Enforce order through strength." 

  bismarckevents.3.t:0 "@intelligentsia! Socialist Reforms"
  bismarckevents.3.d:0 "Though [SCOPE.sCharacter('bismarck_scope').GetFullName] remains the architect of the nation’s policy, the intelligentsia and workers have left their mark. The reforms, once purely @landowners! [GetIdeology('ideology_bismarck_hierarchic_ig_landowners').GetName], now carry the influence of @trade_unions! [GetIdeology('ideology_socialist_movement').GetName] thought.\n\nThe [ROOT.GetCountry.GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('intelligentsia').GetName] emerge empowered, their internationalist ideas spreading as the state accommodates the demands of the [GetPopType('laborers').GetName]."
  bismarckevents.3.f:0 "“Even iron can be shaped when pressed from both sides.”"
  bismarckevents.3.a:0 "Keep the Reform in check."
  bismarckevents.3.b:0 "Let the Reforms Reach the Workers."

  bismarckevents.4.t:0 "@trade_unions! The Collapse of Bismarck’s Reforms"
  bismarckevents.4.d:0 "The efforts to contain the rising tide of #gold $movement_communist$#! agitation have failed. Reform has stalled, opposition has hardened, and the state finds itself without direction.\n\n[SCOPE.gsInterestGroup('intelligentsia').GetName] now rally under the banner of the #gold Revolutionäre Arbeiterfront#!, while [SCOPE.gsInterestGroup('commies').GetName] unite as the #gold Einheitsfrontlied#!, their cause no longer one of reform, but of struggle against the established order."
  bismarckevents.4.f:0 "“From the workshops and the streets arises a new order, unbound by crown or creed. Not of nations, but of workers united, their cause knows no border and no master.”"  
  bismarckevents.4.a:0 "The agitation can no longer be contained"

  bismarckevents.5.t:0 "@trade_unions! Bismarck’s Reforms Delayed"
  bismarckevents.5.d:0 "The tide of agitation grows unchecked as the promised reforms have failed to arrive in time. The state struggles to maintain control, and the workers’ voice rises in protest.\n\n[SCOPE.gsInterestGroup('intelligentsia').GetName] rally as the #gold Revolutionäre Arbeiterfront#!, while [SCOPE.gsInterestGroup('commies').GetName] organize under the #gold Einheitsfrontlied#!, their energy now channeled into building a new course for the nation."
  bismarckevents.5.f:0 "“The halls of power have hesitated, and in the streets the future is being forged. From discontent comes organization; from delay, the promise of a new order.”"
  bismarckevents.5.a:0 "The reforms have arrived too late"

  bismarckevents.6.t:0 "[SCOPE.sCharacter('bismarck_scope').GetFullName]’s Reforms"
  bismarckevents.6.d:0 "[SCOPE.sCharacter('bismarck_scope').GetFullName] has proposed #yellow Reforms#! across [ROOT.GetCountry.GetName]. These measures, designed to stabilize society and curb [GetIdeology('ideology_socialist_movement').GetName] influence, stir debate among the [SCOPE.gsInterestGroup('intelligentsia').GetName] and [SCOPE.gsInterestGroup('commies').GetName]. Tension grows as the [GetPopType('laborers').GetName] watches whether these reforms will succeed or falter."
  bismarckevents.6.f:0 "From Berlin to the provinces, whispers circulate of new social programs and regulatory measures. While some hope for order, others see opportunity for collective action, marking the first signs of a potential rise in organized socialist movements."
  bismarckevents.6.a:0 "The reforms must be carried out without delay"

  bismarckevents.7.t:0 "Rhineland Labor Unrest"
  bismarckevents.7.d:0 "Workers in the Rhineland have begun general strikes, demanding better conditions. The government must decide how to respond."
  bismarckevents.7.f:0 ""
  bismarckevents.7.a:0 "Let the Workers Strike"
  bismarckevents.7.b:0 "Crush the Strikes with Force"

  bismarckevents.8.t:0 "Silesian Weavers’ Uprising"
  bismarckevents.8.d:0 "Workers in Lower and Upper Silesia are on strike due to harsh conditions and the effects of free trade. Without intervention, tensions are escalating rapidly."
  bismarckevents.8.f:0 ""
  bismarckevents.8.a:0 "Let them strike"
  bismarckevents.8.b:0 "Break the strikes"
  bismarckevents.8.c:0 "Offer higher wages"

  bismarckevents.9.t:0 "Call for the Right to Associate"
  bismarckevents.9.d:0 "Workers and intellectuals across [ROOT.GetCountry.GetName] demand the right to organize. The old authorities resist, but the agitation is spreading, fueled by the #gold $movement_communist$#! and growing unrest. Without legal recognition, strikes and secret assemblies threaten to destabilize the state."
  bismarckevents.9.f:0 "Secret assemblies are held in workshops and cafés, where radicals and thinkers share their ideas. Whispers of a new order grow louder, challenging the old hierarchies. The demand for the right to organize is no longer a mere petition—it has become a symbol of rising influence and potential upheaval."
  bismarckevents.9.a:0 "Grant the Workers’ what they want."
  bismarckevents.9.b:0 "Suppress this Movement with force"

  bismarckevents.10.t:0 "Rising Fury Against Bismarck"
  bismarckevents.10.d:0 "Bismarck’s reforms have enraged the radicals. Tensions in the cities are at a boiling point, and the government struggles to contain the unrest."
  bismarckevents.10.f:0 "The streets burn with unrest, and whispers of revolt stir among the radicals."
  bismarckevents.10.a:0 "Bismarck Exits the Stage"
  bismarckevents.10.b:0 "Let the Radicals Vent"

  bismarckevents.11.t:0 "Assassination of [SCOPE.sCharacter('bismarck_scope').GetFullName]"
  bismarckevents.11.d:0 "[SCOPE.sCharacter('bismarck_scope').GetFullName] has been struck down. With his guiding hand gone, #gold $movement_communist$#! sweep through [ROOT.GetCountry.GetName], seizing streets and stirring unrest. [ROOT.GetCountry.GetAdjectiveNoFormatting] [concept_law] failed to contain the tide, and the old order trembles. Germany will never be the same again; a new, volatile era of political struggle dawns."
  bismarckevents.11.f:0 "The assassination ignites chaos and opportunity across all of Germany."
  bismarckevents.11.a:0 "Bismarck falls—[ROOT.GetCountry.GetName] changes forever"


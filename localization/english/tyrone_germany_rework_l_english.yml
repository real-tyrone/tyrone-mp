  bismarck_character_exists:0 "Bismarck is the Chancellor of Germany"
  event_bismarck_preview.3_tt:0 "@landowners! #gold #b Completed on Paternalistic Side:#!#! \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] gains the [GetIdeology('ideology_bismarck_paternalistic_ig_landowners').GetName] $ideology$. \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] gains the [GetIdeology('ideology_bismarck_hierarchic_ig_landowners').GetName] $ideology$. \n  • [SCOPE.gsInterestGroup('industrialists_ig').GetName] gains the [GetIdeology('ideology_bismarck_individualist_ig_industrialist').GetName] $ideology$. \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] and [SCOPE.gsInterestGroup('industrialists_ig').GetName] get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_ig_bonus_tt $ig_bonus_bismarck$#! \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] and [SCOPE.gsInterestGroup('industrialists_ig').GetName] gain new IG traits. \n \n #b Choose either:#! \n  • [ROOT.GetCountry.GetName] receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_reform1_bonus_tt $germany_bismarck_reform_1$#!\n  • [ROOT.GetCountry.GetName] receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_reform2_bonus_tt $germany_bismarck_reform_2$#! \n\n\n@intelligentsia! #red #b Completed on Socialist Side:#!#! \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] gains the [GetIdeology('ideology_bismarck_paternalistic_ig_landowners').GetName] $ideology$. \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] gains the [GetIdeology('ideology_bismarck_hierarchic_ig_landowners').GetName] $ideology$. \n  • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] gains the [GetIdeology('ideology_bismarck_socialist').GetName] $ideology$. \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] and [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_ig_bonus_tt $ig_bonus_bismarck$#! \n  • [SCOPE.gsInterestGroup('landowners_ig').GetName] and [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] gain new IG traits. \n  • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] will be renamed #v Internationalist#! \n  • A [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] [GetIdeology('ideology_communist').GetName] agitator appears \n \n #b Choose either:#! \n  • [ROOT.GetCountry.GetName] receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_reform3_bonus_tt $germany_bismarck_reform_3$#!\n  • [ROOT.GetCountry.GetName] receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_reform4_bonus_tt $germany_bismarck_reform_4$#!"
  event_bismarck_preview.4_tt:0 "@trade_unions! #red #b Failed to Communist Tensions:#!#! \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] gains the [GetIdeology('ideology_bismarck_vanguardist').GetName] $ideology$ \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] and [SCOPE.gsInterestGroup('trade_unions_ig').GetName] get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_ig_debuff_tt $ig_debuff_bismarck$#! \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] gain new IG traits. \n • A [SCOPE.gsInterestGroup('trade_unions_ig').GetName] [GetIdeology('ideology_communist').GetName] IG leader appears \n • A [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] [GetIdeology('ideology_communist').GetName] agitator appears \n • #gold $movement_communist$#! gets #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_germany_rise_of_internationalist_movement_bonus_tt $germany_rise_of_internationalist_movement$#! \n • [SCOPE.gsInterestGroup('trade_unions_ig').GetName] will be renamed #v Einheitsfrontlied#!  \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] will be renamed #v Revolutionäre Arbeiterfront#! \n \n • [ROOT.GetCountry.GetName] receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_germany_rise_of_internationalist_bonus_tt $germany_rise_of_internationalist$#!"
  event_bismarck_preview.5_tt:0 "@trade_unions! #red #b Failed to Communist Tensions:#!#! \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] gains the [GetIdeology('ideology_bismarck_vanguardist').GetName] $ideology$ \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] gets #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_ig_debuff_tt $ig_debuff_bismarck$#! \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] gain new IG traits. \n • A [SCOPE.gsInterestGroup('trade_unions_ig').GetName] [GetIdeology('ideology_communist').GetName] IG leader appears \n • A [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] [GetIdeology('ideology_communist').GetName] agitator appears \n • #gold $movement_communist$#! gets #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_germany_rise_of_internationalist_movement_bonus_tt $germany_rise_of_internationalist_movement$#! \n • [SCOPE.gsInterestGroup('trade_unions_ig').GetName] will be renamed #v Einheitsfrontlied#!  \n • [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] will be renamed #v Revolutionäre Arbeiterfront#!  \n \n • [ROOT.GetCountry.GetName] receives #tooltippable;tooltip:[GetPlayer.GetTooltipTag],bismarck_germany_rise_of_internationalist_bonus_tt $germany_rise_of_internationalist$#!"



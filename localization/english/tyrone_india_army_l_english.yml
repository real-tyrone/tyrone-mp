l_english:
 amendment_company_training_restrictions:0 "Company Training Restrictions"
 amendment_company_training_restrictions_desc:0 "The Company controls military instruction and restricts the exchange of new methods, keeping the regiments dependent on its officers."
 je_tyrone_promise_army_training:0 "An Army of Its Own"
 je_tyrone_promise_army_training_reason:0 "The #v Company#! reserves the training of Indian troops to an establishment wary of independent officers and unfamiliar methods. Its restrictions have outlasted the small territorial forces they were meant to govern.\n\nA standing army of #v 250 battalions#! gives military reformers the means to challenge that arrangement. The levy system must give way, and authority over the regiments must pass beyond [GetLawType('law_chartered_appointed_bureaucrats').GetName]."
 tyrone_promise_army_training_row:0 "An Army of Its Own"

    je_scandinavian_unification_idea_trigger_desc:0 "Has completed the Scandinavian Unification [concept_journal_entry]"
    je_group_scandinavian_unification:0 "Scandinavian Unification"
    je_of_two_crowns:0 "Of Two Crowns"
    je_of_two_crowns_lobby:0 "The unified crowns of Sweden and Norway since the Convention of Moss in 1814 have proven the value of a common monarch and common foreign policy. The union must bring the remaining Nordic countries to heel, or be forgotten to the sands of time."
    je_of_two_crowns_reason:0 "The Swedish-Norwegian Union brought forth from the Convention of Moss in 1814 has proven the strength of a unified Nordic people under one crown. It is time to expand the influence of the union to secure a future for the Nordic peoples."
    two_crowns_unite.1.t:0 "The Danish Throne"
    two_crowns_unite.1.d:0 "The Danish crown has accepted their position beneath the Swedish."
    two_crowns_unite.1.f:0 "With the newfound subservience of the Danish crownlands, the only question remaining is how we should treat them."
    two_crowns_unite.1.a:0 "Retain the throne, and seat our king upon it. The two crowns shall become three."
    two_crowns_shatter.1.t:0 "A Crown, Lost"
    two_crowns_shatter.1.d:0 "The Danish throne has been destroyed."
    two_crowns_shatter.1.f:0 "With the Danish monarchy uprooted from their homeland, the Danes now stand without a monarch above them."
    two_crowns_shatter.1.a:0 "There is one option left."
    denmark_is_destroyed:0 "Denmark has been removed from the global stage."
    je_unification_of_three_crowns:0 "The Unification of Crowns"
    je_unification_of_three_crowns_lobby:0 "Resecuring rulership over our sibling crowns has granted us the path to unifying a greater Scandinavian nation, with us at the head."
    je_unification_of_three_crowns_reason:0 "As we maintain the loyalty of our sibling nations, it is only a matter of time until Scandinavia is born."
    je_three_crowns_bar_desc:0 "Unification"
    je_three_crowns_bar:0 "Unification"
    modifier_exerting_royal_authority:0 "Exerting Royal Authority"
    modifier_securing_scandinavia_viking_spirit:0 "Viking Spirit"
    scandinavia_partially_united:0 "We have unified the thrones of Sweden, Norway and Denmark under one ruler."
    scandinavia_partially_united_alt:0 "We have unified the thrones of Sweden, Norway and Finland under one ruler."
    scandinavian_crowns_rebel:0 "We have failed in our bid to unify Scandinavia by not sufficiently appeasing the people, and our sibling crowns."
    je_securing_scandinavia:0 "Securing Scandinavia"
    scandinavia_secured:0 "The Scandinavia #yellow Strategic Region#! is under our rulership."
    je_securing_scandinavia_reason:0 "We must now assert our control over the Scandinavian #yellow Strategic Region#! if we are to properly unify the Norwegian peoples."
    secured_scandinavia_desc:0 "With the secured seats of power of the Three Crowns, we have laid the groundwork for #yellow Scandinavian Unification#!"
    scandinavian_unification.1.t:0 "One Nation, One Flag"
    scandinavian_unification.1.d:0 "We have united our crowns into one uniform national body."
    scandinavian_unification.1.f:0 "United once, and for all. Scandinavia is born. Now we must decide who truly brought our dream into reality."
    scandinavian_unification.1.a:0 "Accredit the Royal Army for her dutiful service."
    scandinavian_unification.1.b:0 "Accredit the loyal elements of our intellegentsia."
    scandinavian_unification.1.c:0 "Accredit the industrialists and the private sector for their contributions."
    je_scandinavia_missing_crown:0 "The Finnic Crown"
    je_scandinavia_missing_crown_reason:0 "We have not forgotten the defeat we suffered during the Napoleonic Wars that led to the loss of the Grand Duchy of Finland. It is time we rectify this mistake."
    scandinavia_finland_reclaimed:0 "We have reclaimed the Grand Duchy of Finland for ourselves."
    je_scandinavia_missing_crown_completion_context:0 "If Finland is our [concept_subject], we will immediately integrate their crown alongside the Finnish people."
    scandinavia_ruler_popularity:0 "[concept_popularity] of our [concept_ruler]"
    scandinavia_legitimate_ruler:0 "Our Government [concept_legitimacy]"
    scandinavia_three_crowns_unification_progress:0 "We have completed the process of unifying Scandinavia under our rulership."
    scandinavia_unification_context:0 ""
    scandinavia_crown_liberty_high:0 "High Subject [concept_liberty_desire]"
    scandinavia_crown_liberty_low:0 "Low Subject [concept_liberty_desire]"
    scandinavia_monarchist_clout:0 "Clout of [concept_interest_group]#o s #!supporting #yellow Monarchy #!"
    scandinavia_anti_monarchist_clout:0 "Clout of [concept_interest_group]#o s #!disapproving #yellow Monarchy #!"
    scandinavia_no_crowns:0 "We have no crowns to unify with."
    shattered_crown.1.t:0 "The Broken Dream"
    shattered_crown.1.d:0 "Either by external meddling, or internal strife, our sibling crowns have broken free from our hegemony."
    shattered_crown.1.f:0 "Unilaterally, all of our constituents have declared independence from the Swedish crown. Our dream to unite our crowns has been squandered."
    shattered_crown.1.a:0 "As quick as our dream was born, it died."
    modifier_royal_authority_collapsed:0 "Collapse of Royal Authority"
    je_scandinavia_missing_crown_b:0 "The Danish Crown"
    je_scandinavia_missing_crown_b_reason:0 "While we are a unified nation, the Scandinavian people are entitled to unify wholly and completely. Securing Denmark to ensure the future prosperity and security of our people is of top priority."
    scandinavia_denmark_claimed:0 "We have secured the Danish heartlands."
    je_scandinavia_missing_crown_b_completion_context:0 "If Denmark is our [concept_subject], we will immediately integrate their lands alongside their people."
    je_scandinavia_missing_crown_c:0 "The Norwegian Crown"
    je_scandinavia_missing_crown_c_reason:0 "While we are a unified nation, the Scandinavian people are entitled to unify wholly and completely. Securing Norway to ensure the future prosperity and security of our people is of top priority."
    je_scandinavia_missing_crown_c_completion_context:0 "If Norway is our [concept_subject], we will immediately integrate their lands alongside their people."
    je_scandinavia_missing_crown_d:0 "The Swedish Crown"
    je_scandinavia_missing_crown_d_reason:0 "Though the union was forged without Sweden at its heart, the throne of the Svea cannot remain absent. The Swedish crown belongs within Scandinavia — its lands and its people must be drawn fully into our compact."
    je_scandinavia_missing_crown_d_completion_context:0 "If Sweden is our [concept_subject], we will immediately integrate their lands alongside their people."
    je_scandinavia_unification_context:0 "We will fully integrate the culture and lands of our subject sibling nations. If we lack a certain crown during the process, we will be able to reclaim them later."
    modifier_scandinavian_royal_military:0 "The Royal Army Marches On"
    modifier_scandinavian_academia:0 "Bright Present, Brighter Future"
    modifier_scandinavian_industrialists:0 "Coin to the Bankers"
    modifier_scandinavia_realized:0 "Scandinavia, Realized"
    modifier_sisu_a:0 "Sisu!"
    modifier_sisu_b:0 "Sisu!"
    modifier_avenging_great_northern_war:0 "Avenging The Great Northern War"
    scandinavia_baltic_claims_forfeit.t:0 "Forfeit Our Claims"
    scandinavia_baltic_claims_forfeit.d:0 "By foregoing out claims in the Baltic, we can dismiss internal dissidents wary of our country becoming more warlike."
    je_scandinavian_baltic_claims:0 "Asserting Baltic Claims"
    je_scandinavian_baltic_claims_reason:0 "Our people's past losses during the Great Northern War should be reclaimed. We are in an excellent position to strike back against the other world powers, and as such it should be natural to rectify our past mistakes. However, it may also be better to forgoe such strides against the world powers in favor of focusing on our internal affairs."
    scandinavia_baltic_claims_forfeited:0 "We forfeit our bid to secure the Baltic territories."
    scandinavia_baltic_claims_give_up:0 "We forgoe any further opportunities for territorial expansion in the Baltic region."
    scandinavia_baltic_claims_governates:0 "If the Baltic Governates are our [concept_subject], we will annex them."

    #USA Content
    je_mexican_cession_button:0 "Demand the Mexican Cession"
    je_mexican_cession_button_desc:0 "Issue an ultimatum to Mexico and back it with force. Should we prevail, the Southwest territories will be ours to settle."
    je_mexican_cession_no_war_tt:0 "We cannot demand the Mexican Cession while already at war with Mexico."
    je_mexican_cession_truce_tt:0 "We cannot demand the Mexican Cession while bound by a truce with Mexico."
    mexican_cession:0 "Mexican Cession"
    mexican_cession_desc:0 "Force Mexico to relinquish its northern territories."
    war_goal_mexican_cession_type_name:0 "Mexican Cession"
    war_goal_mexican_cession_type_desc:0 "Force [WAR_GOAL_DRAFT.GetTarget.GetName] to cede its northern territories."
    war_goal_mexican_cession:0 "The Mexican Cession"
    war_goal_mexican_cession_desc:0 "Forces [WAR_GOAL_DRAFT.GetTarget.GetName] to surrender its northern territories to [WAR_GOAL_DRAFT.GetHolder.GetName], triggering negotiations over the fate of the ceded lands."
    mexican_cession_enforced_tt:0 "The Mexican Cession is enforced — the fate of the ceded territories will now be decided."
    dp_mexican_cession:0 "Mexican Cession"
    manifest_destiny.4.t:0 "The Treaty of Guadalupe Hidalgo"
    manifest_destiny.4.desc:0 "Mexico lies defeated. The terms of the cession are ours to dictate. How far shall American ambition reach?"
    manifest_destiny.4.f:0 "Providence and powder have redrawn the map of North America."
    manifest_destiny.4.a:0 "The Rio Grande marks our southern boundary. These lands are payment enough"
    manifest_destiny.4.b:0 "The Californias are one — we shall not leave half the peninsula to Mexico."
    manifest_destiny.4.c:0 "The Rio Grande and Baja California shall secure our southern frontier."
    manifest_destiny.4.d:0 "All Northern Mexico shall pass into our hands."

    manifest_destiny.5.t:0 "The Occupation of Mexico"
    manifest_destiny.5.desc:0 "The treaty has been signed, and the cession secured. Yet American troops still stand on Mexican soil, and voices in Washington now ask whether peace should come at the border — or at the gates of Mexico City."
    manifest_destiny.5.f:0 "Victory has answered one question and raised another: where does destiny end?"

    manifest_destiny.5.a:0 "The treaty is signed. Let this be the end of it."
    manifest_destiny.5.b:0 "Mexico must be brought under American suzerainty."
    manifest_destiny.5.c:0 "There can be no lasting peace while Mexico remains apart."

    # Egypt Content
    je_oriental_crisis:0 "The Oriental Crisis"
    je_oriental_crisis_reason:0 "The ambitions of [SCOPE.sCountry('egypt_scope').GetName] have brought it into open conflict with [SCOPE.sCountry('ottoman_scope').GetName]. The Sublime Porte demands the restoration of its Syrian territories and the return of [SCOPE.sCountry('egypt_scope').GetName] to obedience; [SCOPE.sCountry('egypt_scope').GetName] must decide whether to accept a settlement imposed by the powers or risk war for its independence."
    ottoman_victory_tt:0 "[SCOPE.sCountry('egypt_scope').GetName] has accepted the Convention of London, restoring [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] control over Syria, Adana, Crete, and the Holy Cities."
    egyptian_victory_tt:0 "[SCOPE.sCountry('egypt_scope').GetName] has resisted the [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] settlement and secured its position against the Porte."

    dp_oriental_crisis:0 "Oriental Crisis"
    oriental_crisis_wargoal:0 "Oriental Crisis"
    oriental_crisis_wargoal_desc:0 "Enforce our demands and end the Oriental Crisis."
    war_goal_oriental_crisis_wargoal_type_name:0 "Oriental Crisis"
    war_goal_oriental_crisis_wargoal_type_desc:0 "Force [WAR_GOAL_DRAFT.GetTarget.GetName] to accept the terms of the Convention of London."
    war_goal_oriental_crisis_wargoal:0 "Oriental Crisis"
    war_goal_oriental_crisis_wargoal_desc:0 "[WAR_GOAL_DRAFT.GetHolder.GetName] defeats [WAR_GOAL_DRAFT.GetTarget.GetName] in #v $je_oriental_crisis$#!."
    oriental_crisis_wargoal_tt:0 "Egypt will surrender Syria, Lebanon, Adana, Crete, and its Arabian subjects to the Ottoman Empire."

    egyptian_crisis_events.3.t:0 "The Convention of London"
    egyptian_crisis_events.3.d:0 "The Great Powers have presented [ROOT.GetCountry.GetName] with the terms of a settlement. Syria, Lebanon, Adana, and Crete are to be restored to Ottoman rule, and Egypt's reach in Arabia is to be broken. Acceptance will preserve our rule in Egypt; refusal will mean war with the Porte."
    egyptian_crisis_events.3.f:0 ""The ink is already prepared. Only the signature remains, and with it the admission that the sword has carried us as far as it can.""
    egyptian_crisis_events.3.a:0 "Accept the Convention of London."
    egyptian_crisis_events.3.b:0 "Reject the settlement. We will fight."
    egyptian_crisis_events.5.t:0 "The Convention Enforced"
    egyptian_crisis_events.5.d:0 "[SCOPE.sCountry('egypt_scope').GetAdjective] defiance has been broken, and the terms of the Convention of London can now be imposed by force. Syria, Lebanon, Palestine, Transjordan, Aleppo, Adana, and Crete will return to [SCOPE.sCountry('ottoman_scope').GetAdjective] rule, while [SCOPE.sCountry('egypt_scope').GetName]'s authority in Arabia is curtailed."
    egyptian_crisis_events.5.f:0 ""The armies have spoken where diplomacy failed. The empire's writ returns to the provinces, carried not by signatures, but by bayonets.""
    egyptian_crisis_events.5.a:0 "Enforce the Convention of London."
    egyptian_crisis_events.5.b:0 "[SCOPE.sCountry('egypt_scope').GetName] must be made obedient."
    dyn_c_alawite_empire:0 "Alawite Empire"
    dyn_c_alawite_empire_adj:0 "Alawite"
    egyptian_modernization_modifier:0 "Egyptian Modernization"
    egyptian_modernization_modifier_desc:0 "Egypt has committed itself to state reform, military discipline, and the institutions needed to fully westernize."
    je_new_ottoman_dynasty:0 "A New Ottoman Dynasty"
    je_new_ottoman_dynasty_reason:0 "Victory over [SCOPE.sCountry('ottoman_scope').GetName] has opened a path once thought impossible. If the old dynasty can be swept aside and Constantinople secured, [SCOPE.sCountry('egypt_scope').GetName] may claim the imperial mantle for itself."
    egyptian_crisis_events.6.t:0 "[SCOPE.sCountry('egypt_scope').GetName] Ascendant"
    egyptian_crisis_events.6.d:0 "The [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] settlement has collapsed, and [SCOPE.sCountry('egypt_scope').GetName] stands free to choose the shape of its victory. Some call for reform and recognition, others for the annexation of [SCOPE.sCountry('ottoman_scope').GetName]'s Arab provinces, while the boldest voices whisper that Constantinople itself may soon answer to a new dynasty."
    egyptian_crisis_events.6.f:0 ""A throne can be inherited, conquered, or built. The old empire has shown its weakness; now [SCOPE.sCountry('egypt_scope').GetName] must decide whether to become a nation among nations, or the heir to something far greater.""
    egyptian_crisis_events.6.a:0 "Modernize [SCOPE.sCountry('egypt_scope').GetName]."
    egyptian_crisis_events.6.b:0 "Annex the Arab provinces."
    egyptian_crisis_events.6.c:0 "Usurp the [SCOPE.sCountry('ottoman_scope').GetAdjectiveNoFlag] dynasty."
    egyptian_crisis_events.7.t:0 "A New House of Osman"
    egyptian_crisis_events.7.d:0 "Constantinople has fallen, and the Ottoman state has passed into the hands of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]. The old dynasty is gone, but the empire endures beneath Egyptian rule, reborn as the #bold #yellow Alawite Empire#!#!."
    egyptian_crisis_events.7.f:0 ""The city did not kneel to a stranger, but to a successor. The dynasty has changed; the imperial claim remains.""
    egyptian_crisis_events.7.a:0 "The empire is reborn."
    ottoman_annexed_tt:0 "[SCOPE.sCountry('ottoman_scope').GetName] has been annexed into [ROOT.GetCountry.GetName]."



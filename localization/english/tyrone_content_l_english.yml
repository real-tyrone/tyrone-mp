    #Brazil
    dyn_c_united_kingdom_brz:1 "United Kingdom of Brazil and Portugal"
    brz_power_greater_por_tt:0 "The [concept_prestige], Army [concept_power_projection], and Navy [concept_power_projection] of [ROOT.GetCountry.GetName] is greater than or equal to those of [SCOPE.sCountry('portugal_scope').GetName]"
    reclaim_portugal_button:0 "Reclaim Portugal"
    reclaim_portugal_button_desc:0 "The severing of the dynastic bond between #bold Brazil#! and Portugal remains an unresolved injustice. Diplomatic efforts have failed to secure recognition of Brazil’s rightful primacy within the Bragança legacy. Only war can restore the ancient union and bring Portugal back into a shared imperial destiny under Brazilian leadership."
    je_portugal_brazil_reversal:0 "The Lost Metropole"
    je_portugal_brazil_reversal_reason:0 "[SCOPE.sCountry('portugal_scope').GetName]'s fall from imperial primacy was not fate, but failure — a hollowing of authority that severed the #v Bragança#! legacy and left [ROOT.GetCountry.GetName] to carry the crown’s true weight across the ocean. Lisbon may call itself the motherland, yet it was #v Brazil’s#! strength, wealth, and stability that preserved the dynasty when the old order faltered. So long as #v $POR$#! remains outside our rightful orbit, the Lusitanian world is divided and incomplete. If #v Brazil#! is to claim its destiny as the senior heir of this shared monarchy, it must confront the metropole’s defiance and restore the ancient union — not as a colony reclaimed, but as a kingdom returned."
    lusofonia.3.c:0 "Brazil stands as the heart of the Empire."
    modifier_portugal_brz_transoceanic_empire:0 "Pluricontinentalismo"
    brz_new_metropole:0 "The New Metropole"
    lusofonia.3.d_3:0 "[SCOPE.sCountry('portugal_scope').GetName] has been brought beneath the [ROOT.GetCountry.GetAdjective] crown. Through war and determination, the balance of empire has been reversed, and a transatlantic personal union restored under [ROOT.GetCountry.GetAdjective] leadership."
    decision_unify_with_brazil:0 "Restore the United Kingdom of Portugal and Brazil"
    decision_unify_with_brazil_desc:0 "With #v $BRZ$#! firmly under $POR_ADJ$ authority and its desire for liberty subdued, the time has come to restore the United Kingdom of #v $POR$#! and #v $BRZ$#!. By fully integrating #v $BRZ$#! into our realm, we may bind the empire together once more."



    #Portugal
    dyn_c_united_kingdom_por:1 "United Kingdom of Portugal and Brazil"
    has_reconquista_je_tt:0 "Has the #v $je_portuguese_reconquista$#! [concept_journal_entry]"
    brazil_infamy_decrease:0 "Less Infamy for Brazil"
    lusofonia.3.d_2:0 "[SCOPE.sCountry('brazil_scope').GetName] has been forced back beneath the [ROOT.GetCountry.GetAdjective] crown. Through war and determination, the loss of empire has been reversed and a personal union restored."
    invade_brazil_button:0 "Invade Brazil"
    invade_brazil_button_desc:0 "Diplomacy has failed to resolve the humiliation of #bold Brazil’s#! secession. Only force of arms can restore [ROOT.GetCountry.GetAdjective] authority and bring the lost colony back under the crown."
    je_portuguese_reconquista:0 "The Lost Colony"
    je_portuguese_reconquista_reason:0 "[SCOPE.sCountry('brazil_scope').GetName]’s secession was not the result of rightful self-determination, but of weakness and compromise forced upon the crown in an age of turmoil. Once the jewel of the [ROOT.GetCountry.GetAdjective] Empire, #bold Brazil#! was built by Lisbon’s blood, capital, and authority — and its continued independence stands as a living reminder of imperial decline. If #bold Portugal #!is to reclaim its place among the great powers, it must confront this humiliation directly and restore sovereignty over lands that were never meant to be lost."
    por_power_greater_or_equal_brz_tt:0 "The [concept_prestige], Army [concept_power_projection], and Navy [concept_power_projection] of [ROOT.GetCountry.GetName] is greater than or equal to those of [SCOPE.sCountry('brazil_scope').GetName]"
    ip4_coup.2.c:0 "Let us put a [GetIdeology('ideology_miguelist').GetName] claimant to the throne of [ROOT.GetCountry.GetName]!"
    lusofonia.4.t:0 "Abdication of Emperor Pedro"
    lusofonia.4.d:0 "Years of growing [ROOT.GetCountry.GetAdjective] influence in [SCOPE.sCountry('brazil_scope').GetName] have reshaped public sentiment on both sides of the Atlantic. Lusitanian identity, once subdued by separation, now surges openly in courts, salons, and streets alike. Faced with mounting pressure and a populace calling for reunion, Emperor Pedro has little choice but to abdicate, allowing [ROOT.GetCountry.GetName] and [SCOPE.sCountry('brazil_scope').GetName] to once more be bound together under a single crown."
    lusofonia.4.f:0 "The pamphlets came first, then the rallies, and finally the silence of the palace. As the crowds gathered beneath fluttering green and red banners, the old divide between colony and kingdom felt suddenly distant—washed away by a shared tongue, faith, and memory."
    lusofonia.4.a:0 "Let us bring a union between the Lusophone nations!"
    modifier_regeneracao:0 "Regeneração"
    regency.1.h:0 "We don't need a regency, let's keep Queen Maria as our monarch."
    je_portugal_and_brazil_abdicate_pedro_button:0 "Encourage Emperor Pedro to Abdicate"
    je_portugal_and_brazil_abdicate_pedro_button_desc:0 "Strong Portuguese influence over Brazil and the rise of Lusitanianism on both sides of the Atlantic have undermined Emperor Pedro’s position. As calls for unity grow louder, public pressure forces his abdication, clearing the path toward a personal union between Portugal and Brazil."
   
    #Spain
    one_true_culture:0 "One True Culture"
    je_regime_change_portugal_button:0 "Force Regime Change in Portugal"
    je_regime_change_portugal_button_desc:0 "#b $POR$#!'s current government stands in the way of Iberian stability and alignment. By exerting overwhelming political and military pressure, we can compel a change of regime and bring Lisbon’s governance into line with our interests."
    spa_power_greater_or_equal_tt:0 "The [concept_prestige], Army [concept_power_projection], and Navy [concept_power_projection] of [ROOT.GetCountry.GetName] is greater than or equal to those of #b $POR$#!"
    je_active_for_more_than_two_years_tt:0 "This [concept_journal_entry] has been active for more than #v 2 years#!"
    je_spread_iberianism_button:0 "Promote Iberianism"
    je_spread_iberianism_button_desc:0 "Encourage the spread of Iberianist thought within Portugal, fostering a shared national identity that transcends borders and prepares the ground for closer political unity."
    every_state_iberia_tt:0 "Every [GetCulture('spanish').GetName] [Concept('concept_homeland','$concept_homelands$')] in [GetGeographicRegion('geographic_region_iberia').GetName] will get the following modifier:"
    spain_guide.1.t:0 "Hispanoamerica vs. Reconquista"
    spain_guide.1.d:0 "With the loss of [ROOT.GetCountry.GetNameNoFlag]’s American dominions still a fresh wound upon the national conscience, the question of our relationship with the former colonies can no longer be ignored. Should [ROOT.GetCountry.GetNameNoFlag] reconcile with her former colonies, or seek to reclaim them by force?"
    spain_guide.1.f:0 "Some argue that the age of empire in the New World has passed, and that recognition, commerce, and diplomacy offer a path to renewed influence without bloodshed. Others insist that Spain’s authority was stolen during a moment of weakness, and that only a determined #bold $je_reconquista$#! can restore honor, prestige, and rightful rule across Hispanoamerica. The decision we make will determine whether Spain looks forward as a diplomatic power or backward as a revanchist empire."
    spain_guide.1.a:0 "In order to normalize relations with Hispanoamerica, we must stay as #bold Isabelline [ROOT.GetCountry.GetName]#!."
    spain_guide.1.b:0 "The #bold [SCOPE.sCountry('carlist_scope').GetAdjective]#! path of #bold Reconquista#! is more favorable."
    modifier_integrated_colony_overlord:0 "Colonies Financially Integrated"
    spain_elected_bureaucrats_tt:0 "having [GetLawType('law_elected_bureaucrats').GetName] [concept_law]"    
    spain_right_of_assembly_tt:0 "having [GetLawType('law_right_of_assembly').GetName] [concept_law]"  
    je_two_spains_coup_button:0 "Encourage a Military Intervention"
    je_two_spains_coup_button_desc:0 "Quietly lend support to sympathetic generals and admirals who believe decisive action is needed to resolve the crisis of the Two Spains. A carefully guided intervention may restore unity and secure the country's future."
    dyn_c_spanish_kingdom:0 "Kingdom of Spain"
    dyn_c_spanish_empire:0 "Spanish Empire"
    spa_claim_west_sahara_and_al_rif:0 "Claim Morocco and the Western Sahara"
    spa_claim_west_sahara_and_al_rif_desc:0 "With the Berlin Conference concluded, Spain can press its historic and strategic interests across Morocco and the Saharan coast."
    spa_establish_spanish_guinea:0 "Establish Spanish Guinea"
    spa_establish_spanish_guinea_desc:0 "With our African footholds secured and the Berlin Conference concluded, we can formalize control over our possessions on the Gulf of Guinea."



    #Austria
    austria_guide.1.t:0 "The Matter of Hungary"
    austria_guide.1.d:0 "As nationalism spreads across Europe, voices within [SCOPE.sCountry('hungary_scope').GetNameNoFlag] increasingly call for a distinct Magyar identity and greater autonomy, threatening the stability of the realm. [SCOPE.sCountry('hungary_scope').GetAdjectiveNoFlag] leaders flirt with nationalist rhetoric that could undermine imperial unity if allowed to grow unchecked. To preserve cohesion and prevent separatist momentum, [SCOPE.GetRootScope.GetCountry.GetNameNoFlag] must act swiftly to bring [SCOPE.sCountry('hungary_scope').GetNameNoFlag] fully and firmly within the [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFlag] fold before this rising sentiment turns into a bid for independence."
    austria_guide.1.f:0 "We must ensure the loyalty of the Hungarians, one way or another."
    austria_guide.1.a:0 "You must research #b #yellow $nationalism$#!#! and #b Establish the Dual Monarchy#! to unlock the #v $je_danubian_federation$#! [concept_journal_entry] and annex [SCOPE.sCountry('hungary_scope').GetName] peacefully."
    austria_guide.1.b:0 "Alternatively you can choose to preemptively strike the Hungarians and annex them militarily through the #v $je_matter_of_hungary$#! [concept_journal_entry]."
    austrian_neo_absolutism_law_absolutism:0 "You have enacted [GetLawType('law_autocracy').GetName]"
    austrian_neo_absolutism_law_secret_police:0 "You have enacted [GetLawType('law_secret_police').GetName]"
    matter_of_hungary_preempt_hungarians_button:0 "Crush Hungarian Ambitions" 
    matter_of_hungary_preempt_hungarians_button_desc:0 "Acting before unrest can once again ignite the plains of the Crown of St. Stephen, this measure empowers Vienna to tighten its grip over #bold $HUN$#!, imposing firm administrative oversight to forestall separatist ambitions before they take root.\n\n#bold This will lead to #n war#! with [SCOPE.sCountry('hungary_scope').GetName]!#!"
    matter_of_hungary_preempt_hungarians_button_tt:0 "[SCOPE.sCountry('hungary_scope').GetAdjectiveNoFlag] [concept_liberty_desire] is greater than #v 75#! and we have $relations_poor$ relations or worse with [SCOPE.sCountry('hungary_scope').GetName]."
    austria_events.6.t:0 "Kaiser Reasserts Authority over Hungary"
    austria_events.6.d:0 "From the marble halls of Vienna, the Kaiser’s command echoes across the empire, a reminder that the crown’s authority must be obeyed from the Alps to the plains of the Danube."
    austria_events.6.f:0 "The Kaiser has issued an unmistakable demand that the Hungarian estates and nobles submit fully to imperial authority, reaffirming Vienna's dominance over the kingdom and signaling that any challenge to the crown’s power will not be tolerated. The emperor’s will is clear: ultimate authority rests with the crown, and obedience is expected without question."
    austria_events.6.a:0 "Let us pacify the Magyar menace before it is too late."
    austrian_rank_five_or_above_tt:0 "Our power [concept_rank] must be within the top #v 5#!"
    retire_metternich_button:0 "Retire the Grand Chancellor"
    retire_metternich_button_desc:0 "Metternich’s era of cautious diplomacy has come to an end. By guiding the old statesman into honorable retirement, we can open the path for fresh leadership and a new vision for the Empire’s future."
    dyn_c_austrian_empire:0 "Empire of Austria"
    metternich_button_possible_1_tt:0 "[ROOT.GetCountry.GetNameNoFlag] has #bold no#! [concept_crown_land] or [concept_personal_union] [Concept('concept_subject','$concept_subjects$')]."
    metternich_button_possible_2_tt:0 "We must have completed at least #v 6#! of the items in #b Metternich's agenda#!."
    integrating_serbia:0 "Integrating Serbia"
    integrating_romania:0 "Integrating Romania"
    austria_integrate.1.t:0 "Integrating the Serbs"
    austria_integrate.1.d:0 "With Serb lands now firmly within the Empire and administered under [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFlag] law, the question is no longer one of conquest, but of consolidation. Local institutions must be brought into line with Vienna, provincial offices staffed and standardized, and the army’s presence made a symbol of unity rather than occupation. If handled carefully, incorporation can bind these territories to the Crown; if mishandled, it risks turning subject loyalty into lasting resentment."
    austria_integrate.1.f:0 "An empire is not held together by borders alone, but by the patient work of administration."
    austria_integrate.1.a:0 "Begin the work of integration."
    austria_integrate.2.t:0 "Integrating Wallachia and Moldavia"
    austria_integrate.2.d:0 "With Wallachia and Moldavia secured under [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFlag] authority, the Empire must now decide how these provinces will be governed in practice. The old boyars, local courts, and regional privileges can be bent toward imperial stability—or replaced outright by a uniform administration answerable to Vienna. If we move decisively, these lands may become dependable pillars on the Lower Danube; if we hesitate, they will remain provinces in name, but not in loyalty."
    austria_integrate.2.f:0 "On the Danube, power is proven not by conquest, but by permanence."
    austria_integrate.2.a:0 "Fold the principalities into the imperial order."
    dyn_c_dual_monarchy:0 "Austria-Hungary"
    dual_monarchy_ADJ:0 "Austro-Hungarian"
    matter_of_hungary_federate_hungarians_button_tt: "[SCOPE.sCountry('hungary_scope').GetAdjectiveNoFlag] [concept_liberty_desire] is less than #v 25#! or we have at least $relations_amicable$ relations with [SCOPE.sCountry('hungary_scope').GetName]."
    change_tag_to_KUK_dual_monarchy_tt: "[ROOT.GetCountry.GetName] will federate with [SCOPE.sCountry('hungary_scope').GetName] to form #v $dyn_c_dual_monarchy$#!"
    matter_of_hungary_federate_hungary_button:0 "Unify the Dual Monarchy"
    matter_of_hungary_federate_hungary_button_desc:0 "With the Dual Monarchy firmly established, a deeper union with #bold $HUN$#! now stands within reach. By formalizing shared institutions and aligning the crowns more closely than ever before, Vienna and Budapest may set aside old grievances and forge a single, integrated state.\n\n#bold This will consolidate the realms into a unified monarchy.#!"
    matter_of_hungary_three_crowns_button_tt:0 "All constituent crowns must have less than #v 25#! [concept_liberty_desire], or enjoy at least $relations_amicable$ relations with [ROOT.GetCountry.GetName]."
    matter_of_hungary_three_crowns_button:0 "Form the Triple Crown"
    matter_of_hungary_three_crowns_button_desc:0 "Building upon the foundations of the Dual Monarchy, a grander vision now emerges: a realm united under three crowns. By extending equal standing and institutional authority to a third partner within the union, the monarchy may transcend its historic duopoly and reshape itself into a broader, more balanced federation.\n\n#bold This will reorganize the state into a united triple monarchy.#!"
    dyn_c_triple_monarchy:0 "Austria-Hungary-Croatia"
    triple_monarchy_ADJ:0 "Austro-Hungaro-Croatian"
    change_tag_to_KUK_triple_monarchy_tt: "[ROOT.GetCountry.GetName] will federate with [SCOPE.sCountry('hungary_scope').GetName] and [SCOPE.sCountry('croatia_scope').GetName] to form #v $dyn_c_triple_monarchy$#!"
    integrating_hungary:0 "Reincorporating the Crownlands"
    matter_of_hungary_federate_hungary_decision:0 "Unify the Dual Monarchy"
    matter_of_hungary_federate_hungary_decision_desc:0 "With the Dual Monarchy firmly established, a deeper union with #bold $HUN$#! now stands within reach. By formalizing shared institutions and aligning the crowns more closely than ever before, Vienna and Budapest may set aside old grievances and forge a single, integrated state.\n\n#bold This will consolidate the realms into a unified monarchy.#!"
    matter_of_hungary_federate_three_crowns_decision:0 "Form the Triple Crown"
    matter_of_hungary_federate_three_crowns_decision_desc:0 "Building upon the foundations of the Dual Monarchy, a grander vision now emerges: a realm united under three crowns. By extending equal standing and institutional authority to a third partner within the union, the monarchy may transcend its historic duopoly and reshape itself into a broader, more balanced federation.\n\n#bold This will reorganize the state into a united triple monarchy.#!"
    dyn_c_danubian_federation:0 "Danubian Federation"
    finished_hungary_je_tt:0 "We have solved the question of the #v $je_matter_of_hungary$#!, either through reform or through might."
    hungary_doesnt_exist_tt:0 "[SCOPE.sCountry('hungary_scope').GetName] has been annexed into [ROOT.GetCountry.GetName]."
    aus_end_matter_of_hungary:0 "End the Hungarian Question"
    aus_end_matter_of_hungary_desc:0 "The Hungarian question has reached its conclusion, whether through the establishment of a unified imperial arrangement under a shared crown, or by the full incorporation of Hungarian lands into the Austrian state. In either outcome, the matter is settled and imperial authority stands secured."
    end_hungary_je_effect_tt:0 "#b #yellow This will complete the #v $je_matter_of_hungary$#! [concept_journal_entry].#!"
    hungarians_crushed_tt:0 "Has crushed the #v Hungarian Revolt#! "
    je_hungarian_revolution_aus:0 "The Hungarian Revolution"
    je_hungarian_revolution_aus_reason:0 "In the aftermath of our defeat in the Brothers' War, the fragile balance within the Empire has begun to fracture. [SCOPE.sCountry('hungary_scope').GetAdjectiveNoFlag] nationalists, emboldened by our weakened position, have risen in open defiance of imperial authority, seeking to cast off Vienna’s rule and restore their independence. If we are to preserve the integrity of the realm, this uprising must be decisively crushed and Hungarian lands firmly returned to our control. Failure to act swiftly risks not only the loss of [SCOPE.sCountry('hungary_scope').GetName], but the unraveling of the Empire itself."
    compromise_hungarians_tt:0 "Has reached a compromise with [SCOPE.sCountry('hungary_scope').GetName]"
    germany_rework.6.t:0 "The Hungarian Revolt Crushed"

    germany_rework.6.d:0 "Imperial forces have suppressed the Hungarian uprising and restored control over the rebellious lands. Vienna’s authority stands reaffirmed, though unrest may yet linger beneath the surface."

    germany_rework.6.f:0 "The Hungarian uprising, born of nationalist defiance and emboldened by our recent weakness, has been decisively crushed. Imperial forces have restored order and reasserted control across the crown lands, preserving the unity of the Empire. Yet the grievances of identity, autonomy, and resentment toward central rule remain unresolved, lingering beneath the surface despite our victory."
    germany_rework.6.a:0 "Restore Absolutist rule over the Empire."
    germany_rework.6.b:0 "Grant Autonomy to the Hungarians."
    modifier_austrian_royal_authority:0 "Proven Austrian Authority"

    austria_events.7.t:0 "The Question of German Leadership"

    austria_events.7.d:0 "The balance of power in Central Europe grows increasingly uncertain. [SCOPE.sCountry('prussia_scope').GetName] consolidates its influence among the German states, while our own empire stretches across many lands and peoples. Voices within Vienna now question whether our future lies in preserving this vast, diverse realm—or in turning inward, focusing on Germany itself."

    austria_events.7.f:0 "For centuries, the Habsburg crown has ruled not just over Germans, but over a patchwork of kingdoms, duchies, and peoples stretching far beyond the confines of the German world. Yet this diversity, once our greatest strength, now weighs heavily against the rising tide of nationalism. Prussia positions itself as the champion of German unity, rallying the smaller states under its banner while our attention remains divided across Hungary, Italy, and the Balkans. Some in the imperial court argue that the time has come to make a decisive choice: either maintain the empire in its traditional form, accepting a diminished role in German affairs, or abandon the outer reaches of our holdings and assert dominance within Germany itself. Such a course would reshape the monarchy entirely, sacrificing imperial breadth for national ambition—and risking the stability of all we have built."

    austria_events.7.a:0 "We must preserve the Empire as it stands."

    austria_events.7.b:0 "Turn inward—Germany must be ours."
    je_german_ambition_lobby:0 "Austria stands at a crossroads. We may preserve our sprawling empire, or cast aside distant holdings to pursue dominance within Germany itself. The question is whether we remain an empire of many peoples—or become the leader of a single nation."

    je_german_ambition:0 "German Ambition"
    modifier_german_ambition:0 "German Ambition"


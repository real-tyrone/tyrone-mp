    je_ostend_manifesto_fail_negotiations_tt:0 "Either the United States or Spain has broken off negotiations."
    je_ostend_manifesto_fail_war_tt:0 "The United States and Spain are at war. Diplomacy is no longer possible."
    je_ostend_manifesto_complete_tt:0 "A diplomatic resolution over Cuba has been reached."

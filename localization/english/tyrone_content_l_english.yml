    #Scandinavia
    je_denmark_scandinavia_1: "Dreams Of a Union"
    modifier_denmark_strained_diplomatic_channels: "Strained Diplomatic Channels"
    denmark_reestablish_diplomatic_channels.t: "Reestablish Diplomatic Channels"
    denmark_reestablish_diplomatic_channels.d: "Dispatch envoys to mend relations with Sweden."
    je_denmark_scandinavia_1_relations_swe_tt: "[concept_relations] with Sweden are at least Amicable"
    je_denmark_scandinavia_1_prestige_tt: "Denmark has more [concept_prestige] than Sweden"
    je_denmark_scandinavia_1_army_pp_tt: "Denmark has greater Army [concept_power_projection] than Sweden"
    je_denmark_scandinavia_1_reason: "The crowns of Scandinavia were once united under the Kalmar Union — a bond broken by ambition and war. Denmark has not forgotten. The path forward is uncertain: diplomacy may yet bring Sweden to the table as a willing partner, but should that door close, Denmark must be prepared to assert its claim by other means. The union will be reborn, one way or another."
    je_denmark_scandinavia_ruler: "The Reign of Frederik VI"
    je_denmark_scandinavia_ruler_reason: "King Frederik VI sits upon the throne of Denmark, the last of the absolute monarchs. His rule is one of rigid conservatism — a bulwark against the tide of liberalism sweeping Europe. His reign will eventually end, and with it, an era."
    modifier_denmark_scandinavia_ruler: "God, and The Just Cause"
    je_denmark_scandinavia_ruler_no_longer_ruler_tt: "Frederik von Oldenburg is no longer the [concept_ruler] of Denmark"
    denmark_content.1.t: "The Reign of Frederik VI"
    denmark_content.1.d: "King Frederik VI has ruled Denmark with an iron hand since 1808. Bloodied by the Napoleonic Wars and the loss of Norway, he remains a staunch defender of royal absolutism — resisting all demands for a constitution. How long his grip on the throne endures remains to be seen."
    denmark_content.1.f: "His motto — #italic God and the just cause#! — reflects a sovereign who sees his authority as divinely ordained. The king tolerates no talk of constitutions."
    denmark_content.1.a: "Long may he reign."
    denmark_enforce_union_army_pp_tt: "Denmark has equivalent or greater Army [concept_power_projection] than Sweden"
    denmark_no_military_intervention_tt: "We have not pursued military intervention against Sweden"
    denmark_enforce_union.t: "Assert the Union by Force"
    denmark_enforce_union.d: "Sweden has proven unwilling to treat with Denmark as an equal. The time for diplomacy may have passed."
    je_denmark_scandinavia_1_complete_header: "#title Diplomatic Reunification:#!\n"
    je_denmark_scandinavia_1_on_complete_header: "#title On Diplomatic Union:#!\n• Triggers the Event #v $denmark_content.3.t$#!\n#tooltippable;tooltip:je_denmark_scandinavia_1_on_complete_desc Possible Event Effects#!"
    je_denmark_scandinavia_1_on_complete_desc: "• Establishes a Personal Union over Sweden with Denmark as the senior partner.\n• Grants #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_pan_scandinavianism_partially_realized_hover_tt $modifier_pan_scandinavianism_partially_realized$#! permanently.\n• All Scandinavian homeland states that we or our [Concept('concept_subject', '$concept_subjects$')] control gain #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_nordic_genesis_hover_tt $modifier_nordic_genesis$#! permanently."
    modifier_pan_scandinavianism_partially_realized_hover_tt: "[GetStaticModifier('modifier_pan_scandinavianism_partially_realized').GetName|v]\n[GetStaticModifier('modifier_pan_scandinavianism_partially_realized').GetDesc]"
    je_denmark_scandinavia_1_fail_header: "#title Militaristic Enforcement:#!\n"
    je_denmark_scandinavia_1_on_fail_header: "#title On Military Enforcement:#!\n• Triggers the Event #v $denmark_content.3.t$#!\n#tooltippable;tooltip:je_denmark_scandinavia_1_on_fail_desc Possible Event Effects#!"
    je_denmark_scandinavia_1_on_fail_desc: "• Grants #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_scandinavian_revaunchism_hover_tt $modifier_scandinavian_revaunchism$#! permanently.\n• Grants #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_pan_scandinavianism_partially_realized_hover_tt $modifier_pan_scandinavianism_partially_realized$#! permanently."
    modifier_scandinavian_revaunchism_hover_tt: "[GetStaticModifier('modifier_scandinavian_revaunchism').GetName|v]\n[GetStaticModifier('modifier_scandinavian_revaunchism').GetDesc]"
    denmark_content.3.t: "Rebirth of The Kalmar Union"
    denmark_content.3.d_diplomatic: "The long shadow of the Kalmar Union has returned — not through the force of arms, but through the careful work of statesmen and dynasties. Denmark and Sweden stand on the threshold of a new compact, one that may yet draw the scattered crowns of Scandinavia back together."
    denmark_content.3.d_military: "The age of persuasion has given way to the age of cannon. Denmark has chosen to impose what could not be agreed upon, and the outcome of this gamble will shape the north for generations to come. The Kalmar Union may yet be reborn — but its foundations will be built on conquest."
    denmark_content.3.f: "History does not repeat itself, but it rhymes."
    denmark_content.3.a: "A new chapter begins."

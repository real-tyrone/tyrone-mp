    metternich_supported:0 "Will increase the effects of the #b #l Legacy of Metternich#!#! modifier greatly"

    abandoned_germany_tt:0 "#red #bold We will abandon our aims of#! #b #yellow German Leadership#!"

    je_german_ambition_reason:0 "Having turned inward, [SCOPE.sCountry('austria_scope').GetName] has committed fully to the #v German Question#!. The outer reaches of the Empire are no longer the priority; instead, all efforts are directed toward securing leadership over the German states. As #yellow Prussia#! tightens its grip, we must consolidate our influence, rally our allies, and prepare to challenge its claim to German unity."

    austria_events.8.t:0 "The South German Confederation"

    austria_events.8.d:0 "[SCOPE.sCountry('austria_country_scope').GetName] has secured the allegiance of [SCOPE.sCountry('baden_country_scope').GetName], [SCOPE.sCountry('bavaria_country_scope').GetName], and [SCOPE.sCountry('wurrtemburg_country_scope').GetName]. Together, they now stand united under our leadership, forming a South German Confederation aligned with Austrian interests."

    austria_events.8.f:0 "Through diplomacy and growing influence, [SCOPE.sCountry('austria_country_scope').GetName] has drawn the southern German states into a single political framework. [SCOPE.sCountry('baden_country_scope').GetName], [SCOPE.sCountry('bavaria_country_scope').GetName], and [SCOPE.sCountry('wurrtemburg_country_scope').GetName] now stand bound together, strengthening our position within Germany and laying the groundwork for a broader unification. Yet such a development will not go unanswered, and rivals will surely move to contest our claim."

    austria_events.8.a:0 "South Germany is united under our leadership."

    austria_events.9.t:0 "German Ambitions Ended"

    austria_events.9.d:0 "Our ambitions within Germany have come to an end. Whether through defeat or deliberate withdrawal, [SCOPE.sCountry('austria_scope').GetName] no longer stands as a contender for leadership of the German world. The focus of the monarchy must now shift away from German affairs and toward restoring order and authority within our own lands."

    austria_events.9.f:0 "The dream of a German crown has slipped from our grasp. Prussia—or fate itself—has forced Austria to abandon its aspirations of unifying the German states under Habsburg rule. The consequences are immediate: our prestige in Germany wanes, and our influence among the smaller states fades into irrelevance. Yet all is not lost. Beyond the German lands lies the true heart of the Empire—Hungary, Croatia, Galicia, and more—regions whose loyalty must be secured if the monarchy is to endure. If we cannot rule Germany, then we must ensure we firmly rule what remains. The future of Austria will not be decided in Frankfurt or Berlin, but in Vienna—and in the lands that still answer to it."

    germany_rework.9.a:0 "Then we shall restore what is ours."

    je_austrian_reclamation:0 "Danubian Reclamation"

    je_matter_of_hungary_german_ambition_fail_tt:0 "We have #bold failed#! the #bold $je_german_ambition$#! [concept_journal_entry]"

    reclaim_hungary_button:0 "Reclaim Hungary"
    reclaim_hungary_button_desc:0 "Reassert imperial authority over Hungary, restoring it as a crownland under direct Austrian control."

    reclaim_croatia_button:0 "Reclaim Croatia"
    reclaim_croatia_button_desc:0 "Bring Croatia back under firm imperial rule, ensuring its place within the structure of the Habsburg lands."

    reclaim_galicia_button:0 "Reclaim Galicia"
    reclaim_galicia_button_desc:0 "Reintegrate Galicia into the Empire, securing its administration as a loyal crownland."

    reclaim_transylvania_button:0 "Reclaim Transylvania"
    reclaim_transylvania_button_desc:0 "Restore Transylvania to direct imperial oversight, strengthening Austria’s hold over its eastern territories."

    revisit_matter_of_hungary_button:0 "Revisit the Matter of Hungary"
    revisit_matter_of_hungary_button_desc:0 "With Hungary once more under our authority, the question of its governance must be settled anew."

    finished_reclamation_tt:0  "We have reclaimed our former [concept_crown_land] [Concept('concept_subject','$concept_subjects$')]"

    je_austrian_reclamation_reason:0 "With [SCOPE.sCountry('austria_scope').GetAdjective] ambitions in Germany abandoned, the stability of the Empire must now take precedence. The crownlands that once formed the backbone of Habsburg authority have drifted from direct control, and their restoration is essential to preserving imperial unity. [SCOPE.sCountry('hungary_scope').GetNameNoFlag], [SCOPE.sCountry('croatia_scope').GetNameNoFlag], #yellow Galicia#!, and #yellow Transylvania#! must either be brought back into the fold or firmly secured, ensuring that the monarchy endures as a cohesive and governed whole."



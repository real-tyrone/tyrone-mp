    dei_gdp_initial:0 "Initial [concept_gdp] of the Dutch East Indies"
    dei_current_gdp:0 "Current [concept_gdp] of the Dutch East Indies"

    dei_gdp_bar_name:0 "GDP"
    dei_gdp_bar_desc:0 "Tracks the GDP growth of the Dutch East Indies towards its goal."

    dei_events.2.t:0 "A New Course for the Indies"
    dei_events.2.d:0 "The administration of the East Indies has begun a broad program of reform, seeking to replace old systems of extraction with a more modern, productive, and orderly colonial economy."
    dei_events.2.f:0 "For decades, the Indies have enriched the metropole through plantation quotas, forced deliveries, and the slow draining of local wealth. Yet the pressures of commerce, industry, and administration now demand more than simple extraction. If the colony is to remain profitable, stable, and defensible, it must be reshaped through law, investment, and policy."
    dei_events.2.a:0 "Begin the reform of the Indies."

    dei_events.3.t:0 "The Future of the East Indies"
    dei_events.3.d:0 "The future of [SCOPE.sCountry('dei_scope').GetName] can no longer be left to habit and improvisation. The colonial administration, the old mercantile interests, and the advocates of liberal reform all press their claims on how the Indies should be governed under [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] authority."
    dei_events.3.f:0 "The islands are rich, but wealth alone is not policy. If [SCOPE.sCountry('netherlands_scope').GetName] is to hold them, we must decide what kind of empire we mean to be."
    dei_events.3.a:0 "Maintain standard [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] colonial rule."
    dei_events.3.b:0 "Reform the VOC."
    dei_events.3.c:0 "Push for liberal colonial reform."

    dei_events.4.t:0 "A New Order in the Indies"
    dei_events.4.d:0 "The chosen path for the Indies has begun to bear fruit. [SCOPE.sCountry('netherlands_scope').GetName] must now decide how the reformed colonial order should be bound to the metropole, whether through autonomy, crown authority, company rule, direct administration, or full integration."
    dei_events.4.f:0 "A colony can be governed by decree, by contract, by crown, or by consent. What matters now is that the Indies remain useful, loyal, and secure."
    dei_events.4.a:0 "Preserve the current arrangement."
    dei_events.4.b:0 "Form a Personal Union with #b Indonesia#!."
    dei_events.4.c:0 "Enjoy the fruits of the VOC."
    dei_events.4.e:0 "Reward loyal colonial administration."
    dei_events.4.g:0 "Integrate the Indies directly."

    voc_east_indies_name: "Vereenigde Oostindische Compagnie" 

    je_path_of_east_indies:0 "The Future of the East Indies"
    je_path_of_east_indies_reason:0 "The East Indies stands at a crossroads. A tighter [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] colonial regime may secure plantation output and administrative control, a revived chartered company may bind the Indies to commerce and investment, while liberal reform could reshape the colony around abolition and modern governance. Whichever course we choose, the Indies must be made loyal, profitable, and stable before foreign pressure or local discontent can pull them from [SCOPE.sCountry('netherlands_scope').GetAdjectiveNoFlag] authority."
    event_effects_dei_events.4_tt:0 "• Triggers the Event #v $dei_events.4.t$#!\n• A successful East Indies settlement will grant rewards based on the chosen colonial path\n• The East Indies will lose #blue #bold 50#!#! [concept_liberty_desire]\n• [concept_loyalist] support will rise in both the metropole and the Indies"


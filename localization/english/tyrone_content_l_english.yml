    amendment_geheime_staatskonferenz_modernized:0 "Modernized Geheime Staatskonferenz"
    amendment_geheime_staatskonferenz_modernized_desc:0 "With Kaiser Ferdinand I deemed incapable of effective rule, the will of the late Kaiser Franz I has established a Secret State Conference to serve as a collective regent and de facto ruling cabinet until Archduke Franz Josef's age of majority.\n\nThe Staatskonferenz has been modernized, streamlining its administration and adapting its structure to the demands of a changing state, strengthening its capacity to govern efficiently in an era of reform and centralization."


    modernize_government_button_desc:0 "Dismantle outdated institutions and centralize authority, sweeping away archaic systems that hinder effective governance."

    appease_minorities_button:0 "Appease the Minorities"
    appease_minorities_button_desc:0 "Extend concessions to the Empire’s many cultures, easing unrest among subject peoples at the expense of German dominance."

    fix_administration_button:0 "Fix Administratative Issues"
    fix_administration_button_desc:0 "Address bureaucratic inefficiencies and restore order to an overstretched administrative apparatus."

    autocratic_reforms_button:0 "Enact Autocratic Reforms"
    autocratic_reforms_button_desc:0 "Strengthen the instruments of state control, reinforcing censorship, surveillance, and centralized authority."

    military_reforms_button:0 "Implement Military Reforms"
    military_reforms_button_desc:0 "Modernize the army through improved organization, equipment, and doctrine to ensure readiness for future conflicts."

    invite_south_germany_button:0 "Invite the South Germans"
    invite_south_germany_button_desc:0 "Draw the southern German states closer into our sphere, building influence through diplomacy and shared identity."

    support_metternich_button:0 "Support Metternich"
    support_metternich_button_desc:0 "Uphold the conservative order of Metternich, preserving stability through tradition and careful political control."

    propose_south_german_unification:0 "Propose South German Unification"
    propose_south_german_unification_desc:0 "Formally advance the unification of the South German states under our leadership."

    unify_germany_button:0 "Unify Germany"
    unify_germany_button_desc:0 "Assert our claim over all Germany, confronting rival powers and bringing the German lands under a single authority."

    abandon_germany_button:0 "Abandon German Ambitions"
    abandon_germany_button_desc:0 "Relinquish involvement in German affairs and refocus entirely on Danubian affairs."


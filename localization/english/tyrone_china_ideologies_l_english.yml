l_english:
  ideology_chi_landowners:0 "Confucian Landowners"
  ideology_chi_landowners_desc:0 "China's landed elite defend traditionalism, guild privileges, and imperial control of public debate. They resist economic and educational reforms that threaten the established order."
  ideology_chi_devout_traditionalist:0 "Confucian Traditionalists"
  ideology_chi_devout_traditionalist_desc:0 "China's devout defend the traditional Confucian education system and oppose merchant-led or state-led schooling."
  ideology_chi_devout_scholar:0 "Confucian Scholars"
  ideology_chi_devout_scholar_desc:0 "After China ends its isolation, the devout champion religious schools while resisting merchant-led education."
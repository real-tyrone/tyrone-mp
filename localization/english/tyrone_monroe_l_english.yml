 je_tyr_us_american_dream:0 "The American Dream"
 je_tyr_us_american_dream_reason:0 "Reports of American wages and land pass from newspapers into letters sent home. Abroad, friends of the republic describe a life beyond inherited obligations; its critics answer with accounts of hardship and promises broken after the crossing. For families weighing departure, these voices can make a distant [concept_country] seem either welcoming or forbidding.\n\n• Among European [Concept('concept_great_power', '$concept_great_powers$')] and [Concept('concept_major_power', '$concept_major_powers$')], each #g pro-American#! [concept_political_lobby] grants #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_dream_attraction_hover $tyr_dream_attraction$#!; each #r anti-American#! lobby imposes #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_dream_repulsion_hover $tyr_dream_repulsion$#!.\n• An eligible friendly country grants an extra #g +10%#! [concept_migration_pull] when we hold [concept_foreign_investment_rights] and own at least #v 10%#! of its [concept_gdp].\n• Monthly influence: #g +0.25#! / #r −0.25#! per Great Power; #g +0.10#! / #r −0.10#! per Major Power. Each [concept_mass_migration] initiative costs #v 25#! points."
 tyr_dream_attraction:0 "Friends of the American Dream"
 tyr_dream_repulsion:0 "Distrust of the American Dream"
 tyr_dream_attraction_hover:0 "[GetStaticModifier('tyr_dream_attraction').GetName|v]\n[GetStaticModifier('tyr_dream_attraction').GetDesc]"
 tyr_dream_repulsion_hover:0 "[GetStaticModifier('tyr_dream_repulsion').GetName|v]\n[GetStaticModifier('tyr_dream_repulsion').GetDesc]"
 tyr_dream_status_partner:0 "[GetGlobalVariable('tyr_dream_status_country').GetCountry.GetName] is our foremost friend abroad."
 tyr_dream_status_neutral:0 "The American promise has yet to find a leading friend abroad."
 tyr_dream_bar:0 "The American Promise"
 tyr_dream_bar_desc:0 "American Influence"
 tyr_dream_migration:0 "Carry the Promise Abroad"
 tyr_dream_migration_desc:0 "Our friends abroad can place the prospect of an American life before families considering the crossing. Let their voices reach the harbours and railway towns from which new journeys begin."
 tyr_dream.1.t:0 "A Passage to America"
 tyr_dream.1.d:0 "Associations abroad have offered to help families seeking a new life across the ocean. Their correspondents await word of where our efforts should be directed."
 tyr_dream.1.f:0 "A letter passed from one household to another until its folds began to tear. Beside the description of a house and a weekly wage, someone had written the price of passage."
 tyr_dream.1.option_1:0 "Let us welcome the people of [SCOPE.sCountry('tyr_dream_offer_1').GetNameNoFlag]."
 tyr_dream.1.option_2:0 "Let us welcome the people of [SCOPE.sCountry('tyr_dream_offer_2').GetNameNoFlag]."
 tyr_dream.1.option_3:0 "Let us welcome the people of [SCOPE.sCountry('tyr_dream_offer_3').GetNameNoFlag]."
 tyr_dream.1.option_4:0 "Let us welcome the people of [SCOPE.sCountry('tyr_dream_offer_4').GetNameNoFlag]."
 tyr_dream.1.option_5:0 "Let us welcome the people of [SCOPE.sCountry('tyr_dream_offer_5').GetNameNoFlag]."

 law_tyr_us_european_pluralism:0 "European Pluralism"
 law_tyr_us_european_pluralism_desc:0 "The republic accommodates the languages and customs of its European peoples within a common civic order, while preserving deep exclusions beyond that settlement."
 law_tyr_us_cosmopolitanism:0 "Cosmopolitanism"
 law_tyr_us_cosmopolitanism_desc:0 "Citizenship binds together peoples of different origins. Participation in the republic need not depend upon a shared European inheritance."

 EFFECTS_ON_ACCEPTANCE_law_tyr_us_european_pluralism:0 "#tooltippable #tooltip:$BREAKDOWN_TAG$ Pops with higher Acceptance enjoy increased birth rates, while those with the lowest status retain the penalties of Cultural Exclusion#!#!"

 EFFECTS_ON_ACCEPTANCE_law_tyr_us_cosmopolitanism:0 "#tooltippable #tooltip:$BREAKDOWN_TAG$ Pops face few penalties for low Acceptance, while those with higher Acceptance enjoy increased birth rates#!#!"


 tyr_dream_base_progress:0 "The American Promise"

 tyr_irish_great_famine:0 "The Great Irish Famine"
 tyr_irish_great_famine_desc:0 "Crop failure has devastated rural livelihoods. Hunger and destitution drive families to seek passage overseas."

 tyr_irish_migration.1.t:0 "The First Ships from Ireland"
 tyr_irish_migration.1.d:0 "Ships arriving in New York carry Irish families fleeing hunger and the collapse of their livelihoods. Those already settled along the waterfront are helping the newcomers find lodging and work."
 tyr_irish_migration.2.t:0 "Letters from Boston"
 tyr_irish_migration.2.d:0 "Letters from relatives in America have reached households struggling through the famine. Another passage brings Irish families to Massachusetts, following the addresses entrusted to them before departure."
 tyr_irish_migration.3.t:0 "Irish Families in Pennsylvania"
 tyr_irish_migration.3.d:0 "Irish families are arriving in Pennsylvania, where established communities and employers offer the prospect of shelter and wages. News of these settlements travels back across the Atlantic."
 tyr_irish_migration.4.t:0 "Across the Hudson"
 tyr_irish_migration.4.d:0 "The movement from Ireland continues. In New Jersey, newcomers join relatives and neighbours who made the crossing before them, carrying what remains of households scattered by hunger."
 tyr_irish_migration.5.t:0 "Westward from the Ports"
 tyr_irish_migration.5.d:0 "Some Irish families seek their future beyond the eastern ports. Ohio draws new arrivals towards its growing towns, where kinship and letters of introduction help them begin again."
 tyr_irish_migration.f:0 "The address was written twice: once on the letter folded inside a coat, and once on a scrap of paper kept dry through the crossing."
 tyr_irish_migration.a:0 "Let them find a home here."

 tyr_dream_requires_25_points_tt:0 "Has at least #v 25#! points of #v $tyr_dream_bar$#!."

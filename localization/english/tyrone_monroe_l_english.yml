 tyr_us_acw_slave_state_tt:0 "#bold Slave State#!\nSlavery is present in this [concept_state].\n#italic Red background · grey stripes#!"
 tyr_us_acw_free_state_tt:0 "#bold Free State#!\nSlavery is absent from this [concept_state].\n#italic Cyan background · dark stripes#!"
 tyr_us_slavery_backlash:0 "The Slaveholders' Defiance"
 tyr_us_slavery_backlash_desc:0 "Defenders of slavery have rallied against abolition, turning their political organization towards resistance to federal authority."
 tyr_us_slavery.1.t:0 "The Slaveholders' Defiance"
 tyr_us_slavery.1.d:0 "The abolition of slavery in [ROOT.GetCountry.GetName] has met with organized resistance. Pro-slavery leaders are rallying their supporters against the federal settlement, demanding the restoration of the institution."
 tyr_us_slavery.1.f:0 "The law had changed. In the halls where slaveholders had once counted their votes, speeches now questioned whether the Union could demand obedience at all."
 tyr_us_slavery.1.a:0 "The law must stand."


 tyr_monroe_us_withdraw:0 "Abandon the Monroe Doctrine"
 tyr_monroe_us_withdraw_desc:0 "Withdraw our guarantee and bring the Monroe Doctrine to an end."
 je_tyr_us_panama:0 "The Panama Canal"
 je_tyr_us_panama_reason:0 "A passage through Panama would bind our two ocean frontiers together and place the routes of world commerce within reach of our fleets."
 je_tyr_us_dollar_diplomacy:0 "Dollar Diplomacy"
 je_tyr_us_dollar_diplomacy_reason:0 "American capital can secure an influence that treaties alone cannot sustain. Investment across South America will bind the republics to our commercial order."
 tyr_us_dollar_mandates:0 "Dollar Diplomacy"
 tyr_us_dollar_customs:0 "The American Customs Union"


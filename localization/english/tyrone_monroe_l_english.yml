 tyr_us_interventionism_sources_tt:0 "#bold Interventionism#!\n\n#v +1 point, once each:#!\n• Lead a war against a [concept_great_power].\n• Own the entire Hawaiian [concept_state_region].\n• Have an army law other than National Militia.\n• Complete Manifest Destiny.\n• Complete Mexican Wars.\n• Complete the Ostend Manifesto.\n• Win the Spanish-American War.\n\n#v +1 point, separate 5-year cooldowns:#!\n• A Jingoist or Fascist head of state.\n• A South American country belongs to a [concept_power_bloc] led outside the Americas, including Britain.\n\n#v Presidential initiatives:#!\n• Jingoist or Market Liberal: #v +1#!.\n• Pacifist or Protectionist: #v −1#!.\n\nColonial entries grant #v no points#!."

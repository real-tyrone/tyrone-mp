l_english:
 je_tyr_monroe_doctrine:0 "The Monroe Doctrine"
 je_tyr_monroe_doctrine_reason:0 "Britain’s commercial interests give its fleet reason to defend the independence of the American republics until the United States can assume the burden.\n\n#bold The American Guarantee#!\nBritain upholds the doctrine until the United States reaches #v 5 interventionism points#!. Below this threshold, the guarantee returns to Britain unless it has permanently withdrawn.\n\n#bold Independence and Commerce#!\nEach [concept_state_region] in #v Central and South America#! grants the guarantor #g +1%#! [concept_trade_advantage] under protected control, or #r −2%#! under invading control. The final total is capped at #g +50%#! and can become negative.\n\nLocal control, including regional [concept_subject] countries, and the American and British spheres are protected. Independent countries in a foreign [concept_power_bloc] and territories under other foreign powers count as invaded. Brazil’s initial regions are protected; its subsequent expansion counts as invasion. Each region counts once, according to its largest owned portion.\n#red Brazil expanding will be counted as any other foreign power expanding in South America!#!\n\n$tyr_monroe_status_counts$"
 tyr_monroe_status_usa:0 "[SCOPE.sCountry('tyr_monroe_america').GetName] upholds the Monroe Doctrine."
 tyr_monroe_status_gbr:0 "[SCOPE.sCountry('tyr_monroe_britain').GetName] upholds the Monroe Doctrine."
 tyr_monroe_status_counts:0 "#g Protected regions#!: #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_monroe_protected_tt [GetGlobalVariable('tyr_monroe_protected_count').GetValue|0]#!\n\n#r Invaded regions#!: #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_monroe_invaded_tt [GetGlobalVariable('tyr_monroe_invaded_count').GetValue|0]#!\n\n[concept_trade_advantage]: #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_monroe_trade_tt [GetGlobalVariable('tyr_monroe_trade_points').GetValue|=+0]%#!"
 tyr_monroe_counts_tt:0 "• #v Central and South America#!; Caribbean excluded.\n\n• Each [concept_state_region] counts once, by its #v largest owned portion#!."
 tyr_monroe_trade_tt:0 "#bold Commercial Guarantee#!\n\n• Protected region: #g +1%#! [concept_trade_advantage].\n\n• Invaded region: #r −2%#! [concept_trade_advantage].\n\n• Final total capped at #g +50%#!; can fall #r below zero#!.\n\n• Granted to the #v current guarantor#!."
 tyr_monroe_map_protected:0 "Protected territory"
 tyr_monroe_map_invaded:0 "Territory under invading control"
 tyr_monroe_map_counted:0 "This is the largest portion and determines how the region counts."
 tyr_monroe_map_not_counted:0 "This portion does not determine how the region counts."
 tyr_monroe_withdraw:0 "Relinquish the American Guarantee"
 tyr_monroe_withdraw_desc:0 "Leave the defence of the American republics permanently to the United States."
 tyr_monroe_not_withdrawn:0 "Britain has not permanently relinquished the guarantee."
 tyr_monroe_withdraw_tt:0 "The United States permanently assumes the Monroe Doctrine, regardless of interventionism points. If no American successor survives, the doctrine ends."
 tyr_monroe_trade:0 "Guardian of American Independence"
 tyr_monroe_trade_desc:0 "Commercial influence follows the preservation of the American republics from foreign encroachment."
 tyr_monroe_withdrawal_penalty:0 "The American Guarantee Abandoned"
 tyr_monroe_withdrawal_penalty_desc:0 "The retreat from a longstanding overseas commitment has weakened the government’s standing and diplomatic influence."
 tyr_monroe_invalid:0 "No power remains willing and able to uphold the Monroe Doctrine."
 tyr_monroe_protected_tt:0 "#bold Protected Regions#!\n\n• #g +1%#! [concept_trade_advantage] per region.\n\n• Local control or the #v American / British sphere#!.\n\n• Includes Brazil’s initial territories and the initial rebel regions.\n\n$tyr_monroe_counts_tt$"
 tyr_monroe_invaded_tt:0 "#bold Invaded Regions#!\n\n• #r −2%#! [concept_trade_advantage] per region.\n\n• Control by foreign powers outside the American / British spheres.\n\n• Membership in a foreign [concept_power_bloc].\n\n• Brazilian expansion beyond its #v initial territories#!.\n\n$tyr_monroe_counts_tt$"
 tyr_monroe_activation_guarantor_tt:0 "The #v United States#! or #v Great Britain#! exists, including a surviving successor."
 tyr_monroe_activation_not_ended_tt:0 "The Monroe Doctrine has #v not permanently ended#!."
 tyr_monroe_invalid_no_guarantors_tt:0 "#r Neither#! the United States nor Great Britain has a surviving successor."
 tyr_monroe_invalid_withdrawal_tt:0 "Britain has #v permanently withdrawn#! and #r no American successor survives#!."
 tyr_monroe_lifecycle_hover:0 "#bold Activation#!\n\n• $tyr_monroe_activation_guarantor_tt$\n\n• $tyr_monroe_activation_not_ended_tt$\n\n#bold Permanent Invalidation#!\n\nThe doctrine ends if #v either#! condition applies:\n\n• $tyr_monroe_invalid_no_guarantors_tt$\n\n• $tyr_monroe_invalid_withdrawal_tt$\n\n#bold American Failure#!\n\n• Formation of #v UNSA#! ends the doctrine once the United States leads it, or from #v 1860#!.\n\n• Outside the American [concept_power_bloc]: #v full effects, 10 years#!.\n\n• Inside the American [concept_power_bloc]: #v half effects, 5 years#!.\n\n• Both modifiers #v decay to zero#!."

tyr_monroe_unsa_failure_header:0 "The Rise of South America \n"
 tyr_monroe_unsa_failure_condition_tt:0 "The #v United States of South America#! has formed."
 tyr_monroe_unsa_conclusion:0 "The unification of South America has established a continental power able to speak for itself. American leadership of the hemisphere has suffered a lasting setback."
 tyr_monroe_unsa_full_tt:0 "If UNSA is inside the [concept_power_bloc] led by the United States the debuffs and buffs are halved."
 tyr_monroe_unsa_half_tt:0 "If UNSA is inside the [concept_power_bloc] led by the United States the debuffs and buffs are halved."
 tyr_monroe_unsa_american_setback:0 "A Hemisphere Divided"
 tyr_monroe_unsa_american_setback_desc:0 "South American unification has challenged Washington’s claim to leadership of the hemisphere, unsettling investors and weakening confidence in the government."
 tyr_monroe_unsa_ascendant:0 "A Continental Republic"
 tyr_monroe_unsa_ascendant_desc:0 "Unification has opened a wider field for settlement and scholarship, lending the new republic fresh standing abroad."
 tyr_monroe_unsa_american_leadership_tt:0 "The #v United States#! or its successor leads the Monroe Doctrine."
 tyr_monroe_unsa_date_tt:0 "Game date >= 1860"


 je_tyr_us_foreign_policy:0 "America and the World"
 je_tyr_us_foreign_policy_reason:0 "Across the Atlantic, the powers of Europe bargain over distant shores and send their fleets to enforce the terms. In Washington, their quarrels have long been regarded as a danger best kept at sea. Yet American merchants seek new markets, settlers press westward, and each foreign flag raised in the hemisphere gives Congress another reason to look abroad.\n\n#italic Shall the republic remain secure behind its oceans, or carry its authority wherever its citizens and commerce may reach?#!\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_us_interventionism_sources_tt Interventionism#! grows as [ROOT.GetCountry.GetName] asserts its interests overseas. The course chosen here will shape the country’s ambitions beyond the continent."
 tyr_us_thresholds_tt:0 "Isolationism: #v 1–4#!\nInterventionism: #v 5–8#!\nAmerican Globalism: #v 9–10#!\nRegime reviewed #v monthly#!."
 tyr_us_gain_point_tt:0 "Gain #v 1#! interventionism point."
 tyr_us_lose_point_tt:0 "Lose #v 1#! interventionism point."
 tyr_us_bar_room_up_tt:0 "Interventionism is below #v 10#!."
 tyr_us_bar_room_down_tt:0 "Interventionism is above #v 1#!."
 je_tyr_us_manifest_destiny:0 "Manifest Destiny"
 je_tyr_us_manifest_destiny_reason:0 "The Pacific settlements, the Mexican border and the western frontier must be secured before the continental promise can be declared fulfilled."
 je_tyr_us_manifest_destiny_status:0 ""
 tyr_us_manifest_conclusion:0 "The continental republic stretches from the Atlantic to the Pacific."
 tyr_us_colonial_restraint:0 "A Continental Question"
 tyr_us_colonial_restraint_desc:0 "Expansion awaits a declaration of Manifest Destiny."
 tyr_us_cost_jingoist:0 "Assert American Power"
 tyr_us_cost_jingoist_desc:0 "The political consequences of a presidential foreign-policy initiative."

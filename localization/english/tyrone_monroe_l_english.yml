 tyr_us_open_japan:0 "Open the Japanese Market"
 tyr_us_open_japan_desc:0 "Dispatch an American mission to demand the opening of Japan to foreign commerce."
 tyr_us_japan_no_pending_tt:0 "No American demand to open this market is awaiting a response."
 tyr_us_open_japan_play:0 "The Opening of Japan"
 tyr_us_asian_markets.1.t:0 "An American Demand"
 tyr_us_asian_markets.1.d:0 "An envoy from [SCOPE.sCountry('tyr_us_asian_sender').GetName] demands that [ROOT.GetCountry.GetName] abandon its restrictions on foreign commerce. Refusal will bring an American attempt to force the opening of our market."
 tyr_us_asian_markets.1.f:0 "The envoy laid the proposed terms upon the table. Beyond the harbour, the visiting squadron lay at anchor, its guns silent beneath the flags."
 tyr_us_asian_markets.1.a:0 "Open our ports to foreign trade."
 tyr_us_asian_markets.1.b:0 "Our laws are not theirs to dictate."
 tyr_us_open_china:0 "Open the Chinese Market"
 tyr_us_open_china_desc:0 "Dispatch an American mission to demand the opening of China to foreign commerce."
 tyr_us_china_no_pending_tt:0 "No American demand to open this market is awaiting a response."
 tyr_us_open_china_play:0 "The Opening of China"
 tyr_us_asian_markets.2.t:0 "An American Demand"
 tyr_us_asian_markets.2.d:0 "An envoy from [SCOPE.sCountry('tyr_us_asian_sender').GetName] demands that [ROOT.GetCountry.GetName] abandon its restrictions on foreign commerce. Refusal will bring an American attempt to force the opening of our market."
 tyr_us_asian_markets.2.f:0 "The envoy laid the proposed terms upon the table. Beyond the harbour, the visiting squadron lay at anchor, its guns silent beneath the flags."
 tyr_us_asian_markets.2.a:0 "Open our ports to foreign trade."
 tyr_us_asian_markets.2.b:0 "Our laws are not theirs to dictate."
 je_tyr_us_asian_markets:0 "Open the Asian Markets"
 je_tyr_us_asian_markets_reason:0 "American merchants seek a passage into the markets of China and Japan. Their petitions now reach a government prepared to send its fleet in support of commerce. The two countries must abandon their restrictions on foreign trade, while American influence takes firm root in North China and Northeast Asia."
 je_tyr_us_asian_markets_status:0 "[JournalEntry.GetCountry.GetName] seeks the opening of China and Japan."
 tyr_us_asian_markets_conclusion:0 "The markets of China and Japan are open to foreign commerce, and American interests have secured a foothold in the region."
 tyr_us_asian_markets_opened:0 "Commerce Across the Pacific"
 tyr_us_asian_markets_opened_desc:0 "Access to the markets of East Asia has encouraged American investment and strengthened overseas trade."
 tyr_us_mexican_war_mobilization:0 "The Mexican Expedition"
 tyr_us_mexican_war_mobilization_desc:0 "Preparations for the Mexican campaign have temporarily redirected the army from home defence to operations abroad."
 tyr_us_american_successor_tt:0 "Is the #v United States#! or an American successor."
 tyr_us_manifest_oregon_complete_tt:0 "#v $je_oregon$#! has been completed."
 tyr_us_manifest_mexico_complete_tt:0 "#v $je_manifest_destiny_mexico$#! has been completed."
 tyr_us_manifest_frontier_complete_tt:0 "#v $je_manifest_destiny_frontier_wars$#! has been completed."
 tyr_us_manifest_destiny_settlement:0 "The Continental Promise"
 tyr_us_manifest_destiny_settlement_desc:0 "The settlement of the continental frontier has opened the western states to a new wave of immigration."
 tyr_us_manifest_settlement_hover:0 "[GetStaticModifier('tyr_us_manifest_destiny_settlement').GetName|v]\n[GetStaticModifier('tyr_us_manifest_destiny_settlement').GetDesc]"
 tyr_us_manifest_settlement_reward_tt:0 "Every owned [concept_state] in the #v Great Plains#! and #v Pacific Coast#! [Concept('concept_strategic_region', '$concept_strategic_regions$')] gains #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_us_manifest_settlement_hover The Continental Promise#! for #v 20 years#!, decaying over time."

 je_tyr_us_globalism_mexico:0 "The Southern State"
 je_tyr_us_globalism_mexico_reason:0 "The Mexican republic commands the southern approaches to the continent. Advocates of continental union demand its incorporation into the United States. The claims must be secured within five years."
 je_tyr_us_globalism_mexico_status:0 "Bring every Mexican state under direct American rule."
 tyr_us_globalism_mexico_claims_tt:0 "Gain [Concept('concept_claim', '$concept_claims$')] on every [concept_state_region] within the modern borders of Mexico; the historical Mexican Cession is excluded."
 tyr_us_globalism_mexico_claims_lost_tt:0 "Lose all [Concept('concept_claim', '$concept_claims$')] in Mexico."
 tyr_us_globalism_mexico_conclusion:0 "Mexico is under American rule. The government must now decide whether to encourage Yankee settlement at the cost of widespread Mexican opposition."
 tyr_us_globalism_mexico_timeout:0 "The five-year campaign has expired. The American claims in Mexico have been abandoned."
 tyr_us_globalism_annex_mexico:0 "Incorporate Mexico"
 tyr_us_globalism_annex_mexico_desc:0 "Annex Mexico if it is an American subject of puppet autonomy or lower. The operation costs 25 infamy and requires peace."
 tyr_us_globalism_mexico_annex_unused_tt:0 "This campaign’s annexation initiative has not been used."
 je_tyr_us_globalism_canada:0 "The Northern State"
 je_tyr_us_globalism_canada_reason:0 "The provinces of British North America stand between the republic and the Arctic. Washington now seeks their union under American authority. The claims must be secured within five years."
 je_tyr_us_globalism_canada_status:0 "Bring every Canadian state under direct American rule."
 tyr_us_globalism_canada_claims_tt:0 "Gain [Concept('concept_claim', '$concept_claims$')] on every [concept_state_region] within the modern borders of Canada, including Newfoundland, Labrador and the Arctic territories; Alaska is excluded."
 tyr_us_globalism_canada_claims_lost_tt:0 "Lose all [Concept('concept_claim', '$concept_claims$')] in Canada."
 tyr_us_globalism_canada_conclusion:0 "The Canadian provinces have been incorporated into the United States. A new programme of settlement draws migrants towards Ontario and Québec."
 tyr_us_globalism_canada_timeout:0 "The five-year campaign has expired. The American claims in Canada have been abandoned."
 tyr_us_globalism_annex_canada:0 "Incorporate the Canadian Subjects"
 tyr_us_globalism_annex_canada_desc:0 "Annex all American subjects of puppet autonomy or lower whose capitals lie in Canada. The entire operation costs 25 infamy and can be undertaken once, while at peace."
 tyr_us_globalism_canada_annex_unused_tt:0 "This campaign’s annexation initiative has not been used."
 tyr_us_globalism_claims_header:0 "Continental Claims"
 tyr_us_globalism.1.t:0 "The Settlement of Mexico"
 tyr_us_globalism.1.d:0 "The Mexican states have been brought under [ROOT.GetCountry.GetAdjective] rule. Promoters of Yankee settlement seek official recognition of these lands as a homeland, despite the opposition this would provoke among Mexican communities throughout the country."
 tyr_us_globalism.1.f:0 "The surveyor unfolded his map across the governor’s desk. Beyond the window, the town’s bells marked the hour as they had before the arrival of the new flag."
 tyr_us_globalism.1.a:0 "Open these lands to Yankee settlement."
 tyr_us_globalism.1.b:0 "Leave their homelands undisturbed."

 je_tyr_us_great_techante:0 "The Great Techante of America"
 je_tyr_us_great_techante_reason:0 "The continent’s resources now lie within reach of a single administration. Engineers and planners propose that its production be directed through a common system, extending the authority of the technocracy from Washington’s offices to the mines, factories and fields of the hemisphere."
 je_tyr_us_great_techante_status:0 "A continental order of production takes shape."
 tyr_us_technocracy_completed_tt:0 "The Technocracy Journal Entry has been completed successfully."
 tyr_us_techante_territories_tt:0 "Directly owns every [concept_state] in the #v Atlantic Coast, Great Plains, Pacific Coast, Central America#! and #v Gran Colombia#! strategic regions, without territorial exclusions."
 tyr_us_techante_conclusion:0 "The continental administration has secured the means to put its programme into practice. Its directors must decide whether to strengthen the existing institutions or establish a new economic mandate."
 tyr_us_technate_directorate:0 "The Continental Directorate"
 tyr_us_technate_directorate_desc:0 "A coordinated administration of research and public decrees has strengthened the technocracy’s capacity to govern."
 law_tyr_us_production_mandate:0 "The North American Production Mandate"
 law_tyr_us_production_mandate_desc:0 "A continental directorate coordinates production through public ownership and company remittances, while retaining a separate pool for private investment."
 tyr_us_technate.1.t:0 "The Continental Mandate"
 tyr_us_technate.1.d:0 "The technical administration of [ROOT.GetCountry.GetName] has brought the continent’s productive resources within its reach. The directors submit two proposals: reinforce the institutions already in place, or reorganize the economy under a permanent production mandate."
 tyr_us_technate.1.f:0 "The schedules covered an entire wall. Coal deliveries crossed the frontier in black ink; grain and timber followed in red. At the foot of the map, a clerk waited for the director’s signature."
 tyr_us_technate.1.a:0 "Give the directorate the means to carry on."
 tyr_us_technate.1.b:0 "Establish the North American Production Mandate."

 je_tyr_ca_contest:0 "The Central American Contest"
 je_tyr_ca_contest_reason:0 "The dissolution of the Central American federation has left a chain of small republics between the Atlantic and Pacific. Their harbours and narrow overland routes draw the attention of foreign merchants, naval officers and promoters of an interoceanic canal. British interests along the Caribbean coast meet an American ambition that reaches steadily southward.\n\nIn the capitals of the isthmus, a foreign concession may promise a railway or a profitable harbour. It may also bring a creditor whose demands are backed by warships. Local governments must bargain with powers that increasingly regard the region as a passage to be secured."
 tyr_ca_status_empty:0 "No power has the upper hand."
 tyr_ca_status_tied:0 "No power has the upper hand."
 tyr_ca_status_leader:0 "[GetGlobalVariable('tyr_ca_winner').GetCountry.GetName] has the upper hand."
 tyr_ca_end_header:0 "Will complete if: \n"
 tyr_ca_conclusion:0 "The contest has ended. The leading power settles the administration of its Central American interests."
 tyr_ca_preview:0 "#gold #b Settlement of 1870#!#!\nThe winning power chooses either:\n\n• #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_ca_investments_preview_hover $tyr_ca_investments$#! for #v 10 years#!.\n\n• Establish the #v Central American Administration#!:\n    Unite its direct and subject-held territories in the region.\n    Choose a #v colonial charter#! and either #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_ca_births_preview_hover $tyr_ca_births$#! or #tooltippable;tooltip:[GetPlayer.GetTooltipTag],tyr_ca_workforce_preview_hover $tyr_ca_workforce$#!.\n    Optionally entrust the colony to one of its [Concept('concept_company', '$concept_companies$')]."
 tyr_ca_map_owner_tt:0 "[SCOPE.sCountry('tyr_ca_map_owner').GetName] owns this territory."
 TCAA:0 "Central American Administration"
 TCAA_ADJ:0 "Central American"
 TCAA_DEF:0 "the Central American Administration"
 tyr_ca_leading:0 "Central American Primacy"
 tyr_ca_investments:0 "Central American Investments"
 tyr_ca_births:0 "A Settler Society"
 tyr_ca_workforce:0 "A Working Colony"
 tyr_ca.1.t:0 "The Central American Settlement"
 tyr_ca.1.d:0 "Our position in Central America has prevailed. We may consolidate private investment or unite the regional holdings under a single colonial administration."
 tyr_ca.1.f:0 "The harbour offices have received their instructions. Beyond the quays, plantation owners and local officials await the appointment of the new administration."
 tyr_ca.1.a:0 "Consolidate the investments."
 tyr_ca.1.b:0 "Establish the Central American Administration."
 tyr_ca.2.t:0 "The Colonial Population"
 tyr_ca.2.d:0 "The new administration must decide whether to encourage family settlement or expand participation in the workforce."
 tyr_ca.2.f:0 "The harbour offices have received their instructions. Beyond the quays, plantation owners and local officials await the appointment of the new administration."
 tyr_ca.2.a:0 "Encourage family settlement."
 tyr_ca.2.b:0 "Expand the workforce."
 tyr_ca.3.t:0 "The Colonial Administration"
 tyr_ca.3.d:0 "The administration may remain under state direction or be entrusted to one of our companies. The company itself will remain in the mother country."
 tyr_ca.3.f:0 "The harbour offices have received their instructions. Beyond the quays, plantation owners and local officials await the appointment of the new administration."
 tyr_ca.3.a:0 "Entrust the administration to a company."
 tyr_ca.3.b:0 "Retain state administration."
 tyr_ca_leading_desc:0 "The consequences of the settlement of Central America."
 tyr_ca_investments_desc:0 "The consequences of the settlement of Central America."
 tyr_ca_births_desc:0 "The consequences of the settlement of Central America."
 tyr_ca_workforce_desc:0 "The consequences of the settlement of Central America."


l_english:
 tyr_eic_grant_burma_territory: "Grant Territory to Burma"
 tyr_eic_grant_burma_territory_desc: "Cede the Company's holdings in Mandalay, Tenasserim, and Arakan to Burma. Under the ten-year settlement, Burma will increase its payments to the Company and expand production across its farms, plantations, and resource industries."
 tyr_burma_territorial_settlement: "Burma Territorial Settlement"
 tyr_burma_territorial_settlement_desc: "The Company's territorial concessions secured higher tribute while giving Burma room to expand its rural and resource industries."

l_english:
 tyr_chinese_warlord:0 "Warlord Administration"
 tyr_chinese_warlord_action_break_name:0 "End Warlord Administration"
 tyr_chinese_warlord_desc:0 "$subject_type_tyr_chinese_warlord_desc$"
 subject_type_tyr_chinese_warlord:0 "@protectorate! $subject_type_tyr_chinese_warlord_no_icon$"
 subject_type_tyr_chinese_warlord_desc:0 "A provincial military government acknowledges Chinese sovereignty while retaining its own army and administration. It remains in the Chinese market but pays no tribute, does not automatically join wars of its overlord, and cannot begin diplomatic plays of its own."
 je_tyr_china_reintegration:0 "Restoring the Central Government"
 je_tyr_china_reintegration_reason:0 "Provincial commanders acknowledge the central government, but govern their territories without its consent. China must recover their allegiance before imposing direct rule."
 tyr_chi_no_warlords_tt:0 "China has no remaining Warlord State subjects."
 tyr_chi_reintegrate_desc:0 "Require this warlord to submit to direct rule through an annexation diplomatic play. All reintegration buttons share a six-month cooldown. The attempt increases the weekly liberty desire of Chinese subjects by 1 for five years; further attempts renew this duration."
 tyr_chi_cooldown_tt:0 "Six months have passed since the last reintegration attempt."
 tyr_chi_initial_accommodation:0 "Provincial Accommodation"
 tyr_chi_reintegration_backlash:0 "Resistance to Central Rule"
 tyr_chi_reintegration_lock:0 "The Unfinished Reunification"
 tyr_chi_dynastic_opposition:0 "Defenders of the Dynasty"
 dp_tyr_chi_reintegration:0 "Impose Direct Rule"
 tyr_chi_fragment.t:0 "The Provinces Defy the Throne"
 tyr_chi_fragment.d:0 "Provincial commanders have ceased to obey the central government. They still acknowledge China, but retain their armies and revenues. The government must decide who can claim authority over the fractured country."
 tyr_chi_fragment.f:0 "Orders arrive from the capital. In the provinces, the commanders decide whether to read them aloud."
 tyr_chi_fragment.han:0 "Let a Han dynasty restore the throne."
 tyr_chi_fragment.manchu:0 "The dynasty must endure."
 tyr_chi_fragment.republic:0 "Proclaim the republic."
 tyr_chi_fragment.army:0 "Entrust the republic to the army."
 tyr_chi_republic_tt:0 "Have a Liberal or Radical movement with at least #v 10%#! support, or already have a non-monarchical government."
 tyr_chi_release_mch_tt:0 "Fengtian will become a Warlord State. China will retain direct rule over Yue."
 tyr_chi_release_yue_tt:0 "Yue will become a Warlord State. China will retain direct rule over Manchuria."
 tyr_chi_keep_both_tt:0 "China will retain direct rule over both Manchuria and Yue."
 tyr_chi_fragment_common_tt:0 "Peripheral commanders will become Warlord State subjects with #v 50%#! liberty desire and #g +50#! relations with China. For five years, Chinese subjects gain #g −0.5#! weekly liberty desire. The central government must then reintegrate them through the Journal Entry."
 tyr_chi_release_both_tt:0 "Both Fengtian and Yue will become Warlord States."
 tyr_chi_united.t:0 "The Provincial Settlement"
 tyr_chi_united.d:0 "No provincial warlord remains subject to the central government. The settlement has ended the contest over their administration, and China can once again pursue its interests abroad."
 tyr_chi_united.f:0 "The government can turn its attention beyond the provincial commands."
 tyr_chi_united.a:0 "The central government stands restored."
 tyr_chi_reintegrate_GNG:0 "Reintegrate $GNG$"

 subject_type_tyr_chinese_warlord_no_icon:0 "Warlord State"
 tyr_chinese_warlord_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a Warlord State under [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName].\n\n$subject_type_tyr_chinese_warlord_desc$"
 je_warlord_china_deplete:0 "• Losing the #BOLD Opium Wars#!\n• Failing to stop the appearance of the #BOLD Heavenly Kingdom#!\n• Failing to retake the #BOLD Heavenly Kingdom#!\n• Failing the #BOLD Boxer Rebellion#!\n• Going into debt and taking any [concept_loans]\n• Having a [concept_civil_war]\n• Becoming a [concept_subject] under another country\n• Abolishing the [GetLawType('law_monarchy').GetName]$warlord_china_coup_loc$\n• Being humiliated by #bold Japan#! (#r −1#! stability each time)"

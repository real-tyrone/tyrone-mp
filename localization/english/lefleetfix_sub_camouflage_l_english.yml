 lefleetfix_sub_camouflage_mk1_a:0 "#lefleetfix_level_1 (I) Camouflage#!"
 lefleetfix_sub_camouflage_mk1_a_desc:0 "Concealment fittings reduce visibility and incoming attack accuracy. This installation occupies a hardware slot that could otherwise carry weapons. Separate installations in the other hardware slots provide additional concealment."

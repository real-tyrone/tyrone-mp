l_english:
 je_tyrone_promise_british_patents:0 "Beyond British Patents"
 je_tyrone_promise_british_patents_reason:0 "The universities of #v [SCOPE.sCountry('tyrone_promise_india').GetName]#! are building a body of scholarship of their own. Their advocates seek an end to #v Reliance on British Patents#!, arguing that Indian research deserves support beyond the importation of foreign inventions.\n\nThe #v imperial government#! must decide whether to meet the cost of that settlement, and how freely knowledge should pass between its institutions and those of India."
 je_tyrone_promise_british_patents_status:0 ""
 tyrone_promise_british_patents_row:0 "Beyond British Patents"
 tyrone_patents_progress:0 "#v [SCOPE.sCountry('tyrone_promise_india').MakeScope.Var('tyrone_patents_months').GetValue|0]/24#! months: India has a State with #v 75 University levels#! using #v $pm_philosophy_department$#! and does not have #v $law_chartered_no_schools$#!."
 tyrone_patents_request_button:0 "Petition for a Patent Settlement"
 tyrone_patents_request_button_desc:0 "Indian scholars seek an imperial settlement of the restrictions governing their work."
 tyrone_patents_months_ready_tt:0 "Has accumulated #v 24 qualifying months#!."
 tyrone_patents_request_ready_tt:0 "No request is pending or has been submitted within the last #v two years#!."
 tyrone_patents_agreement_accepted_tt:0 "The overlord has funded the removal of #v Reliance on British Patents#!."
 tyrone_patents_end_reliance_tt:0 "Removes #v Reliance on British Patents#! from [SCOPE.sCountry('tyrone_promise_india').GetName]."
 tyrone_patents_overlord_funding:0 "Indian Patent Settlement"
 tyrone_patents_overlord_funding_desc:0 "The imperial treasury bears the cost of ending restrictions on Indian research."
 tyrone_patents_academic_exchange:0 "Imperial Academic Exchange"
 tyrone_patents_academic_exchange_desc:0 "An expanded settlement opens foreign research and technical correspondence to Indian scholars."
 tyrone_indian_patents.1.t:0 "A Claim to Scholarship"
 tyrone_indian_patents.1.d:0 "The government of #v [SCOPE.sCountry('tyrone_promise_india').GetName]#! has petitioned for an end to its reliance on British patents. Its universities have sustained their claim, but a settlement now requires funding from [ROOT.GetCountry.GetName]."
 tyrone_indian_patents.1.f:0 "The petition has acquired signatures well beyond the colleges that first drafted it. Its authors ask for access to work they have long been expected merely to receive."
 tyrone_indian_patents.1.a:0 "Meet the cost of the settlement."
 tyrone_indian_patents.1.b:0 "Fund a wider exchange of scholarship."
 tyrone_indian_patents.1.c:0 "The treasury will not bear this expense."

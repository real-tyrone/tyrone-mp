l_english:
 tyr_sj_japan_bar:0 "Japan's Hold on Korea, Taiwan and Manchuria"
 tyr_sj_china_bar:0 "China's Hold on Korea and Manchuria"
 tyr_sj_japan_bar_desc:0 "Maintain control and humiliation for #v 48 consecutive months#!."
 tyr_sj_china_bar_desc:0 "Maintain control and humiliation for #v 48 consecutive months#!."
 tyr_sj_japanese_victory:0 "Japanese Ascendancy \n"
 tyr_sj_japanese_victory_desc:0 "Japan secures its position in Northeast Asia. China suffers defeat."
 tyr_sj_chinese_victory:0 "Chinese Ascendancy \n"
 tyr_sj_chinese_victory_desc:0 "China secures Korea and Manchuria against Japanese expansion."
 tyr_sj_annex_korea:0 "Annex Korea"
 tyr_sj_annex_korea_desc:0 "Annex our Korean subject for #r 30 infamy#!. The states must still be incorporated."
 tyr_sj_integrate_korea:0 "Incorporate Korea"
 tyr_sj_integrate_korea_desc:0 "Immediately #g incorporate#! all Korean states. Adds #r 15%#! radicals among all Korean pops in our country. Can be used once."
 tyr_sj_integrate_manchuria:0 "Incorporate Manchuria"
 tyr_sj_integrate_manchuria_desc:0 "Immediately #g incorporate#! all Inner Manchurian states. Adds #r 15%#! radicals among all Manchu pops in our country. Can be used once."
 tyr_sj_japanese_claims:0 "Assert Japanese Claims in Manchuria"
 tyr_sj_russian_claims:0 "Assert Russian Claims in Manchuria"
 tyr_sj_japanese_claims_desc:0 "Gain [Concept('concept_claim', 'claims')] on inner Manchuria for #r 20 infamy#!. Removes Russian claims there. Requires an active humiliation of Russia and the latest victory over our rival."
 tyr_sj_russian_claims_desc:0 "Gain [Concept('concept_claim', 'claims')] on inner Manchuria for #r 20 infamy#!. Removes Japanese claims there. Requires an active humiliation of Japan and the latest victory over our rival."
 tyr_sj_port_arthur:0 "Secure Port Arthur"
 tyr_sj_port_arthur_desc:0 "Take Port Arthur from China as a [concept_treaty_port] for #r 25 infamy#!. Establishes a level #v 1#! port first if none exists."
 tyr_sj_japan_humiliation_tt:0 "Russia is humiliated by Japan."
 tyr_sj_russia_humiliation_tt:0 "Japan is humiliated by Russia."
 tyr_sj_latest_victory_tt:0 "Our country won the latest humiliation contest between Japan and Russia."
 tyr_sj_incorporating:0 "Imperial Incorporation"
 tyr_sj_japan_population_victory:0 "An Empire Across the Seas"
 tyr_sj_japan_military_victory:0 "Masters of the Northeast"
 tyr_sj_china_construction_victory:0 "The Empire Secured"
 tyr_sj_china_investment_victory:0 "Commerce under the Chinese Peace"
 tyr_sj_china_defeat:0 "Defeat in Northeast Asia"
 tyr_sj.1.t:0 "An Empire Across the Seas"
 tyr_sj.1.d:0 "Korea, Taiwan and Manchuria now answer to our government. Russia has yielded to our demands, and the court in China can no longer dislodge us. The cabinet must decide how to use this victory."
 tyr_sj.1.f:0 "Ships carry officials and settlers to the new possessions. At home, the ministries compete for the revenue that victory has promised them."
 tyr_sj.1.a:0 "Build a lasting home for our people."
 tyr_sj.1.b:0 "Maintain the strength that won the empire."
 tyr_sj.2.t:0 "The Northeastern Settlement"
 tyr_sj.2.d:0 "Japan has accepted our demands. Korea and Manchuria remain under our government, and the immediate danger to the northeastern provinces has passed. Funds can now be directed towards construction or private enterprise."
 tyr_sj.2.f:0 "The governors ask for roads and new offices. The merchants ask for credit. Both have waited for the guns to fall silent."
 tyr_sj.2.a:0 "Rebuild the provinces."
 tyr_sj.2.b:0 "Let commerce finance the recovery."
 humiliation_trigger_desc_global:0 "Has imposed a [concept_humiliation]"
 humiliation_trigger_false_desc_global:0 "Has #b not#! imposed a [concept_humiliation]"
 humiliation_trigger_desc_first:0 "[COUNTRY.GetNameNoFlag] has [Concept('concept_humiliation', 'humiliated')] [TARGET_COUNTRY.GetName]"
 humiliation_trigger_false_desc_first:0 "[COUNTRY.GetNameNoFlag] has #b not#! [Concept('concept_humiliation', 'humiliated')] [TARGET_COUNTRY.GetName]"
 humiliation_trigger_desc_third:0 "[COUNTRY.GetName] has [Concept('concept_humiliation', 'humiliated')] [TARGET_COUNTRY.GetName]"
 humiliation_trigger_false_desc_third:0 "[COUNTRY.GetName] has #b not#! [Concept('concept_humiliation', 'humiliated')] [TARGET_COUNTRY.GetName]"
 tyr_sj_choose_reward_tt:0 "Choose one of the following:"
 tyr_sj_alternative_reward_tt:0 "Or:"
